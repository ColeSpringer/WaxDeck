extends: ["spectral:oas"]
rules:
  # Style choices for this API, enforced at warn-as-fail severity in CI.
  operation-tags: error
  operation-operationId: error
  operation-description: error
  oas3-unused-component: error
overrides:
  # The WebSocket frame schemas ride the event channel (api/events.md), not a
  # REST path, so no path references them; they are still real contract DTOs
  # that both generated clients carry.
  - files:
      - "api/openapi.yaml#/components/schemas/WsSubscribeFrame"
      - "api/openapi.yaml#/components/schemas/WsEventFrame"
      - "api/openapi.yaml#/components/schemas/WsCommandFrame"
      - "api/openapi.yaml#/components/schemas/WsAckFrame"
      - "api/openapi.yaml#/components/schemas/WsErrorFrame"
      - "api/openapi.yaml#/components/schemas/WsRegisterEndpointFrame"
      - "api/openapi.yaml#/components/schemas/WsEndpointCommandFrame"
      - "api/openapi.yaml#/components/schemas/WsCommandResultFrame"
      - "api/openapi.yaml#/components/schemas/WsSessionReportFrame"
      - "api/openapi.yaml#/components/schemas/WsSessionFrame"
      - "api/openapi.yaml#/components/schemas/WsWatchFrame"
      - "api/openapi.yaml#/components/schemas/WsPingFrame"
      - "api/openapi.yaml#/components/schemas/WsPongFrame"
    rules:
      oas3-unused-component: "off"
