<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WaxDeck</title>
  <style>
    :root { color-scheme: dark light; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, sans-serif; background: #12100e; color: #f3ede4;
    }
    main { text-align: center; padding: 2rem; }
    h1 { font-size: 2.2rem; margin: 0 0 .4rem; letter-spacing: .04em; }
    p { color: #b9ae9d; margin: .3rem 0; }
    code { background: #241f1a; padding: .15em .45em; border-radius: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>WaxDeck</h1>
    <p>The server is running, but this build does not bundle the web UI.</p>
    <p>Build it with <code>make web build</code>, or point the server at a dev
       build with <code>--web-dir</code>.</p>
    <p><a href="/api/v1/health" style="color:#d9a648">API health</a></p>
  </main>
</body>
</html>
