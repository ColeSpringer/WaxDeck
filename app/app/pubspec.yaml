name: waxdeck
description: WaxDeck is a player, library manager, and metadata completer for music, podcasts, and audiobooks.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  # Riverpod is pinned exact: state-management idioms shift between minors and
  # this codebase tracks v3 idioms only. Note that 3.4 added a dependency on
  # `listen`, whose only release is 1.0.0-beta.4, so a prerelease sits in the
  # graph transitively. It is riverpod's own upstream choice and the lockfile
  # pins it exactly; the alternative is holding riverpod at 3.3.2 until `listen`
  # ships stable, which is not worth forgoing riverpod fixes for.
  flutter_riverpod: 3.4.2
  # Community plugins are pinned exact and only ever used behind WaxDeck-owned
  # ports (CredentialStorePort, UrlOpenerPort, DeepLinkPort, FilePickerPort).
  app_links: 7.2.1
  # Whether this device is on a connection worth spending, behind
  # ConnectivityPort. It reports the transport rather than the platform's
  # own metered flag, which is what the wifi-only settings ask about.
  connectivity_plus: 7.3.1
  crypto: 3.0.7
  # File pickers behind FilePickerPort; drag-and-drop behind AudioDropArea.
  desktop_drop: 0.7.1
  file_selector: 1.1.0
  # The native artwork cache, behind ArtworkStore. Promoted from a
  # transitive dependency (audio_service already ships it) to a direct
  # exact pin: it is load-bearing for every cover the app draws, and its
  # disk-cache and ETag behaviour is what the store is built on.
  flutter_cache_manager: 3.4.2
  flutter_secure_storage: 10.3.1
  # Both already resolve transitively through waxdeck_data; direct here
  # because the artwork store joins paths and finds the support
  # directory itself.
  path: 1.9.1
  path_provider: 2.1.6
  # Direct dependency for the font-warmup interceptor on the API
  # transport (waxdeck_api already rides this exact version).
  dio: 5.11.0
  # Routing. Published by flutter.dev and pure Dart, but pinned exact like
  # every other dependency: the route table is the app's navigation
  # contract and a minor bump has moved redirect semantics before.
  go_router: 17.3.0
  url_launcher: 6.3.2
  # Keeps the screen awake in car mode and the visualizer, behind
  # WakePort. A car screen that sleeps mid-drive is a dead feature, and
  # nothing portable answers this without a plugin.
  wakelock_plus: 1.7.0
  web: 1.1.1
  waxdeck_api:
    path: ../packages/waxdeck_api
  waxdeck_ui:
    path: ../packages/waxdeck_ui
  waxdeck_data:
    path: ../packages/waxdeck_data
  waxdeck_player:
    path: ../packages/waxdeck_player

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  msix: ^3.16.8
  waxdeck_player_testing:
    path: ../packages/waxdeck_player_testing

flutter:
  uses-material-design: true

# Unsigned MSIX for the CI packaging matrix (signing comes later).
msix_config:
  display_name: WaxDeck
  publisher_display_name: WaxDeck
  # Publisher DN. Required by msix when sign_msix is false; replace with the
  # signing certificate subject once signing lands.
  publisher: CN=WaxDeck
  identity_name: com.colespringer.waxdeck
  msix_version: 0.1.0.0
  capabilities: internetClient
  sign_msix: false
