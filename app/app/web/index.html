<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    Replaced by `--base-href` at build time. WaxDeck is served from the
    root of its own origin, so this is "/" in practice.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="WaxDeck: your music, podcasts, and audiobooks, on your own server.">
  <!-- Self-hosted and often LAN-only: nothing here may reach the network. -->
  <meta name="referrer" content="same-origin">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="WaxDeck">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>WaxDeck</title>
  <link rel="manifest" href="manifest.json">

  <!-- The browser chrome takes the canvas colour in both themes, so the
       address bar does not sit as a bright band above a dark app. -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FAF9F6">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16130F">

  <style>
    /* The instant paint. Flutter's first frame is a WasmGC download away,
       and until it lands the page is whatever the browser decided:
       white, then a sudden dark app. This skeleton paints the canvas
       colour and the mark immediately, and the engine's first frame
       removes it. Deliberately tiny, and no request of its own. */
    :root {
      color-scheme: light dark;
      --wax-canvas: #FAF9F6;
      --wax-text: #6C6555;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --wax-canvas: #16130F;
        --wax-text: #9A8E78;
      }
    }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: var(--wax-canvas);
    }
    #wax-boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background-color: var(--wax-canvas);
      color: var(--wax-text);
      font: 400 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      letter-spacing: 0.02em;
      transition: opacity 200ms ease-out;
      /* The skeleton is a picture, never a target: without this it would
         swallow taps for the length of its fade, right at the moment the
         app becomes usable. */
      pointer-events: none;
    }
    /* The mark itself, at the size it reads at. The image is inlined by
       tools/generate-brand.py, so the skeleton needs no request of its
       own and shows before anything is fetched. */
    .boot-emblem {
      width: 84px;
      height: 84px;
      border-radius: 18px;
      /* Breathing rather than sweeping: a progress hint that needs no
         percentage, and one the reduced-motion setting turns off. */
      animation: wax-breathe 2.4s ease-in-out infinite alternate;
    }
    @keyframes wax-breathe {
      from { opacity: 0.55; }
      to { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .boot-emblem { animation: none; opacity: 1; }
      #wax-boot { transition: none; }
    }
  </style>
</head>

  <script>
    // Hash-URL shim, kept through v1. WaxDeck served its locations as
    // fragments until the path-URL flip, so months of `/#/music/albums/al-x`
    // links live in bookmarks and share messages. A fragment never reaches
    // the server, so this is the only place that can see one: rewrite it
    // into the path before the engine boots and the router parses its
    // launch location, and the old link lands on the screen it names with
    // no flash of home and no second navigation.
    //
    // replaceState rather than a redirect: the entry the visitor arrived
    // on is the one being corrected, so there is nothing to go back to.
    (function () {
      // Only `#/...` was ever a location; a bare `#` or an anchor-shaped
      // fragment is somebody else's and is left alone.
      //
      // What comes back is resolved by the browser's own parser and
      // refused unless it lands on this origin, which is the only check
      // that cannot be out-spelled. `#//evil.example` is protocol-relative
      // and would navigate off-site; `#/\evil.example` is the same attack,
      // because the URL parser folds a backslash into a slash; a tab
      // inside the path is stripped before resolution and can rebuild
      // either. A self-hosted origin quietly bouncing its visitors
      // somewhere else is what all of that adds up to, and it is the same
      // rule the server applies to every redirect it is handed
      // (`safeRedirectPath`, `server/internal/api/oidc.go`). Navigating to
      // the parsed path rather than the raw string closes the loop: what
      // is checked is what is used.
      function pathFor(hash) {
        if (hash.slice(0, 2) !== '#/') return null;
        var url;
        try {
          url = new URL(hash.slice(1), window.location.origin);
        } catch (e) {
          return null;
        }
        if (url.origin !== window.location.origin) return null;
        return url.pathname + url.search;
      }
      // Carries a query that sat before the fragment
      // (`/?ref=x#/music/albums`) across the rewrite, so this is a change
      // of form and not of content. Skipped where the fragment brought
      // its own query, since merging two of them invites a collision for
      // a shape nothing mints; the fragment's is the one that was part of
      // the location.
      function withSearch(path) {
        var search = window.location.search;
        return search && path.indexOf('?') < 0 ? path + search : path;
      }
      // A hash pasted into an already-open tab is a same-document
      // navigation: no request, no reboot, and the engine ignores it under
      // the path strategy. Reload onto the rewritten path so the link
      // works from a running app too. The rewrite drops the fragment, so
      // the reloaded page finds none and this cannot loop.
      //
      // The fragment is read off the event and not off `location`: the
      // engine owns the URL under the path strategy and normalises a
      // fragment it did not put there straight back off, synchronously,
      // before this callback is reached - so by the time it runs
      // `location.hash` is already empty. `newURL` is the snapshot taken
      // when the event was made, which is the only copy left.
      //
      // No `withSearch` here, and the asymmetry is the point: a
      // same-document hash change is one where the path and the query did
      // not move, so whatever is in `location.search` belongs to the page
      // being left rather than to the link being followed. A pasted link
      // that does carry its own query differs in more than the fragment,
      // which makes it a page load and sends it through the cold-load
      // branch below.
      window.addEventListener('hashchange', function (event) {
        var url = (event && event.newURL) || window.location.href;
        var at = url.indexOf('#');
        var next = at < 0 ? null : pathFor(url.slice(at));
        if (next) window.location.replace(next);
      });

      // Registered before the cold-load rewrite runs, so that anything
      // unexpected thrown below leaves the in-tab half of the shim alive
      // rather than taking it down with the page load that hit it.
      var target = pathFor(window.location.hash);
      // Only from the root: a fragment sitting on a real path is not a
      // link this app ever minted, and rewriting it would throw the path
      // away. The root is also the only place WaxDeck is served from -
      // subpath hosting is unsupported by decision (docs/reverse-proxy.md)
      // and `<base href>` above says so - which is what lets everything
      // here treat a leading `/` as the whole story.
      if (target && window.location.pathname === '/') {
        window.history.replaceState(null, '', withSearch(target));
      }
    })();
  </script>

  <script>
    // Remove the skeleton when the engine has painted rather than on a
    // timer: a slow LAN should keep the mark on screen for exactly as
    // long as it actually takes.
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('wax-boot');
      if (!boot) return;
      boot.style.opacity = '0';
      window.setTimeout(function () { boot.remove(); }, 220);
    });

    // If the first frame never arrives (an engine that failed to start,
    // a truncated download), say so rather than sitting on "Starting"
    // forever. The skeleton stays put: removing it would reveal a blank
    // page, which tells the viewer even less.
    window.setTimeout(function () {
      var label = document.getElementById('wax-boot-label');
      if (label) {
        label.textContent =
          'Still starting. If this does not clear, reload the page.';
      }
    }, 20000);
  </script>
  <script>
    {{flutter_js}}
    {{flutter_build_config}}

    // The loader call is owned here rather than left to the generated
    // one-line bootstrap, because two defaults are wrong for WaxDeck:
    // the engine would load from Google's CDN (this page's header says
    // nothing here may reach the network, and the server embeds the
    // whole canvaskit directory), and multi-threaded skwasm corrupts
    // its shared heap under concurrent text layout and rasterization,
    // freezing the page at full CPU. Single-threaded until
    // flutter/flutter#190039 is fixed; e2e can flip threading back on
    // per run (WAXDECK_E2E_MT_SKWASM=1) to re-test a new engine, and
    // e2e/skwasm-repro answers the same question in seconds.
    _flutter.loader.load({
      serviceWorkerSettings: {
        serviceWorkerVersion: {{flutter_service_worker_version}},
      },
      config: {
        canvasKitBaseUrl: "canvaskit",
        forceSingleThreadedSkwasm: true,
        // The engine's last-resort font machinery (its Roboto default
        // and per-glyph Noto shards) downloads from fonts.gstatic.com
        // by default. Pointing it at this origin keeps an air-gapped
        // instance identical to an online one: the requests 404, the
        // engine degrades, and the owned chain in waxdeck_ui is what
        // actually renders. The path resolves under assets/ and is
        // deliberately unrouted.
        fontFallbackBaseUrl: "wax-font-fallback/",
      },
    });
  </script>
