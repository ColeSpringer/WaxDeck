# gen-l10n's inputs and outputs. `flutter pub get` and `make generate`
# run it; the output is not committed, and a direct `flutter test`, `run`
# or `build` fails on a fresh clone until `flutter pub get` has run. The
# pubspec's `generate: true` is what lets the generator run - see the
# comment there.
# arb-dir holds the per-locale bundles tools/gen-l10n-bundle.dart merges
# from the l10n/ fragments; edits go in l10n/<feature>/<locale>.arb.
arb-dir: lib/src/l10n/arb
template-arb-file: app_en.arb
output-dir: lib/src/l10n/gen
output-localization-file: app_localizations.dart
output-class: AppLocalizations
# A missing delegate fails at the widget that asked, rather than handing
# every call site a null to guess about.
nullable-getter: false
required-resource-attributes: true
# No untranslated-messages-file: gen-l10n writes it without creating the
# parent directory, so a checkout that has not built yet fails here. A
# locale that fell behind is a failure in test/l10n_arb_test.dart anyway.
header: "// GENERATED by `make generate` from l10n/<feature>/*.arb. Do not edit."
