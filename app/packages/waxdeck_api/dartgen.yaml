      skipped: {default: []}
  EnrichmentCacheKind:
    fields:
      exempt: {default: false}
  EnrichmentCacheReport:
    fields:
      kinds: {default: []}
      exemptRows: {default: 0}
      exemptBytes: {default: 0}
  EnrichmentCoverage:
    fields:
      lyricsAsked: {default: 0}
  EnrichmentLastRun:
    fields:
      artistsEnriched: {default: 0}
      artistsMatched: {default: 0}
      releaseGroupsEnriched: {default: 0}
      releaseGroupsMatched: {default: 0}
      albumsSearched: {default: 0}
      albumsMatched: {default: 0}
      booksEnriched: {default: 0}
      booksMatched: {default: 0}
      lyricsEnriched: {default: 0}
      lyricsMatched: {default: 0}
      groupArtEnriched: {default: 0}
      groupArtMatched: {default: 0}
      artistArtEnriched: {default: 0}
      artistArtMatched: {default: 0}
      albumArtEnriched: {default: 0}
      albumArtMatched: {default: 0}
      trackFieldsEnriched: {default: 0}
      trackFieldsMatched: {default: 0}
      bookFieldsEnriched: {default: 0}
      bookFieldsMatched: {default: 0}
      albumFieldsEnriched: {default: 0}
      albumFieldsMatched: {default: 0}
      retried: {default: 0}
      deferred: {default: 0}
      artFetched: {default: 0}
      auxArtFetched: {default: 0}
      artReused: {default: 0}
      tagsWritten: {default: 0}
      tagsFailed: {default: 0}
      tagsUnrepresented: {default: 0}
      tagsSkipped: {default: 0}
      tagsReadOnly: {default: 0}
      stalled: {default: [], unknownAs: drop}
  EnrichmentProvider:
    fields:
      capabilities: {default: []}
  EnrichmentRunRequest:
    fields:
      forcePhases: {omitEmpty: true}
      phases: {omitEmpty: true}
  EnrichmentStatus:
    fields:
      providers: {default: []}
      configured: {default: true}
      musicbrainzConfigured: {default: false}
      phases: {default: [], unknownAs: drop}
  EntityCardList:
    as: EntityResolution
