# What the spec cannot say about the Dart client: model names, client
# defaults, wire conversions, the enums, and the shape of each operation's
# method. server/cmd/dartgen/hints.go documents every key.

models:
  AdminSettings:
    # The app reads none of these; drop the omit to start.
    omit: [enrichmentWriteTags]
    fields:
      sonicAnalysis: {default: true}
      # Absent is a server predating the field, which made no outbound
      # lookups at all - so off is what it was doing.
      radioExternalArt: {default: false}
      trashRetentionDays: {default: 0}
      # Absent is a server predating the field, whose prune ran on 30 days.
      taskRetentionDays: {default: 30}
  AdminSettingsChange:
    # The app sets none of these; drop the omit to start.
    omit: [enrichmentWriteTags]
  ArtRoleInfo:
    fields:
      locked: {default: false}
  BookDetail:
    fields:
      authors: {default: []}
      narrators: {default: []}
      chapters: {default: []}
      parts: {default: []}
  BookSeries:
    fields:
      bookCount: {default: 0}
      totalDurationMs: {default: 0}
  BookSeriesDetail:
    fields:
      bookCount: {default: 0}
      totalDurationMs: {default: 0}
      books: {default: []}
  BookSeriesPage:
    fields:
      series: {default: []}
  BootstrapStatus:
    fields:
      signupEnabled: {default: false}
  BulkEditResult:
    fields:
      skipped: {default: []}
  CatalogSyncPage:
    fields:
      entries: {default: []}
      more: {default: false}
  DeleteItemFilesRequest:
    fields:
      mode: {serverDefault: true}
  DeleteItemsRequest:
    fields:
      mode: {serverDefault: true}
  DeleteItemsResult:
    fields:
      entries: {default: []}
      trashed: {default: 0}
      deleted: {default: 0}
      failed: {default: 0}
      dirsPruned: {default: 0}
      reclaimedBytes: {default: 0}
  DeletePlanEntry:
    fields:
      itemSurvives: {default: false}
  DetachResult:
    fields:
      failures: {as: writeBackFailures}
  DownloadFile: {as: DownloadFileInfo}
  EnrichFieldProposal:
    fields:
      current: {default: ''}
  EnrichItemResult:
    fields:
      applied: {default: []}
      skipped: {default: []}
  EnrichPreview:
    fields:
