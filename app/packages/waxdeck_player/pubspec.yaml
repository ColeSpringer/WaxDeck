name: waxdeck_player
description: >
  WaxDeck-owned audio engine facade. App code depends on the AudioEnginePort
  interface here and never on community audio plugins directly, so plugin
  churn stays contained inside this package.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0

# Exact pins, no ranges: these are the community plugins this package exists
# to firewall. Bump them here deliberately, never implicitly.
dependencies:
  flutter:
    sdk: flutter
  just_audio: 0.10.6
  just_audio_media_kit: 2.1.0
  media_kit_libs_linux: 1.2.1
  media_kit_libs_windows_audio: 1.0.9

# The FakeEngine and the conformance suite live in waxdeck_player_testing,
# keeping test doubles and flutter_test out of this package's release
# surface. This package's own coverage runs there too.
dev_dependencies:
  flutter_lints: ^6.0.0
