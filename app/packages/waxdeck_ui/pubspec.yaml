name: waxdeck_ui
description: "WaxDeck design system: tokens, themes, and the components every client screen composes."
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

# This package depends on Flutter and the SDK's own localization packages
# and nothing else: it never imports waxdeck_api, so components take plain
# view-data structs and the app maps API models at call sites. That keeps
# golden tests free of the API fakes and keeps the design system out of
# invalidation traffic.
#
# intl is the one deliberate exception to "Flutter only". The components
# carry ~80 strings of their own - mostly accessibility labels nobody can
# pass in - so the package owns a WaxLocalizations delegate the way
# Material owns MaterialLocalizations, and gen-l10n's output imports intl.
# It is a first-party Dart team package, pinned exact to the same version
# app/app takes; the rule's targets (waxdeck_api, community plugins) stay
# excluded.
#
# The icon set is vendored rather than depended on: phosphor_flutter
# subclasses IconData, which Flutter 3.44 made a final class, so the
# package no longer compiles. WaxIcon wraps the two subset fonts instead
# (tools/fetch-icons.sh).
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: 0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  alchemist: 0.14.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # On for gen-l10n's sake, not the build's: it refuses to run without
  # this flag. `make generate` is what mints the localizations, and a
  # build that regenerates them writes the same bytes.
  generate: true

  # Variable fonts, declared once per family: the type tokens select
  # weights and widths through FontVariation, which reaches the axis
  # values (460, 520, 560, 620, Archivo's wdth) that fontWeight's
  # 100-step ladder cannot. Refreshed by tools/fetch-fonts.sh.
  fonts:
    - family: Archivo
      fonts:
        - asset: fonts/Archivo-Variable.ttf
    - family: Inter
      fonts:
        - asset: fonts/Inter-Variable.ttf
    - family: SplineSansMono
      fonts:
        - asset: fonts/SplineSansMono-Variable.ttf
    # The fallback scripts (the deferred set) are deliberately
    # not declared here: declared fonts load eagerly at web startup, so
    # they live in assets/fonts/ and WaxFonts loads each from WaxDeck's
    # own origin the first time text on screen needs its script.
    # Phosphor (MIT), subset to the glyphs WaxIcons names: regular is the
    # inactive weight, fill the active one. 27 KB for both, against the
    # 950 KB the upstream pair would cost.
    - family: PhosphorRegular
      fonts:
        - asset: fonts/PhosphorRegular-Subset.ttf
    - family: PhosphorFill
      fonts:
        - asset: fonts/PhosphorFill-Subset.ttf

  assets:
    - assets/brand/
    # Loaded at runtime by WaxFonts.ensureCjk(), not declared as a font:
    # see assets/fonts/README.md.
    - assets/fonts/
