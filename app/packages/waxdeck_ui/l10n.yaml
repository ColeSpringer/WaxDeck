# gen-l10n's inputs and outputs for the design system's own strings.
# `make generate` runs it; the output is committed and drift-checked, like
# the app's. The pubspec's `generate: true` is a precondition of the
# generator, not a second opinion about that - see the comment there.
arb-dir: lib/src/l10n/arb
template-arb-file: wax_en.arb
output-dir: lib/src/l10n/gen
output-localization-file: wax_localizations.dart
output-class: WaxLocalizations
# A missing delegate fails at the widget that asked, rather than handing
# every call site a null to guess about. WaxL10nX resolves English when a
# host installed no delegate at all, which is a different question.
nullable-getter: false
required-resource-attributes: true
# No untranslated-messages-file: gen-l10n writes it without creating the
# parent directory, so a checkout that has not built yet fails here. A
# locale that fell behind is a failure in app/app/test/l10n_arb_test.dart,
# which checks this bundle too.
header: "// GENERATED by `make generate` from lib/src/l10n/arb/*.arb. Do not edit."
