# WaxDeck stack. Settings: .env beside this file (see .env.example).
# Docs: docs/getting-started.md, docs/configuration.md.

name: waxdeck

services:
  waxdeck:
    image: ghcr.io/colespringer/waxdeck:${WAXDECK_TAG:-latest}
    user: "${WAXDECK_UID:-1000}:${WAXDECK_GID:-1000}"
    # Host network: cast discovery is multicast; the sidecars bind the
    # host's loopback. Docker Desktop, or no host network wanted: the
    # override in docs/getting-started.md.
    network_mode: host
    extra_hosts: ["waxflow:127.0.0.1", "waxseal:127.0.0.1"]
    env_file: [.env]
    environment:
      WAXDECK_DATA_DIR: /data
      WAXDECK_LIBRARY_ROOTS: music=/music,books=/audiobooks
      WAXDECK_AUDIOBOOK_ROOTS: books
      WAXDECK_MANAGED_ROOTS: ${WAXDECK_MANAGED_ROOTS-music,books}
      WAXDECK_PODCAST_DIR: /podcasts
      WAXDECK_PODCAST_ROOT_NAME: podcasts
      WAXDECK_FLOW_CONFIG: /waxflow/waxflow.json
      WAXDECK_FLOW_API_KEY: ${WAXDECK_INTERNAL_KEY:?set WAXDECK_INTERNAL_KEY in .env (openssl rand -hex 24)}
      WAXDECK_SEAL_API_KEY: ${WAXDECK_SEAL_KEY:-${WAXDECK_INTERNAL_KEY:-}}
    volumes:
      - waxdeck-data:/data
      - ${WAXDECK_MUSIC:-./music}:/music
      - ${WAXDECK_AUDIOBOOKS:-./audiobooks}:/audiobooks
      - waxdeck-podcasts:/podcasts
      - waxflow:/waxflow
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  # Streaming engine. Off: WAXDECK_ENGINE=0 and WAXDECK_FLOW_URL= in .env.
  waxflow:
    image: ghcr.io/colespringer/waxflow:${WAXFLOW_TAG:-latest}
    deploy:
      replicas: ${WAXDECK_ENGINE:-1}
    user: "${WAXDECK_UID:-1000}:${WAXDECK_GID:-1000}"
    network_mode: host
    environment:
      WAXFLOW_ADDR: 127.0.0.1:4418
      WAXFLOW_API_KEYS: ${WAXDECK_INTERNAL_KEY:?set WAXDECK_INTERNAL_KEY in .env (openssl rand -hex 24)}
      WAXFLOW_CONFIG: /waxflow/waxflow.json
      WAXFLOW_DATA_DIR: /waxflow/data
      WAXFLOW_CACHE_DIR: /waxflow/cache
    volumes:
      - waxflow:/waxflow
      - ${WAXDECK_MUSIC:-./music}:/music:ro
      - ${WAXDECK_AUDIOBOOKS:-./audiobooks}:/audiobooks:ro
      - waxdeck-podcasts:/podcasts:ro
    depends_on:
      waxdeck:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  # Full-quality YouTube (headless browser). Off: WAXDECK_SEAL=0 and
  # WAXDECK_SEAL_URL= in .env.
  waxseal:
    image: ghcr.io/colespringer/waxseal:latest
    deploy:
      replicas: ${WAXDECK_SEAL:-1}
    network_mode: host
    command: ["server", "--host", "127.0.0.1", "--tenant-keys", "${WAXDECK_SEAL_KEY:-${WAXDECK_INTERNAL_KEY:-}}"]
    shm_size: "1gb"
    stop_grace_period: 70s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  waxdeck-data:
  waxdeck-podcasts:
  waxflow:
