# WaxDeck server + streaming engine (docs/getting-started.md).
# Settings go in .env, which waxdeck reads wholesale - see
# docs/configuration.md; the environment blocks here only wire containers.

# 4420 is the only published port. Put TLS in front before exposing it
# beyond your LAN (docs/reverse-proxy.md).

name: waxdeck

services:
  waxdeck:
    image: ghcr.io/colespringer/waxdeck:${WAXDECK_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    # The host user, so the bind-mounted library stays writable.
    user: "${WAXDECK_UID:-10001}:${WAXDECK_GID:-10001}"
    ports:
      - "4420:4420"
    env_file: [.env]
    environment:
      WAXDECK_ADDR: 0.0.0.0:4420
      WAXDECK_DATA_DIR: /data
      WAXDECK_LIBRARY_ROOTS: lib=/library
      WAXDECK_FLOW_CONFIG: /waxflow-config/waxflow.json
      WAXDECK_FLOW_URL: http://waxflow:4418
      WAXDECK_PODCAST_DIR: /podcasts
      WAXDECK_PODCAST_ROOT_NAME: podcasts
      # `-` not `:-`: an empty value means scan-only and must survive.
      WAXDECK_MANAGED_ROOTS: ${WAXDECK_MANAGED_ROOTS-lib}
      WAXDECK_FLOW_API_KEY: ${WAXDECK_FLOW_API_KEY:?set WAXDECK_FLOW_API_KEY in deploy/.env (must match a key in WAXFLOW_API_KEYS)}
    volumes:
      - waxdeck-data:/data
      - ${WAXDECK_LIBRARY:-./library}:/library
      - waxdeck-podcasts:/podcasts
      # A directory rather than the file: WaxDeck swaps the config by
      # atomic rename, which a single-file bind mount cannot follow.
      - ./waxflow-config:/waxflow-config
    networks: [internal]
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  waxflow:
    image: ghcr.io/colespringer/waxdeck-waxflow:${WAXDECK_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.waxflow
    # Must match waxdeck's user: the two share the catalog volume.
    user: "${WAXDECK_UID:-10001}:${WAXDECK_GID:-10001}"
    environment:
      WAXFLOW_ADDR: 0.0.0.0:4418
      WAXFLOW_API_KEYS: ${WAXFLOW_API_KEYS:?set WAXFLOW_API_KEYS in deploy/.env (openssl rand -hex 24)}
      WAXFLOW_CONFIG: /waxflow-config/waxflow.json
      WAXFLOW_CATALOG_DB: /catalog/waxbin.db
    volumes:
      - ./waxflow-config:/waxflow-config:ro
      - ${WAXDECK_LIBRARY:-./library}:/library:ro
      - waxdeck-podcasts:/podcasts:ro
      # Read use, writable mount: SQLite WAL readers touch the -wal and
      # -shm files beside the database.
      - waxdeck-data:/catalog
      - waxflow-data:/data
      - waxflow-cache:/cache
    networks: [internal]
    # Start order, not readiness: on a first run, waxdeck's image seeds
    # the shared data volume with permissions this image cannot.
    depends_on: [waxdeck]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Optional. Full-quality YouTube: docker compose --profile youtube up -d
  waxseal:
    image: ghcr.io/colespringer/waxseal:latest
    profiles: [youtube]
    # Flags, not environment: WaxSeal's knobs are --host, --port and
    # --tenant-keys, and it has never read an environment variable for
    # any of them. An empty key list leaves a keyless daemon that warns,
    # which is the right failure: the `label=key` form refuses to start
    # on an empty key, and a profile that will not boot is worse than
    # one that boots open on an internal network.
    #
    # The daemon's only tenant is WaxDeck, so its key is WaxDeck's own
    # rather than a second variable beside it. Two would be one setting
    # with two places to get it wrong, and getting it wrong keys the
    # daemon against a key nobody sends - refusing every mint and its
    # own health check, with nothing naming the cause.
    command:
      [
        "server",
        "--host",
        "0.0.0.0",
        "--tenant-keys",
        "${WAXDECK_SEAL_API_KEY:-}",
      ]
    # Headless Chromium needs the working space; the default 64 MB
    # crashes it under load. Matches WaxSeal's own compose.
    shm_size: "1gb"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # The image's own check pings /ping without a key, which a keyed
    # daemon answers 401. Same probe, carrying the key WaxDeck itself
    # authenticates with, so a green container means the acquisition
    # path can actually mint.
    healthcheck:
      test:
        - CMD
        - waxseal
        - ping
        - --addr
        - 127.0.0.1:4416
        - --strict
        - --key
        - ${WAXDECK_SEAL_API_KEY:-}
      interval: 30s
      timeout: 110s
      start_period: 120s
      retries: 3
    # It drains in-flight mints for up to 60s on SIGTERM; a shorter
    # grace period would SIGKILL a browser mid-attestation.
    stop_grace_period: 70s
    networks: [internal]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Optional. Chromecast/DLNA discovery needs multicast, which never
  # crosses the bridge network: docker compose --profile cast up -d
  # runs a second waxdeck on host networking that can discover devices.
  waxdeck-cast:
    image: ghcr.io/colespringer/waxdeck:${WAXDECK_TAG:-latest}
    profiles: [cast]
    network_mode: host
    env_file: [.env]
    environment:
      WAXDECK_ADDR: 0.0.0.0:4420
      WAXDECK_DATA_DIR: /data
      WAXDECK_LIBRARY_ROOTS: lib=/library
      WAXDECK_FLOW_URL: http://127.0.0.1:4418
      WAXDECK_PODCAST_DIR: /podcasts
      WAXDECK_PODCAST_ROOT_NAME: podcasts
      # `-` not `:-`: an empty value means scan-only and must survive.
      WAXDECK_MANAGED_ROOTS: ${WAXDECK_MANAGED_ROOTS-lib}
    volumes:
      - ${WAXDECK_LIBRARY:-./library}:/library
      - waxdeck-data:/data
      - waxdeck-podcasts:/podcasts
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Optional. External analysis worker, stateless:
  # docker compose --profile similarity up -d
  waxdeck-analyzer:
    image: ghcr.io/colespringer/waxdeck-analyzer:${WAXDECK_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.analyzer
    profiles: [similarity]
    env_file: [.env]
    environment:
      WAXDECK_ANALYZER_URL: http://waxdeck:4420
      WAXDECK_ANALYZER_TOKEN: ${WAXDECK_WORKER_TOKENS:-}
      WAXDECK_ANALYZER_LIBRARY: /library
    volumes:
      - ${WAXDECK_LIBRARY:-./library}:/library:ro
    depends_on: [waxdeck]
    networks: [internal]
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  internal:
    driver: bridge

volumes:
  waxdeck-data:
  waxdeck-podcasts:
  waxflow-data:
  waxflow-cache:
