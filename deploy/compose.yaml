# WaxDeck production stack (skeleton).
#
# Topology: waxdeck is the single published port (4420) of the whole stack;
# everything else lives on the private `internal` network. Copy .env.example
# to .env beside this file before `docker compose up`.
#
# Exposure note (mirrors WaxFlow ADR-0007): the containers listen on 0.0.0.0
# *inside* the network namespace. Put TLS in front (reverse proxy) before
# exposing port 4420 beyond your LAN.

name: waxdeck

services:
  waxdeck:
    image: ghcr.io/colespringer/waxdeck:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    # Run as the host user so the bind-mounted library (owned by whoever ran
    # `make up`) is writable for imports and organization. `make up` sets these
    # to the current user; they default to the image's built-in 10001 for a
    # bare `docker compose up` (point WAXDECK_LIBRARY at a 10001-writable dir, or
    # set WAXDECK_UID/WAXDECK_GID in .env, in that case).
    user: "${WAXDECK_UID:-10001}:${WAXDECK_GID:-10001}"
    ports:
      # The ONLY published port of the stack.
      - "4420:4420"
    environment:
      WAXDECK_ADDR: 0.0.0.0:4420
      WAXDECK_DATA_DIR: /data
      # Root names must match WAXFLOW_ROOTS below: streams address
      # sources as <name>/<relpath> against the sidecar.
      WAXDECK_LIBRARY_ROOTS: lib=/library
      # Roots (by name) the catalog may place files into, for uploads
      # and URL acquisitions. The compose library is WaxDeck-managed by
      # design (mounted read-write above), so it defaults to "lib"; set
      # empty to keep the library strictly scan-only.
      WAXDECK_MANAGED_ROOTS: ${WAXDECK_MANAGED_ROOTS:-lib}
      # WaxFlow is reached over the internal network only.
      WAXDECK_FLOW_URL: http://waxflow:4418
      # Must be one of the keys in WAXFLOW_API_KEYS below (see .env.example).
      WAXDECK_FLOW_API_KEY: ${WAXDECK_FLOW_API_KEY:?set WAXDECK_FLOW_API_KEY (must match a key in WAXFLOW_API_KEYS)}
      # Set to "true" whenever the deployed origin is HTTPS so session
      # cookies never ride cleartext.
      WAXDECK_COOKIE_SECURE: ${WAXDECK_COOKIE_SECURE:-false}
      # The externally reachable base URL, e.g. https://wax.example.com.
      # Required for single sign-on (the OIDC callback derives from it).
      WAXDECK_PUBLIC_BASE: ${WAXDECK_PUBLIC_BASE:-}
      # Optional OIDC single sign-on; leave the issuer empty to disable.
      # Local accounts always keep working.
      WAXDECK_OIDC_ISSUER: ${WAXDECK_OIDC_ISSUER:-}
      WAXDECK_OIDC_ID: ${WAXDECK_OIDC_ID:-sso}
      WAXDECK_OIDC_NAME: ${WAXDECK_OIDC_NAME:-}
      WAXDECK_OIDC_CLIENT_ID: ${WAXDECK_OIDC_CLIENT_ID:-}
      WAXDECK_OIDC_CLIENT_SECRET: ${WAXDECK_OIDC_CLIENT_SECRET:-}
      WAXDECK_OIDC_GROUPS_CLAIM: ${WAXDECK_OIDC_GROUPS_CLAIM:-}
      WAXDECK_OIDC_ADMIN_GROUP: ${WAXDECK_OIDC_ADMIN_GROUP:-}
      # Episode downloads live in their own directory (the catalog
      # refuses a podcast dir inside a library root); the sidecar
      # mounts the same volume read-only under the matching root name.
      WAXDECK_PODCAST_DIR: /podcasts
      WAXDECK_PODCAST_ROOT_NAME: podcasts
      WAXDECK_FEED_REFRESH_MINUTES: ${WAXDECK_FEED_REFRESH_MINUTES:-30}
      WAXDECK_PODCAST_RETENTION_DEFAULT: ${WAXDECK_PODCAST_RETENTION_DEFAULT:-0}
      # Set to "true" when your feeds live on the LAN (relaxes the
      # private-address guard on feed and enclosure fetches).
      WAXDECK_ALLOW_PRIVATE_FEED_HOSTS: ${WAXDECK_ALLOW_PRIVATE_FEED_HOSTS:-false}
      # YouTube acquisition bridge: download videos, playlists, and
      # channels, and subscribe to channels as podcasts. On by default
      # (set WAXDECK_YOUTUBE=false to disable). Pair with the youtube
      # profile's waxseal sidecar for the full-quality path.
      WAXDECK_YOUTUBE: ${WAXDECK_YOUTUBE:-true}
      # Embed the source thumbnail as cover art on acquired audio (until
      # enrichment finds official artwork). On by default.
      WAXDECK_YOUTUBE_THUMBNAIL: ${WAXDECK_YOUTUBE_THUMBNAIL:-true}
      WAXDECK_SEAL_URL: ${WAXDECK_SEAL_URL:-}
      WAXDECK_SEAL_API_KEY: ${WAXDECK_SEAL_API_KEY:-}
      WAXDECK_YOUTUBE_SPONSORBLOCK: ${WAXDECK_YOUTUBE_SPONSORBLOCK:-}
    volumes:
      # Holds waxbin.db + waxdeck.db (and their -wal/-shm sidecars).
      - waxdeck-data:/data
      # WaxDeck manages the library (imports, sidecars, organization): read-write.
      - ${WAXDECK_LIBRARY:-./library}:/library
      # Episode downloads: WaxDeck writes, WaxFlow streams.
      - waxdeck-podcasts:/podcasts
    networks: [internal]
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # read_only is intentionally NOT set yet: WaxDeck writes temp files during
    # import/transcode before the atomic rename into /data or /library.
    # Revisit once the write paths are pinned down.
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  waxflow:
    # WaxDeck's flavored WaxFlow build (stock CLI + a catalog resolver
    # for pid: sources). Env contract per WaxFlow's own compose files.
    image: ghcr.io/colespringer/waxdeck-waxflow:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile.waxflow
    # Same user as waxdeck: the two share the catalog volume (waxbin.db plus its
    # WAL sidecars, written by whichever opens it), so they must agree on UID.
    user: "${WAXDECK_UID:-10001}:${WAXDECK_GID:-10001}"
    # No `ports:`, internal network only; WaxDeck proxies anything clients need.
    environment:
      WAXFLOW_ADDR: 0.0.0.0:4418
      # WaxFlow fails closed: a non-loopback listen address requires API keys.
      WAXFLOW_API_KEYS: ${WAXFLOW_API_KEYS:?set WAXFLOW_API_KEYS (comma-separated; generate with openssl rand -hex 24)}
      WAXFLOW_ROOTS: lib=/library,podcasts=/podcasts
      # The catalog resolver behind pid: sources reads waxbin.db.
      WAXFLOW_CATALOG_DB: /catalog/waxbin.db
    volumes:
      # Same library as waxdeck, but WaxFlow only reads it.
      - ${WAXDECK_LIBRARY:-./library}:/library:ro
      # Episode downloads, read-only for streaming.
      - waxdeck-podcasts:/podcasts:ro
      # WaxDeck's data volume for pid resolution. The resolver opens the
      # catalog read-only, but the mount stays writable: SQLite WAL
      # readers need write access to the -shm/-wal sidecar files while
      # WaxDeck holds the database open in WAL mode. That write access
      # works because both images deliberately run as UID 10001; keep the
      # Dockerfiles' user IDs in lockstep or this mount breaks.
      - waxdeck-data:/catalog
      - waxflow-data:/data
      - waxflow-cache:/cache
    networks: [internal]
    # Hardening mirrored from WaxFlow's compose.base.yaml.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  waxseal:
    # YouTube PO-token attestation for the full-quality acquisition
    # path. Optional: the bridge works without it at reduced quality.
    # Enable with --profile youtube and set WAXDECK_YOUTUBE=true plus
    # WAXDECK_SEAL_URL=http://waxseal:4416 in .env.
    image: ghcr.io/colespringer/waxseal:latest
    profiles: [youtube]
    environment:
      WAXSEAL_ADDR: 0.0.0.0:4416
      WAXSEAL_API_KEYS: ${WAXSEAL_API_KEYS:-}
    networks: [internal]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Casting profile: Chromecast and DLNA discovery speak multicast
  # (mDNS and SSDP), which never crosses the default bridge network.
  # `docker compose --profile cast up` runs a second waxdeck on host
  # networking that CAN discover devices; the bridged instance stays
  # the default for installs that do not cast, and static devices work
  # everywhere through WAXDECK_CAST_DEVICES / WAXDECK_DLNA_DEVICES.
  # Alternatives (macvlan, an avahi reflector) are in the docs.
  waxdeck-cast:
    image: ghcr.io/colespringer/waxdeck
    profiles: ["cast"]
    network_mode: host
    environment:
      WAXDECK_ADDR: "0.0.0.0:4420"
      WAXDECK_LIBRARY_ROOTS: "lib=/library"
      WAXDECK_DATA_DIR: /data
      WAXDECK_FLOW_URL: "http://127.0.0.1:4418"
      WAXDECK_FLOW_API_KEY: ${WAXDECK_FLOW_API_KEY:-change-me}
      WAXDECK_PUBLIC_BASE: ${WAXDECK_PUBLIC_BASE:-}
      WAXDECK_ADVERTISE_BASE: ${WAXDECK_ADVERTISE_BASE:-}
    volumes:
      - ${WAXDECK_LIBRARY:-./library}:/library
      - waxdeck-data:/data
      - waxdeck-podcasts:/podcasts
    restart: unless-stopped

  # --- future profiles (documented topology; services come later) ---
  #
  # similarity (profile: similarity) - sonic-similarity analysis worker.
  #   Reads /library:ro, writes embeddings to its own named volume.
  #
  # jukebox: not a separate service; set WAXDECK_JUKEBOX=true on the
  #   waxdeck service and mount the sound device:
  #     devices: ["/dev/snd:/dev/snd"]
  #   The jukebox pipes engine WAV into aplay (WAXDECK_JUKEBOX_CMD
  #   overrides; PipeWire hosts use "pw-cat -p -").

networks:
  internal:
    driver: bridge

volumes:
  waxdeck-data:
  waxdeck-podcasts:
  waxflow-data:
  waxflow-cache:
