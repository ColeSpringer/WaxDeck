# The real-engine conformance suite on the desktop engine: both shipped
# desktops route just_audio through media_kit (mpv), so the linux run
# holds the one engine both use to the shared port contract - and mpv
# is where clip windows and gapless crossings are decided. It was held
# to that contract on no machine but a developer's until this job
# existed.
#
# Scheduled and on demand, never a merge gate, for the same reason the
# Android run was not one at first: the suite waits on real playback
# timing throughout, and a shared-CPU runner is exactly the shape that
# turns those waits into flakes. That posture is recorded here so the
# promotion question does not reopen as a deferral every time someone
# reads the trigger list.
#
# It also covers the full app journey - it boots the same cold stack
# the playwright suite uses - so a desktop regression in sign-in or
# playback surfaces here too.
#
# Each suite runs under its own budget inside run-desktop.sh, with the
# tool's verbose trace kept and a hung suite probed before teardown
# (native thread stacks of the app and the tool, the VM service's
# isolates, the display). The whole set is uploaded whatever happened,
# because a run that hits the job's cap is cancelled rather than
# failed, and a cancelled job skips its `if: failure()` steps.
name: Desktop engine conformance

on:
  schedule:
    - cron: "29 4 * * 4" # Thursdays, 04:29 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.1"
  GO_VERSION: "1.26.x"

jobs:
  linux:
    runs-on: ubuntu-latest
    # The backstop; a green run takes eight minutes, and the budgets
    # inside run-desktop.sh are what end a hang.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      # libmpv-dev is the engine itself, not a nicety: media_kit_libs_linux
      # bundles no libmpv at all (its CMake only fetches mimalloc), so
      # `MediaKit.ensureInitialized` dlopens the system one and the first
      # dispatched run died there - "Cannot find libmpv at the usual
      # places" - with the whole suite unable to start. The -dev package
      # is what pulls libmpv2 and lays down the unversioned symlink the
      # loader ladder ends on.
      #
      # gdb and x11-apps are for the hang probe (tools/ci/probe-linux.sh):
      # native thread stacks are the only view into mpv's threads, and
      # xwd is the screenshot of the virtual display.
      - name: Linux desktop toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev \
            libsecret-1-dev libx11-dev libxi-dev \
            xvfb pulseaudio libmpv-dev gdb x11-apps
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            server/go.sum
            fixtures/go.sum
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop
      - name: Pub get (workspace root)
        run: cd app && flutter pub get
      # Every position assertion in the suite waits in wall time on the
      # engine's clock, and that clock is an audio device draining. The
      # runner has no sound card, so this supplies one that discards what
      # it is given - which is what a silenced conformance run wants
      # anyway.
      - name: Null audio sink
        run: |
          set -euo pipefail
          pulseaudio --start --exit-idle-time=-1
          for _ in $(seq 1 30); do
            pactl info >/dev/null 2>&1 && break
            sleep 1
          done
          pactl load-module module-null-sink sink_name=waxnull
          pactl set-default-sink waxnull
          echo "PULSE_SINK=waxnull" >> "$GITHUB_ENV"
      # pipefail, or `tee` reports the status and a failing suite is a
      # green step. WAX_DIAG_DIR is where run-desktop.sh keeps each
      # suite's verbose tool trace, its JSON report, and the probe of a
      # hung one; the console log, the server's output included, goes
      # beside them.
      - name: App journey and conformance suite
        env:
          WAX_DIAG_DIR: ${{ runner.temp }}/desktop-diagnostics
        run: |
          set -o pipefail
          mkdir -p "$WAX_DIAG_DIR"
          xvfb-run -a bash e2e/run-desktop.sh 2>&1 | tee "$WAX_DIAG_DIR/desktop-linux.log"
      # Whatever happened: `always()` still runs after the cap's
      # cancellation, which `failure()` does not, and that is the run
      # with the most to say.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-conformance-diagnostics
          path: ${{ runner.temp }}/desktop-diagnostics
          retention-days: 14
          if-no-files-found: ignore
