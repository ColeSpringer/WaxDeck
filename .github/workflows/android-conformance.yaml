# The real-engine conformance suite against just_audio's Android
# backend, on an emulator. Runs on pushes that touch the surfaces the
# engine contract rides, plus the weekly sweep and on demand. "Gate"
# means the run is visible on the push and nothing more - the repo has
# no branch protection, so what it buys is a regression surfacing on
# the commit that made it instead of on Tuesday.
#
# Promoted on evidence: four dispatched runs on the 3.44.9 pin came
# back three green and one failure in which zero tests ran - "Failed
# to start Dart Development Service", the harness dying before the
# suite, with all four contending for the gradle cache at once. The
# suite itself has not failed, so the harness gets a second attempt
# below before the run reports red; a real regression fails both.
#
# Why it exists at all: the port contract says a play after completion
# restarts the item; the FakeEngine implemented that and just_audio did
# not, and because nothing held the real engine to the shared suite,
# every play button on every surface was dead at the end of a track
# until someone ran the app on a phone. This is the run that would have
# caught it.
#
# It also exercises the cleartext network-security config for real: the
# tone is served over plain HTTP, which targetSdk 36 blocks outright
# without that posture.
#
# The waxdeck/saf channel test rides the same emulator afterwards. Its
# system tree picker needs someone to tap through, and `flutter test`
# holds the device's one instrumentation slot, so the taps come from an
# adb driver running beside it (e2e/tools/run-saf-probe.sh). Same
# emulator, second suite: a picker this job already booted a device for
# is not worth booting another one for.
name: Android engine conformance

on:
  push:
    branches: [main]
    paths:
      - "app/packages/waxdeck_player/**"
      - "app/packages/waxdeck_player_testing/**"
      - "app/app/integration_test/**"
      - "app/app/android/**"
      - "app/app/pubspec.yaml"
      - "app/pubspec.lock"
      - "fixtures/**"
      # The Dart half of the waxdeck/saf protocol, whose Kotlin half is
      # already covered by app/app/android above.
      - "app/app/lib/src/uploads/saf_folder_picker.dart"
      - "e2e/tools/drive-saf-picker.sh"
      - "e2e/tools/run-saf-probe.sh"
      - ".github/workflows/android-conformance.yaml"
  schedule:
    - cron: "43 5 * * 2" # Tuesdays, 05:43 UTC
  workflow_dispatch:

# A push stacked on another push wants the newer emulator, not a queue
# of them - but only pushes supersede each other. The event name is in
# the group and cancellation is push-only, because everything on main
# shares one ref: a plain ref group would let a merge cancel the weekly
# sweep mid-run, and concurrent dispatches (the promotion evidence was
# four at once) would cancel each other.
concurrency:
  group: android-conformance-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.1"
  GO_VERSION: "1.26.x"

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # The runner image ships /dev/kvm without the permissions to open
      # it, and an emulator without KVM is too slow to finish a suite
      # that plays audio in real time.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: gradle/actions/setup-gradle@v5
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: fixtures/go.sum
      - name: Pub get (workspace root)
        run: cd app && flutter pub get
      # Synthesized, never committed: no binary media in git.
      - name: Synthesize the conformance tone
        run: |
          set -euo pipefail
          cd fixtures
          go run ./cmd/fixturegen -out "$RUNNER_TEMP/wax-conf" -preset conformance
          ls -l "$RUNNER_TEMP/wax-conf"
      # Served rather than pushed onto the device: an app on an emulator
      # has no host path it can open, and a URL is the shape a real
      # library stream takes anyway. 10.0.2.2 is the emulator's alias for
      # the host's loopback.
      - name: Serve the tone over loopback
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/wax-conf"
          nohup python3 -m http.server 8000 > "$RUNNER_TEMP/tone-server.log" 2>&1 &
          for _ in $(seq 1 30); do
            if curl -sfo /dev/null http://127.0.0.1:8000/conformance-tone.flac; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::the tone server never answered"
          cat "$RUNNER_TEMP/tone-server.log"
          exit 1
      # The tree the SAF channel test walks. Synthesized like the tone
      # and pushed onto the device by the runner script, never
      # committed.
      - name: Synthesize the SAF probe folder
        run: |
          set -euo pipefail
          cd fixtures
          go run ./cmd/fixturegen -out "$RUNNER_TEMP/wax-saf" -preset saf-probe
          find "$RUNNER_TEMP/wax-saf" -type f
      # google_apis rather than the smaller AOSP or ATD images: nothing
      # here wants Play services, but google_apis is the one variant
      # published at every API level, and a weekly job that dies in
      # sdkmanager is worse than one that boots two minutes slower.
      - name: Conformance suite on the emulator
        id: first
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          # The action's own default set, minus `-noaudio`, and pinned
          # here rather than inherited so it cannot change underneath
          # this. Every position assertion in the suite waits in wall
          # time on ExoPlayer's clock, and that clock is an AudioTrack
          # draining: with the guest audio device gone the suite fails on
          # timing for a reason that has nothing to do with the port. The
          # runner has no host audio either, so this asks the emulator
          # for a device that discards what it is given, which is exactly
          # what a silenced conformance run wants.
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          script: >-
            rm -rf "$RUNNER_TEMP/wax-saf-artifacts" &&
            cd app/app &&
            flutter test integration_test/real_engine_conformance_test.dart
            -d emulator-5554
            --dart-define=WAXDECK_CONFORMANCE_MEDIA=http://10.0.2.2:8000/conformance-tone.flac &&
            "$GITHUB_WORKSPACE/e2e/tools/run-saf-probe.sh"
            "$RUNNER_TEMP/wax-saf/WaxProbe" emulator-5554
      # The identical run again, only when the first failed: the one
      # observed failure mode is the harness dying before any test
      # starts, and a retry is cheaper than the promotion question
      # reopening on every flake. A real regression fails both attempts,
      # and both show in the log.
      - name: Conformance suite, second attempt
        if: steps.first.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          # Pinned identically to the first attempt, comment and all up
          # there: a retry that runs a different emulator answers a
          # different question.
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          script: >-
            rm -rf "$RUNNER_TEMP/wax-saf-artifacts" &&
            cd app/app &&
            flutter test integration_test/real_engine_conformance_test.dart
            -d emulator-5554
            --dart-define=WAXDECK_CONFORMANCE_MEDIA=http://10.0.2.2:8000/conformance-tone.flac &&
            "$GITHUB_WORKSPACE/e2e/tools/run-saf-probe.sh"
            "$RUNNER_TEMP/wax-saf/WaxProbe" emulator-5554
      # What the device looked like when the picker driver lost its
      # way: run-saf-probe.sh captures a screenshot and a final view
      # hierarchy, and DocumentsUI drifting is unreadable without them.
      # Nothing is captured when the SAF half never ran, hence ignore -
      # and each attempt empties the directory first, so what uploads
      # is never the earlier attempt's device.
      - name: Device capture on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: saf-picker-capture
          path: ${{ runner.temp }}/wax-saf-artifacts
          if-no-files-found: ignore
