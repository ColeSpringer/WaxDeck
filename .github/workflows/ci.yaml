name: CI

on:
  push:
    branches: [main]
  pull_request:
  # On demand too, for a flake that wants three runs without three
  # pushes to make them.
  workflow_dispatch:

# A pull request pushed to again wants the newer run, not a queue of
# them, so its runs share a group and the newer cancels the older. A
# push to main or a dispatch gets a group of its own, keyed by run id:
# GitHub holds at most one pending run per group and cancels the earlier
# pending one, so a group shared across pushes would report the middle
# of three quick pushes as cancelled and make every push wait for the
# run before it. Every commit on main keeps its own verdict instead.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GO_VERSION: "1.26.x"
  FLUTTER_VERSION: "3.47.1"
  NODE_VERSION: "24"

# Every job carries a timeout-minutes of about three times its green
# duration. The cap is a backstop, not a diagnostic: a job that reaches
# it is reported as cancelled, not failed, so `if: failure()` steps skip
# and whatever the job was doing is lost - which is how one hang cost an
# hour and left nothing. The suites that can hang therefore run under
# their own budgets (tools/ci/run-suite.sh), fail with their evidence
# kept, and reach the cap only when that has failed too.
jobs:
  # OpenAPI lint; on PRs also the breaking-change gate against the base ref.
  spec:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # oasdiff reads the spec from the base ref
      # spectral comes from e2e's lockfile (see the Makefile), hence the
      # npm cache keyed on it.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: make spec-lint
      - uses: actions/setup-go@v7
        if: github.event_name == 'pull_request'
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false # oasdiff is a one-shot `go run`; no go.sum at repo root
      - name: Breaking-change check (oasdiff)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }} # via env, never inlined into the script
        run: |
          if git cat-file -e "origin/${BASE_REF}:api/openapi.yaml" 2>/dev/null; then
            make oasdiff BASE="origin/${BASE_REF}"
          else
            echo "::notice::base ref has no api/openapi.yaml yet; skipping oasdiff"
          fi

  # The workflows themselves, and the shell that runs in them and beside
  # them, through the targets `make lint` runs, so a developer box checks
  # exactly what this job does. Both linters are release builds pinned by
  # version and checksum in tools/fetch-linter.sh; lint-tooling.yaml runs
  # the same targets on Windows and macOS whenever that tooling changes.
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Their own step, so a failed download reads as one rather than as a
      # lint failure. The targets below then find both cached.
      - name: Fetch the linters
        run: |
          tools/fetch-linter.sh actionlint
          tools/fetch-linter.sh shellcheck
      # Each linter's matcher turns its findings into annotations on the
      # line. actionlint's would also claim shellcheck's gcc-format lines,
      # and as errors, so it is removed before shellcheck's own is added.
      - name: actionlint
        run: |
          echo "::add-matcher::.github/matchers/actionlint.json"
          make workflow-lint
      - name: shellcheck
        run: |
          echo "::remove-matcher owner=actionlint::"
          echo "::add-matcher::.github/matchers/shellcheck.json"
          make shell-lint

  # Regenerate Go + Dart clients from the spec and fail if committed code drifts.
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: subosito/flutter-action@v2 # generate's pub get, gen-l10n and build_runner
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: make drift-check

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum
      - name: Vet and gofmt
        run: cd server && go vet ./... && test -z "$(gofmt -l .)"
      - name: Goroutine-supervision lint
        run: cd server && go run ./cmd/spawnlint ./...
      # The other half of `make lint`'s Go ratchets. This job enumerates
      # its steps rather than calling `make lint`, so a ratchet added to
      # the Makefile does not arrive here on its own - and one that runs
      # only on a developer box is not a ratchet. The item-query rule
      # was in that state.
      - name: Item-query lint
        run: cd server && go run ./cmd/querylint ./...
      - name: Import-boundary lint
        run: cd server && go run ./cmd/importlint ./...
      - name: Body-limit lint
        run: cd server && go run ./cmd/bodylint ./...
      # internal/service and internal/api build a full harness (fresh
      # migrated DB, catalog, service stack) per test and run for about
      # ten minutes each under -race here, with modernc's checkptr
      # exemption below: too close to go test's default 10m per-package
      # cap, so the cap is set to twice that. The harnesses are kept
      # cheap: test-weakened argon2, memoized fixture encodes, parallel
      # tests.
      #
      # -race also turns on checkptr, which validates unsafe.Pointer
      # conversions. modernc's transpiled SQLite makes them on nearly
      # every row operation, and they cost these packages over a third of
      # their CPU, so modernc builds without them here. sqlite-checkptr
      # keeps them on the driver, where they catch something: Go memory
      # handed to SQLite in place of a copy. Race detection is unaffected.
      #
      # Through tools/ci/go-test.sh, which mirrors the output to a file
      # and on failure names what failed where a reader looks first: an
      # annotation per failed test, and for a run that hit the timeout,
      # the tests still running when it did. The full log, goroutine
      # dump included, is the artifact below; the last such dump ran to
      # eight thousand lines with the one line that mattered inside it.
      - name: Test (race)
        run: cd server && bash ../tools/ci/go-test.sh "$RUNNER_TEMP/go-test.log" -race -gcflags='modernc.org/...=-d=checkptr=0' -timeout 20m ./...
      - uses: actions/upload-artifact@v7
        if: failure() || cancelled()
        with:
          name: server-test-log
          path: ${{ runner.temp }}/go-test.log
          retention-days: 14
          if-no-files-found: ignore

  # checkptr over the SQLite driver, which the race step above builds
  # without. internal/db binds text and blobs on nearly every write, so a
  # driver that hands SQLite Go memory rather than a copy faults here,
  # when SQLite copies it into a row.
  sqlite-checkptr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum
      - name: Test internal/db (race, checkptr)
        run: cd server && go test -race -timeout 5m ./internal/db/

  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false # fixtures module may legitimately have no go.sum
      - name: Vet and test
        run: cd fixtures && go vet ./... && go test ./...

  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Pub get (workspace root)
        run: cd app && flutter pub get
      - name: Format check
        run: make dart-format-check
      - name: Analyze (whole workspace)
        run: cd app && flutter analyze --no-pub
      # The same six packages `make test-app` runs, and for the same
      # reason the server job enumerates its ratchets: a suite that runs
      # only on a developer box is not a gate. waxdeck_data and
      # waxdeck_ui were missing here, so the mirror, the download
      # manager, and every design-system test were unguarded on a PR.
      - name: Test (api repository layer)
        run: cd app/packages/waxdeck_api && dart test
      - name: Test (design system)
        run: cd app/packages/waxdeck_ui && flutter test
      - name: Test (design system catalogue)
        run: cd app/packages/waxdeck_ui/example && flutter test
      # A failed golden writes a masked/isolated/diff triptych beside the
      # suite; without this the log carries a percentage and nothing to
      # look at. The readable goldens are exactly the ones a percentage
      # cannot explain - "1.95% of pixels" is a wrong font weight and a
      # moved needle alike, and telling those apart is the whole job.
      # Placed after both golden suites so either one's failure is
      # collected; if-no-files-found stays quiet for the failures that
      # are not golden ones.
      - name: Golden failure images
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-failures
          path: |
            app/packages/waxdeck_ui/test/failures/
            app/packages/waxdeck_ui/example/test/failures/
          if-no-files-found: ignore
      - name: Test (mirror, sync, downloads)
        run: cd app/packages/waxdeck_data && flutter test
      - name: Test (player engine, via its testing package)
        run: cd app/packages/waxdeck_player_testing && flutter test
      - name: Test (app)
        run: cd app/app && flutter test
      # The web build's per-device settings binding hands over the real
      # `window.localStorage`, and no VM suite can reach it - the store
      # above it is tested against a fake, and the handful of lines
      # underneath were the part nobody could gate. `@TestOn('browser')`
      # keeps these out of the VM sweep, so this is the run that
      # executes them.
      # Bounded on its own: the one time this hung it printed nothing
      # for twenty minutes and ran the job into its cap. A step that
      # fails names itself and lets the failure-only uploads run; a
      # cancelled job does neither. A green run takes under two minutes.
      - name: Test (browser)
        timeout-minutes: 10
        run: cd app/app && flutter test --platform chrome test/*_web_test.dart
      - name: Build web (wasm)
        run: cd app/app && flutter build web --wasm
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: app/app/build/web
          if-no-files-found: error

  # The Android release build, and then assertions about what came out
  # of it. Debug and profile builds cannot catch any of this: the two
  # settings below are release-manifest-only, both were missing, and
  # both fail silently at runtime - an APK with no INTERNET permission
  # installs and launches and simply cannot sign in. Asserting on the
  # built artifact rather than on the source makes the manifest merge
  # part of what is being tested.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: gradle/actions/setup-gradle@v5
      - name: Pub get (workspace root)
        run: cd app && flutter pub get
      # arm64 alone: this job is a correctness gate on the manifest and
      # the packaging, and every ABI produces the same manifest. The
      # per-ABI artifacts are packaging's job, not CI's.
      - name: Build release APK
        run: cd app/app && flutter build apk --release --target-platform android-arm64
      # build-tools is versioned on the runner image and the image
      # drifts, so the newest installed one is resolved rather than
      # pinned into a path. Everything below calls aapt2, not aapt:
      # the legacy binary is the one a future build-tools drops, and
      # aapt2 is what AGP itself uses.
      - name: Locate Android build tools
        run: |
          set -euo pipefail
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          for bin in aapt2 zipalign; do
            test -x "$tools/$bin" || { echo "::error::$bin missing from $tools"; exit 1; }
          done
          echo "BUILD_TOOLS=$tools" >> "$GITHUB_ENV"
      - name: Assert release manifest
        run: |
          set -euo pipefail
          APK=app/app/build/app/outputs/flutter-apk/app-release.apk
          "$BUILD_TOOLS/aapt2" dump permissions "$APK" > perms.txt
          for p in android.permission.INTERNET android.permission.POST_NOTIFICATIONS; do
            grep -qx "uses-permission: name='$p'" perms.txt || {
              echo "::error::release manifest is missing $p"; cat perms.txt; exit 1; }
          done
          # A missing network-security config is exactly as silent and as
          # fatal to sign-in as a missing INTERNET permission: targetSdk
          # 36 blocks the plain-HTTP LAN server the app defaults to.
          #
          # Dumped to a file first rather than piped into grep. `grep -q`
          # leaves on its first match, and under `pipefail` the SIGPIPE
          # that kills aapt2 mid-manifest fails the whole pipeline - so
          # the pipe would report a missing config on an APK that has one.
          "$BUILD_TOOLS/aapt2" dump xmltree --file AndroidManifest.xml "$APK" > manifest.txt
          grep -q networkSecurityConfig manifest.txt || {
            echo "::error::release manifest has no networkSecurityConfig"; exit 1; }
      # Guards the outcome the 16 KB page-size floor needs, rather than a
      # flag that happens to produce it: AGP packages jniLibs uncompressed
      # by default, and this fails if that ever stops being true.
      - name: Assert 16 KB alignment
        run: |
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 \
            app/app/build/app/outputs/flutter-apk/app-release.apk > /dev/null

  # The compose stack, brought up the way an operator brings it up and
  # then asked to do something: the images built under the names
  # compose.yaml declares, the stack started from them, a media fetch end
  # to end. Nothing here transcodes (a music item direct-plays from the
  # library bind); the engine link and key are proven by the health poll.
  # CORS is left unset so
  # the default shape boots; the Feishin phase adds it later. Seeded
  # through the real `make` target, so it cannot drift from a first run.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum
      - uses: docker/setup-buildx-action@v4
      # load: true and the exact `image:` names from compose.yaml, so
      # `up --no-build` finds them locally instead of pulling `latest`
      # (WaxSeal alone is pulled, as it is for every user). The
      # Dockerfile's ARG default is the Flutter pin for `make up`; this
      # job builds with the workflow's own pin and fails first if the two
      # ever drift apart.
      - name: Image toolchain pin agrees with CI
        run: grep -qxF "ARG FLUTTER_VERSION=$FLUTTER_VERSION" deploy/Dockerfile
      # A cache scope per image: under a shared one each build's export
      # replaces the other's, and neither ever finds a layer.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          load: true
          tags: ghcr.io/colespringer/waxdeck:latest
          build-args: |
            FLUTTER_VERSION=${{ env.FLUTTER_VERSION }}
          cache-from: type=gha,scope=waxdeck
          cache-to: type=gha,mode=max,scope=waxdeck
      # The engine at the server's pin, under upstream's name so
      # --no-build finds it locally.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.waxflow
          push: false
          load: true
          tags: ghcr.io/colespringer/waxflow:latest
          cache-from: type=gha,scope=waxflow
          cache-to: type=gha,mode=max,scope=waxflow
      # Synthesized, never committed: no binary media in git. The full
      # preset, so the scan has something with structure to find.
      - name: Synthesize a library
        run: |
          set -euo pipefail
          cd fixtures
          go run ./cmd/fixturegen -out "$RUNNER_TEMP/library" -preset all >/dev/null
          mkdir -p "$RUNNER_TEMP/audiobooks"
          find "$RUNNER_TEMP/library" -mindepth 1 -maxdepth 1 -printf '%f\n' | head
      # Overrides ride deploy/.env (compose hands it to the container
      # verbatim). Matching off, or every push runs paced live
      # MusicBrainz lookups per fixture; run-stack.sh does the same.
      - name: Seed the deployment config
        run: |
          set -euo pipefail
          make deploy/.env
          {
            echo "WAXDECK_MATCHING=false"
            # The worker step below needs work left for it.
            echo "WAXDECK_SONIC_ANALYSIS=false"
            echo "WAXDECK_WORKER_TOKENS=$(openssl rand -hex 24)"
          } >> deploy/.env
      # All three started, as an operator's `up -d` starts them. --wait
      # then blocks until the two this job drives report healthy (their
      # images bake HEALTHCHECKs), so "up" already means answering;
      # WaxSeal has the step after this one. The poll then proves the
      # server reached the engine over the host network: extra_hosts,
      # the loopback port, the seeded roots file and the shared key,
      # which the bridge refuses when wrong.
      - name: Bring the stack up
        env:
          WAXDECK_MUSIC: ${{ runner.temp }}/library
          WAXDECK_AUDIOBOOKS: ${{ runner.temp }}/audiobooks
        run: |
          set -euo pipefail
          WAXDECK_UID=$(id -u) WAXDECK_GID=$(id -g)
          export WAXDECK_UID WAXDECK_GID
          docker compose -f deploy/compose.yaml up -d --no-build
          docker compose -f deploy/compose.yaml up -d --wait --no-build waxdeck waxflow
          for _ in $(seq 1 30); do
            if curl -sf -o "$RUNNER_TEMP/health.json" http://localhost:4420/api/v1/health \
              && grep -q '"connected":true' "$RUNNER_TEMP/health.json"; then
              echo "engine connected"
              exit 0
            fi
            sleep 2
          done
          echo "::error::the server never connected to the engine"
          exit 1
      # WaxSeal alone needs something outside the runner: YouTube has to
      # serve its browser a watch page, and does not serve every address.
      # The script takes that refusal as a warning and fails on anything
      # else that keeps the daemon from coming up.
      - name: WaxSeal starts
        run: tools/ci/waxseal-starts.sh deploy/compose.yaml
      # The same readiness idiom run-desktop.sh uses: bootstrap the first
      # administrator (a no-op 409 afterwards), log in, and search for
      # something the scan should have found. A stack that comes up and
      # cannot answer this is up in name only.
      #
      # The password is the e2e suite's own (accounts.ts ADMIN_PASS): the
      # Feishin step below mints its account through the same fixtures,
      # and they reach a stack this step has already bootstrapped, so a
      # password of this step's own choosing would close the door on
      # them.
      - name: Smoke the stack
        run: |
          set -euo pipefail
          BASE=http://localhost:4420
          for _ in $(seq 1 60); do
            curl -sf -X POST "$BASE/api/v1/auth/bootstrap" \
              -H 'Content-Type: application/json' \
              -d '{"username":"admin","password":"wax-e2e-pass"}' >/dev/null 2>&1 || true
            TOKEN=$(curl -sf -X POST "$BASE/api/v1/auth/login" \
              -H 'Content-Type: application/json' \
              -d '{"username":"admin","password":"wax-e2e-pass"}' |
              sed -n 's/.*"token":"\([^"]*\)".*/\1/p') || true
            if [ -n "${TOKEN:-}" ] && curl -sf "$BASE/api/v1/library/search?q=Alpha" \
              -H "Authorization: Bearer $TOKEN" | grep -q '"tr-'; then
              echo "stack answered the search"
              echo "TOKEN=$TOKEN" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 2
          done
          echo "::error::the stack never scanned the fixture library"
          exit 1
      # A search only proves the catalog. This pulls actual bytes: resolve
      # a track to its media-token URL and range-request it, so the
      # library bind, the token, and range serving are covered rather than
      # assumed.
      - name: Fetch media from the stack
        run: |
          set -euo pipefail
          BASE=http://localhost:4420
          # Matched on the pid's own shape rather than on field order: a
          # sed anchored to "tracks":[{"pid" breaks the day a key moves,
          # and it would fail as "no track" rather than as what it is.
          PID=$(curl -sf "$BASE/api/v1/library/search?q=Alpha" \
            -H "Authorization: Bearer $TOKEN" |
            grep -o 'tr-[0-9A-Z]\{26\}' | head -1)
          test -n "$PID" || { echo "::error::no track pid in the search response"; exit 1; }
          # A real JSON decode, not a grep: Go HTML-escapes `&` inside
          # JSON strings as &, every actual client decodes it away,
          # and a shell pipeline that does not hands the server a URL
          # whose pid ends in a literal backslash-u-0026 - which the
          # media token then honestly refuses. The first run of this
          # gate failed exactly there.
          URL=$(curl -sf "$BASE/api/v1/items/$PID/play-info" \
            -H "Authorization: Bearer $TOKEN" |
            python3 -c 'import json,sys; print(json.load(sys.stdin)["url"])')
          test -n "$URL" || { echo "::error::play-info resolved no stream url for $PID"; exit 1; }
          # The url is origin-relative and carries its own media token, so
          # it needs no bearer header. A range request answers 206.
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -r 0-1023 "$BASE$URL")
          case "$CODE" in
          200 | 206) echo "streamed $PID ($CODE)" ;;
          *)
            echo "::error::streaming $PID answered $CODE"
            exit 1
            ;;
          esac
      # The worker binary against the stack, as the similarity doc runs it
      # on another machine. The server's own analysis is off, so the
      # fixtures wait for the worker: a wrong token exits non-zero at once,
      # and a posted batch proves the lease, the decode and the report.
      # The work only exists once a similarity sweep has queued the
      # fixtures, half a minute after the scan goes quiet, and a worker
      # polling before then is told to come back in a minute, which is its
      # whole budget here. So the queue comes first.
      - name: Run the analysis worker against the stack
        run: |
          set -euo pipefail
          (cd server && go build -o "$RUNNER_TEMP/waxdeck-analyzer" ./cmd/waxdeck-analyzer)
          queued=false
          for _ in $(seq 1 45); do
            if curl -sf -o "$RUNNER_TEMP/similarity.json" http://localhost:4420/api/v1/similarity/status \
              -H "Authorization: Bearer $TOKEN" &&
              grep -q '"queueDepth":[1-9]' "$RUNNER_TEMP/similarity.json"; then
              queued=true
              break
            fi
            sleep 2
          done
          $queued || { echo "::error::the server never queued the fixtures for analysis"; exit 1; }
          WORKER_TOKEN=$(sed -n 's/^WAXDECK_WORKER_TOKENS=//p' deploy/.env)
          timeout -k 10 --preserve-status 60 env \
            WAXDECK_ANALYZER_URL=http://localhost:4420 \
            WAXDECK_ANALYZER_TOKEN="$WORKER_TOKEN" \
            WAXDECK_ANALYZER_POLL_SECONDS=2 \
            WAXDECK_ANALYZER_BATCH=3 \
            "$RUNNER_TEMP/waxdeck-analyzer" > "$RUNNER_TEMP/analyzer.log" 2>&1
          cat "$RUNNER_TEMP/analyzer.log"
          grep -q 'posted embeddings' "$RUNNER_TEMP/analyzer.log"
          ! grep -q 'rejected the worker token\|work cycle failed' "$RUNNER_TEMP/analyzer.log"
      # And now a real client against that stack, rather than an emulated
      # trace of one: Feishin's own web build, from its own compose
      # project (a test fixture, so it lives in e2e/clients rather than
      # in the production file), signed in over the Subsonic surface and
      # asked to play something. External mode - the stack is already up,
      # so playwright starts no server of its own.
      #
      # Only now, after the default-shape boot has answered: the origin
      # is appended to .env and waxdeck recreated on the changed config.
      # The folder paths ride along or the recreate re-binds to nothing.
      - name: Name the Feishin origin
        env:
          WAXDECK_MUSIC: ${{ runner.temp }}/library
          WAXDECK_AUDIOBOOKS: ${{ runner.temp }}/audiobooks
        run: |
          set -euo pipefail
          echo "WAXDECK_CORS_ORIGINS=http://localhost:19180" >> deploy/.env
          WAXDECK_UID=$(id -u) WAXDECK_GID=$(id -g) \
            docker compose -f deploy/compose.yaml up -d --wait --no-build waxdeck
      - name: Serve Feishin beside the stack
        run: docker compose -f e2e/clients/compose.yaml up -d --wait
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install e2e dependencies
        run: cd e2e && npm ci --no-audit --no-fund
      - name: Cache Playwright browsers
        id: browser-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}
      - name: Install Playwright browser
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: cd e2e && npx playwright install chromium
      - name: Playwright system dependencies
        run: tools/ci/playwright-deps.sh
      - name: Drive Feishin against the stack
        env:
          WAXDECK_BASE_URL: http://localhost:4420
          FEISHIN_BASE_URL: http://localhost:19180
        run: cd e2e && npx playwright test --project=feishin
      - uses: actions/upload-artifact@v7
        if: failure() || cancelled()
        with:
          name: feishin-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14
          if-no-files-found: ignore
      # Best-effort lines: the step shell is bash -e, so a failing first
      # compose call (deploy/.env missing interpolates to an error)
      # would otherwise skip the Feishin logs - the one diagnostic for a
      # feishin-project failure - or leak its container and port. On the
      # cap's cancellation as well, which `failure()` alone skips. The
      # state comes before the logs: which container is unhealthy, and
      # what its healthcheck last said, is the line to read first.
      - name: Stack state and logs
        if: failure() || cancelled()
        run: |
          mkdir -p "$RUNNER_TEMP/stack-logs"
          docker compose -f deploy/compose.yaml ps -a || true
          for c in $(docker compose -f deploy/compose.yaml ps -aq 2>/dev/null); do
            docker inspect --format '{{.Name}}: {{.State.Status}}{{if .State.Health}}, health {{.State.Health.Status}}{{range .State.Health.Log}}{{"\n"}}  {{.Start}} exit {{.ExitCode}}: {{.Output}}{{end}}{{end}}' "$c" || true
          done
          docker compose -f deploy/compose.yaml logs --no-color --timestamps 2>&1 |
            tee "$RUNNER_TEMP/stack-logs/deploy.log" || true
          docker compose -f e2e/clients/compose.yaml logs --no-color --timestamps 2>&1 |
            tee "$RUNNER_TEMP/stack-logs/feishin.log" || true
      - uses: actions/upload-artifact@v7
        if: failure() || cancelled()
        with:
          name: docker-stack-logs
          path: ${{ runner.temp }}/stack-logs
          retention-days: 14
          if-no-files-found: ignore
      - name: Tear down
        if: always()
        run: |
          docker compose -f deploy/compose.yaml down || true
          docker compose -f e2e/clients/compose.yaml down

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [flutter]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum
      - uses: subosito/flutter-action@v2 # desktop-loopback probe runs via `dart run`
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Pub get (workspace root)
        run: cd app && flutter pub get
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: server/internal/web/dist
      - name: Build server with embedded web
        run: cd server && go build -tags withweb -o waxdeck ./cmd/waxdeck
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install e2e dependencies
        run: cd e2e && npm ci --no-audit --no-fund
      - name: Typecheck specs
        run: cd e2e && npm run typecheck
      # The other half of the gate. `tsc` catches a spec reaching past
      # the driver; this catches what no type can see - hand-typed
      # identifiers, raw API paths, numeric timeouts, the bootstrap
      # administrator outside its two jobs - and fails when any per-file
      # count moves in either direction.
      - name: Conformance ratchet
        run: cd e2e && npm run conform
      # The browser is ~150MB fetched from Google on every run otherwise.
      # Keyed on the lockfile because that is what pins the Playwright
      # version, and the browser build is chosen by that version.
      - name: Cache Playwright browsers
        id: browser-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}
      - name: Install Playwright browser
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: cd e2e && npx playwright install chromium
      # The libraries Chromium links against ship in the runner image,
      # so apt and its mirrors are asked only when the browser does not
      # start.
      - name: Playwright system dependencies
        run: tools/ci/playwright-deps.sh
      - name: Playwright e2e
        run: cd e2e && npx playwright test
      # Always: a green run is exactly when a test that needed a retry
      # would otherwise go unnoticed.
      - name: Surface flaky tests
        id: flaky
        if: always()
        run: node e2e/tools/flaky-summary.mjs e2e/test-results/report.json
      # test-results/ carries the traces, screenshots and hang evidence
      # that explain a failure; playwright-report/ is the readable shell
      # around them. Kept for a flaky run too - that is the run whose
      # evidence is otherwise thrown away - and for a cancelled one: the
      # cap fires exactly when a run stalled, and the traces of the
      # tests that were live are what say where.
      - uses: actions/upload-artifact@v7
        if: failure() || cancelled() || steps.flaky.outputs.flaky == 'true'
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14
      # The same sign-on journey against a real dex rather than the
      # bare-binary test IdP. Last in the job on purpose: it is a second
      # playwright run, and a second run rewrites test-results/report.json
      # - so it goes after the step that reads that file and after the
      # upload that carries it.
      - name: Single sign-on against dex
        run: bash e2e/run-sso-dex.sh
      - uses: actions/upload-artifact@v7
        if: failure() || cancelled()
        with:
          name: sso-dex-report
          path: e2e/test-results
          retention-days: 14
          if-no-files-found: ignore
