# Tagged releases. Push a tag matching v* (e.g. v0.2.0) and this workflow:
#   - pushes the multi-arch server image (linux/amd64 + linux/arm64) to
#     GHCR, tagged with the git tag and latest;
#   - cross-compiles the server (web UI embedded) and the analysis worker
#     for linux/darwin/windows x amd64/arm64 and attaches the archives to
#     a GitHub Release;
#   - runs the packaging matrix (package.yaml via workflow_call) and attaches
#     the desktop installers and the Android APKs to the same release.
# Only Android is signed; see docs/releasing.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  GO_VERSION: "1.26.x"
  FLUTTER_VERSION: "3.47.1"

jobs:
  # The bare version ("0.2.0" for tag v0.2.0), computed once. GitHub
  # expressions cannot strip a prefix inline, hence a tiny job.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.strip.outputs.version }}
    steps:
      - id: strip
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  # The server image compose.yaml references, multi-arch, pushed to GHCR.
  # The engine is the WaxFlow repo's own image. The Dockerfile
  # cross-compiles from the build host, so QEMU only backs the runtime
  # stage's apt layer.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [version]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push waxdeck
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            FLUTTER_VERSION=${{ env.FLUTTER_VERSION }}
          tags: |
            ghcr.io/colespringer/waxdeck:${{ github.ref_name }}
            ghcr.io/colespringer/waxdeck:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Standalone binaries: the server with the web UI embedded, and the
  # analysis worker. The Flutter web bundle is built once and reused
  # across all six targets; the version is stamped the way cmd/waxdeck
  # documents (-ldflags -X main.version=...). This job also creates the
  # GitHub Release the desktop job appends to.
  server-binaries:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [version]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Pub get (workspace root)
        run: cd app && flutter pub get
      - name: Build web bundle (once, embedded into every binary)
        run: cd app/app && flutter build web --wasm
      - name: Stage web bundle into the embed dir
        run: |
          rm -rf server/internal/web/dist
          mkdir -p server/internal/web/dist
          cp -r app/app/build/web/. server/internal/web/dist/
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum
      - name: Cross-compile and archive
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # Every archive carries the license and the third-party notices
          # beside its binary (the notices cover the server's build graph,
          # of which the worker's is a subset).
          mkdir -p dist/stage
          cp LICENSE dist/stage/LICENSE
          cp server/internal/notices/third_party_notices.txt dist/stage/THIRD-PARTY-NOTICES.txt
          # Two commands per target: the server with the web UI embedded,
          # and the analysis worker (docs/similarity-worker.md).
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            goos=${target%/*}
            goarch=${target#*/}
            for cmd in waxdeck waxdeck-analyzer; do
              bin=$cmd
              [ "$goos" = windows ] && bin="$cmd.exe"
              tags=
              name=waxdeck-analyzer
              if [ "$cmd" = waxdeck ]; then
                tags="-tags withweb"
                name=waxdeck-server
              fi
              echo "building $cmd for $goos/$goarch"
              (cd server && CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
                go build $tags -trimpath \
                  -ldflags "-X main.version=${VERSION}" \
                  -o "../dist/stage/$bin" "./cmd/$cmd")
              name="${name}_${VERSION}_${goos}_${goarch}"
              if [ "$goos" = windows ]; then
                (cd dist/stage && zip -q "../${name}.zip" "$bin" LICENSE THIRD-PARTY-NOTICES.txt && rm "$bin")
              else
                tar -czf "dist/${name}.tar.gz" -C dist/stage "$bin" LICENSE THIRD-PARTY-NOTICES.txt
                rm "dist/stage/$bin"
              fi
            done
          done
          rm -rf dist/stage
          ls -l dist
      - name: Create release and attach the binaries
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: dist/*
          generate_release_notes: true

  # The packaging matrix, versioned with the tag. Artifact names inside
  # the run stay stable; desktop-assets renames on attach. A called
  # workflow gets no secrets unless they are passed, and without them the
  # Android job would quietly emit debug-signed APKs - which install and
  # cannot be published.
  desktop:
    needs: [version]
    uses: ./.github/workflows/package.yaml
    secrets: inherit
    with:
      pack_version: ${{ needs.version.outputs.version }}

  # Attach the installers and the APKs to the release created above. Runs
  # after server-binaries so the release exists before files are appended.
  desktop-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [version, server-binaries, desktop]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Assemble versioned release assets
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p assets
          cp artifacts/waxdeck-linux-tar/waxdeck-linux-x64.tar.gz \
            "assets/waxdeck-linux-x64-${VERSION}.tar.gz"
          cp artifacts/waxdeck-windows-zip/waxdeck-windows-x64.zip \
            "assets/waxdeck-windows-x64-${VERSION}.zip"
          cp artifacts/waxdeck-windows-msix/*.msix \
            "assets/waxdeck-windows-${VERSION}.msix"
          # Velopack Setup.exe on its own (winget points at it), plus the
          # full Velopack output (portable package, releases feed) as one zip.
          setup=$(find artifacts/waxdeck-windows-velopack -name '*Setup*.exe' | head -n 1)
          if [ -n "$setup" ]; then
            cp "$setup" "assets/waxdeck-windows-setup-${VERSION}.exe"
          else
            echo "::warning::no Velopack Setup.exe found in the velopack artifact"
          fi
          (cd artifacts/waxdeck-windows-velopack && \
            zip -qr "${GITHUB_WORKSPACE}/assets/waxdeck-windows-velopack-${VERSION}.zip" .)
          for abi in armeabi-v7a arm64-v8a x86_64 universal; do
            cp "artifacts/waxdeck-android-apks/waxdeck-$abi.apk" \
              "assets/waxdeck-android-$abi-${VERSION}.apk"
          done
          ls -l assets
      - name: Attach the installers and APKs to the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: assets/*
