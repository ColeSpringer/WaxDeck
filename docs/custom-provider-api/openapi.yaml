openapi: 3.0.3
info:
  title: WaxDeck custom enrichment provider
  version: 1.1.0
  description: >
    The contract a self-hosted metadata service implements to plug into
    WaxDeck's enrichment as a provider: a regional lyrics database, a
    scene-specific cover source, a house genre taxonomy. WaxDeck is the
    client; the service you write is the server. Two endpoints mirror
    the in-process provider port: a capabilities read, answered once at
    WaxDeck's startup, and one enrich call per lookup.


    This document lives outside `api/spec/` deliberately: it is not part
    of WaxDeck's own REST surface, it is the surface WaxDeck consumes.
    Register an implementation with `WAXDECK_ENRICH_PROVIDER_URLS`
    (`name=url` pairs, comma separated) and, if it wants auth,
    `WAXDECK_ENRICH_PROVIDER_AUTH` (`name=token` pairs; the token rides
    every request as `Authorization: Bearer <token>`). Custom providers
    are asked ahead of every built-in one.
paths:
  /capabilities:
    get:
      operationId: getCapabilities
      summary: What this provider is and supplies
      description: >
        Read once when WaxDeck starts (with a short retry ladder, so a
        provider container that boots beside the server is not lost to
        the race). The name is the provenance mark stamped on every
        value this provider supplies (visible in the editor's per-field
        chips), so it must be non-empty and should stay stable forever;
        WaxDeck refuses to start on an empty one, which surfaces a
        misconfiguration immediately instead of dropping the provider
        with a log line. Capability tokens this contract version does
        not define are ignored, so a newer provider still serves an
        older WaxDeck; a provider advertising nothing the running
        WaxDeck understands is skipped with a log line rather than
        refused, since it could never have been called.
      responses:
        "200":
          description: The provider's identity and capability set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"
  /enrich:
    post:
      operationId: enrich
      summary: Answer one candidate lookup
      description: >
        One lookup, one answer. WaxDeck fills the identity hints it has
        for the target; use whichever your lookup needs and ignore the
        rest. Answer `200` with a candidate carrying everything found -
        WaxDeck applies it fill-when-empty and lock-respecting, so
        returning more than was asked for costs nothing; an all-empty
        `200` body counts as a no-match - or `204` for a clean no-match
        (looked up, nothing there). A `404` is read as a no-match too,
        defensively; `204` is the form that says it. Any other status
        is logged and read as a miss, asked about again once the retry
        window has passed (30 days by default) or on a forced run.


        Rate limiting toward whatever your service calls out to is the
        service's own business; WaxDeck paces its calls toward you and
        never invokes concurrently within one enrichment pass. WaxDeck
        keeps no cache of enrich answers (a candidate can carry a whole
        cover), so caching is yours to do - and requests with
        `force: true` ask you to bypass whatever cache you keep.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrichRequest"
      responses:
        "200":
          description: A candidate for the target.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Candidate"
        "204":
          description: A clean no-match.
components:
  schemas:
    Capabilities:
      type: object
      required: [name, capabilities]
      properties:
        name:
          type: string
          description: >
            Stable provenance id, lowercase by convention
            (`musicbrainz`, `lrclib` are the built-ins' shape). Never
            empty.
          example: regionaldb
        capabilities:
          type: array
          description: >
            The enrichment kinds this provider supplies. `cover` is a
            front cover, a release group's or, on a `release` request,
            one pressing's; `aux-art` is the other slots (back, disc,
            booklet, background), and `artist-art` an artist's own
            images. The three are separate because each gates a separate
            pass, and a provider that only knows front covers must not be
            walked over every artist in a library.


            `fields` is scalar metadata returned in `candidate.fields`
            with no artwork in it, and gates two walks by request type:
            `recording` for a track (tempo, ISRC, composer) and
            `release` for an album (label, year). A provider that only
            knows one rung answers nothing for the other. `book` is the
            same idea for audiobooks and gates the book walk.
          items:
            $ref: "#/components/schemas/Capability"

    Capability:
      type: string
      description: One kind of enrichment a provider supplies.
      enum: [identity, genres, cover, lyrics, book, aux-art, artist-art, fields]

    EnrichRequest:
      type: object
      required: [type]
      properties:
        type:
          type: string
          description: >
            Which entity the lookup concerns. `release_group` asks for
            genres and art; `release` is one pressing, asked for its own
            art (answer nothing if you only know groups) and its fields;
            `recording` for lyrics and fields; `book` for audiobook
            metadata; `artist` for an artist's own art.
          enum: [artist, release_group, release, recording, book]
        force:
          type: boolean
          description: Bypass any cache the provider keeps.
        wants:
          type: array
          description: >
            What this answer will be used for; absent means everything. A
            `release` is asked separately for `cover`, `aux-art` and
            `fields`, so skip what the others need.
          items:
            $ref: "#/components/schemas/Capability"
        title:
          type: string
          description: >
            Artist name, release-group title, track title, or book
            title, per `type`.
        artist:
          type: string
          description: Disambiguating primary artist (or book author).
        album:
          type: string
          description: Album title, for a recording lyrics lookup.
        mbid:
          type: string
          description: Known MusicBrainz identity anchor for the target.
        asin:
          type: string
          description: Known Audible/Amazon identifier (books).
        isbn:
          type: string
          description: Known ISBN (books).
        isrc:
          type: string
          description: >
            Known ISRC for the recording, carried by the track fields
            walk so a provider keyed on it can answer without a text
            match. Absent when the catalog holds none.
        barcode:
          type: string
          description: >
            Known barcode (UPC/EAN) for the release, verbatim as tagged,
            on every `release` request. Absent when the catalog holds
            none.
        catalogNumber:
          type: string
          description: >
            Known catalog number for the release, verbatim as tagged, on
            every `release` request. Absent when the catalog holds none.
        releaseGroupMbid:
          type: string
          description: >
            The MusicBrainz release group a `release` request's pressing
            belongs to, when known.
        groupFrontHash:
          type: string
          description: >
            Hex SHA-256 of the release group's front cover as WaxDeck
            holds it: the group's own on a `release_group` request, the
            parent group's on a `release` one. Absent when there is none
            or it was chosen by hand. See `frontIsGroupFront`.
        durationSec:
          type: integer
          description: >
            Track duration in seconds, for a duration-disambiguated
            lyrics match.

    Candidate:
      type: object
      description: >
        Everything the provider found for the target. All fields are
        optional; WaxDeck decides what actually lands (fill-when-empty,
        never over a locked field).
      properties:
        confidence:
          type: number
          description: Advisory 0..1; providers are ranked by registration order today.
        mbid:
          type: string
          description: Resolved MusicBrainz id (identity capability).
        asin:
          type: string
        isbn:
          type: string
        type:
          type: string
          description: Release-group primary type.
          enum: [album, ep, single, compilation, audiobook]
        genres:
          type: array
          description: Display names, highest confidence first.
          items:
            type: string
        frontIsGroupFront:
          type: boolean
          description: >
            On a `release` request: the picture behind `groupFrontHash`
            is this pressing's own cover, so WaxDeck reuses it without a
            download. Leave `cover` out; a front sent beside it is
            dropped.
        cover:
          $ref: "#/components/schemas/Image"
        art:
          type: object
          description: >
            Images by role (`front`, `back`, `disc`, `booklet`,
            `background`); the `aux-art` and `artist-art` walks read only
            this. An artist's `cover` counts as its `front`.
          additionalProperties:
            $ref: "#/components/schemas/Image"
        publisher:
          type: string
          description: Audiobook publisher.
        lyrics:
          type: object
          description: At least one of `synced` and `unsynced`.
          properties:
            synced:
              type: array
              description: Timed lines, ordered by `timeMs`.
              items:
                type: object
                required: [timeMs, text]
                properties:
                  timeMs:
                    type: integer
                  text:
                    type: string
            unsynced:
              type: string
              description: Plain unsynchronized text.
        fields:
          type: object
          description: >
            Generic curated values keyed by WaxDeck's metadata
            vocabulary, for a value with no dedicated slot above. This
            is what the `fields` capability answers with: `bpm`, `isrc`
            and `composer` on a `recording`, `label` and `year` on a
            `release`. The `book` capability reads it too, for
            `publisher`, `year`, `description`, `narrator`, `subtitle`,
            `edition`, `asin` and `isbn` alongside the dedicated slots
            above.


            Return what you found rather than pre-filtering: only the
            keys the target's fill set accepts are applied, and the rest
            are ignored. A year fills every member of an album at once,
            so it is refused where the members disagree.
          additionalProperties:
            type: string

    Image:
      type: object
      description: >
        One picture. WaxDeck drops one over 8 MiB, one that is not a
        recognizable picture, and SVG, and keeps the rest of the answer.
      required: [data]
      properties:
        data:
          type: string
          format: byte
          description: The image bytes, base64.
        mediaType:
          type: string
          description: >
            What the bytes are (`image/jpeg`); consulted only when the
            bytes themselves neither decode nor sniff.
        sourceUrl:
          type: string
          description: Where the picture came from, cited in provenance.
