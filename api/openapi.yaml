openapi: 3.0.3
info:
  title: WaxDeck API
  version: 0.5.0
  description: |
    First-party REST API for WaxDeck: the self-hosted player, library manager,
    and metadata completer for music, podcasts, and audiobooks.

    Current scope: health, accounts and sessions (local passwords and OIDC),
    user administration with roles and per-library visibility, per-user
    preferences, library browse and search, item detail, artwork, lyrics,
    play-info, playback state (resume, stars, ratings), listen session
    ingest, library scanning, delta sync for offline-first clients (with
    the WebSocket event channel specified in `api/events.md`; its frame
    payloads are components in this document), offline downloads of
    original files, app passwords for the compatibility APIs, podcasts
    (per-user subscriptions over globally cataloged shows, episode
    browsing with sanitized show notes, transcripts, OPML round trips,
    server-side episode fetching, and YouTube channels as shows),
    audiobooks (book detail with chapters and parts, chapter-aware
    resume, per-book playback settings), and silence skip maps for
    client-side trimming. The shapes (keyset pagination, typed PIDs,
    the structured error model, relative media URLs) are load-bearing
    from day one.

    Conventions:
    - All endpoints live under `/api/v1` (this document's `servers` entry).
    - Identifiers (`pid`) are type-prefixed ULIDs (`tr-` track, `al-` album,
      `ar-` artist, `pc-` podcast, `ep-` episode, `bk-` audiobook, `jb-` job,
      `lb-` library, `us-` user, `se-` session, `ap-` app password).
    - List endpoints use opaque keyset cursors (`cursor` in, `nextCursor` out),
      never offsets.
    - Errors are always the `Error` schema. `code` is a stable machine-readable
      string; currently defined codes: `invalid-request`, `unauthenticated`,
      `forbidden`, `not-found`, `conflict`, `internal`, `rate-limited` (too
      many attempts; retry later), `stream-stale` (a stream URL no longer
      matches the file on disk; re-request play-info), `catalog-maintenance`
      (the catalog is temporarily handed to a maintenance operation; retry
      shortly), `sync-reset` (a sync cursor predates the retained change
      history; drop the local mirror and re-mirror from a fresh snapshot),
      `feed-unreachable` (an upstream feed could not be fetched or parsed;
      the feed's own server answered an error, timed out, or returned
      something that is not a feed), and `source-unavailable` (the request
      needs an acquisition source integration, such as the YouTube bridge,
      that this server is not running).
      New codes may appear; clients must treat unknown codes as opaque.
    - Media URLs returned by the API (e.g. `PlayInfo.url`) are relative to the
      server origin, the same origin that serves this API and the web UI.
    - Cross-site request forgery: state-changing requests (POST, PUT, PATCH,
      DELETE) authenticated by the session cookie must carry an
      `X-CSRF-Token` header matching the session's CSRF token, which login
      and session inspection return in their bodies (a synchronizer token;
      it is never a cookie). Requests authenticated by a bearer token are
      exempt. A cookie-authenticated mutation without a matching token is
      rejected with `forbidden`. Login, logout, and the other endpoints
      declaring `security: []` are exempt (the residual forced-login and
      forced-logout CSRF nuisances are accepted; `SameSite=Lax` cookies
      and the single-origin UI bound them).
    - The server never enables cross-origin credentialed access: no CORS
      headers are emitted, and session cookies stay `SameSite=Lax`. The
      CSRF-token readback model depends on this; deployments must not
      layer permissive CORS onto the API origin.
    - Every item read and mutation is scoped to the libraries visible to the
      calling user: an item outside the caller's visibility behaves exactly
      as if it did not exist (`not-found`), and list endpoints omit such
      items (a page may carry fewer than `limit` items and still have a
      `nextCursor`).
    - Podcast subscriptions additionally scope the caller's own catalog
      view: shows and their episodes appear in item listings, discovery
      browse, search, and catalog sync only while the caller subscribes
      to the show, so unsubscribing removes a show from your library
      surfaces while the catalog keeps everything (files, other users'
      subscriptions, playback history). Subscribing or unsubscribing
      therefore retires the caller's outstanding catalog sync cursors:
      the next delta answers `sync-reset` and the re-mirror reflects the
      new membership. Show detail, a show's episode list, and episode
      reads stay available to any caller who can see the podcast
      library, so shows can be browsed before subscribing.
  contact:
    name: WaxDeck
    url: https://github.com/ColeSpringer/WaxDeck
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: /api/v1
    description: Same-origin API root.

tags:
  - name: system
    description: Health and server metadata.
  - name: auth
    description: Sessions, devices, first-run bootstrap, and OIDC single sign-on.
  - name: users
    description: Account administration, roles, library visibility, and preferences.
  - name: library
    description: Browse, search, and inspect library items.
  - name: podcasts
    description: >
      Per-user podcast subscriptions over globally cataloged shows:
      subscribe, browse episodes, transcripts, OPML, refresh, and
      server-side episode fetching.
  - name: books
    description: Audiobook detail, chapter-aware resume, and per-book settings.
  - name: playback
    description: Resolve playable streams, playback state, and listen accounting.
  - name: sync
    description: >
      Delta sync for offline-first clients: snapshot and changed-since
      mirroring of the catalog and of the caller's own server-side state.
  - name: admin
    description: Library maintenance operations.

security:
  - cookieAuth: []
  - bearerAuth: []

paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness and version probe
      description: >
        Unauthenticated liveness probe. Reports the server version and the API
        version it serves.
      tags: [system]
      security: []
      responses:
        "200":
          description: Server is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /auth/login:
    post:
      operationId: login
      summary: Log in and establish a session
      description: >
        Verifies local-account credentials, establishes a session, and sets
        the `waxdeck_session` HttpOnly cookie. Native clients use the same
        endpoint and read the bearer token from the response body instead of
        the cookie; passing `deviceName` labels the session in the device
        list. Invalid credentials and disabled accounts answer 401 without
        distinguishing the two. Repeated failures are rate limited per
        source and account.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session established.
          headers:
            Set-Cookie:
              description: "`waxdeck_session` HttpOnly SameSite=Lax session cookie."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"

  /auth/logout:
    post:
      operationId: logout
      summary: End the current session
      description: >
        Revokes the presented session (cookie or bearer token) and clears the
        session cookie. Succeeds even if no session is active.
      tags: [auth]
      security: []
      responses:
        "204":
          description: Session ended.
          headers:
            Set-Cookie:
              description: Expired `waxdeck_session` cookie.
              schema:
                type: string

  /auth/session:
    get:
      operationId: getSession
      summary: Inspect the current session
      description: >
        Returns whether the caller is authenticated and, if so, the session's
        user and CSRF token. Unauthenticated callers get
        `authenticated: false`, not a 401. Clients use this at startup to
        decide whether to show the login screen.
      tags: [auth]
      security: []
      responses:
        "200":
          description: Current session state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"

  /auth/bootstrap:
    get:
      operationId: getBootstrapStatus
      summary: Check whether first-run setup is needed
      description: >
        Reports whether the server is still waiting for its first
        administrator. Clients probe this when a session check comes back
        unauthenticated and route to the setup screen instead of the
        login screen while `required` is true. Setup stays required as
        long as no enabled administrator exists, so an OIDC login that
        provisioned a plain account first never strands the server
        adminless.
      tags: [auth]
      security: []
      responses:
        "200":
          description: Bootstrap state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapStatus"
    post:
      operationId: bootstrap
      summary: Create the first administrator
      description: >
        Creates an administrator account and logs it in (cookie plus
        bearer token, exactly like login). Available only while the
        server has no enabled administrator; once one exists this
        endpoint answers `conflict` forever. Not rate limited
        separately: it is a door that closes the moment an
        administrator exists.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapRequest"
      responses:
        "200":
          description: Administrator created and logged in.
          headers:
            Set-Cookie:
              description: "`waxdeck_session` HttpOnly SameSite=Lax session cookie."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /auth/refresh:
    post:
      operationId: refreshToken
      summary: Rotate the caller's bearer token
      description: >
        Issues a replacement bearer token for the calling device session and
        invalidates the presented one after a short overlap window (so
        requests already in flight with the old token do not fail). Native
        clients call this periodically; the session itself (its id, device
        name, and history) is unchanged. Cookie-authenticated callers have
        nothing to rotate and get `invalid-request`.
      tags: [auth]
      responses:
        "200":
          description: Replacement token for the same session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /auth/sessions:
    get:
      operationId: listSessions
      summary: List the caller's sessions and devices
      description: >
        Every live session belonging to the calling user, newest first: web
        logins and native devices, with the one serving this request marked
        `current`. This doubles as the device list; revoke an entry to sign
        that device out. Unpaginated: a user's live sessions are a small,
        bounded set.
      tags: [auth]
      responses:
        "200":
          description: The caller's sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /auth/sessions/{sessionId}:
    delete:
      operationId: revokeSession
      summary: Revoke one of the caller's sessions
      description: >
        Revokes one of the calling user's sessions immediately: the device
        holding it is signed out and its next request fails with 401.
        Revoking the session serving this request is allowed and acts as
        a logout (the response then also expires the session cookie).
        Only the caller's own sessions are visible here; an administrator
        signs another user out via that user's account endpoints.
      tags: [auth]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "204":
          description: Session revoked.
          headers:
            Set-Cookie:
              description: >
                Expired `waxdeck_session` cookie, present only when the
                revoked session is the one serving this request.
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /auth/oidc/providers:
    get:
      operationId: listOidcProviders
      summary: List configured OIDC providers
      description: >
        The single sign-on providers this server is configured with, for
        rendering login buttons. Empty when OIDC is not configured. Each
        provider carries the origin-relative URL that starts its flow.
      tags: [auth]
      security: []
      responses:
        "200":
          description: Configured providers (possibly none).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcProviders"

  /auth/oidc/start:
    get:
      operationId: startOidc
      summary: Start an OIDC login
      description: >
        Redirects the browser to the identity provider's authorization
        endpoint (authorization code with PKCE, server-mediated: the
        provider only ever redirects back to this server). `mode` selects
        how the flow completes after the callback: `web` sets the session
        cookie and redirects into the SPA; `app` redirects to the
        `waxdeck://auth` deep link with a one-time code; `loopback`
        redirects to `http://127.0.0.1:{port}/callback` with a one-time
        code; `code` shows the one-time code on a plain page for manual
        copy. One-time codes are exchanged at `/auth/oidc/exchange`.
      tags: [auth]
      security: []
      parameters:
        - name: provider
          in: query
          required: true
          description: Provider id from `/auth/oidc/providers`.
          schema:
            type: string
        - name: mode
          in: query
          description: How the flow completes after the provider callback.
          schema:
            type: string
            enum: [web, app, loopback, code]
            default: web
        - name: redirect
          in: query
          description: >
            Where the browser lands after a `web`-mode login: a
            single-slash-rooted path (for example `/library`). Values
            starting `//` or containing a scheme or authority are
            rejected, never coerced, since this redirect fires after the
            session cookie is set. Defaults to `/`.
          schema:
            type: string
        - name: challenge
          in: query
          description: >
            Proof-of-possession binding for `app`, `loopback`, and `code`
            modes: the base64url SHA-256 of a client-held secret, exactly
            like a PKCE code challenge. When given, the resulting
            one-time code can only be redeemed together with the matching
            `verifier`, so a code intercepted in transit (a rogue app
            claiming the deep-link scheme) is useless alone. First-party
            clients always send one.
          schema:
            type: string
        - name: port
          in: query
          description: >
            Loopback port for `loopback` mode. Required for that mode,
            ignored otherwise.
          schema:
            type: integer
            minimum: 1024
            maximum: 65535
      responses:
        "302":
          description: Redirect to the identity provider.
          headers:
            Location:
              description: The provider's authorization URL.
              schema:
                type: string
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /auth/oidc/callback:
    get:
      operationId: oidcCallback
      summary: OIDC provider callback
      description: >
        The redirect URI registered with the identity provider; browsers
        arrive here from the provider, clients never call it directly.
        Exchanges the authorization code, verifies the ID token, resolves
        the account, then completes per the flow's `mode`: `web` sets the
        session cookie and redirects into the SPA; `app` redirects to the
        `waxdeck://auth` deep link carrying a one-time code; `loopback`
        redirects to the flow's loopback URL with the code; `code` renders
        the code as plain HTML for manual copy. Account resolution is by
        provider identity (issuer and subject) only: a first login
        provisions a fresh account, disambiguating a taken username with
        a suffix, and never links onto an existing local account by
        username or email (silent merges are an account-takeover class;
        linking is an explicit future admin action). Provider errors and
        unknown or expired `state` render a plain error page, since there
        is no client context to return a structured error to. Every value
        interpolated into these HTML pages (codes, provider error text)
        is HTML-escaped, and the code page carries nothing derived from
        the user agent.
      tags: [auth]
      security: []
      parameters:
        - name: code
          in: query
          description: Authorization code from the provider.
          schema:
            type: string
        - name: state
          in: query
          description: Opaque state issued by `/auth/oidc/start`.
          schema:
            type: string
        - name: error
          in: query
          description: Provider-reported error code, when the provider denied the flow.
          schema:
            type: string
        - name: error_description
          in: query
          description: Provider-reported human-readable error detail.
          schema:
            type: string
      responses:
        "302":
          description: Flow completion redirect (`web`, `app`, and `loopback` modes).
          headers:
            Location:
              description: SPA path, deep link, or loopback URL per the flow's mode.
              schema:
                type: string
            Set-Cookie:
              description: "`waxdeck_session` cookie (`web` mode only)."
              schema:
                type: string
        "200":
          description: One-time code page (`code` mode) or a plain error page.
          content:
            text/html:
              schema:
                type: string

  /auth/oidc/exchange:
    post:
      operationId: exchangeOidcCode
      summary: Exchange a one-time OIDC code for a session
      description: >
        Redeems the one-time code delivered by an `app`, `loopback`, or
        `code` mode OIDC flow for a session (bearer token plus user, exactly
        like login). Codes are single-use and expire within minutes;
        redeeming one again fails. Guessing is rate limited.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OidcExchangeRequest"
      responses:
        "200":
          description: Session established.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"

  /users:
    get:
      operationId: listUsers
      summary: List accounts
      description: >
        Keyset-paginated list of all accounts, ordered by username.
        Administrators only.
      tags: [users]
      parameters:
        - name: cursor
          in: query
          description: >
            Opaque keyset cursor from a previous page's `nextCursor`. Omit for
            the first page.
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum accounts per page.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: One page of accounts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createUser
      summary: Create an account
      description: >
        Creates a local account. Administrators only. Usernames are unique
        case-insensitively; a taken name answers `conflict`. The account is
        immediately able to log in with the given password.
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: Account created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAccount"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /users/{userId}:
    get:
      operationId: getUser
      summary: Get one account
      description: >
        Full account detail. Administrators can read any account; everyone
        else only their own.
      tags: [users]
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAccount"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateUser
      summary: Update an account
      description: >
        Partial update: absent fields are unchanged. Administrators can
        update any field on any account; everyone else can change only
        their own `displayName`, and a non-administrator supplying any
        other field is rejected with `forbidden`, never silently
        ignored. Changes that would leave the server without an enabled
        administrator (demoting or disabling the last one) answer
        `conflict`. Setting `displayName` to the empty string clears it.
      tags: [users]
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: The updated account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAccount"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteUser
      summary: Delete an account
      description: >
        Deletes the account and revokes all its sessions. Administrators
        only, and never the calling account or the last enabled
        administrator (`conflict`). The user's listening history in the
        catalog is orphaned, not destroyed.
      tags: [users]
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "204":
          description: Account deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /users/{userId}/password:
    put:
      operationId: setPassword
      summary: Set an account's password
      description: >
        Changes the account's password and revokes the account's
        sessions. Changing your own password always requires
        `currentPassword` (administrators included); a wrong value
        answers `forbidden`, and the session making the request is the
        only one that survives. An administrator resetting another
        account's password omits `currentPassword`, and every one of
        that account's sessions is revoked. Setting a password on an
        OIDC-provisioned account enables local login for it. App
        passwords are separate credentials and survive a password
        change; revoke them individually.
      tags: [users]
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChange"
      responses:
        "204":
          description: Password changed.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/{userId}/sessions:
    delete:
      operationId: revokeUserSessions
      summary: Revoke all of an account's sessions
      description: >
        Signs the account out everywhere by revoking every live session it
        has. When callers target their own account, the session making this
        request survives. Administrators can target any account; everyone
        else only their own.
      tags: [users]
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "204":
          description: Sessions revoked.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/me/prefs:
    get:
      operationId: getPrefs
      summary: Get the caller's preferences
      description: >
        The calling user's preferences. Unset fields are absent; clients
        apply their own defaults.
      tags: [users]
      responses:
        "200":
          description: The caller's preferences.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prefs"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    put:
      operationId: putPrefs
      summary: Replace the caller's preferences
      description: >
        Replaces the calling user's preferences with the given object:
        absent fields are cleared back to unset. Returns the stored
        result; comparing it against what was sent reveals anything the
        server did not store. Field values are validated (unknown
        timezone, malformed locale, or unknown theme is rejected).
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Prefs"
      responses:
        "200":
          description: The stored preferences.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prefs"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /users/me/app-passwords:
    get:
      operationId: listAppPasswords
      summary: List the caller's app passwords
      description: >
        The calling user's app passwords, newest first. App passwords are
        dedicated per-client credentials for the compatibility APIs
        (Subsonic and, later, gpodder), which require the server to hold a
        recoverable secret; the login password is never usable there. The
        secret itself is only ever returned by creation. App passwords
        stop authenticating the moment their account is disabled, and are
        deliberately independent of the login password: changing or
        resetting it leaves them working (revoke them here). Unpaginated:
        a user's app passwords are a small, bounded set.
      tags: [users]
      responses:
        "200":
          description: The caller's app passwords.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppPasswordList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      operationId: createAppPassword
      summary: Create an app password
      description: >
        Generates a new app password for the calling user and returns the
        secret exactly once; it is not recoverable through the API
        afterwards. The secret is 26 characters of server-generated
        randomness (at least 128 bits); users never choose it. The client
        using it authenticates against the compatibility APIs with the
        account's username and this secret. The label distinguishes
        entries in the list (for example the client app's name); labels
        need not be unique. An account holds at most 50 app passwords;
        creating past the cap answers `conflict`.
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppPasswordCreate"
      responses:
        "201":
          description: App password created; the secret appears only here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppPasswordCreated"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/Conflict"

  /users/me/app-passwords/{appPasswordId}:
    delete:
      operationId: revokeAppPassword
      summary: Revoke an app password
      description: >
        Revokes one of the calling user's app passwords. Clients holding it
        fail their next compatibility-API request immediately.
      tags: [users]
      parameters:
        - $ref: "#/components/parameters/AppPasswordId"
      responses:
        "204":
          description: App password revoked.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /libraries:
    get:
      operationId: listLibraries
      summary: List libraries
      description: >
        The catalog's libraries, for granting per-library visibility.
        Administrators only. Unpaginated: libraries are a handful of roots,
        not a collection that grows with content.
      tags: [admin]
      responses:
        "200":
          description: All libraries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Libraries"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /library/items:
    get:
      operationId: listItems
      summary: Browse library items
      description: >
        Keyset-paginated list of library items, optionally filtered by media
        type. Ordering is stable (title, then pid) so cursors never skip or
        duplicate.
      tags: [library]
      parameters:
        - name: mediaType
          in: query
          description: Restrict results to one media type.
          schema:
            $ref: "#/components/schemas/MediaType"
        - name: cursor
          in: query
          description: >
            Opaque keyset cursor from a previous page's `nextCursor`. Omit for
            the first page.
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum items per page.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: One page of items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /library/browse:
    get:
      operationId: browseList
      summary: Browse a discovery list
      description: >
        Keyset-paginated discovery lists over the whole library: newest,
        recently added, most played, recently played, random, starred, and
        alphabetical. Play-derived lists reflect the calling user's own
        listening state.
      tags: [library]
      parameters:
        - name: list
          in: query
          required: true
          description: Which discovery list to page through.
          schema:
            $ref: "#/components/schemas/DiscoveryList"
        - name: seed
          in: query
          description: >
            Shuffle seed for the `random` list. The same seed pages through
            the same shuffled order, so paging stays stable. When omitted the
            server picks a fresh seed and returns it as the page's `seed`;
            pass that value back with the cursor for later pages. A cursor is
            only valid together with the same `list` and `seed` it was issued
            for.
          schema:
            type: integer
            format: int64
        - name: cursor
          in: query
          description: >
            Opaque keyset cursor from a previous page's `nextCursor`. Omit for
            the first page.
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum items per page.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: One page of the list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /library/search:
    get:
      operationId: search
      summary: Search the library
      description: >
        Full-text search across artists, albums, tracks, books, and episodes.
        Results are grouped by kind and ranked within each group; each group
        is capped at `limit` hits.
      tags: [library]
      parameters:
        - name: q
          in: query
          required: true
          description: Search query. Must contain at least one non-whitespace character.
          schema:
            type: string
            minLength: 1
        - name: limit
          in: query
          description: Maximum hits per result group.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Grouped search results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /library/rescan:
    post:
      operationId: rescanLibrary
      summary: Start a library rescan
      description: >
        Starts an asynchronous scan of every library root and returns the job
        tracking it. Poll the job to observe progress and completion. Scans
        serialize with other catalog jobs; starting one while another runs
        returns the conflict error. Administrators only.
      tags: [admin]
      responses:
        "202":
          description: Scan started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /jobs/{pid}:
    get:
      operationId: getJob
      summary: Get one job's state
      description: State and progress of a server-run catalog job.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/Pid"
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /items/{pid}:
    get:
      operationId: getItem
      summary: Get one item's detail
      description: Full detail for a single library item.
      tags: [library]
      parameters:
        - $ref: "#/components/parameters/Pid"
      responses:
        "200":
          description: The item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /items/{pid}/play-info:
    get:
      operationId: getPlayInfo
      summary: Resolve a playable stream for an item
      description: >
        Returns everything a client needs to start playback: a short-TTL,
        origin-relative stream URL (media-token authenticated, so it is playable
        by bare `<audio>` elements, cast devices, and DLNA renderers that cannot
        send headers), the served format, and expiry. Clients re-request
        play-info when a stream URL expires or the server signals
        `stream-stale`. A multi-file audiobook resolves one part per call:
        pass `positionMs` (book-timeline milliseconds) to get the part
        containing that position, and read `partIndex`, `partCount`, and
        `partStartMs` from the response; when playback crosses the end of
        a part, re-request play-info with the new book-timeline position.
        The response's `durationMs` is always the duration of the served
        stream (the resolved part, for multi-file books); the book total
        lives on the item summary and the book detail. Positions reported
        to play-state for multi-file books are always book-timeline
        milliseconds (`partStartMs` plus the in-part position). A podcast
        episode whose audio has not been fetched to the server yet
        answers `conflict`; queue it with the episode fetch endpoint and
        retry when the catalog reports it present.
      tags: [playback]
      parameters:
        - $ref: "#/components/parameters/Pid"
        - name: positionMs
          in: query
          description: >
            Book-timeline position in milliseconds; selects which part of
            a multi-file audiobook to resolve. Omitting it resolves the
            first part. Ignored for single-file items.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: voiceBoost
          in: query
          description: >
            Request server-side spoken-word loudness normalization
            (compression plus leveling gain) applied to the stream, for
            clients without local DSP. Precedence is resolved here, at
            mint time: when this parameter is present it wins; when
            absent, the caller's stored setting for the show or book
            applies. Honored only for podcast episodes and audiobooks,
            only when the streaming sidecar supports it, and only when
            the item's measured loudness is known; the response's
            `voiceBoost` always reports the actual outcome. Applying it
            forces a transcode.
          schema:
            type: boolean
      responses:
        "200":
          description: Stream resolution for the item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayInfo"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            The item cannot stream yet (code `conflict`): a podcast
            episode whose audio has not been fetched to the server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /items/{pid}/download-info:
    get:
      operationId: getDownloadInfo
      summary: Resolve an offline download for an item
      description: >
        Returns everything a client needs to download the item's original
        bytes for offline playback: one entry per backing file (a track
        has one; a multi-file audiobook lists every part in reading
        order), each with a short-TTL, origin-relative,
        media-token-authenticated URL serving the untranscoded file with
        range support, so interrupted downloads resume. The download
        responses carry a `Content-Disposition` derived from each entry's
        `fileName` and an `ETag` equal to the entry's `etag`, a strong
        validator of the exact file bytes: resume ranges with
        `If-Range: <etag>`, and when it no longer matches (the file was
        retagged, replaced, or upgraded) restart that file's transfer.
        The separate `essenceHash` identifies the audio content
        independently of tags and location; clients key their download
        store on it, so a retag or move never forces a re-download of
        audio they already hold (the restarted transfer replaces the
        stored file under the same key). Items carved out of a larger
        file (CUE-backed virtual tracks) resolve to their containing
        file plus a `spanStartMs`/`spanEndMs` playback window. When a
        URL expires mid-download, re-request download-info and resume by
        range against the fresh URL. A download URL whose file changed
        on disk answers `stream-stale`; re-request download-info.
      tags: [playback]
      parameters:
        - $ref: "#/components/parameters/Pid"
      responses:
        "200":
          description: Download resolution for the item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadInfo"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /items/{pid}/art:
    get:
      operationId: getItemArt
      summary: Get artwork
      description: >
        Artwork as image bytes: the original at full size, or a square-fit
        thumbnail when `size` is given. Besides item PIDs this endpoint also
        accepts album (`al-`), artist (`ar-`), and podcast show (`pc-`)
        PIDs, so search hits and subscription lists can render artwork
        directly. Items without any artwork in their fallback chain return
        404. Responses carry a content-addressed `ETag`; revalidate with
        `If-None-Match` instead of refetching.
      tags: [library]
      parameters:
        - $ref: "#/components/parameters/Pid"
        - name: size
          in: query
          description: >
            Longest-edge bound in pixels for a thumbnail. Omit for the
            original image.
          schema:
            type: integer
            minimum: 16
            maximum: 2048
        - name: If-None-Match
          in: header
          description: Previously returned `ETag`; a match answers 304 with no body.
          schema:
            type: string
      responses:
        "200":
          description: The artwork image.
          headers:
            ETag:
              description: Content-addressed validator for the returned bytes.
              schema:
                type: string
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
        "304":
          description: The cached copy is still current.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /items/{pid}/lyrics:
    get:
      operationId: getItemLyrics
      summary: Get an item's lyrics
      description: >
        Lyrics for the item: synced lines when available, an unsynced text
        block otherwise. 404 when the item has no lyrics at all.
      tags: [library]
      parameters:
        - $ref: "#/components/parameters/Pid"
      responses:
        "200":
          description: The item's lyrics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lyrics"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /items/{pid}/play-state:
    get:
      operationId: getPlayState
      summary: Get the caller's playback state for an item
      description: >
        The calling user's saved playback state for the item: resume
        position, play count, and flags. Items never played return a zero
        state, not a 404.
      tags: [playback]
      parameters:
        - $ref: "#/components/parameters/Pid"
      responses:
        "200":
          description: The caller's state for the item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayState"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"
    put:
      operationId: putPlayState
      summary: Checkpoint the caller's playback position
      description: >
        Persists the calling user's resume position for the item. Every call
        writes through, so clients keep the cadence coarse: checkpoint on
        pause, stop, and track change, and every few seconds during
        playback, never per tick.
      tags: [playback]
      parameters:
        - $ref: "#/components/parameters/Pid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayStateUpdate"
      responses:
        "204":
          description: Position saved.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /items/{pid}/star:
    put:
      operationId: setStar
      summary: Star or unstar an item
      description: >
        Sets the calling user's star on the item and returns the resulting
        playback state. Starring is idempotent: setting the current value
        again succeeds without changing the star's set time.
      tags: [playback]
      parameters:
        - $ref: "#/components/parameters/Pid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StarUpdate"
      responses:
        "200":
          description: The caller's updated state for the item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayState"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /items/{pid}/rating:
    put:
      operationId: setRating
      summary: Rate an item
      description: >
        Sets or clears the calling user's rating for the item and returns
        the resulting playback state. Ratings are 0 to 100; clients render
        them on whatever scale they like (a five-star widget maps to
        0/20/40/60/80/100). Null clears the rating.
      tags: [playback]
      parameters:
        - $ref: "#/components/parameters/Pid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RatingUpdate"
      responses:
        "200":
          description: The caller's updated state for the item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayState"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /items/{pid}/skip-map:
    get:
      operationId: getSkipMap
      summary: Get an item's silence skip map
      description: >
        Precomputed silence spans for client-side trimming of spoken-word
        content: clients skip a mapped span by seeking to its end, so
        positions stay honest on every platform and the hours-saved
        arithmetic is exact (trimming therefore needs a seekable
        stream). Maps are keyed to the item's audio essence and to the
        upstream detector version, so a re-encode or a detector
        revision invalidates them; offline clients compare the
        response's `essenceHash` against their download store to spot
        a stale stored map. Maps are per audio file: for a multi-file
        audiobook, pass `partIndex` to get the map of one part, with
        spans in that part's own timeline. Only podcast episodes and
        audiobooks are mapped; other items, and episodes whose audio
        is not fetched to the server yet, answer `unavailable` (an
        episode may become mappable after its fetch). When no map
        exists yet the server queues analysis and answers `pending`;
        poll again later (analysis runs in the background at low
        priority, and repeated polls coalesce onto the single queued
        analysis). Downloads for offline playback should fetch and
        store this map alongside the audio, or trimming silently stops
        working in airplane mode.
      tags: [playback]
      parameters:
        - $ref: "#/components/parameters/Pid"
        - name: partIndex
          in: query
          description: >
            Zero-based part of a multi-file audiobook to map. Ignored
            for single-file items.
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: The skip map, or its pending or unavailable state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkipMap"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /podcasts:
    get:
      operationId: listSubscriptions
      summary: List the caller's podcast subscriptions
      description: >
        Keyset-paginated list of the calling user's podcast subscriptions,
        each carrying the show summary and the caller's per-subscription
        settings. Ordering is stable (show title, then pid).
      tags: [podcasts]
      parameters:
        - name: cursor
          in: query
          description: >
            Opaque keyset cursor from a previous page's `nextCursor`. Omit for
            the first page.
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum subscriptions per page.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: One page of subscriptions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"
    post:
      operationId: subscribePodcast
      summary: Subscribe to a podcast
      description: >
        Subscribes the calling user to a show. The show is cataloged
        globally on first subscription (fetching and parsing the feed, or
        resolving a YouTube channel or playlist through the acquisition
        bridge when `sourceType` is `youtube`); later subscribers attach
        to the existing show without refetching. Subscribing to a show
        the caller already follows returns the existing subscription
        with its settings unchanged (200 instead of 201), except that
        supplied credentials always replace the show's stored
        credentials: re-subscribing with new credentials is the
        rotation path. Credentials are stored once per show (the last
        supplied set wins, whoever supplied it), apply to feed and
        enclosure fetches, and are sealed at rest and never returned by
        any endpoint. Supplying credentials marks the show private (a
        global, sticky property; see the show schema).
      tags: [podcasts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscribeRequest"
      responses:
        "201":
          description: Newly subscribed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "200":
          description: The caller was already subscribed to this show.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "501":
          $ref: "#/components/responses/SourceUnavailable"
        "502":
          $ref: "#/components/responses/FeedUnreachable"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /podcasts/opml:
    get:
      operationId: exportOpml
      summary: Export the caller's subscriptions as OPML
      description: >
        OPML 2.0 document of the calling user's subscriptions, with folder
        assignments rendered as nested outlines. Private shows (see the
        show schema's sticky privacy rule) are omitted entirely, for
        every exporting user: private feed URLs are secrets and never
        leave the server in an export.
      tags: [podcasts]
      responses:
        "200":
          description: The OPML document.
          content:
            application/xml:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"
    post:
      operationId: importOpml
      summary: Import subscriptions from OPML
      description: >
        Subscribes the calling user to every feed in the document,
        honoring folder outlines (nested outline titles become the
        subscription's folder path). Feeds that fail to fetch are
        reported per entry and do not fail the import. Already-followed
        feeds are left unchanged.
      tags: [podcasts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpmlImport"
      responses:
        "200":
          description: Per-feed import results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpmlImportResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /podcasts/{pid}:
    get:
      operationId: getPodcast
      summary: Get one show with the caller's subscription state
      description: >
        Show detail for any cataloged show, subscribed or not: the show
        summary with sanitized description, whether the calling user is
        subscribed, and their per-subscription settings when they are.
      tags: [podcasts]
      parameters:
        - $ref: "#/components/parameters/Pid"
      responses:
        "200":
          description: The show and the caller's subscription state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PodcastDetail"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"
    delete:
      operationId: unsubscribePodcast
      summary: Unsubscribe from a show
      description: >
        Removes the calling user's subscription. The show, its episodes,
        and every user's playback state stay in the catalog. By default
        downloaded files stay too, governed by the remaining
        subscribers' retention; with `removeDownloads` set, and only
        when the caller was the show's last subscriber, the downloaded
        audio moves into the library trash (archive, never delete:
        recoverable until purged, playback state untouched, episodes
        fetchable again after a re-subscribe). Files someone is
        listening to right now are skipped by that cleanup. While other
        subscribers remain the flag is ignored: the files are theirs as
        much as the caller's. Unsubscribing from a show the caller does
        not follow is a no-op success.
      tags: [podcasts]
      parameters:
        - $ref: "#/components/parameters/Pid"
        - name: removeDownloads
          in: query
          description: >
            Also move the show's downloaded audio to the trash when the
            caller is the last subscriber.
          schema:
            type: boolean
      responses:
        "204":
          description: The caller is not subscribed to this show anymore.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /podcasts/{pid}/settings:
    put:
      operationId: putSubscriptionSettings
      summary: Replace the caller's settings for a subscription
      description: >
        Full replace of the calling user's per-subscription settings.
        Absent fields reset to their defaults, so clients send the
        complete object (read it back from the subscription first).
        Retention resolves across subscribers as the most generous
        union, and sweeps are asynchronous: lowering `retentionKeep`
        enqueues a re-evaluation instead of deleting files inline.
      tags: [podcasts]
      parameters:
        - $ref: "#/components/parameters/Pid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionSettings"
      responses:
        "200":
          description: The updated subscription.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: >
            The caller is not subscribed to this show (code `not-found`);
            settings exist only on subscriptions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /podcasts/{pid}/episodes:
    get:
      operationId: listEpisodes
      summary: List a show's episodes
      description: >
        Keyset-paginated episodes of one show, newest first (publication
        date, then pid). Available to any caller who can see the show,
        subscribed or not.
      tags: [podcasts]
      parameters:
        - $ref: "#/components/parameters/Pid"
        - name: cursor
          in: query
          description: >
            Opaque keyset cursor from a previous page's `nextCursor`. Omit for
            the first page.
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum episodes per page.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: One page of episodes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpisodePage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /podcasts/{pid}/refresh:
    post:
      operationId: refreshPodcast
      summary: Refresh a show's feed now
      description: >
        Fetches the show's feed immediately (conditional GET; a feed that
        reports no change is cheap) and reports how many new episodes
        appeared. Subscribers only: refresh failures carry upstream
        detail, and a private feed's detail belongs to its subscribers.
        Refreshes are coalesced server-side: a show synced within the
        last minute answers from that sync instead of refetching. A
        repeatedly failing feed is auto-disabled from scheduled
        refresh; a successful manual refresh re-enables it.
      tags: [podcasts]
      parameters:
        - $ref: "#/components/parameters/Pid"
      responses:
        "200":
          description: Refresh outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResult"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: >
            The caller is not subscribed to this show (code
            `forbidden`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/FeedUnreachable"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /episodes/{pid}:
    get:
      operationId: getEpisode
      summary: Get one episode's detail
      description: >
        Full episode detail: summary fields plus sanitized show notes
        (`descriptionHtml` is feed-controlled HTML reduced server-side
        to a safe allowlist; clients may render it directly) and chapter
        marks when the episode has them.
      tags: [podcasts]
      parameters:
        - $ref: "#/components/parameters/Pid"
      responses:
        "200":
          description: The episode.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Episode"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /episodes/{pid}/transcript:
    get:
      operationId: getEpisodeTranscript
      summary: Get an episode's transcript
      description: >
        The episode's transcript as time-coded cues for display and
        tap-line-to-seek. Fetched from the feed's transcript pointer on
        first request and cached; the first call may take a moment. 404
        only when the episode announces no transcript; a pointer that
        exists but cannot be fetched or parsed answers
        `feed-unreachable`, so clients retry later instead of caching
        a false absence.
      tags: [podcasts]
      parameters:
        - $ref: "#/components/parameters/Pid"
      responses:
        "200":
          description: The transcript.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transcript"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/FeedUnreachable"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /episodes/{pid}/fetch:
    post:
      operationId: fetchEpisode
      summary: Fetch an episode's audio to the server
      description: >
        Queues a server-side download of the episode's enclosure into the
        library. The caller must be subscribed to the episode's show.
        The episode's item flips from remote to present when the fetch
        completes, which reaches clients as a catalog invalidation; a
        failed fetch surfaces as `fetchState: failed` with `fetchError`
        on the episode summary. Queuing an episode that is already
        downloaded or already queued is a no-op success; queuing a
        previously failed one retries it.
      tags: [podcasts]
      parameters:
        - $ref: "#/components/parameters/Pid"
      responses:
        "202":
          description: The fetch is queued (or the episode is already present).
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: >
            The caller is not subscribed to this episode's show (code
            `forbidden`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"
    delete:
      operationId: removeEpisodeDownload
      summary: Remove an episode's fetched audio from the server
      description: >
        The inverse of the fetch: moves the episode's audio into the
        library trash and returns the episode to its not-fetched state,
        which reaches clients as a catalog invalidation. Archive, never
        delete: every user's playback state survives, the audio is
        recoverable from the trash until it is purged, and the episode
        can be fetched again at any time. The caller must be subscribed
        to the show (the file is shared; any subscriber may reclaim the
        space). Removing an episode that is not fetched is a no-op
        success that also cancels a queued fetch; an episode someone is
        listening to right now answers `conflict` (retry when playback
        stops).
      tags: [podcasts]
      parameters:
        - $ref: "#/components/parameters/Pid"
      responses:
        "204":
          description: The episode's audio is not on the server anymore.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: >
            The caller is not subscribed to this episode's show (code
            `forbidden`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            The episode is being listened to right now (code
            `conflict`); removing the file would kill the stream.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /books/{pid}:
    get:
      operationId: getBook
      summary: Get one audiobook's detail
      description: >
        Full audiobook detail: contributors, series membership, chapters
        on the book timeline, backing parts in reading order, and the
        calling user's per-book playback settings. Positions everywhere
        on this surface are book-timeline milliseconds spanning all
        parts.
      tags: [books]
      parameters:
        - $ref: "#/components/parameters/Pid"
      responses:
        "200":
          description: The book.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookDetail"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /books/{pid}/resume:
    get:
      operationId: getBookResume
      summary: Where the caller left off in a book
      description: >
        The calling user's resume point on the book timeline, with the
        chapter that position falls in (when the book has chapters).
        This is the cross-device resume answer: the position reflects
        the newest checkpoint from any device after the server's
        per-medium reconciliation.
      tags: [books]
      parameters:
        - $ref: "#/components/parameters/Pid"
      responses:
        "200":
          description: The caller's resume point.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookResume"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /books/{pid}/settings:
    put:
      operationId: putBookSettings
      summary: Replace the caller's playback settings for a book
      description: >
        Full replace of the calling user's per-book playback settings
        (speed memory, voice boost, silence trimming). Absent fields
        reset to their defaults, so clients send the complete object.
      tags: [books]
      parameters:
        - $ref: "#/components/parameters/Pid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookSettings"
      responses:
        "200":
          description: The stored settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookSettings"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /play-states:
    post:
      operationId: listPlayStates
      summary: Read the caller's playback state for many items
      description: >
        Batch read of the calling user's playback state, for hydrating a
        client mirror without one request per item (a device restoring
        thousands of downloads asks in pages of 500). A POST because the
        PID list rides the body; nothing changes server-side. The
        response carries states only for requested items the caller can
        see and has ever touched; an absent PID means a zero state (or no
        visibility, which looks identical by design). Order is not
        significant.
      tags: [playback]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayStateQuery"
      responses:
        "200":
          description: The caller's states for the requested items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayStateList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /listens:
    post:
      operationId: reportListens
      summary: Report listen sessions
      description: >
        Ingests one or more listen sessions. Every session carries a
        client-generated idempotency ID; the server deduplicates on ingest,
        so replaying a batch (an offline queue flushing alongside a live
        report of the same session) can never double-count. Sessions from
        other services ride the same path with `source` set, carrying their
        original timestamps (backdated imports). Per-session rejections in
        the response are permanent (the session can never be recorded);
        transient conditions fail the whole request instead, and clients
        retry the batch, which deduplication makes safe.
      tags: [playback]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListenReport"
      responses:
        "200":
          description: Ingest outcome for the batch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListenIngestResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /sync/catalog:
    get:
      operationId: syncCatalog
      summary: Mirror the catalog (snapshot or changed-since delta)
      description: >
        The catalog half of delta sync, feeding client-side library mirrors
        with hydrated item summaries (episodes carry their full episode
        summaries, and podcast shows ride the same stream as
        `upsert-show` entries; see the entry schema). Shows and episodes
        are scoped to the caller's own subscriptions, and a subscription
        change retires the caller's cursors the same way a visibility
        grant change does (410 `sync-reset`, then re-mirror). Two modes.
        Without `since`: a snapshot, keyset-paged via `cursor`; every
        page carries
        `nextSince`, an opaque change cursor captured at or before the
        first page's read, which the client stores and syncs from after
        mirroring every page (changes landing mid-snapshot are covered by
        the first delta). With `since`: the changes after that cursor, as
        `upsert` entries carrying fresh summaries and `delete` tombstones
        for items that no longer exist or whose change left them outside
        the caller's library visibility (a file re-homed under an
        ungranted root keeps its item PID; a tombstone for an item never
        mirrored is a no-op); entries are coalesced within a page (an item may
        recur on later pages; application is idempotent, latest wins).
        The returned `nextSince` advances the cursor, and `more` signals
        another page should be fetched immediately. Snapshots contain
        only items the caller can see, and a change to the caller's
        visibility grants invalidates their catalog cursors, so the next
        delta answers 410 `sync-reset` and the re-snapshot reflects the
        new grants. 410 likewise answers any cursor the server can no
        longer serve contiguously (pruned change history, a rebuilt
        catalog): drop the mirror and snapshot again. Snapshot-minted
        cursors stay serviceable for at least the server's change
        retention horizon. The WebSocket channel (`api/events.md`)
        signals when to pull deltas; polling works without it.
      tags: [sync]
      parameters:
        - name: since
          in: query
          description: >
            Opaque change cursor from a previous response's `nextSince`.
            Mutually exclusive with `cursor`.
          schema:
            type: string
        - name: cursor
          in: query
          description: >
            Opaque keyset cursor from a previous snapshot page's
            `nextCursor`. Omit together with `since` for the first
            snapshot page.
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum entries per page.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 500
      responses:
        "200":
          description: One page of the snapshot or delta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogSyncPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "410":
          $ref: "#/components/responses/SyncReset"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /sync/server:
    get:
      operationId: syncServer
      summary: Mirror the caller's server-side state (changed-since delta)
      description: >
        The server half of delta sync: the calling user's own state
        changes (playback state, preferences, podcast subscriptions,
        per-book settings), on the server change cursor. Without
        `since` it mints a fresh cursor (`nextSince` with no events):
        new mirrors start there and hydrate the play states they care
        about through `/play-states` (play states are only meaningful
        for items a client holds), subscriptions through `/podcasts`,
        and book settings through the book detail. With `since` it returns
        the caller's events after that cursor with freshly hydrated
        state, coalesced within a page (an item may recur on later pages;
        application is idempotent), plus `more` for immediate
        continuation. Only the caller's own state ever appears here. A
        `since` the server can no longer serve contiguously answers 410
        `sync-reset`: re-mint and re-hydrate.
      tags: [sync]
      parameters:
        - name: since
          in: query
          description: >
            Opaque server change cursor from a previous response's
            `nextSince`. Omit to mint a fresh cursor.
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum events per page.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 500
      responses:
        "200":
          description: One page of the caller's state changes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerSyncPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "410":
          $ref: "#/components/responses/SyncReset"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: waxdeck_session
      description: HttpOnly SameSite=Lax session cookie (web).
    bearerAuth:
      type: http
      scheme: bearer
      description: Per-device rotating bearer token (native clients).

  parameters:
    Pid:
      name: pid
      in: path
      required: true
      description: Type-prefixed PID (e.g. `tr-01JZX5N8QW3F4V9T2B7KD3M9R6`).
      schema:
        type: string
        pattern: "^[a-z]{2}-[0-9A-HJKMNP-TV-Z]{26}$"
    UserId:
      name: userId
      in: path
      required: true
      description: User PID (e.g. `us-01JZX5N8QW3F4V9T2B7KD3M9R6`).
      schema:
        type: string
        pattern: "^us-[0-9A-HJKMNP-TV-Z]{26}$"
    SessionId:
      name: sessionId
      in: path
      required: true
      description: Session PID (e.g. `se-01JZX5N8QW3F4V9T2B7KD3M9R6`).
      schema:
        type: string
        pattern: "^se-[0-9A-HJKMNP-TV-Z]{26}$"
    AppPasswordId:
      name: appPasswordId
      in: path
      required: true
      description: App password PID (e.g. `ap-01JZX5N8QW3F4V9T2B7KD3M9R6`).
      schema:
        type: string
        pattern: "^ap-[0-9A-HJKMNP-TV-Z]{26}$"

  responses:
    InvalidRequest:
      description: Malformed request (bad cursor, invalid parameter, bad body).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthenticated:
      description: >
        No valid credentials were presented: a missing or invalid
        session, bearer token, login password, or one-time code.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The caller is authenticated but not allowed to do this.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No resource with that PID is visible to the caller.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The request conflicts with current state (for example, a running job).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    CatalogMaintenance:
      description: >
        The catalog is temporarily handed to a maintenance operation (code
        `catalog-maintenance`). Retry shortly; already-playing streams are
        unaffected.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Too many attempts (code `rate-limited`). Back off and retry later.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SyncReset:
      description: >
        The sync cursor predates the retained change history or belongs to
        a previous catalog generation (code `sync-reset`). Drop the local
        mirror and re-mirror from a fresh snapshot.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    FeedUnreachable:
      description: >
        An upstream feed could not be fetched or parsed (code
        `feed-unreachable`): its server answered an error, timed out, or
        returned something that is not a feed. The message carries the
        upstream detail, except that for private shows it never includes
        the feed URL or credentials (upstream error text routinely
        embeds the request URL, and for a tokenized feed that URL is
        the secret).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SourceUnavailable:
      description: >
        The request needs an acquisition source integration that this
        server is not running (code `source-unavailable`), for example a
        YouTube subscription on a server without the YouTube bridge.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Health:
      type: object
      description: Liveness and version information.
      required: [status, version, apiVersion]
      properties:
        status:
          type: string
          description: Always `ok` when the server can respond.
          example: ok
        version:
          type: string
          description: Server build version.
          example: 0.1.0-dev
        apiVersion:
          type: integer
          description: Major API version served under `/api/v1`.
          example: 1

    Error:
      type: object
      description: >
        Structured error. `code` is a stable machine-readable string (see the
        API-level description for defined codes); `message` is human-readable
        and not stable.
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable error code.
          example: not-found
        message:
          type: string
          description: Human-readable explanation (not stable, do not parse).
          example: no item with pid tr-01JZX5N8QW3F4V9T2B7KD3M9R6

    LoginRequest:
      type: object
      description: Credentials for local-account login.
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          description: Account username.
          example: admin
        password:
          type: string
          minLength: 1
          format: password
          description: Account password.
        deviceName:
          type: string
          maxLength: 128
          description: >
            Human-readable label for this session in the device list (for
            example `Pixel 9` or `Study desktop`). Native clients pass one;
            web logins usually omit it.

    LoginResponse:
      type: object
      description: Established session plus a bearer token for native clients.
      required: [user, token, csrfToken]
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string
          description: >
            Opaque bearer token equivalent to the session cookie. Native
            clients store it in the OS keychain; web clients ignore it and rely
            on the cookie.
        csrfToken:
          type: string
          description: >
            CSRF token for cookie-authenticated mutations (sent back as the
            `X-CSRF-Token` header). Irrelevant to bearer-token callers.

    SessionInfo:
      type: object
      description: Whether the caller is authenticated, and as whom.
      required: [authenticated]
      properties:
        authenticated:
          type: boolean
          description: True when a valid session or token was presented.
        user:
          $ref: "#/components/schemas/User"
        csrfToken:
          type: string
          description: >
            CSRF token for cookie-authenticated mutations. Present only when
            authenticated.

    User:
      type: object
      description: A WaxDeck account as visible to its owner.
      required: [id, username, roles]
      properties:
        id:
          type: string
          description: Stable user identifier.
          example: us-01JZX5N8QW3F4V9T2B7KD3M9R6
        username:
          type: string
          description: Login name.
          example: admin
        displayName:
          type: string
          description: Optional display name; falls back to `username`.
        roles:
          type: array
          description: Assigned roles (`admin`, `user`).
          items:
            type: string
            example: admin

    UserAccount:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          description: Administrative account fields beyond the self view.
          required: [disabled, libraryAccess, createdAt]
          properties:
            disabled:
              type: boolean
              description: >
                Disabled accounts cannot log in and their live sessions are
                revoked on disable.
            libraryAccess:
              $ref: "#/components/schemas/LibraryAccess"
            createdAt:
              type: string
              format: date-time
              description: When the account was created.
            hasPassword:
              type: boolean
              description: >
                Whether local password login is enabled for the account
                (false for accounts provisioned by OIDC that never set one).
            identities:
              type: array
              description: Linked single sign-on identities.
              items:
                $ref: "#/components/schemas/LinkedIdentity"
      description: An account as visible to administrators (and to its owner).

    LinkedIdentity:
      type: object
      description: One linked OIDC identity.
      required: [provider]
      properties:
        provider:
          type: string
          description: Provider id the identity belongs to.
          example: dex
        email:
          type: string
          description: Email reported by the provider at last login, if any.

    LibraryAccess:
      type: object
      description: >
        Which libraries an account can see. `all` grants every library
        including ones added later; `granted` limits visibility to
        `libraryPids`. Administrators always see everything regardless of
        this setting.
      required: [mode]
      properties:
        mode:
          type: string
          enum: [all, granted]
          description: Access mode.
        libraryPids:
          type: array
          description: >
            Visible libraries when mode is `granted`; ignored for `all`.
          items:
            type: string
            example: lb-01JZX5N8QW3F4V9T2B7KD3M9R6

    Role:
      type: string
      enum: [admin, user]
      description: >
        An assignable account role. A shared named schema on purpose:
        identical inline enums make the Dart generator emit one enum class
        into two files, which does not compile.

    UserCreate:
      type: object
      description: A new local account.
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: >
            Login name, unique case-insensitively. Leading and trailing
            whitespace is rejected.
          example: frodo
        password:
          type: string
          minLength: 8
          format: password
          description: Initial password (at least 8 characters).
        displayName:
          type: string
          maxLength: 128
          description: Optional display name.
        roles:
          type: array
          description: Assigned roles; defaults to `[user]`.
          items:
            $ref: "#/components/schemas/Role"
        libraryAccess:
          $ref: "#/components/schemas/LibraryAccess"

    UserUpdate:
      type: object
      description: >
        Partial account update: absent fields are unchanged. Setting
        `displayName` to the empty string clears it.
      properties:
        displayName:
          type: string
          maxLength: 128
          description: New display name; empty clears it.
        roles:
          type: array
          description: Replacement role set.
          items:
            $ref: "#/components/schemas/Role"
        disabled:
          type: boolean
          description: >
            Disable or re-enable the account. Disabling revokes its live
            sessions.
        libraryAccess:
          $ref: "#/components/schemas/LibraryAccess"

    UserPage:
      type: object
      description: One keyset-paginated page of accounts.
      required: [users]
      properties:
        users:
          type: array
          description: Accounts ordered by username.
          items:
            $ref: "#/components/schemas/UserAccount"
        nextCursor:
          type: string
          description: Opaque cursor for the next page. Absent on the last page.

    PasswordChange:
      type: object
      description: A password change.
      required: [newPassword]
      properties:
        currentPassword:
          type: string
          format: password
          description: >
            The account's current password. Required when changing your own
            password; administrators resetting another account omit it.
        newPassword:
          type: string
          minLength: 8
          format: password
          description: The new password (at least 8 characters).

    BootstrapStatus:
      type: object
      description: Whether first-run setup is still waiting for an administrator.
      required: [required]
      properties:
        required:
          type: boolean
          description: True while the server has no enabled administrator.

    BootstrapRequest:
      type: object
      description: The first administrator account.
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: Administrator login name.
          example: admin
        password:
          type: string
          minLength: 8
          format: password
          description: Administrator password (at least 8 characters).
        displayName:
          type: string
          maxLength: 128
          description: Optional display name.

    DeviceSession:
      type: object
      description: One live session, as shown in the device list.
      required: [id, kind, createdAt, current]
      properties:
        id:
          type: string
          description: Session identifier.
          example: se-01JZX5N8QW3F4V9T2B7KD3M9R6
        kind:
          type: string
          enum: [web, device]
          description: >
            `web` sessions authenticate with the cookie; `device` sessions
            with a bearer token.
        deviceName:
          type: string
          description: Client-supplied label, when the login provided one.
        client:
          type: string
          description: Client software hint (from the login's user agent).
        createdAt:
          type: string
          format: date-time
          description: When the session was established.
        lastSeenAt:
          type: string
          format: date-time
          description: When the session last made a request (coarse, minutes).
        current:
          type: boolean
          description: True for the session serving this request.

    SessionList:
      type: object
      description: The caller's live sessions, newest first.
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/DeviceSession"

    OidcProvider:
      type: object
      description: One configured OIDC provider.
      required: [id, displayName, startUrl]
      properties:
        id:
          type: string
          description: Stable provider id, referenced by `/auth/oidc/start`.
          example: dex
        displayName:
          type: string
          description: Human-readable name for the login button.
          example: Company SSO
        startUrl:
          type: string
          description: >
            Origin-relative URL that starts this provider's login flow
            (web mode; other modes add their query parameters).
          example: /api/v1/auth/oidc/start?provider=dex

    OidcProviders:
      type: object
      description: The configured OIDC providers.
      required: [providers]
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/OidcProvider"

    OidcExchangeRequest:
      type: object
      description: A one-time OIDC completion code to redeem for a session.
      required: [code]
      properties:
        code:
          type: string
          minLength: 1
          description: The one-time code delivered by the flow's redirect or code page.
        verifier:
          type: string
          description: >
            The secret whose SHA-256 was sent as `challenge` when the
            flow started. Required when the flow carried a challenge;
            a missing or wrong value fails the exchange.
        deviceName:
          type: string
          maxLength: 128
          description: Device-list label for the resulting session.

    Prefs:
      type: object
      additionalProperties: false
      description: >
        Per-user preferences that sync across clients. All fields are
        optional; unset fields are absent and clients apply their own
        defaults. Unknown fields are rejected.
      properties:
        timezone:
          type: string
          description: >
            IANA timezone name (for example `Europe/Amsterdam`). Drives
            streaks, heatmaps, and other calendar-bucketed statistics.
          example: America/Denver
        locale:
          type: string
          description: Preferred BCP 47 locale tag (for example `en-US`).
          example: en-US
        theme:
          type: string
          enum: [system, dark, light, oled]
          description: Preferred app theme.

    AppPassword:
      type: object
      description: One app password, without its secret.
      required: [id, label, createdAt]
      properties:
        id:
          type: string
          description: App password PID.
          example: ap-01JZX5N8QW3F4V9T2B7KD3M9R6
        label:
          type: string
          description: Human-readable label given at creation.
          example: Symfonium on Pixel 9
        createdAt:
          type: string
          format: date-time
          description: When the app password was created.
        lastUsedAt:
          type: string
          format: date-time
          description: >
            When the app password last authenticated a request (coarse,
            minutes). Absent when it has never been used.

    AppPasswordList:
      type: object
      description: The caller's app passwords, newest first.
      required: [appPasswords]
      properties:
        appPasswords:
          type: array
          items:
            $ref: "#/components/schemas/AppPassword"

    AppPasswordCreate:
      type: object
      description: A new app password.
      required: [label]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 128
          description: >
            Label shown in the app password list, usually the client app
            this password is for.
          example: Symfonium on Pixel 9

    AppPasswordCreated:
      allOf:
        - $ref: "#/components/schemas/AppPassword"
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: >
                The generated password, shown exactly once. The client
                authenticates against the compatibility APIs with the
                account's username and this value.
      description: A newly created app password, including its one-time-visible secret.

    Library:
      type: object
      description: One catalog library (a scanned root).
      required: [pid, name]
      properties:
        pid:
          type: string
          description: Library PID.
          example: lb-01JZX5N8QW3F4V9T2B7KD3M9R6
        name:
          type: string
          description: Display name (the configured root name).
          example: music
        media:
          type: string
          description: >
            Content class the library holds. Currently `music`,
            `audiobook`, `podcast`, or `mixed`; new values may appear.
          example: music

    Libraries:
      type: object
      description: All catalog libraries.
      required: [libraries]
      properties:
        libraries:
          type: array
          items:
            $ref: "#/components/schemas/Library"

    StarUpdate:
      type: object
      description: A star or unstar.
      required: [starred]
      properties:
        starred:
          type: boolean
          description: The new star state.
        recordedAt:
          type: string
          format: date-time
          description: >
            When the change was made on the client, sent only when
            replaying an offline queue. The server skips the write when
            the item's star changed more recently than this, so a stale
            offline toggle never resurrects an undone state. Live
            mutations omit it and always apply.

    RatingUpdate:
      type: object
      description: A rating change.
      required: [rating]
      properties:
        rating:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
          description: The new rating (0 to 100), or null to clear it.
        recordedAt:
          type: string
          format: date-time
          description: >
            When the change was made on the client, sent only when
            replaying an offline queue. The server skips the write when
            the item's rating changed more recently than this. Live
            mutations omit it and always apply.

    MediaType:
      type: string
      description: The three first-class media types.
      enum: [music, podcast, audiobook]

    DiscoveryList:
      type: string
      description: >
        Discovery lists for browsing. `most-played`, `recently-played`, and
        `starred` reflect the calling user's own listening state.
      enum:
        - newest
        - recently-added
        - most-played
        - recently-played
        - random
        - starred
        - alphabetical

    SearchHit:
      type: object
      description: One ranked search hit.
      required: [pid, kind, title]
      properties:
        pid:
          type: string
          description: Type-prefixed ULID of the hit.
          example: tr-01JZX5N8QW3F4V9T2B7KD3M9R6
        kind:
          type: string
          description: What the hit is (`artist`, `album`, `track`, `book`, `episode`).
          example: track
        title:
          type: string
          description: Display title.
        subtitle:
          type: string
          description: Context line (artist for a track, author for a book).

    SearchResults:
      type: object
      description: Search results grouped by kind, ranked within each group.
      required: [query, artists, albums, tracks, books, episodes]
      properties:
        query:
          type: string
          description: The query these results answer.
        artists:
          type: array
          items:
            $ref: "#/components/schemas/SearchHit"
        albums:
          type: array
          items:
            $ref: "#/components/schemas/SearchHit"
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/SearchHit"
        books:
          type: array
          items:
            $ref: "#/components/schemas/SearchHit"
        episodes:
          type: array
          items:
            $ref: "#/components/schemas/SearchHit"
        truncated:
          type: boolean
          description: True when any group was capped at the limit.

    Job:
      type: object
      description: A server-run catalog job.
      required: [pid, kind, state]
      properties:
        pid:
          type: string
          description: Job PID.
          example: jb-01JZX5N8QW3F4V9T2B7KD3M9R6
        kind:
          type: string
          description: What the job does (`scan`, `analyze`, `enrich`, `organize`).
          example: scan
        state:
          type: string
          description: >
            Job lifecycle state. Currently `running`, `done`, `failed`,
            `crashed`, or `canceled`; new states may appear, and clients
            must treat unknown values as "not finished successfully yet"
            rather than failing.
          example: running
        progress:
          type: number
          format: double
          description: >
            Completion fraction in [0, 1]. Absent when the job has not yet
            reported progress or cannot estimate it.
        message:
          type: string
          description: Human-readable progress note.
        error:
          type: string
          description: Failure detail for `failed`/`crashed` jobs.

    Lyrics:
      type: object
      description: >
        Lyrics for one item. At least one of `synced` and `unsynced` is
        non-empty.
      required: [pid, source]
      properties:
        pid:
          type: string
          description: The item these lyrics belong to.
        source:
          type: string
          description: Where the lyrics came from (`lrc` sidecar, `embedded` tag).
          example: lrc
        synced:
          type: array
          description: Time-synced lines, ordered by `timeMs`.
          items:
            $ref: "#/components/schemas/SyncedLine"
        unsynced:
          type: string
          description: Plain text block when no synced lines exist.

    SyncedLine:
      type: object
      description: One time-synced lyric line.
      required: [timeMs, text]
      properties:
        timeMs:
          type: integer
          format: int64
          description: Line start in milliseconds.
        text:
          type: string
          description: Line text.

    PlayState:
      type: object
      description: The calling user's playback state for one item.
      required: [pid, positionMs, played, finished, playCount, starred]
      properties:
        pid:
          type: string
          description: The item this state belongs to.
        positionMs:
          type: integer
          format: int64
          description: >
            Resume position in milliseconds. For multi-file audiobooks
            this is always a book-timeline position spanning all parts.
        played:
          type: boolean
          description: >
            Whether the item has crossed its played threshold. The
            server derives this from the position reached against the
            item's full duration (per-medium thresholds), never from a
            listened-milliseconds ratio, so silence trimming and speed
            changes cannot distort it.
        finished:
          type: boolean
          description: >
            Whether the item was completed. For multi-file audiobooks
            the server derives completion from the book-timeline
            position; a client-reported finished flag alone does not
            finish a book.
        playCount:
          type: integer
          description: How many times the item has been played.
        starred:
          type: boolean
          description: Whether the caller starred the item.
        rating:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
          description: The caller's rating (0 to 100); absent or null when unrated.
        updatedAt:
          type: string
          format: date-time
          description: When this state last changed.

    PlayStateQuery:
      type: object
      description: A batch play-state read request.
      required: [pids]
      properties:
        pids:
          type: array
          minItems: 1
          maxItems: 500
          description: Items to read the caller's state for.
          items:
            type: string
            example: tr-01JZX5N8QW3F4V9T2B7KD3M9R6

    PlayStateList:
      type: object
      description: The caller's playback states for a requested batch.
      required: [states]
      properties:
        states:
          type: array
          description: >
            One entry per requested item with recorded state; items with
            zero state are absent.
          items:
            $ref: "#/components/schemas/PlayState"

    PlayStateUpdate:
      type: object
      description: A resume-position checkpoint.
      required: [positionMs]
      properties:
        positionMs:
          type: integer
          format: int64
          minimum: 0
          description: >
            Playback position in milliseconds. For multi-file
            audiobooks always a book-timeline position (play-info's
            `partStartMs` plus the in-part position).
        recordedAt:
          type: string
          format: date-time
          description: >
            When the checkpoint was recorded on the client, sent only when
            replaying an offline queue. The server reconciles replays per
            medium: audiobooks and long tracks are recency-primary (the
            most recently recorded position wins, so a stale replay never
            drags a 14-hour book backward or forward), while music and
            podcast episodes are furthest-position-wins with a recency
            guard (the further position wins unless the nearer one is
            substantially more recent, honoring a deliberate rewind).
            Future-dated values are clamped to the server clock. Live
            checkpoints omit it and always apply. The response does not
            reveal whether a replay was applied or skipped: after
            flushing an offline queue, clients learn the winning state
            through `/sync/server` (a skipped replay means the winner is
            already in the event stream).

    ListenSession:
      type: object
      description: >
        One listen session as reported by a client. `sessionId` is a
        client-generated idempotency ID; replaying a session with the same
        ID never double-counts. Deduplication is per user across all of the
        user's clients, so IDs must be globally random (ULID or UUID), never
        a per-device counter.
      required: [sessionId, pid, startedAt, msPlayed]
      properties:
        sessionId:
          type: string
          minLength: 1
          maxLength: 64
          description: >
            Client-generated idempotency ID for this session, unique across
            all of the user's clients (use a ULID or UUID).
          example: 01JZX5N8QW3F4V9T2B7KD3M9R6
        pid:
          type: string
          description: The item that was played.
          example: tr-01JZX5N8QW3F4V9T2B7KD3M9R6
        startedAt:
          type: string
          format: date-time
          description: >
            When playback started. Historical for backdated imports; the
            server preserves it as reported.
        msPlayed:
          type: integer
          format: int64
          minimum: 0
          description: Milliseconds actually heard (excludes pauses and seeks).
        finished:
          type: boolean
          description: Whether playback reached the end of the item.
        client:
          type: string
          maxLength: 128
          description: Client identifier (app name and platform).
          example: waxdeck-web
        source:
          type: string
          description: >
            Where the session originates. `live` is a WaxDeck client
            reporting its own playback; `import` is a backdated session from
            another service's history.
          enum: [live, import]
          default: live

    ListenReport:
      type: object
      description: A batch of listen sessions (a flush of an offline queue, or one live session).
      required: [sessions]
      properties:
        sessions:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: "#/components/schemas/ListenSession"

    ListenIngestResult:
      type: object
      description: Outcome of a listen ingest batch.
      required: [accepted, duplicates]
      properties:
        accepted:
          type: integer
          description: Sessions recorded for the first time.
        duplicates:
          type: integer
          description: Sessions already recorded (replay of a known `sessionId`); ignored without error.
        rejected:
          type: array
          description: Sessions that could not be recorded at all (unknown item, malformed fields).
          items:
            $ref: "#/components/schemas/RejectedListen"

    RejectedListen:
      type: object
      description: One session the server refused, and why.
      required: [sessionId, code, message]
      properties:
        sessionId:
          type: string
          description: The refused session's idempotency ID.
        code:
          type: string
          description: Stable machine-readable reason (`not-found`, `invalid-request`).
        message:
          type: string
          description: Human-readable explanation.

    ItemSummary:
      type: object
      description: >
        Compact item representation used by list endpoints and client-side
        library mirrors (~summary row).
      required: [pid, mediaType, title, durationMs]
      properties:
        pid:
          type: string
          description: Type-prefixed ULID.
          example: tr-01JZX5N8QW3F4V9T2B7KD3M9R6
        mediaType:
          $ref: "#/components/schemas/MediaType"
        title:
          type: string
          description: Display title.
          example: Prancing Pony Blues
        artist:
          type: string
          description: Primary display artist / author / show name.
        album:
          type: string
          description: Album / series / podcast title, when applicable.
        durationMs:
          type: integer
          format: int64
          description: >
            Duration in milliseconds. For a multi-file audiobook this
            is the total across all parts; for a not-yet-fetched
            podcast episode it is the feed-declared duration, or 0
            when the feed declares none.
          example: 214000
        artUrl:
          type: string
          description: >
            Origin-relative URL of the item's artwork endpoint. Always
            populated; the endpoint itself returns 404 for items with no
            artwork, so clients keep a placeholder ready.
          example: /api/v1/items/tr-01JZX5N8QW3F4V9T2B7KD3M9R6/art

    Item:
      allOf:
        - $ref: "#/components/schemas/ItemSummary"
        - type: object
          description: Extended detail fields beyond the summary row.
          properties:
            genres:
              type: array
              description: Display genres.
              items:
                type: string
                example: blues
            year:
              type: integer
              description: Release / publication year.
              example: 2024
            trackNumber:
              type: integer
              description: Track position within its disc (music).
            discNumber:
              type: integer
              description: Disc number within a multi-disc release (music).
            codec:
              type: string
              description: Source audio codec.
              example: flac
            container:
              type: string
              description: Source file container.
              example: flac
            sampleRate:
              type: integer
              description: Source sample rate in Hz.
              example: 44100
            bitrate:
              type: integer
              description: Source bitrate in bits per second, when known.
            addedAt:
              type: string
              format: date-time
              description: When the item entered the library.
      description: Full detail for a single library item.

    ItemPage:
      type: object
      description: One keyset-paginated page of items.
      required: [items]
      properties:
        items:
          type: array
          description: Items in stable order.
          items:
            $ref: "#/components/schemas/ItemSummary"
        nextCursor:
          type: string
          description: >
            Opaque cursor for the next page. Absent on the last page.
        seed:
          type: integer
          format: int64
          description: >
            The effective shuffle seed. Present only on `random` browse
            pages; pass it back together with `nextCursor` so later pages
            keep the same order.

    CatalogSyncEntry:
      type: object
      description: >
        One mirrored catalog change: an `upsert` carrying the item's
        current summary, an `upsert-show` carrying a podcast show's
        current summary (shows are catalog entities but not items, so
        they ride their own operation and clients from before this
        operation existed drop them harmlessly), or a `delete`
        tombstone carrying only the PID (which removes the PID from
        whichever mirror table holds it). An `upsert` for a podcast
        episode carries `item` and additionally `episode`, the full
        episode summary; clients that only know items keep reading
        `item`. Snapshot pages contain only upserts, of both kinds.
        `op` is a string, not a closed enum, so new operations can
        appear; clients must drop entries whose `op` they do not
        recognize.
      required: [op, pid]
      properties:
        op:
          type: string
          description: >
            What the mirror should do with this entry: `upsert` (store
            `item`, and `episode` when present), `upsert-show` (store
            `show`), or `delete` (remove the PID).
          example: upsert
        pid:
          type: string
          description: The item or show the entry is about.
          example: tr-01JZX5N8QW3F4V9T2B7KD3M9R6
        item:
          $ref: "#/components/schemas/ItemSummary"
        episode:
          $ref: "#/components/schemas/EpisodeSummary"
        show:
          $ref: "#/components/schemas/PodcastShow"

    CatalogSyncPage:
      type: object
      description: One page of catalog sync entries (snapshot or delta).
      required: [entries, nextSince]
      properties:
        entries:
          type: array
          description: Mirror entries, coalesced within the page.
          items:
            $ref: "#/components/schemas/CatalogSyncEntry"
        nextCursor:
          type: string
          description: >
            Keyset cursor for the next snapshot page. Absent on the last
            snapshot page and on delta pages.
        nextSince:
          type: string
          description: >
            Opaque change cursor to sync from next. On snapshot pages it
            repeats the cursor captured at the snapshot's start; on delta
            pages it advances past this page's changes.
        more:
          type: boolean
          description: >
            True when another delta page is already available; fetch it
            immediately with `since` set to this page's `nextSince`.
            Absent in snapshot mode (`nextCursor` plays that role).

    ServerSyncEvent:
      type: object
      description: >
        One change to the calling user's server-side state, with the
        current value hydrated fresh. `kind` is a string, not a closed
        enum, so new kinds can appear; clients must skip events whose
        `kind` they do not recognize.
      required: [kind]
      properties:
        kind:
          type: string
          description: >
            What changed: `play-state` (carries `pid` and `playState`),
            `prefs` (carries `prefs`), `subscription` (carries `pid`, the
            show; `subscription` is the current state, absent when the
            caller unsubscribed), or `book-settings` (carries `pid`, the
            book, and `bookSettings`).
          example: play-state
        pid:
          type: string
          description: >
            The item, show, or book the event is about (absent for
            `prefs`).
          example: tr-01JZX5N8QW3F4V9T2B7KD3M9R6
        playState:
          $ref: "#/components/schemas/PlayState"
        prefs:
          $ref: "#/components/schemas/Prefs"
        subscription:
          $ref: "#/components/schemas/Subscription"
        bookSettings:
          $ref: "#/components/schemas/BookSettings"

    ServerSyncPage:
      type: object
      description: One page of the caller's server-side state changes.
      required: [events, nextSince]
      properties:
        events:
          type: array
          description: State changes, coalesced within the page.
          items:
            $ref: "#/components/schemas/ServerSyncEvent"
        nextSince:
          type: string
          description: Opaque server change cursor to sync from next.
        more:
          type: boolean
          description: >
            True when another page is already available; fetch it
            immediately with `since` set to this page's `nextSince`.

    WsSubscribeFrame:
      type: object
      description: >
        The WebSocket subscribe frame, sent by the client as the first and
        only client-to-server message on the event channel (transport in
        `api/events.md`). Clients pass the cursors their mirror is at; a
        client with no mirror yet omits them, receives only live
        invalidations, and snapshots through the sync endpoints (before
        or after subscribing; both orders are sound because invalidations
        carry no data).
      properties:
        catalogSince:
          type: string
          description: The client's opaque catalog change cursor.
        serverSince:
          type: string
          description: The client's opaque server change cursor.
        topics:
          type: array
          description: >
            Topics to receive (`catalog`, `user`). Omit for all topics.
            Unknown topic names are ignored.
          items:
            type: string
            example: catalog

    WsEventFrame:
      type: object
      description: >
        One server-to-client frame on the WebSocket event channel
        (transport in `api/events.md`). An `invalidate` frame tells the
        client the named stream moved: pull the matching sync endpoint
        (`catalog` topic, `/sync/catalog`; `user` topic, `/sync/server`)
        from the client's own cursor. Invalidations are coalesced
        server-side, so one frame can cover many changes, and carry no
        data, so a redundant pull is harmless. A `resync` frame means
        continuity was lost for the named stream, or for every stream
        when `topic` is absent (client queue overflow, pruned history):
        drop the affected mirror halves, re-mirror through the sync
        endpoints, then close the socket, reconnect, and resubscribe
        with the fresh cursors. `type` and `topic` are strings, not
        closed enums; clients must ignore frames whose `type` they do
        not recognize.
      required: [type]
      properties:
        type:
          type: string
          description: "Frame discriminator: `invalidate` or `resync`."
          example: invalidate
        topic:
          type: string
          description: >
            Which stream the frame is about (`catalog` or `user`).
            Always present on `invalidate`; on `resync` its absence
            means every stream.
          example: catalog

    DownloadFile:
      type: object
      description: One downloadable backing file of an item.
      required: [url, mimeType, sizeBytes, fileName, essenceHash, etag]
      properties:
        url:
          type: string
          description: >
            Origin-relative, media-token-authenticated download URL serving
            this file's original bytes with range support.
          example: /media/download?pid=tr-01JZX5N8QW3F4V9T2B7KD3M9R6&mt=abc123
        mimeType:
          type: string
          description: MIME type of the file.
          example: audio/flac
        sizeBytes:
          type: integer
          format: int64
          description: Exact size of the file in bytes.
        fileName:
          type: string
          description: >
            Suggested file name (the original base name), also sent as the
            download's `Content-Disposition`.
          example: 03 Prancing Pony Blues.flac
        essenceHash:
          type: string
          description: >
            Content hash of the file's audio essence, stable across retags
            and moves: the download-store key.
        etag:
          type: string
          description: >
            Strong validator of the exact file bytes, served as the
            download's `ETag`. Changes on any rewrite of the file,
            including retags that leave `essenceHash` unchanged; a
            mismatch means restart this file's transfer instead of
            resuming a range.

    DownloadInfo:
      type: object
      description: Everything a client needs to download one item's original bytes.
      required: [pid, files, expiresAt]
      properties:
        pid:
          type: string
          description: The resolved item's PID.
          example: tr-01JZX5N8QW3F4V9T2B7KD3M9R6
        files:
          type: array
          minItems: 1
          description: >
            The item's backing files in playback order. One entry for a
            track or single-file book; one per part for a multi-file
            audiobook; exactly one (the containing file) for an item
            carved out of a larger file.
          items:
            $ref: "#/components/schemas/DownloadFile"
        spanStartMs:
          type: integer
          format: int64
          description: >
            Start of the item's playback window within its single backing
            file, in milliseconds. Present only for items carved out of a
            larger file (CUE-backed virtual tracks); offline playback
            plays the window, not the whole file.
        spanEndMs:
          type: integer
          format: int64
          description: >
            End of the playback window in milliseconds, exclusive.
            Present exactly when `spanStartMs` is.
        expiresAt:
          type: string
          format: date-time
          description: When the embedded media tokens stop being accepted.

    PlayInfo:
      type: object
      description: Everything a client needs to begin playback of one item.
      required: [pid, url, mimeType, durationMs, seekable, expiresAt]
      properties:
        pid:
          type: string
          description: The resolved item's PID.
          example: tr-01JZX5N8QW3F4V9T2B7KD3M9R6
        url:
          type: string
          description: >
            Origin-relative, media-token-authenticated stream URL. Short TTL;
            re-request play-info on expiry or a `stream-stale` error.
          example: /media/stream?pid=tr-01JZX5N8QW3F4V9T2B7KD3M9R6&mt=abc123
        mimeType:
          type: string
          description: MIME type the stream will be served as.
          example: audio/flac
        durationMs:
          type: integer
          format: int64
          description: Duration in milliseconds.
          example: 214000
        seekable:
          type: boolean
          description: Whether the stream supports sample-exact seeking.
        expiresAt:
          type: string
          format: date-time
          description: When the embedded media token stops being accepted.
        partIndex:
          type: integer
          description: >
            Zero-based index of the resolved part within a multi-file
            audiobook. Present exactly when `partCount` is.
        partCount:
          type: integer
          description: >
            Number of parts in a multi-file audiobook. Present only for
            multi-file books; single-file items omit the part fields
            entirely.
        partStartMs:
          type: integer
          format: int64
          description: >
            Book-timeline millisecond offset where the resolved part
            begins. In-part positions plus this offset give the
            book-timeline positions that play-state expects. Present
            exactly when `partCount` is.
        voiceBoost:
          type: boolean
          description: >
            True when the stream applies server-side spoken-word loudness
            normalization. Absent or false otherwise, including when it
            was requested but cannot be applied yet (unsupported by the
            sidecar, or loudness not measured yet).

    PodcastShow:
      type: object
      description: >
        One globally cataloged show. Show privacy is a global, sticky
        property: a show becomes private when it is first subscribed
        with credentials or when any subscriber ever marks their
        subscription private, and it never becomes public again. For a
        private show, `feedUrl` is omitted from every response for
        every user, and the show is excluded from every user's OPML
        export: tokenized feed URLs and credentials are secrets.
        Privacy protects the URL and credentials only, never the
        show's existence or content, which any user with visibility
        into the podcast library can browse and play.
      required: [pid, title, sourceType]
      properties:
        pid:
          type: string
          description: Show PID.
          example: pc-01JZX5N8QW3F4V9T2B7KD3M9R6
        title:
          type: string
          description: Show title.
        author:
          type: string
          description: Show author or channel name.
        descriptionHtml:
          type: string
          description: >
            Show description as sanitized HTML (server-side allowlist;
            safe to render directly).
        feedUrl:
          type: string
          description: The feed URL. Omitted for private feeds.
        link:
          type: string
          description: The show's website, when the feed declares one.
        sourceType:
          type: string
          description: >
            Where the show comes from: `rss`, `youtube` (a channel or
            playlist through the acquisition bridge), or `manual` (a
            local-folder show). Open set; treat unknown values like
            `rss`.
          example: rss
        artUrl:
          type: string
          description: Origin-relative URL of the show's artwork endpoint.
          example: /api/v1/items/pc-01JZX5N8QW3F4V9T2B7KD3M9R6/art
        episodeCount:
          type: integer
          description: Number of cataloged episodes.
        lastPublishedAt:
          type: string
          format: date-time
          description: Publication time of the newest cataloged episode.
        refreshDisabled:
          type: boolean
          description: >
            True when scheduled refresh is suspended after repeated feed
            failures. A successful manual refresh clears it.

    SubscriptionSettings:
      type: object
      description: >
        The calling user's per-subscription settings. All fields are
        optional; an absent field means the server default. `PUT` replaces
        the whole object.
      properties:
        retentionKeep:
          type: integer
          nullable: true
          minimum: 0
          description: >
            Keep the newest N downloaded episode files for this user; 0
            means keep all. Null (or absent) means the server default,
            which is keep-all unless the administrator configured
            otherwise. The effective policy for a show is the most
            generous union across its subscribers, and removing a file
            never removes playback history (archive, not delete).
        autoDownload:
          type: boolean
          description: >
            Fetch new episodes to the server automatically as the feed
            publishes them.
        folder:
          type: string
          maxLength: 512
          description: >
            Folder path for organizing subscriptions, as segments joined
            by `/` (round-trips through OPML outline nesting).
        private:
          type: boolean
          description: >
            Mark the show private (see the show schema: privacy is
            global and sticky, hiding the feed URL everywhere and
            keeping the show out of every OPML export). Set
            automatically when subscribing with credentials. Setting
            this back to false does not un-private a show.
        speed:
          type: number
          format: double
          minimum: 0.5
          maximum: 3.5
          description: Playback speed override for this show.
        trimSilence:
          type: boolean
          description: Trim mapped silence spans when playing this show.
        voiceBoost:
          type: boolean
          description: Apply spoken-word loudness normalization for this show.
        skipIntroSeconds:
          type: integer
          minimum: 0
          maximum: 600
          description: Seconds to skip at the start of every episode.
        skipOutroSeconds:
          type: integer
          minimum: 0
          maximum: 600
          description: Seconds to skip at the end of every episode.

    Subscription:
      type: object
      description: One subscription of the calling user.
      required: [show, settings, subscribedAt]
      properties:
        show:
          $ref: "#/components/schemas/PodcastShow"
        settings:
          $ref: "#/components/schemas/SubscriptionSettings"
        subscribedAt:
          type: string
          format: date-time
          description: When the caller subscribed.

    SubscriptionPage:
      type: object
      description: One keyset-paginated page of the caller's subscriptions.
      required: [items]
      properties:
        items:
          type: array
          description: Subscriptions in stable order.
          items:
            $ref: "#/components/schemas/Subscription"
        nextCursor:
          type: string
          description: Opaque cursor for the next page. Absent on the last page.

    PodcastDetail:
      type: object
      description: A show together with the caller's subscription state.
      required: [show, subscribed]
      properties:
        show:
          $ref: "#/components/schemas/PodcastShow"
        subscribed:
          type: boolean
          description: Whether the calling user follows this show.
        settings:
          $ref: "#/components/schemas/SubscriptionSettings"

    SubscribeRequest:
      type: object
      description: A subscription request.
      required: [url]
      properties:
        url:
          type: string
          minLength: 1
          maxLength: 2048
          description: >
            Feed URL, or a YouTube channel or playlist URL when
            `sourceType` is `youtube`.
        sourceType:
          type: string
          description: >
            Source kind: `rss` (default) or `youtube`. Open set for
            forward compatibility; servers reject values they do not
            support with `source-unavailable`.
          example: rss
        username:
          type: string
          maxLength: 256
          description: Basic-auth username for a private feed.
        password:
          type: string
          format: password
          maxLength: 256
          description: >
            Basic-auth password for a private feed. Stored sealed at
            rest; never returned by any endpoint.
        folder:
          type: string
          maxLength: 512
          description: Initial folder path for the subscription.

    RefreshResult:
      type: object
      description: Outcome of a feed refresh.
      required: [newEpisodes]
      properties:
        newEpisodes:
          type: integer
          description: Episodes that appeared in this refresh.

    OpmlImport:
      type: object
      description: An OPML document to import.
      required: [opml]
      properties:
        opml:
          type: string
          minLength: 1
          description: The OPML XML document, verbatim.

    OpmlImportEntry:
      type: object
      description: The import outcome for one OPML feed entry.
      required: [feedUrl]
      properties:
        feedUrl:
          type: string
          description: The feed URL from the document.
        title:
          type: string
          description: The show title, when the feed resolved.
        pid:
          type: string
          description: The subscribed show's PID, when the feed resolved.
        error:
          type: string
          description: Why this feed failed to subscribe, when it did.

    OpmlImportResult:
      type: object
      description: Per-feed outcomes of an OPML import.
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/OpmlImportEntry"

    EpisodeSummary:
      allOf:
        - $ref: "#/components/schemas/ItemSummary"
        - type: object
          description: Episode fields beyond the generic summary row.
          required: [showPid, downloaded, publishedAt]
          properties:
            showPid:
              type: string
              description: The show this episode belongs to.
              example: pc-01JZX5N8QW3F4V9T2B7KD3M9R6
            season:
              type: integer
              description: Season number, when the feed declares one.
            episodeNumber:
              type: integer
              description: Episode number, when the feed declares one.
            episodeType:
              type: string
              description: >
                Feed-declared episode type (`full`, `trailer`, `bonus`).
                Open set; treat unknown values like `full`.
            publishedAt:
              type: string
              format: date-time
              description: >
                Publication time. When the feed declares none, the
                server substitutes the time it first saw the episode,
                so ordering and paging stay total.
            downloaded:
              type: boolean
              description: >
                Whether the audio is on the server. Playback needs the
                fetch first: play-info for a not-yet-fetched episode
                answers `conflict`, and the episode fetch endpoint
                queues the download.
            fetchState:
              type: string
              description: >
                Present while a server-side fetch is queued or after
                one failed: `queued` or `failed`. Absent otherwise.
                Open set; treat unknown values as `queued`.
            fetchError:
              type: string
              description: >
                Why the last fetch attempt failed (`fetchState` is
                `failed`). Retrying the fetch endpoint re-queues it.
            explicit:
              type: boolean
              description: Feed-declared explicit flag.
            hasTranscript:
              type: boolean
              description: Whether a transcript is available.
      description: Compact episode representation for lists.

    EpisodePage:
      type: object
      description: One keyset-paginated page of a show's episodes.
      required: [items]
      properties:
        items:
          type: array
          description: Episodes, newest first.
          items:
            $ref: "#/components/schemas/EpisodeSummary"
        nextCursor:
          type: string
          description: Opaque cursor for the next page. Absent on the last page.

    Episode:
      allOf:
        - $ref: "#/components/schemas/EpisodeSummary"
        - type: object
          description: Detail fields beyond the episode summary.
          properties:
            descriptionHtml:
              type: string
              description: >
                Show notes as sanitized HTML (server-side allowlist; safe
                to render directly).
            link:
              type: string
              description: The episode's web page, when the feed declares one.
            chapters:
              type: array
              description: Chapter marks, ordered by `startMs`.
              items:
                $ref: "#/components/schemas/ChapterMark"
      description: Full detail for one episode.

    ChapterMark:
      type: object
      description: One chapter mark on an item's timeline.
      required: [index, startMs]
      properties:
        index:
          type: integer
          description: Zero-based chapter position.
        title:
          type: string
          description: Chapter title.
        startMs:
          type: integer
          format: int64
          description: >
            Chapter start in milliseconds (book-timeline milliseconds
            for multi-part audiobooks).
        endMs:
          type: integer
          format: int64
          description: >
            Chapter end in milliseconds, exclusive. Absent for
            open-ended final chapters.

    TranscriptCue:
      type: object
      description: One transcript cue.
      required: [startMs, text]
      properties:
        startMs:
          type: integer
          format: int64
          description: Cue start in milliseconds.
        endMs:
          type: integer
          format: int64
          description: Cue end in milliseconds, when the format carries one.
        text:
          type: string
          description: Cue text.
        speaker:
          type: string
          description: Speaker name, when the format carries one.

    Transcript:
      type: object
      description: An episode's transcript as ordered, time-coded cues.
      required: [format, cues]
      properties:
        format:
          type: string
          description: >
            Source format the cues were parsed from (`json`, `srt`,
            `vtt`, `text`). Cues from `text` transcripts carry a zero
            `startMs` and no `endMs`.
          example: vtt
        cues:
          type: array
          description: Cues ordered by `startMs`.
          items:
            $ref: "#/components/schemas/TranscriptCue"

    BookPart:
      type: object
      description: >
        One backing file of an audiobook, in reading order. `index` is
        the join key across the whole surface: it matches play-info's
        `partIndex`, the skip-map `partIndex`, and the same position in
        download-info's `files` array.
      required: [index, startMs, durationMs]
      properties:
        index:
          type: integer
          description: Zero-based reading-order position.
        startMs:
          type: integer
          format: int64
          description: Book-timeline millisecond offset where this part begins.
        durationMs:
          type: integer
          format: int64
          description: Part duration in milliseconds.
        displayName:
          type: string
          description: Human-readable part name (the file's base name).

    BookSettings:
      type: object
      description: >
        The calling user's per-book playback settings. All fields are
        optional; an absent field means the server default. `PUT`
        replaces the whole object.
      properties:
        speed:
          type: number
          format: double
          minimum: 0.5
          maximum: 3.5
          description: Playback speed memory for this book.
        voiceBoost:
          type: boolean
          description: Apply spoken-word loudness normalization for this book.
        trimSilence:
          type: boolean
          description: Trim mapped silence spans when playing this book.

    BookDetail:
      type: object
      description: >
        Full audiobook detail. All positions are book-timeline
        milliseconds spanning every part.
      required: [pid, title, durationMs, authors, narrators, chapters, parts]
      properties:
        pid:
          type: string
          description: Book PID.
          example: bk-01JZX5N8QW3F4V9T2B7KD3M9R6
        title:
          type: string
          description: Book title.
        subtitle:
          type: string
          description: Subtitle, when known.
        authors:
          type: array
          description: Author display names, in credit order.
          items:
            type: string
        narrators:
          type: array
          description: Narrator display names, in credit order.
          items:
            type: string
        series:
          type: string
          description: Series name, when the book belongs to one.
        seriesSequence:
          type: string
          description: >
            Position within the series, as the source states it
            (decimals like `1.5` are preserved).
        publisher:
          type: string
          description: Publisher, when known.
        asin:
          type: string
          description: Audible ASIN, when known.
        isbn:
          type: string
          description: ISBN, when known.
        edition:
          type: string
          description: Edition label, when known.
        abridged:
          type: boolean
          description: Whether this edition is abridged, when known.
        descriptionHtml:
          type: string
          description: >
            Book description as sanitized HTML (server-side allowlist;
            safe to render directly).
        durationMs:
          type: integer
          format: int64
          description: Total duration across all parts, in milliseconds.
        artUrl:
          type: string
          description: Origin-relative URL of the book's artwork endpoint.
        chapters:
          type: array
          description: Chapters on the book timeline, ordered by `startMs`.
          items:
            $ref: "#/components/schemas/ChapterMark"
        parts:
          type: array
          minItems: 1
          description: Backing files in reading order.
          items:
            $ref: "#/components/schemas/BookPart"
        settings:
          $ref: "#/components/schemas/BookSettings"

    BookResume:
      type: object
      description: The calling user's resume point in one book.
      required: [positionMs]
      properties:
        positionMs:
          type: integer
          format: int64
          description: Book-timeline resume position in milliseconds.
        chapter:
          $ref: "#/components/schemas/ChapterMark"
        updatedAt:
          type: string
          format: date-time
          description: When this position was last written.

    SkipSpan:
      type: object
      description: One silence span to skip.
      required: [startMs, endMs]
      properties:
        startMs:
          type: integer
          format: int64
          description: Span start in milliseconds.
        endMs:
          type: integer
          format: int64
          description: Span end in milliseconds, exclusive.

    SkipMap:
      type: object
      description: >
        Precomputed silence spans for one audio file, keyed to its
        audio essence and the upstream detector version. Spans are in
        the mapped file's own timeline (for a multi-file audiobook,
        the requested part's timeline, not the book's).
      required: [state]
      properties:
        state:
          type: string
          description: >
            `ready` (spans present), `pending` (analysis queued or
            running; poll again later), or `unavailable` (this item is
            not mapped: not spoken-word content, audio not fetched to
            the server yet, or the streaming sidecar cannot analyze).
            Open set; treat unknown values as `unavailable`.
          example: ready
        essenceHash:
          type: string
          description: >
            Content hash of the mapped file's audio essence, matching
            the download surface's `essenceHash`; a stored map whose
            hash no longer matches the stored audio is stale.
        partIndex:
          type: integer
          description: >
            The mapped part of a multi-file audiobook. Present only
            for multi-file books.
        version:
          type: string
          description: Upstream silence-detector revision the map was built by.
          example: silence-1
        thresholdDb:
          type: number
          format: double
          description: Detection threshold in dBFS.
        minSeconds:
          type: number
          format: double
          description: Minimum span length in seconds.
