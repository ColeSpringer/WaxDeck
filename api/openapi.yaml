        buckets:
          type: array
          description: Chart buckets, oldest first. Empty buckets are omitted.
          items:
            $ref: "#/components/schemas/ListeningBucket"
        byMediaType:
          type: array
          description: Listening split by media type, most-listened first.
          items:
            $ref: "#/components/schemas/MediaTypeListening"

    ListeningBucket:
      type: object
      description: One chart bucket.
      required: [start, ms, sessions]
      properties:
        start:
          type: string
          format: date
          description: >
            First calendar day of the bucket in the caller's timezone.
        ms:
          type: integer
          format: int64
          description: Milliseconds listened in the bucket.
        sessions:
          type: integer
          description: Listen sessions in the bucket.

    MediaTypeListening:
      type: object
      description: Listening total for one media type.
