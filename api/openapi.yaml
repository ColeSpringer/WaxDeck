        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpgradeResolveRequest"
      responses:
        "200":
          description: The resolution outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeResolveResult"
        "400":
