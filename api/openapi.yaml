      summary: List quality upgrade groups
      description: >
        Groups of the same recording in different encodings, found
        through the fingerprint index, best quality first within each
        group. The resolve endpoint keeps the best and trashes the
        rest; play history merges onto the kept item.
      tags: [health]
      responses:
        "200":
