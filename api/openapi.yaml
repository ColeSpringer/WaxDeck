servers:
  - url: /api/v1
    description: Same-origin API root.

tags:
  - name: system
    description: Health and server metadata.
  - name: auth
    description: Sessions, devices, first-run bootstrap, and OIDC single sign-on.
  - name: users
    description: Account administration, roles, library visibility, and preferences.
  - name: library
    description: Browse, search, and inspect library items.
  - name: podcasts
    description: >
      Per-user podcast subscriptions over globally cataloged shows:
      subscribe, browse episodes, transcripts, OPML, refresh, and
      server-side episode fetching.
  - name: books
    description: Audiobook detail, chapter-aware resume, and per-book settings.
  - name: playlists
    description: >
      Manual ordered playlists and smart playlists: rule-based lists
      evaluated per user on read, with a stateless rule preview, field
      discovery for rule editors, and M3U8 import and export.
  - name: radio
    description: >
      Internet radio: a shared station library, directory search, and
      proxied station streaming.
  - name: scrobbling
    description: >
      Outbound scrobbling connections per user: Last.fm and
      ListenBrainz, with server-side queueing and delivery.
  - name: notifications
    description: >
      Notification targets in two scopes: administrator-managed
      server destinations for operations events, and per-user
      personal destinations (including UnifiedPush endpoints) with
      per-target event selection.
  - name: playback
    description: Resolve playable streams, playback state, and listen accounting.
  - name: player
    description: >
      Multi-device control: player endpoints, playback sessions with
      server-side queues, transfer between endpoints, gapless queue
      timelines, and cast preflight diagnostics. Live verbs ride the
      WebSocket command bus (`api/events.md`).
  - name: sync
    description: >
      Delta sync for offline-first clients: snapshot and changed-since
      mirroring of the catalog and of the caller's own server-side state.
  - name: admin
    description: >
      Server administration: library maintenance, runtime settings,
      the audit log, backups and staged restore, scheduled jobs,
      the trash, transcoding limits, and the migration assistant.
  - name: review
    description: >
      The release matching review queue: scored candidates with
      per-field distance breakdowns, decisions (approve, skip,
      keep-as-is, mark unofficial, revert), bulk decisions, and
      auto-apply calibration statistics.
  - name: uploads
    description: >
      Resumable chunked uploads of audio for all three media types.
      Uploaded files stage outside the library, run through the
      identify pipeline, and enter the library through the review
      queue.
  - name: metadata
    description: >
      The full-depth metadata editor: scalar fields, credits, lyrics,
      chapters, artwork, custom tags, entity edits, field locks with
      provenance, release status, rematching, and per-item
      enrichment. Writes are database-first; file write-back is a
      per-call opt-in.
  - name: health
    description: >
      The metadata health dashboard: per-rule compliance, per-item
      issues, sweeps, bulk fixes, duplicate entity merges, and
      quality upgrade resolution.
  - name: organize
    description: >
      Template-driven file organizing: profiles, dry-run previews,
      and applying moves (sidecars ride along).
  - name: tools
    description: >
      File tooling driven through the streaming engine's job API:
      audiobook merge to a chaptered single file, chapter splits,
      CUE rip splits, and the tool task log tracking them.
  - name: enrichment
    description: >
      Library enrichment: provider status, coverage, and whole-library
      dispatch.
  - name: discovery
    description: >
      Sonic discovery: similar tracks, instant mixes from any seed
      with an adventurousness knob, and sonic paths between two
      tracks. Sonic results need embedding coverage from the
      similarity worker; every surface degrades to metadata-based
      heuristics so discovery works with zero setup.
  - name: stats
    description: >
      Listening statistics: time by period, calendar heatmaps with
      streaks, top lists, the per-device session log, and the
      per-user and server-wide year in review. Calendar bucketing
      uses the caller's preferred timezone.
  - name: shares
    description: >
      Public share links for tracks, playlists, books, and episodes:
      expiring capability URLs whose landing pages are server-rendered
      plain HTML at `/s/{token}`.
  - name: similarity
    description: >
      Sonic-analysis status and the external worker API. The server
      analyzes its own library by default (the embedded analyzer);
      the worker API lets an external process take that job over:
      workers pull decode-ready audio, compute per-track embeddings,
      and post them back, and the server maintains the neighbor
      graph that powers sonic discovery either way. Worker endpoints
      authenticate with a server-configured worker token.

security:
  - cookieAuth: []
  - bearerAuth: []

paths:
  /libraries:
    get:
      operationId: listLibraries
      summary: List libraries
      description: >
        The catalog's libraries, for granting per-library visibility.
        Administrators only. Unpaginated: libraries are a handful of roots,
        not a collection that grows with content.

        `itemCount` is opt-in through `counts`, because it is the one
        field here that costs anything: the catalog has no library
        dimension, so counting a root means matching every item's path
        against it. Callers that want the names and pids - a permission
        editor, a matching-mode menu - should leave it off.
      tags: [admin]
      parameters:
        - name: counts
          in: query
          description: >
            Count the items under each root. Off by default; the count
            is a scan per library, so it is asked for by the one screen
            that shows it.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: All libraries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Libraries"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"
    post:
      operationId: createLibrary
      summary: Create a library at runtime
      description: >
        Registers a new library root without a server restart. The path is
        validated (absolute, and non-overlapping with existing roots, the
        inbox folders, and the podcast download dir), cataloged, and scanned
        in the background; browsing and downloading its files work as soon as
        the scan indexes them. Streaming through the WaxFlow sidecar also
        needs the sidecar to mount the same-named root, so a runtime-added
        root streams once the sidecar learns it, while downloads and direct
        playback do not wait on that; when the sidecar cannot be brought to
        the new root the 201 carries `streamingWarning` saying so, rather
        than reporting a plain success. `name` is the display name and the
        WaxFlow root name the same directory is served under. Administrators
        only.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryCreate"
      responses:
        "201":
          description: >
            The created library. `streamingWarning` is present when the
            root exists but the streaming sidecar did not take it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryCreated"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /library/rescan:
    post:
      operationId: rescanLibrary
      summary: Start a library rescan
      description: >
        Starts an asynchronous scan of every library root and returns the job
        tracking it. Poll the job to observe progress and completion. Scans
        serialize with other catalog jobs; starting one while another runs
        returns the conflict error. Administrators only.
      tags: [admin]
      responses:
        "202":
          description: Scan started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /library/analyze:
    post:
      operationId: analyzeLibrary
      summary: Start the analyze pass
      description: >
        Starts the asynchronous analyze pass and returns the job tracking
        it. The pass decodes every audio file whose analysis is missing or
        stale and stores its loudness (what ReplayGain and voice-boost
        leveling read), its acoustic fingerprint (what duplicate grouping
        reads), and its waveform peaks (what the seek bar reads). It is
        the only pass that decodes audio: a scan hashes files and reads
        tags without decoding them, so none of those three exists until
        this runs.

        Expect it to be slow. Each file costs a full decode, and where
        `fpcalc` is installed it also costs one subprocess per file, so a
        large library is priced in hours rather than minutes. It is
        resumable and cancelable like the other catalog jobs, and a file
        it has already analyzed is not analyzed again until its audio or
        an analysis algorithm changes, so an interrupted run picks up
        where it stopped. It never runs automatically after a scan; the
        `analyze` schedule and this endpoint are the only triggers.

        Analysis serializes with itself but not with scans: starting a
        second analyze while one runs returns the conflict error, while a
        scan may run alongside. Podcast episodes are deliberately never
        analyzed. Administrators only.
      tags: [admin]
      responses:
        "202":
          description: The analyze pass started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /jobs/{pid}:
    get:
      operationId: getJob
      summary: Get one job's state
      description: State and progress of a server-run catalog job.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/Pid"
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /libraries/{pid}/read-only:
    parameters:
      - $ref: "#/components/parameters/Pid"
    get:
      operationId: getLibraryReadOnly
      summary: Read a library's read-only mode
      description: >
        Whether the library refuses writes. The effective state is
        this flag or the server-wide `readOnly` setting; the response
        reports the per-library flag only. Administrators only.
      tags: [admin]
      responses:
        "200":
          description: The flag.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryReadOnly"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"
    put:
      operationId: setLibraryReadOnly
      summary: Set a library's read-only mode
      description: >
        A read-only library refuses uploads, organizing, file
        write-back, deletion, and the file tools with code
        `read-only`, while reads, playback, and per-user state
        (stars, progress, playlists) keep working. For media mounted
        read-only on principle. Podcast libraries need a writable
        root for episode fetching, and the flag refuses fetches into
        the library too. Administrators only.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryReadOnly"
      responses:
        "200":
          description: The stored flag.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryReadOnly"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /jobs:
    get:
      operationId: listJobs
      summary: List recent catalog jobs
      description: >
        Recent server-run catalog jobs (scans, analysis, enrichment,
        organize runs, deletes), newest first. Bounded by `limit`
        rather than cursor-paged (a recent-history window, not a
        mirrorable list). The live counterpart of the tool task log
        for engine-side work. Administrators only.
      tags: [admin]
      parameters:
        - name: limit
          in: query
          description: Maximum jobs returned.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Recent jobs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /admin/audit:
    get:
      operationId: listAuditEvents
      summary: List admin-action audit events
      description: >
        Keyset-paginated audit log of administrative and destructive
        actions (account changes, permission changes, deletions,
        merges, backup and restore operations, trash operations,
        settings changes), newest first, with the acting user, the
        target, and action detail. Names are denormalized at write
        time so entries outlive their actors and targets. The
        scheduled prune keeps a bounded history (the newest tens of
        thousands of entries). Administrators only.
      tags: [admin]
      parameters:
        - name: cursor
          in: query
          description: >
            Opaque keyset cursor from a previous page's `nextCursor`.
            Omit for the first page.
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum events per page.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: action
          in: query
          description: >
            Only events whose action equals this value, or starts
            with it when it ends in a dot (`playlist.` matches every
            playlist action).
          schema:
            type: string
        - name: actorId
          in: query
          description: Only events performed by this user.
          schema:
            type: string
        - name: targetPid
          in: query
          description: Only events targeting this PID.
          schema:
            type: string
      responses:
        "200":
          description: One page of audit events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/settings:
    get:
      operationId: getAdminSettings
      summary: Read the server's runtime settings
      description: >
        The runtime-editable server settings. Administrators only.
      tags: [admin]
      responses:
        "200":
          description: Current settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSettings"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: putAdminSettings
      summary: Replace the server's runtime settings
      description: >
        Replaces the runtime settings with the given object and
        returns the stored result. Settings apply immediately, no
        restart. Administrators only.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSettings"
      responses:
        "200":
          description: The stored settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSettings"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/genre-tree:
    get:
      operationId: getGenreTree
      summary: Read the canonical genre vocabulary
      description: >
        The genre tree this instance normalizes onto: a two-level list of
        top-level genres and the genres grouped under them, each with the
        canonical display spelling and the aliases that resolve to it.
        `source` says whether it is the tree WaxDeck ships or one this
        instance stored.

        Resolution folds case, diacritics, and punctuation the way the
        catalog does, so a variant the catalog already collapses ("Hip-Hop"
        onto "hip hop") needs no alias of its own. Aliases are for the
        synonyms no folding reaches: "Rap" onto "Hip Hop", "DnB" onto
        "Drum & Bass", a run-together "HipHop". Administrators only.
      tags: [admin]
      responses:
        "200":
          description: The vocabulary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenreTree"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: putGenreTree
      summary: Replace the canonical genre vocabulary
      description: >
        Stores a vocabulary for this instance, replacing whatever was in
        force. It is a replacement and never a delta: sending an empty
        `genres` list clears the override and returns the instance to the
        shipped default, which is the only way back.

        The tree is validated before it is stored, so a vocabulary that
        could not resolve one way is refused rather than persisted: two
        genres that fold to the same name, an alias claimed by two
        genres, an alias that collides with a genre's own name, a parent
        that is not itself a top-level genre of the same tree, or a genre
        nested more than two levels deep.

        Changing the vocabulary changes both what the background
        normalizer rewrites and what the `genre-whitelist` health rule
        counts as off-tree, so the normalizer is rewound to re-check
        everything the catalog's change log still retains. Anything older
        wants a full pass (`/admin/genre-normalize`). Administrators
        only.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenreTreeUpdate"
      responses:
        "200":
          description: The stored vocabulary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenreTree"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/genre-normalize:
    post:
      operationId: createGenreNormalization
      summary: Normalize every genre in the catalog
      description: >
        Starts a full-catalog normalization as a background task (type
        `genre-normalize`; the finished task's `summary` reports what was
        scanned, rewritten, skipped as locked, and left alone as
        off-tree, with bounded examples of each). `dryRun` reports the
        same numbers without writing.

        This is the catch-up pass, not the normal mechanism: a
        supervised sweeper folds newly scanned genres onto the
        vocabulary continuously, driven off the catalog's change log.
        The full pass is for a catalog older than that log still
        retains, or for applying a vocabulary edit at once. A genre a
        user locked is left alone and counted. Administrators only.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenreNormalizeRequest"
      responses:
        "202":
          description: The normalization task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolTask"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/transcoding:
    get:
      operationId: getTranscodingLimits
      summary: Read the transcoding limits
      description: >
        The server's transcode session limits and default bitrate
        ceiling. Administrators only.
      tags: [admin]
      responses:
        "200":
          description: Current limits.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscodingLimits"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: putTranscodingLimits
      summary: Replace the transcoding limits
      description: >
        Replaces the transcode limits and returns the stored result.
        Limits are enforced at the media proxy when a stream needs
        the streaming engine: direct-played originals never count.
        An over-limit stream request answers `transcode-limited`.
        A per-account bitrate ceiling on the account's permissions
        overrides `defaultMaxBitrateKbps`. Administrators only
        (administrators' own streams are exempt from the per-user
        cap but count toward and respect the global one).
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranscodingLimits"
      responses:
        "200":
          description: The stored limits.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscodingLimits"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/transcoding/activity:
    get:
      operationId: getTranscodingActivity
      summary: Read what the transcoder is doing right now
      description: >
        The engine-backed streams in flight, for reading beside the
        limits that bound them. A separate read from
        `getTranscodingLimits` because configuration and telemetry have
        different lifetimes: the limits are a form somebody is editing,
        this is a number that moves under them, and `PUT` echoes the
        limits schema. Administrators only.
      tags: [admin]
      responses:
        "200":
          description: What is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscodingActivity"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/scrobbling:
    get:
      operationId: getScrobblingConfig
      summary: Read the server's scrobbling credentials state
      description: >
        Whether the server holds Last.fm API application credentials
        (the pair that identifies this install to Last.fm; each user
        still links their own account through the browser flow), and
        where they came from: `settings` (set through this surface),
        `environment`, or `none`. The shared secret is never read
        back. ListenBrainz needs no server credentials and does not
        appear here. Administrators only.
      tags: [admin]
      responses:
        "200":
          description: The credential state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScrobblingAdminConfig"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: putScrobblingConfig
      summary: Set the server's Last.fm API credentials
      description: >
        Stores the Last.fm API key and shared secret (register the
        pair at last.fm/api/account/create). Both values set stores
        them, the secret sealed at rest; both empty clears the stored
        pair, falling back to environment credentials when the server
        has them; a half-set pair answers `invalid-request`. A
        runtime-stored pair takes precedence over the environment
        one. Changing the API key invalidates users' existing Last.fm
        connections (session keys bind to the application that minted
        them); their delivery status surfaces it and reconnecting
        fixes it. Administrators only.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScrobblingAdminConfigPut"
      responses:
        "200":
          description: The stored credential state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScrobblingAdminConfig"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/schedules:
    get:
      operationId: listSchedules
      summary: List the scheduled jobs
      description: >
        Every schedulable job kind with its cron expression, enabled
        state, and last and next run. Kinds are fixed: `scan` (a full
        library scan), `backup` (a backup archive with retention
        applied), `prune` (event log, replay-guard stamp, audit
        history, and playback session history pruning, under
        server-owned horizons), and `analyze` (the audio-decoding pass
        behind loudness, fingerprints, and waveforms). Administrators
        only.
      tags: [admin]
      responses:
        "200":
          description: All schedules.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    # No POST: the schedule set is closed; each kind exists exactly once.

  /admin/schedules/{kind}:
    put:
      operationId: putSchedule
      summary: Set a scheduled job's cron and enabled state
      description: >
        Sets one schedule. `cron` is a five-field cron expression
        (minute, hour, day of month, month, day of week; `*`, lists,
        ranges, and `*/n` steps), evaluated in the server's local
        time. A malformed expression answers `invalid-request` and
        names the field. Administrators only.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/ScheduleKind"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchedulePut"
      responses:
        "200":
          description: The stored schedule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/backups:
    get:
      operationId: listBackups
      summary: List backup archives
      description: >
        Every backup archive the server holds, newest first,
        including the one currently being written (state `running`)
        and imported archives. Administrators only.
      tags: [admin]
      responses:
        "200":
          description: All backups.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createBackup
      summary: Create a backup now
      description: >
        Starts writing a backup archive in the background and answers
        immediately with the `running` backup; poll the list for
        completion. Administrators only. The archive holds both
        databases (the catalog via its own backup facility, the
        server database via a consistent snapshot) plus server-managed
        settings; media files are never included, and the encryption
        keyfile is excluded by design (an archive holding both the
        database and the key is plaintext-equivalent for stored
        credentials - keep the keyfile safe separately). Retention
        (`backupKeepCount`/`backupKeepBytes` in the runtime settings)
        is applied after every successful backup, oldest first.
        Answers `conflict` while another backup is running.
      tags: [admin]
      responses:
        "202":
          description: The started backup.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Backup"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /admin/backups/import:
    post:
      operationId: importBackup
      summary: Upload a backup archive
      description: >
        Uploads a backup archive produced by another WaxDeck instance
        (the new-host restore path: upload here, then stage a
        restore). The body is the raw zip. The archive is validated
        before it is accepted; something that is not a WaxDeck backup
        answers `invalid-request`. Imported archives join the list
        with trigger `imported` and are exempt from retention.
        Administrators only.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: The imported backup.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Backup"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          description: The archive exceeds the server's size limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/backups/restore:
    get:
      operationId: getStagedRestore
      summary: Inspect the staged restore
      description: >
        The currently staged restore plan, when one exists (`not-found`
        otherwise). Administrators only.
      tags: [admin]
      responses:
        "200":
          description: The staged plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestorePlan"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: cancelStagedRestore
      summary: Cancel the staged restore
      description: >
        Unstages a staged restore before it is applied. The next
        server start proceeds normally. Administrators only.
      tags: [admin]
      responses:
        "204":
          description: Restore unstaged.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/backups/{backupId}:
    parameters:
      - $ref: "#/components/parameters/BackupId"
    get:
      operationId: getBackup
      summary: Inspect a backup
      description: One backup archive's record. Administrators only.
      tags: [admin]
      responses:
        "200":
          description: The backup.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Backup"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteBackup
      summary: Delete a backup archive
      description: >
        Deletes the archive file and its record. The backup a staged
        restore points at cannot be deleted (`conflict`).
        Administrators only.
      tags: [admin]
      responses:
        "204":
          description: Backup deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /admin/backups/{backupId}/archive:
    get:
      operationId: downloadBackup
      summary: Download a backup archive
      description: >
        The archive itself, as a zip. Only finished archives download;
        a running or failed backup answers `conflict`. Administrators
        only. The response serves byte ranges, so an interrupted
        download of a large archive resumes instead of restarting.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/BackupId"
      responses:
        "200":
          description: The archive.
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /admin/backups/{backupId}/restore:
    post:
      operationId: stageRestore
      summary: Stage a restore from a backup
      description: >
        Validates the archive and stages it for restore. The restore
        applies at the next server start: the current databases are
        set aside (not deleted), the archive's databases are moved
        into place, cross-database references are swept back to
        consistency, and credentials sealed under a key this host
        does not hold are marked pending re-auth. The response is
        the plan: whether the encryption keyfile this server holds
        matches the one the archive's credentials were sealed under,
        and exactly which credentials break when it does not. Staging
        replaces any previously staged restore. Answers `conflict`
        for a backup still being written or one that failed.
        Administrators only.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/BackupId"
      responses:
        "200":
          description: The staged plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestorePlan"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /admin/trash:
    get:
      operationId: listTrash
      summary: List the trash
      description: >
        The catalog's deletion undo journal, newest first: every
        file deleted to the trash and not yet purged, with what it
        was and where it lived. Bounded by `limit` rather than
        cursor-paged: the journal is small by nature and the source
        surface is limit-only. Administrators only.
      tags: [admin]
      parameters:
        - name: includeRestored
          in: query
          description: Also list entries that were already restored.
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          description: Maximum entries returned.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
      responses:
        "200":
          description: Trash entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrashList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /admin/trash/{trashId}/restore:
    post:
      operationId: restoreTrashEntry
      summary: Restore a trashed file
      description: >
        Moves the file back to its original path and re-catalogs it,
        un-archiving its item. Refuses when the original path is
        occupied (`conflict`), and when it points into the internal
        podcast download tree, which owns its own files: entries left
        there by older versions come back by re-downloading the
        episode, and purge and expiry still apply to them.
        Administrators only.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/TrashId"
      responses:
        "204":
          description: File restored and re-cataloged.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /admin/trash/empty:
    post:
      operationId: emptyTrash
      summary: Empty the trash
      description: >
        Permanently deletes every active trashed file and reports
        what was reclaimed. Irreversible. Administrators only.
      tags: [admin]
      responses:
        "200":
          description: What the pass purged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrashEmptyResult"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /admin/trash/{trashId}:
    parameters:
      - $ref: "#/components/parameters/TrashId"
    delete:
      operationId: purgeTrashEntry
      summary: Purge one trashed file
      description: >
        Permanently deletes a single trashed file and reports the bytes
        it reclaimed. Irreversible; the age-based retention sweep
        (`trashRetentionDays`) purges the same way in bulk.
        Administrators only.
      tags: [admin]
      responses:
        "200":
          description: What the purge reclaimed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrashPurgeResult"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /admin/migrations:
    post:
      operationId: createMigration
      summary: Import listening state from another server
      description: >
        Starts a migration import as a background task and answers
        with the tool task to follow (type `import-<source>`; the
        finished task's `summary` carries the report: what matched,
        what did not, and what was written). Sources: `navidrome`
        and `subsonic` pull stars, ratings, play counts, and
        bookmarks from a running server over its Subsonic API
        (`serverUrl` + `username` + `password`); `audiobookshelf`
        pulls book progress over its REST API (`serverUrl` +
        `token`). Podcast subscriptions migrate via the existing
        OPML import. Items are matched through the portable-ref
        ladder (identifiers, then fingerprints, then descriptive
        metadata); play history lands as backdated import-source
        listen sessions with deterministic idempotency ids, so
        re-running an import never doubles anything. `dryRun`
        matches and reports without writing. The URL must resolve
        to a global address unless the server allows private
        fetches. Credentials are held only for the task's duration.
        Administrators only.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MigrationCreate"
      responses:
        "202":
          description: The import task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolTask"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /auth/login:
    post:
      operationId: login
      summary: Log in and establish a session
      description: >
        Verifies local-account credentials, establishes a session, and sets
        the `waxdeck_session` HttpOnly cookie. Native clients use the same
        endpoint and read the bearer token from the response body instead of
        the cookie; passing `deviceName` labels the session in the device
        list. Invalid credentials and disabled accounts answer 401 without
        distinguishing the two. Repeated failures are rate limited per
        source and account.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session established.
          headers:
            Set-Cookie:
              description: "`waxdeck_session` HttpOnly SameSite=Lax session cookie."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"

  /auth/logout:
    post:
      operationId: logout
      summary: End the current session
      description: >
        Revokes the presented session (cookie or bearer token) and clears the
        session cookie. Succeeds even if no session is active.
      tags: [auth]
      security: []
      responses:
        "204":
          description: Session ended.
          headers:
            Set-Cookie:
              description: Expired `waxdeck_session` cookie.
              schema:
                type: string

  /auth/session:
    get:
      operationId: getSession
      summary: Inspect the current session
      description: >
        Returns whether the caller is authenticated and, if so, the session's
        user and CSRF token. Unauthenticated callers get
        `authenticated: false`, not a 401. Clients use this at startup to
        decide whether to show the login screen.
      tags: [auth]
      security: []
      responses:
        "200":
          description: Current session state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"

  /auth/bootstrap:
    get:
      operationId: getBootstrapStatus
      summary: Check whether first-run setup is needed
      description: >
        Reports whether the server is still waiting for its first
        administrator. Clients probe this when a session check comes back
        unauthenticated and route to the setup screen instead of the
        login screen while `required` is true. Setup stays required as
        long as no enabled administrator exists, so an OIDC login that
        provisioned a plain account first never strands the server
        adminless.
      tags: [auth]
      security: []
      responses:
        "200":
          description: Bootstrap state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapStatus"
    post:
      operationId: bootstrap
      summary: Create the first administrator
      description: >
        Creates an administrator account and logs it in (cookie plus
        bearer token, exactly like login). Available only while the
        server has no enabled administrator; once one exists this
        endpoint answers `conflict` forever. Not rate limited
        separately: it is a door that closes the moment an
        administrator exists.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapRequest"
      responses:
        "200":
          description: Administrator created and logged in.
          headers:
            Set-Cookie:
              description: "`waxdeck_session` HttpOnly SameSite=Lax session cookie."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /auth/signup:
    post:
      operationId: signup
      summary: Request an account
      description: >
        Self-serve registration. Without an invite token it requires the
        administrator to have enabled open signup, and the account lands
        pending: it cannot log in until an administrator approves it
        (`state` is `pending`). With a valid invite token the account is
        pre-approved and can log in immediately with the role, library
        access, and permissions the invite carries (`state` is
        `active`); invites work whether or not open signup is enabled.
        A taken username answers `conflict` (an unavoidable existence
        probe; the rate limit bounds it). Signup disabled and no invite,
        or an invalid, expired, exhausted, or revoked invite token,
        answer `forbidden`. Rate limited per address.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: The registration outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"

  /auth/refresh:
    post:
      operationId: refreshToken
      summary: Rotate the caller's bearer token
      description: >
        Issues a replacement bearer token for the calling device session and
        invalidates the presented one after a short overlap window (so
        requests already in flight with the old token do not fail). Native
        clients call this periodically; the session itself (its id, device
        name, and history) is unchanged. Cookie-authenticated callers have
        nothing to rotate and get `invalid-request`.
      tags: [auth]
      responses:
        "200":
          description: Replacement token for the same session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /auth/sessions:
    get:
      operationId: listSessions
      summary: List the caller's sessions and devices
      description: >
        Every live session belonging to the calling user, newest first: web
        logins and native devices, with the one serving this request marked
        `current`. This doubles as the device list; revoke an entry to sign
        that device out. Unpaginated: a user's live sessions are a small,
        bounded set.
      tags: [auth]
      responses:
        "200":
          description: The caller's sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /auth/sessions/{sessionId}:
    patch:
      operationId: renameSession
      summary: Rename one of the caller's sessions
      description: >
        Relabels one of the calling user's sessions in the device list.
        The label is whatever the login supplied, which for a web login
        is usually nothing at all, so this is how a device gets a name a
        person recognizes.

        The name is trimmed of surrounding whitespace and must not be
        empty afterwards: there is no way to spell "clear this label"
        here, and a blank row in a device list is worse than the
        client's own fallback. The length limit applies to the value as
        sent, before that trim, so a client can decide acceptance
        without guessing; it is counted in characters rather than bytes,
        because device names are where emoji turn up.

        Only the caller's own sessions are reachable. Another user's
        session answers 404, the same as one that does not exist, so
        this endpoint cannot be used to probe for session ids.
      tags: [auth]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionRename"
      responses:
        "200":
          description: The renamed session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceSession"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: revokeSession
      summary: Revoke one of the caller's sessions
      description: >
        Revokes one of the calling user's sessions immediately: the device
        holding it is signed out and its next request fails with 401.
        Revoking the session serving this request is allowed and acts as
        a logout (the response then also expires the session cookie).
        Only the caller's own sessions are visible here; an administrator
        signs another user out via that user's account endpoints.
      tags: [auth]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "204":
          description: Session revoked.
          headers:
            Set-Cookie:
              description: >
                Expired `waxdeck_session` cookie, present only when the
                revoked session is the one serving this request.
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /auth/oidc/providers:
    get:
      operationId: listOidcProviders
      summary: List configured OIDC providers
      description: >
        The single sign-on providers this server is configured with, for
        rendering login buttons. Empty when OIDC is not configured. Each
        provider carries the origin-relative URL that starts its flow.
      tags: [auth]
      security: []
      responses:
        "200":
          description: Configured providers (possibly none).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcProviders"

  /auth/oidc/start:
    get:
      operationId: startOidc
      summary: Start an OIDC login
      description: >
        Redirects the browser to the identity provider's authorization
        endpoint (authorization code with PKCE, server-mediated: the
        provider only ever redirects back to this server). `mode` selects
        how the flow completes after the callback: `web` sets the session
        cookie and redirects into the SPA; `app` redirects to the
        `waxdeck://auth` deep link with a one-time code; `loopback`
        redirects to `http://127.0.0.1:{port}/callback` with a one-time
        code; `code` shows the one-time code on a plain page for manual
        copy. One-time codes are exchanged at `/auth/oidc/exchange`.
      tags: [auth]
      security: []
      parameters:
        - name: provider
          in: query
          required: true
          description: Provider id from `/auth/oidc/providers`.
          schema:
            type: string
        - name: mode
          in: query
          description: How the flow completes after the provider callback.
          schema:
            type: string
            enum: [web, app, loopback, code]
            default: web
        - name: redirect
          in: query
          description: >
            Where the browser lands after a `web`-mode login: a
            single-slash-rooted path (for example `/library`). Values
            starting `//` or containing a scheme or authority are
            rejected, never coerced, since this redirect fires after the
            session cookie is set. Defaults to `/`.
          schema:
            type: string
        - name: challenge
          in: query
          description: >
            Proof-of-possession binding for `app`, `loopback`, and `code`
            modes: the base64url SHA-256 of a client-held secret, exactly
            like a PKCE code challenge. When given, the resulting
            one-time code can only be redeemed together with the matching
            `verifier`, so a code intercepted in transit (a rogue app
            claiming the deep-link scheme) is useless alone. First-party
            clients always send one.
          schema:
            type: string
        - name: port
          in: query
          description: >
            Loopback port for `loopback` mode. Required for that mode,
            ignored otherwise.
          schema:
            type: integer
            minimum: 1024
            maximum: 65535
      responses:
        "302":
          description: Redirect to the identity provider.
          headers:
            Location:
              description: The provider's authorization URL.
              schema:
                type: string
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /auth/oidc/callback:
    get:
      operationId: oidcCallback
      summary: OIDC provider callback
      description: >
        The redirect URI registered with the identity provider; browsers
        arrive here from the provider, clients never call it directly.
        Exchanges the authorization code, verifies the ID token, resolves
        the account, then completes per the flow's `mode`: `web` sets the
        session cookie and redirects into the SPA; `app` redirects to the
        `waxdeck://auth` deep link carrying a one-time code; `loopback`
        redirects to the flow's loopback URL with the code; `code` renders
        the code as plain HTML for manual copy. Account resolution is by
        provider identity (issuer and subject) only: a first login
        provisions a fresh account, disambiguating a taken username with
        a suffix, and never links onto an existing local account by
        username or email (silent merges are an account-takeover class;
        linking is an explicit future admin action). Provider errors and
        unknown or expired `state` render a plain error page, since there
        is no client context to return a structured error to. Every value
        interpolated into these HTML pages (codes, provider error text)
        is HTML-escaped, and the code page carries nothing derived from
        the user agent.
      tags: [auth]
      security: []
      parameters:
        - name: code
          in: query
          description: Authorization code from the provider.
          schema:
            type: string
        - name: state
          in: query
          description: Opaque state issued by `/auth/oidc/start`.
          schema:
            type: string
        - name: error
          in: query
          description: Provider-reported error code, when the provider denied the flow.
          schema:
            type: string
        - name: error_description
          in: query
          description: Provider-reported human-readable error detail.
          schema:
            type: string
      responses:
        "302":
          description: Flow completion redirect (`web`, `app`, and `loopback` modes).
          headers:
            Location:
              description: SPA path, deep link, or loopback URL per the flow's mode.
              schema:
                type: string
            Set-Cookie:
              description: "`waxdeck_session` cookie (`web` mode only)."
              schema:
                type: string
        "200":
          description: One-time code page (`code` mode) or a plain error page.
          content:
            text/html:
              schema:
                type: string

  /auth/oidc/exchange:
    post:
      operationId: exchangeOidcCode
      summary: Exchange a one-time OIDC code for a session
      description: >
        Redeems the one-time code delivered by an `app`, `loopback`, or
        `code` mode OIDC flow for a session (bearer token plus user, exactly
        like login). Codes are single-use and expire within minutes;
        redeeming one again fails. Guessing is rate limited.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OidcExchangeRequest"
      responses:
        "200":
          description: Session established.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"

  /books/{pid}:
    get:
      operationId: getBook
      summary: Get one audiobook's detail
      description: >
        Full audiobook detail: contributors, series membership, chapters
        on the book timeline, backing parts in reading order, and the
        calling user's per-book playback settings. Positions everywhere
        on this surface are book-timeline milliseconds spanning all
        parts.
      tags: [books]
      parameters:
        - $ref: "#/components/parameters/Pid"
      responses:
        "200":
          description: The book.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookDetail"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /books/{pid}/resume:
    get:
      operationId: getBookResume
      summary: Where the caller left off in a book
      description: >
        The calling user's resume point on the book timeline, with the
        chapter that position falls in (when the book has chapters).
        This is the cross-device resume answer: the position reflects
        the newest checkpoint from any device after the server's
        per-medium reconciliation.
      tags: [books]
      parameters:
        - $ref: "#/components/parameters/Pid"
      responses:
        "200":
          description: The caller's resume point.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookResume"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /books/{pid}/settings:
    put:
      operationId: putBookSettings
      summary: Replace the caller's playback settings for a book
      description: >
        Full replace of the calling user's per-book playback settings
        (speed memory, voice boost, silence trimming). Absent fields
        reset to their defaults, so clients send the complete object.
      tags: [books]
      parameters:
        - $ref: "#/components/parameters/Pid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookSettings"
      responses:
        "200":
          description: The stored settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookSettings"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /books/{pid}/bookmarks:
    get:
      operationId: listBookmarks
      summary: List the caller's bookmarks in a book
      description: >
        The calling user's bookmarks for one book, ordered by position on
        the book timeline. Bookmarks are places a listener marked on
        purpose, which is a different thing from the resume point: a book
        has one resume position and any number of bookmarks, and nothing
        here moves as playback does. The whole set comes back in one
        answer - a book holds a handful of these, not a catalog - so
        there is no cursor.
      tags: [books]
      parameters:
        - $ref: "#/components/parameters/Pid"
      responses:
        "200":
          description: The caller's bookmarks in this book.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookmarkList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"
    post:
      operationId: createBookmark
      summary: Mark a place in a book
      description: >
        Records a bookmark at a book-timeline position, with an optional
        note. Positions past the book's own duration are rejected. A
        book holds at most 200 bookmarks per user; the request is
        refused rather than silently evicting the oldest, because what
        would be dropped is something the listener wrote.
      tags: [books]
      parameters:
        - $ref: "#/components/parameters/Pid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookmarkCreate"
      responses:
        "201":
          description: The stored bookmark.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bookmark"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /books/{pid}/bookmarks/{bookmarkId}:
    delete:
      operationId: deleteBookmark
      summary: Remove one bookmark
      description: >
        Deletes one of the caller's bookmarks. Deleting a bookmark that
        is already gone answers 204: the outcome the caller asked for
        holds either way, and an offline client replaying its queue must
        not stall on one it already removed.
      tags: [books]
      parameters:
        - $ref: "#/components/parameters/Pid"
        - name: bookmarkId
          in: path
          required: true
          description: The bookmark's PID.
          schema:
            type: string
            example: bm-01JZX5N8QW3F4V9T2B7KD3M9R6
      responses:
        "204":
          description: Bookmark removed.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /items/{pid}/similar:
    get:
      operationId: getSimilarTracks
      summary: Similar tracks
      description: >
        Tracks similar to this one. With embedding coverage the list is
        sonic (a live nearest-neighbor scan over the seed's embedding);
        without it the list falls back to metadata heuristics (same
        genre and artist neighborhoods). `basis` reports which one
        answered. The seed itself is never in the list. Results honor
        the caller's library visibility.
      tags: [discovery]
      parameters:
        - $ref: "#/components/parameters/Pid"
        - name: limit
          in: query
          description: Maximum tracks returned.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Similar tracks, most similar first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimilarTracks"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /mixes/instant:
    post:
      operationId: createInstantMix
      summary: Instant mix
      description: >
        Builds a mix from a seed: a track, artist, or album pid, or a
        genre name. Exactly one seed field must be set. With embedding
        coverage the mix is sonic and `adventurousness` widens it: 0
        hugs the seed's closest neighbors, 1 wanders far into the
        neighbor graph. Without coverage the mix falls back to metadata
        heuristics (seed genre and artist neighborhoods, weighted
        toward starred and most-played), where `adventurousness`
        loosens the genre bound. The mix is computed fresh per call
        and not persisted; clients wanting endless radio request
        another mix excluding what already played. Results honor the
        caller's library visibility.
      tags: [discovery]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstantMixRequest"
      responses:
        "200":
          description: The mix.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstantMix"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /mixes/path:
    get:
      operationId: getSonicPath
      summary: Sonic path between two tracks
      description: >
        A listening path from one track to another through sonically
        adjacent tracks: each hop moves along precomputed
        nearest-neighbor edges, so the path drifts gradually from the
        first track's sound to the second's. Needs embedding coverage
        for both endpoints; answers `feature-unavailable` when the
        similarity surface is not running or either endpoint has no
        embedding yet (there is no metadata fallback for paths).
        `complete` is false when the graph connects the endpoints only
        partially; the returned prefix still drifts toward the target.
        Results honor the caller's library visibility.
      tags: [discovery]
      parameters:
        - name: from
          in: query
          required: true
          description: Starting track pid.
          schema:
            type: string
            pattern: "^tr-[0-9A-HJKMNP-TV-Z]{26}$"
        - name: to
          in: query
          required: true
          description: Destination track pid.
          schema:
            type: string
            pattern: "^tr-[0-9A-HJKMNP-TV-Z]{26}$"
        - name: length
          in: query
          description: >
            Requested number of tracks including both endpoints. The
            path may be shorter when the graph distance is small.
          schema:
            type: integer
            minimum: 3
            maximum: 50
            default: 12
      responses:
        "200":
          description: The path, starting track first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SonicPath"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/FeatureUnavailable"

  /library/enrichment:
    get:
      operationId: getEnrichmentStatus
      summary: Enrichment status and coverage
      description: >
        The registered enrichment providers (built-ins and the ones
