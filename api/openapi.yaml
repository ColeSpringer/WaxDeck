          items:
            $ref: "#/components/schemas/TopEntry"
        topGenres:
          type: array
          description: Most-listened music genres that year.
          items:
            $ref: "#/components/schemas/TopEntry"
        topShows:
          type: array
          description: Most-listened podcast shows that year.
          items:
            $ref: "#/components/schemas/TopEntry"

    MonthListening:
      type: object
      description: One month's listening.
      required: [month, ms, sessions]
      properties:
        month:
          type: integer
          minimum: 1
          maximum: 12
          description: Calendar month, 1 is January.
        ms:
          type: integer
          format: int64
          description: Milliseconds listened that month.
        sessions:
          type: integer
          description: Listen sessions that month.

    ServerYearInReview:
      type: object
      description: >
        The whole server's listening recap for one calendar year,
        aggregated across users who have not opted out of shared
        stats. Each participant's listening is bucketed in their own
        timezone.
      required: [year, participants, totalMs, sessions, topArtists, topTracks, topGenres]
      properties:
        year:
          type: integer
          description: The calendar year.
          example: 2026
        participants:
          type: integer
          description: >
            Users whose listening is included (those who have not
            opted out and listened that year).
        totalMs:
          type: integer
          format: int64
          description: Total milliseconds listened across participants.
        sessions:
          type: integer
          description: Listen sessions across participants.
        topArtists:
          type: array
          description: The server's most-listened music artists that year.
          items:
            $ref: "#/components/schemas/TopEntry"
        topTracks:
          type: array
          description: The server's most-listened tracks that year.
          items:
            $ref: "#/components/schemas/TopEntry"
        topGenres:
          type: array
          description: The server's most-listened music genres that year.
          items:
            $ref: "#/components/schemas/TopEntry"

    CatalogSyncEntry:
      type: object
      description: >
        One mirrored catalog change: an `upsert` carrying the item's
        current summary, an `upsert-show` carrying a podcast show's
        current summary (shows are catalog entities but not items, so
        they ride their own operation and clients from before this
        operation existed drop them harmlessly), or a `delete`
        tombstone carrying the PID and a `reason` (which removes the PID
        from whichever mirror table holds it). An `upsert` for a podcast
        episode carries `item` and additionally `episode`, the full
        episode summary; clients that only know items keep reading
        `item`. Snapshot pages contain only upserts, of both kinds.
        `op` is a string, not a closed enum, so new operations can
        appear; clients must drop entries whose `op` they do not
        recognize.
      required: [op, pid]
      properties:
        op:
          type: string
          description: >
            What the mirror should do with this entry: `upsert` (store
            `item`, and `episode` when present), `upsert-show` (store
            `show`), or `delete` (remove the PID).
          example: upsert
        pid:
          type: string
          description: The item or show the entry is about.
          example: tr-01JZX5N8QW3F4V9T2B7KD3M9R6
        reason:
          type: string
          description: >
            Why a `delete` arrived, absent on every other operation.
            `removed` means the server cannot put it back: the audio was
            deleted outright rather than to the trash, or the catalog
            dropped the row. `hidden` means it left this caller's view
            and is recoverable: deleted to the trash with its undo
            journal, or a file re-homed under a library they are not
            granted.


            Unsubscribing from a show sends no tombstone at all. It bumps
            the caller's grant epoch, which retires their cursors and
            forces a clean re-mirror, so the rows go with the old mirror
            rather than one delete at a time.

            Both tombstone the mirror row identically. The difference is
            what a client may reclaim: bytes it already downloaded, and
            the artwork pinned beside them, are dead weight after
            `removed`, and worth keeping after `hidden`, where undoing
            the transition would otherwise cost the whole transfer again.

            An item trashed and purged afterwards is tombstoned twice:
            `hidden` when it went to the trash, then `removed` when the
            purge made it unrecoverable. Purging is a catalog change, so
            the second tombstone rides the next delta and a client that
            kept the bytes on the first one learns to release them. Both
            carry the same pid, so the later reason simply supersedes the
            earlier.

            Open, like `op`, and deliberately not an enum: a closed one
            generates a Dart `EnumClass` whose serializer throws on an
            unrecognized wire value, so adding a third reason later would
            fail the whole page's deserialization and stop sync rather
            than degrade. A client that does not recognize a value must
            treat it as `hidden`, which is the conservative half.
          example: removed
        item:
          $ref: "#/components/schemas/ItemSummary"
        episode:
          $ref: "#/components/schemas/EpisodeSummary"
        show:
          $ref: "#/components/schemas/PodcastShow"

    CatalogSyncPage:
      type: object
      description: One page of catalog sync entries (snapshot or delta).
      required: [entries, nextSince]
      properties:
        entries:
          type: array
          description: Mirror entries, coalesced within the page.
          items:
            $ref: "#/components/schemas/CatalogSyncEntry"
        nextCursor:
          type: string
          description: >
            Keyset cursor for the next snapshot page. Absent on the last
            snapshot page and on delta pages.
        nextSince:
          type: string
          description: >
            Opaque change cursor to sync from next. On snapshot pages it
            repeats the cursor captured at the snapshot's start; on delta
            pages it advances past this page's changes.
        more:
          type: boolean
          description: >
            True when another delta page is already available; fetch it
            immediately with `since` set to this page's `nextSince`.
            Absent in snapshot mode (`nextCursor` plays that role).

    ServerSyncEvent:
      type: object
      description: >
        One change to server-side state visible to the calling user
        (their own state, plus other users' shared playlists), with
        the current value hydrated fresh. `kind` is a string, not a
        closed enum, so new kinds can appear; clients must skip events
        whose `kind` they do not recognize. Hydrated `playlist`
        payloads omit a smart playlist's computed `itemCount`, like
        list pages.
      required: [kind]
      properties:
        kind:
          type: string
          description: >
            What changed: `play-state` (carries `pid` and `playState`),
            `prefs` (carries `prefs`), `subscription` (carries `pid`, the
            show; `subscription` is the current state, absent when the
            caller unsubscribed), `book-settings` (carries `pid`, the
            book, and `bookSettings`), or `playlist` (carries `pid`;
            `playlist` is the current state, absent when the playlist
            was deleted or replaced under a new pid). Curation surfaces
            emit marker kinds carrying only `pid`: `review` (a review
            entry changed; refetch the review endpoints), `upload` (an
            upload session changed), `task` (a tool task changed), and
            `entity-state` (an artist or album was starred or rated).
            Markers hydrate nothing because those surfaces are live
            reads, not mirrored state.


            Two further markers are announcements rather than refetch
            hints, carrying the same news as the notification-target
            event of the same name: `feed-disabled` (`pid` is the show
            whose scheduled refresh was suspended) and `import-completed`
            (`pid` is the review entry that filed itself).
          example: play-state
        pid:
          type: string
          description: >
            The item, show, book, or playlist the event is about
            (absent for `prefs`).
          example: tr-01JZX5N8QW3F4V9T2B7KD3M9R6
        playState:
          $ref: "#/components/schemas/PlayState"
        prefs:
          $ref: "#/components/schemas/Prefs"
        subscription:
          $ref: "#/components/schemas/Subscription"
        bookSettings:
          $ref: "#/components/schemas/BookSettings"
        playlist:
          $ref: "#/components/schemas/Playlist"

    ServerSyncPage:
      type: object
      description: One page of the caller's server-side state changes.
      required: [events, nextSince]
      properties:
        events:
          type: array
          description: State changes, coalesced within the page.
          items:
            $ref: "#/components/schemas/ServerSyncEvent"
        nextSince:
          type: string
          description: Opaque server change cursor to sync from next.
        more:
          type: boolean
          description: >
            True when another page is already available; fetch it
            immediately with `since` set to this page's `nextSince`.

    Health:
      type: object
      description: Liveness and version information.
      required: [status, version, apiVersion]
      properties:
        status:
          type: string
          description: Always `ok` when the server can respond.
          example: ok
        version:
          type: string
          description: Server build version.
          example: 0.1.0-dev
        apiVersion:
          type: integer
          description: Major API version served under `/api/v1`.
          example: 1

    ToolTask:
      type: object
      description: One background tool task.
      required: [id, type, state, createdAt]
      properties:
        id:
          type: string
          description: Task pid.
          example: tk-01JZX5N8QW3F4V9T2B7KD3M9R6
        type:
          type: string
          description: >
            The operation: `book-merge`, `book-split`, `cue-split`,
            or `acquire`. A string, not a closed enum.
        state:
          type: string
          description: >
            `queued`, `running`, `done`, or `failed`. A string, not
            a closed enum.
        itemPid:
          type: string
          description: The book or track the task was started from.
        progressPct:
          type: number
          format: double
          description: Progress in percent when the engine reports it.
        error:
          type: string
          description: Why the task failed, when `failed`.
        resultPids:
          type: array
          description: >
            What the task produced once `done`: the merged book or
            the split pieces (item pids), or the review entries an
            acquisition opened (entry pids).
          items:
            type: string
        createdAt:
          type: string
          format: date-time
          description: When the task was queued.
        finishedAt:
          type: string
          format: date-time
          description: When it reached a terminal state.
        summary:
          type: object
          additionalProperties: true
          description: >
            Task-type-specific result detail once the task finishes,
            for example a migration import's match-and-write report.
            Shapes are documented per task type and may grow fields.

    ToolTasksCleared:
      type: object
      description: The result of clearing finished tasks.
      required: [deleted]
      properties:
        deleted:
          type: integer
          description: How many tasks were deleted.
          example: 4

    ToolTaskPage:
      type: object
      description: One page of tool tasks.
      required: [tasks]
      properties:
        tasks:
          type: array
          description: Tasks, newest first.
          items:
            $ref: "#/components/schemas/ToolTask"
        nextCursor:
          type: string
          description: Cursor for the next page; omitted on the last.

    BookMergeRequest:
      type: object
      description: Options for a book merge.
      properties:
        titles:
          type: array
          maxItems: 2000
          description: >
            Chapter titles, one per part in order; absent or empty
            entries fall back to each part's title tag, then a
            generated name. A non-empty list must match the part
            count.
          items:
            type: string
        keepOriginals:
          type: boolean
          default: false
          description: Keep the source parts instead of trashing them.

    BookSplitRequest:
      type: object
      description: Options for a chapter split.
      properties:
        keepOriginals:
          type: boolean
          default: false
          description: Keep the source file instead of trashing it.

    CueSplitRequest:
      type: object
      description: Options for a CUE rip split.
      properties:
        keepOriginals:
          type: boolean
          default: false
          description: >
            Keep the source file and sheet instead of trashing them.

    UploadCreate:
      type: object
      description: A new upload session.
      required: [fileName, sizeBytes, mediaType]
      properties:
        fileName:
          type: string
          minLength: 1
          maxLength: 255
          description: >
            The file's name (base name only; any path is rejected).
            The extension picks the accepted-format check.
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 17179869184
          description: >
            Total file size in bytes. The maximum is the largest single
            file WaxDeck accepts - 16 GiB, clear of even a long hi-res
            or DSD single-file release - and a session declaring more
            answers `invalid-request` rather than opening. What is
            actually accepted is still bounded by the caller's quota
            and by the room on the server's staging volume.
        mediaType:
          $ref: "#/components/schemas/MediaType"
        libraryPid:
          type: string
          description: >
            Target library; required when several libraries of the
            media type are visible to the caller.
        sha256:
          type: string
          description: >
            Lowercase hex SHA-256 of the file, for the up-front exact
            duplicate warning and the completion integrity check.
          pattern: "^[0-9a-f]{64}$"
        batchId:
          type: string
          description: >
            Joins the session to an open upload batch owned by the
            caller; its grouping intent then decides how this file
            reaches the review queue. The session must declare the
            batch's media type and library. Referencing a batch that
            is not open, or not the caller's, or mismatching either
            field, answers `invalid-request`.
          example: ub-01JZX5N8QW3F4V9T2B7KD3M9R6
        batchPath:
          type: string
          maxLength: 512
          description: >
            The file's directory relative to the picked or dropped
            folder, forward-slash separated (empty or absent for a
            file at the top). The `auto` grouping clusters by it, so
            disc subfolders (`CD1`, `Disc 2`) fold into one album.
            Must stay relative - absolute paths and `..` segments
            are rejected, as is passing it without `batchId`.
            `fileName` stays a bare name regardless.
          example: The Wall/CD1
        identify:
          type: boolean
          description: >
            Whether the file is identified against MusicBrainz.
            Absent means the account's own default (`identifyOptOut` in
            preferences), which is why there is no schema default here:
            a generated client that filled one in would erase the
            account setting on every upload.


            Declining means the file enters the library as delivered,
            with no stop: completing the session imports it and files
            its review entry `as-is` in one step, so nothing waits for
            a decision that was already made at submission. The entry
            is still written, decided rather than pending, so the
            import leaves the same record as a hand-decided `as-is`
            one; like any `as-is` it does not revert, so undoing it
            means deleting the item from the library. If the import
            cannot proceed - a read-only destination, a name
            collision, a file the server already flagged as a
            duplicate - the entry is left pending for a person
            instead, carrying `identifyDeclined`.


            Ignored on a batch member: the batch's own value decides
            for every file in it.

    Upload:
      type: object
      description: One upload session.
      required: [id, fileName, sizeBytes, receivedBytes, mediaType, state, createdAt]
      properties:
        id:
          type: string
          description: Upload pid.
          example: up-01JZX5N8QW3F4V9T2B7KD3M9R6
        fileName:
          type: string
          description: The declared file name.
        sizeBytes:
          type: integer
          format: int64
          description: Declared total size.
        receivedBytes:
          type: integer
          format: int64
          description: >
            Bytes stored so far; resume by sending the next chunk at
            this offset.
        mediaType:
          $ref: "#/components/schemas/MediaType"
        libraryPid:
          type: string
          description: Target library.
        state:
          type: string
          description: >
            Session state: `receiving` (bytes still arriving),
            `staged` (complete, in the review pipeline), `imported`
            (its file entered the library), or `discarded`. A
            string, not a closed enum.
          example: receiving
        reviewEntryId:
          type: string
          description: >
            The review entry the file landed in. Opened at completion
            for a solo session; for a batch member, filled when the
            batch finalizes - or at its own completion, for a member
            that finished only after the batch closed.
        batchId:
          type: string
          description: The batch the session joined, if any.
        duplicate:
          $ref: "#/components/schemas/DuplicateWarning"
        uploadedBy:
          type: string
          description: The uploader's user pid (admin listings).
        createdAt:
          type: string
          format: date-time
          description: When the session was created.
        expiresAt:
          type: string
          format: date-time
          description: >
            When an unfinished session and its bytes are reclaimed.

    DuplicateWarning:
      type: object
      description: >
        The library appears to already contain this audio. A warning,
        not a refusal: the review decision chooses what happens.
      required: [itemPid, kind]
      properties:
        itemPid:
          type: string
          description: The existing item.
        kind:
          type: string
          description: >
            Evidence level: `content` (byte-identical audio) or
            `fingerprint` (acoustically the same recording). A
            string, not a closed enum.
          example: content
        title:
          type: string
          description: The existing item's title.
        artist:
          type: string
          description: The existing item's artist.

    UploadGrouping:
      type: string
      enum: [auto, album, tracks]
      description: >
        How a batch's staged files reach the review queue: `album`
        opens one multi-file entry over all of them, `tracks` one
        entry per file, and `auto` clusters them into album units by
        their tags and relative paths (disc subfolders fold into
        their parent).

    UploadBatchCreate:
      type: object
      description: A new upload batch.
      required: [grouping, mediaType]
      properties:
        grouping:
          $ref: "#/components/schemas/UploadGrouping"
        mediaType:
          $ref: "#/components/schemas/MediaType"
        libraryPid:
          type: string
          description: >
            Target library for every member; required when several
            libraries of the media type are visible to the caller.
            Members re-declare it at session creation and must
            match (a differing member value answers
            `invalid-request`).
        identify:
          type: boolean
          description: >
            Whether the batch's files are identified against
            MusicBrainz. Absent means the account's own default
            (`identifyOptOut` in preferences); see `UploadCreate` for
            why there is no schema default, and for what declining
            does. Decided once here and applied to every entry the
            batch opens, so a member's own value is ignored.

    UploadBatch:
      type: object
      description: One upload batch.
      required: [id, grouping, mediaType, state, reviewEntryIds, createdAt, expiresAt]
      properties:
        id:
          type: string
          description: Batch pid.
          example: ub-01JZX5N8QW3F4V9T2B7KD3M9R6
        grouping:
          $ref: "#/components/schemas/UploadGrouping"
        mediaType:
          $ref: "#/components/schemas/MediaType"
        libraryPid:
          type: string
          description: Target library.
        state:
          type: string
          description: >
            Batch state: `open` (accepting members), `finalized`
            (the finalize call grouped its members), or `expired`
            (the 24-hour window lapsed and the server finalized it
            with what had arrived). A string, not a closed enum.
          example: open
        reviewEntryIds:
          type: array
          description: >
            The review entries finalization opened; empty until the
            batch closes, and empty on a batch whose every member
            was deleted before finalizing.
          items:
            type: string
            example: rv-01JZX5N8QW3F4V9T2B7KD3M9R6
        createdAt:
          type: string
          format: date-time
          description: When the batch was opened.
        expiresAt:
          type: string
          format: date-time
          description: >
            The deadline after which the server may auto-finalize an
            open batch with the members staged by then (a background
            sweep, so an overdue batch can stay open a little past
            this).

    UploadQuota:
      type: object
      description: >
        The caller's upload allowance: always their own, even for
        administrators listing everyone's sessions. Treat absence
        on a page as unknown, not unlimited.
      required: [bytesInUse]
      properties:
        bytesInUse:
          type: integer
          format: int64
          description: >
            Declared bytes of the caller's sessions still sitting in
            staging: everything neither discarded nor imported. What
            quota checks charge, so importing a session releases the
            headroom it held.
        quotaBytes:
          type: integer
          format: int64
          description: >
            The account's ceiling on `bytesInUse`; absent means no
            per-user cap. A limit on pending uploads, not on what the
            account has contributed to the library.

    UploadPage:
      type: object
      description: One page of uploads.
      required: [uploads]
      properties:
        uploads:
          type: array
          description: Uploads, newest first.
          items:
            $ref: "#/components/schemas/Upload"
        nextCursor:
          type: string
          description: Cursor for the next page; omitted on the last.
        quota:
          $ref: "#/components/schemas/UploadQuota"

    AcquisitionFormat:
      type: string
      description: >
        Preferred delivered audio format for a URL acquisition. "best",
        the default, copies the source's highest-quality audio with no
        re-encode (Opus, in practice, for YouTube). The others transcode
        to that container for device compatibility, at some quality cost
        from a lossy source (FLAC is a lossless container of that same
        lossy audio, not a quality gain).
      enum: [best, opus, mp3, m4a, flac]
      default: best

    AcquisitionRequest:
      type: object
      description: One source URL to acquire.
      required: [url, mediaType]
      properties:
        url:
          type: string
          minLength: 1
          maxLength: 2048
          description: >
            The source URL: a single video, a playlist, or a channel
            the acquisition bridge understands.
        mediaType:
          $ref: "#/components/schemas/MediaType"
        libraryPid:
          type: string
          description: >
            Target library; required when several libraries of the
            media type are visible to the caller.
        format:
          $ref: "#/components/schemas/AcquisitionFormat"
        identify:
          type: boolean
          description: >
            Whether what this acquisition downloads is identified
            against MusicBrainz. Absent means the account's own default
            (`identifyOptOut` in preferences); see `UploadCreate` for
            why there is no schema default, and for what declining
            does. Decided when the acquisition is accepted and carried
            by the task, so a preference changed while it downloads
            does not move it.

    User:
      type: object
      description: A WaxDeck account as visible to its owner.
      required: [id, username, roles, uploadEnabled]
      properties:
        id:
          type: string
          description: Stable user identifier.
          example: us-01JZX5N8QW3F4V9T2B7KD3M9R6
        username:
          type: string
          description: Login name.
          example: admin
        displayName:
          type: string
          description: Optional display name; falls back to `username`.
        roles:
          type: array
          description: Assigned roles (`admin`, `user`).
          items:
            type: string
            example: admin
        uploadEnabled:
          type: boolean
          description: >
            Whether the account may upload audio. On self views
            (login, session) this is the *effective* value - administrators always may,
            whatever their stored flag
            says - and clients gate their upload affordances on it.
            On administrative account views (`UserAccount`) it is the
            stored per-account flag the account editor round-trips;
            an administrator's own stored flag may therefore read
            false while their effective right is true. Defined once
            here because the generators flatten `UserAccount`'s
            `allOf` over this schema; a duplicate declaration there
            would silently lose.

    UserAccount:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          description: Administrative account fields beyond the self view.
          # uploadEnabled stays in this required list (it is required on
          # account views) but is defined once, on User: the generators
          # flatten this allOf, and a duplicate property definition here
          # would silently override the merged field in one of them.
          required: [disabled, libraryAccess, createdAt, uploadEnabled, pending, permissions]
          properties:
            disabled:
              type: boolean
              description: >
                Disabled accounts cannot log in and their live sessions are
                revoked on disable.
            pending:
              type: boolean
              description: >
                True for a self-serve registration still awaiting an
                administrator's decision. Pending accounts cannot log
                in; approve or reject them through the signup request
                endpoints.
            libraryAccess:
              $ref: "#/components/schemas/LibraryAccess"
            permissions:
              $ref: "#/components/schemas/Permissions"
            uploadQuotaBytes:
              type: integer
              format: int64
              description: >
                Bytes the account may hold in upload staging at once,
                awaiting review; absent means no per-user cap. A
                pending-upload limit rather than a storage-contribution
                cap: importing a session releases what it held, and
                nothing here bounds what the account adds to the
                library over time.
            createdAt:
              type: string
              format: date-time
              description: When the account was created.
            hasPassword:
              type: boolean
              description: >
                Whether local password login is enabled for the account
                (false for accounts provisioned by OIDC that never set one).
            identities:
              type: array
              description: Linked single sign-on identities.
              items:
                $ref: "#/components/schemas/LinkedIdentity"
      description: An account as visible to administrators (and to its owner).

    LinkedIdentity:
      type: object
      description: One linked OIDC identity.
      required: [provider]
      properties:
        provider:
          type: string
          description: Provider id the identity belongs to.
          example: dex
        email:
          type: string
          description: Email reported by the provider at last login, if any.

    LibraryAccess:
      type: object
      description: >
        Which libraries an account can see. `all` grants every library
        including ones added later; `granted` limits visibility to
        `libraryPids`. Administrators always see everything regardless of
        this setting.
      required: [mode]
      properties:
        mode:
          type: string
          enum: [all, granted]
          description: Access mode.
        libraryPids:
          type: array
          description: >
            Visible libraries when mode is `granted`; ignored for `all`.
          items:
            type: string
            example: lb-01JZX5N8QW3F4V9T2B7KD3M9R6

    Role:
      type: string
      enum: [admin, user]
      description: >
        An assignable account role. A shared named schema on purpose:
        identical inline enums make the Dart generator emit one enum class
        into two files, which does not compile.

    UserCreate:
      type: object
      description: A new local account.
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: >
            Login name, unique case-insensitively. Leading and trailing
            whitespace is rejected.
          example: frodo
        password:
          type: string
          minLength: 8
          format: password
          description: Initial password (at least 8 characters).
        displayName:
          type: string
          maxLength: 128
          description: Optional display name.
        roles:
          type: array
          description: Assigned roles; defaults to `[user]`.
          items:
            $ref: "#/components/schemas/Role"
        libraryAccess:
          $ref: "#/components/schemas/LibraryAccess"
        uploadEnabled:
          type: boolean
          description: Grant upload rights; defaults to false.
        uploadQuotaBytes:
          type: integer
          format: int64
          minimum: 1
          description: >
            Bytes the account may hold in upload staging at once; absent
            means none. An import releases what it held.
        permissions:
          $ref: "#/components/schemas/Permissions"

    UserUpdate:
      type: object
      description: >
        Partial account update: absent fields are unchanged. Setting
        `displayName` to the empty string clears it.
      properties:
        displayName:
          type: string
          maxLength: 128
          description: New display name; empty clears it.
        roles:
          type: array
          description: Replacement role set.
          items:
            $ref: "#/components/schemas/Role"
        disabled:
          type: boolean
          description: >
            Disable or re-enable the account. Disabling revokes its live
            sessions.
        libraryAccess:
          $ref: "#/components/schemas/LibraryAccess"
        uploadEnabled:
          type: boolean
          description: Grant or revoke upload rights.
        uploadQuotaBytes:
          type: integer
          format: int64
          minimum: 0
          description: >
            New ceiling on bytes held in upload staging at once; 0
            removes it.
        permissions:
          $ref: "#/components/schemas/Permissions"

    UserPage:
      type: object
      description: One keyset-paginated page of accounts.
      required: [users]
      properties:
        users:
          type: array
          description: >
            Accounts, in the endpoint's documented order (the account
            list orders by username; the signup request queue oldest
            first).
          items:
            $ref: "#/components/schemas/UserAccount"
        nextCursor:
          type: string
          description: Opaque cursor for the next page. Absent on the last page.

    PasswordChange:
      type: object
      description: A password change.
      required: [newPassword]
      properties:
        currentPassword:
          type: string
          format: password
          description: >
            The account's current password. Required when changing your own
            password; administrators resetting another account omit it.
        newPassword:
          type: string
          minLength: 8
          format: password
          description: The new password (at least 8 characters).

    Prefs:
      type: object
      additionalProperties: false
      description: >
        Per-user preferences that sync across clients. All fields are
        optional; unset fields are absent and clients apply their own
        defaults. Unknown fields are rejected.
      properties:
        timezone:
          type: string
          description: >
            IANA timezone name (for example `Europe/Amsterdam`). Drives
            streaks, heatmaps, and other calendar-bucketed statistics.
          example: America/Denver
        locale:
          type: string
          description: Preferred BCP 47 locale tag (for example `en-US`).
          example: en-US
        theme:
          type: string
          enum: [system, dark, light, oled]
          deprecated: true
          x-deprecated-reason: >-
            A display theme describes the screen in front of the listener
            rather than the account; first-party clients store it per device.
          description: >
            Preferred app theme. Deprecated: a display theme describes the
            screen in front of the listener rather than the account, so the
            first-party clients store it per device and no longer write
            this. They read it once, on a device that has none of its own,
            so that a choice made before the move is not silently reset.
            Kept on the wire for that read and for third-party clients.
        sharedStatsOptOut:
          type: boolean
          description: >
            Leave the server-wide aggregate stats (the server year in
            review). Household members are enrolled by default; opting
            out removes this user's listening from every server-wide
            figure. Personal stats are unaffected.
        radioFavorites:
          type: array
          description: >
            Radio stations this user has pinned, in the order the dial
            presents them. The station library itself is shared by every
            account, so this is the one piece of per-user station state
            there is: which of the household's stations are *yours*.


            Ordered, and the order is the client's to set - new pins go
            on the end, so a dial does not reshuffle under a thumb.
            Entries are station PIDs (`rs-...`) and are not resolved on
            write: a station deleted by another household member leaves
            its pid here, and a client renders only the pids it can still
            find, because failing a whole preference write over one
            departed station would be worse than a dial one slot shorter.


            Capped at 64, which is a bound on the document rather than on
            the feature: clients present about a dozen, and that cap is
            theirs. A client presenting fewer than the document holds must
            still write back what it did not draw - the cap belongs to the
            dial, not to the list.


            Stored in the canonical upper-case form the pattern above
            declares, whatever case a write used, so a pin always names the
            station the server named. Absent when nothing is pinned:
            unpinning everything drops the field rather than storing `[]`,
            and nothing reads a default set of pins out of an absent list,
            so absent and empty are one answer on the way back.
          items:
            type: string
            pattern: "^rs-[0-9A-HJKMNP-TV-Z]{26}$"
          maxItems: 64
          example: [rs-01JZX5N8QW3F4V9T2B7KD3M9R6]
        pinned:
          type: array
          description: >
            What this user has pinned to home, in the order the shelf
            presents them. The same shape and the same rules as
            `radioFavorites`, for the same reason: a pin is about the
            listener rather than the machine they made it on, so it
            follows the account.


            Ordered, and the order is the client's to set - new pins go
            on the end. Entries are entity PIDs and are not resolved on
            write: an album another household member deleted leaves its
            pid here, and a client draws only the pids it can still
            resolve, because failing a whole preference write over one
            departed release would be worse than a shelf one card
            shorter. Resolve them with `POST /library/entities`, which
            silently drops what it cannot answer for and names, in its
            `departed` list, the pids that are gone for everyone - the
            subset a client may prune from here, so a deleted album does
            not hold one of the 64 slots forever.


            Albums (`al-`), artists (`ar-`), release groups (`rg-`),
            playlists (`pl-`), podcast shows (`pc-`), and books (`bk-`)
            may be pinned. Radio stations may not: the dial is already
            radio's pin surface, and two pin gestures for one station
            would be two places to unpin it from. Tracks and episodes
            may not either: a card opens a surface, and a kept set of
            tracks is a playlist - which pins.


            Capped at 64, a bound on the document rather than on the
            feature. Stored in the canonical upper-case form the pattern
            declares, whatever case a write used. Absent when nothing is
            pinned: unpinning everything drops the field rather than
            storing `[]`.
          items:
            type: string
            pattern: "^(al|ar|rg|pl|pc|bk)-[0-9A-HJKMNP-TV-Z]{26}$"
          maxItems: 64
          example: [al-01JZX5N8QW3F4V9T2B7KD3M9R6]
        crossfadeSeconds:
          type: number
          format: double
          minimum: 0
          maximum: 12
          description: >
            Equal-power crossfade applied at every seam of a queue the
            server renders as one stream, in seconds. Zero or absent is a
            gapless butt join.


            Here rather than in a client's own per-device storage because
            the server is what applies it: a cast session is re-rendered
            server-side on every queue edit, shuffle, and repeat reload,
            and those arrive over the control socket carrying no client
            state at all. A per-device value would reach the first load
            and none of the reloads, so the queue would change how it
            sounds halfway through. Local playback does not read this
            yet, which is why clients label it for casting.
          example: 4
        replayGain:
          type: boolean
          description: >
            Level a server-rendered queue to a common loudness. The
            gain is derived from the measured loudness the analyze pass
            stores per file and applied once to the whole stream, so a
            queue whose files were never analyzed plays unlevelled
            whatever this says.


            Same reason as `crossfadeSeconds` for living on the account
            rather than on the device, and the same labeling: nothing
            local reads it yet.
        browseShowUnknown:
          type: boolean
          description: >
            Whether a browse index draws the bucket for the items a
            dimension is absent from (`[No Genre]`, `[Non-Album]`).
            Absent means shown. A presentation preference, not a server
            filter: the bucket stays enumerated and drillable whatever
            this says.
        browseSorts:
          type: object
          description: >
            The order each browse index opens in, keyed by the dimension
            name `GET /library/browse` spells (`genre`, `artist`,
            `credit-artist`, `album-artist`, `album`, `release-group`,
            `year`, `kind`, or
            a `tag.<KEY>` dimension); values are that endpoint's `sort`
            values. Sparse: a dimension with no entry opens in the
            client's own default, so a write must merge rather than
            replace. Capped at 32 entries.
          additionalProperties:
            type: string
            enum: [count, label]
          maxProperties: 32
          example: { genre: label, year: count }
        autoplay:
          type: boolean
          description: >
            Whether playback may start with no gesture behind it - a
            queue another device hands over through Connect. Absent
            means allowed. Off means the client loads what it was asked
            for and waits to be tapped, which is what a browser enforces
            on the web build anyway. It does not gate a gesture made
            somewhere other than the screen: a browse-tree tap on a head
            unit still plays.
        radioScrobbleOptOut:
          type: boolean
          description: >
            Stop scrobbling radio. Listeners with a scrobble connection
            have their radio segments reported by default, which is
            right for a music station whose stream titles are honest
            and wrong for a talk station whose titles happen to parse.
            Opting out silences radio only; library listening is
            unaffected.
        identifyOptOut:
          type: boolean
          description: >
            Stop identifying this account's own submissions by
            default, and let them into the library as delivered.
            Uploads and acquisitions are matched against MusicBrainz
            unless the submission says otherwise, which is right for a
            rip with whatever tags the ripper wrote and wrong for a
            library somebody has already curated. Opting out flips the
            default the upload and Add-from-URL sheets open with;
            either sheet can still say so per submission, and a
            submission that says so wins. See `UploadCreate.identify`
            for what declining does. Administrator matching modes are
            a separate, wider switch: a library set to `off`
            identifies nothing regardless.

    AppPassword:
      type: object
      description: One app password, without its secret.
      required: [id, label, createdAt]
      properties:
        id:
          type: string
          description: App password PID.
          example: ap-01JZX5N8QW3F4V9T2B7KD3M9R6
        label:
          type: string
          description: Human-readable label given at creation.
          example: Symfonium on Pixel 9
        createdAt:
          type: string
          format: date-time
          description: When the app password was created.
        lastUsedAt:
          type: string
          format: date-time
          description: >
            When the app password last authenticated a request (coarse,
            minutes). Absent when it has never been used.

    AppPasswordList:
      type: object
      description: The caller's app passwords, newest first.
      required: [appPasswords]
      properties:
        appPasswords:
          type: array
          items:
            $ref: "#/components/schemas/AppPassword"

    AppPasswordCreate:
      type: object
      description: A new app password.
      required: [label]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 128
          description: >
            Label shown in the app password list, usually the client app
            this password is for.
          example: Symfonium on Pixel 9

    AppPasswordCreated:
      allOf:
        - $ref: "#/components/schemas/AppPassword"
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: >
                The generated password, shown exactly once. The client
                authenticates against the compatibility APIs with the
                account's username and this value.
      description: A newly created app password, including its one-time-visible secret.

    Permissions:
      type: object
      description: >
        Per-account permission toggles. Administrators implicitly
        hold every permission and no tag rules apply to them.
        Defaults for a new account: everything below true except
        `delete`, and no tag rules.
      required: [download, delete, explicitContent, sharedOutputs, managePodcasts]
      properties:
        download:
          type: boolean
          description: >
            May download original files for offline use (the download
            endpoint and the sync download-info surface).
        delete:
          type: boolean
          description: >
            May delete visible library items to the trash. Permanent
            deletion always needs the admin role.
        explicitContent:
          type: boolean
          description: >
            May see and play content flagged explicit. False hides
            RSS-flagged podcast shows and episodes; for music the
            honest control is a tag deny rule on the advisory tag,
            because most music has no canonical explicit flag.
        sharedOutputs:
          type: boolean
          description: >
            May control shared device endpoints (cast targets, DLNA
            renderers, the jukebox output). The caller's own client
            endpoints are always controllable.
        managePodcasts:
          type: boolean
          description: >
            May subscribe, unsubscribe, add shows, and trigger
            episode fetches. False leaves existing subscriptions
            playable but frozen.
        maxTranscodeKbps:
          type: integer
          description: >
            Per-account transcode bitrate ceiling in kbit/s,
            overriding the server default. Absent or 0 means the
            server default applies.
        tagAllow:
          type: array
          description: >
            When non-empty, only items matching every rule are
            visible to the account (kids-mode allow-listing). Applies
            to music and audiobook items; podcast visibility rides
            `explicitContent`.
          items:
            $ref: "#/components/schemas/TagRule"
        tagDeny:
          type: array
          description: >
            Items matching any rule are hidden from the account. An
            item without the rule's tag passes a deny rule (absence
            is not a match), which is the exact deny-list contract.
          items:
            $ref: "#/components/schemas/TagRule"

    TagRule:
      type: object
      description: >
        One tag predicate. With `value`, the rule matches items whose
        custom tag `key` equals it (case-insensitively); without,
        the rule matches items carrying `key` at all.
      required: [key]
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 64
          description: Custom tag key, e.g. `ITUNESADVISORY`.
        value:
          type: string
          maxLength: 256
          description: Tag value to match; absent matches any value.

    SignupApproval:
      type: object
      description: >
        What the approved account becomes. Absent fields keep the
        registration defaults (the `user` role, access to every
        library, default permissions).
      properties:
        roles:
          type: array
          description: Assigned roles.
          items:
            $ref: "#/components/schemas/Role"
        libraryAccess:
          $ref: "#/components/schemas/LibraryAccess"
        permissions:
          $ref: "#/components/schemas/Permissions"
        uploadEnabled:
          type: boolean
          description: Grant upload rights.
        uploadQuotaBytes:
          type: integer
          format: int64
          minimum: 1
          description: >
            Bytes an account made from this invite may hold in upload
            staging at once.

    Invite:
      type: object
      description: One invite link's record.
      required: [id, roles, uploadEnabled, maxUses, usedCount, revoked, createdAt]
      properties:
        id:
          type: string
          description: Invite PID.
          example: iv-01JZX5N8QW3F4V9T2B7KD3M9R6
        note:
          type: string
          description: Free-form label ("for grandma").
        roles:
          type: array
          description: Roles the invite assigns.
          items:
            $ref: "#/components/schemas/Role"
        libraryAccess:
          $ref: "#/components/schemas/LibraryAccess"
        permissions:
          $ref: "#/components/schemas/Permissions"
        uploadEnabled:
          type: boolean
          description: Whether admitted accounts get upload rights.
        maxUses:
          type: integer
          description: How many accounts the invite admits; 0 is unlimited.
        usedCount:
          type: integer
          description: How many accounts it has admitted.
        revoked:
          type: boolean
          description: Whether the invite was revoked.
        expiresAt:
          type: string
          format: date-time
          description: When the token stops working; absent never expires.
        createdAt:
          type: string
          format: date-time
          description: When the invite was created.
        createdBy:
          type: string
          description: Username of the administrator who created it.

    InviteCreate:
      type: object
      description: >
        A new invite. Absent fields use the registration defaults
        (the `user` role, access to every library, default
        permissions, one use, no expiry).
      properties:
        note:
          type: string
          maxLength: 128
          description: Free-form label.
        roles:
          type: array
          description: Roles to assign.
          items:
            $ref: "#/components/schemas/Role"
        libraryAccess:
          $ref: "#/components/schemas/LibraryAccess"
        permissions:
          $ref: "#/components/schemas/Permissions"
        uploadEnabled:
          type: boolean
          description: Grant upload rights; defaults to false.
        maxUses:
          type: integer
          minimum: 0
          default: 1
          description: How many accounts it may admit; 0 is unlimited.
        expiresAt:
          type: string
          format: date-time
          description: Expiry; absent never expires.

    InviteCreated:
      allOf:
        - $ref: "#/components/schemas/Invite"
        - type: object
          description: The create response, carrying the token.
          required: [token]
          properties:
            token:
              type: string
              description: >
                The invite token, shown exactly once. The server
                stores only a hash.
      description: A created invite with its one-time-visible token.

    InviteList:
      type: object
      description: All invites.
      required: [invites]
      properties:
        invites:
          type: array
          description: Invites, newest first.
          items:
            $ref: "#/components/schemas/Invite"
