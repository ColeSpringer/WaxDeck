        "409":
          $ref: "#/components/responses/ReadOnly"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /items/{pid}/play-info:
    get:
      operationId: getPlayInfo
      summary: Resolve a playable stream for an item
      description: >
        Returns everything a client needs to start playback: a short-TTL,
        origin-relative stream URL (media-token authenticated, so it is playable
        by bare `<audio>` elements, cast devices, and DLNA renderers that cannot
        send headers), the served format, and expiry. Clients re-request
        play-info when a stream URL expires or the server signals
        `stream-stale`. On a server running without the streaming
        engine, the url serves the item's original file bytes directly
        (ranged, no transcoding, in whatever format the file is in)
        through the same endpoint downloads use, attachment
        disposition and byte-identity pin included; expiry is
        enforced per request, so an in-flight fetch completes but a
        later range request after `expiresAt` answers
        `unauthenticated` and the client re-requests play-info. An
        item carved out of a larger file additionally carries
        `spanStartMs`/`spanEndMs` and the client plays only that
        window; a client that does not implement the window MUST
        treat a span-bearing response as unplayable rather than play
        the served audio whole. A multi-file audiobook resolves one
        part per call:
        pass `positionMs` (book-timeline milliseconds) to get the part
        containing that position, and read `partIndex`, `partCount`, and
        `partStartMs` from the response; when playback crosses the end of
        a part, re-request play-info with the new book-timeline position.
        The response's `durationMs` is always the duration of what the
        client plays: the resolved part for multi-file books, and the
        item's own window, never the backing file, for span-carved
        direct playback; the book total
        lives on the item summary and the book detail. Positions reported
        to play-state for multi-file books are always book-timeline
        milliseconds (`partStartMs` plus the in-part position). A podcast
        episode whose audio has not been fetched to the server resolves by
        enclosure passthrough: the url points at `/media/enclosure`, which
        relays the feed's own enclosure through this origin (a proxy, not
        a redirect, so the listener's address never reaches the podcast
        host and the web build can play it). Ranges pass both ways, so
        scrubbing works when the host honours them. Passthrough audio is
        not analyzed, so the skip map stays `unavailable` and neither
        silence trim nor voice boost applies until the episode is fetched,
        and `seekable` is best effort for passthrough: whether the host
        honours ranges is unknown until the first upstream request. The
        episode still reports `downloaded: false`, and fetching it is
        still what makes it play from local bytes with analysis. Only an
        episode whose feed named no enclosure at all answers `conflict`.
      tags: [playback]
      parameters:
        - $ref: "#/components/parameters/Pid"
        - name: positionMs
          in: query
          description: >
            Book-timeline position in milliseconds; selects which part of
            a multi-file audiobook to resolve. Omitting it resolves the
            first part. Ignored for single-file items.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: voiceBoost
          in: query
          description: >
            Request server-side spoken-word loudness normalization
            (compression plus leveling gain) applied to the stream, for
            clients without local DSP. Precedence is resolved here, at
            mint time: when this parameter is present it wins; when
            absent, the caller's stored setting for the show or book
            applies. Honored only for podcast episodes and audiobooks,
            only when the streaming engine supports it, and only when
            the item's measured loudness is known; the response's
            `voiceBoost` always reports the actual outcome. Applying it
            forces a transcode.
          schema:
            type: boolean
      responses:
        "200":
          description: Stream resolution for the item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayInfo"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            The item cannot stream (code `conflict`): a podcast episode
            whose audio has not been fetched to the server and whose feed
            named no enclosure to relay. An unfetched episode that does
            have an enclosure answers 200 with a passthrough url instead.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /items/{pid}/download-info:
    get:
      operationId: getDownloadInfo
      summary: Resolve an offline download for an item
      description: >
        Returns everything a client needs to download the item's original
        bytes for offline playback: one entry per backing file (a track
        has one; a multi-file audiobook lists every part in reading
        order), each with a short-TTL, origin-relative,
        media-token-authenticated URL serving the untranscoded file with
        range support, so interrupted downloads resume. The download
        responses carry a `Content-Disposition` derived from each entry's
        `fileName` and an `ETag` equal to the entry's `etag`, a strong
        validator of the exact file bytes: resume ranges with
        `If-Range: <etag>`, and when it no longer matches (the file was
        retagged, replaced, or upgraded) restart that file's transfer.
        The separate `essenceHash` identifies the audio content
        independently of tags and location; clients key their download
        store on it, so a retag or move never forces a re-download of
        audio they already hold (the restarted transfer replaces the
        stored file under the same key). Items carved out of a larger
        file (CUE-backed virtual tracks) resolve to their containing
        file plus a `spanStartMs`/`spanEndMs` playback window. When a
        URL expires mid-download, re-request download-info and resume by
        range against the fresh URL. A download URL whose file changed
        on disk answers `stream-stale`; re-request download-info.
      tags: [playback]
      parameters:
        - $ref: "#/components/parameters/Pid"
      responses:
        "200":
          description: Download resolution for the item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadInfo"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /items/{pid}/play-state:
    get:
      operationId: getPlayState
      summary: Get the caller's playback state for an item
      description: >
        The calling user's saved playback state for the item: resume
        position, play count, and flags. Items never played return a zero
        state, not a 404.
      tags: [playback]
      parameters:
        - $ref: "#/components/parameters/Pid"
      responses:
        "200":
          description: The caller's state for the item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayState"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"
    put:
      operationId: putPlayState
      summary: Checkpoint the caller's playback position
      description: >
        Persists the calling user's resume position for the item. Every call
        writes through, so clients keep the cadence coarse: checkpoint on
        pause, stop, and track change, and every few seconds during
        playback, never per tick.
      tags: [playback]
      parameters:
        - $ref: "#/components/parameters/Pid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayStateUpdate"
      responses:
        "204":
          description: Position saved.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /items/{pid}/played:
    put:
      operationId: setPlayed
      summary: Set or clear an item's played and finished flags
      description: >
        Sets the calling user's played and finished flags for the item
        directly and returns the resulting playback state. This is the
        other direction from the completion rules, which are monotonic by
        construction: a position checkpoint can mark an item played and
        finished but never un-mark it, so undoing a mis-tapped "mark
        finished" needs its own verb.

        Position is untouched, so a client undoing a mark writes the old
        position through `PUT /items/{pid}/play-state` and clears the
        flags here. Three combinations are refused with
        `invalid-request`: a negative play count, `finished` without
        `played` (every UI renders that row as finished while
        `played is false` still matches it), and `played` with an
        explicit `playCount` of 0 (zeroing the count is what un-marking
        means).
      tags: [playback]
      parameters:
        - $ref: "#/components/parameters/Pid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayedUpdate"
      responses:
        "200":
          description: The caller's updated state for the item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayState"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

