        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /organize/profiles:
    get:
      operationId: listOrganizeProfiles
      summary: List organize profiles
      description: >
        The server-configured organize profiles (path templates per
        media kind, whether organize writes tags). Profiles are
        server configuration, not API-editable: template mistakes
        move files, so they change deliberately.
      tags: [organize]
      responses:
        "200":
          description: The profiles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizeProfiles"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /organize/preview:
    post:
      operationId: previewOrganize
      summary: Dry-run an organize pass
      description: >
        Plans the moves and renames a profile would make for the
        named items (or the whole library when `itemPids` is absent)
        without touching anything. The response carries the first
        five hundred actions plus the total, so a whole-library
        preview stays a bounded page; sidecars (covers, lyrics, cue
        sheets) ride along with their file and are not listed
        separately. Path templates are sandboxed upstream (per
        segment sanitizing; a template cannot escape the library
        root).
      tags: [organize]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizeRequest"
      responses:
