        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /items/{pid}/skip-map:
    get:
      operationId: getSkipMap
      summary: Get an item's silence skip map
      description: >
        Precomputed silence spans for client-side trimming of spoken-word
        content: clients skip a mapped span by seeking to its end, so
        positions stay honest on every platform and the hours-saved
        arithmetic is exact (trimming therefore needs a seekable
        stream). Maps are keyed to the item's audio essence and to the
        upstream detector version, so a re-encode or a detector
        revision invalidates them; offline clients compare the
        response's `essenceHash` against their download store to spot
        a stale stored map. Maps are per audio file: for a multi-file
        audiobook, pass `partIndex` to get the map of one part, with
        spans in that part's own timeline. Only podcast episodes and
        audiobooks are mapped; other items, and episodes whose audio
        is not fetched to the server yet, answer `unavailable` (an
        episode may become mappable after its fetch). When no map
        exists yet the server queues analysis and answers `pending`;
        poll again later (analysis runs in the background at low
        priority, and repeated polls coalesce onto the single queued
        analysis). Downloads for offline playback should fetch and
        store this map alongside the audio, or trimming silently stops
        working in airplane mode.
      tags: [playback]
      parameters:
        - $ref: "#/components/parameters/Pid"
        - name: partIndex
          in: query
          description: >
            Zero-based part of a multi-file audiobook to map. Ignored
            for single-file items.
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: The skip map, or its pending or unavailable state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkipMap"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /items/{pid}/waveform:
    get:
      operationId: getWaveform
      summary: Get an item's waveform overview
      description: >
        The item's amplitude envelope, for painting a waveform behind a
        seek bar. A pure read: the values come from the catalog's analyze
        pass and this endpoint computes nothing and queues nothing, so a
        server whose analyze pass has never run answers `pending`
        everywhere. `POST /library/analyze` and the `analyze` schedule are
        what produce them.

        `peaks` is one value per bucket, `0` silence and `255` full
        scale, at the fixed `resolution` the catalog stores (1000 buckets
        per track today, about a kilobyte). There is no `points`
        parameter: a resizable seek bar has to downsample to its own
        pixel width anyway, and a server-side width would add a query
        dimension to the cache key for work the renderer does for free.
        The stored values are 16-bit and narrowed to a byte here, so the
        low bits are dropped rather than rounded; that is invisible at
        any width a seek bar is drawn at.

        Waveforms are per audio file: for a multi-file audiobook, pass
        `partIndex` to get the envelope of one part, in that part's own
        timeline, and the answer echoes the `partIndex` it describes. An
        omitted `partIndex` is part zero, so a client that does not know
        about parts gets the first one rather than nothing.

        `span=item` answers one envelope over the whole item instead:
        the parts stitched in reading order into the same `Waveform`
        shape, with the buckets spread evenly across the total duration
        and each part given bucket-space in proportion to how long it
        is. That is what a book scrubber draws, because a book's
        timeline is the book rather than the file the reader happens to
        be in; `partIndex` is ignored under it, and a single-file item
        answers exactly what `span=part` would. `resolution` is not
        fixed under `span=item` - a long book gets more buckets than a
        short one, so a chapter is still a shape rather than three bars
        - so read it rather than assuming it.

        A stitched answer is `ready` only when every part has an
        envelope. A book with one unanalyzed part is `pending`, and one
        with a part that can never be measured is `unavailable`: half a
        book's envelope drawn across a whole book's timeline would be
        silence somebody could seek into, which is a convincing wrong
        answer rather than a partial one.

        `state` is `ready`, `pending` (this item is analyzable and has
        not been analyzed yet; poll again after an analyze pass), or
        `unavailable` (there will never be a waveform for this item).
        Read `unavailable` as final. Three populations answer it: podcast
        episodes, which are deliberately never analyzed; a track carved
        out of a shared file by a cue sheet, which has no envelope of
        its own to report; and a file the pass analyzed but could not
        measure, which is not retried until its audio changes. A client
        should draw its plain seek bar for `unavailable` rather than
        spinning. A book part whose file has simply not been analyzed
        yet is `pending`, not `unavailable`, so a partly analyzed book
        can report the two states across its parts.

        A `ready` answer is content-addressed by the audio essence of
        the file being described (so a multi-file book's parts carry
        different validators) and cacheable for a day; revalidate with
        `If-None-Match`. `pending` and `unavailable` are `no-store`,
        since both are expected to change.
      tags: [playback]
      parameters:
        - $ref: "#/components/parameters/Pid"
        - name: partIndex
          in: query
          description: >
            Zero-based part of a multi-file audiobook to describe.
            Ignored for single-file items and under `span=item`. Out of
            range is `not-found`, matching the skip map.
          schema:
            type: integer
            minimum: 0
        - name: span
          in: query
          description: >
            What the envelope covers: one part (the default), or the
            whole item stitched across its parts.
          schema:
            type: string
            enum: ["part", "item"]
            default: "part"
        - name: If-None-Match
          in: header
          description: Previously returned `ETag`; a match answers 304 with no body.
          schema:
            type: string
      responses:
        "200":
          description: The waveform, or its pending or unavailable state.
          headers:
            ETag:
              description: >
                Validator derived from the audio essence of the file
                being described, which for a multi-file book is the
                requested part. Present on `ready` only; the other two
                states are not cacheable.
              schema:
                type: string
            Cache-Control:
              description: >
                `private, max-age=86400, stale-while-revalidate=604800`
                for `ready`, `no-store` otherwise. Not `immutable`: the
                URL names a pid, not the bytes, so re-analysis under the
                same pid has to be able to invalidate it.
              schema:
                type: string
            Vary:
              description: >
                `Cookie, Authorization`: the credential decides whether
                this item exists for a caller, so a cached copy is never
                reused across sessions on a shared browser.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Waveform"
        "304":
          description: >
            The cached waveform is still current. It carries the same
            validator and freshness the body would have.
          headers:
            ETag:
              description: Validator for the cached waveform.
              schema:
                type: string
            Cache-Control:
              description: The same directive the 200 carries.
              schema:
                type: string
            Vary:
              description: The same credentials the 200 varies by.
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /play-states:
    post:
      operationId: listPlayStates
      summary: Read the caller's playback state for many items
      description: >
        Batch read of the calling user's playback state, for hydrating a
        client mirror without one request per item (a device restoring
        thousands of downloads asks in pages of 500). A POST because the
        PID list rides the body; nothing changes server-side. The
        response carries states only for requested items the caller can
        see and has ever touched; an absent PID means a zero state (or no
        visibility, which looks identical by design). Order is not
        significant.
      tags: [playback]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayStateQuery"
      responses:
        "200":
          description: The caller's states for the requested items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayStateList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /listens:
    post:
      operationId: reportListens
      summary: Report listen sessions
      description: >
        Ingests one or more listen sessions. Every session carries a
        client-generated idempotency ID; the server deduplicates on ingest,
        so replaying a batch (an offline queue flushing alongside a live
        report of the same session) can never double-count. Sessions from
        other services ride the same path with `source` set, carrying their
        original timestamps (backdated imports). Per-session rejections in
        the response are permanent (the session can never be recorded);
        transient conditions fail the whole request instead, and clients
        retry the batch, which deduplication makes safe.
      tags: [playback]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListenReport"
      responses:
        "200":
          description: Ingest outcome for the batch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListenIngestResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /player/endpoints:
    get:
      operationId: listPlayerEndpoints
      summary: List player endpoints
      description: >
        Every endpoint the caller can play to or control: the caller's own
        registered client endpoints (first-party clients connected over
        the WebSocket that declared themselves controllable) plus shared
        device endpoints the server drives itself (cast targets, DLNA
        renderers, the jukebox output). Client endpoints exist while
        their WebSocket connection lives; device endpoints reflect the
        most recent discovery sweep and carry `online` accordingly.
        Unpaginated: a household has tens of endpoints, not thousands.
      tags: [player]
      responses:
        "200":
          description: The visible endpoints, device endpoints first, then by name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerEndpointList"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /player/sessions:
    get:
      operationId: listPlaybackSessions
      summary: List playback sessions
      description: >
        Active playback sessions visible to the caller: the caller's own
        sessions on any endpoint, plus other users' sessions playing on
        shared endpoints. Ordered by most recent activity. Unpaginated
        for the same reason as the endpoint list (an endpoint plays at
        most one session).
      tags: [player]
      responses:
        "200":
          description: The visible sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackSessionList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      operationId: createPlaybackSession
      summary: Start playback on an endpoint
      description: >
        Loads a queue onto an endpoint and starts a server-tracked
        playback session there ("play on the kitchen speaker"). An
        endpoint plays at most one session: starting a new session on an
        endpoint that already has one ends the old session first,
        whoever owned it (physical outputs are last-writer-wins, like
        the speaker itself). Item pids must all be visible to the
        caller; the server shapes stream delivery for the target
        endpoint's capabilities, re-minting URLs as needed, so the same
        queue plays on a phone, a cast device, or a renderer without
        the caller caring about formats. Sessions on device endpoints
        are server-authoritative; a session created on one of the
        caller's own client endpoints is loaded onto that client and
        then mirrors the client's local playback. Conflict with code
        `endpoint-offline` means the target endpoint is not connected
        right now, and `timeout` means it is connected but did not
        answer in time. A queue the target cannot play answers
        `feature-unavailable` naming the pid - a multi-part audiobook
        or a windowed track sent to a device endpoint, say - which a
        controller can turn into an offer to play it somewhere that
        can, rather than a bare failure. When the target is a client
        endpoint, that client's own refusal code and message are what
        arrive here - `endpoint-failed` where it took the load and
        could not carry it out.
      tags: [player]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaybackSessionCreate"
      responses:
        "201":
          description: The started session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackSession"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/PlaybackConflict"
        "501":
          $ref: "#/components/responses/FeatureUnavailable"

  /player/sessions/history:
    get:
      operationId: listPlaybackSessionHistory
      summary: List the caller's ended playback sessions
      description: >
        What was playing, where, and how far in - for the sessions
        that have stopped. This is the queue-restore surface: an
        entry carries the whole queue with its index and position, so
        "pick up where I left off" needs no second call. Distinct from
        `/player/sessions`, which lists what is playing now and never
        includes these rows.

        Only the caller's own sessions appear, whatever they played
        on: a shared speaker's sessions are visible to housemates
        while they are live, and become private history when they
        end. The server retains a small number of recent sessions per
        user (five at present) and prunes the rest, so this list is
        short and unpaged by design; it is a resume affordance, not a
        listening log. Ended sessions are also what a restart leaves
        behind, since playback never resumes by itself: the session
        interrupted by a server restart is a history entry too, and
        resuming it is the caller's choice.

        A session ended through `DELETE /player/sessions/{sessionId}`
        appears here as soon as that call answers. One that ends any
        other way - a playing client disconnecting, a device leaving
        the network, a server restart - appears shortly after, and its
        position is the last one checkpointed rather than the last one
        played. Checkpoints run every few seconds while a session is
        playing, so the gap is small, but it is a gap.
      tags: [player]
      responses:
        "200":
          description: The caller's ended sessions, most recent first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackSessionHistoryList"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /player/sessions/{sessionId}:
    get:
      operationId: getPlaybackSession
      summary: Get one playback session
      description: >
        One session's current state. Position is a snapshot: `positionMs`
        was true at `positionAt`, and controllers extrapolate forward
        with `rate` while `playing` (live updates ride the WebSocket
        `watch` flow). A session outside the caller's visibility answers
        `not-found`.
      tags: [player]
      parameters:
        - $ref: "#/components/parameters/PlaybackSessionId"
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackSession"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deletePlaybackSession
      summary: End a playback session
      description: >
        Stops playback on the session's endpoint and ends the session.
        Ending another user's session requires it to be on a shared
        endpoint, the same rule as controlling it.
      tags: [player]
      parameters:
        - $ref: "#/components/parameters/PlaybackSessionId"
      responses:
        "204":
          description: Session ended.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /player/sessions/{sessionId}/transfer:
    post:
      operationId: transferPlaybackSession
      summary: Transfer a session to another endpoint
      description: >
        Moves live playback to another endpoint, keeping the queue and
        the extrapolated position ("pick up where you left off"). The
        server snapshots the session, loads the target with stream URLs
        shaped for its capabilities, then stops playback on the source;
        the session keeps its id and changes `endpointId`, so
        controllers keep following the same session. Transferring to a
        client endpoint hands the queue to that client, which resumes
        local playback and reports back (`authority` becomes `mirror`);
        transferring to a device endpoint makes the session
        server-authoritative. A brief overlap or gap at the seam is
        inherent; position is carried, not resynthesized. Authorization
        follows control with one tightening: your own sessions may
        transfer to any endpoint you can see, while a session you do
        not own may only be transferred to a shared endpoint (moving
        someone's queue onto your private device would take it out of
        their sight). Transferring a session to the endpoint it is
        already on is a no-op answering 200. Conflict with code
        `endpoint-offline` means the target endpoint is not connected,
        and `timeout` means it is connected but did not answer in time.
        A queue the target cannot play answers `feature-unavailable`
        naming the pid, on the same terms as starting a session there;
        when the target is a client endpoint, that client's own refusal
        code and message are what arrive here - `endpoint-failed` where
        it took the transfer and could not carry it out. The tightening is
        a `forbidden`, not a `not-found`: the session is one the caller
        can see and control, and it is the target endpoint that is out
        of bounds.
      tags: [player]
      parameters:
        - $ref: "#/components/parameters/PlaybackSessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaybackSessionTransfer"
      responses:
        "200":
          description: The session, now on the target endpoint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackSession"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/PlaybackConflict"
        "501":
          $ref: "#/components/responses/FeatureUnavailable"

  /player/timeline:
    post:
      operationId: createQueueTimeline
      summary: Mint a gapless queue timeline
      description: >
        Renders an ordered queue of visible items as one continuous
        stream through the streaming engine: sample-exact seams, no
        discontinuities, with optional equal-power crossfade. The
        response's single HLS URL plays the whole queue; `boundaries`
        map each item onto the combined timeline (offsets in samples at
        `envelopeRate`; under a crossfade consecutive members overlap),
        so a client can render per-track position and seek across
        members without probing. Timelines are immutable: editing the
        queue means minting a new timeline and switching URLs. The URL
        is media-token authenticated, and the token lives at least the
        timeline's duration plus margin (`expiresAt` reflects it), so
        a queue never expires mid-listen; a member file changing on
        disk surfaces as `stream-stale`, and a timeline aged out of
        the engine's store answers `not-found` on fetch. Re-request
        this endpoint in either case. Minting may first need to
        measure member lengths (MP3 sources are scanned); the server
        absorbs short measurements into this request, and when one
        outlasts the request budget it answers 202 with a job to poll,
        after which re-requesting answers 201 immediately. Requires
        the streaming engine with timeline support
        (`feature-unavailable` otherwise). Items whose delivery cannot
        join a timeline (unfetched podcast episodes, unsupported
        sources) answer `conflict` naming the pid, and a
        `crossfadeSeconds` longer than the shortest queue member can
        carry answers `invalid-request` naming it.
      tags: [player]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimelineCreate"
      responses:
        "201":
          description: The minted timeline.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimelineInfo"
        "202":
          description: >
            Member measurement is still running. Poll the job, then
            re-request the timeline.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "501":
          $ref: "#/components/responses/FeatureUnavailable"

  /player/cast/preflight:
    get:
      operationId: getCastPreflight
      summary: Check cast reachability
      description: >
        Server-side diagnosis of the bases a cast device would fetch
        media from, before the user hits a silent cast failure. For each
        candidate advertise base (the configured public base and the
        auto-detected LAN address), the server verifies it can fetch
        itself through that base and reports plain-language notes about
        scheme, certificate, and name-resolution problems (cast devices
        require publicly trusted certificates for HTTPS and often ignore
        LAN DNS; the plain-HTTP LAN base exists so casting works with
        zero TLS setup). A reachable base here does not guarantee the
        device can reach it, but an unreachable one reliably predicts
        failure. Exposing the configured and detected bases to every
        authenticated user is intentional: casting is a household
        activity, and any LAN peer learns these addresses trivially.
      tags: [player]
      responses:
        "200":
          description: Candidate bases, in the order sessions will try them.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CastPreflight"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /playlists:
    get:
      operationId: listPlaylists
      summary: List playlists visible to the caller
      description: >
        Keyset-paginated list of the caller's own playlists plus every
        shared playlist, ordered by name then pid. A static entry
        carries a live `itemCount`, exact for this caller. Smart
        entries omit it (evaluating every rule to draw a page of tiles
        is work a listing does not do); fetch the playlist detail for
        a computed count.
      tags: [playlists]
      parameters:
        - name: cursor
          in: query
          description: >
            Opaque keyset cursor from a previous page's `nextCursor`. Omit for
            the first page.
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum playlists per page.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: containsItem
          in: query
          description: >
            An item pid. Restricts the page to static playlists whose
            stored members include the item, for add-to-playlist
            surfaces that mark existing membership. Smart playlists
            are always omitted from a filtered listing.
          schema:
            type: string
      responses:
        "200":
          description: One page of playlists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"
    post:
      operationId: createPlaylist
      summary: Create a playlist
      description: >
        Creates a manual (`static`) or rule-based (`smart`) playlist
        owned by the caller. A smart playlist requires `rule` and
        rejects `itemPids`; a static playlist rejects `rule` and may
        seed initial members via `itemPids` (invisible or unknown
        items fail the request). The rule is validated on write:
        unknown fields, unknown operators, unknown node types, or
        operator and field combinations the engine rejects answer
        `invalid-request` with a message naming the offending
        condition.
      tags: [playlists]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaylistCreate"
      responses:
        "201":
          description: The created playlist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playlist"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /playlists/rule-fields:
    get:
      operationId: getRuleFields
      summary: Discover smart rule fields
      description: >
        The field vocabulary for smart playlist rules: every rule
        field with its value kind, the operators it accepts, whether
        it reads per-user state, and whether it can sort; plus the
        catalog's custom tag keys (usable as `tag.KEY` fields) with
        item counts, most used first. Rule editors build their
        dropdowns from this instead of hardcoding the vocabulary.
      tags: [playlists]
      responses:
        "200":
          description: The rule field vocabulary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleFields"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /playlists/preview:
    post:
      operationId: previewSmartRule
      summary: Preview a smart rule
      description: >
        Evaluates a rule without storing anything and returns the
        first matching items plus the total match count, computed
        against the caller's own user state and library visibility.
        Rule editors call this while the user builds the rule.
      tags: [playlists]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SmartRule"
      parameters:
        - name: limit
          in: query
          description: Maximum preview items to return.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Preview items and total match count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistPreview"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /playlists/m3u:
    post:
      operationId: importPlaylistM3u
      summary: Import an M3U8 playlist
      description: >
        Creates a static playlist from an M3U8 document, matching each
        entry to a cataloged item by exact path or unique
        relative-path suffix. Unmatched paths are skipped and
        reported, never invented; an empty document yields an empty
        playlist.
      tags: [playlists]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/M3uImport"
      responses:
        "201":
          description: The created playlist and per-entry match results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/M3uImportResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /playlists/nsp:
    post:
      operationId: importPlaylistNsp
      summary: Import a Navidrome smart playlist (NSP)
      description: >
        Creates a **smart** playlist from an NSP document, which is the
        request body itself. The document's `name` names the playlist
        (the `name` parameter overrides it, and is what lets a nameless
        document be imported) and `public` sets its visibility;
        `comment` is read and discarded, since a WaxDeck playlist has
        no comment.


        Fields map onto the rule vocabulary
        (`GET /playlists/rule-fields`): `title`, `album`, `artist`,
        `albumartist`, `genre`, `year`, `playCount` by name, plus
        `dateAdded` to `addedAt`, `lastPlayed` to `lastPlayedAt`,
        `filepath` to `path`, `loved` to `starred`, `duration` to
        `durationMs`, and `rating`. Two of those carry different units
        on each side and are **rescaled**: NSP counts duration in
        seconds where WaxDeck counts milliseconds, and rates 0 to 5
        where WaxDeck rates 0 to 100, so an unscaled `rating gt 3`
        would mean "rated above 3 out of 100", which is every rated
        track.


        `notContains` imports as a `not` node wrapping `contains`;
        every other operator has a WaxDeck spelling of the same name.


        Mapping is **all-or-nothing** by default. A field, an operator,
        or a top-level key with no faithful counterpart rejects the
        whole document, naming **every** offender, rather than
        importing a rule that means something else - a document that
        imported as a quietly different playlist is worse than one that
        did not import. That covers fields the catalog has no answer
        for (`bitrate`, `size`, `bpm`, the `mbz_*` identifiers, and the
        rest), `limitPercent` and any other unrecognised top-level key,
        `inPlaylist`/`notInPlaylist`, and the absolute date operators
        (`before`, `after`, `is`) on `dateAdded` and `lastPlayed`,
        whose naive local dates have no faithful reading against the
        catalog's stored instants. `sort: random` maps to the random
        limit mode and needs a positive `limit`.


        `partial=true` accepts the loss instead: the unmappable parts
        are dropped and what is left becomes the rule. Still refused
        when nothing survives, since a rule with every condition
        dropped matches the whole library, and when the document is
        malformed rather than merely unmappable. Ask
        `POST /playlists/nsp/report` first to see what would go.
      tags: [playlists]
      parameters:
        - name: name
          in: query
          required: false
          description: >
            Name for the created playlist, overriding the document's
            own. Required when the document carries no `name`.
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: partial
          in: query
          required: false
          description: >
            Import what maps and drop the rest, rather than refusing
            the whole document.
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        description: >
          The NSP document, at most 1 MiB. A free-form object carries no
          `maxLength`, so the bound is enforced on the way in and
          answers `invalid-request`.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NspDocument"
      responses:
        "201":
          description: The created smart playlist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playlist"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /playlists/nsp/report:
    post:
      operationId: reportPlaylistNspImport
      summary: Report what an NSP import would lose
      description: >
        What importing this document would drop, without importing it.
        Nothing is created and nothing is changed.


        Answers a report rather than refusing: the point is to see the
        loss before choosing between the strict import and
        `partial=true`. Its only failure is a document that is not
        readable JSON at all, which is not a gap in the mapping but a
        broken file.
      tags: [playlists]
      requestBody:
        required: true
        description: The NSP document, at most 1 MiB.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NspDocument"
      responses:
        "200":
          description: Everything the import could not carry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NspReport"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /playlists/{pid}:
    get:
      operationId: getPlaylist
      summary: Get one playlist
      description: >
        Playlist detail. For a smart playlist this includes the rule
        and a freshly computed `itemCount` (evaluated as the owner for
        shared lists, as the caller for the caller's own).
      tags: [playlists]
      parameters:
        - $ref: "#/components/parameters/Pid"
      responses:
        "200":
          description: The playlist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playlist"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"
    patch:
      operationId: updatePlaylist
      summary: Update a playlist
      description: >
        Partial update: renames a playlist, changes its visibility, or
        replaces a smart playlist's rule. Owner only. Omitted
        properties stay unchanged (this is a PATCH; a bare rename
        never touches the rule). Replacing the rule applies in place
        under the same pid; the response carries the updated playlist.
        Supplying `rule` for a static playlist answers
        `invalid-request`. Changing a shared playlist to `private`
        removes it from other users' view; their sync streams see it
        become absent.
      tags: [playlists]
      parameters:
        - $ref: "#/components/parameters/Pid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaylistUpdate"
      responses:
        "200":
          description: The updated playlist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playlist"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"
    delete:
      operationId: deletePlaylist
      summary: Delete a playlist
      description: Deletes a playlist. Owner only.
      tags: [playlists]
      parameters:
        - $ref: "#/components/parameters/Pid"
      responses:
        "204":
          description: Playlist deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /playlists/{pid}/items:
    get:
      operationId: listPlaylistItems
      summary: List a playlist's items
      description: >
        The playlist's members in order: stored order for a static
        playlist, rule order for a smart playlist (evaluated against
        the owner's user state for shared lists, the caller's for
        their own). Items outside the caller's library visibility are
        omitted, so a static playlist's `position` values are not
        guaranteed contiguous for restricted viewers; use `position`,
        never the row index, when removing members.
        Keyset-paginated within one evaluation; a membership change
        between pages may shift entries.
      tags: [playlists]
      parameters:
        - $ref: "#/components/parameters/Pid"
        - name: cursor
          in: query
          description: >
            Opaque cursor from a previous page's `nextCursor`. Omit for
            the first page.
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum items per page.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: One page of playlist items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistItemsPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"
    put:
      operationId: replacePlaylistItems
      summary: Replace a static playlist's members
      description: >
        Replaces the full ordered member list; this is also the
        reorder primitive (send the same members in the new order).
        Owner only; static playlists only (a smart playlist's
        membership is its rule). Unknown or invisible items fail the
        request. When the playlist holds members outside the owner's
        current library visibility the replace is refused with
        `conflict` (a list built from what the owner can see would
        silently drop them); appends still work. Playlist edits are
        live-only: clients must not queue them for offline replay
        (a stale full-list replay would revert another device's
        edits). The optional `baseUpdatedAt` precondition makes the
        lost-update window explicit: when supplied and older than the
        playlist's current `updatedAt`, the replace answers
        `conflict` and the client refetches before retrying.
      tags: [playlists]
      parameters:
        - $ref: "#/components/parameters/Pid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaylistItemsUpdate"
      responses:
        "204":
          description: Members replaced.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"
    post:
      operationId: addPlaylistItems
      summary: Append items to a static playlist
      description: >
        Appends items in the given order. Owner only; static playlists
        only. Duplicates are allowed (a playlist may repeat a track);
        clients wanting dedupe check membership first.
      tags: [playlists]
      parameters:
        - $ref: "#/components/parameters/Pid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaylistItemsUpdate"
      responses:
        "204":
          description: Items appended.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /playlists/{pid}/items/{position}:
    delete:
      operationId: removePlaylistItemAt
      summary: Remove one member by position
      description: >
        Removes the member at the given zero-based position in the
        stored order. Owner only; static playlists only. Positions are
        the unfiltered stored order (visibility filtering never shifts
        them); take them from the item listing's `position` field, not
        from a rendered row index.
      tags: [playlists]
      parameters:
        - $ref: "#/components/parameters/Pid"
        - name: position
          in: path
          required: true
          description: Zero-based position in the stored member order.
          schema:
            type: integer
            minimum: 0
      responses:
        "204":
          description: Member removed.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /playlists/{pid}/m3u:
    get:
      operationId: exportPlaylistM3u
      summary: Export a playlist as M3U8
      description: >
        The playlist as an M3U8 document, for interop with path-based
        players. Entries are the cataloged display paths (absolute
        server-side paths); exposing them is deliberate, since
        playlists reach only this server's own users and path-based
        interop is the point of the format. A smart playlist exports
        its current evaluation. The import side matches by exact path
        or unique relative-path suffix, so documents exported from a
        differently-rooted server still resolve.
      tags: [playlists]
      parameters:
        - $ref: "#/components/parameters/Pid"
      responses:
        "200":
          description: The M3U8 document.
          content:
            audio/x-mpegurl:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /playlists/{pid}/nsp:
    get:
      operationId: exportPlaylistNsp
      summary: Export a smart playlist as NSP
      description: >
        The playlist's rule as a Navidrome smart playlist document.
        A static playlist has no rule and answers
        `feature-unavailable`.


        Export is **all-or-nothing** by default, like the import: a rule
        holding anything NSP cannot say is refused with **every**
        offender named, rather than written as a document that means
        something else. WaxDeck's rule vocabulary is the larger one, so
        this is the common answer for a rule built in the editor.
        `notContains` is the only negation NSP can carry, so every
        other `not` refuses; `gte`, `lte`, `isPresent`, and `isMissing`
        have no NSP form; the `minutes` and `megabytes` limit modes and
        a pinned random seed have none; a rating that is not a whole
        number of stars has none; NSP sorts on one term, so a rule
        ordered by a second refuses rather than dropping it; and
        neither do the fields NSP does not carry (`mediaType`, `state`,
        `source`, `container`, `codec`, `podcast`, `season`,
        `publishedAt`, `updatedAt`, `starredAt`, `played`, `finished`,
        `albumBarcode`, `albumLabel`, `albumCatalogNumber`,
        `albumMedia`, `albumCountry`, `tag.KEY`, and `playlist`).
        `albumArtist` is **not** among them: NSP carries it, and it
        round-trips.


        `partial=true` accepts the loss instead: the parts NSP cannot
        say are dropped and the rest is written. Still refused when
        nothing survives, since a document with every condition dropped
        matches the whole library on the far side. Ask
        `GET /playlists/{pid}/nsp/report` first to see what would go.


        The response carries the playlist's own `name`, and `public`
        when it is shared - neither is part of the rule.
      tags: [playlists]
      parameters:
        - $ref: "#/components/parameters/Pid"
        - name: partial
          in: query
          required: false
          description: >
            Export what maps and drop the rest, rather than refusing
            the whole rule.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The NSP document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NspDocument"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/FeatureUnavailable"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /playlists/{pid}/nsp/report:
    get:
      operationId: reportPlaylistNspExport
      summary: Report what an NSP export would lose
      description: >
        What exporting this playlist's rule as NSP would drop, without
        exporting it.


        Answers a report rather than refusing: the point is to see the
        loss before choosing between the strict export and
        `partial=true`. A static playlist has no rule and so answers
        `feature-unavailable`, which is the one thing this can refuse
        for.


        Deliberately its own operation rather than something a
        successful `partial=true` carries back. The export's 200 body
        is the document another server reads, so a report key beside
        `all`, `sort` and `limit` would either be rejected over there
        or silently change what the document means.
      tags: [playlists]
      parameters:
        - $ref: "#/components/parameters/Pid"
      responses:
        "200":
          description: Everything the export could not carry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NspReport"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/FeatureUnavailable"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /playlists/import:
    post:
      operationId: importPlaylist
      summary: Import a streaming-service playlist
      description: >
        Imports a playlist exported from a streaming service, matching
        each entry against the library through the portable-ref
        resolve ladder (exact identifiers first, then fingerprints,
        then descriptive artist, title, album, and duration matching).
        Sources: `spotify` (Exportify CSV), `applemusic` (the
        tab-separated export), `ytmusic` (Google Takeout CSV), `csv`
        (generic with artist, title, album, duration columns), `text`
        (one `Artist - Title` per line), and `portable` (the `refs`
        array from another WaxDeck's portable export). When any entry
        resolves, a manual playlist is created with the resolved
        tracks in order and `missing` reports the rest; when nothing
        resolves, no playlist is created and `playlistPid` is absent.
        Unresolved entries carrying an ISRC are upgraded to a
        recording identifier through MusicBrainz when the server has
        internet, within a bounded lookup budget; without it the
        import still runs on the descriptive rung.
      tags: [playlists]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaylistImportRequest"
      responses:
        "200":
          description: The import report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistImportResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /playlists/{pid}/portable:
    get:
      operationId: exportPlaylistPortable
      summary: Export a playlist as portable refs
      description: >
        Exports a playlist as portable refs: catalog-independent
        identity descriptors (audio essence, external identifiers,
        acoustic fingerprint, descriptive fields) that resolve on any
        other WaxDeck through the playlist import endpoint's
        `portable` source. Smart playlists export their current
        evaluation.
      tags: [playlists]
      parameters:
        - $ref: "#/components/parameters/Pid"
      responses:
        "200":
          description: The portable playlist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortablePlaylist"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /podcasts:
    get:
      operationId: listSubscriptions
      summary: List the caller's podcast subscriptions
      description: >
        Keyset-paginated list of the calling user's podcast subscriptions,
        each carrying the show summary and the caller's per-subscription
        settings. Ordering is stable (show title, then pid).
      tags: [podcasts]
      parameters:
        - name: cursor
          in: query
          description: >
            Opaque keyset cursor from a previous page's `nextCursor`. Omit for
            the first page.
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum subscriptions per page.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: One page of subscriptions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"
    post:
      operationId: subscribePodcast
      summary: Subscribe to a podcast
      description: >
        Subscribes the calling user to a show. The show is cataloged
        globally on first subscription (fetching and parsing the feed, or
        resolving a YouTube channel or playlist through the acquisition
        bridge when `sourceType` is `youtube`); later subscribers attach
        to the existing show without refetching. Subscribing to a show
        the caller already follows returns the existing subscription
        with its settings unchanged (200 instead of 201), except that
        supplied credentials always replace the show's stored
        credentials: re-subscribing with new credentials is the
        rotation path. Credentials are stored once per show (the last
        supplied set wins, whoever supplied it), apply to feed and
        enclosure fetches, and are sealed at rest and never returned by
        any endpoint. Supplying credentials marks the show private (a
        global, sticky property; see the show schema).
      tags: [podcasts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscribeRequest"
      responses:
        "201":
          description: Newly subscribed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "200":
          description: The caller was already subscribed to this show.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "501":
          $ref: "#/components/responses/SourceUnavailable"
        "502":
          $ref: "#/components/responses/FeedUnreachable"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /podcasts/opml:
    get:
      operationId: exportOpml
      summary: Export the caller's subscriptions as OPML
      description: >
        OPML 2.0 document of the calling user's subscriptions, with folder
        assignments rendered as nested outlines. Private shows (see the
        show schema's sticky privacy rule) are omitted entirely, for
        every exporting user: private feed URLs are secrets and never
        leave the server in an export.
      tags: [podcasts]
      responses:
        "200":
          description: The OPML document.
          content:
            application/xml:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"
    post:
      operationId: importOpml
      summary: Import subscriptions from OPML
      description: >
        Subscribes the calling user to every feed in the document,
        honoring folder outlines (nested outline titles become the
        subscription's folder path). Feeds that fail to fetch are
        reported per entry and do not fail the import. Already-followed
        feeds are left unchanged.
      tags: [podcasts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpmlImport"
      responses:
        "200":
          description: Per-feed import results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpmlImportResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /podcasts/{pid}:
    get:
      operationId: getPodcast
      summary: Get one show with the caller's subscription state
      description: >
        Show detail for any cataloged show, subscribed or not: the show
        summary with sanitized description, whether the calling user is
        subscribed, and their per-subscription settings when they are.
      tags: [podcasts]
      parameters:
        - $ref: "#/components/parameters/Pid"
      responses:
        "200":
          description: The show and the caller's subscription state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PodcastDetail"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"
    delete:
      operationId: unsubscribePodcast
      summary: Unsubscribe from a show
      description: >
        Removes the calling user's subscription. The show, its episodes,
        and every user's playback state stay in the catalog. By default
        downloaded files stay too, governed by the remaining
        subscribers' retention; with `removeDownloads` set, and only
        when the caller was the show's last subscriber, the downloaded
        audio is removed the same way `DELETE /episodes/{pid}/fetch`
        removes it: the bytes go, the episode stays listed and
        re-fetchable, and every user's playback state is untouched. The
        bytes are not recoverable from the trash, because the source
        is. Files someone is listening to right now are skipped, as are
        any whose removal loses a race with another job on the podcast
        download tree; a skipped file stays until it is removed
        explicitly. While other subscribers remain the flag is ignored:
        the files are theirs as much as the caller's. Unsubscribing
        from a show the caller does not follow is a no-op success.
      tags: [podcasts]
      parameters:
        - $ref: "#/components/parameters/Pid"
        - name: removeDownloads
          in: query
          description: >
            Also move the show's downloaded audio to the trash when the
            caller is the last subscriber.
          schema:
            type: boolean
      responses:
        "204":
          description: The caller is not subscribed to this show anymore.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /podcasts/{pid}/settings:
    put:
      operationId: putSubscriptionSettings
      summary: Replace the caller's settings for a subscription
      description: >
        Full replace of the calling user's per-subscription settings.
        Absent fields reset to their defaults, so clients send the
        complete object (read it back from the subscription first).
        Retention resolves across subscribers as the most generous
        union, and sweeps are asynchronous: lowering `retentionKeep`
        enqueues a re-evaluation instead of deleting files inline.
      tags: [podcasts]
      parameters:
        - $ref: "#/components/parameters/Pid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionSettings"
      responses:
        "200":
          description: The updated subscription.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: >
            The caller is not subscribed to this show (code `not-found`);
            settings exist only on subscriptions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /podcasts/episodes:
    get:
      operationId: listSubscribedEpisodes
      summary: List episodes across the caller's subscriptions
      description: >
        Keyset-paginated episodes drawn from every show the caller
        follows, for the surfaces that are about the caller rather than
        about one show: what is new across their shows, and what they
        started and have not finished.

        This exists because the discovery lists cannot answer it. Those
        are over the whole library and return generic summary rows, so a
        client sifting them for episodes pays for a music collection it
        is not asking about and gets rows carrying no `showPid` and no
        `hasEnclosure`, the two fields that decide where an episode row
        links and whether it can offer to play at all.

        Ordering follows the filter: `latest` and `unplayed` are newest
        first by publication date, then pid; `in-progress` is by when the
        caller last played the episode, most recent first, which is the
        order a "pick up where you left off" strip wants.

        Episodes without a publication date are excluded from `latest`
        and `unplayed`, because publication date is what orders them and
        a feed that declares none leaves nothing to page on. Such an
        episode still appears on its own show's listing, and still counts
        toward that show's `unplayedCount`.

        A cursor is only valid for the filter it was issued under, since
        the two orders interleave differently. Sending a mismatched pair
        is `invalid-request` rather than a silently wrong page.
      tags: [podcasts]
      parameters:
        - name: filter
          in: query
          description: >
            Which episodes to page. `latest` takes every episode of
            every followed show; `unplayed` keeps only the ones the
            caller has never started (no saved position, and not past
            the played threshold); `in-progress` keeps only the ones
            with a saved position that are not finished. The two are
            disjoint, so a first checkpoint moves an episode from one
            to the other rather than leaving it in both.
          schema:
            type: string
            enum: [latest, unplayed, in-progress]
            default: latest
        - name: cursor
          in: query
          description: >
            Opaque keyset cursor from a previous page's `nextCursor`. Omit
            for the first page.
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum episodes per page.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: One page of episodes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpisodePage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /podcasts/{pid}/episodes:
    get:
      operationId: listEpisodes
      summary: List a show's episodes
      description: >
        Keyset-paginated episodes of one show, newest first (publication
        date, then pid). Available to any caller who can see the show,
        subscribed or not.
      tags: [podcasts]
      parameters:
        - $ref: "#/components/parameters/Pid"
        - name: cursor
          in: query
          description: >
            Opaque keyset cursor from a previous page's `nextCursor`. Omit for
            the first page.
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum episodes per page.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: One page of episodes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpisodePage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /podcasts/{pid}/refresh:
    post:
      operationId: refreshPodcast
      summary: Refresh a show's feed now
      description: >
        Fetches the show's feed immediately (conditional GET; a feed that
        reports no change is cheap) and reports how many new episodes
        appeared. Subscribers only: refresh failures carry upstream
        detail, and a private feed's detail belongs to its subscribers.
        Refreshes are coalesced server-side: a show synced within the
        last minute answers from that sync instead of refetching. A
        repeatedly failing feed is auto-disabled from scheduled
        refresh; a successful manual refresh re-enables it.
      tags: [podcasts]
      parameters:
        - $ref: "#/components/parameters/Pid"
      responses:
        "200":
          description: Refresh outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResult"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: >
            The caller is not subscribed to this show (code
            `forbidden`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/FeedUnreachable"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /podcasts/directory:
    get:
      operationId: searchPodcastDirectory
      summary: Search the podcast directory
      description: >
        Searches a public podcast directory (the iTunes search API) by
        name, so a show can be subscribed to without finding its feed
        URL first. Every match carries the `feedUrl` to POST to
        `/podcasts`, which is why a directory result needs no source
        kind: it is always an RSS feed. Requires internet; when the
        directory cannot be reached the endpoint answers
        `directory-unavailable` and subscribing by URL still works.
      tags: [podcasts]
      parameters:
        - name: query
          in: query
          required: true
          description: Show name search terms.
          schema:
            type: string
            minLength: 2
        - name: limit
          in: query
          description: Maximum directory entries to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Directory matches, best first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PodcastDirectoryResults"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "502":
          description: >
            The podcast directory could not be reached, or refused this
            server's request rate (code `directory-unavailable`).
            Subscribing by feed URL is unaffected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /episodes/{pid}:
    get:
      operationId: getEpisode
      summary: Get one episode's detail
      description: >
        Full episode detail: summary fields plus sanitized show notes
        (`descriptionHtml` is feed-controlled HTML reduced server-side
        to a safe allowlist; clients may render it directly) and chapter
        marks when the episode has them.

        An account without the explicit-content right gets 404 for an
        episode marked explicit and for any episode of a show marked
        explicit at the channel level, whether or not the episode itself
        carries the flag. That is the same rule the item read, the
        stream, and the subscription counts apply, so no surface can
        offer what another refuses.
      tags: [podcasts]
      parameters:
        - $ref: "#/components/parameters/Pid"
      responses:
        "200":
          description: The episode.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Episode"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /episodes/{pid}/transcript:
    get:
      operationId: getEpisodeTranscript
      summary: Get an episode's transcript
      description: >
        The episode's transcript as time-coded cues for display and
        tap-line-to-seek. Fetched from the feed's transcript pointer on
        first request and cached; the first call may take a moment. 404
        only when the episode announces no transcript; a pointer that
        exists but cannot be fetched or parsed answers
        `feed-unreachable`, so clients retry later instead of caching
        a false absence.
      tags: [podcasts]
      parameters:
        - $ref: "#/components/parameters/Pid"
      responses:
        "200":
          description: The transcript.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transcript"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/FeedUnreachable"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"
    post:
      operationId: captureEpisodeTranscript
      summary: Capture an episode's transcript for search
      description: >
        Fetches the episode's announced transcript and indexes its text so
        the episode turns up in transcript search, without downloading the
        audio. This covers an episode a listener streams but never
        downloads; a downloaded episode already indexes its transcript, and
        an already-indexed one is a no-op success. 404 when the episode
        announces no transcript; a pointer that exists but cannot be fetched
        or parsed answers `feed-unreachable`, so clients retry later instead
        of recording a false absence. Distinct from the time-coded cue
        transcript the read endpoint serves for display: this indexes
        search text only.
      tags: [podcasts]
      parameters:
        - $ref: "#/components/parameters/Pid"
      responses:
        "204":
          description: The transcript is indexed for search.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/FeedUnreachable"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /episodes/{pid}/fetch:
    post:
      operationId: fetchEpisode
      summary: Fetch an episode's audio to the server
      description: >
        Queues a server-side download of the episode's enclosure into the
        library. The caller must be subscribed to the episode's show.
        The episode's item flips from remote to present when the fetch
        completes, which reaches clients as a catalog invalidation; a
        failed fetch surfaces as `fetchState: failed` with `fetchError`
        on the episode summary. Queuing an episode that is already
        downloaded or already queued is a no-op success; queuing a
        previously failed one retries it.
      tags: [podcasts]
      parameters:
        - $ref: "#/components/parameters/Pid"
      responses:
        "202":
          description: The fetch is queued (or the episode is already present).
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: >
            The caller is not subscribed to this episode's show (code
            `forbidden`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ReadOnly"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"
    delete:
      operationId: removeEpisodeDownload
      summary: Remove an episode's fetched audio from the server
      description: >
        The inverse of the fetch: deletes the episode's downloaded audio
        and returns the episode to its not-fetched state, which reaches
        clients as a catalog invalidation. The episode itself is
        untouched - it stays in the show's listing, stays counted, keeps
        every user's playback state, streams by enclosure passthrough,
        and can be fetched again at any time. Only the local bytes go,
        and they are not recoverable from the trash: an unfetched
        episode's audio is re-fetchable from its source, which is what
        makes deleting it the right answer rather than archiving it (an
        archived episode disappeared from the hub's count while the
        show's listing still held it). The caller must be subscribed to
        the show (the file is shared; any subscriber may reclaim the
        space). Removing an episode that is not fetched is a no-op
        success that also cancels a queued fetch, and an episode someone
        is listening to right now answers `conflict` (retry when playback
        stops).
      tags: [podcasts]
      parameters:
        - $ref: "#/components/parameters/Pid"
      responses:
        "204":
          description: The episode's audio is not on the server anymore.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: >
            The caller is not subscribed to this episode's show (code
            `forbidden`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            The removal was refused. `conflict`: the episode is being
            listened to right now and removing the file would kill the
            stream; it clears only when playback stops, so retrying by
            itself does not help. `catalog-busy`: another job holds the
            podcast download tree's shared file-mutation scope, which
            clears on its own, so an unattended retry is worth something.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /radio/stations:
    get:
      operationId: listRadioStations
      summary: List radio stations
      description: >
        The server's internet radio station library, shared by all
        users, ordered by name. Unpaginated; the library is capped at
        500 stations.
      tags: [radio]
      responses:
        "200":
          description: All stations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadioStationList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      operationId: createRadioStation
      summary: Add a radio station
      description: >
        Adds a station to the shared library. Any user may add
        stations; edits and deletion are open to any user too (the
        library is a shared household surface, like the catalog).
        Stream URLs must be http or https, and because the server
        proxies station streams, URLs that resolve to loopback,
        link-local, or private address ranges are rejected with
        `invalid-request` (and re-checked at fetch time, after
        redirects, with a bounded redirect depth), so a station entry
        can never read internal services. A server option permits
        private-range stream URLs for households running their own
        LAN icecast. Conflict (code `conflict`) means a station with
        this stream URL already exists, or the 500-station cap is
        reached.
      tags: [radio]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RadioStationEdit"
      responses:
        "201":
          description: The created station.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadioStation"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/Conflict"

  /radio/stations/{pid}:
    get:
      operationId: getRadioStation
      summary: Get one radio station
      description: One station by pid.
      tags: [radio]
      parameters:
        - $ref: "#/components/parameters/Pid"
      responses:
        "200":
          description: The station.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadioStation"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateRadioStation
      summary: Update a radio station
      description: >
        Replaces a station's fields, under the same stream URL rules
        as creation (scheme, private-range rejection, and duplicate
        conflict).
      tags: [radio]
      parameters:
        - $ref: "#/components/parameters/Pid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RadioStationEdit"
      responses:
        "200":
          description: The updated station.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadioStation"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteRadioStation
      summary: Delete a radio station
      description: Removes a station from the shared library.
      tags: [radio]
      parameters:
        - $ref: "#/components/parameters/Pid"
      responses:
        "204":
          description: Station deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /radio/stations/{pid}/play-info:
    get:
      operationId: getRadioPlayInfo
      summary: Resolve a playable station stream
      description: >
        Mints a short-lived tokenized URL for the station's stream,
        proxied through this server's origin (so web clients are never
        blocked by the station's missing CORS headers and mixed
        content never arises). The proxy passes ICY station metadata
        headers through (never icy-metaint: the in-stream metadata it
        announces is consumed by the proxy, so clients receive clean
        audio and read the current title from nowPlaying here
        instead) and serves the stream as a live, unseekable body.
        Re-request when playback is restarted; the token has a
        bounded lifetime but an already-open stream is never cut by
        token expiry.
      tags: [radio]
      parameters:
        - $ref: "#/components/parameters/Pid"
      responses:
        "200":
          description: The stream URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadioPlayInfo"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /radio/stations/{pid}/logo:
    get:
      operationId: getRadioStationLogo
      summary: Get a station logo
      description: >
        The station's logo, fetched by this server and served from this
        origin. **This reverses the direct-fetch behavior `logoUrl`
        documented**: clients render logos from here, not from the
        station host. Two reasons, both of which made direct fetches
        wrong rather than merely suboptimal. On the web build a logo on
        another origin has no CORS headers to offer and an http logo is
        mixed content on an https UI, so a large share of logos simply
        could not be drawn; and a direct fetch tells every station host
        the listener's IP address, which nothing about rendering a
        picture requires.


        The fetch goes through the same guarded client the stream proxy
        uses, so a logo URL pointing at a loopback, link-local, or
        private address is refused at dial time (after DNS resolution)
        unless the server permits LAN stations, and redirects are
        bounded. Bytes are capped and non-image answers are refused: a
        station host serving an HTML error page where a favicon used to
        be is a station with no logo, which is a 404 here. Results are
        cached in the server for a day (misses for an hour), so a
        household browsing the dial does not re-fetch the same logos per
        device.


        **Raster only, and SVG is refused.** A logo URL is
        attacker-supplied - any account may add a station, pointing
        anywhere - and these bytes are served from this origin, where an
        SVG opened as a document would run its script under the caller's
        session. So the served type is decided by inspecting the bytes
        rather than by trusting the host's `Content-Type`, only
        JPEG/PNG/WebP/GIF pass, and a station whose mark is an SVG draws
        the monogram a station with no mark draws. The response also
        carries `nosniff` and a locked-down `Content-Security-Policy`, so
        a mistake in that check stays a broken image.


        404 covers every way there is no picture to draw - no logo
        configured, the host unreachable, a refused or non-image answer - because a
        client can act on none of the differences: it draws a
        monogram disc. Answers carry a content-addressed `ETag`;
        revalidate with `If-None-Match`.
      tags: [radio]
      parameters:
        - $ref: "#/components/parameters/Pid"
        - name: size
          in: query
          description: >
            Accepted and ignored, so the sized-artwork request a client
            already builds for covers reaches this endpoint unchanged.
            Station logos are small square images from a directory and
            the server does not re-encode them: rescaling would have to
            pick a format, and the transparency most logos carry does not
            survive that choice.
          schema:
            type: integer
            minimum: 16
            maximum: 2048
        - name: If-None-Match
          in: header
          description: Previously returned `ETag`; a match answers 304 with no body.
          schema:
            type: string
      responses:
        "200":
          description: >
            The logo image, always one of the raster types below. The
            served type is decided by inspecting the bytes, not by what
            the station host called them, so a body is never labelled as
            something it is not.
          headers:
            ETag:
              description: Content-addressed validator for the returned bytes.
              schema:
                type: string
            Cache-Control:
              description: >
                `private, max-age=86400, stale-while-revalidate=604800`.
                No `Vary`, unlike item artwork: the station library is
                shared by every user, so these bytes do not depend on who
                asked. `private` all the same, because the request needs a
                session and a shared cache must not answer one without.
              schema:
                type: string
            X-Content-Type-Options:
              description: >
                `nosniff`. These bytes came from a host any account can
                name and they are served from this origin, so a browser
                must not be free to decide the body is really markup.
              schema:
                type: string
            Content-Security-Policy:
              description: >
                `default-src 'none'; sandbox; style-src 'unsafe-inline'`,
                which neutralizes script and navigation for a document
                opened straight from this URL. Defence in depth: the
                endpoint serves only raster types and refuses anything
                whose bytes are not one, and this is what keeps a future
                mistake in that check a broken image rather than a
                same-origin script.
              schema:
                type: string
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
        "304":
          description: >
            The cached copy is still current, with the same validator and
            freshness the body would have carried.
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: >
            There is no logo to draw for this station (code `not-found`).
            Render a monogram disc.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /radio/stations/{pid}/now-playing-art:
    get:
      operationId: getRadioNowPlayingArt
      summary: Get cover art for a station's announced track
      description: >
        The cover this server holds for whatever the station last
        announced, for the case the announced track is not in this
        library. Draw it on the full-screen player face; the deck bar
        keeps the station logo on purpose, because a bar whose picture
        changed every few minutes would read as the station changing.


        Three rungs sit behind radio artwork and this endpoint serves
        the middle two. The first is `nowPlayingItemPid` above: a match
        against this library, which costs no network and is the common
        answer for a listener playing a station whose music they own.


        On its miss comes the picture the **station itself announced**,
        where it announced one: many carry a per-track cover (or a
        channel logo) in the `StreamArtwork` or `StreamUrl` field of the
        same in-stream metadata the title arrives in. That is not a
        third-party lookup - the URL came down the stream this listener
        is already receiving - so `radioExternalArt` does not gate it,
        and neither does switching that setting off drop what has
        already been fetched. The bytes are fetched through the
        SSRF-guarded client the station logo uses, capped, and typed by
        sniffing them.


        Last comes an external lookup from the announced artist and
        title - `api.deezer.com` first, then `musicbrainz.org` and
        `coverartarchive.org` where metadata matching is enabled (the
        default) - stopping at the first that answers. That
        rung is **on by default** and switchable off (`radioExternalArt`
        in the server settings): it sends a string a station chose from a
        self-hosted server to a third party, which is the operator's call
        to make. With it off, a station that
        announces no picture of its own leaves this endpoint answering
        404 and the client draws the station mark, which is a designed
        state rather than a gap.


        Never blocking, and a client should expect that. The lookup is
        started by the play-info poll and runs against paced third-party
        services, so the first poll after a title
        changes answers 404 here and a later one answers the image - on
        the same fifteen-second cadence the play-info contract already
        asks for. A miss is remembered for a day rather than forever,
        because a track released this week can have no archive entry
        today and one tomorrow, and a service that could not be reached
        is remembered for minutes only.


        The bytes go through the same raster-only check the station logo
        does, decided by inspecting them rather than by trusting the
        upstream `Content-Type`, and carry the same hardening headers.
      tags: [radio]
      parameters:
        - $ref: "#/components/parameters/Pid"
        - name: v
          in: query
          required: true
          description: >
            The `nowPlayingArtKey` from this station's play-info. The
            endpoint answers the cover held under that token and nothing
            else, so a title that rolls over between the poll and this
            request cannot turn a held cover into a 404.


            Opaque: the shape is pinned so a client can tell a token
            apart from a stray query value, but nothing outside this
            server may derive one. Anything that is not a held token
            answers 404 rather than an error, because "no cover under
            that name" is the same answer either way.
          schema:
            type: string
            pattern: "^[0-9a-f]{32}$"
        - name: size
          in: query
          description: Accepted and ignored, like the logo endpoint's.
          schema:
            type: integer
            minimum: 16
            maximum: 2048
        - name: If-None-Match
          in: header
          description: Previously returned `ETag`; a match answers 304 with no body.
          schema:
            type: string
      responses:
        "200":
          description: The cover image, always one of the raster types below.
          headers:
            ETag:
              description: Content-addressed validator for the returned bytes.
              schema:
                type: string
            Cache-Control:
              description: >
                `private, max-age=86400, stale-while-revalidate=604800`,
                as for the logo, and true here rather than approximately
                true: the URL carries the token naming these exact bytes,
                so a new announced title is a new URL rather than the same
                one with different content behind it.
              schema:
                type: string
            X-Content-Type-Options:
              description: "`nosniff`, as for the logo."
              schema:
                type: string
            Content-Security-Policy:
              description: The logo endpoint's policy, for the same reason.
              schema:
                type: string
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
        "304":
          description: The cached copy is still current.
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: >
            There is nothing to draw (code `not-found`): the station
            token is missing, unknown, or has aged out of the server's
            cache, the external rung is off, or there was never a cover
            under it. A client can act on none of those differences - it
            falls back to the local match, then to the station logo, then
            to the station mark.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /radio/saved:
    get:
      operationId: listRadioSavedSongs
      summary: List songs kept off the air
      description: >
        The caller's own saved songs, newest first. Personal rather than
        shared, unlike the station library: what one listener kept is
        theirs.


        A saved song is deliberately not a library item. Nothing on this
        list plays - the row is an announcement, not a file - and the
        list exists so a song heard on a station can be hunted down
        later. Rows are resolved against the library at read time and
        the ones that now match carry `inLibraryPid`, which is how a row
        gets crossed off.
      tags: [radio]
      parameters:
        - name: cursor
          in: query
          description: >
            Opaque keyset cursor from a previous page's `nextCursor`.
            Omit for the first page.
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum songs per page.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: One page of saved songs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadioSavedSongPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      operationId: saveRadioSong
      summary: Keep the song a station is playing
      description: >
        Saves the announcement the listener is looking at. The request
        carries the line rather than naming the station alone, because
        the station's title rolls over between polls and a save resolved
        against the live one would sometimes keep the next song.


        **Idempotent on identity**, which is what makes the heart a
        toggle rather than a counter: the same song saved twice answers
        201 with the row already held. Identity is the parsed artist and
        title where the line splits, and the raw line where it does not,
        so the same song announced by two stations is one row.


        A cover is snapshotted from whatever this server already holds
        for the announcement - the matched library item's own art, the
        cached lookup, or the picture the station announced. Nothing is
        fetched for a save: a list that resolved artwork later would
        become a pile of lookups against a rung an operator may have
        switched off, so a row saved with nothing to copy draws a
        monogram for good.
      tags: [radio]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RadioSavedSongCreate"
      responses:
        "201":
          description: >
            The saved song, whether this request created it or it was
            already held. A client can treat the two alike; the pid is
            what an untap needs either way.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadioSavedSong"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: >
            No such station (code `not-found`). The list is snapshotted
            from a station that exists at save time.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >
            The list is full (code `conflict`): 500 saved songs is the
            cap, and it is the only refusal this endpoint has. Remove
            something. A song already on a full list still answers 201 -
            nothing needed storing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /radio/saved/{pid}:
    delete:
      operationId: deleteRadioSavedSong
      summary: Drop a saved song
      description: >
        Removes one of the caller's saved songs. Removing one that is
        already gone answers 204: the caller asked for it to be absent
        and it is, which is what lets an untap race a second device
        without an error.
      tags: [radio]
      parameters:
        - $ref: "#/components/parameters/Pid"
      responses:
        "204":
          description: Gone.
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /radio/saved/{pid}/art:
    get:
      operationId: getRadioSavedSongArt
      summary: Get a saved song's snapshot cover
      description: >
        The cover this server copied when the song was saved, served from
        this origin.


        A snapshot rather than a lookup, and that is the design: the
        picture is whatever the artwork ladder held at the moment the
        heart was tapped, stored beside the row. It never changes and it
        never goes looking. A row saved with nothing to copy answers 404
        for good and the client draws a monogram, which is the ordinary
        case rather than a failure.


        The bytes went through the same raster-only check the station
        logo does - decided by inspecting them rather than by trusting
        the upstream `Content-Type` - and carry the same hardening
        headers.
      tags: [radio]
      parameters:
        - $ref: "#/components/parameters/Pid"
        - name: size
          in: query
          description: Accepted and ignored, like the logo endpoint's.
          schema:
            type: integer
            minimum: 16
            maximum: 2048
        - name: If-None-Match
          in: header
          description: Previously returned `ETag`; a match answers 304 with no body.
          schema:
            type: string
      responses:
        "200":
          description: The snapshot cover, always one of the raster types below.
          headers:
            ETag:
              description: Content-addressed validator for the returned bytes.
              schema:
                type: string
            Cache-Control:
              description: >
                `private, max-age=86400, stale-while-revalidate=604800`,
                as for the logo, and true without qualification here: the
                bytes behind a saved song's pid are a snapshot and cannot
                change.
              schema:
                type: string
            Vary:
              description: >
                `Cookie, Authorization`. Unlike the station logo, which
                is shared library data and carries no `Vary`, a saved
                song belongs to one listener: this endpoint answers 200
                for its owner and 404 for everyone else, so a cache
                holding two credentials must not answer one from the
                other's copy. The same reason item artwork varies.
              schema:
                type: string
            X-Content-Type-Options:
              description: "`nosniff`, as for the logo."
              schema:
                type: string
            Content-Security-Policy:
              description: The logo endpoint's policy, for the same reason.
              schema:
                type: string
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
        "304":
          description: The cached copy is still current.
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
            Vary:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: >
            There is nothing to draw (code `not-found`): no such saved
            song for this caller, or one saved with no cover to copy.
            Draw a monogram.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /radio/directory:
    get:
      operationId: searchRadioDirectory
      summary: Search the station directory
      description: >
        Searches a public radio station directory (radio-browser.info)
        by name so stations can be added without pasting stream URLs.
        The directory is a pool of volunteer mirrors, so one search may
        try several before giving up. Requires internet; when no mirror
        answers the endpoint returns `directory-unavailable` and manual
        entry still works.
      tags: [radio]
      parameters:
        - name: query
          in: query
          required: true
          description: Station name search terms.
          schema:
            type: string
            minLength: 2
        - name: limit
          in: query
          description: Maximum directory entries to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Directory matches, best first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadioDirectoryResults"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "502":
          description: >
            No station directory mirror answered: unreachable, or every
            mirror tried reported itself busy. Both carry the code
            `directory-unavailable`; the message says which happened,
            because a busy directory is worth retrying and a broken one
            is not.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /review/queue:
    get:
      operationId: listReviewQueue
      summary: List review queue entries
      description: >
        Keyset-paginated review queue, newest first. Administrators see
        every entry; other callers see only entries produced by their
        own uploads. Each entry is one album-sized unit: it applies or
        declines as a whole, never track by track. `status` filters to
        one lifecycle state (`pending` is the working queue; decided
        entries remain listable for calibration and undo).
      tags: [review]
      parameters:
        - name: status
          in: query
          description: >
            Restrict to one status. Statuses are server-defined
            strings; the current set is `pending`, `applied`,
            `auto-applied`, `as-is`, `unofficial`, `skipped`,
            `discarded`, and `reverted`. Unknown values yield an
            empty page rather than an error.
          schema:
            type: string
        - name: cursor
          in: query
          description: >
            Opaque keyset cursor from a previous page's `nextCursor`.
            Omit for the first page.
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum entries per page.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: One page of review entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewEntryPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /review/queue/{entryId}:
    parameters:
      - $ref: "#/components/parameters/ReviewEntryId"
    get:
      operationId: getReviewEntry
      summary: Inspect one review entry
      description: >
        The full entry: the unit's files with their current metadata,
        and every scored candidate with its per-field distance
        breakdown, track pairings (the side-by-side diff renders from
        these), missing tracks, and extra files. Candidates are ranked
        best first. Visibility follows the queue listing.
      tags: [review]
      responses:
        "200":
          description: The entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewEntryDetail"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /review/queue/{entryId}/decide:
    parameters:
      - $ref: "#/components/parameters/ReviewEntryId"
    post:
      operationId: decideReviewEntry
      summary: Decide a review entry
      description: >
        Applies one decision to a pending entry. `approve` applies the
        chosen candidate's metadata to the whole unit (the ranked best
        when `candidateMbid` is absent), locking the applied fields so
        a rescan cannot undo the acceptance; for entries staging new
        files (uploads and imports) the files enter the library first.
        `as-is` accepts the unit's current metadata unchanged (staged
        files enter the library as they are). `unofficial` is `as-is`
        plus a locked `RELEASESTATUS` custom tag of `unofficial`,
        which excludes the items from future match retries and from
        health penalties (content with no canonical release is a
        terminal state, not an error). `skip` dismisses the entry
        without touching anything (staged files stay staged).
        `discard` deletes staged files and exists only for entries
        that carry them. Deciding an already-decided entry answers
        `conflict`. Administrators may decide anything; other callers
        only entries from their own uploads. A metadata write that
        partially fails after the catalog committed reports per-file
        detail in `warnings` and the entry still counts as decided.
      tags: [review]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewDecision"
      responses:
        "200":
          description: The decided entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewDecideResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /review/queue/{entryId}/identify:
    parameters:
      - $ref: "#/components/parameters/ReviewEntryId"
    post:
      operationId: reidentifyReviewEntry
      summary: Search again for a review entry
      description: >
        Requeues a pending entry for identification, optionally
        searching for values the reviewer typed rather than the ones
        the files claim. The body **replaces** whatever override the
        entry already carried, so an empty body (or one with every
        field blank) clears it and runs the plain derivation again.


        The typed values stand in for the unit's own for the search
        only: `artist` for both the artist and the album artist,
        `album` for the album title, `title` for the track title.
        Nothing is written to the files or to the catalog, and the
        entry's stored evidence keeps the tags the files actually
        carry - what changes is only what is looked up. The override
        persists on the entry, so a retry after a provider failure
        searches for the same thing.


        Typed values are searched for verbatim. The cleanup that reads
        "Artist - Track" out of a video title, peels "(Official
        Video)", and drops a " - Topic" channel suffix exists to
        rescue titles a machine wrote, and it does not run over these:
        a title that genuinely contains " - " is searched for whole,
        and a typed artist is not replaced by one a descriptive title
        happens to name. A field left blank is not an instruction, so
        it falls back to what the files imply.


        Pending entries only; a decided one answers `conflict`. The
        permission is the deciding permission: administrators may
        re-identify anything, other callers only entries from their
        own uploads.
      tags: [review]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewIdentifyRequest"
      responses:
        "200":
          description: The entry, identifying again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewEntry"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /review/queue/{entryId}/revert:
    parameters:
      - $ref: "#/components/parameters/ReviewEntryId"
    post:
      operationId: revertReviewEntry
      summary: Revert an applied match
      description: >
        Restores the metadata snapshot taken before an `applied` or
        `auto-applied` entry was applied, unlocks the fields the apply
        locked, and marks the entry `reverted`. Reverts of auto
        applied entries feed the calibration statistics. Only
        administrators and the deciding user may revert. Reverting
        anything but an applied entry answers `conflict`.
      tags: [review]
      responses:
        "200":
          description: The reverted entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewEntry"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /review/decide:
    post:
      operationId: decideReviewBulk
      summary: Decide many review entries
      description: >
        Applies one decision to many pending entries in a single call,
        for keyboard-driven bulk triage. `approve` uses each entry's
        own ranked best candidate (a per-entry candidate choice needs
        the single-entry endpoint). Entries are decided independently:
        one failure does not stop the rest, and the response reports
        each outcome.
      tags: [review]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewBulkDecision"
      responses:
        "200":
          description: Per-entry outcomes, in request order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewBulkResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /review/stats:
    get:
      operationId: getReviewStats
      summary: Review and calibration statistics
      description: >
        Queue depth and auto-apply calibration: how many entries auto
        applied and how many of those were later reverted. The revert
        rate is the trust signal the review surface shows next to the
        auto-apply behavior; it is deliberately not the accuracy
        metric that tunes thresholds (reverts are sparse and lagging).
      tags: [review]
      responses:
        "200":
          description: Current statistics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewStats"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /libraries/{pid}/matching:
    parameters:
      - $ref: "#/components/parameters/Pid"
    get:
      operationId: getLibraryMatching
      summary: Read a library's matching mode
      description: The library's automatic matching behavior.
      tags: [review]
      responses:
        "200":
          description: The mode.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryMatching"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"
    put:
      operationId: setLibraryMatching
      summary: Set a library's matching mode
      description: >
        `auto` lets confident matches apply themselves and queues the
        rest for review (the default), `review` queues everything (no
        auto-apply), and `off` never matches the library's content
        (as-is libraries: already-curated collections the engine must
        not touch). Administrators only.
      tags: [review]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryMatching"
      responses:
        "200":
          description: The stored mode.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryMatching"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /users/me/scrobblers:
    get:
      operationId: listScrobblers
      summary: List the caller's scrobbling connections
      description: >
        The calling user's outbound scrobbling connections, one entry
        per known service. A service is `available` when the server can
        offer it (Last.fm needs server-configured API credentials;
        ListenBrainz is always available) and `connected` once the
        caller has linked an account. Accepted listens for music are
        queued and delivered to every connected service, surviving
        restarts and outages.
      tags: [scrobbling]
      responses:
        "200":
          description: The caller's scrobbling connections.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScrobblerList"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /users/me/scrobblers/listenbrainz:
    put:
      operationId: connectListenBrainz
      summary: Connect ListenBrainz
      description: >
        Stores the caller's ListenBrainz user token after validating it
        against the service. The token is sealed at rest and never
        returned. Supplying a new token replaces the old one. An
        optional `apiUrl` points the connection at a
        ListenBrainz-compatible server (Maloja and friends); omitted
        means listenbrainz.org.
      tags: [scrobbling]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListenBrainzConnect"
      responses:
        "200":
          description: Connected; the validated connection state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scrobbler"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "502":
          description: >
            The scrobbling service could not be reached to validate
            the token (code `service-unreachable`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: disconnectListenBrainz
      summary: Disconnect ListenBrainz
      description: >
        Removes the caller's ListenBrainz connection and drops its
        queued deliveries.
      tags: [scrobbling]
      responses:
        "204":
          description: Disconnected.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/me/scrobblers/lastfm:
    delete:
      operationId: disconnectLastfm
      summary: Disconnect Last.fm
      description: >
        Removes the caller's Last.fm connection and drops its queued
        deliveries.
      tags: [scrobbling]
      responses:
        "204":
          description: Disconnected.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/me/scrobblers/lastfm/connect:
    post:
      operationId: startLastfmConnect
      summary: Start linking a Last.fm account
      description: >
        Mints a short-lived one-time state and returns the Last.fm
        authorization URL for the caller to open in a browser. After
        the user approves, Last.fm redirects to this server's callback,
        which completes the session-key exchange and stores the sealed
        session key. Requires server-configured Last.fm API
        credentials; without them this endpoint answers
        `source-unavailable`.
      tags: [scrobbling]
      responses:
        "200":
          description: The authorization URL to open.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LastfmConnectStart"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "501":
          $ref: "#/components/responses/SourceUnavailable"

  /scrobble/lastfm/callback:
    get:
      operationId: lastfmCallback
      summary: Last.fm authorization callback
      description: >
        The redirect target Last.fm sends the user back to after
        approving access. Authenticated by the one-time `state` minted
        by the connect endpoint (bound to the requesting user, single
        use, short-lived), not by a session: the browser tab may not
        carry one. Completes the session-key exchange and renders a
        small confirmation page for the user to close.
      tags: [scrobbling]
      security: []
      parameters:
        - name: state
          in: query
          required: true
          description: The one-time state from the connect endpoint.
          schema:
            type: string
        - name: token
          in: query
          required: true
          description: The authorization token appended by Last.fm.
          schema:
            type: string
      responses:
        "200":
          description: Connection completed; a human-readable confirmation page.
          content:
            text/html:
              schema:
                type: string
        "400":
          description: Unknown, expired, or reused state; a human-readable error page.
          content:
            text/html:
              schema:
                type: string
        "502":
          description: Last.fm could not be reached to complete the exchange; a human-readable error page.
          content:
            text/html:
              schema:
                type: string

  /shares:
    get:
      operationId: listShares
      summary: List share links
      description: >
        The caller's share links, newest first, including expired ones
        (marked by `expiresAt` in the past) so they can be renewed or
        cleaned up. Administrators may pass `all=true` to list every
        user's shares.
      tags: [shares]
      parameters:
        - name: all
          in: query
          description: >
            List every user's shares (administrators only; `forbidden`
            otherwise).
          schema:
            type: boolean
            default: false
        - name: cursor
          in: query
          description: Opaque keyset cursor from a previous page.
          schema:
            type: string
        - name: limit
          in: query
          description: Page size.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: One page of share links.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharePage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createShare
      summary: Create a share link
      description: >
        Creates a public share link for a track, album, book, or
        episode the caller can see, or a playlist the caller owns. An
        album share opens the album's tracks in order. Playlists
        require ownership because the public page serves the owner's
        member view for the link's whole life: another user's shared
        playlist is theirs to publish, not the viewer's, and their
        later edits or a flip back to private must not leak through a
        link they cannot revoke. The link is a capability
        URL: anyone holding it can open the landing page and listen
        until it expires or is revoked. Episodes accept `positionMs`
        for copy-link-at-timestamp. `allowDownload` additionally
        offers the original file and requires the caller's own
        download permission. Episodes of private feeds (feeds with
        credentials) refuse with `forbidden`: a capability URL must
        not leak paid content. Anonymous playback through the link is
        billed against the caller's transcode and bandwidth limits.
      tags: [shares]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShareCreate"
      responses:
        "201":
          description: The share link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Share"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /shares/{shareId}:
    delete:
      operationId: revokeShare
      summary: Revoke a share link
      description: >
        Revokes a share link immediately: the landing page and its
        media URLs stop resolving. The owner or an administrator may
        revoke.
      tags: [shares]
      parameters:
        - $ref: "#/components/parameters/ShareId"
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /similarity/status:
    get:
      operationId: getSimilarityStatus
      summary: Similarity analysis status
      description: >
        Coverage of the sonic-similarity surface: whether a worker
        token is configured, which embedding model the stored vectors
        carry, how much of the library is embedded, and the analysis
        backlog. Clients use `coveragePct` to decide whether to show
        sonic affordances (the adventurousness knob, sonic paths).
      tags: [similarity]
      responses:
        "200":
          description: The status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimilarityStatus"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /similarity/work:
    get:
      operationId: pullSimilarityWork
      summary: Pull analysis work (worker)
      description: >
        Leases a batch of tracks awaiting embedding. Each work item
        names the track and where to pull decode-ready audio; the
        worker computes an embedding per item and posts the batch
        back. Leases expire on their own, so a crashed worker's items
        return to the queue without cleanup. An empty batch means the
        library is fully embedded; workers should sleep
        `retryAfterSeconds` before polling again. Requires the worker
        token.
      tags: [similarity]
      security:
        - workerAuth: []
      parameters:
        - name: limit
          in: query
          description: Maximum work items leased.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: Leased work items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimilarityWorkPage"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /similarity/embeddings:
    post:
      operationId: reportEmbeddings
      summary: Post computed embeddings (worker)
      description: >
        Records a batch of computed embeddings. Vectors are keyed by
        the track's audio essence, so an identical rip re-imported
        later never needs re-analysis. All vectors in one batch carry
        the batch's `model` and `dims`; a vector whose length differs
        from `dims` is rejected per item. Posting a different `model`
        than the stored vectors replaces coverage model-wide: mixed
        models never compare, so the server drops stored vectors of
        other models as new ones arrive. Ingest also maintains the
        nearest-neighbor graph that powers sonic paths. Requires the
        worker token.
      tags: [similarity]
      security:
        - workerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmbeddingReport"
      responses:
        "200":
          description: The ingest outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbeddingIngestResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /stats/listening:
    get:
      operationId: getListeningStats
      summary: Listening time statistics
      description: >
        The caller's listening time over a range, bucketed for charts.
        Calendar bucketing uses the caller's preferred timezone (UTC
        when unset). `timeSavedMs` sums the silence-trim and speed-up
        savings clients report on their listen sessions.
      tags: [stats]
      parameters:
        - name: range
          in: query
          description: How far back to aggregate, ending now.
          schema:
            type: string
            enum: [7d, 30d, 90d, 365d, all]
            default: 30d
        - name: bucket
          in: query
          description: Chart bucket size.
          schema:
            type: string
            enum: [day, week, month]
            default: day
      responses:
        "200":
          description: Aggregated listening time.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListeningStats"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /stats/heatmap:
    get:
      operationId: getListeningHeatmap
      summary: Calendar heatmap and streaks
      description: >
        Per-day listening for one calendar year in the caller's
        preferred timezone, plus listening streaks. Days without
        listening are omitted. The current streak counts consecutive
        days ending today or yesterday (an unfinished today does not
        break it).
      tags: [stats]
      parameters:
        - name: year
          in: query
          description: >
            Calendar year in the caller's timezone. Defaults to the
            current year.
          schema:
            type: integer
            minimum: 1970
            maximum: 2200
      responses:
        "200":
          description: The heatmap.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListeningHeatmap"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /stats/top:
    get:
      operationId: getTopList
      summary: Top artists, albums, genres, or shows
      description: >
        The caller's most-listened entries of one kind over a range,
        ranked by listening time. `shows` covers podcasts; spoken-word
        listening dominates by raw time, so music kinds only count
        music sessions and `shows` only counts podcast sessions.
      tags: [stats]
      parameters:
        - name: kind
          in: query
          required: true
          description: Which top list.
          schema:
            type: string
            enum: [artists, albums, genres, shows]
        - name: range
          in: query
          description: How far back to aggregate, ending now.
          schema:
            type: string
            enum: [7d, 30d, 90d, 365d, all]
            default: 30d
        - name: limit
          in: query
          description: Maximum entries returned.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        "200":
          description: The ranked list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /stats/sessions:
    get:
      operationId: listListenLog
      summary: Listen session log
      description: >
        The caller's recorded listen sessions, newest first, with the
        reporting client, so "what played on which device when" is
        answerable. Optionally filtered to one client label.
      tags: [stats]
      parameters:
        - name: client
          in: query
          description: Only sessions reported by this client label.
          schema:
            type: string
            maxLength: 128
        - name: cursor
          in: query
          description: Opaque keyset cursor from a previous page.
          schema:
            type: string
        - name: limit
          in: query
          description: Page size.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: One page of the session log.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListenLogPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /stats/year-in-review:
    get:
      operationId: getYearInReview
      summary: Year in review
      description: >
        The caller's listening recap for one calendar year in the
        caller's preferred timezone: totals, month-by-month shape, top
        lists across music, podcasts, and audiobooks, the longest
        streak, and what joined the library. Always available for any
        year with data (rolling stats, not December-only).
      tags: [stats]
      parameters:
        - name: year
          in: query
          description: >
            Calendar year in the caller's timezone. Defaults to the
            current year.
          schema:
            type: integer
            minimum: 1970
            maximum: 2200
      responses:
        "200":
          description: The recap.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YearInReview"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /stats/server-year-in-review:
    get:
      operationId: getServerYearInReview
      summary: Server-wide year in review
      description: >
        The whole server's listening recap for one calendar year,
        aggregated across every user who has not opted out of shared
        stats (the `sharedStatsOptOut` preference; opted-out users'
        listening is absent from every figure, and `participants`
        counts only the enrolled). Visible to every signed-in user.
        Bucketing uses each participant's own timezone.
      tags: [stats]
      parameters:
        - name: year
          in: query
          description: Calendar year. Defaults to the current year.
          schema:
            type: integer
            minimum: 1970
            maximum: 2200
      responses:
        "200":
          description: The server-wide recap.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerYearInReview"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /sync/catalog:
    get:
      operationId: syncCatalog
      summary: Mirror the catalog (snapshot or changed-since delta)
      description: >
        The catalog half of delta sync, feeding client-side library mirrors
        with hydrated item summaries (episodes carry their full episode
        summaries, and podcast shows ride the same stream as
        `upsert-show` entries; see the entry schema). Shows and episodes
        are scoped to the caller's own subscriptions, and a subscription
        change retires the caller's cursors the same way a visibility
        grant change does (410 `sync-reset`, then re-mirror). Two modes.
        Without `since`: a snapshot, keyset-paged via `cursor`; every
        page carries
        `nextSince`, an opaque change cursor captured at or before the
        first page's read, which the client stores and syncs from after
        mirroring every page (changes landing mid-snapshot are covered by
        the first delta). With `since`: the changes after that cursor, as
        `upsert` entries carrying fresh summaries and `delete` tombstones
        for items that no longer exist or whose change left them outside
        the caller's library visibility (a file re-homed under an
        ungranted root keeps its item PID; a tombstone for an item never
        mirrored is a no-op); entries are coalesced within a page (an item may
        recur on later pages; application is idempotent, latest wins).
        The returned `nextSince` advances the cursor, and `more` signals
        another page should be fetched immediately. Snapshots contain
        only items the caller can see, and a change to the caller's
        visibility grants invalidates their catalog cursors, so the next
        delta answers 410 `sync-reset` and the re-snapshot reflects the
        new grants. 410 likewise answers any cursor the server can no
        longer serve contiguously (pruned change history, a rebuilt
        catalog): drop the mirror and snapshot again. Snapshot-minted
        cursors stay serviceable for at least the server's change
        retention horizon. The WebSocket channel (`api/events.md`)
        signals when to pull deltas; polling works without it.
      tags: [sync]
      parameters:
        - name: since
          in: query
          description: >
            Opaque change cursor from a previous response's `nextSince`.
            Mutually exclusive with `cursor`.
          schema:
            type: string
        - name: cursor
          in: query
          description: >
            Opaque keyset cursor from a previous snapshot page's
            `nextCursor`. Omit together with `since` for the first
            snapshot page.
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum entries per page.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 500
      responses:
        "200":
          description: One page of the snapshot or delta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogSyncPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "410":
          $ref: "#/components/responses/SyncReset"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /sync/server:
    get:
      operationId: syncServer
      summary: Mirror the caller's server-side state (changed-since delta)
      description: >
        The server half of delta sync: the calling user's own state
        changes (playback state, preferences, podcast subscriptions,
        per-book settings, playlists), on the server change cursor.
        Without `since` it mints a fresh cursor (`nextSince` with no
        events): new mirrors start there and hydrate the play states
        they care about through `/play-states` (play states are only
        meaningful for items a client holds), subscriptions through
        `/podcasts`, book settings through the book detail, and
        playlists through `/playlists`. With `since` it returns
        the caller's events after that cursor with freshly hydrated
        state, coalesced within a page (an item may recur on later pages;
        application is idempotent), plus `more` for immediate
        continuation. Only state visible to the caller ever appears
        here; that is the caller's own state, plus `playlist` events
        for other users' shared playlists (shared playlists are
        visible to everyone, so their changes reach every user's
        stream). A `since` the server can no longer serve contiguously
        answers 410 `sync-reset`: re-mint and re-hydrate.
      tags: [sync]
      parameters:
        - name: since
          in: query
          description: >
            Opaque server change cursor from a previous response's
            `nextSince`. Omit to mint a fresh cursor.
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum events per page.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 500
      responses:
        "200":
          description: One page of the caller's state changes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerSyncPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "410":
          $ref: "#/components/responses/SyncReset"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /health:
    get:
      operationId: getHealth
      summary: Liveness and version probe
      description: >
        Unauthenticated liveness probe. Reports the server version and the API
        version it serves.
      tags: [system]
      security: []
      responses:
        "200":
          description: Server is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /books/{pid}/merge:
    parameters:
      - $ref: "#/components/parameters/Pid"
    post:
      operationId: mergeBook
      summary: Merge a multi-file book
      description: >
        Merges a multi-file audiobook into one chaptered file through
        the streaming engine's job API: parts join gaplessly without
        re-encoding, chapter marks land at the part boundaries
        (titles from the request, falling back to each part's title
        tag, then generated names), and richer tags plus the cover
        carry over in a post-pass. Every user's resume position
        remaps from part-relative to the merged timeline. The
        original parts move to the trash unless `keepOriginals`.
        Needs the streaming engine; answers `feature-unavailable`
        without it. Returns a tool task to follow.
      tags: [tools]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookMergeRequest"
      responses:
        "202":
          description: The queued task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolTask"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "501":
          $ref: "#/components/responses/FeatureUnavailable"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /books/{pid}/split:
    parameters:
      - $ref: "#/components/parameters/Pid"
    post:
      operationId: splitBook
      summary: Split a book at its chapters
      description: >
        Splits a single-file audiobook into per-chapter files at its
        chapter marks (sample-exact cuts, lossless for lossless
        sources), tagging each piece from the book plus its chapter
        title. Resume positions remap onto the pieces. The original
        file moves to the trash unless `keepOriginals`. A book
        without chapters answers `conflict`. Needs the streaming
        engine.
      tags: [tools]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookSplitRequest"
      responses:
        "202":
          description: The queued task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolTask"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "501":
          $ref: "#/components/responses/FeatureUnavailable"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /items/{pid}/split-cue:
    parameters:
      - $ref: "#/components/parameters/Pid"
    post:
      operationId: splitCueRip
      summary: Split a CUE rip into real files
      description: >
        Splits the single-file rip behind a CUE-carved album into one
        real file per track (the pid may be any of the rip's virtual
        tracks; the shared source resolves from it). Virtual tracks
        already browse and play natively, so this physical split is
        optional: it is for people who want real per-track files
        (write-back and fingerprints work on them, two things
        virtual tracks refuse by upstream design). Cuts come from
        the cue sheet, sample-exact and lossless for lossless
        sources; each piece is tagged from the sheet. Play state
        carries over per track. The source file and sheet move to
        the trash unless `keepOriginals`. Needs the streaming
        engine.
      tags: [tools]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CueSplitRequest"
      responses:
        "202":
          description: The queued task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolTask"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "501":
          $ref: "#/components/responses/FeatureUnavailable"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /tools/tasks:
    get:
      operationId: listToolTasks
      summary: List tool tasks
      description: >
        Keyset-paginated tool tasks, newest first. Administrators see
        every task; other callers see their own.
      tags: [tools]
      parameters:
        - name: cursor
          in: query
          description: >
            Opaque keyset cursor from a previous page's `nextCursor`.
            Omit for the first page.
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum tasks per page.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: One page of tasks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolTaskPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /tools/tasks/clear-finished:
    post:
      operationId: clearFinishedToolTasks
      summary: Clear finished tasks
      description: >
        Deletes every finished or failed task the caller can see and
        answers how many went: an administrator's sweep clears
        everyone's rows, the same scope the listing shows and the
        per-row delete grants. Running and queued tasks are untouched.
        A POST action rather than a filtered DELETE, matching the
        library's bulk-delete idiom.
      tags: [tools]
      responses:
        "200":
          description: How many tasks were deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolTasksCleared"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /tools/tasks/{taskId}:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    get:
      operationId: getToolTask
      summary: Inspect a tool task
      description: >
        Current state and progress. Task lifecycle changes also
        arrive over the event channel, so polling is a fallback,
        not the model.
      tags: [tools]
      responses:
        "200":
          description: The task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolTask"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteToolTask
      summary: Delete a finished tool task
      description: >
        Removes one task from the list once it has reached a
        terminal state (`done` or `failed`); a queued or running
        task answers `conflict`, because deleting a row out from
        under a worker leases nothing back. Same visibility as
        reading the task: callers delete their own rows, and an
        administrator may delete any row the listing shows them.
      tags: [tools]
      responses:
        "204":
          description: Task deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /tools/tasks/{taskId}/events:
    get:
      operationId: streamToolTaskEvents
      summary: Stream a tool task's progress
      description: >
        Server-sent events for one task: an event named `task` whose
        data is the `ToolTask` JSON, emitted immediately on connect
        and again on every state or progress change (streaming-engine
        job progress is relayed onto the task as it runs), then a
        final event named `done` after the task reaches a terminal
        state, after which the stream closes. Reconnecting is always
        safe: the first event replays current state. Same visibility
        as reading the task. The WebSocket channel carries the same
        lifecycle as invalidations; this stream exists for consumers
        that want the payloads pushed.
      tags: [tools]
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: The event stream.
          content:
            text/event-stream:
              schema:
                type: string
                description: "`text/event-stream` frames as described."
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /uploads:
    get:
      operationId: listUploads
      summary: List the caller's uploads
      description: >
        Keyset-paginated uploads, newest first: the caller's own, or
        every user's for administrators. Finished uploads age out of
        the listing once their staged file has entered the library and
        the retention window passes.
      tags: [uploads]
      parameters:
        - name: cursor
          in: query
          description: >
            Opaque keyset cursor from a previous page's `nextCursor`.
            Omit for the first page.
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum uploads per page.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: One page of uploads.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      operationId: createUpload
      summary: Start an upload
      description: >
        Creates a resumable upload session for one audio file. The
        caller must hold upload rights; the declared size counts
        against the caller's pending-upload limit up front so a full
        one fails fast, and the file name's extension is checked against the
        server's accepted formats. The required media type label
        routes the file to the matching library kind; `libraryPid`
        pins a specific library (required when several libraries of
        that kind are visible to the caller). Passing the file's
        SHA-256 up front lets the server warn about an exact
        duplicate before any bytes move: the response's `duplicate`
        names the existing item and the client can abandon the
        session without spending bandwidth (a fingerprint-level
        duplicate check still runs at completion). Bytes then flow
        through the data endpoint in any number of chunks.

        Three ceilings answer before any of that: a `sizeBytes` past
        the schema's maximum answers `invalid-request` and names the
        limit, since no allowance anybody can change moves it; a
        staging volume with no room for the declared size - counting
        what the sessions already receiving still owe it - answers
        `storage-full`, which is the server's disk rather than the
        caller's allowance; and opening a session is paced per account,
        which answers `rate-limited`. Sending bytes and abandoning a
        session are not paced: one is bounded by the ceilings above and
        the other is what releases them.
      tags: [uploads]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadCreate"
      responses:
        "201":
          description: The created upload session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/ReadOnly"
        "413":
          $ref: "#/components/responses/QuotaExceeded"
        "415":
          $ref: "#/components/responses/UnsupportedFormat"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"
        "507":
          $ref: "#/components/responses/StorageFull"

  /uploads/{uploadId}:
    parameters:
      - $ref: "#/components/parameters/UploadId"
    get:
      operationId: getUpload
      summary: Inspect an upload
      description: >
        Current session state, including `receivedBytes` for resuming
        an interrupted transfer: continue by sending the next chunk at
        that offset.
      tags: [uploads]
      responses:
        "200":
          description: The upload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteUpload
      summary: Abandon an upload
      description: >
        Deletes the session and its staged bytes. An upload whose file
        already entered the library cannot be deleted here (the item
        lives in the library now; delete it there); that answers
        `conflict`.
      tags: [uploads]
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /uploads/{uploadId}/data:
    parameters:
      - $ref: "#/components/parameters/UploadId"
    put:
      operationId: putUploadData
      summary: Send upload bytes
      description: >
        Appends one chunk of raw file bytes at `offset`, which must
        equal the session's current `receivedBytes` (an interrupted
        client re-reads the session and resumes; a mismatched offset
        answers `conflict` and nothing is written). Chunks may be any
        size up to 32 MiB; a longer body answers `invalid-request`
        without reading it, as do bytes past the declared total size.
        Deliberately not paced: a transfer is many chunks and a pace
        per request would be a throughput ceiling, so this endpoint's
        bounds are the chunk cap, the session's declared size, and the
        room on the server's staging volume.
      tags: [uploads]
      parameters:
        - name: offset
          in: query
          required: true
          description: Byte offset this chunk starts at.
          schema:
            type: integer
            format: int64
            minimum: 0
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: The session after the chunk.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /uploads/{uploadId}/complete:
    parameters:
      - $ref: "#/components/parameters/UploadId"
    post:
      operationId: completeUpload
      summary: Finish an upload
      description: >
        Verifies the received bytes (size, and SHA-256 when one was
        declared), probes the audio (an undecodable file answers
        `unsupported-format` and the session stays deletable), moves
        the file into staging with crash-safe write discipline, and
        opens a review entry for the identify pipeline. The response
        carries `reviewEntryId` and any duplicate warning (an exact
        content match or a fingerprint match against an existing
        item); the duplicate warning does not block the review flow,
        it informs the decision. Completing before every declared
        byte arrived answers `conflict`.
      tags: [uploads]
      responses:
        "200":
          description: The completed upload with its review entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedFormat"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /uploads/batches:
    post:
      operationId: createUploadBatch
      summary: Open an upload batch
      description: >
        Opens a batch that groups several upload sessions into review
        units by the declared grouping intent: `album` opens one
        multi-file review entry over every staged member, `tracks`
        opens one entry per file, and `auto` clusters members into
        album units by their tags and relative paths. Members join by
        passing `batchId` (and optionally `batchPath`) at session
        creation and must declare the batch's media type. The batch
        stays open for 24 hours or until the finalize call; members
        keep the normal upload retention. Nothing about a single
        upload changes: a session without a batch opens its own
        review entry at completion exactly as before.
      tags: [uploads]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadBatchCreate"
      responses:
        "201":
          description: The opened batch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadBatch"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/ReadOnly"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /uploads/batches/{batchId}/complete:
    parameters:
      - $ref: "#/components/parameters/UploadBatchId"
    post:
      operationId: completeUploadBatch
      summary: Finalize an upload batch
      description: >
        Declares the batch complete: every member staged so far is
        grouped per the batch's grouping intent and the review
        entries open (their ids land in `reviewEntryIds`). Members
        still receiving bytes fall back to opening their own
        per-file entry when they later complete. Call this exactly
        when the client finishes sending members - after per-file
        failures too, so the files that did arrive are reviewed
        (a batch whose every member was deleted finalizes empty).
        Only the batch's owner (or an administrator) may finalize;
        anyone else sees `not-found`. Idempotent: finalizing a
        finalized batch answers the same batch again. Finalizing a
        batch the server has already expired answers `conflict` - its members were
        grouped with what had arrived when the
        server closed it.
      tags: [uploads]
      responses:
        "200":
          description: The finalized batch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadBatch"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"

  /acquisitions:
    post:
      operationId: createAcquisition
      summary: Acquire audio from a URL
      description: >
        Downloads audio from a source URL through the acquisition
        bridge as a background task: a single video, or every entry
        of a playlist or channel (bounded to the first two hundred
        entries; the response task reports progress per item).
        Downloaded files stage exactly like uploads, appear as
        upload sessions, and flow through the same identify and
        review pipeline, grouped into album units; the source's own
        metadata (title, channel, thumbnail) arrives embedded, and
        provenance tags record the origin, so content with no
        canonical release reaches the review queue ready for
        keep-as-is or mark-unofficial and stays hand-editable by
        the acquiring user afterward. Needs upload rights and a
        running acquisition bridge (`source-unavailable` without
        one). Acquired bytes count against the caller's upload
        quota; a quota hit stops the task and keeps what already
        staged. Returns the tool task to follow (type `acquire`).
      tags: [uploads]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcquisitionRequest"
      responses:
        "202":
          description: The queued task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolTask"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/ReadOnly"
        "429":
          $ref: "#/components/responses/RateLimited"
        "501":
          $ref: "#/components/responses/SourceUnavailable"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /users:
    get:
      operationId: listUsers
      summary: List accounts
      description: >
        Keyset-paginated list of all accounts, ordered by username.
        Administrators only.
      tags: [users]
      parameters:
        - name: cursor
          in: query
          description: >
            Opaque keyset cursor from a previous page's `nextCursor`. Omit for
            the first page.
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum accounts per page.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: One page of accounts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createUser
      summary: Create an account
      description: >
        Creates a local account. Administrators only. Usernames are unique
        case-insensitively; a taken name answers `conflict`. The account is
        immediately able to log in with the given password.
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: Account created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAccount"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /users/{userId}:
    get:
      operationId: getUser
      summary: Get one account
      description: >
        Full account detail. Administrators can read any account; everyone
        else only their own.
      tags: [users]
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAccount"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateUser
      summary: Update an account
      description: >
        Partial update: absent fields are unchanged. Administrators can
        update any field on any account; everyone else can change only
        their own `displayName`, and a non-administrator supplying any
        other field is rejected with `forbidden`, never silently
        ignored. Changes that would leave the server without an enabled
        administrator (demoting or disabling the last one) answer
        `conflict`. Setting `displayName` to the empty string clears it.
      tags: [users]
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: The updated account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAccount"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteUser
      summary: Delete an account
      description: >
        Deletes the account and revokes all its sessions. Administrators
        only, and never the calling account or the last enabled
        administrator (`conflict`). The user's listening history in the
        catalog is orphaned, not destroyed.
      tags: [users]
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "204":
          description: Account deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /users/{userId}/password:
    put:
      operationId: setPassword
      summary: Set an account's password
      description: >
        Changes the account's password and revokes the account's
        sessions. Changing your own password always requires
        `currentPassword` (administrators included); a wrong value
        answers `forbidden`, and the session making the request is the
        only one that survives. An administrator resetting another
        account's password omits `currentPassword`, and every one of
        that account's sessions is revoked. Setting a password on an
        OIDC-provisioned account enables local login for it. App
        passwords are separate credentials and survive a password
        change; revoke them individually.
      tags: [users]
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChange"
      responses:
        "204":
          description: Password changed.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/{userId}/sessions:
    delete:
      operationId: revokeUserSessions
      summary: Revoke all of an account's sessions
      description: >
        Signs the account out everywhere by revoking every live session it
        has. When callers target their own account, the session making this
        request survives. Administrators can target any account; everyone
        else only their own.
      tags: [users]
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "204":
          description: Sessions revoked.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/requests:
    get:
      operationId: listSignupRequests
      summary: List pending signup requests
      description: >
        Keyset-paginated pending accounts (self-serve registrations
        awaiting a decision), oldest first so the queue drains in
        arrival order. Administrators only. Pending accounts also
        carry `pending: true` when they appear anywhere else.
      tags: [users]
      parameters:
        - name: cursor
          in: query
          description: >
            Opaque keyset cursor from a previous page's `nextCursor`.
            Omit for the first page.
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum requests per page.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: One page of pending accounts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /users/requests/{userId}/approve:
    post:
      operationId: approveSignupRequest
      summary: Approve a signup request
      description: >
        Approves a pending account so it can log in, assigning its
        role, library access, and permissions in the same step (absent
        fields keep the registration defaults: the `user` role, access
        to every library, and default permissions). Administrators
        only. A user that is not pending answers `conflict`.
      tags: [users]
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupApproval"
      responses:
        "200":
          description: The approved, now-active account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAccount"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /users/requests/{userId}/reject:
    post:
      operationId: rejectSignupRequest
      summary: Reject a signup request
      description: >
        Rejects and deletes a pending account. The username becomes
        available again. Administrators only. A user that is not
        pending answers `conflict` (reject never deletes an active
        account).
      tags: [users]
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "204":
          description: Request rejected and removed.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /invites:
    get:
      operationId: listInvites
      summary: List invites
      description: >
        Every invite, newest first, revoked and exhausted ones
        included (the list is the record of who was let in with
        what). Invite tokens are never returned here; a token is
        shown exactly once, by the create response. Administrators
        only.
      tags: [users]
      responses:
        "200":
          description: All invites.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createInvite
      summary: Create an invite
      description: >
        Creates an invite link token that pre-approves signup with the
        given role, library access, and permissions (absent fields use
        the registration defaults). The response is the only place the
        token ever appears; the server stores a hash. Administrators
        only.
      tags: [users]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteCreate"
      responses:
        "201":
          description: The invite, with its token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteCreated"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /invites/{inviteId}:
    delete:
      operationId: revokeInvite
      summary: Revoke an invite
      description: >
        Revokes the invite so its token stops working. Accounts it
        already admitted are unaffected. The invite stays listed as
        revoked. Administrators only.
      tags: [users]
      parameters:
        - $ref: "#/components/parameters/InviteId"
      responses:
        "204":
          description: Invite revoked.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/me/prefs:
    get:
      operationId: getPrefs
      summary: Get the caller's preferences
      description: >
        The calling user's preferences. Unset fields are absent; clients
        apply their own defaults.
      tags: [users]
      responses:
        "200":
          description: The caller's preferences.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prefs"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    put:
      operationId: putPrefs
      summary: Replace the caller's preferences
      description: >
        Replaces the calling user's preferences with the given object:
        absent fields are cleared back to unset. Returns the stored
        result; comparing it against what was sent reveals anything the
        server did not store. Field values are validated (unknown
        timezone, malformed locale, or unknown theme is rejected).
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Prefs"
      responses:
        "200":
          description: The stored preferences.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prefs"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /users/me/app-passwords:
    get:
      operationId: listAppPasswords
      summary: List the caller's app passwords
      description: >
        The calling user's app passwords, newest first. App passwords are
        dedicated per-client credentials for the compatibility APIs
        (Subsonic and, later, gpodder), which require the server to hold a
        recoverable secret; the login password is never usable there. The
        secret itself is only ever returned by creation. App passwords
        stop authenticating the moment their account is disabled, and are
        deliberately independent of the login password: changing or
        resetting it leaves them working (revoke them here). Unpaginated:
        a user's app passwords are a small, bounded set.
      tags: [users]
      responses:
        "200":
          description: The caller's app passwords.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppPasswordList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      operationId: createAppPassword
      summary: Create an app password
      description: >
        Generates a new app password for the calling user and returns the
        secret exactly once; it is not recoverable through the API
        afterwards. The secret is 26 characters of server-generated
        randomness (at least 128 bits); users never choose it. The client
        using it authenticates against the compatibility APIs with the
        account's username and this secret. The label distinguishes
        entries in the list (for example the client app's name); labels
        need not be unique. An account holds at most 50 app passwords;
        creating past the cap answers `conflict`.
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppPasswordCreate"
      responses:
        "201":
          description: App password created; the secret appears only here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppPasswordCreated"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/Conflict"

  /users/me/app-passwords/{appPasswordId}:
    delete:
      operationId: revokeAppPassword
      summary: Revoke an app password
      description: >
        Revokes one of the calling user's app passwords. Clients holding it
        fail their next compatibility-API request immediately.
      tags: [users]
      parameters:
        - $ref: "#/components/parameters/AppPasswordId"
      responses:
        "204":
          description: App password revoked.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: waxdeck_session
      description: HttpOnly SameSite=Lax session cookie (web).

    bearerAuth:
      type: http
      scheme: bearer
      description: Per-device rotating bearer token (native clients).

    workerAuth:
      type: http
      scheme: bearer
      description: >
        Server-configured worker token (the `WAXDECK_WORKER_TOKENS`
        setting) for external analysis workers. A server-level
        integration credential, not a user: worker endpoints ignore
        library visibility. Never accepted on user endpoints.
  parameters:
    Pid:
      name: pid
      in: path
      required: true
      description: Type-prefixed PID (e.g. `tr-01JZX5N8QW3F4V9T2B7KD3M9R6`).
      schema:
        type: string
        pattern: "^[a-z]{2}-[0-9A-HJKMNP-TV-Z]{26}$"

    BackupId:
      name: backupId
      in: path
      required: true
      description: Backup PID (e.g. `bu-01JZX5N8QW3F4V9T2B7KD3M9R6`).
      schema:
        type: string
        pattern: "^bu-[0-9A-HJKMNP-TV-Z]{26}$"

    TrashId:
      name: trashId
      in: path
      required: true
      description: Trash entry PID (e.g. `th-01JZX5N8QW3F4V9T2B7KD3M9R6`).
      schema:
        type: string
        pattern: "^th-[0-9A-HJKMNP-TV-Z]{26}$"

    ScheduleKind:
      name: kind
      in: path
      required: true
      description: Which scheduled job.
      schema:
        $ref: "#/components/schemas/ScheduleKind"

    SessionId:
      name: sessionId
      in: path
      required: true
      description: Session PID (e.g. `se-01JZX5N8QW3F4V9T2B7KD3M9R6`).
      schema:
        type: string
        pattern: "^se-[0-9A-HJKMNP-TV-Z]{26}$"

    DiagnosticOriginFilter:
      name: origin
      in: query
      description: Restrict to one writer.
      schema:
        type: string
        enum: [scan, organize, replaygain, edit, enrichment]
    DiagnosticCodeFilter:
      name: code
      in: query
      description: Restrict to one diagnostic code.
      schema:
        type: string
        enum:
          - unsupported_format
          - legacy_only_tags
          - lyrics_partial
          - sidecar_skipped
          - cue_track_dropped
          - tag_write_lost
          - tag_write_unsynced
          - corrupt_audio
    DiagnosticSeverityFilter:
      name: severity
      in: query
      description: Restrict to one severity.
      schema:
        type: string
        enum: [info, warn, error]
    DiagnosticLibraryFilter:
      name: library
      in: query
      description: Restrict to files under one library root.
      schema:
        type: string
        pattern: "^lb-[0-9A-HJKMNP-TV-Z]{26}$"

    EntityType:
      name: entityType
      in: path
      required: true
      description: >
        The entity kind an entity operation targets. `playlist` is a
        WaxDeck-side entity rather than a catalog one: it carries artwork
        and nothing else, and its operations are owner-gated instead of
        administrators-only.
      schema:
        type: string
        enum: [album, artist, release-group, genre, playlist]

    EntityPid:
      name: entityPid
      in: path
      required: true
      description: Entity PID (e.g. `al-01JZX5N8QW3F4V9T2B7KD3M9R6`).
      schema:
        type: string
        pattern: "^[a-z]{2}-[0-9A-HJKMNP-TV-Z]{26}$"

    TargetId:
      name: targetId
      in: path
      required: true
      description: Notification target PID (e.g. `nt-01JZX5N8QW3F4V9T2B7KD3M9R6`).
      schema:
        type: string
        pattern: "^nt-[0-9A-HJKMNP-TV-Z]{26}$"

    PlaybackSessionId:
      name: sessionId
      in: path
      required: true
      description: Playback session PID (e.g. `ps-01JZX5N8QW3F4V9T2B7KD3M9R6`).
      schema:
        type: string
        pattern: "^ps-[0-9A-HJKMNP-TV-Z]{26}$"

    ReviewEntryId:
      name: entryId
      in: path
      required: true
      description: Review entry PID (e.g. `rv-01JZX5N8QW3F4V9T2B7KD3M9R6`).
      schema:
        type: string
        pattern: "^rv-[0-9A-HJKMNP-TV-Z]{26}$"

    ShareId:
      name: shareId
      in: path
      required: true
      description: Share PID (e.g. `sh-01JZX5N8QW3F4V9T2B7KD3M9R6`).
      schema:
        type: string
        pattern: "^sh-[0-9A-HJKMNP-TV-Z]{26}$"

    TaskId:
      name: taskId
      in: path
      required: true
      description: Tool task PID (e.g. `tk-01JZX5N8QW3F4V9T2B7KD3M9R6`).
      schema:
        type: string
        pattern: "^tk-[0-9A-HJKMNP-TV-Z]{26}$"

    UploadId:
      name: uploadId
      in: path
      required: true
      description: Upload PID (e.g. `up-01JZX5N8QW3F4V9T2B7KD3M9R6`).
      schema:
        type: string
        pattern: "^up-[0-9A-HJKMNP-TV-Z]{26}$"

    UploadBatchId:
      name: batchId
      in: path
      required: true
      description: Upload batch PID (e.g. `ub-01JZX5N8QW3F4V9T2B7KD3M9R6`).
      schema:
        type: string
        pattern: "^ub-[0-9A-HJKMNP-TV-Z]{26}$"

    UserId:
      name: userId
      in: path
      required: true
      description: User PID (e.g. `us-01JZX5N8QW3F4V9T2B7KD3M9R6`).
      schema:
        type: string
        pattern: "^us-[0-9A-HJKMNP-TV-Z]{26}$"

    AppPasswordId:
      name: appPasswordId
      in: path
      required: true
      description: App password PID (e.g. `ap-01JZX5N8QW3F4V9T2B7KD3M9R6`).
      schema:
        type: string
        pattern: "^ap-[0-9A-HJKMNP-TV-Z]{26}$"

    InviteId:
      name: inviteId
      in: path
      required: true
      description: Invite PID (e.g. `iv-01JZX5N8QW3F4V9T2B7KD3M9R6`).
      schema:
        type: string
        pattern: "^iv-[0-9A-HJKMNP-TV-Z]{26}$"
  responses:
    InvalidRequest:
      description: Malformed request (bad cursor, invalid parameter, bad body).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Unauthenticated:
      description: >
        No valid credentials were presented: a missing or invalid
        session, bearer token, login password, or one-time code.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Forbidden:
      description: The caller is authenticated but not allowed to do this.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    NotFound:
      description: No resource with that PID is visible to the caller.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Conflict:
      description: The request conflicts with current state (for example, a running job).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    CatalogMaintenance:
      description: >
        The catalog is temporarily handed to a maintenance operation (code
        `catalog-maintenance`). Retry shortly; already-playing streams are
        unaffected.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    SourceUnavailable:
      description: >
        The request needs an integration this server is not running
        (code `source-unavailable`): an acquisition source, such as a
        YouTube subscription on a server without the YouTube bridge, or
        the catalog's enrichment pass on a server with no MusicBrainz
        contact configured. The request itself is well formed, so
        retrying it unchanged will not help; the server has to be
        configured and restarted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    FeatureUnavailable:
      description: >
        The request needs an optional capability this server is not
        running (code `feature-unavailable`), for example queue
        timelines on a server without the streaming engine.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    UnsupportedFormat:
      description: >
        The file's format is not accepted (code `unsupported-format`):
        the extension is outside the server's accepted set, or the
        audio did not decode.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    ReadOnly:
      description: >
        The target library, or the whole server, is in read-only mode
        (code `read-only`): file-writing operations are refused while
        reads, playback, and per-user state keep working.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    RateLimited:
      description: >
        Too many requests from this caller (code `rate-limited`): the
        sign-in limiter's lockout, or the upload surface's per-account
        request ceiling. Back off and retry later; nothing was done.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    StorageFull:
      description: >
        The server has no room to stage what the request declared
        (code `storage-full`). Unlike `quota-exceeded` this is the
        server's own disk rather than the caller's allowance, so
        clearing the caller's staged uploads need not help; it is the
        operator's to fix.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    FieldLocked:
      description: >
        The edit targets a metadata field someone locked earlier and
        the request did not set `force` (code `field-locked`). The
        message names the field.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    PlaybackConflict:
      description: >
        The command could not be completed on the target player
        endpoint. Read `code` rather than the status: this answer
        carries four, and they call for different things.
        `endpoint-offline` means the endpoint is not connected - refresh
        the endpoint list; the device may have left the network or the
        client may have disconnected. `timeout` means it is connected
        but did not answer within the routing deadline, so retrying
        beats refreshing. `conflict` is the endpoint itself refusing
        because of something it is in the middle of, and the message
        says what. `endpoint-failed` is that endpoint taking the command
        and failing at it - a part it could not load, a start that did
        not take - so nothing about the request or the endpoint list
        needs changing and retrying is reasonable; the message carries
        whatever the endpoint could say about it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    FeedUnreachable:
      description: >
        An upstream feed could not be fetched or parsed (code
        `feed-unreachable`): its server answered an error, timed out, or
        returned something that is not a feed. The message carries the
        upstream detail, except that for private shows it never includes
        the feed URL or credentials (upstream error text routinely
        embeds the request URL, and for a tokenized feed that URL is
        the secret).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    SyncReset:
      description: >
        The sync cursor predates the retained change history or belongs to
        a previous catalog generation (code `sync-reset`). Drop the local
        mirror and re-mirror from a fresh snapshot.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    QuotaExceeded:
      description: >
        The upload would exceed the caller's pending-upload limit (code
        `quota-exceeded`). The message names the limit and current use.
        The limit caps what may sit in staging awaiting a decision, so
        importing or discarding what is already there frees room for
        this.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      description: >
        Structured error. `code` is a stable machine-readable string (see the
        API-level description for defined codes); `message` is human-readable
        and not stable.
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable error code.
          example: not-found
        message:
          type: string
          description: Human-readable explanation (not stable, do not parse).
          example: no item with pid tr-01JZX5N8QW3F4V9T2B7KD3M9R6
        params:
          type: object
          additionalProperties:
            type: string
          description: >
            Machine-readable detail, where one code covers several causes
            a client has to tell apart. `code` names which keys can appear
            (see the API-level description); values are always strings.
            Best-effort per refusal, never guaranteed by code: an error of
            the same code with no params is an ordinary one, so read this
            as a refinement rather than requiring it. `message` says the
            same thing in prose, so a client that ignores this reads what
            it always read. Clients must ignore keys they do not know.
          example:
            feature: multi-part-audiobook
            pid: bk-01JZX5N8QW3F4V9T2B7KD3M9R6

    MediaType:
      type: string
      description: The three first-class media types.
      enum: [music, podcast, audiobook]

    ArtRole:
      type: string
      description: >
        One artwork slot on an item or entity. Only `front` walks the
        album/artist fallback chain and is filled by scans and enrichment;
        `back`, `disc`, `booklet`, and `background` are set explicitly and
        resolve at the entity's own level. Defaults to `front`.
      enum: [front, back, disc, booklet, background]
      default: front

    ArtSource:
      type: object
      description: >
        Where the picture a caller is about to draw came from, so a
        surface that shows a cover large enough to carry a caption can
        say so. Reported on the entity detail reads (which already carry
        the identity the cover belongs to) rather than on list rows: a
        grid thumbnail has no room for a mark, and putting this on every
        summary row would cost a lookup per row for a caption nothing
        draws.


        This describes the picture that a front-cover resolve actually
        answers with, which for an album with no durable cover of its own
        is a member track's - reported honestly as that track's source,
        with `derived` marking that the album did not choose it.
      required: [source]
      properties:
        source:
          type: string
          description: >
            The producer: `tag` (the file's own embedded cover),
            `sidecar` (a cover image beside the audio), `user` (set
            through the curation surface), `enrichment` (fetched from a
            metadata provider, named in `provider`), or `feed` (a podcast
            feed's image, or a radio station's own announcement). A
            string, not a closed enum: treat an unknown value as
            unattributed and draw nothing.
          example: enrichment
        provider:
          type: string
          description: >
            The provider that supplied an `enrichment` cover, as an id
            (`deezer`, `coverartarchive`, `fanarttv`). Empty for every
            other source.
          example: coverartarchive
        sourceUrl:
          type: string
          description: >
            Where the bytes were fetched from, for a cover that came off
            the network (`enrichment`, `feed`). Empty otherwise.
        level:
          type: string
          description: >
            Which rung of the fallback chain answered: `track`, `book`,
            `episode`, `album`, `artist`, `release_group`, `genre`,
            `podcast`, or `playlist`. Absent where there is no chain
            (radio, which resolves nothing from the catalog). Open set;
            a client that does not recognise a value should name no rung
            rather than guess.
          example: album
        derived:
          type: boolean
          description: >
            True when the answering level holds no cover of its own and
            the picture came from a member instead - an album showing one
            of its tracks' covers, which is the ordinary case for an
            album nobody has given a durable cover. `source` is that
            member's, so this is what stops a caption reading as though
            the album made the choice. Absent means the same as false.
        updatedAt:
          type: string
          format: date-time
          description: When this attachment was last written.

    ItemSummary:
      type: object
      description: >
        Compact item representation used by list endpoints and client-side
        library mirrors (~summary row).
      required: [pid, mediaType, title, durationMs]
      properties:
        pid:
          type: string
          description: Type-prefixed ULID.
          example: tr-01JZX5N8QW3F4V9T2B7KD3M9R6
        mediaType:
          $ref: "#/components/schemas/MediaType"
        title:
          type: string
          description: Display title.
          example: Prancing Pony Blues
        artist:
          type: string
          description: Primary display artist / author / show name.
        album:
          type: string
          description: Album / series / podcast title, when applicable.
        artistPid:
          type: string
          description: >
            The artist entity behind `artist`, so a client can group and
            link by identity rather than by display text - two artists
            with the same name are two entities, and one artist spelled
            two ways is still one. Absent when the item has no artist
            entity. For an audiobook this is its author.
          example: ar-01JZX5N8QW3F4V9T2B7KD3M9R6
        albumPid:
          type: string
          description: >
            The album entity behind `album`, for the same reason. Tracks
            only: a podcast episode and an audiobook are not album
            members, and their `album` is a series or show title with no
            album entity behind it. Absent when the track belongs to no
            album.
          example: al-01JZX5N8QW3F4V9T2B7KD3M9R6
        trackNumber:
          type: integer
          description: >
            Track position within its disc (music). On the summary row
            rather than only on the detail because a listing is where it
            is needed: an album's items page arrives in the library's
            own stable order, and this plus `discNumber` is what a
            client sorts a release back into. Absent when the item
            carries none.
        discNumber:
          type: integer
          description: >
            Disc number within a multi-disc release (music). Absent for
            a single-disc release and for anything that is not a track.
        durationMs:
          type: integer
          format: int64
          description: >
            Duration in milliseconds. For a multi-file audiobook this
            is the total across all parts; for a not-yet-fetched
            podcast episode it is the feed-declared duration, or 0
            when the feed declares none.
          example: 214000
        artUrl:
          type: string
          description: >
            Origin-relative URL of the item's artwork endpoint. Always
            populated; the endpoint itself returns 404 for items with no
            artwork, so clients keep a placeholder ready.
          example: /api/v1/items/tr-01JZX5N8QW3F4V9T2B7KD3M9R6/art

    ChapterMark:
      type: object
      description: One chapter mark on an item's timeline.
      required: [index, startMs]
      properties:
        index:
          type: integer
          description: Zero-based chapter position.
        title:
          type: string
          description: Chapter title.
        startMs:
          type: integer
          format: int64
          description: >
            Chapter start in milliseconds (book-timeline milliseconds
            for multi-part audiobooks).
        endMs:
          type: integer
          format: int64
          description: >
            Chapter end in milliseconds, exclusive. Absent for
            open-ended final chapters.

    Library:
      type: object
      description: One catalog library (a scanned root).
      required: [pid, name]
      properties:
        pid:
          type: string
          description: Library PID.
          example: lb-01JZX5N8QW3F4V9T2B7KD3M9R6
        name:
          type: string
          description: Display name (the configured root name).
          example: music
        media:
          type: string
          description: >
            Content class the library holds. Currently `music`,
            `audiobook`, `podcast`, or `mixed`; new values may appear.
          example: music
        path:
          type: string
          description: >
            Absolute filesystem path of the root, for the administrative
            surface that manages it. Absent where the catalog cannot
            render the stored path as text (roots on non-UTF8
            filesystems are stored as raw bytes).
          example: /srv/media/music
        itemCount:
          type: integer
          format: int64
          description: >
            Playable items the catalog holds under this root. Present
            only where the caller asked for counts, and counted at read
            time, so it lags a running scan.

    LibraryCreated:
      allOf:
        - $ref: "#/components/schemas/Library"
        - type: object
          description: What creating the library did beyond creating it.
          properties:
            streamingWarning:
              type: string
              description: >
                Present when the library exists but streaming from it does
                not work yet, saying what an administrator still has to do.
                Creating a root reconciles the WaxFlow sidecar so it serves
                the same directory; where that cannot happen (a sidecar too
                old to reload, a path it cannot open) browsing, downloading,
                and direct playback still work and streaming waits for a
                sidecar restart. Absent means streaming works now.
              example: >-
                streaming from this library is not available yet: the
                sidecar could not open /srv/media/audiobooks
      description: A newly created library, with any degradation it left behind.

    Libraries:
      type: object
      description: All catalog libraries.
      required: [libraries]
      properties:
        libraries:
          type: array
          items:
            $ref: "#/components/schemas/Library"

    LibraryCreate:
      type: object
      description: A new library root to register at runtime.
      required: [name, path]
      properties:
        name:
          type: string
          description: >
            Display name, and the WaxFlow root name the same directory is
            served under for streaming.
          example: audiobooks
        path:
          type: string
          description: >
            Absolute filesystem path on the server. It must not overlap an
            existing root, the inbox folders, or the podcast download dir.
          example: /srv/media/audiobooks
        media:
          type: string
          enum: [music, audiobook, mixed]
          default: mixed
          description: >
            Content class the root holds. `mixed` (the default) admits both
            tracks and books.
        managed:
          type: boolean
          default: false
          description: >
            Whether the catalog may place and organize files under this root:
            uploads land here and the organizer may move files within it. The
            default keeps files strictly in place.

    Job:
      type: object
      description: A server-run catalog job.
      required: [pid, kind, state]
      properties:
        pid:
          type: string
          description: Job PID.
          example: jb-01JZX5N8QW3F4V9T2B7KD3M9R6
        kind:
          type: string
          description: What the job does (`scan`, `analyze`, `enrich`, `organize`).
          example: scan
        state:
          type: string
          description: >
            Job lifecycle state. Currently `running`, `done`, `failed`,
            `crashed`, or `canceled`; new states may appear, and clients
            must treat unknown values as "not finished successfully yet"
            rather than failing.
          example: running
        progress:
          type: number
          format: double
          description: >
            Completion fraction in [0, 1]. Absent when the job has not yet
            reported progress or cannot estimate it.
        message:
          type: string
          description: Human-readable progress note.
        error:
          type: string
          description: Failure detail for `failed`/`crashed` jobs.

    AuditEvent:
      type: object
      description: One recorded administrative action.
      required: [id, action, createdAt]
      properties:
        id:
          type: string
          description: Opaque event id, unique and time-ordered.
        actorId:
          type: string
          description: >
            The acting user's PID; absent for server-initiated
            actions (scheduled jobs, startup restore).
        actorName:
          type: string
          description: >
            The acting username at the time of the action (kept
            verbatim if the account is later renamed or deleted).
        action:
          type: string
          description: >
            Dotted action name, resource first: `user.create`,
            `user.update`, `user.delete`, `user.approve`,
            `user.reject`, `invite.create`, `invite.revoke`,
            `playlist.delete`, `items.delete`, `entity.merge`,
            `trash.restore`, `trash.empty`, `backup.create`,
            `backup.delete`, `restore.stage`, `restore.apply`,
            `settings.update`, `schedule.update`, `library.create`,
            `library.read-only`, `transcoding.update`, `migration.run`,
            and more as surfaces grow. Open vocabulary; filter by prefix.
        targetKind:
          type: string
          description: What kind of thing was acted on (`user`, `playlist`, ...).
        targetPid:
          type: string
          description: The acted-on resource's PID, when it has one.
        targetName:
          type: string
          description: >
            The target's display name at the time of the action
            (survives the target's deletion).
        detail:
          type: object
          additionalProperties: true
          description: >
            Action-specific structure: what changed, from what, to
            what. Shapes are stable per action but may grow fields.
        createdAt:
          type: string
          format: date-time
          description: When the action happened.

    AuditEventPage:
      type: object
      description: One page of audit events.
      required: [events]
      properties:
        events:
          type: array
          description: Events, newest first.
          items:
            $ref: "#/components/schemas/AuditEvent"
        nextCursor:
          type: string
          description: Opaque cursor for the next page. Absent on the last page.

    AdminSettings:
      type: object
      description: Runtime-editable server settings.
      required: [signupEnabled, readOnly, backupKeepCount, backupKeepBytes]
      properties:
        signupEnabled:
          type: boolean
          description: >
            Whether open self-serve signup is accepted (registrations
            land pending). Invite links work regardless.
        readOnly:
          type: boolean
          description: >
            Server-wide read-only mode: every library behaves
            read-only (uploads, organizing, write-back, deletion,
            and the file tools are refused with code `read-only`).
        sonicAnalysis:
          type: boolean
          description: >
            Whether the server analyzes its own library for sonic
            similarity in the background (the embedded analyzer).
            Applies immediately; turning it off mid-library keeps the
            embeddings already computed. The boot default comes from
            `WAXDECK_SONIC_ANALYSIS`, and this setting overrides it
            once saved. External workers are unaffected (their access
            is the worker-token configuration). Optional on PUT so
            settings writers predating this field never change it:
            absent keeps the current value. Always present in
            responses.
        enrichmentWriteTags:
          type: boolean
          description: >
            Whether the whole-library enrichment pass writes what it
            filled back into the files, which is what makes enrichment
            survive a rescan: the catalog is authoritative either way,
            but a rescan re-reads the tags and would otherwise clear
            values only the catalog held.


            Off by default, because it modifies the listener's own
            files. Files whose format cannot store a key are counted
            in `enrichmentStatus.lastRun.tagsUnrepresented` and left
            byte-identical, which is not a failure. Applies to the next
            pass; a run already in flight keeps the setting it started
            under. Optional on PUT so settings writers predating this
            field never change it: absent keeps the current value.
            Always present in responses.
        radioExternalArt:
          type: boolean
          description: >
            Whether radio may look a station's announced title up
            externally when nothing in this library matches it, so the
            full-screen player can draw the song's cover instead of the
            station's mark. The hosts it may reach are `api.deezer.com`,
            then `musicbrainz.org` and `coverartarchive.org` where
            metadata matching is enabled (the default), asked in that
            order and stopping at the first that answers.


            On by default, and the only setting here that governs
            whether this server talks to a third party at all: it sends a
            string a station chose - an artist and a track title - off
            this machine. Only about one station in twenty announces a
            picture of its own, so a server with this off draws the
            station mark for the rest and nothing says why; the opt-out
            is here for the households that want it. Turned off, radio
            still draws a library match when it finds one, then the
            picture the station announced, then the station logo, then
            the station mark, and makes no outbound request.


            Each host is paced separately, at the etiquette it asks for
            (MusicBrainz allows one request per second, and wants an
            identifying agent), and answers are cached server-side, so
            the rung costs no per-device traffic. Optional on PUT so settings writers predating this
            field never change it: absent keeps the current value. Always
            present in responses.
        backupKeepCount:
          type: integer
          minimum: 0
          description: >
            How many backup archives to keep; older ones are deleted
            after each successful backup. 0 keeps every archive.
        backupKeepBytes:
          type: integer
          format: int64
          minimum: 0
          description: >
            Total archive bytes to keep, oldest deleted first when
            exceeded. 0 is unlimited. Imported archives are exempt.
        trashRetentionDays:
          type: integer
          minimum: 0
          description: >
            Automatically purge trashed files older than this many days
            on a periodic sweep; 0 disables retention (the trash keeps
            entries until an administrator empties it). Optional on PUT
            so settings writers predating this field never change it:
            absent keeps the current value. Always present in responses.
        taskRetentionDays:
          type: integer
          minimum: 0
          description: >
            Clear finished tool tasks older than this many days on the
            scheduled prune; terminal rows only. 0 keeps them, and an
            unconfigured server answers 30 - so unlike
            `trashRetentionDays`, 0 here is a choice rather than the
            default. Optional on PUT (absent keeps the current value),
            always present in responses.

    TranscodingLimits:
      type: object
      description: >
        Transcode session limits, enforced at the media proxy when a
        stream engages the streaming engine (direct-played originals
        never count).
      required: [maxConcurrent, maxConcurrentPerUser, defaultMaxBitrateKbps]
      properties:
        maxConcurrent:
          type: integer
          minimum: 0
          description: >
            Server-wide concurrent transcode session cap; 0 is
            unlimited (the streaming engine's own admission control
            remains the backstop).
        maxConcurrentPerUser:
          type: integer
          minimum: 0
          description: >
            Per-account concurrent transcode session cap; 0 is
            unlimited. Administrators are exempt.
        defaultMaxBitrateKbps:
          type: integer
          minimum: 0
          description: >
            Default transcode bitrate ceiling in kbit/s for accounts
            without their own `maxTranscodeKbps`; 0 is unlimited.

    TranscodingActivity:
      type: object
      description: >
        What the transcoder is doing right now, for context beside the
        limits.
      required: [activeSessions]
      properties:
        activeSessions:
          type: integer
          description: >
            Engine-backed streams in flight: what the concurrent caps
            are counting. Both a floor and a ceiling on what is
            "really" being transcoded - a client that forced the
            source's own format is routed through the engine and
            counted here though nothing is re-encoded, and HLS timeline
            segments are admitted by the streaming engine's own control
            and are not counted at all.

    ScheduleKind:
      type: string
      enum: [scan, backup, prune, analyze]
      description: >
        A schedulable job kind. A shared named schema on purpose (the
        path parameter and the schedule object both use it): identical
        inline enums make the Dart generator emit one enum class into
        two files, which does not compile.

        `analyze` is off by default and costs a full audio decode per
        file; see `POST /library/analyze` for what it produces and what
        it costs. A firing that collides with an analyze pass already
        running is skipped rather than recorded as run, so it retries on
        the next tick instead of waiting for the next scheduled window.

    ScrobblingAdminConfig:
      type: object
      description: The server-level scrobbling credential state.
      required: [lastfmConfigured, lastfmSource, lastfmSecretSet]
      properties:
        lastfmConfigured:
          type: boolean
          description: >
            Whether a usable Last.fm API credential pair is in effect
            (users can link accounts and the connect button enables).
        lastfmSource:
          type: string
          description: >
            Where the effective pair came from: `settings`,
            `environment`, or `none`. An open string.
        lastfmApiKey:
          type: string
          description: >
            The effective API key, for display in the admin form.
            Present only when configured; the shared secret is never
            returned.
        lastfmSecretSet:
          type: boolean
          description: Whether a shared secret is stored.

    ScrobblingAdminConfigPut:
      type: object
      description: >
        A Last.fm API credential change: both values to set, both
        empty to clear back to environment credentials.
      required: [lastfmApiKey, lastfmSecret]
      properties:
        lastfmApiKey:
          type: string
          maxLength: 128
          description: The Last.fm API key.
        lastfmSecret:
          type: string
          maxLength: 128
          format: password
          description: The Last.fm shared secret.

    Schedule:
      type: object
      description: One scheduled job's configuration and history.
      required: [kind, cron, enabled]
      properties:
        kind:
          $ref: "#/components/schemas/ScheduleKind"
        cron:
          type: string
          description: >
            Five-field cron expression (minute, hour, day of month,
            month, day of week), server-local time.
          example: "0 3 * * *"
        enabled:
          type: boolean
          description: Whether the schedule fires.
        lastRunAt:
          type: string
          format: date-time
          description: When the job last ran; absent if never.
        lastStatus:
          type: string
          description: "`ok` or `failed` for the last run. An open string."
        lastError:
          type: string
          description: Failure detail when the last run failed.
        nextRunAt:
          type: string
          format: date-time
          description: The next firing time while enabled.

    ScheduleList:
      type: object
      description: Every schedule.
      required: [schedules]
      properties:
        schedules:
          type: array
          description: One entry per kind.
          items:
            $ref: "#/components/schemas/Schedule"

    SchedulePut:
      type: object
      description: A schedule change.
      required: [cron, enabled]
      properties:
        cron:
          type: string
          minLength: 1
          maxLength: 256
          description: Five-field cron expression.
          example: "0 3 * * *"
        enabled:
          type: boolean
          description: Whether the schedule fires.

    Backup:
      type: object
      description: One backup archive.
      required: [id, state, trigger, fileName, createdAt]
      properties:
        id:
          type: string
          description: Backup PID.
          example: bu-01JZX5N8QW3F4V9T2B7KD3M9R6
        state:
          type: string
          description: >
            `running`, `done`, or `failed`. A string, not a closed
            enum.
        trigger:
          type: string
          description: >
            What produced it: `manual`, `scheduled`, or `imported`.
            A string, not a closed enum.
        fileName:
          type: string
          description: Archive file name.
          example: waxdeck-backup-20260721-030000.zip
        sizeBytes:
          type: integer
          format: int64
          description: Archive size once written.
        error:
          type: string
          description: Why the backup failed, when `failed`.
        createdAt:
          type: string
          format: date-time
          description: When the backup started (or was imported).
        finishedAt:
          type: string
          format: date-time
          description: When it reached a terminal state.

    BackupList:
      type: object
      description: All backup archives.
      required: [backups]
      properties:
        backups:
          type: array
          description: Backups, newest first.
          items:
            $ref: "#/components/schemas/Backup"

    RestorePlan:
      type: object
      description: >
        A staged restore: what will happen at the next server start.
      required: [backupId, stagedAt, keyfilePresent, keyfileMatches, sealedCasualties, warnings]
      properties:
        backupId:
          type: string
          description: The backup the restore applies.
        stagedAt:
          type: string
          format: date-time
          description: When the restore was staged.
        keyfilePresent:
          type: boolean
          description: Whether this server holds an encryption key.
        keyfileMatches:
          type: boolean
          description: >
            Whether this server's key opens the archive's sealed
            credentials. False means every entry in
            `sealedCasualties` becomes unusable after restore and is
            marked pending re-auth instead of surfacing as scattered
            errors.
        sealedCasualties:
          type: array
          description: >
            The credentials that break when the key does not match;
            empty when it does.
          items:
            $ref: "#/components/schemas/SealedCasualty"
        warnings:
          type: array
          description: >
            Human-readable cautions (schema differences, a
            server-version gap, an archive older than the current
            data).
          items:
            type: string

    SealedCasualty:
      type: object
      description: One credential a key-mismatched restore breaks.
      required: [kind, name]
      properties:
        kind:
          type: string
          description: >
            What kind of credential: `app-password`, `private-feed`,
            `scrobble-connection`, or others as integrations grow.
            An open string.
        name:
          type: string
          description: Which one, in user terms ("Symfonium on the
            kitchen tablet", the feed's show title).

    TrashEntry:
      type: object
      description: One file in the catalog's deletion undo journal.
      required: [id, name, reason, sizeBytes, trashedAt]
      properties:
        id:
          type: string
          description: Trash entry PID.
          example: th-01JZX5N8QW3F4V9T2B7KD3M9R6
        itemPid:
          type: string
          description: The item the file belonged to.
        name:
          type: string
          description: The file's original library-relative path.
          example: "Album/01 Track.flac"
        reason:
          type: string
          description: >
            Why it was deleted: `user`, `prune`, or `permanent`. An
            open string.
        sizeBytes:
          type: integer
          format: int64
          description: File size.
        trashedAt:
          type: string
          format: date-time
          description: When it was deleted.
        restoredAt:
          type: string
          format: date-time
          description: When it was restored; absent while trashed.

    TrashList:
      type: object
      description: The trash journal.
      required: [entries]
      properties:
        entries:
          type: array
          description: Entries, newest first.
          items:
            $ref: "#/components/schemas/TrashEntry"

    TrashEmptyResult:
      type: object
      description: What an empty-trash pass did.
      required: [purged, errored, reclaimedBytes]
      properties:
        purged:
          type: integer
          description: Files permanently deleted.
        errored:
          type: integer
          description: Files that could not be purged (retry later).
        reclaimedBytes:
          type: integer
          format: int64
          description: Disk space reclaimed.

    TrashPurgeResult:
      type: object
      description: What purging one trash entry reclaimed.
      required: [reclaimedBytes]
      properties:
        reclaimedBytes:
          type: integer
          format: int64
          description: Disk space reclaimed by purging the entry.

    GenreNode:
      type: object
      description: One genre in the canonical vocabulary.
      required: [name]
      properties:
        name:
          type: string
          maxLength: 128
          description: The canonical display spelling. Every surface shows this.
          example: Hip Hop
        parent:
          type: string
          maxLength: 128
          description: >
            The top-level genre this one groups under, by canonical name.
            Absent or empty for a top-level genre. The tree is two levels
            deep: a parent may not itself have one.
          example: Metal
        aliases:
          type: array
          maxItems: 64
          description: >
            The spellings that resolve to this genre. Case, diacritics,
            and punctuation already fold, so list only what folding
            cannot reach.
          items:
            type: string
            maxLength: 128
            example: Rap

    GenreTree:
      type: object
      description: The canonical genre vocabulary in force.
      required: [source, genres]
      properties:
        source:
          type: string
          enum: [default, custom]
          description: >
            `default` while the instance runs on the tree WaxDeck ships,
            `custom` once one has been stored here.
        genres:
          type: array
          description: >
            The vocabulary in display order: each top-level genre
            followed by the genres grouped under it, alphabetically
            throughout.
          items:
            $ref: "#/components/schemas/GenreNode"

    GenreTreeUpdate:
      type: object
      description: A replacement genre vocabulary.
      required: [genres]
      properties:
        genres:
          type: array
          maxItems: 2000
          description: >
            The whole vocabulary. An empty list clears the override and
            returns the instance to the shipped default.
          items:
            $ref: "#/components/schemas/GenreNode"

    GenreNormalizeRequest:
      type: object
      description: A full-catalog genre normalization to start.
      properties:
        dryRun:
          type: boolean
          default: false
          description: Report what would be rewritten without writing.

    MigrationCreate:
      type: object
      description: A migration import to start.
      required: [source, serverUrl]
      properties:
        source:
          type: string
          description: >
            Where to pull from: `navidrome` and `subsonic` (a running
            server's Subsonic API), or `audiobookshelf` (its REST
            API). An open string; unknown sources answer
            `invalid-request` naming the supported set.
          example: navidrome
        serverUrl:
          type: string
          maxLength: 512
          description: The source server's base URL.
          example: "https://navidrome.example.net"
        username:
          type: string
          maxLength: 128
          description: Login for Subsonic-API sources.
        password:
          type: string
          maxLength: 256
          format: password
          description: Password for Subsonic-API sources.
        token:
          type: string
          maxLength: 512
          format: password
          description: API token for token-authenticated sources.
        options:
          $ref: "#/components/schemas/MigrationOptions"
        dryRun:
          type: boolean
          default: false
          description: Match and report without writing anything.

    MigrationOptions:
      type: object
      description: What to import. Everything defaults to true.
      properties:
        stars:
          type: boolean
          default: true
          description: Starred songs, albums, and artists.
        ratings:
          type: boolean
          default: true
          description: Song and album ratings.
        history:
          type: boolean
          default: true
          description: >
            Play counts, as backdated import-source listen sessions
            with deterministic ids (re-runs never double-count).
        progress:
          type: boolean
          default: true
          description: >
            In-progress positions (Subsonic bookmarks, Audiobookshelf
            media progress) onto matched items' resume state.

    JobList:
      type: object
      description: Recent catalog jobs.
      required: [jobs]
      properties:
        jobs:
          type: array
          description: Jobs, newest first.
          items:
            $ref: "#/components/schemas/Job"

    LibraryReadOnly:
      type: object
      description: A library's read-only flag.
      required: [readOnly]
      properties:
        readOnly:
          type: boolean
          description: Whether the library refuses writes.
        libraryPid:
          type: string
          description: The library (response only).
          example: lb-01JZX5N8QW3F4V9T2B7KD3M9R6

    LoginRequest:
      type: object
      description: Credentials for local-account login.
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          description: Account username.
          example: admin
        password:
          type: string
          minLength: 1
          format: password
          description: Account password.
        deviceName:
          type: string
          maxLength: 128
          description: >
            Human-readable label for this session in the device list (for
            example `Pixel 9` or `Study desktop`). Native clients pass one;
            web logins usually omit it.

    LoginResponse:
      type: object
      description: Established session plus a bearer token for native clients.
      required: [user, token, csrfToken]
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string
          description: >
            Opaque bearer token equivalent to the session cookie. Native
            clients store it in the OS keychain; web clients ignore it and rely
            on the cookie.
        csrfToken:
          type: string
          description: >
            CSRF token for cookie-authenticated mutations (sent back as the
            `X-CSRF-Token` header). Irrelevant to bearer-token callers.

    SessionInfo:
      type: object
      description: Whether the caller is authenticated, and as whom.
      required: [authenticated]
      properties:
        authenticated:
          type: boolean
          description: True when a valid session or token was presented.
        user:
          $ref: "#/components/schemas/User"
        csrfToken:
          type: string
          description: >
            CSRF token for cookie-authenticated mutations. Present only when
            authenticated.

    BootstrapStatus:
      type: object
      description: Whether first-run setup is still waiting for an administrator.
      required: [required]
      properties:
        required:
          type: boolean
          description: True while the server has no enabled administrator.
        signupEnabled:
          type: boolean
          description: >
            Whether open self-serve signup is enabled, so the login
            screen knows to offer "request an account". Invite links
            work regardless of this flag.

    BootstrapRequest:
      type: object
      description: The first administrator account.
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: Administrator login name.
          example: admin
        password:
          type: string
          minLength: 8
          format: password
          description: Administrator password (at least 8 characters).
        displayName:
          type: string
          maxLength: 128
          description: Optional display name.

    DeviceSession:
      type: object
      description: One live session, as shown in the device list.
      required: [id, kind, createdAt, current]
      properties:
        id:
          type: string
          description: Session identifier.
          example: se-01JZX5N8QW3F4V9T2B7KD3M9R6
        kind:
          type: string
          enum: [web, device]
          description: >
            `web` sessions authenticate with the cookie; `device` sessions
            with a bearer token.
        deviceName:
          type: string
          description: Client-supplied label, when the login provided one.
        client:
          type: string
          description: Client software hint (from the login's user agent).
        createdAt:
          type: string
          format: date-time
          description: When the session was established.
        lastSeenAt:
          type: string
          format: date-time
          description: When the session last made a request (coarse, minutes).
        current:
          type: boolean
          description: True for the session serving this request.

    SessionRename:
      type: object
      description: A new label for one session in the device list.
      required: [deviceName]
      properties:
        deviceName:
          type: string
          minLength: 1
          maxLength: 128
          description: >
            Human-readable label for this session (for example `Pixel 9`
            or `Study desktop`), matching what a login may supply.
            Trimmed of surrounding whitespace; empty after trimming is
            `invalid-request`.

    SessionList:
      type: object
      description: The caller's live sessions, newest first.
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/DeviceSession"

    OidcProvider:
      type: object
      description: One configured OIDC provider.
      required: [id, displayName, startUrl]
      properties:
        id:
          type: string
          description: Stable provider id, referenced by `/auth/oidc/start`.
          example: dex
        displayName:
          type: string
          description: Human-readable name for the login button.
          example: Company SSO
        startUrl:
          type: string
          description: >
            Origin-relative URL that starts this provider's login flow
            (web mode; other modes add their query parameters).
          example: /api/v1/auth/oidc/start?provider=dex

    OidcProviders:
      type: object
      description: The configured OIDC providers.
      required: [providers]
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/OidcProvider"

    OidcExchangeRequest:
      type: object
      description: A one-time OIDC completion code to redeem for a session.
      required: [code]
      properties:
        code:
          type: string
          minLength: 1
          description: The one-time code delivered by the flow's redirect or code page.
        verifier:
          type: string
          description: >
            The secret whose SHA-256 was sent as `challenge` when the
            flow started. Required when the flow carried a challenge;
            a missing or wrong value fails the exchange.
        deviceName:
          type: string
          maxLength: 128
          description: Device-list label for the resulting session.

    SignupRequest:
      type: object
      description: A self-serve registration.
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: >
            Requested login name, unique case-insensitively. Leading
            and trailing whitespace is rejected.
          example: samwise
        password:
          type: string
          minLength: 8
          format: password
          description: The account password (at least 8 characters).
        displayName:
          type: string
          maxLength: 128
          description: Optional display name.
        inviteToken:
          type: string
          maxLength: 256
          description: >
            An invite token. A valid one pre-approves the account
            with the role, access, and permissions the invite
            carries.

    SignupResult:
      type: object
      description: What a registration produced.
      required: [state]
      properties:
        state:
          type: string
          enum: [pending, active]
          description: >
            `pending` awaits an administrator's approval before it
            can log in; `active` (invited) can log in immediately.

    Bookmark:
      type: object
      description: One place a listener marked in a book.
      required: [id, positionMs, createdAt]
      properties:
        id:
          type: string
          description: Bookmark PID.
          example: bm-01JZX5N8QW3F4V9T2B7KD3M9R6
        positionMs:
          type: integer
          format: int64
          description: Book-timeline position in milliseconds.
        note:
          type: string
          description: The listener's note, when they wrote one.
        createdAt:
          type: string
          format: date-time
          description: When the bookmark was made.

    BookmarkList:
      type: object
      description: The caller's bookmarks in one book.
      required: [bookmarks]
      properties:
        bookmarks:
          type: array
          description: Bookmarks ordered by `positionMs`, earliest first.
          items:
            $ref: "#/components/schemas/Bookmark"

    BookmarkCreate:
      type: object
      description: A new bookmark on the book timeline.
      required: [positionMs]
      properties:
        positionMs:
          type: integer
          format: int64
          minimum: 0
          description: Book-timeline position in milliseconds.
        note:
          type: string
          maxLength: 500
          description: An optional note.

    BookPart:
      type: object
      description: >
        One backing file of an audiobook, in reading order. `index` is
        the join key across the whole surface: it matches play-info's
        `partIndex`, the skip-map `partIndex`, and the same position in
        download-info's `files` array.
      required: [index, startMs, durationMs]
      properties:
        index:
          type: integer
          description: Zero-based reading-order position.
        startMs:
          type: integer
          format: int64
          description: Book-timeline millisecond offset where this part begins.
        durationMs:
          type: integer
          format: int64
          description: Part duration in milliseconds.
        displayName:
          type: string
          description: Human-readable part name (the file's base name).

    BookSettings:
      type: object
      description: >
        The calling user's per-book playback settings. All fields are
        optional; an absent field means the server default. `PUT`
        replaces the whole object.
      properties:
        speed:
          type: number
          format: double
          minimum: 0.5
          maximum: 3.5
          description: Playback speed memory for this book.
        voiceBoost:
          type: boolean
          description: Apply spoken-word loudness normalization for this book.
        trimSilence:
          type: boolean
          description: Trim mapped silence spans when playing this book.

    BookDetail:
      type: object
      description: >
        Full audiobook detail. All positions are book-timeline
        milliseconds spanning every part.
      required: [pid, title, durationMs, authors, narrators, chapters, parts]
      properties:
        pid:
          type: string
          description: Book PID.
          example: bk-01JZX5N8QW3F4V9T2B7KD3M9R6
        title:
          type: string
          description: Book title.
        subtitle:
          type: string
          description: Subtitle, when known.
        artSource:
          allOf:
            - $ref: "#/components/schemas/ArtSource"
          description: >
            Where the cover this book answers came from, for the mark
            under it. Absent when the book has no artwork, or when the
            answering image carries no attribution.
        authors:
          type: array
          description: Author display names, in credit order.
          items:
            type: string
        narrators:
          type: array
          description: Narrator display names, in credit order.
          items:
            type: string
        series:
          type: string
          description: Series name, when the book belongs to one.
        seriesSequence:
          type: string
          description: >
            Position within the series, as the source states it
            (decimals like `1.5` are preserved).
        publisher:
          type: string
          description: Publisher, when known.
        asin:
          type: string
          description: Audible ASIN, when known.
        isbn:
          type: string
          description: ISBN, when known.
        edition:
          type: string
          description: Edition label, when known.
        abridged:
          type: boolean
          description: Whether this edition is abridged, when known.
        descriptionHtml:
          type: string
          description: >
            Book description as sanitized HTML (server-side allowlist;
            safe to render directly).
        durationMs:
          type: integer
          format: int64
          description: Total duration across all parts, in milliseconds.
        artUrl:
          type: string
          description: Origin-relative URL of the book's artwork endpoint.
        chapters:
          type: array
          description: Chapters on the book timeline, ordered by `startMs`.
          items:
            $ref: "#/components/schemas/ChapterMark"
        parts:
          type: array
          minItems: 1
          description: Backing files in reading order.
          items:
            $ref: "#/components/schemas/BookPart"
        settings:
          $ref: "#/components/schemas/BookSettings"

    BookResume:
      type: object
      description: The calling user's resume point in one book.
      required: [positionMs]
      properties:
        positionMs:
          type: integer
          format: int64
          description: Book-timeline resume position in milliseconds.
        chapter:
          $ref: "#/components/schemas/ChapterMark"
        updatedAt:
          type: string
          format: date-time
          description: When this position was last written.

    MixBasis:
      type: string
      description: >
        Which engine answered a discovery request: `sonic` used stored
        audio embeddings, `metadata` used genre and artist heuristics
        (the zero-setup fallback).
      enum: [sonic, metadata]

    SimilarTracks:
      type: object
      description: Tracks similar to a seed, most similar first.
      required: [basis, items]
      properties:
        basis:
          $ref: "#/components/schemas/MixBasis"
        items:
          type: array
          items:
            $ref: "#/components/schemas/ItemSummary"

    InstantMixRequest:
      type: object
      description: >
        A mix seed. Exactly one of `seedPid` and `genre` must be set.
      properties:
        seedPid:
          type: string
          description: >
            Seed track (`tr-`), artist (`ar-`), or album (`al-`) pid.
            An artist or album seed anchors the mix on that entity's
            tracks (resolved by entity identity, so the mix follows the
            catalog's grouping rather than a display-string match).
          example: tr-01JZX5N8QW3F4V9T2B7KD3M9R6
        genre:
          type: string
          minLength: 1
          maxLength: 200
          description: Seed genre name, matched case-insensitively.
          example: blues
        adventurousness:
          type: number
          minimum: 0
          maximum: 1
          default: 0.4
          description: >
            How far the mix wanders from the seed. 0 hugs the seed's
            closest sonic neighbors; 1 wanders far. On the metadata
            fallback this loosens the genre bound instead.
        size:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
          description: Requested mix length in tracks.
        excludePids:
          type: array
          maxItems: 500
          description: >
            Tracks to leave out (already played in this radio
            session). The seed is always excluded.
          items:
            type: string

    InstantMix:
      type: object
      description: A computed mix. Not persisted; order is play order.
      required: [basis, items]
      properties:
        basis:
          $ref: "#/components/schemas/MixBasis"
        items:
          type: array
          items:
            $ref: "#/components/schemas/ItemSummary"

    SonicPath:
      type: object
      description: >
        A sonic path between two tracks, starting track first,
        destination last when `complete`.
      required: [complete, items]
      properties:
        complete:
          type: boolean
          description: >
            Whether the path reaches the destination. False when the
            neighbor graph connects the endpoints only partially; the
            returned prefix still drifts toward the target.
        items:
          type: array
          items:
            $ref: "#/components/schemas/ItemSummary"

    EnrichmentStatus:
      type: object
      description: Enrichment providers and coverage.
      required: [providers, coverage, running, configured]
      properties:
        providers:
          type: array
          description: >
            Registered providers in priority order (this server's
            own first, then the catalog's key-free built-ins).
          items:
            $ref: "#/components/schemas/EnrichmentProvider"
        coverage:
          $ref: "#/components/schemas/EnrichmentCoverage"
        running:
          type: boolean
          description: Whether a whole-library pass is running now.
        configured:
          type: boolean
          description: >
            Whether the whole-library pass can run at all. It needs a
            MusicBrainz contact, which is boot configuration
            (`-enrichment-contact` / `WAXDECK_ENRICHMENT_CONTACT`) and
            not a runtime setting, because MusicBrainz requires an
            identifying agent before anything is sent.


            False means every run refuses with `source-unavailable`, so
            a console should say so rather than offer a button that
            errors. Distinct from a provider's own `configured`, which
            is about that provider's key: every provider can be
            configured and the pass still refuse, because the contact
            gates the identity spine they hang off.
        lastRun:
          $ref: "#/components/schemas/EnrichmentLastRun"

    EnrichmentProvider:
      type: object
      description: One enrichment provider.
      required: [name, capabilities, configured, builtin]
      properties:
        name:
          type: string
          description: Stable provider id.
          example: fanarttv
        capabilities:
          type: array
          description: >
            What it supplies: `identity`, `genres`, `cover`,
            `lyrics`, `book`. Strings, not a closed enum.
          items:
            type: string
        configured:
          type: boolean
          description: >
            Whether the provider can run (key-free providers always;
            keyed ones once their key is set).
        builtin:
          type: boolean
          description: True for the catalog's built-ins.

    EnrichmentLastRun:
      type: object
      description: >
        What the most recent finished whole-library pass did. Absent
        until one has finished.


        Coverage answers how much of the library is enriched; this
        answers whether the last pass accomplished anything, which
        coverage cannot. A pass that searched two thousand albums and
        matched none leaves coverage exactly where it was, and so does
        one whose every tag write failed; both read as "nothing
        happened" without these counts.
      required:
        [
          albumsSearched,
          albumsMatched,
          tagsWritten,
          tagsFailed,
          tagsUnrepresented,
          tagsSkipped,
        ]
      properties:
        albumsSearched:
          type: integer
          description: >
            Albums the release match looked up: which pressing of a
            record the library holds, resolved from a barcode or a
            catalog number.
        albumsMatched:
          type: integer
          description: >
            Albums it pinned to a release. Searched without matched is
            a library whose albums carry no identifiers, not a broken
            pass.
        tagsWritten:
          type: integer
          description: >
            Files the pass wrote enriched values back into. Zero unless
            tag write-back is on, which is what makes enrichment
            survive a rescan.
        tagsFailed:
          type: integer
          description: Files whose write failed. The catalog kept the values either way.
        tagsUnrepresented:
          type: integer
          description: >
            Files whose format cannot store a key that was filled. Not
            a failure: the bytes are unchanged and correct.
        tagsSkipped:
          type: integer
          description: >
            Book parts left unwritten because their book's primary part
            failed.
        finishedAt:
          type: string
          format: date-time
          description: When the pass finished.

    EnrichmentCoverage:
      type: object
      description: How much of the catalog has enriched.
      required: [artists, releaseGroups, books, lyrics]
      properties:
        artists:
          $ref: "#/components/schemas/CoverageCount"
        releaseGroups:
          $ref: "#/components/schemas/CoverageCount"
        books:
          $ref: "#/components/schemas/CoverageCount"
        lyrics:
          $ref: "#/components/schemas/CoverageCount"

    CoverageCount:
      type: object
      description: Enriched versus total for one entity class.
      required: [enriched, total]
      properties:
        enriched:
          type: integer
          description: Entities that completed enrichment.
        total:
          type: integer
          description: Entities in scope.

    EnrichmentRunRequest:
      type: object
      description: Options for a whole-library pass.
      properties:
        force:
          type: boolean
          default: false
          description: Re-enrich entities that already enriched once.

    EnrichmentRunResult:
      type: object
      description: The started pass.
      required: [jobPid]
      properties:
        jobPid:
          type: string
          description: The catalog job to follow.

    WsSubscribeFrame:
      type: object
      description: >
        The WebSocket subscribe frame, sent by the client as the first and
        only client-to-server message on the event channel (transport in
        `api/events.md`). Clients pass the cursors their mirror is at; a
        client with no mirror yet omits them, receives only live
        invalidations, and snapshots through the sync endpoints (before
        or after subscribing; both orders are sound because invalidations
        carry no data).
      properties:
        catalogSince:
          type: string
          description: The client's opaque catalog change cursor.
        serverSince:
          type: string
          description: The client's opaque server change cursor.
        topics:
          type: array
          description: >
            Topics to receive (`catalog`, `user`, `player`, `radio`).
            Omit for all topics. Unknown topic names are ignored. The
            `player` and `radio` topics have no cursor (they invalidate
            ephemeral state, not a mirrored stream), so subscribing
            never prompts an initial invalidate for either; clients that
            render endpoint or session lists pull them on connect.
          items:
            type: string
            example: catalog

    WsEventFrame:
      type: object
      description: >
        One server-to-client frame on the WebSocket event channel
        (transport in `api/events.md`). An `invalidate` frame tells the
        client the named topic moved: for `catalog` pull `/sync/catalog`
        and for `user` pull `/sync/server` from the client's own
        cursor; for `player` pull `/player/endpoints` and
        `/player/sessions`, and for `radio` - artwork for an announced
        title landed - re-read `/radio/stations/{pid}/play-info` for the
        station being listened to, all of which always return current
        truth (no cursor); a client tuned to nothing ignores `radio`.
        Invalidations are coalesced server-side, so one frame
        can cover many changes, and carry no data, so a redundant pull
        is harmless. A `resync` frame means continuity was lost for the
        named stream, or for every stream when `topic` is absent
        (client queue overflow, pruned history): drop the affected
        mirror halves, re-mirror through the sync endpoints, then close
        the socket, reconnect, and resubscribe with the fresh cursors.
        `resync` never names `player` or `radio` (there is nothing to
        replay).
        `type` and `topic` are strings, not closed enums; clients must
        ignore frames whose `type` they do not recognize.
      required: [type]
      properties:
        type:
          type: string
          description: "Frame discriminator: `invalidate` or `resync`."
          example: invalidate
        topic:
          type: string
          description: >
            Which topic the frame is about (`catalog`, `user`, `player`,
            or `radio`). Always present on `invalidate`; on `resync` its
            absence means every stream.
          example: catalog

    WsCommandFrame:
      type: object
      description: >
        Client-to-server command on the WebSocket command bus
        (transport in `api/events.md`). Targets a session by id;
        `verb` is one of `play`, `pause`, `stop`, `seek`, `next`,
        `previous`, `set-volume`, `set-rate`, `set-queue`,
        `set-repeat`, `set-shuffle` (open string; unknown verbs answer
        an error frame). Arguments are absolute state, never deltas.
        Answered exactly once, with an ack or an error echoing `id`.
      required: [type, id, sessionId, verb]
      properties:
        type:
          type: string
          description: Always `cmd`.
          example: cmd
        id:
          type: string
          maxLength: 64
          description: Client-chosen correlation id, echoed on the answer.
          example: c7
        sessionId:
          type: string
          description: The target session.
          example: ps-01JZX5N8QW3F4V9T2B7KD3M9R6
        verb:
          type: string
          description: The command verb.
          example: seek
        positionMs:
          type: integer
          format: int64
          description: For `seek` and optionally `set-queue`.
        volume:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: For `set-volume`, 0 to 1.
        rate:
          type: number
          format: double
          minimum: 0.25
          maximum: 5
          description: For `set-rate`.
        itemPids:
          type: array
          description: For `set-queue`, the new queue in play order.
          maxItems: 500
          items:
            type: string
        index:
          type: integer
          description: For `set-queue`, the entry to play.
        repeat:
          type: string
          description: "For `set-repeat`: `off`, `all`, or `one`."
        shuffle:
          type: boolean
          description: For `set-shuffle`.

    WsAckFrame:
      type: object
      description: >
        Server answer to a successful `cmd` or `register-endpoint`
        frame, echoing its `id`. Command acks carry the updated
        session snapshot when the server has one; for commands routed
        to a playing client (mirror sessions) the snapshot may lag or
        be absent, because the client's own report is what updates the
        mirror; controllers render those from the following `session`
        frame. Registration acks carry the endpoint id.
      required: [type, id]
      properties:
        type:
          type: string
          description: Always `ack`.
          example: ack
        id:
          type: string
          description: The answered frame's correlation id.
        endpointId:
          type: string
          description: On registration acks, the endpoint's id.
          example: pe-01JZX5N8QW3F4V9T2B7KD3M9R6
        session:
          $ref: "#/components/schemas/PlaybackSession"

    WsErrorFrame:
      type: object
      description: >
        Server answer to a failed client frame, echoing its `id` when
        one was readable. `code` draws from the API error vocabulary.
        A `cmd` refused by the endpoint driving the session carries
        that endpoint's own code out to whoever sent the command;
        codes outside the documented vocabulary arrive as
        `invalid-request` with the refusal's own message.
      required: [type, code, message]
      properties:
        type:
          type: string
          description: Always `error`.
          example: error
        id:
          type: string
          description: The failed frame's correlation id, when known.
        code:
          type: string
          description: Machine-readable error code.
          example: endpoint-offline
        message:
          type: string
          description: Human-readable detail.
        params:
          type: object
          additionalProperties:
            type: string
          description: >
            Machine-readable detail keyed per code, the same shape and
            rules as the REST `Error` schema's `params`: a refusal a
            client can hit over either transport says the same thing on
            both.
          example:
            feature: multi-part-audiobook
            pid: bk-01JZX5N8QW3F4V9T2B7KD3M9R6

    WsRegisterEndpointFrame:
      type: object
      description: >
        Client-to-server: declare this connection a controllable
        player endpoint. Answered with an ack carrying `endpointId`.
        The endpoint lives while the connection does.
      required: [type, id]
      properties:
        type:
          type: string
          description: Always `register-endpoint`.
          example: register-endpoint
        id:
          type: string
          maxLength: 64
          description: Correlation id for the ack.
        name:
          type: string
          maxLength: 128
          description: >
            Display name. Defaults to the device session's label.
        volumeControl:
          type: boolean
          description: Whether this client can apply `set-volume`.
        rateControl:
          type: boolean
          description: Whether this client can apply `set-rate`.

    WsEndpointCommandFrame:
      type: object
      description: >
        Server-to-client command routed to a registered client
        endpoint. Verbs are the command verbs plus `load` (adopt this
        queue at this index and position; the client resolves
        play-info itself). The client executes against its local
        engine and answers exactly once with a `cmd-result`, then
        reports state.
      required: [type, id, sessionId, verb]
      properties:
        type:
          type: string
          description: Always `endpoint-cmd`.
          example: endpoint-cmd
        id:
          type: string
          description: Server-chosen correlation id for the result.
        sessionId:
          type: string
          description: The session this command belongs to.
        verb:
          type: string
          description: The command verb.
          example: load
        itemPids:
          type: array
          description: For `load` and `set-queue`.
          items:
            type: string
        index:
          type: integer
          description: For `load` and `set-queue`.
        positionMs:
          type: integer
          format: int64
          description: For `load`, `seek`, and optionally `set-queue`.
        play:
          type: boolean
          description: For `load`, whether to start playing.
        volume:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: For `set-volume`.
        rate:
          type: number
          format: double
          minimum: 0.25
          maximum: 5
          description: For `set-rate`.
        repeat:
          type: string
          description: For `set-repeat`.
        shuffle:
          type: boolean
          description: For `set-shuffle`.

    WsCommandResultFrame:
      type: object
      description: >
        Client-to-server answer to an `endpoint-cmd`, echoing its
        `id`. Sent exactly once per routed command.
      required: [type, id, ok]
      properties:
        type:
          type: string
          description: Always `cmd-result`.
          example: cmd-result
        id:
          type: string
          description: The routed command's correlation id.
        ok:
          type: boolean
          description: Whether the command was applied.
        code:
          type: string
          description: Machine-readable failure code when `ok` is false.
        message:
          type: string
          description: Human-readable failure detail when `ok` is false.

    WsSessionReportFrame:
      type: object
      description: >
        Client-to-server state report from a playing client: sent on
        every state change (play, pause, seek, track change, queue
        change) and at least every five seconds while playing. The
        steady fields (`playing`, `positionMs`, `index`, `rate`,
        `volume`, `repeat`, `shuffle`) carry current truth on every
        report; a track advance is just a report with the new `index`.
        `itemPids` rides only the reports where the queue itself
        changed, together with a bumped `queueVersion`, plus the
        first report of a connection that is already playing (the one
        that creates or re-creates the mirror session; a creating
        report without `itemPids` is ignored, since a session without
        a queue is unrenderable). The server answers a creating report
        with a `session` frame carrying the assigned id; other reports
        are unacknowledged.
      required: [type, playing, positionMs, index]
      properties:
        type:
          type: string
          description: Always `session-report`.
          example: session-report
        playing:
          type: boolean
          description: Whether local playback is running.
        positionMs:
          type: integer
          format: int64
          description: Position within the current entry.
        index:
          type: integer
          description: Zero-based index of the current entry.
        rate:
          type: number
          format: double
          minimum: 0.25
          maximum: 5
          description: Playback rate.
        volume:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Local volume, 0 to 1, when the client controls one.
        itemPids:
          type: array
          description: >
            The queue in play order, only on reports where it changed
            (and on the creating report).
          maxItems: 500
          items:
            type: string
        queueVersion:
          type: integer
          format: int64
          description: >
            The client's queue generation, bumped when its queue
            changes. An edge signal only: the version the server
            publishes on the session is its own monotone counter.
        repeat:
          type: string
          description: "`off`, `all`, or `one`."
        shuffle:
          type: boolean
          description: Whether shuffle is on.

    WsSessionFrame:
      type: object
      description: >
        Server-to-client session state: pushed to the watcher of a
        session on every change and about once per second while
        playing, and to a reporting client when its session identity
        changes or ends. A frame whose session carries `ended` true is
        terminal for that id.
      required: [type, session]
      properties:
        type:
          type: string
          description: Always `session`.
          example: session
        session:
          $ref: "#/components/schemas/PlaybackSession"

    WsWatchFrame:
      type: object
      description: >
        Client-to-server: follow one session's live state. Watching
        follows session visibility (your own sessions, others' on
        shared endpoints). A new watch replaces the previous one;
        omitting `sessionId` stops watching. A successful watch is not
        acked (the current state arrives immediately as a `session`
        frame); a watch of an unknown or invisible session answers an
        `error` frame with `not-found`, echoing `id` when sent.
      required: [type]
      properties:
        type:
          type: string
          description: Always `watch`.
          example: watch
        id:
          type: string
          maxLength: 64
          description: Optional correlation id, echoed on a failure.
        sessionId:
          type: string
          description: The session to follow.
          example: ps-01JZX5N8QW3F4V9T2B7KD3M9R6

    WsPingFrame:
      type: object
      description: >
        Client-to-server clock probe for NTP-style offset estimation
        (unrelated to WebSocket protocol pings).
      required: [type, t]
      properties:
        type:
          type: string
          description: Always `ping`.
          example: ping
        t:
          type: integer
          format: int64
          description: Opaque client timestamp, echoed back verbatim.

    WsPongFrame:
      type: object
      description: Server answer to a `ping` frame.
      required: [type, t, at]
      properties:
        type:
          type: string
          description: Always `pong`.
          example: pong
        t:
          type: integer
          format: int64
          description: The ping's `t`, echoed verbatim.
        at:
          type: integer
          format: int64
          description: Server clock in Unix milliseconds at handling time.

    HealthSummary:
      type: object
      description: The library's metadata health at the last sweep.
      required: [score, totalItems, evaluatedItems, warmingUp, rules]
      properties:
        score:
          type: number
          format: double
          description: >
            Library completeness score, 0 to 100: the weighted share
            of evaluated items passing every rule that applies to
            them.
        totalItems:
          type: integer
          description: Items in scope for health.
        evaluatedItems:
          type: integer
          description: Items the sweep has covered so far.
        warmingUp:
          type: boolean
          description: >
            True until the sweep first covers the library; the score
            is provisional while true.
        sweptAt:
          type: string
          format: date-time
          description: When the last sweep finished.
        rules:
          type: array
          description: Per-rule failure counts, heaviest first.
          items:
            $ref: "#/components/schemas/HealthRuleCount"

    HealthRuleCount:
      type: object
      description: One rule's current standing.
      required: [rule, failing, fixable]
      properties:
        rule:
          type: string
          description: The rule name.
          example: missing-art
        label:
          type: string
          description: Human-readable rule label.
        failing:
          type: integer
          description: Items currently failing the rule.
        fixable:
          type: boolean
          description: Whether the bulk-fix endpoint automates this rule.

    HealthIssuePage:
      type: object
      description: One page of items with outstanding issues.
      required: [items]
      properties:
        items:
          type: array
          description: Items, worst first.
          items:
            $ref: "#/components/schemas/HealthIssue"
        nextCursor:
          type: string
          description: Cursor for the next page; omitted on the last.

    HealthIssue:
      type: object
      description: One item and the rules it fails.
      required: [pid, title, mediaType, rules]
      properties:
        pid:
          type: string
          description: The item.
        title:
          type: string
          description: Its title.
        artist:
          type: string
          description: Its artist or author.
        mediaType:
          $ref: "#/components/schemas/MediaType"
        rules:
          type: array
          description: The rules the item currently fails.
          items:
            type: string

    HealthFixRequest:
      type: object
      description: A bulk fix for one rule.
      required: [rule]
      properties:
        rule:
          type: string
          description: The rule to fix.
          example: missing-art
        itemPids:
          type: array
          maxItems: 1000
          description: >
            Restrict to these items; absent fixes everything
            currently failing the rule.
          items:
            type: string

    HealthFixResult:
      type: object
      description: How much fix work was queued.
      required: [queued]
      properties:
        queued:
          type: integer
          description: Items queued for fixing.

    DuplicateGroups:
      type: object
      description: Duplicate entity groups from the audit.
      required: [groups]
      properties:
        groups:
          type: array
          description: Groups, bounded to the first two hundred.
          items:
            $ref: "#/components/schemas/DuplicateGroup"

    DuplicateGroup:
      type: object
      description: One duplicate finding.
      required: [entityType, survivor, losers]
      properties:
        entityType:
          type: string
          description: "`artist`, `album`, `release-group`, or `genre`."
        survivor:
          $ref: "#/components/schemas/DuplicateEntity"
        losers:
          type: array
          minItems: 1
          description: The suggested merge losers.
          items:
            $ref: "#/components/schemas/DuplicateEntity"
        detail:
          type: string
          description: The audit's explanation of the finding.

    DuplicateEntity:
      type: object
      description: One entity in a duplicate group.
      required: [pid, name]
      properties:
        pid:
          type: string
          description: The entity.
        name:
          type: string
          description: Its display name.
        itemCount:
          type: integer
          description: Items under the entity, when cheaply known.

    MergeRequest:
      type: object
      description: A duplicate entity merge.
      required: [entityType, survivorPid, loserPids]
      properties:
        entityType:
          type: string
          enum: [album, artist, release-group, genre]
          description: What is being merged.
        survivorPid:
          type: string
          description: The entity that keeps its pid.
        loserPids:
          type: array
          minItems: 1
          maxItems: 100
          description: The entities merged into the survivor.
          items:
            type: string

    MergeResult:
      type: object
      description: The merge outcome.
      required: [merged, childrenMoved]
      properties:
        merged:
          type: integer
          description: Losers merged.
        childrenMoved:
          type: integer
          description: Children re-parented onto the survivor.

    UpgradeGroups:
      type: object
      description: Same-recording different-encoding groups.
      required: [groups]
      properties:
        groups:
          type: array
          description: Groups, best quality first within each.
          items:
            $ref: "#/components/schemas/UpgradeGroup"

    UpgradeGroup:
      type: object
      description: One recording's encodings.
      required: [members]
      properties:
        members:
          type: array
          minItems: 2
          description: The encodings, best first.
          items:
            $ref: "#/components/schemas/UpgradeMember"

    UpgradeMember:
      type: object
      description: One encoding of a recording.
      required: [itemPid, title, codec, best, lossless]
      properties:
        itemPid:
          type: string
          description: The item.
        title:
          type: string
          description: Its title.
        artist:
          type: string
          description: Its artist.
        codec:
          type: string
          description: Audio codec.
        bitrate:
          type: integer
          description: Bitrate in bits per second, 0 when unknown.
        sampleRate:
          type: integer
          description: Sample rate in Hz, 0 when unknown.
        bitDepth:
          type: integer
          description: Bit depth, 0 when unknown or lossy.
        lossless:
          type: boolean
          description: Whether the encoding is lossless.
        best:
          type: boolean
          description: The group's suggested keeper.

    UpgradeResolveRequest:
      type: object
      description: Keep one encoding, trash the rest.
      required: [keepItemPid, removeItemPids]
      properties:
        keepItemPid:
          type: string
          description: The item to keep.
        removeItemPids:
          type: array
          minItems: 1
          maxItems: 100
          description: The inferior encodings to trash.
          items:
            type: string

    UpgradeResolveResult:
      type: object
      description: The resolution outcome.
      required: [trashed]
      properties:
        trashed:
          type: integer
          description: Items moved to the trash.

    FileDiagnostic:
      type: object
      description: >
        One persisted observation about a library file, keyed for display by
        its path (files are not a first-class API resource, so no file id is
        surfaced).
      required: [path, origin, code, severity, seenAt]
      properties:
        path:
          type: string
          description: The file's display path.
        origin:
          type: string
          description: >
            The writer that recorded it (`scan`, `organize`, `replaygain`,
            `edit`, or `enrichment`); new writers may appear.
        code:
          type: string
          description: >
            What was observed (`unsupported_format`, `legacy_only_tags`,
            `lyrics_partial`, `sidecar_skipped`, `cue_track_dropped`,
            `tag_write_lost`, `tag_write_unsynced`, or `corrupt_audio`); new
            codes may appear, so treat an unknown value as a generic finding.
        severity:
          type: string
          description: "`info`, `warn`, or `error`."
        tagKey:
          type: string
          description: The tag key a key-specific diagnostic concerns, when any.
        detail:
          type: string
          description: The writer's own note, when it carries one.
        seenAt:
          type: string
          format: date-time
          description: When the diagnostic was last recorded.

    FileDiagnosticPage:
      type: object
      description: One page of per-file diagnostics.
      required: [diagnostics]
      properties:
        diagnostics:
          type: array
          items:
            $ref: "#/components/schemas/FileDiagnostic"
        nextCursor:
          type: string
          description: Cursor for the next page; omitted on the last.

    DiagnosticCount:
      type: object
      description: One grouped bucket of the diagnostic summary.
      required: [origin, code, severity, count]
      properties:
        origin:
          type: string
          description: The writer that recorded the diagnostics in this bucket.
        code:
          type: string
          description: The diagnostic code this bucket counts.
        severity:
          type: string
          description: "`info`, `warn`, or `error`."
        count:
          type: integer
          description: How many diagnostics fell in this bucket.

    DiagnosticSummary:
      type: object
      description: Diagnostic counts grouped by writer, code, and severity.
      required: [counts]
      properties:
        counts:
          type: array
          description: Buckets, most severe first.
          items:
            $ref: "#/components/schemas/DiagnosticCount"

    DiscoveryList:
      type: string
      description: >
        Discovery lists for browsing. `most-played`, `recently-played`,
        `starred`, `never-played`, and `rediscover` reflect the calling
        user's own listening state.

        `never-played` is what the caller has never counted a play of, and
        `rediscover` is what they starred or rated at least 80 and have not
        played in six months (never counts as six months, so something
        starred and never reached belongs there). "Played" on both is the
        same threshold `playCount` counts, so an item abandoned early
        enough to have never crossed it is still sealed.

        Both come back A to Z, since neither is ordered by anything a
        listener would recognize: there is no play stamp to sort a
        never-played item by, and sorting the other by how stale it is
        would put the most forgotten thing first every time the shelf is
        drawn. The other seven keep the orders their names describe.
      enum:
        - newest
        - recently-added
        - most-played
        - recently-played
        - random
        - starred
        - alphabetical
        - never-played
        - rediscover

    BrowseDimension:
      type: string
      description: >
        A browse dimension: one of `genre`, `artist`, `credit-artist`,
        `album-artist`, `album`, `release-group`, `year`, `kind`, or a
        custom tag dimension spelled `tag.<KEY>` (for example
        `tag.MOOD`).
        `release-group` buckets tracks by their album's release group,
        which is the work rather than the edition, so the several
        pressings of one record answer as one bucket.
        `credit-artist` buckets a track under every artist its credit
        names, where `artist` buckets it once under the primary: a
        featured artist has a bucket here and none there. It is what an
        artist's "appears on" reads, and it is many-per-item, so its
        counts sum above the item count. The fixed set is stable;
        which tag dimensions exist depends on the library's tags. Tag
        keys are case-insensitive and canonicalize to upper case, so
        `tag.mood` and `tag.MOOD` are one dimension; responses echo the
        canonical spelling.
      example: genre

    FacetSort:
      type: string
      description: >
        How a browse dimension's buckets are ordered. `count` leads with
        the biggest buckets, which is what a hub wants; `label` is the
        A-to-Z order an index with an alphabet rail scrolls through.
      enum:
        - count
        - label
      default: count
      example: label

    FacetBucket:
      type: object
      description: One bucket of a browse dimension.
      required: [key, label, count]
      properties:
        key:
          type: string
          description: >
            The bucket's stable handle: pass it back as `listItems`'
            `facetKey` to drill it. Empty for the unknown bucket.
          example: 01JZX5N8QW3F4V9T2B7KD3M9R6
        label:
          type: string
          description: >
            Display label. Genre labels are the canonical spelling from
            the server's genre tree, not whichever variant was scanned
            first.
          example: Hip Hop
        count:
          type: integer
          description: Items in this bucket, within the caller's libraries.
        entityPid:
          type: string
          description: >
            The catalog entity behind the bucket, for the dimensions that
            have one (`artist`, `credit-artist`, `album-artist`,
            `album`, `release-group`). Absent for the unknown bucket and
            for dimensions that are not entities.

            It is this bucket's `key` carried with the entity's API type
            prefix, so a client holding one has the other: a screen
            addressed by `al-<ulid>` drills with `facetKey=<ulid>`, and
            the entity endpoints (`/albums/{pid}/play-state` and
            friends) take the prefixed form.
          example: al-01JZX5N8QW3F4V9T2B7KD3M9R6
        unknown:
          type: boolean
          description: >
            True for the bucket holding items the dimension is absent
            from. Its `label` is the canonical sentinel and its `key` is
            empty.
        letter:
          type: string
          pattern: "^[A-Z#]$"
          description: >
            The alphabet-rail row this bucket files under, derived from
            the same fold that orders `sort=label`: `A` to `Z` when the
            folded label leads with a Latin letter (accents fold, so
            "Édith" answers `E`), `#` for everything else. The `#` row
            has members on both sides of the alphabet: digits and most
            punctuation sort before A, while `{`, `|`, `}`, `~` and
            every script beyond Latin sort after Z. Present on every
            real bucket under either sort; absent on the unknown
            bucket, which has no rail row. A client talking to an older
            server that omits it derives a letter from `label` itself.
          example: E

    FacetPage:
      type: object
      description: One keyset-paginated page of a browse dimension's buckets.
      required: [dimension, buckets]
      properties:
        dimension:
          $ref: "#/components/schemas/BrowseDimension"
        buckets:
          type: array
          items:
            $ref: "#/components/schemas/FacetBucket"
        nextCursor:
          type: string
          description: Opaque cursor for the next page. Absent on the last page.

    SearchHit:
      type: object
      description: One ranked search hit.
      required: [pid, kind, title]
      properties:
        pid:
          type: string
          description: Type-prefixed ULID of the hit.
          example: tr-01JZX5N8QW3F4V9T2B7KD3M9R6
        kind:
          type: string
          description: What the hit is (`artist`, `album`, `track`, `book`, `episode`).
          example: track
        title:
          type: string
          description: Display title.
        subtitle:
          type: string
          description: Context line (artist for a track, author for a book).

    SearchResults:
      type: object
      description: Search results grouped by kind, ranked within each group.
      required: [query, artists, albums, tracks, books, episodes]
      properties:
        query:
          type: string
          description: The query these results answer.
        artists:
          type: array
          items:
            $ref: "#/components/schemas/SearchHit"
        albums:
          type: array
          items:
            $ref: "#/components/schemas/SearchHit"
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/SearchHit"
        books:
          type: array
          items:
            $ref: "#/components/schemas/SearchHit"
        episodes:
          type: array
          items:
            $ref: "#/components/schemas/SearchHit"
        truncated:
          type: boolean
          description: True when any group was capped at the limit.

    EntityCardQuery:
      type: object
      description: The entity PIDs to resolve.
      required: [pids]
      properties:
        pids:
          type: array
          description: >
            Type-prefixed entity PIDs, in the order the answers should
            come back in. Duplicates answer once per occurrence.


            The response preserves this order but not these positions:
            a PID that cannot be resolved is omitted, so the two lists
            line up only when everything resolved. Match a card to its
            handle by `pid`, never by index.
          items:
            type: string
            pattern: "^(al|ar|rg|pl|pc|bk)-[0-9A-HJKMNP-TV-Z]{26}$"
          maxItems: 64
          example: [al-01JZX5N8QW3F4V9T2B7KD3M9R6]

    EntityCard:
      type: object
      description: >
        Display facts for one entity: what a card draws. Artwork is not
        a field - `/items/{pid}/art` takes every prefix this endpoint
        answers for except `rg-`, which statically has none, so a client
        builds the URL from the pid rather than being handed it.
      required: [pid, kind, title]
      properties:
        pid:
          type: string
          description: The type-prefixed PID this card answers for.
          example: al-01JZX5N8QW3F4V9T2B7KD3M9R6
        kind:
          type: string
          enum: [album, artist, release-group, playlist, podcast, book]
          description: What the card is about, which is what a tap opens.
        title:
          type: string
          description: Display title - the album, artist, show, or book name.
        artist:
          type: string
          description: >
            The context line: an album's or book's artist, a show's
            author. Absent for an artist (whose title is the name) and
            wherever the catalog has none.
        year:
          type: integer
          description: Release year, where the entity carries one.
        itemCount:
          type: integer
          description: >
            Member items: an album's tracks, a playlist's entries, a
            show's episodes, an artist's tracks.


            Absent in two cases, and both are deliberate. A smart
            playlist's count is not taken, because evaluating every
            stored rule to draw a card is work a listing row skips too.
            And a catalog entity's count is catalog-wide rather than
            scoped to what the caller may see, so it is answered only to
            a caller who can see the whole library - a card advertising
            nine tracks that opens onto three would be worse than a card
            with no count on it.

    EntityCardList:
      type: object
      description: >
        Cards for the requested PIDs, in request order, minus the ones
        that could not be resolved.
      required: [entities]
      properties:
        entities:
          type: array
          items:
            $ref: "#/components/schemas/EntityCard"
        departed:
          type: array
          description: >
            The requested PIDs that no longer name anything on this
            server, for anyone: deleted, merged away, or never real. In
            request order, a repeated PID once, and absent rather than
            empty when every miss was merely out of the caller's sight
            (a grant, a lapsed subscription, the trash) - those stay
            unnamed, because they can come back. This is the set a
            client holding `Prefs.pinned` prunes.
          items:
            type: string
            pattern: "^(al|ar|rg|pl|pc|bk)-[0-9A-HJKMNP-TV-Z]{26}$"
          maxItems: 64

    AlbumDetail:
      type: object
      description: One album entity's identity and counts.
      required: [pid, title]
      properties:
        pid:
          type: string
          description: Type-prefixed album PID.
          example: al-01JZX5N8QW3F4V9T2B7KD3M9R6
        title:
          type: string
          description: The release title.
        sortKey:
          type: string
          description: The collation key the catalog files this album under.
        mbid:
          type: string
          description: MusicBrainz release ID, when the release is identified.
        year:
          type: integer
          description: Release year.
        releaseGroupPid:
          type: string
          description: >
            The release group this edition belongs to, when the catalog
            resolved one.
          example: rg-01JZX5N8QW3F4V9T2B7KD3M9R6
        barcode:
          type: string
          description: The release's barcode (UPC/EAN).
        label:
          type: string
          description: The issuing label.
        catalogNumber:
          type: string
          description: The label's catalog number for this release.
        media:
          type: string
          description: >
            What the release was pressed on, as tagged - "CD", "2xVinyl",
            "Digital Media". Stored as written: a scan keeps the tag
            verbatim, so this is a description rather than an enum.
          example: 2xVinyl
        country:
          type: string
          description: >
            Release country, as tagged. A scan stores the tag verbatim,
            so this can hold a value an edit would refuse ("US & Europe")
            as well as a plain ISO code.
          example: US
        itemCount:
          type: integer
          description: >
            Tracks on the release as the catalog holds it. Absent for a
            caller with restricted library visibility, because the count
            is not scoped to their grant and a number larger than what
            they can open would be worse than none.
        totalDurationMs:
          type: integer
          format: int64
          description: >
            Total running time of those tracks, in milliseconds. Absent
            alongside `itemCount`, and for its reason.
        artSource:
          $ref: "#/components/schemas/ArtSource"

    Item:
      allOf:
        - $ref: "#/components/schemas/ItemSummary"
        - type: object
          description: Extended detail fields beyond the summary row.
          properties:
            genres:
              type: array
              description: Display genres.
              items:
                type: string
                example: blues
            year:
              type: integer
              description: Release / publication year.
              example: 2024
            codec:
              type: string
              description: Source audio codec.
              example: flac
            container:
              type: string
              description: Source file container.
              example: flac
            sampleRate:
              type: integer
              description: Source sample rate in Hz.
              example: 44100
            bitrate:
              type: integer
              description: Source bitrate in bits per second, when known.
            addedAt:
              type: string
              format: date-time
              description: When the item entered the library.
            artSource:
              $ref: "#/components/schemas/ArtSource"
      description: Full detail for a single library item.

    ItemPage:
      type: object
      description: One keyset-paginated page of items.
      required: [items]
      properties:
        items:
          type: array
          description: Items in stable order.
          items:
            $ref: "#/components/schemas/ItemSummary"
        nextCursor:
          type: string
          description: >
            Opaque cursor for the next page. Absent on the last page.
        seed:
          type: integer
          format: int64
          description: >
            The effective shuffle seed. Present only on `random` browse
            pages; pass it back together with `nextCursor` so later pages
            keep the same order.

    DeleteItemsRequest:
      type: object
      description: A deletion (or a dry-run plan) over library items.
      required: [pids]
      properties:
        pids:
          type: array
          minItems: 1
          maxItems: 500
          description: The items whose files to delete.
          items:
            type: string
        mode:
          type: string
          enum: [trash, permanent]
          default: trash
          description: >
            `trash` is reversible from the trash surface;
            `permanent` bypasses it (administrators only).
        dryRun:
          type: boolean
          default: false
          description: Answer the plan without deleting.

    DeleteItemsResult:
      type: object
      description: What a deletion did, or would do.
      required: [applied, mode, entries]
      properties:
        applied:
          type: boolean
          description: False for a dry run.
        mode:
          type: string
          description: The mode that was (or would be) used.
        entries:
          type: array
          description: Per-item breakdown.
          items:
            $ref: "#/components/schemas/DeletePlanEntry"

    DeletePlanEntry:
      type: object
      description: One item's part of a deletion.
      required: [pid, files, bytes]
      properties:
        pid:
          type: string
          description: The item.
        name:
          type: string
          description: Display name.
        files:
          type: integer
          description: Files deleted (or to delete).
        bytes:
          type: integer
          format: int64
          description: Bytes reclaimed (or to reclaim).

    ArtRoleInfo:
      type: object
      description: >
        One artwork slot an entity holds at its own level, with where its
        image came from and whether it is pinned.


        A slot that reports `locked: true` and no `format` is a lock with
        nothing behind it: the cover was cleared and pinned cleared, which
        means "do not refill this" rather than "this has no cover yet". It
        is the one artwork state that was previously invisible, and it is
        why an entity can list a role at all while holding no image. Only
        `front` can be locked; the auxiliary slots have no producer to
        guard against, so they always report false.
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/ArtRole"
        format:
          type: string
          description: >
            The stored image format (`jpeg`, `png`, `webp`, `gif`).
            Absent when the slot holds no image, which happens only on a
            locked-and-cleared `front`.
        width:
          type: integer
          description: Pixel width, 0 when the image was not decodable.
        height:
          type: integer
          description: Pixel height, 0 when the image was not decodable.
        source:
          type: string
          description: >
            Where this slot's image came from, in `ArtSource`'s
            vocabulary (`tag`, `sidecar`, `user`, `enrichment`, `feed`).
            A string, not a closed enum.
          example: tag
        provider:
          type: string
          description: The provider that supplied an `enrichment` cover.
        sourceUrl:
          type: string
          description: Where a fetched cover's bytes came from.
        updatedAt:
          type: string
          format: date-time
          description: When this slot was last written.
        locked:
          type: boolean
          description: >
            Whether the entity's front cover is pinned against enrichment
            and scan re-derives. False on every non-front role.

    ArtRoles:
      type: object
      description: >
        The artwork slots an entity holds at its own level, and the
        provenance of the cover a front-cover read would actually answer
        with.
      required: [roles]
      properties:
        roles:
          type: array
          items:
            $ref: "#/components/schemas/ArtRoleInfo"
        artSource:
          $ref: "#/components/schemas/ArtSource"

    Lyrics:
      type: object
      description: >
        Lyrics for one item. At least one of `synced` and `unsynced` is
        non-empty.
      required: [pid, source]
      properties:
        pid:
          type: string
          description: The item these lyrics belong to.
        source:
          type: string
          description: >
            Where the lyrics came from: `tag` (an embedded USLT/SYLT
            frame), `sidecar` (an `.lrc` beside the audio), `user`, or
            `enrichment`. The same vocabulary artwork reports; it
            replaces the older `lrc`/`embedded` pair, which named
            formats rather than producers.
          example: sidecar
        provider:
          type: string
          description: >
            The lyrics provider that supplied an `enrichment` copy.
            Empty for every other source.
        synced:
          type: array
          description: Time-synced lines, ordered by `timeMs`.
          items:
            $ref: "#/components/schemas/SyncedLine"
        unsynced:
          type: string
          description: Plain text block when no synced lines exist.

    SyncedLine:
      type: object
      description: One time-synced lyric line.
      required: [timeMs, text]
      properties:
        timeMs:
          type: integer
          format: int64
          description: Line start in milliseconds.
        text:
          type: string
          description: Line text.

    MetadataFields:
      type: object
      description: The editor's field vocabulary.
      required: [kinds, entityTypes]
      properties:
        kinds:
          type: array
          description: Editable fields per item kind.
          items:
            $ref: "#/components/schemas/KindFields"
        entityTypes:
          type: array
          description: Editable fields per entity type.
          items:
            $ref: "#/components/schemas/EntityTypeFields"

    KindFields:
      type: object
      description: One item kind's editable vocabulary.
      required: [kind, fields, creditRoles]
      properties:
        kind:
          $ref: "#/components/schemas/MediaType"
        fields:
          type: array
          description: Editable scalar fields.
          items:
            $ref: "#/components/schemas/EditableField"
        creditRoles:
          type: array
          description: >
            Credit roles for the kind; roles marked database-only
            have no round-trippable tag form.
          items:
            $ref: "#/components/schemas/EditableField"

    EditableField:
      type: object
      description: One editable field or role.
      required: [name, writeBack]
      properties:
        name:
          type: string
          description: The field or role name the edit APIs accept.
          example: title
        writeBack:
          type: boolean
          description: >
            Whether the value can write into file tags; false means
            database-only by upstream design.

    EntityTypeFields:
      type: object
      description: One entity type's editable vocabulary.
      required: [entityType, fields]
      properties:
        entityType:
          type: string
          description: "`album`, `artist`, or `release-group`."
        fields:
          type: array
          description: Editable entity fields.
          items:
            $ref: "#/components/schemas/EditableField"

    ItemMetadata:
      type: object
      description: Everything the editor shows for one item.
      required: [pid, mediaType, fields, lockedFields, provenance, credits, customTags, unofficial, virtualTrack, hasArtwork, hasOwnArtwork, writeBackIssues]
      properties:
        pid:
          type: string
          description: The item.
        mediaType:
          $ref: "#/components/schemas/MediaType"
        fields:
          type: object
          additionalProperties:
            type: string
          description: >
            The item's scalar fields by name (the kind's vocabulary
            from the fields endpoint); empty values are omitted.
        lockedFields:
          type: array
          description: >
            Currently locked fields, including namespaced artifacts
            (`lyrics`, `art`, `credit.ROLE`, `tag.KEY`).
          items:
            type: string
        provenance:
          type: array
          description: Per-field provenance for curated fields.
          items:
            $ref: "#/components/schemas/FieldProvenance"
        credits:
          type: array
          description: Credits by role.
          items:
            $ref: "#/components/schemas/Credit"
        lyrics:
          $ref: "#/components/schemas/LyricsState"
        chapters:
          type: array
          description: Chapter marks (books).
          items:
            $ref: "#/components/schemas/ChapterMark"
        customTags:
          type: array
          description: Custom tags.
          items:
            $ref: "#/components/schemas/CustomTag"
        unofficial:
          type: boolean
          description: Whether the item is marked as having no canonical release.
        virtualTrack:
          type: boolean
          description: >
            True for tracks carved from a shared file (CUE rips):
            their edits are always database-only and they export no
            fingerprint, by upstream design.
        hasArtwork:
          type: boolean
          description: >
            Whether the item resolves any front cover, including one
            inherited from its album, release group, or artist.
        hasOwnArtwork:
          type: boolean
          description: >
            Whether the item holds its own front cover, as opposed to
            inheriting one from the entity chain. Lets the editor tell an
            item-level cover from an inherited one.
        albumPid:
          type: string
          description: The item's album entity, when any.
        artistPid:
          type: string
          description: The item's artist entity, when any.
        releaseGroupPid:
          type: string
          description: The item's release group entity, when any.
        writeBackIssues:
          type: array
          description: >
            Files whose on-disk tags are out of step with the catalog
            (failed write-backs, values the format cannot store).
          items:
            $ref: "#/components/schemas/WriteBackIssue"
        mayCurate:
          type: boolean
          description: >
            Whether the caller may run the item-scoped edits this
            document describes: administrators always, everyone else
            exactly for the items their own uploads brought in. The
            read answers anyone who can see the item, so without this
            a client has no way to tell an editor it can save from one
            every save will be refused. Optional for compatibility;
            absent reads as unknown, and a client that treats it as
            false only withholds a door the server would have refused
            anyway.

    FieldProvenance:
      type: object
      description: >
        Who set one field's current value.


        The list carries two kinds of row. A scalar row names a metadata
        field (`title`, `genre`, ...) and reports the value a curator
        set. An artifact row names `art` or `lyrics`, with an empty
        `value` because the value is bytes rather than text. A non-empty
        provenance list therefore does not mean the item was curated: an
        untouched track with a cover in its tags reports one `art` row
        sourced `tag`. Count the scalar rows, not the list, when
        summarizing what a person changed.


        An artifact row does not imply the artifact. Locking `art` or
        `lyrics` to stop a scan filling it leaves a row with nothing
        behind it, and the `source` on such a row is invented by
        whichever writer took the lock rather than describing anything.
        Read `hasOwnArtwork` and `lyrics` on the enclosing
        `ItemMetadata` before presenting an artifact row's source as
        where something came from; on a lock-only row, `locked` is the
        only field worth reading.
      required: [field, source, locked]
      properties:
        field:
          type: string
          description: >
            The field, possibly namespaced, or `art` / `lyrics` for an
            artifact row.
        source:
          type: string
          description: >
            The producer: `tag` (the file's own tags), `sidecar` (a
            companion file beside the audio - a `cover.jpg`, an `.lrc`),
            `user` (set through the curation surface), `enrichment`
            (supplied by a metadata provider, named in `provider`),
            `organize` (written by an organize tag write-back), or `feed`
            (a podcast feed). A string, not a closed enum. `sidecar` and
            `feed` reach only artifact rows; a scalar field is never
            produced from a cover image or a feed.
        provider:
          type: string
          description: The enrichment provider, for enriched fields.
        sourceUrl:
          type: string
          description: >
            Where a fetched value's bytes came from, on the rows that
            have one (an enrichment or feed cover). Empty otherwise.
        locked:
          type: boolean
          description: Whether the field is locked.
        updatedAt:
          type: string
          format: date-time
          description: When the value last changed.

    ArtworkLock:
      type: object
      description: >
        Whether an entity's front cover is pinned against enrichment and
        scan re-derives.
      required: [locked]
      properties:
        locked:
          type: boolean
          description: True when the cover is pinned.

    Credit:
      type: object
      description: One credit role with its people.
      required: [role, names]
      properties:
        role:
          type: string
          description: The role name.
          example: producer
        names:
          type: array
          description: The credited people, in stored order.
          items:
            type: string

    LyricsState:
      type: object
      description: The stored lyrics, when any.
      required: [synced, source]
      properties:
        synced:
          type: boolean
          description: Whether timed lines are stored.
        source:
          type: string
          description: >
            Where the stored copy came from: `tag` (an embedded
            USLT/SYLT frame), `sidecar` (an `.lrc` beside the audio),
            `user`, or `enrichment`. A string, not a closed enum.


            This is the same vocabulary artwork reports, so one mark
            serves both. It replaces the older `lrc`/`embedded` pair,
            which named the two file formats rather than the producer
            and had nowhere to put a fetched copy; `lrc` is now
            `sidecar` and `embedded` is now `tag`.
        provider:
          type: string
          description: >
            The lyrics provider that supplied an `enrichment` copy.
            Empty for every other source.
        lrc:
          type: string
          description: >
            The lyrics serialized as LRC text (timed lines when
            synced, bare lines otherwise), the editor's working
            format.

    CustomTag:
      type: object
      description: One custom tag.
      required: [key, values]
      properties:
        key:
          type: string
          description: Canonical uppercase key.
          example: MOOD
        values:
          type: array
          description: Ordered values.
          items:
            type: string

    WriteBackIssue:
      type: object
      description: One file out of step with the catalog.
      required: [filePid, code]
      properties:
        filePid:
          type: string
          description: The backing file.
        code:
          type: string
          description: >
            The diagnostic: `tag-write-unsynced` (a write-back was
            refused or failed; the file's tags lag the catalog) or
            `tag-write-lost` (the write ran but the format could not
            store the value). A string, not a closed enum.
        tagKey:
          type: string
          description: The affected tag key, when known.
        detail:
          type: string
          description: >
            Human-readable detail, administrators only. It is the tag
            writer's own error, which names the file's absolute path, so
            it is withheld from everyone else exactly as the diagnostics
            listing is; `code`, `tagKey`, and `filePid` say what went
            wrong without saying where the library lives. Absent rather
            than redacted for a non-administrator.

    MetadataEdit:
      type: object
      description: Scalar field edits for one item.
      required: [fields]
      properties:
        fields:
          type: object
          minProperties: 1
          additionalProperties:
            type: string
          description: >
            Field name to new value; an empty string clears the
            field. Names come from the kind's vocabulary.
        writeBack:
          type: boolean
          default: false
          description: Also write the new values into the file's tags.
        lock:
          type: boolean
          default: true
          description: Lock the edited fields.
        force:
          type: boolean
          default: false
          description: Override existing locks on the edited fields.

    WriteBackFailure:
      type: object
      description: One file a write-back could not update.
      required: [filePid, reason]
      properties:
        filePid:
          type: string
          description: The file.
        path:
          type: string
          description: Its display path.
        reason:
          type: string
          description: Why the write failed or was refused.

    MetadataEditResult:
      type: object
      description: >
        The outcome of a metadata mutation. The catalog write
        succeeded whenever this shape returns; write-back trouble
        and drop warnings ride along instead of failing the edit.
      required: [applied]
      properties:
        applied:
          type: boolean
          description: Always true; the catalog committed.
        writeBackFailures:
          type: array
          description: Files whose tags could not be updated.
          items:
            $ref: "#/components/schemas/WriteBackFailure"
        warnings:
          type: array
          description: >
            Non-fatal notes: typed drop warnings from the tag
            library (a format refusing embedded synced lyrics, a
            chapter cap), roles without a tag form, malformed LRC
            lines skipped.
          items:
            type: string

    BulkEdit:
      type: object
      description: The same scalar edits applied to many items.
      required: [itemPids, fields]
      properties:
        itemPids:
          type: array
          minItems: 1
          maxItems: 1000
          description: The items to edit.
          items:
            type: string
        fields:
          type: object
          minProperties: 1
          additionalProperties:
            type: string
          description: Field name to new value, applied to every item.
        writeBack:
          type: boolean
          default: false
          description: Also write into the files' tags.
        skipLocked:
          type: boolean
          default: false
          description: >
            Skip items whose target fields are locked instead of
            failing the batch.
        force:
          type: boolean
          default: false
          description: Override locks (mutually exclusive with `skipLocked`).

    BulkEditResult:
      type: object
      description: Per-item outcomes of a bulk edit.
      required: [edited, skipped]
      properties:
        edited:
          type: array
          description: Items whose catalog rows updated.
          items:
            type: string
        skipped:
          type: array
          description: Items skipped for locks.
          items:
            type: string
        writeBackFailures:
          type: array
          description: Files whose tags could not be updated.
          items:
            $ref: "#/components/schemas/WriteBackFailure"

    CreditsEdit:
      type: object
      description: Replacement people for one credit role.
      required: [role, names]
      properties:
        role:
          type: string
          description: The role, from the kind's role vocabulary.
          example: producer
        names:
          type: array
          maxItems: 100
          description: The people; empty clears the role.
          items:
            type: string
        writeBack:
          type: boolean
          default: false
          description: Write the role's tag keys where a form exists.
        lock:
          type: boolean
          default: true
          description: Lock `credit.ROLE`.
        force:
          type: boolean
          default: false
          description: Override an existing lock.

    LyricsEdit:
      type: object
      description: >
        Replacement lyrics. At least one of `lrc` and `plain` must
        carry content.
      properties:
        lrc:
          type: string
          maxLength: 200000
          description: >
            Timed lines as LRC text. Malformed lines are skipped and
            reported as warnings with their line numbers.
        plain:
          type: string
          maxLength: 200000
          description: A plain unsynchronized block.
        writeBack:
          type: boolean
          default: false
          description: >
            Write the `.lrc` sidecar next to the file and embed
            where the format allows.
        lock:
          type: boolean
          default: true
          description: Lock the lyrics artifact.
        force:
          type: boolean
          default: false
          description: Override an existing lock.

    ChaptersEdit:
      type: object
      description: A replacement chapter list.
      required: [chapters]
      properties:
        chapters:
          type: array
          maxItems: 2000
          description: >
            Ordered, non-overlapping chapters on the book timeline;
            empty restores the embedded chapters.
          items:
            $ref: "#/components/schemas/ChapterMark"
        lock:
          type: boolean
          default: true
          description: Lock the chapters artifact.
        force:
          type: boolean
          default: false
          description: Override an existing lock.

    TagEdit:
      type: object
      description: Replacement values for one custom tag.
      required: [values]
      properties:
        values:
          type: array
          maxItems: 100
          description: Ordered values; empty clears the tag.
          items:
            type: string
        lock:
          type: boolean
          default: true
          description: Lock `tag.KEY`.
        force:
          type: boolean
          default: false
          description: Override an existing lock.

    TagEditResult:
      type: object
      description: The outcome of a tag edit.
      required: [key, stored]
      properties:
        key:
          type: string
          description: The canonical uppercase key actually used.
        stored:
          type: integer
          description: Values stored after deduplication.

    LocksEdit:
      type: object
      description: A lock or unlock for named fields.
      required: [fields, locked]
      properties:
        fields:
          type: array
          minItems: 1
          maxItems: 100
          description: The fields, possibly namespaced.
          items:
            type: string
        locked:
          type: boolean
          description: True locks, false unlocks.

    LocksResult:
      type: object
      description: The item's locks after the change.
      required: [lockedFields]
      properties:
        lockedFields:
          type: array
          description: Every currently locked field.
          items:
            type: string

    EntityEdit:
      type: object
      description: Entity field edits.
      required: [edits]
      properties:
        edits:
          type: object
          minProperties: 1
          additionalProperties:
            type: string
          description: >
            Field name to new value, from the entity type's
            vocabulary; empty clears.
        writeBack:
          type: boolean
          default: false
          description: Push tag-formed values into member files.
        lock:
          type: boolean
          default: true
          description: Lock the edited entity fields.
        force:
          type: boolean
          default: false
          description: Override existing locks.

    EntityCuration:
      type: object
      description: An entity's curated fields.
      required: [curated]
      properties:
        curated:
          type: array
          description: Curated fields with provenance.
          items:
            $ref: "#/components/schemas/EntityCuratedField"

    EntityCuratedField:
      type: object
      description: One curated entity field.
      required: [field, source, locked]
      properties:
        field:
          type: string
          description: The field.
        value:
          type: string
          description: The curated value.
        source:
          type: string
          description: The producer, as in item provenance.
        locked:
          type: boolean
          description: Whether the field is locked.
        updatedAt:
          type: string
          format: date-time
          description: When the value last changed.

    ReleaseStatusEdit:
      type: object
      description: The unofficial mark.
      required: [unofficial]
      properties:
        unofficial:
          type: boolean
          description: >
            True marks the item as having no canonical release;
            false clears the mark.

    RematchResult:
      type: object
      description: The review entry a rematch opened.
      required: [reviewEntryId]
      properties:
        reviewEntryId:
          type: string
          description: The pending entry; candidates fill in asynchronously.

    EnrichItemRequest:
      type: object
      description: What to fetch for one item.
      required: [want]
      properties:
        want:
          type: array
          minItems: 1
          description: The artifacts to fetch.
          items:
            type: string
            enum: [cover, lyrics, genres, book]

    EnrichItemResult:
      type: object
      description: What a one-item enrichment fetched.
      required: [applied, skipped]
      properties:
        applied:
          type: array
          description: >
            Artifacts fetched and stored, each naming its provider
            (for example `cover: fanarttv`).
          items:
            type: string
        skipped:
          type: array
          description: >
            Artifacts not stored, each naming why (locked, already
            present, no provider hit, provider unconfigured).
          items:
            type: string

    NotificationScope:
      type: string
      enum: [server, user]
      description: >
        Where a notification event or target belongs: `server` is the
        administrator-managed operations scope, `user` a single user's
        personal scope. A shared named schema on purpose: identical
        inline enums make the Dart generator emit one enum class into
        two files, which does not compile.

    NotificationTargetKind:
      type: string
      enum: [pushover, ntfy, gotify, discord, webhook, apprise, unifiedpush]
      description: >
        A notification delivery provider. A shared named schema on
        purpose, like NotificationScope.

    NotificationEvent:
      type: object
      description: One notification event the server can emit.
      required: [name, scope, description]
      properties:
        name:
          type: string
          description: Stable event name.
          example: episode-downloaded
        scope:
          $ref: "#/components/schemas/NotificationScope"
        description:
          type: string
          description: Human-readable event description for the checklist.

    NotificationEventList:
      type: object
      description: The server's notification event catalog.
      required: [events]
      properties:
        events:
          type: array
          description: Every event this server can emit, server scope first.
          items:
            $ref: "#/components/schemas/NotificationEvent"

    NotificationTarget:
      type: object
      description: >
        One notification delivery destination. `config` is a free-form
        object whose fields depend on `kind` (a discriminated union is
        deliberately avoided; validation is server-side and per kind,
        and unknown fields are refused):
        `pushover` takes `token` (application API token), `userKey`,
        and optional integer `priority` (-2 quietest to 2 emergency;
        emergency deliveries use the service's minimum retry cadence);
        `ntfy` takes `topic`, optional `serverUrl` (default
        `https://ntfy.sh`), and optional `accessToken` (sent as a
        Bearer token);
        `gotify` takes `serverUrl` and `token` (sent as a header, so
        it stays out of URLs and logs) and optional integer `priority`
        (0 to 10);
        `discord` takes `webhookUrl`, which must be a discord.com or
        discordapp.com webhook URL;
        `webhook` takes `url` and posts
        `{event, title, body, timestamp}` as JSON with timestamp in
        RFC 3339 UTC;
        `apprise` takes `serverUrl` (the Apprise API server base; its
        notify endpoint is derived unless the URL already names a
        path) and optional `targets` (comma or space separated Apprise
        target URLs; empty relies on the Apprise server's own
        configuration);
        `unifiedpush` takes `endpoint` (the distributor-issued https
        URL, unique per owner).
      required: [pid, kind, scope, config, enabledEvents, createdAt]
      properties:
        pid:
          type: string
          description: Type-prefixed ULID.
          example: nt-01JZX5N8QW3F4V9T2B7KD3M9R6
        kind:
          $ref: "#/components/schemas/NotificationTargetKind"
        scope:
          $ref: "#/components/schemas/NotificationScope"
        label:
          type: string
          description: Display label, usually the service or device name.
        config:
          type: object
          additionalProperties: true
          description: >
            The kind's delivery configuration, returned verbatim to
            the owner (see the schema description for per-kind
            fields). Sealed at rest.
        enabledEvents:
          type: array
          description: >
            Catalog event names this target receives. Empty delivers
            nothing but per-target tests.
          items:
            type: string
        lastSuccessAt:
          type: string
          format: date-time
          description: When a delivery last succeeded; absent before the first.
        lastError:
          type: string
          description: The most recent delivery error; absent when the last delivery succeeded.
        lastErrorAt:
          type: string
          format: date-time
          description: >
            When the most recent delivery error happened; cleared,
            like `lastError`, by a subsequent success.
        createdAt:
          type: string
          format: date-time
          description: When the target was created.

    NotificationTargetCreate:
      type: object
      description: A notification target to create.
      required: [kind, config, enabledEvents]
      properties:
        kind:
          $ref: "#/components/schemas/NotificationTargetKind"
        label:
          type: string
          description: Display label.
          maxLength: 100
        config:
          type: object
          additionalProperties: true
          description: >
            The kind's delivery configuration (see the
            NotificationTarget schema for per-kind fields).
        enabledEvents:
          type: array
          description: >
            Catalog event names to deliver. Scope rules apply:
            server-scope targets take server-scope events; user-scope
            targets take user-scope events, plus server-scope events
            when the owner is an administrator.
          items:
            type: string

    NotificationTargetUpdate:
      type: object
      description: >
        Replaces a target's label, config, and enabled events; the
        kind is fixed at creation.
      required: [config, enabledEvents]
      properties:
        label:
          type: string
          description: Display label.
          maxLength: 100
        config:
          type: object
          additionalProperties: true
          description: The kind's delivery configuration, replaced whole.
        enabledEvents:
          type: array
          description: >
            Catalog event names to deliver, under the same scope rules
            as creation.
          items:
            type: string

    NotificationTargetList:
      type: object
      description: A scope's notification targets.
      required: [targets]
      properties:
        targets:
          type: array
          description: Targets, newest first.
          items:
            $ref: "#/components/schemas/NotificationTarget"

    PushRegistration:
      type: object
      description: >
        One UnifiedPush endpoint registration: a compatibility view
        over a `unifiedpush` notification target.
      required: [pid, endpoint, createdAt]
      properties:
        pid:
          type: string
          description: Type-prefixed ULID (a notification-target pid).
          example: nt-01JZX5N8QW3F4V9T2B7KD3M9R6
        endpoint:
          type: string
          description: The distributor-issued push endpoint URL.
        label:
          type: string
          description: Client-chosen label, usually the device name.
        createdAt:
          type: string
          format: date-time
          description: When the endpoint was registered.

    PushRegistrationCreate:
      type: object
      description: A UnifiedPush endpoint to register.
      required: [endpoint]
      properties:
        endpoint:
          type: string
          description: The distributor-issued https endpoint URL.
        label:
          type: string
          description: Display label, usually the device name.
          maxLength: 100

    PushRegistrationList:
      type: object
      description: The caller's push registrations.
      required: [registrations]
      properties:
        registrations:
          type: array
          description: Registrations, newest first.
          items:
            $ref: "#/components/schemas/PushRegistration"

    OrganizeProfiles:
      type: object
      description: The server's organize profiles.
      required: [profiles]
      properties:
        profiles:
          type: array
          description: Configured profiles.
          items:
            $ref: "#/components/schemas/OrganizeProfile"

    OrganizeProfile:
      type: object
      description: One organize profile.
      required: [name]
      properties:
        name:
          type: string
          description: The profile name organize requests reference.
        musicTemplate:
          type: string
          description: Path template for music, when set.
        audiobookTemplate:
          type: string
          description: Path template for audiobooks, when set.
        podcastTemplate:
          type: string
          description: Path template for podcast files, when set.
        tagWrite:
          type: boolean
          description: Whether organizing also writes tags.

    OrganizeRequest:
      type: object
      description: The scope of an organize pass.
      required: [profile]
      properties:
        profile:
          type: string
          description: The profile to apply.
        itemPids:
          type: array
          maxItems: 1000
          description: Restrict to these items; absent means the whole library.
          items:
            type: string

    OrganizePlan:
      type: object
      description: A dry-run organize plan.
      required: [profile, totalActions, actions]
      properties:
        profile:
          type: string
          description: The profile planned with.
        totalActions:
          type: integer
          description: Moves the pass would make in total.
        actions:
          type: array
          description: The first five hundred actions.
          items:
            $ref: "#/components/schemas/OrganizeAction"
        tagWrite:
          type: boolean
          description: Whether applying would also write tags.

    OrganizeAction:
      type: object
      description: One planned move.
      required: [itemPid, from, to]
      properties:
        itemPid:
          type: string
          description: The item whose file moves.
        from:
          type: string
          description: Current library-relative path.
        to:
          type: string
          description: Planned library-relative path.

    OrganizeReport:
      type: object
      description: The outcome of an applied organize pass.
      required: [moved, skipped, failed]
      properties:
        moved:
          type: integer
          description: Files moved.
        skipped:
          type: integer
          description: Files already in place.
        failed:
          type: integer
          description: Files that could not move.
        failures:
          type: array
          description: The failures, path and reason each.
          items:
            $ref: "#/components/schemas/OrganizeFailure"

    OrganizeFailure:
      type: object
      description: One file organize could not move.
      required: [path, reason]
      properties:
        path:
          type: string
          description: The file.
        reason:
          type: string
          description: Why it did not move.

    PlayedUpdate:
      type: object
      description: A direct change to an item's played and finished flags.
      required: [played, finished]
      properties:
        played:
          type: boolean
          description: Whether the item counts as played at least once.
        finished:
          type: boolean
          description: >
            Whether the listener reached the end. Never true while
            `played` is false.
        playCount:
          type: integer
          minimum: 0
          nullable: true
          description: >
            The play count to store. Omitted or null keeps the stored
            count, which is what a client that only means to flip the
            flags should send; 0 resets it, so an undo of a mis-tapped
            mark clears the play it added rather than leaving it
            counted. Setting `played` true without naming a count stores
            the smallest count consistent with it, so a played item
            never sorts as never-played.
        recordedAt:
          type: string
          format: date-time
          description: >
            When the change was made on the client, sent only when
            replaying an offline queue. The server skips the write when
            the item's flags changed more recently than this. Live
            mutations omit it and always apply, which is what an
            interactive un-mark wants: a client clock trailing the
            server would otherwise drop it as stale.

    StarUpdate:
      type: object
      description: A star or unstar.
      required: [starred]
      properties:
        starred:
          type: boolean
          description: The new star state.
        recordedAt:
          type: string
          format: date-time
          description: >
            When the change was made on the client, sent only when
            replaying an offline queue. The server skips the write when
            the item's star changed more recently than this, so a stale
            offline toggle never resurrects an undone state. Live
            mutations omit it and always apply.

    RatingUpdate:
      type: object
      description: A rating change.
      required: [rating]
      properties:
        rating:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
          description: The new rating (0 to 100), or null to clear it.
        recordedAt:
          type: string
          format: date-time
          description: >
            When the change was made on the client, sent only when
            replaying an offline queue. The server skips the write when
            the item's rating changed more recently than this. Live
            mutations omit it and always apply.

    PlayState:
      type: object
      description: The calling user's playback state for one item.
      required: [pid, positionMs, played, finished, playCount, starred]
      properties:
        pid:
          type: string
          description: The item this state belongs to.
        positionMs:
          type: integer
          format: int64
          description: >
            Resume position in milliseconds. For multi-file audiobooks
            this is always a book-timeline position spanning all parts.
        played:
          type: boolean
          description: >
            Whether the item has crossed its played threshold. The
            server derives this from the position reached against the
            item's full duration (per-medium thresholds), never from a
            listened-milliseconds ratio, so silence trimming and speed
            changes cannot distort it.
        finished:
          type: boolean
          description: >
            Whether the item was completed. For multi-file audiobooks
            the server derives completion from the book-timeline
            position; a client-reported finished flag alone does not
            finish a book.
        playCount:
          type: integer
          description: How many times the item has been played.
        starred:
          type: boolean
          description: Whether the caller starred the item.
        rating:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
          description: The caller's rating (0 to 100); absent or null when unrated.
        updatedAt:
          type: string
          format: date-time
          description: When this state last changed.

    EntityPlayState:
      type: object
      description: >
        The calling user's star and rating for one catalog entity (an
        artist or an album). Entities carry no resume position or play
        count of their own; their items keep those.
      required: [pid, starred]
      properties:
        pid:
          type: string
          description: The entity this state belongs to.
          example: al-01JZX5N8QW3F4V9T2B7KD3M9R6
        starred:
          type: boolean
          description: Whether the caller starred the entity.
        starredAt:
          type: string
          format: date-time
          description: >
            When the star was set, which is what orders the starred
            list. Absent when the entity is not starred.
        rating:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
          description: The caller's rating (0 to 100); absent or null when unrated.
        updatedAt:
          type: string
          format: date-time
          description: When this state last changed.

    StarredEntities:
      type: object
      description: The caller's starred catalog entities, grouped by kind.
      required: [artists, albums]
      properties:
        artists:
          type: array
          items:
            $ref: "#/components/schemas/SearchHit"
        albums:
          type: array
          items:
            $ref: "#/components/schemas/SearchHit"

    PlayStateQuery:
      type: object
      description: A batch play-state read request.
      required: [pids]
      properties:
        pids:
          type: array
          minItems: 1
          maxItems: 500
          description: Items to read the caller's state for.
          items:
            type: string
            example: tr-01JZX5N8QW3F4V9T2B7KD3M9R6

    PlayStateList:
      type: object
      description: The caller's playback states for a requested batch.
      required: [states]
      properties:
        states:
          type: array
          description: >
            One entry per requested item with recorded state; items with
            zero state are absent.
          items:
            $ref: "#/components/schemas/PlayState"

    PlayStateUpdate:
      type: object
      description: A resume-position checkpoint.
      required: [positionMs]
      properties:
        positionMs:
          type: integer
          format: int64
          minimum: 0
          description: >
            Playback position in milliseconds. For multi-file
            audiobooks always a book-timeline position (play-info's
            `partStartMs` plus the in-part position).
        recordedAt:
          type: string
          format: date-time
          description: >
            When the checkpoint was recorded on the client, sent only when
            replaying an offline queue. The server reconciles replays per
            medium: audiobooks and long tracks are recency-primary (the
            most recently recorded position wins, so a stale replay never
            drags a 14-hour book backward or forward), while music and
            podcast episodes are furthest-position-wins with a recency
            guard (the further position wins unless the nearer one is
            substantially more recent, honoring a deliberate rewind).
            Future-dated values are clamped to the server clock. Live
            checkpoints omit it and always apply. The response does not
            reveal whether a replay was applied or skipped: after
            flushing an offline queue, clients learn the winning state
            through `/sync/server` (a skipped replay means the winner is
            already in the event stream).

    ListenSession:
      type: object
      description: >
        One listen session as reported by a client. `sessionId` is a
        client-generated idempotency ID; replaying a session with the same
        ID never double-counts. Deduplication is per user across all of the
        user's clients, so IDs must be globally random (ULID or UUID), never
        a per-device counter.
      required: [sessionId, pid, startedAt, msPlayed]
      properties:
        sessionId:
          type: string
          minLength: 1
          maxLength: 64
          description: >
            Client-generated idempotency ID for this session, unique across
            all of the user's clients (use a ULID or UUID).
          example: 01JZX5N8QW3F4V9T2B7KD3M9R6
        pid:
          type: string
          description: The item that was played.
          example: tr-01JZX5N8QW3F4V9T2B7KD3M9R6
        startedAt:
          type: string
          format: date-time
          description: >
            When playback started. Historical for backdated imports; the
            server preserves it as reported.
        msPlayed:
          type: integer
          format: int64
          minimum: 0
          description: Milliseconds actually heard (excludes pauses and seeks).
        skippedMs:
          type: integer
          format: int64
          minimum: 0
          description: >
            Milliseconds of content the listener did not sit through
            thanks to silence trimming and playback speed above 1x,
            for the time-saved counter. Omit when neither applies.
        finished:
          type: boolean
          description: Whether playback reached the end of the item.
        client:
          type: string
          maxLength: 128
          description: Client identifier (app name and platform).
          example: waxdeck-web
        source:
          type: string
          description: >
            Where the session originates. `live` is a WaxDeck client
            reporting its own playback; `import` is a backdated session from
            another service's history.
          enum: [live, import]
          default: live

    ListenReport:
      type: object
      description: A batch of listen sessions (a flush of an offline queue, or one live session).
      required: [sessions]
      properties:
        sessions:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: "#/components/schemas/ListenSession"

    ListenIngestResult:
      type: object
      description: Outcome of a listen ingest batch.
      required: [accepted, duplicates]
      properties:
        accepted:
          type: integer
          description: Sessions recorded for the first time.
        duplicates:
          type: integer
          description: Sessions already recorded (replay of a known `sessionId`); ignored without error.
        rejected:
          type: array
          description: Sessions that could not be recorded at all (unknown item, malformed fields).
          items:
            $ref: "#/components/schemas/RejectedListen"

    RejectedListen:
      type: object
      description: One session the server refused, and why.
      required: [sessionId, code, message]
      properties:
        sessionId:
          type: string
          description: The refused session's idempotency ID.
        code:
          type: string
          description: Stable machine-readable reason (`not-found`, `invalid-request`).
        message:
          type: string
          description: Human-readable explanation.

    DownloadFile:
      type: object
      description: One downloadable backing file of an item.
      required: [url, mimeType, sizeBytes, fileName, essenceHash, etag]
      properties:
        url:
          type: string
          description: >
            Origin-relative, media-token-authenticated download URL serving
            this file's original bytes with range support.
          example: /media/download?pid=tr-01JZX5N8QW3F4V9T2B7KD3M9R6&mt=abc123
        mimeType:
          type: string
          description: MIME type of the file.
          example: audio/flac
        sizeBytes:
          type: integer
          format: int64
          description: Exact size of the file in bytes.
        durationMs:
          type: integer
          format: int64
          description: >
            This file's own duration in milliseconds, absent when the
            catalog does not know it (a file no scan could probe).

            It is the file's duration, not the item's, and the two differ
            in both directions: each part of a multi-file audiobook
            reports its own, so a client holding the downloaded parts can
            place a book-timeline position in one of them without asking
            the server; and an item carved out of a larger file reports
            the containing file's duration, with `spanStartMs` and
            `spanEndMs` giving the item's window inside it.
        fileName:
          type: string
          description: >
            Suggested file name (the original base name), also sent as the
            download's `Content-Disposition`.
          example: 03 Prancing Pony Blues.flac
        essenceHash:
          type: string
          description: >
            Content hash of the file's audio essence, stable across retags
            and moves: the download-store key.
        etag:
          type: string
          description: >
            Strong validator of the exact file bytes, served as the
            download's `ETag`. Changes on any rewrite of the file,
            including retags that leave `essenceHash` unchanged; a
            mismatch means restart this file's transfer instead of
            resuming a range.

    DownloadInfo:
      type: object
      description: Everything a client needs to download one item's original bytes.
      required: [pid, files, expiresAt]
      properties:
        pid:
          type: string
          description: The resolved item's PID.
          example: tr-01JZX5N8QW3F4V9T2B7KD3M9R6
        files:
          type: array
          minItems: 1
          description: >
            The item's backing files in playback order. One entry for a
            track or single-file book; one per part for a multi-file
            audiobook; exactly one (the containing file) for an item
            carved out of a larger file.
          items:
            $ref: "#/components/schemas/DownloadFile"
        spanStartMs:
          type: integer
          format: int64
          description: >
            Start of the item's playback window within its single backing
            file, in milliseconds. Present only for items carved out of a
            larger file (CUE-backed virtual tracks); offline playback
            plays the window, not the whole file.
        spanEndMs:
          type: integer
          format: int64
          description: >
            End of the playback window in milliseconds, exclusive.
            Present exactly when `spanStartMs` is.
        expiresAt:
          type: string
          format: date-time
          description: When the embedded media tokens stop being accepted.

    PlayInfo:
      type: object
      description: Everything a client needs to begin playback of one item.
      required: [pid, url, mimeType, durationMs, seekable, expiresAt]
      properties:
        pid:
          type: string
          description: The resolved item's PID.
          example: tr-01JZX5N8QW3F4V9T2B7KD3M9R6
        url:
          type: string
          description: >
            Origin-relative, media-token-authenticated stream URL. Short TTL;
            re-request play-info on expiry or a `stream-stale` error. Which
            endpoint it names follows how the item resolves: `/media/stream`
            through the streaming engine, `/media/download` on a server
            running without it, and `/media/enclosure` for a podcast episode
            served by enclosure passthrough. Clients play the url they are
            given and do not parse it.
          example: /media/stream?pid=tr-01JZX5N8QW3F4V9T2B7KD3M9R6&mt=abc123
        mimeType:
          type: string
          description: MIME type the stream will be served as.
          example: audio/flac
        durationMs:
          type: integer
          format: int64
          description: Duration in milliseconds.
          example: 214000
        seekable:
          type: boolean
          description: >
            Whether the stream supports sample-exact seeking. Best effort
            for an unfetched podcast episode served by enclosure
            passthrough: the relay forwards ranges, but whether the
            podcast host honours them is unknown until the first upstream
            request, so a client should degrade rather than assume.
        expiresAt:
          type: string
          format: date-time
          description: When the embedded media token stops being accepted.
        partIndex:
          type: integer
          description: >
            Zero-based index of the resolved part within a multi-file
            audiobook. Present exactly when `partCount` is.
        partCount:
          type: integer
          description: >
            Number of parts in a multi-file audiobook. Present only for
            multi-file books; single-file items omit the part fields
            entirely.
        partStartMs:
          type: integer
          format: int64
          description: >
            Book-timeline millisecond offset where the resolved part
            begins. In-part positions plus this offset give the
            book-timeline positions that play-state expects. Present
            exactly when `partCount` is.
        voiceBoost:
          type: boolean
          description: >
            True when the stream applies server-side spoken-word loudness
            normalization. Absent or false otherwise, including when it
            was requested but cannot be applied yet (unsupported by the
            sidecar, or loudness not measured yet).
        spanStartMs:
          type: integer
          format: int64
          description: >
            Present exactly with `spanEndMs`, and only when the url
            serves the item's whole backing file while the item is a
            window into it (direct playback of a track carved from a
            larger rip, on a server running without the streaming
            engine): the client must play only the
            [`spanStartMs`, `spanEndMs`) window of the served audio.
            Absent whenever the server cuts the stream itself.
            `durationMs` remains the item's own duration, never the
            backing file's.
        spanEndMs:
          type: integer
          format: int64
          description: >
            End of the playback window in served-audio milliseconds.
            Present exactly when `spanStartMs` is.

    SkipSpan:
      type: object
      description: One silence span to skip.
      required: [startMs, endMs]
      properties:
        startMs:
          type: integer
          format: int64
          description: Span start in milliseconds.
        endMs:
          type: integer
          format: int64
          description: Span end in milliseconds, exclusive.

    SkipMap:
      type: object
      description: >
        Precomputed silence spans for one audio file, keyed to its
        audio essence and the upstream detector version. Spans are in
        the mapped file's own timeline (for a multi-file audiobook,
        the requested part's timeline, not the book's).
      required: [state]
      properties:
        state:
          type: string
          description: >
            `ready` (spans present), `pending` (analysis queued or
            running; poll again later), or `unavailable` (this item is
            not mapped: not spoken-word content, audio not fetched to
            the server yet, or the streaming engine cannot analyze).
            Open set; treat unknown values as `unavailable`.
          example: ready
        essenceHash:
          type: string
          description: >
            Content hash of the mapped file's audio essence, matching
            the download surface's `essenceHash`; a stored map whose
            hash no longer matches the stored audio is stale.
        partIndex:
          type: integer
          description: >
            The mapped part of a multi-file audiobook. Present only
            for multi-file books.
        version:
          type: string
          description: Upstream silence-detector revision the map was built by.
          example: silence-1
        thresholdDb:
          type: number
          format: double
          description: Detection threshold in dBFS.
        minSeconds:
          type: number
          format: double
          description: Minimum span length in seconds.
        spans:
          type: array
          description: Silence spans ordered by `startMs` (`ready` only).
          items:
            $ref: "#/components/schemas/SkipSpan"
        updatedAt:
          type: string
          format: date-time
          description: When the map was computed.

    Waveform:
      type: object
      description: >
        One item's amplitude envelope, produced by the catalog's analyze
        pass and read back unchanged. Nothing here is computed on demand.
      required: [state]
      properties:
        state:
          type: string
          description: >
            `ready` (peaks present), `pending` (analyzable, not yet
            analyzed), or `unavailable` (there will never be a waveform
            for this item). Open set; treat unknown values as
            `unavailable`.
          example: ready
        partIndex:
          type: integer
          description: >
            The described part of a multi-file audiobook. Present only
            for multi-file books.
        peaks:
          type: array
          description: >
            One amplitude per bucket in playback order, `0` silence and
            `255` full scale (`ready` only). Downsample to the pixel
            width being drawn.
          items:
            type: integer
            minimum: 0
            maximum: 255
        resolution:
          type: integer
          description: >
            How many buckets `peaks` carries (`ready` only). Fixed by the
            catalog at 1000 today; read it rather than assuming, because
            an analysis version bump may change it.
          example: 1000
        essenceHash:
          type: string
          description: >
            Content hash of the analyzed audio essence, matching the
            download surface's `essenceHash`. A stored waveform whose
            hash no longer matches the stored audio is stale.


            For `span=item` on a multi-part book there is no single
            essence to name, so this is a fixed-length digest over
            everything the stitched envelope is built from - every
            part's essence in reading order, every part's duration, and
            the bucket count. It is a cache validator there rather than
            a content hash, and does not match any file's
            `essenceHash`: compare it only against another answer from
            this endpoint.

    PlayerEndpoint:
      type: object
      description: >
        One controllable playback output: a registered first-party
        client (`client`), a cast device (`cast`), a DLNA renderer
        (`dlna`), or the server's own audio output (`jukebox`). `kind`
        is an open string; clients must render unknown kinds as generic
        endpoints.
      required: [id, kind, name, online, shared, mine, volumeControl, rateControl]
      properties:
        id:
          type: string
          description: Endpoint PID. Stable per device across reconnects.
          example: pe-01JZX5N8QW3F4V9T2B7KD3M9R6
        kind:
          type: string
          description: "`client`, `cast`, `dlna`, or `jukebox`."
          example: cast
        name:
          type: string
          description: >
            Display name: the device's advertised name, or the client
            session's device label.
          example: Kitchen speaker
        online:
          type: boolean
          description: >
            Whether the endpoint is reachable right now. Client
            endpoints are listed only while online; device endpoints
            persist across discovery sweeps and go offline when they
            stop answering.
        shared:
          type: boolean
          description: >
            Shared endpoints are visible and controllable by every
            user. Device endpoints are shared; client endpoints are
            private to their owner.
        mine:
          type: boolean
          description: True when the endpoint belongs to the caller.
        volumeControl:
          type: boolean
          description: Whether `set-volume` works on this endpoint.
        rateControl:
          type: boolean
          description: Whether `set-rate` works on this endpoint.
        activeSessionId:
          type: string
          description: >
            The session currently playing on this endpoint, when there
            is one visible to the caller.
          example: ps-01JZX5N8QW3F4V9T2B7KD3M9R6

    PlayerEndpointList:
      type: object
      description: The endpoints visible to the caller.
      required: [endpoints]
      properties:
        endpoints:
          type: array
          items:
            $ref: "#/components/schemas/PlayerEndpoint"

    PlaybackSessionEntry:
      type: object
      description: One queue entry of a playback session, hydrated for display.
      required: [pid, title]
      properties:
        pid:
          type: string
          description: The item's PID.
          example: tr-01JZX5N8QW3F4V9T2B7KD3M9R6
        title:
          type: string
          description: Display title.
        artist:
          type: string
          description: Display artist, when the item has one.
        durationMs:
          type: integer
          format: int64
          description: Item duration in milliseconds, when known.

    PlaybackSession:
      type: object
      description: >
        One playback session: a queue playing (or paused) on an
        endpoint. `positionMs` is the position that was true at
        `positionAt` (server clock); while `playing`, controllers
        extrapolate forward with `rate`. `authority` says who advances
        playback: `remote` sessions are driven by the server (cast,
        DLNA, jukebox), `mirror` sessions are driven by the playing
        client and mirrored here. Both are controlled the same way.
      required:
        [id, endpointId, mine, authority, playing, index, positionMs,
         positionAt, rate, queueVersion, updatedAt]
      properties:
        id:
          type: string
          description: >
            Session PID. Stable across transfers between endpoints.
          example: ps-01JZX5N8QW3F4V9T2B7KD3M9R6
        endpointId:
          type: string
          description: The endpoint the session plays on.
          example: pe-01JZX5N8QW3F4V9T2B7KD3M9R6
        endpointName:
          type: string
          description: The endpoint's display name, for one-call rendering.
        mine:
          type: boolean
          description: True when the caller owns the session.
        ownerName:
          type: string
          description: >
            The owning user's display name. Present on sessions the
            caller does not own (it is how a shared speaker's UI says
            who is playing).
        authority:
          type: string
          description: "`remote` or `mirror` (open string)."
          example: remote
        playing:
          type: boolean
          description: Whether playback is running right now.
        index:
          type: integer
          description: Zero-based index of the current entry.
        positionMs:
          type: integer
          format: int64
          description: Position within the current entry at `positionAt`.
        positionAt:
          type: string
          format: date-time
          description: >
            Server-clock instant `positionMs` was true, millisecond
            precision. Extrapolate against the WebSocket clock offset.
        rate:
          type: number
          format: double
          minimum: 0.25
          maximum: 5
          description: Playback rate. 1.0 is normal speed.
        volume:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: >
            Endpoint volume, 0 to 1. Absent on endpoints without
            volume control.
        repeat:
          type: string
          description: "`off`, `all`, or `one` (open string)."
          example: "off"
        shuffle:
          type: boolean
          description: >
            Whether shuffle is on. `entries` always lists the true
            play order: turning shuffle on reorders the unplayed
            remainder (and bumps `queueVersion`); turning it off keeps
            the current order.
        queueVersion:
          type: integer
          format: int64
          description: >
            The server-owned queue generation, monotone per session id
            across transfers and authority changes: it bumps whenever
            the queue (entries or their order) changes. A playing
            client's reported version is only an edge signal; the
            published value here is the server's.
        entries:
          type: array
          description: >
            The queue, in play order. Always present on the REST
            endpoints. WebSocket `session` frames carry it on the
            first frame of a watch and whenever `queueVersion` bumped,
            and omit it otherwise (absent means unchanged since the
            version you last saw; refetch the session if you lost
            track).
          items:
            $ref: "#/components/schemas/PlaybackSessionEntry"
        ended:
          type: boolean
          description: >
            Present true only over the WebSocket, and terminal for
            that delivery context: the watched or reported session
            ended, or left the receiver's visibility (a transfer to a
            private endpoint). Re-list `/player/sessions` to learn
            which. Never true from the REST endpoints, which answer
            `not-found` for sessions the caller cannot see.
        updatedAt:
          type: string
          format: date-time
          description: Last state change (position ticks included).

    PlaybackSessionList:
      type: object
      description: The sessions visible to the caller, most recent activity first.
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/PlaybackSession"

    PlaybackSessionHistoryEntry:
      type: object
      description: >
        One ended playback session, as the state it stopped in. It has
        no live half: nothing extrapolates, `positionMs` is final, and
        the session cannot be controlled or resumed in place - restore
        means starting a new session from this queue, index, and
        position. Deliberately not a `PlaybackSession` with a flag: a
        row here is history, while that schema's `ended` marks a live
        session's last frame, and one type meaning both would make
        callers ask which transport an object arrived on.
      required: [id, endpointId, authority, index, positionMs, positionAt, rate, entries]
      properties:
        id:
          type: string
          description: >
            The session's PID. It names a session that no longer
            exists; the id is here to correlate with what the caller
            may have seen live, not to address anything.
          example: ps-01JZX5N8QW3F4V9T2B7KD3M9R6
        endpointId:
          type: string
          description: The endpoint the session was playing on.
          example: pe-01JZX5N8QW3F4V9T2B7KD3M9R6
        endpointName:
          type: string
          description: >
            The endpoint's display name, when it is still known.
            Absent for an endpoint that has since gone away, which a
            client endpoint does on every sign-out; render the entry
            without it rather than treating that as an error.
        authority:
          type: string
          description: >
            How the session was driven: `remote` (the server drove a
            cast, DLNA, or jukebox endpoint) or `mirror` (a client
            played it and reported here). Open string.
          example: mirror
        index:
          type: integer
          description: Zero-based index of the entry it stopped on.
        positionMs:
          type: integer
          format: int64
          description: Final position within that entry.
        positionAt:
          type: string
          format: date-time
          description: >
            Server-clock instant `positionMs` was true. For a session
            ended deliberately that is the instant it ended; for one
            interrupted by a disconnect or a restart it is the last
            checkpoint before the interruption, a few seconds earlier.
            This is the sort key: the list is newest first.
        rate:
          type: number
          format: double
          minimum: 0.25
          maximum: 5
          description: The rate it was playing at. 1.0 is normal speed.
        repeat:
          type: string
          description: "`off`, `all`, or `one` (open string)."
          example: "off"
        shuffle:
          type: boolean
          description: >
            Whether shuffle was on. `entries` is the play order as it
            stood, already shuffled.
        entries:
          type: array
          description: The queue as it stood, in play order.
          items:
            $ref: "#/components/schemas/PlaybackSessionEntry"

    PlaybackSessionHistoryList:
      type: object
      description: The caller's ended sessions, most recently ended first.
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/PlaybackSessionHistoryEntry"

    PlaybackSessionCreate:
      type: object
      description: Start playback of a queue on an endpoint.
      required: [endpointId, itemPids]
      properties:
        endpointId:
          type: string
          description: The target endpoint.
          example: pe-01JZX5N8QW3F4V9T2B7KD3M9R6
        itemPids:
          type: array
          description: The queue, in play order.
          minItems: 1
          maxItems: 500
          items:
            type: string
        index:
          type: integer
          description: Zero-based entry to start at. Defaults to 0.
          minimum: 0
        positionMs:
          type: integer
          format: int64
          description: Position within the starting entry. Defaults to 0.
          minimum: 0
        play:
          type: boolean
          description: >
            Start playing immediately. Defaults to true; false loads
            paused.

    PlaybackSessionTransfer:
      type: object
      description: Move a session's live playback to another endpoint.
      required: [endpointId]
      properties:
        endpointId:
          type: string
          description: The endpoint to move playback to.
          example: pe-01JZX5N8QW3F4V9T2B7KD3M9R6

    TimelineCreate:
      type: object
      description: Mint a gapless timeline over an ordered queue of items.
      required: [itemPids]
      properties:
        itemPids:
          type: array
          description: The queue, in play order.
          minItems: 1
          maxItems: 500
          items:
            type: string
        crossfadeSeconds:
          type: number
          format: double
          description: >
            Equal-power crossfade applied at every seam, in seconds, 0
            to 12. Omit or 0 for a gapless butt join. The value shapes
            the returned boundaries; the served stream applies the
            same value by construction.
          minimum: 0
          maximum: 12

    TimelineBoundary:
      type: object
      description: >
        One queue item's place on the combined timeline. Offsets and
        durations are in samples at the timeline's `envelopeRate`.
        Without crossfade, members tile exactly; with crossfade,
        consecutive members overlap, so map positions by offset, never
        by summing durations.
      required: [pid, offsetSamples, durationSamples]
      properties:
        pid:
          type: string
          description: The queue item this boundary describes.
        offsetSamples:
          type: integer
          format: int64
          description: Where this member starts on the timeline.
        durationSamples:
          type: integer
          format: int64
          description: The member's own length on the timeline.

    TimelineInfo:
      type: object
      description: >
        A minted gapless timeline: one HLS stream URL that plays the
        whole queue, plus the per-member boundaries to map positions.
      required:
        [url, mimeType, durationMs, expiresAt, envelopeRate, boundaries]
      properties:
        url:
          type: string
          description: >
            Origin-relative, media-token-authenticated HLS playlist
            URL for the whole timeline. The token lives at least the
            timeline's duration plus margin; re-request this endpoint
            on `stream-stale`, on a `not-found` fetch (the engine aged
            the timeline out), or after `expiresAt`.
          example: /media/hls/master.m3u8?tl=abc&mt=xyz
        mimeType:
          type: string
          description: Always an HLS playlist type.
          example: application/vnd.apple.mpegurl
        durationMs:
          type: integer
          format: int64
          description: The combined timeline's duration.
        expiresAt:
          type: string
          format: date-time
          description: When the embedded media token stops being accepted.
        envelopeRate:
          type: integer
          description: >
            Sample rate the boundary offsets are measured at (the
            maximum member rate).
        crossfadeSeconds:
          type: number
          format: double
          description: The crossfade the timeline was minted with, when nonzero.
        boundaries:
          type: array
          description: Per-member placement, in queue order.
          items:
            $ref: "#/components/schemas/TimelineBoundary"

    CastPreflightBase:
      type: object
      description: One candidate advertise base and its server-side verdict.
      required: [base, source, reachable, notes]
      properties:
        base:
          type: string
          description: The base URL a cast device would fetch media from.
          example: http://192.168.1.20:4420
        source:
          type: string
          description: >
            Where the candidate came from: `configured` (the public
            base) or `detected` (the auto-detected LAN address). Open
            string.
        reachable:
          type: boolean
          description: >
            Whether the server could fetch its own health endpoint
            through this base.
        notes:
          type: array
          description: >
            Plain-language observations: scheme and certificate
            caveats, name-resolution warnings, why a base is likely or
            unlikely to work from a cast device.
          items:
            type: string

    CastPreflight:
      type: object
      description: >
        The advertise bases cast sessions will offer, in try order,
        each with a server-side reachability verdict.
      required: [bases]
      properties:
        bases:
          type: array
          items:
            $ref: "#/components/schemas/CastPreflightBase"

    PlaylistImportRequest:
      type: object
      description: >
        A playlist to import. `payload` carries the export text for
        the text sources; `refs` carries portable refs for the
        `portable` source. Exactly the field matching `source` must
        be set.
      required: [source]
      properties:
        source:
          type: string
          description: >
            The export format: `spotify` (Exportify CSV), `applemusic`
            (tab-separated export), `ytmusic` (Google Takeout CSV),
            `csv` (generic with artist, title, album, duration
            columns), `text` (one `Artist - Title` per line), or
            `portable` (another WaxDeck's portable export).
          enum: [spotify, applemusic, ytmusic, csv, text, portable]
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: >
            Name for the created playlist. Defaults to a name found in
            the export, or `Imported playlist`.
        payload:
          type: string
          maxLength: 4000000
          description: The export file's text content (text sources).
        refs:
          type: array
          maxItems: 10000
          description: Portable refs (the `portable` source).
          items:
            $ref: "#/components/schemas/PortableRef"

    PlaylistImportResult:
      type: object
      description: The import report.
      required: [name, requested, resolved, missing, rungs]
      properties:
        playlistPid:
          type: string
          description: >
            The created playlist. Absent when nothing resolved (no
            playlist is created).
          example: pl-01JZX5N8QW3F4V9T2B7KD3M9R6
        name:
          type: string
          description: The playlist name used.
        requested:
          type: integer
          description: Entries found in the export.
        resolved:
          type: integer
          description: Entries matched to library items.
        missing:
          type: array
          description: >
            Entries with no library match, in export order: the
            missing-tracks report.
          items:
            $ref: "#/components/schemas/PlaylistImportMiss"
        rungs:
          $ref: "#/components/schemas/ResolveRungCounts"

    PlaylistImportMiss:
      type: object
      description: One unmatched import entry.
      required: [title]
      properties:
        artist:
          type: string
          description: The entry's artist, as exported.
        title:
          type: string
          description: The entry's title, as exported.
        album:
          type: string
          description: The entry's album, as exported.
        durationMs:
          type: integer
          format: int64
          description: The entry's duration, when the export carried one.

    ResolveRungCounts:
      type: object
      description: >
        How many entries each resolve-ladder rung matched, most
        confident rung first. A high `descriptive` share means fuzzy
        matches worth spot-checking.
      required: [essence, strongId, fingerprint, descriptive]
      properties:
        essence:
          type: integer
          description: Identical audio bytes.
        strongId:
          type: integer
          description: Exact external identifier (recording MBID, ASIN, ISBN).
        fingerprint:
          type: integer
          description: Same recording, different encoding.
        descriptive:
          type: integer
          description: Fuzzy artist, title, album, and duration match.

    PortableRef:
      type: object
      description: >
        A catalog-independent identity descriptor for one playable
        item, carrying the progressively fuzzier anchors the resolve
        ladder walks. Produced by the portable export; consumed by the
        `portable` import source.
      required: [kind, title]
      properties:
        kind:
          type: string
          description: What the ref describes.
          enum: [track, book, episode]
        essence:
          type: string
          description: Exact-rip audio-essence hash.
        fingerprint:
          type: string
          format: byte
          description: Packed acoustic fingerprint, base64.
        fingerprintAlgo:
          type: integer
          description: "Fingerprint algorithm: 1 pure-Go, 100 Chromaprint."
        mbid:
          type: string
          description: Recording MBID (track) or release MBID (book).
        asin:
          type: string
          description: Audiobook ASIN.
        isbn:
          type: string
          description: Audiobook ISBN.
        isrc:
          type: string
          description: >
            Recording ISRC. Import upgrades it to a recording MBID
            through MusicBrainz when the server has internet.
        artist:
          type: string
          description: Track artist, or book author.
        title:
          type: string
          description: Display title.
        album:
          type: string
          description: Track album, or book series.
        durationMs:
          type: integer
          format: int64
          description: Duration in milliseconds.

    PortablePlaylist:
      type: object
      description: A playlist exported as portable refs, in playlist order.
      required: [name, refs]
      properties:
        name:
          type: string
          description: The playlist's name.
        refs:
          type: array
          items:
            $ref: "#/components/schemas/PortableRef"

    Playlist:
      type: object
      description: >
        A playlist: a manual ordered list (`static`) or a rule
        evaluated per user on read (`smart`). `rule` is present only
        for smart playlists. `itemCount` is always the caller's own
        view of the membership: present and live for a static
        playlist, computed on detail reads and omitted from list pages
        for a smart one.
      required: [pid, name, kind, visibility, ownerName, isOwner, createdAt, updatedAt]
      properties:
        pid:
          type: string
          description: >
            Type-prefixed ULID. Stable for the playlist's lifetime,
            including across rule edits.
          example: pl-01JZX5N8QW3F4V9T2B7KD3M9R6
        previousPid:
          type: string
          deprecated: true
          description: >
            Retired. Rule edits once reissued the pid and set this to
            the retired one; edits now apply in place under a stable
            pid, so this is never populated. Retained for wire
            compatibility and always absent.
        name:
          type: string
          description: Display name.
          example: Rainy day blues
        kind:
          type: string
          description: >
            `static` (manual ordered members) or `smart` (rule
            evaluated on read). A string, not a closed enum; clients
            must treat unknown kinds as read-only.
          example: smart
        visibility:
          type: string
          description: >
            `private` (owner only) or `shared` (readable by every
            user). A string, not a closed enum.
          example: private
        ownerName:
          type: string
          description: The owning user's display name.
          example: ada
        isOwner:
          type: boolean
          description: True when the caller owns this playlist and may edit it.
        hasArt:
          type: boolean
          description: >
            A cover is stored for this playlist, readable at
            `/items/{pid}/art` with the playlist's own PID. It is true
            for an owner's uploaded cover and for the mosaic the server
            builds from the members when there is none; the two are the
            same slot, and uploading wins until it is cleared. Absent
            means false.
        itemCount:
          type: integer
          description: >
            How many members this caller is offered, which is what the
            member listing beside it returns: archived items, items in
            libraries the caller has no grant for, and episodes of
            unsubscribed shows are all out of it. Entries, not distinct
            items, so a static playlist holding one track twice counts
            it twice. Live and exact for a static playlist; computed
            for smart playlists on detail reads and absent on list
            pages.
        rule:
          $ref: "#/components/schemas/SmartRule"
        createdAt:
          type: string
          format: date-time
          description: When the playlist was created.
        updatedAt:
          type: string
          format: date-time
          description: When the playlist row last changed.

    PlaylistPage:
      type: object
      description: One keyset-paginated page of playlists.
      required: [playlists]
      properties:
        playlists:
          type: array
          description: Playlists ordered by name then pid.
          items:
            $ref: "#/components/schemas/Playlist"
        nextCursor:
          type: string
          description: Opaque cursor for the next page. Absent on the last page.

    PlaylistCreate:
      type: object
      description: Create a playlist.
      required: [name, kind]
      properties:
        name:
          type: string
          description: Display name.
          minLength: 1
          maxLength: 200
        kind:
          type: string
          description: "`static` or `smart`."
          example: static
        visibility:
          type: string
          description: "`private` (default) or `shared`."
        rule:
          $ref: "#/components/schemas/SmartRule"
        itemPids:
          type: array
          description: >
            Initial members for a static playlist, in order. Invalid
            with `smart`.
          items:
            type: string

    PlaylistUpdate:
      type: object
      description: >
        Update a playlist. Omitted properties stay unchanged; `rule`
        applies only to smart playlists and updates in place under the
        same pid.
      properties:
        name:
          type: string
          description: New display name.
          minLength: 1
          maxLength: 200
        visibility:
          type: string
          description: "`private` or `shared`."
        rule:
          $ref: "#/components/schemas/SmartRule"

    PlaylistItemsUpdate:
      type: object
      description: The full ordered member list, or members to append.
      required: [itemPids]
      properties:
        itemPids:
          type: array
          description: Item pids in playback order.
          maxItems: 10000
          items:
            type: string
        baseUpdatedAt:
          type: string
          format: date-time
          description: >
            Optional lost-update precondition for the replace
            endpoint: the playlist `updatedAt` this member list was
            built from, echoed back as read. The comparison is at
            millisecond granularity, so a client date-time type that
            cannot hold the server's full precision still matches. A
            replace against a playlist that changed since then
            answers `conflict`. Ignored by the append endpoint.

    PlaylistEntry:
      type: object
      description: One playlist member.
      required: [item]
      properties:
        position:
          type: integer
          description: >
            Zero-based position in the stored member order. Present
            only for static playlists; this is the value the removal
            endpoint takes.
        item:
          $ref: "#/components/schemas/ItemSummary"

    PlaylistItemsPage:
      type: object
      description: One page of playlist members.
      required: [entries]
      properties:
        entries:
          type: array
          description: Members in playlist order.
          items:
            $ref: "#/components/schemas/PlaylistEntry"
        nextCursor:
          type: string
          description: Opaque cursor for the next page. Absent on the last page.

    SmartRule:
      type: object
      description: >
        A smart playlist rule: a condition tree, optional sort order,
        and an optional limit. Rules are evaluated per user on
        read; fields that read user state (stars, ratings, play
        counts) bind to the evaluating user at that moment. Without
        `sorts` the engine orders by title ascending so results are
        deterministic. Rules are bounded on write: at most 200 nodes
        total and at most 10 levels of nesting; larger rules answer
        `invalid-request`.
      required: [root]
      properties:
        root:
          $ref: "#/components/schemas/RuleNode"
        sorts:
          type: array
          description: >
            Sort order, applied in sequence. Rejected with
            `limitMode` `random` (the shuffle is the order).
          maxItems: 4
          items:
            $ref: "#/components/schemas/RuleSort"
        limit:
          type: integer
          description: >
            The limit value, interpreted by `limitMode`: a maximum
            member count (`count`, the default), a maximum count of a
            random draw (`random`), or a playtime or size budget in
            whole minutes (`minutes`) or megabytes (`megabytes`). Zero
            or absent means unlimited and is only valid with `count`.
          minimum: 0
        limitMode:
          type: string
          description: >
            How `limit` is interpreted: `count` (the default; a plain
            member cap in sort order), `random` (that many members
            drawn by a seeded shuffle, so a rule can mean "25 songs at
            random"), `minutes` (members accumulated in rule order
            until the next would exceed `limit` minutes of playtime),
            or `megabytes` (the same, budgeted by summed file size, so
            a rule can mean "what fits on the device"). A budget mode
            skips a member with no measurable playtime or size rather
            than counting it as free. A string, not a closed enum;
            unknown values answer `invalid-request`. Absent means
            `count`.
          example: random
        limitSeed:
          type: integer
          format: int64
          description: >
            Pins the shuffle order of a `random` or budget evaluation
            so the same rule yields the same members each read; zero or
            absent draws a fresh order per read. Only meaningful when
            `limitMode` is not `count`; supplying it with `count`
            answers `invalid-request`.

    RuleNode:
      type: object
      description: >
        One node of a rule's condition tree. `type` selects the shape:
        `all` (every child must match) and `any` (at least one child
        must match) carry `nodes`; `not` inverts its single `node`;
        `condition` compares one `field` with `op` against `value` (or
        `values` for `inTheRange`, exactly two, low then high). An
        `all` with no children matches everything; an `any` with no
        children matches nothing. Unknown `type` strings are rejected
        on write. Condition values are strings on the wire regardless
        of the field's kind: numbers in decimal, booleans as `true`
        or `false`, dates as absolute RFC 3339 timestamps, media
        types as `music`, `podcast`, or `audiobook`, and the
        `playlist` field as a playlist pid (`pl-...`), which is how a
        rule says "not in my Archive list". Date fields also
        accept the relative operators `inTheLast` and `notInTheLast`,
        whose `value` is a positive whole number of days counted back
        from read time: a rule meaning "played in the last 30 days"
        re-evaluates its window on every read instead of pinning an
        absolute cutoff. `inTheRange` is inclusive on both ends. The
        field vocabulary and each field's accepted operators come from
        the rule-fields endpoint; custom tags are addressed as
        `tag.KEY`.
      required: [type]
      properties:
        type:
          type: string
          description: "`all`, `any`, `not`, or `condition`."
          example: condition
        nodes:
          type: array
          description: Children of an `all` or `any` group.
          maxItems: 100
          items:
            $ref: "#/components/schemas/RuleNode"
        node:
          $ref: "#/components/schemas/RuleNode"
        field:
          type: string
          description: Field name from the rule-fields vocabulary.
          example: rating
        op:
          type: string
          description: >
            Operator: one of `is`, `isNot`, `contains`, `startsWith`,
            `endsWith`, `gt`, `lt`, `gte`, `lte`, `inTheRange`,
            `before`, `after`, `inTheLast`, `notInTheLast`,
            `isPresent`, `isMissing`. Each field accepts a subset; see
            the rule-fields endpoint. `inTheLast` and `notInTheLast`
            are the relative-date operators (date fields only).
          example: gte
        value:
          type: string
          description: Comparison value, string-encoded per the field's kind.
          example: "80"
        values:
          type: array
          description: Exactly two values for `inTheRange`, low then high.
          minItems: 2
          maxItems: 2
          items:
            type: string

    RuleSort:
      type: object
      description: One sort key.
      required: [field]
      properties:
        field:
          type: string
          description: A sortable field from the rule-fields vocabulary.
          example: lastPlayedAt
        desc:
          type: boolean
          description: Descending when true.

    RuleField:
      type: object
      description: One rule field and what it accepts.
      required: [name, kind, ops, userState, sortable]
      properties:
        name:
          type: string
          description: Field name as used in conditions and sorts.
          example: rating
        kind:
          type: string
          description: >
            Value kind: `text`, `number`, `date`, `boolean`,
            `mediaType`, or `playlist`. A string, not a closed enum.
            Editors render the value input from this. A `playlist`
            value is a playlist pid (`pl-...`), so its editor is a
            picker over the static playlists the caller can see; a pid
            naming a deleted, smart, or self-referencing list is
            accepted and simply matches nothing.
          example: number
        ops:
          type: array
          description: Operators this field accepts.
          items:
            type: string
        userState:
          type: boolean
          description: >
            True when the field reads the evaluating user's playback
            state rather than shared catalog data.
        sortable:
          type: boolean
          description: True when the field may appear in `sorts`.
        description:
          type: string
          description: Short human-readable meaning, for editor tooltips.

    RuleTagKey:
      type: object
      description: One custom tag key usable as a `tag.KEY` field.
      required: [key, itemCount]
      properties:
        key:
          type: string
          description: Canonical tag key; address it as `tag.KEY`.
          example: MOOD
        itemCount:
          type: integer
          description: Distinct items carrying this key.

    RuleFields:
      type: object
      description: >
        The rule field vocabulary for smart rule editors. `tag.KEY`
        fields are uniform and therefore not repeated per key: they
        are text-kind, accept `is`, `isNot`, `contains`,
        `startsWith`, `endsWith`, `isPresent`, and `isMissing` (never
        the ordered operators), and can never sort. On a tag field
        `isNot` matches items that do not carry that value, including
        items without the tag at all: the deny-list reading.
      required: [fields, tagKeys]
      properties:
        fields:
          type: array
          description: Every rule field.
          items:
            $ref: "#/components/schemas/RuleField"
        tagKeys:
          type: array
          description: Custom tag keys, most used first.
          items:
            $ref: "#/components/schemas/RuleTagKey"

    PlaylistPreview:
      type: object
      description: A stateless rule evaluation.
      required: [items, total]
      properties:
        items:
          type: array
          description: >
            The first matching items in rule order, honoring the
            rule's own `limit`.
          items:
            $ref: "#/components/schemas/ItemSummary"
        total:
          type: integer
          description: >
            Total items the condition tree matches for the caller,
            ignoring the rule's `limit`, so editors can render
            "matches N items, keeping the first L".

    NspDocument:
      type: object
      additionalProperties: true
      description: >
        A Navidrome smart playlist (NSP) document, carried verbatim:
        `name`, `comment`, `public`, one of the mutually exclusive
        `all` / `any` condition groups, `sort`, `order`, and `limit`.
        Free-form on purpose - the grammar is another server's, and
        pinning its shape here would make every change over there a
        breaking change over here. What WaxDeck does and does not read
        is described on the two operations that carry it.

    NspGap:
      type: object
      description: >
        One part of a rule or an NSP document with no faithful
        counterpart on the other side.


        `field` and `op` are written in the vocabulary of the side
        being *read*, which is what the report's `direction` says:
        WaxDeck's names on an export, Navidrome's on an import. A gap
        names what the walk examined before it stopped - a leaf is
        checked field first, then operator, then value - so a `field`
        gap carries no `op` because the operator was never reached,
        while an `operator` gap carries the field it was used on.
      required: [kind, path, reason]
      properties:
        kind:
          type: string
          description: >
            Why this part has no counterpart. `field` and `operator`
            are the common two; `value` is a value outside the other
            side's domain (a rating that is not a whole number of
            stars); `shape` is a rule shape such as a negation that is
            not `notContains`; `sort`, `limit` and `entity` are the
            document's other clauses; `malformed` is import-only and
            means the document is broken rather than unmappable.
          enum: [field, operator, value, shape, sort, limit, entity, malformed]
        field:
          type: string
          description: The field this gap is about, where one is named.
        op:
          type: string
          description: The operator this gap is about, where one is named.
        value:
          description: >
            The offending value on a `value` gap, so a client can
            render it without picking `reason` apart. Any JSON type,
            since it is whatever the rule or the document held.
        path:
          type: string
          description: >
            An RFC 6901 JSON Pointer to the offending part, so an editor
            can point at it rather than describe it. On an export it
            dereferences against the playlist's `SmartRule` (`/root/...`,
            `/sorts/0`, `/limitMode`); on an import, against the document
            that was sent. The empty pointer is RFC 6901's whole
            document, which is what an import answers for a fault that
            has no one place - a document with no `all`/`any` root group,
            or with two.
        reason:
          type: string
          description: >
            The sentence the strict conversion would refuse with for
            this gap. Written by the converter about what the caller
            built, so a client renders it as-is rather than mapping it
            to a phrase of its own.

    NspReport:
      type: object
      description: >
        What one NSP mapping could not carry. `gaps` block the strict
        conversion and are what a `partial=true` conversion drops;
        `notes` are losses that block nothing, so a client mentions
        them without refusing. Both are empty when the mapping is
        lossless.
      required: [direction]
      properties:
        direction:
          type: string
          description: >
            Which way the mapping ran, and so whose vocabulary the
            gaps' `field` and `op` are written in.
          enum: [export, import]
        gaps:
          type: array
          description: >
            Losses that refuse the strict conversion.


            Deduplicated by `reason` and capped: a rule or a document
            repeating one problem is one problem, and the row a client
            draws per entry says nothing new the second time. `path`
            names the first place the problem was found. The strict
            refusal's message is composed from this same list, so a
            refusal and a report never disagree about what is wrong.
          maxItems: 12
          items:
            $ref: "#/components/schemas/NspGap"
        notes:
          type: array
          description: >
            Losses that refuse nothing. Deduplicated and capped the same
            way.
          maxItems: 12
          items:
            $ref: "#/components/schemas/NspGap"

    M3uImport:
      type: object
      description: An M3U8 document to import as a static playlist.
      required: [name, content]
      properties:
        name:
          type: string
          description: Name for the created playlist.
          minLength: 1
          maxLength: 200
        visibility:
          type: string
          description: "`private` (default) or `shared`."
        content:
          type: string
          description: The M3U8 document text.
          maxLength: 1048576

    M3uImportResult:
      type: object
      description: The import outcome.
      required: [playlist, matched, unmatched]
      properties:
        playlist:
          $ref: "#/components/schemas/Playlist"
        matched:
          type: integer
          description: Entries matched to cataloged items.
        unmatched:
          type: integer
          description: Entries no cataloged item matched.
        unmatchedPaths:
          type: array
          description: The unmatched entry paths, in document order.
          items:
            type: string

    PodcastShow:
      type: object
      description: >
        One globally cataloged show. Show privacy is a global, sticky
        property: a show becomes private when it is first subscribed
        with credentials or when any subscriber ever marks their
        subscription private, and it never becomes public again. For a
        private show, `feedUrl` is omitted from every response for
        every user, and the show is excluded from every user's OPML
        export: tokenized feed URLs and credentials are secrets.
        Privacy protects the URL and credentials only, never the
        show's existence or content, which any user with visibility
        into the podcast library can browse and play.
      required: [pid, title, sourceType]
      properties:
        pid:
          type: string
          description: Show PID.
          example: pc-01JZX5N8QW3F4V9T2B7KD3M9R6
        title:
          type: string
          description: Show title.
        author:
          type: string
          description: Show author or channel name.
        descriptionHtml:
          type: string
          description: >
            Show description as sanitized HTML (server-side allowlist;
            safe to render directly).
        feedUrl:
          type: string
          description: The feed URL. Omitted for private feeds.
        link:
          type: string
          description: The show's website, when the feed declares one.
        sourceType:
          type: string
          description: >
            Where the show comes from: `rss`, `youtube` (a channel or
            playlist through the acquisition bridge), or `manual` (a
            local-folder show). Open set; treat unknown values like
            `rss`.
          example: rss
        artUrl:
          type: string
          description: Origin-relative URL of the show's artwork endpoint.
          example: /api/v1/items/pc-01JZX5N8QW3F4V9T2B7KD3M9R6/art
        artSource:
          $ref: "#/components/schemas/ArtSource"
        episodeCount:
          type: integer
          description: Number of cataloged episodes.
        lastPublishedAt:
          type: string
          format: date-time
          description: Publication time of the newest cataloged episode.
        refreshDisabled:
          type: boolean
          description: >
            True when scheduled refresh is suspended after repeated feed
            failures. A successful manual refresh clears it.
        explicit:
          type: boolean
          description: >
            Feed-declared explicit flag for the whole show. Episodes
            carry their own flag, which wins where the feed sets both.
        funding:
          $ref: "#/components/schemas/PodcastFunding"
        medium:
          type: string
          description: >
            The show's declared medium from its feed's `<podcast:medium>`
            tag, lowercased (`podcast`, `music`, `audiobook`, ...). Open
            set; absent when the feed declares none.
          example: podcast
        persons:
          type: array
          description: >
            Show-level `<podcast:person>` credits (hosts, guests, and
            other roles). Populated on the show detail read only; absent
            on subscription list rows.
          items:
            $ref: "#/components/schemas/FeedPerson"

    SubscriptionSettings:
      type: object
      description: >
        The calling user's per-subscription settings. All fields are
        optional; an absent field means the server default. `PUT` replaces
        the whole object.
      properties:
        retentionKeep:
          type: integer
          nullable: true
          minimum: 0
          description: >
            Keep the newest N downloaded episode files for this user; 0
            means keep all. Null (or absent) means the server default,
            which is keep-all unless the administrator configured
            otherwise. The effective policy for a show is the most
            generous union across its subscribers, and removing a file
            never removes playback history (archive, not delete).
        autoDownload:
          type: boolean
          description: >
            Fetch new episodes to the server automatically as the feed
            publishes them. `autoDownloadFilter` narrows which ones.
        autoDownloadFilter:
          $ref: "#/components/schemas/EpisodeFilter"
        folder:
          type: string
          maxLength: 512
          description: >
            Folder path for organizing subscriptions, as segments joined
            by `/` (round-trips through OPML outline nesting).
        private:
          type: boolean
          description: >
            Mark the show private (see the show schema: privacy is
            global and sticky, hiding the feed URL everywhere and
            keeping the show out of every OPML export). Set
            automatically when subscribing with credentials. Setting
            this back to false does not un-private a show.
        speed:
          type: number
          format: double
          minimum: 0.5
          maximum: 3.5
          description: Playback speed override for this show.
        trimSilence:
          type: boolean
          description: Trim mapped silence spans when playing this show.
        voiceBoost:
          type: boolean
          description: Apply spoken-word loudness normalization for this show.
        skipIntroSeconds:
          type: integer
          minimum: 0
          maximum: 600
          description: Seconds to skip at the start of every episode.
        skipOutroSeconds:
          type: integer
          minimum: 0
          maximum: 600
          description: Seconds to skip at the end of every episode.

    EpisodeFilter:
      type: object
      description: >
        Which new episodes auto-download takes, matched by keyword
        against the episode title. Terms are matched case-insensitively
        as substrings; an empty or absent `include` admits every episode,
        and `exclude` wins over `include` where both match.

        Titles only. Descriptions and summaries are deliberately not
        matched: feed descriptions carry sponsor copy, show boilerplate,
        and in some feeds full transcripts, so a term matched against
        them fires on episodes a listener would never call a match and
        the behaviour stops being predictable from the row the user is
        looking at.

        A filter applies to future arrivals only. Editing it does not
        re-evaluate the backlog and does not unqueue or remove anything
        already fetched: it is a subscription policy going forward, not
        a query over history. It is consulted only where auto-download
        decides what a feed refresh just added, so `autoDownload` must
        be on for it to do anything, and a manual fetch is never
        filtered.

        The effective policy for a show is the union across its
        subscribers, matching retention: an episode is fetched when any
        subscriber with auto-download on has a filter that admits it.
      properties:
        include:
          type: array
          maxItems: 64
          description: >
            Take an episode only when its title contains one of these
            terms. Empty or absent takes every episode.
          items:
            type: string
            minLength: 1
            maxLength: 128
        exclude:
          type: array
          maxItems: 64
          description: >
            Skip an episode whose title contains one of these terms,
            even when `include` matched it.
          items:
            type: string
            minLength: 1
            maxLength: 128

    Subscription:
      type: object
      description: One subscription of the calling user.
      required: [show, settings, subscribedAt]
      properties:
        show:
          $ref: "#/components/schemas/PodcastShow"
        settings:
          $ref: "#/components/schemas/SubscriptionSettings"
        subscribedAt:
          type: string
          format: date-time
          description: When the caller subscribed.
        unplayedCount:
          type: integer
          description: >
            How many of this show's cataloged episodes the caller has
            never started: no saved position, and not past the played
            threshold (which is derived the same way `played` is
            everywhere else - from the position reached against the
            episode's duration, never from a listened-milliseconds
            ratio). Started counts as handled, so a badge stops asking
            for something already underway; the `unplayed` episode
            filter and the episode row's own unheard marker use this
            same definition.

            The whole backlog, not a window: this is the number a
            subscription tile shows, and a count drawn from whatever a
            client had loaded would claim to be the backlog while being
            a page of it. Counted against the episodes the caller can
            see, so an explicit episode hidden from this account is not
            in it.

    SubscriptionPage:
      type: object
      description: One keyset-paginated page of the caller's subscriptions.
      required: [items]
      properties:
        items:
          type: array
          description: Subscriptions in stable order.
          items:
            $ref: "#/components/schemas/Subscription"
        nextCursor:
          type: string
          description: Opaque cursor for the next page. Absent on the last page.

    PodcastDetail:
      type: object
      description: A show together with the caller's subscription state.
      required: [show, subscribed]
      properties:
        show:
          $ref: "#/components/schemas/PodcastShow"
        subscribed:
          type: boolean
          description: Whether the calling user follows this show.
        settings:
          $ref: "#/components/schemas/SubscriptionSettings"

    SubscribeRequest:
      type: object
      description: A subscription request.
      required: [url]
      properties:
        url:
          type: string
          minLength: 1
          maxLength: 2048
          description: >
            Feed URL, or a YouTube channel or playlist URL when
            `sourceType` is `youtube`.
        sourceType:
          type: string
          description: >
            Source kind: `rss` (default) or `youtube`. Open set for
            forward compatibility; servers reject values they do not
            support with `source-unavailable`.
          example: rss
        username:
          type: string
          maxLength: 256
          description: Basic-auth username for a private feed.
        password:
          type: string
          format: password
          maxLength: 256
          description: >
            Basic-auth password for a private feed. Stored sealed at
            rest; never returned by any endpoint.
        folder:
          type: string
          maxLength: 512
          description: Initial folder path for the subscription.

    RefreshResult:
      type: object
      description: Outcome of a feed refresh.
      required: [newEpisodes]
      properties:
        newEpisodes:
          type: integer
          description: Episodes that appeared in this refresh.

    OpmlImport:
      type: object
      description: An OPML document to import.
      required: [opml]
      properties:
        opml:
          type: string
          minLength: 1
          description: The OPML XML document, verbatim.

    OpmlImportEntry:
      type: object
      description: The import outcome for one OPML feed entry.
      required: [feedUrl]
      properties:
        feedUrl:
          type: string
          description: The feed URL from the document.
        title:
          type: string
          description: The show title, when the feed resolved.
        pid:
          type: string
          description: The subscribed show's PID, when the feed resolved.
        error:
          type: string
          description: Why this feed failed to subscribe, when it did.

    OpmlImportResult:
      type: object
      description: Per-feed outcomes of an OPML import.
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/OpmlImportEntry"

    EpisodeSummary:
      allOf:
        - $ref: "#/components/schemas/ItemSummary"
        - type: object
          description: Episode fields beyond the generic summary row.
          required: [showPid, downloaded, publishedAt]
          properties:
            showPid:
              type: string
              description: The show this episode belongs to.
              example: pc-01JZX5N8QW3F4V9T2B7KD3M9R6
            season:
              type: integer
              description: Season number, when the feed declares one.
            episodeNumber:
              type: integer
              description: Episode number, when the feed declares one.
            episodeType:
              type: string
              description: >
                Feed-declared episode type (`full`, `trailer`, `bonus`).
                Open set; treat unknown values like `full`.
            publishedAt:
              type: string
              format: date-time
              description: >
                Publication time. When the feed declares none, the
                server substitutes the time it first saw the episode,
                so ordering and paging stay total.
            downloaded:
              type: boolean
              description: >
                Whether the audio is on the server. This is not what
                decides whether the episode plays: an episode that is not
                downloaded still streams when `hasEnclosure` is true,
                relayed from the feed's own host by enclosure
                passthrough. What fetching adds is local bytes and the
                analysis that rides them, so silence trim, voice boost,
                and the skip map need it; the episode fetch endpoint
                queues the download.
            fetchState:
              type: string
              description: >
                Present while a server-side fetch is queued or after
                one failed: `queued` or `failed`. Absent otherwise.
                Open set; treat unknown values as `queued`.
            fetchError:
              type: string
              description: >
                Why the last fetch attempt failed (`fetchState` is
                `failed`). Retrying the fetch endpoint re-queues it.
            explicit:
              type: boolean
              description: Feed-declared explicit flag.
            hasTranscript:
              type: boolean
              description: Whether a transcript is available.
            hasEnclosure:
              type: boolean
              description: >
                Whether the feed named audio this server could relay for
                this episode: an enclosure URL, over http or https. True
                with `downloaded` false is the passthrough case, where
                the episode plays relayed from the feed's own host.

                False means the episode cannot play at all, and play-info
                answers `conflict`, so a client offering a play
                affordance should read this rather than assume an
                undownloaded episode is playable. True is a fact about
                the feed rather than a promise to the caller: a show
                whose feed needs credentials relays only for its own
                subscribers, so play-info may still answer `conflict` for
                someone reading an episode of a show they do not
                subscribe to. Treat it as the signal to offer play, not
                as a guarantee play succeeds.
      description: Compact episode representation for lists.

    EpisodePage:
      type: object
      description: One keyset-paginated page of a show's episodes.
      required: [items]
      properties:
        items:
          type: array
          description: Episodes, newest first.
          items:
            $ref: "#/components/schemas/EpisodeSummary"
        nextCursor:
          type: string
          description: Opaque cursor for the next page. Absent on the last page.

    Episode:
      allOf:
        - $ref: "#/components/schemas/EpisodeSummary"
        - type: object
          description: Detail fields beyond the episode summary.
          properties:
            descriptionHtml:
              type: string
              description: >
                Show notes as sanitized HTML (server-side allowlist; safe
                to render directly).
            link:
              type: string
              description: The episode's web page, when the feed declares one.
            chapters:
              type: array
              description: Chapter marks, ordered by `startMs`.
              items:
                $ref: "#/components/schemas/ChapterMark"
            persons:
              type: array
              description: >
                Episode-level `<podcast:person>` credits, layered on top
                of the show's credits for this episode.
              items:
                $ref: "#/components/schemas/FeedPerson"
            soundbites:
              type: array
              description: >
                Highlight clips the feed marks with `<podcast:soundbite>`,
                each a window into the episode audio.
              items:
                $ref: "#/components/schemas/Soundbite"
      description: Full detail for one episode.

    TranscriptCue:
      type: object
      description: One transcript cue.
      required: [startMs, text]
      properties:
        startMs:
          type: integer
          format: int64
          description: Cue start in milliseconds.
        endMs:
          type: integer
          format: int64
          description: Cue end in milliseconds, when the format carries one.
        text:
          type: string
          description: Cue text.
        speaker:
          type: string
          description: Speaker name, when the format carries one.

    Transcript:
      type: object
      description: An episode's transcript as ordered, time-coded cues.
      required: [format, cues]
      properties:
        format:
          type: string
          description: >
            Source format the cues were parsed from (`json`, `srt`,
            `vtt`, `text`). Cues from `text` transcripts carry a zero
            `startMs` and no `endMs`.
          example: vtt
        cues:
          type: array
          description: Cues ordered by `startMs`.
          items:
            $ref: "#/components/schemas/TranscriptCue"

    PodcastDirectoryEntry:
      type: object
      description: One podcast directory match.
      required: [name, feedUrl]
      properties:
        name:
          type: string
          description: Show name as the directory lists it.
        feedUrl:
          type: string
          description: >
            The show's RSS feed URL, ready to POST to `/podcasts`. A
            match with no usable feed URL is dropped server-side rather
            than returned as unsubscribable.
        author:
          type: string
          description: Publisher or author name.
        artworkUrl:
          type: string
          description: >
            Show artwork as the directory lists it, drawn directly by
            the client. There is no proxy for a directory match: cover
            art is addressed by show pid and a match has none until it
            is subscribed to.
        genre:
          type: string
          description: Primary directory genre.
          example: Music
        episodeCount:
          type: integer
          description: Directory-reported episode count, 0 when unknown.

    PodcastDirectoryResults:
      type: object
      description: Podcast directory matches.
      required: [entries]
      properties:
        entries:
          type: array
          description: Matches, best first.
          items:
            $ref: "#/components/schemas/PodcastDirectoryEntry"

    PodcastFunding:
      type: object
      description: >
        A show's funding pointer from its feed's `<podcast:funding>` tag:
        a donation or support URL with the label text the feed suggests.
      required: [url]
      properties:
        url:
          type: string
          description: Funding or support URL.
          example: https://example.com/support
        message:
          type: string
          description: Suggested call-to-action label for the link.

    FeedPerson:
      type: object
      description: >
        One person credited in a feed, from a `<podcast:person>` tag at
        the show or episode level.
      required: [name]
      properties:
        name:
          type: string
          description: The person's name.
        role:
          type: string
          description: >
            Their role, lowercased as the feed published it (`host`,
            `guest`, `producer`, ...). Open set; an absent role reads as
            `host`, the podcast namespace default.
        group:
          type: string
          description: >
            The role's grouping, lowercased (`cast`, `writing`, ...), when
            the feed declares one.
        img:
          type: string
          description: Portrait image URL, when the feed declares one.
        href:
          type: string
          description: Profile or information URL, when the feed declares one.

    Soundbite:
      type: object
      description: >
        One highlight clip of an episode from a `<podcast:soundbite>` tag:
        a window into the episode audio worth surfacing on its own.
      required: [startMs, durationMs]
      properties:
        startMs:
          type: integer
          format: int64
          description: Clip start offset into the episode, in milliseconds.
        durationMs:
          type: integer
          format: int64
          description: Clip length in milliseconds.
        title:
          type: string
          description: Clip title; absent means reuse the episode title.

    RadioStation:
      type: object
      description: One internet radio station in the shared library.
      required: [pid, name, streamUrl, createdAt]
      properties:
        pid:
          type: string
          description: Type-prefixed ULID.
          example: rs-01JZX5N8QW3F4V9T2B7KD3M9R6
        name:
          type: string
          description: Display name.
          example: FIP
        streamUrl:
          type: string
          description: The station's stream URL.
          example: https://icecast.radiofrance.fr/fip-midfi.mp3
        homepageUrl:
          type: string
          description: The station's website, when known.
        logoUrl:
          type: string
          description: >
            The station's own logo URL, when known: what an edit form
            shows and what the server fetches from. Do not render it
            directly - `GET /radio/stations/{pid}/logo` is where the
            picture comes from, and that endpoint's description records
            why this reverses the direct-fetch behavior documented here
            before. Its presence is still the signal there is a logo to
            ask for at all.
        createdAt:
          type: string
          format: date-time
          description: When the station was added.

    RadioStationList:
      type: object
      description: The whole station library.
      required: [stations]
      properties:
        stations:
          type: array
          description: Stations ordered by name.
          items:
            $ref: "#/components/schemas/RadioStation"

    RadioStationEdit:
      type: object
      description: Station fields for create and update.
      required: [name, streamUrl]
      properties:
        name:
          type: string
          description: Display name.
          minLength: 1
          maxLength: 200
        streamUrl:
          type: string
          description: The station's stream URL; http or https.
        homepageUrl:
          type: string
          description: The station's website.
        logoUrl:
          type: string
          description: Station logo URL.

    RadioPlayInfo:
      type: object
      description: A resolved, tokenized station stream.
      required: [url]
      properties:
        url:
          type: string
          description: >
            Origin-relative proxied stream URL carrying a short-lived
            media token.
          example: /media/radio/rs-01JZX5N8QW3F4V9T2B7KD3M9R6?mt=abc
        nowPlaying:
          type: string
          description: >
            The most recent in-stream ICY title the proxy observed for
            this station. Present only while a proxied listener has
            the stream open and the station publishes StreamTitle
            metadata; it reflects what the station last announced, not
            a guarantee of what is audible right now. The listener may
            be any user (stations are a shared library, so the field's
            presence reveals that someone on this server is streaming
            the station). The value is best-effort UTF-8 from an
            untrusted station and should be treated as plain display
            text; an empty announced title is reported as absent.
            Clients that show it should re-poll this endpoint on the
            order of every 15 seconds during playback. Every response
            carries a freshly tokenized url; while already playing,
            ignore the new url and keep the open stream (polling opens
            no new connection to the station). On a first request,
            before anyone has the stream open, the field is
            necessarily absent.
          example: Charlie Parker - Ornithology
        nowPlayingItemPid:
          type: string
          description: >
            A library track this server matched `nowPlaying` to, when it
            recognised one. Present so a full-screen player can draw the
            song's own cover art instead of the station logo; absent is
            the common case and is not a failure, so a client that
            cannot match must fall back to the station's artwork rather
            than showing a gap. The match is a best-effort text lookup
            against the catalog and is never authoritative: it does not
            mean this server is playing that file, and it is
            deliberately not used for scrobbling, which reports what the
            station announced.
          example: tr-01JZX5N8QW3F4V9T2B7KD3M9R6
        nowPlayingArtKey:
          type: string
          pattern: "^[0-9a-f]{32}$"
          description: >
            An opaque token naming the cover this server holds for what
            the station last announced, present only when it holds one.
            It covers both of the artwork rungs below the library match
            - the picture the station announced in its own stream, and
            the MusicBrainz lookup under that - and does two jobs: it
            says there is an image to ask for, and it is what makes the
            image URL change when the station changes what it is
            playing.


            Pass it as `v` on
            `GET /radio/stations/{pid}/now-playing-art`. A client that
            omits it gets a 404 - the endpoint is addressed by token, not
            by whatever is announced at the moment the image request
            lands, so the bytes behind one URL never change and the long
            `Cache-Control` they carry is true.


            The fetch behind it is asynchronous, so the field appears on
            a later poll rather than on the one that started it. Absent
            means draw the local match if there is one, then the station
            logo, then the station mark. A station that announces no
            picture of its own leaves this absent for good while the
            external rung is switched off.


            `nowPlayingArtSource` alongside it says which of the two
            rungs answered, so a face can caption the picture rather
            than presenting a third party's cover as the station's own.
          example: f822426bccd53e012a220bbf972752dc
        nowPlayingArtSource:
          $ref: "#/components/schemas/ArtSource"
        nowPlayingSaved:
          type: boolean
          description: >
            Whether the caller has already kept what the station is
            announcing, so the heart on a playing surface draws filled.
            Per caller rather than per station: saved songs are personal.
            Absent means the same as false and is what a response with no
            `nowPlaying` carries.


            This rides the poll the surfaces already run, which is what
            keeps the heart honest across devices: a save made on the
            phone fills the desktop's heart within one poll, and a
            rollover empties it. Membership is decided on the same
            identity the save uses - the parsed artist and title where
            the line splits, the raw line where it does not - so a
            listener who saved this song from another station sees it
            filled here too.
        nowPlayingSavedPid:
          type: string
          description: >
            The saved song's pid, present exactly when `nowPlayingSaved`
            is true. Carried so an untap can `DELETE /radio/saved/{pid}`
            without first fetching the list.
          example: rw-01JZX5N8QW3F4V9T2B7KD3M9R6

    RadioSavedSong:
      type: object
      description: >
        One song a listener kept off the air. Deliberately not a library
        item: nothing here plays, and the rows exist to be hunted down
        and crossed off.
      required: [pid, nowPlaying, stationName, heardAt, hasArt]
      properties:
        pid:
          type: string
          description: Type-prefixed ULID.
          example: rw-01JZX5N8QW3F4V9T2B7KD3M9R6
        nowPlaying:
          type: string
          description: >
            The announcement as the station sent it, snapshotted at save
            time. Best-effort UTF-8 from an untrusted host; treat as
            plain display text. This is what a row draws when nothing
            parsed out of it.
          example: Charlie Parker - Ornithology
        artist:
          type: string
          description: >
            The artist, where the announced line split into one. Absent
            is ordinary rather than a failure - stations announce in
            every shape there is - and a row without it still names the
            song by its raw line.


            **Album is deliberately absent from this schema.** ICY
            metadata is one line, so there is nothing honest to put in
            one; a row that names an album would be guessing.
          example: Charlie Parker
        title:
          type: string
          description: The song title, where the announced line split into one.
          example: Ornithology
        stationPid:
          type: string
          description: >
            The station this was heard on, when it is still in the
            library. Absent once the station is removed - the row
            outlives it, because what was kept is the song.
          example: rs-01JZX5N8QW3F4V9T2B7KD3M9R6
        stationName:
          type: string
          description: >
            The station's name as it was at save time, snapshotted so a
            row still says where it came from after a rename or a
            removal.
          example: FIP
        heardAt:
          type: string
          format: date-time
          description: When the listener kept it.
        inLibraryPid:
          type: string
          description: >
            A library track this server matched the row to, resolved at
            read time under the caller's own visibility. Present means
            the hunt is over and a client may say so; absent is the
            common case and the reason the list exists. The match is the
            same best-effort text lookup `nowPlayingItemPid` uses and is
            never authoritative, so it is a marker rather than a
            playable handle.
          example: tr-01JZX5N8QW3F4V9T2B7KD3M9R6
        hasArt:
          type: boolean
          description: >
            Whether a cover was snapshotted with this row, and so whether
            `GET /radio/saved/{pid}/art` has bytes to answer. False is
            ordinary: the picture is copied from whatever the artwork
            ladder held at save time, and most announcements have
            nothing on it. Draw a monogram, which is a designed state.

    RadioSavedSongPage:
      type: object
      description: One keyset-paginated page of saved songs.
      required: [songs]
      properties:
        songs:
          type: array
          description: Songs newest first.
          items:
            $ref: "#/components/schemas/RadioSavedSong"
        nextCursor:
          type: string
          description: Opaque cursor for the next page. Absent on the last page.

    RadioSavedSongCreate:
      type: object
      description: >
        The announcement a listener is keeping. Both fields describe what
        they saw rather than what the station is announcing by the time
        this request lands: a station rolls over every few minutes while
        a client polls every fifteen seconds, so a save resolved
        server-side against the live title would sometimes keep the next
        song instead of the tapped one.
      required: [stationPid, nowPlaying]
      properties:
        stationPid:
          type: string
          description: The station the song was heard on.
          example: rs-01JZX5N8QW3F4V9T2B7KD3M9R6
        nowPlaying:
          type: string
          description: >
            The announced line exactly as `nowPlaying` reported it. The
            server parses it the same way the scrobbler does and stores
            both the parse and the raw line.
          minLength: 1
          maxLength: 400
          example: Charlie Parker - Ornithology

    RadioDirectoryEntry:
      type: object
      description: One station directory match.
      required: [name, streamUrl]
      properties:
        name:
          type: string
          description: Station name as listed in the directory.
        streamUrl:
          type: string
          description: Resolved stream URL.
        homepageUrl:
          type: string
          description: Station website.
        logoUrl:
          type: string
          description: >
            Station logo URL as the directory lists it, carried so adding
            the station keeps it. There is no proxy for a directory match:
            the proxy addresses a station by pid and a match has none
            until it is added, so a search result draws a monogram disc
            and the logo appears once the station is in the library.
        tags:
          type: string
          description: Comma-separated directory tags.
          example: jazz,eclectic
        country:
          type: string
          description: Directory country name.
        codec:
          type: string
          description: Directory-reported stream codec.
          example: MP3
        bitrateKbps:
          type: integer
          description: Directory-reported bitrate in kbit/s, 0 when unknown.

    RadioDirectoryResults:
      type: object
      description: Station directory matches.
      required: [entries]
      properties:
        entries:
          type: array
          description: Matches, best first.
          items:
            $ref: "#/components/schemas/RadioDirectoryEntry"

    ReviewEntry:
      type: object
      description: >
        One review queue entry: an album-sized unit of files awaiting
        or past a matching decision. The unit decides as a whole.
      required: [id, kind, status, mediaType, origin, trackCount, createdAt, identifying]
      properties:
        id:
          type: string
          description: Entry pid.
          example: rv-01JZX5N8QW3F4V9T2B7KD3M9R6
        kind:
          type: string
          description: >
            What deciding does: `match` retags items already in the
            library; `import` additionally moves staged files (an
            upload or inbox batch) into the library. A string, not a
            closed enum.
          example: match
        status:
          type: string
          description: >
            Lifecycle state: `pending`, `applied`, `auto-applied`,
            `as-is`, `unofficial`, `skipped`, `discarded`, or
            `reverted`. A string, not a closed enum.
          example: pending
        mediaType:
          $ref: "#/components/schemas/MediaType"
        origin:
          type: string
          description: >
            Where the unit came from: `scan`, `upload`, or `rematch`.
            A string, not a closed enum.
          example: scan
        title:
          type: string
          description: Display title for the unit (the album guess).
        artist:
          type: string
          description: Display artist for the unit.
        trackCount:
          type: integer
          description: Files in the unit.
        libraryPid:
          type: string
          description: The library the unit belongs (or will import) to.
        uploadedBy:
          type: string
          description: >
            The uploader's user pid, present on upload-origin entries.
        identifying:
          type: boolean
          description: >
            True while the identify pipeline still runs for this
            entry; candidates and the best summary fill in when it
            finishes (the entry invalidates over the event channel).
        best:
          $ref: "#/components/schemas/CandidateSummary"
        appliedMbid:
          type: string
          description: >
            The MusicBrainz release id an `applied` or `auto-applied`
            entry applied.
        createdAt:
          type: string
          format: date-time
          description: When the entry was created.
        decidedAt:
          type: string
          format: date-time
          description: When the entry was decided.
        decidedBy:
          type: string
          description: >
            The deciding user's pid; absent on `auto-applied` entries.

    CandidateSummary:
      type: object
      description: The ranked-best candidate in one line.
      required: [mbid, title, artist, similarityPct]
      properties:
        mbid:
          type: string
          description: MusicBrainz release id.
        title:
          type: string
          description: Release title.
        artist:
          type: string
          description: Release artist.
        year:
          type: integer
          description: Release year, 0 when unknown.
        similarityPct:
          type: number
          format: double
          description: Match quality in percent (0 to 100).

    ReviewEntryPage:
      type: object
      description: One page of review entries.
      required: [entries]
      properties:
        entries:
          type: array
          description: Entries, newest first.
          items:
            $ref: "#/components/schemas/ReviewEntry"
        nextCursor:
          type: string
          description: Cursor for the next page; omitted on the last.

    ReviewTrack:
      type: object
      description: One file in a review unit with its current metadata.
      required: [path, title, durationMs]
      properties:
        pid:
          type: string
          description: >
            The catalog item pid; absent for staged files that have
            not entered the library yet.
        path:
          type: string
          description: >
            The file's path (library-relative for cataloged items,
            staging-relative for uploads).
        title:
          type: string
          description: Current title (tag, or cleaned filename).
        artist:
          type: string
          description: Current artist.
        trackNo:
          type: integer
          description: Current track number, 0 when untagged.
        discNo:
          type: integer
          description: Current disc number, 0 when untagged.
        durationMs:
          type: integer
          format: int64
          description: Audio length in milliseconds.

    CandidateComponent:
      type: object
      description: >
        One named contribution to a candidate's distance, so the queue
        explains a score instead of asserting it.
      required: [name, distance, weight]
      properties:
        name:
          type: string
          description: >
            The field or penalty: `artist`, `album`, `year`,
            `tracks`, `missing`, `extra`. A string, not a closed
            enum.
        distance:
          type: number
          format: double
          description: Component distance in 0 to 1 (0 is identical).
        weight:
          type: number
          format: double
          description: The component's share of the total.

    CandidatePairing:
      type: object
      description: >
        One proposed file-to-release-track pairing; the side-by-side
        diff renders current values (via `trackIndex` into the entry's
        tracks) against these proposed values.
      required: [trackIndex, position, title, distance]
      properties:
        trackIndex:
          type: integer
          description: Index into the entry's `tracks`.
        position:
          type: integer
          description: Proposed track number on the release.
        disc:
          type: integer
          description: Proposed disc number.
        title:
          type: string
          description: Proposed title.
        artist:
          type: string
          description: >
            Proposed per-track artist, present when it differs from
            the release artist (compilations).
        durationMs:
          type: integer
          format: int64
          description: The release track's length, 0 when unknown.
        recordingMbid:
          type: string
          description: The MusicBrainz recording id this pairing maps to.
        distance:
          type: number
          format: double
          description: The pairing's own distance in 0 to 1.

    ReviewCandidate:
      type: object
      description: One scored candidate release, ranked in the entry.
      required: [mbid, title, artist, similarityPct, pairings]
      properties:
        mbid:
          type: string
          description: MusicBrainz release id.
        releaseGroupMbid:
          type: string
          description: MusicBrainz release group id.
        title:
          type: string
          description: Release title.
        artist:
          type: string
          description: Release artist.
        year:
          type: integer
          description: Release year, 0 when unknown.
        mediaCount:
          type: integer
          description: Disc count, 0 when unknown.
        trackCount:
          type: integer
          description: Track count on the release.
        country:
          type: string
          description: Release country.
        label:
          type: string
          description: Label name.
        catalogNumber:
          type: string
          description: Label catalog number.
        compilation:
          type: boolean
          description: True for various-artists releases.
        similarityPct:
          type: number
          format: double
          description: Match quality in percent (0 to 100).
        components:
          type: array
          description: The distance breakdown.
          items:
            $ref: "#/components/schemas/CandidateComponent"
        pairings:
          type: array
          description: Proposed track pairings.
          items:
            $ref: "#/components/schemas/CandidatePairing"
        missingTitles:
          type: array
          description: >
            Titles of release tracks no file matched (the rip is
            missing them).
          items:
            type: string
        extraTrackIndexes:
          type: array
          description: >
            Indexes (into the entry's `tracks`) of files no release
            track matched (bonus or junk files).
          items:
            type: integer

    ReviewEntryDetail:
      allOf:
        - $ref: "#/components/schemas/ReviewEntry"
        - type: object
          description: The full entry with tracks and candidates.
          required: [tracks, candidates]
          properties:
            tracks:
              type: array
              description: The unit's files in disc and track order.
              items:
                $ref: "#/components/schemas/ReviewTrack"
            candidates:
              type: array
              description: Scored candidates, best first.
              items:
                $ref: "#/components/schemas/ReviewCandidate"
            identifyDeclined:
              type: boolean
              description: >
                The submission asked not to be identified, so the
                entry never entered the match queue. Absent means it
                did. What it tells a reader is why `candidates` is
                empty: nothing was searched, rather than searched and
                found nothing.


                Such an entry is normally already `as-is` - declining
                imports the files without stopping. Finding one still
                `pending` means the automatic import could not proceed
                and it is waiting for a person.
            identifyOverride:
              allOf:
                - $ref: "#/components/schemas/ReviewIdentifyRequest"
              description: >
                What the last re-identify searched for in place of the
                files' own tags. Absent when nothing was typed. The
                `tracks` below always report the tags the files carry,
                never this.


                Not named `override`: the Dart generator emits a
                property name verbatim, and `override` there collides
                with the language's own annotation.
            suggested:
              allOf:
                - $ref: "#/components/schemas/ReviewIdentifyRequest"
              description: >
                What the matching parse read out of the source's own
                title, offered as a starting point for a search rather
                than as a claim about the files. Present only on
                acquisitions of a single loose file, where the title is
                a video title and the artist tag is a channel; an
                album-shaped unit carries real tags and needs no guess.
                Never an album, since a loose track has none. A stored
                `identifyOverride` supersedes it.
      description: One review entry with its full evidence.

    ReviewIdentifyRequest:
      type: object
      description: >
        Values to search for in place of what an entry's files claim.
        Every field is optional and blank fields are dropped; a body
        with nothing in it clears a stored override.
      properties:
        artist:
          type: string
          maxLength: 300
          description: >
            Stands in for both the artist and the album artist while
            searching.
        album:
          type: string
          maxLength: 300
          description: The album title to search for.
        title:
          type: string
          maxLength: 300
          description: >
            The track title to search for. Ignored on a unit of
            several files: a track title belongs to one track, and
            naming them all the same thing would wreck the pairing
            that scores a release. Correct a multi-file unit with
            `artist` and `album`, which are properties of the unit.

    ReviewDecision:
      type: object
      description: A decision for one review entry.
      required: [action]
      properties:
        action:
          type: string
          enum: [approve, as-is, unofficial, skip, discard]
          description: The decision to apply.
        candidateMbid:
          type: string
          description: >
            The candidate to approve; the ranked best when absent.
            Only meaningful with `approve`.

    ReviewDecideResult:
      type: object
      description: The outcome of a single-entry decision.
      required: [entry]
      properties:
        entry:
          $ref: "#/components/schemas/ReviewEntry"
        warnings:
          type: array
          description: >
            Non-fatal problems (per-file write-back failures, roles
            without a tag form). The decision itself stood.
          items:
            type: string

    ReviewBulkDecision:
      type: object
      description: One decision applied to many entries.
      required: [entryIds, action]
      properties:
        entryIds:
          type: array
          minItems: 1
          maxItems: 200
          description: The entries to decide.
          items:
            type: string
        action:
          type: string
          enum: [approve, as-is, unofficial, skip, discard]
          description: >
            The decision. `approve` uses each entry's ranked best
            candidate.

    ReviewBulkResult:
      type: object
      description: Per-entry outcomes of a bulk decision.
      required: [results]
      properties:
        results:
          type: array
          description: One outcome per requested entry, in order.
          items:
            $ref: "#/components/schemas/ReviewBulkOutcome"

    ReviewBulkOutcome:
      type: object
      description: One entry's outcome in a bulk decision.
      required: [entryId, ok]
      properties:
        entryId:
          type: string
          description: The entry.
        ok:
          type: boolean
          description: Whether the decision applied.
        error:
          type: string
          description: Why it did not, when `ok` is false.

    ReviewStats:
      type: object
      description: Queue depth and auto-apply calibration.
      required: [pending, applied, autoApplied, reverted, revertedAutoApplied]
      properties:
        pending:
          type: integer
          description: Entries awaiting a decision.
        identifying:
          type: integer
          description: Entries whose identify pipeline still runs.
        applied:
          type: integer
          description: Entries a person approved.
        autoApplied:
          type: integer
          description: Entries the engine applied on its own.
        asIs:
          type: integer
          description: Entries accepted as they were.
        unofficial:
          type: integer
          description: Entries marked as having no canonical release.
        skipped:
          type: integer
          description: Entries dismissed without action.
        reverted:
          type: integer
          description: Applied entries later reverted, total.
        revertedAutoApplied:
          type: integer
          description: >
            Auto-applied entries later reverted; with `autoApplied`
            this is the observed auto-apply revert rate, the trust
            signal the queue surfaces.

    LibraryMatching:
      type: object
      description: A library's automatic matching behavior.
      required: [mode]
      properties:
        mode:
          type: string
          # "off" is quoted deliberately: YAML 1.1 parsers (the Dart
          # generator's among them) read a bare off as boolean false,
          # which silently became a "false" wire value once already.
          enum: [auto, review, "off"]
          description: The matching mode.

    Scrobbler:
      type: object
      description: One outbound scrobbling connection slot.
      required: [service, available, connected]
      properties:
        service:
          type: string
          description: >
            `lastfm` or `listenbrainz`. A string, not a closed enum;
            clients must skip services they do not recognize.
          example: listenbrainz
        available:
          type: boolean
          description: >
            True when the server can offer this service (Last.fm
            requires server-configured API credentials).
        connected:
          type: boolean
          description: True when the caller has linked an account.
        username:
          type: string
          description: >
            The linked account's username, when the service reports
            one.
        apiUrl:
          type: string
          description: >
            The API base a ListenBrainz-compatible connection points
            at. Absent for listenbrainz.org and for Last.fm.
        lastSuccessAt:
          type: string
          format: date-time
          description: >
            When this connection last delivered a scrobble. Absent
            until the first delivery succeeds. Reconnecting resets
            it: the stamp belongs to the current credential.
        lastError:
          type: string
          maxLength: 300
          description: >
            The most recent delivery failure, present only while the
            connection is unhealthy: set when a delivery attempt
            fails, cleared by the next successful delivery and by
            reconnecting. A connection can carry both lastSuccessAt
            and lastError (it worked before it broke). A short
            human-readable summary suitable for display; never
            contains the credential. All three delivery stamps are
            absent whenever connected is false.
        lastErrorAt:
          type: string
          format: date-time
          description: >
            When lastError was recorded. Present exactly when
            lastError is.

    ScrobblerList:
      type: object
      description: The caller's scrobbling connection slots.
      required: [scrobblers]
      properties:
        scrobblers:
          type: array
          description: One entry per known service.
          items:
            $ref: "#/components/schemas/Scrobbler"

    ListenBrainzConnect:
      type: object
      description: A ListenBrainz user token to link.
      required: [token]
      properties:
        token:
          type: string
          description: The user token from the ListenBrainz profile page.
          minLength: 1
        apiUrl:
          type: string
          description: >
            Base URL of a ListenBrainz-compatible API server. Omit for
            listenbrainz.org.

    LastfmConnectStart:
      type: object
      description: The Last.fm authorization hand-off.
      required: [authUrl]
      properties:
        authUrl:
          type: string
          description: >
            The Last.fm authorization URL to open in a browser; it
            redirects back to this server's callback on approval.

    Share:
      type: object
      description: One public share link.
      required:
        [pid, url, targetPid, targetKind, targetTitle, allowDownload,
         createdAt, plays]
      properties:
        pid:
          type: string
          description: Share PID.
          example: sh-01JZX5N8QW3F4V9T2B7KD3M9R6
        url:
          type: string
          description: >
            Origin-relative capability URL of the landing page.
            Anyone holding the full URL can open it; treat it as the
            secret it is.
          example: /s/01JZX5N8QW3F4V9T2B7KD3M9R6.aBcDeFgHiJkLmNoPqRsTuV
        targetPid:
          type: string
          description: The shared track, album, playlist, book, or episode.
          example: tr-01JZX5N8QW3F4V9T2B7KD3M9R6
        targetKind:
          type: string
          description: >
            What kind of thing the share opens: `track`, `album`,
            `playlist`, `book`, or `episode`. A string, not a closed
            enum; clients must tolerate an unknown kind (render a
            generic label) rather than fail.
          example: album
        targetTitle:
          type: string
          description: The target's display title at read time.
          example: Prancing Pony Blues
        allowDownload:
          type: boolean
          description: Whether the landing page offers the original file.
        positionMs:
          type: integer
          format: int64
          description: >
            Start position for copy-link-at-timestamp shares
            (episodes). Absent otherwise.
        createdAt:
          type: string
          format: date-time
          description: When the share was created.
        expiresAt:
          type: string
          format: date-time
          description: >
            When the link stops resolving. Absent for links without
            expiry.
        plays:
          type: integer
          description: Anonymous plays through the link so far.
        owner:
          type: string
          description: >
            Who minted the link: display name, or username where no
            display name is set. Populated only on the `all=true`
            listing, where the rows come from every account; on a
            caller's own listing every row would name the caller, so
            the field is absent there.
          example: rowan

    SharePage:
      type: object
      description: One page of share links, newest first.
      required: [shares]
      properties:
        shares:
          type: array
          items:
            $ref: "#/components/schemas/Share"
        nextCursor:
          type: string
          description: Opaque cursor for the next page; absent on the last page.

    ShareCreate:
      type: object
      description: A new share link.
      required: [pid]
      properties:
        pid:
          type: string
          description: >
            The track (`tr-`), album (`al-`), playlist (`pl-`), book
            (`bk-`), or episode (`ep-`) to share. An album share opens
            the album's tracks in order. Must be visible to the caller.
          example: tr-01JZX5N8QW3F4V9T2B7KD3M9R6
        expiresInHours:
          type: integer
          minimum: 1
          maximum: 8760
          description: >
            Lifetime in hours from creation. Omitted means the link
            never expires (it can still be revoked).
        allowDownload:
          type: boolean
          default: false
          description: >
            Offer the original file on the landing page. Requires the
            caller's own download permission.
        positionMs:
          type: integer
          format: int64
          minimum: 0
          description: >
            Start position for copy-link-at-timestamp (episodes only;
            `invalid-request` on other kinds).

    SimilarityStatus:
      type: object
      description: Coverage of the sonic-similarity surface.
      required: [enabled, embeddedTracks, totalTracks, coveragePct, queueDepth]
      properties:
        enabled:
          type: boolean
          description: >
            Whether an analyzer can feed this surface: the server's
            embedded analyzer is running, or an external worker token
            is configured.
        model:
          type: string
          description: >
            The embedding model the stored vectors carry. Absent before
            the first ingest.
          example: waxdeck-melstat-v1
        dims:
          type: integer
          description: Stored vector dimensionality. Absent before the first ingest.
          example: 192
        embeddedTracks:
          type: integer
          description: Tracks with a stored embedding.
        totalTracks:
          type: integer
          description: Tracks eligible for analysis.
        coveragePct:
          type: number
          description: >
            `embeddedTracks` over `totalTracks`, 0 to 100. Clients
            show sonic affordances when coverage is meaningful.
        queueDepth:
          type: integer
          description: Tracks awaiting analysis.
        lastIngestAt:
          type: string
          format: date-time
          description: >
            When a worker last posted embeddings. Absent before the
            first ingest.

    SimilarityWorkPage:
      type: object
      description: A leased batch of analysis work.
      required: [items, retryAfterSeconds]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SimilarityWorkItem"
        retryAfterSeconds:
          type: integer
          description: >
            How long an idle worker should sleep before polling again.
            Meaningful when `items` is empty.

    SimilarityWorkItem:
      type: object
      description: One track awaiting embedding.
      required: [pid, essence, audioUrl, durationMs, mediaType]
      properties:
        pid:
          type: string
          description: The track to analyze.
          example: tr-01JZX5N8QW3F4V9T2B7KD3M9R6
        essence:
          type: string
          description: >
            The track's audio-essence hash. Echo it back with the
            vector; embeddings are keyed by essence so identical audio
            never re-analyzes.
        audioUrl:
          type: string
          description: >
            Origin-relative URL serving decode-ready audio (16 kHz
            mono, gain untouched). Append `format=flac` for lossless
            at roughly half the bytes (remote workers); the default is
            WAV. Authenticate with the same worker token.
          example: /media/analysis/tr-01JZX5N8QW3F4V9T2B7KD3M9R6
        localPath:
          type: string
          description: >
            Library-relative path of the source file, present only
            when the server is configured to expose paths to same-host
            workers (`WAXDECK_WORKER_LOCAL_PATHS`); such workers mount
            the library read-only and decode locally instead of
            pulling audio over HTTP.
        durationMs:
          type: integer
          format: int64
          description: Track duration in milliseconds.
        mediaType:
          $ref: "#/components/schemas/MediaType"

    EmbeddingReport:
      type: object
      description: A batch of computed embeddings.
      required: [model, dims, embeddings]
      properties:
        model:
          type: string
          minLength: 1
          maxLength: 128
          description: >
            Model and version tag the vectors were computed with.
            Vectors of different models never compare; changing the
            tag restarts coverage.
          example: waxdeck-melstat-v1
        dims:
          type: integer
          minimum: 8
          maximum: 4096
          description: Vector dimensionality; every vector's length must match.
        embeddings:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/EmbeddingUpload"

    EmbeddingUpload:
      type: object
      description: One track's embedding.
      required: [pid, essence, vector]
      properties:
        pid:
          type: string
          description: The analyzed track (from the work item).
          example: tr-01JZX5N8QW3F4V9T2B7KD3M9R6
        essence:
          type: string
          description: The audio-essence hash (from the work item).
        vector:
          type: array
          minItems: 8
          maxItems: 4096
          description: >
            The embedding. The server L2-normalizes vectors at ingest,
            so any consistent scale works.
          items:
            type: number

    EmbeddingIngestResult:
      type: object
      description: Outcome of an embedding ingest batch.
      required: [accepted, replaced]
      properties:
        accepted:
          type: integer
          description: Vectors stored for the first time.
        replaced:
          type: integer
          description: Vectors that overwrote a stored one (re-analysis).
        rejected:
          type: array
          description: Vectors the server refused, and why.
          items:
            $ref: "#/components/schemas/RejectedEmbedding"

    RejectedEmbedding:
      type: object
      description: One refused embedding.
      required: [code, message]
      properties:
        pid:
          type: string
          description: The refused item's pid, when it was parseable.
        essence:
          type: string
          description: The refused item's essence hash, when it was parseable.
        code:
          type: string
          description: >
            Stable machine-readable reason (`not-found`,
            `invalid-request`).
        message:
          type: string
          description: Human-readable explanation.

    ListeningStats:
      type: object
      description: Aggregated listening time for one user.
      required: [range, bucket, timezone, totalMs, sessions, timeSavedMs, buckets, byMediaType]
      properties:
        range:
          type: string
          description: The range that was aggregated.
          enum: [7d, 30d, 90d, 365d, all]
        bucket:
          type: string
          description: The bucket size used.
          enum: [day, week, month]
        timezone:
          type: string
          description: >
            IANA timezone the calendar bucketing used (the caller's
            preference, `UTC` when unset).
          example: America/Denver
        totalMs:
          type: integer
          format: int64
          description: Total milliseconds listened in the range.
        sessions:
          type: integer
          description: Listen sessions in the range.
        timeSavedMs:
          type: integer
          format: int64
          description: >
            Milliseconds saved by silence trimming and speed-up in the
