        Starts the catalog's enrichment pass as a background job
        (identity resolution first, then providers in priority
        order, provider-paced). `force` re-enriches entities that
        already enriched once. Locked and unofficial-marked content
        is respected. Returns the catalog job to follow.
        Administrators only.


        Refuses with `source-unavailable` when the server has no
