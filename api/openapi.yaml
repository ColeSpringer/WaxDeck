        sessions:
          type: integer
          description: Listen sessions.

    ListeningHeatmap:
      type: object
      description: Per-day listening for one calendar year, plus streaks.
      required: [year, timezone, days, currentStreakDays, longestStreakDays]
      properties:
        year:
          type: integer
          description: The calendar year.
          example: 2026
        timezone:
          type: string
          description: IANA timezone the days were bucketed in.
          example: America/Denver
        days:
          type: array
          description: Days with listening, chronological.
          items:
            $ref: "#/components/schemas/HeatmapDay"
        currentStreakDays:
          type: integer
          description: >
            Consecutive listening days ending today or yesterday, in
            the caller's timezone. Crosses year boundaries. 0 when the
            streak is broken.
        longestStreakDays:
          type: integer
          description: >
            The longest run of consecutive listening days that touches
            the requested year. Crosses year boundaries.

    HeatmapDay:
      type: object
      description: One day's listening.
      required: [date, ms, sessions]
      properties:
        date:
          type: string
          format: date
          description: The calendar day in the caller's timezone.
        ms:
          type: integer
          format: int64
          description: Milliseconds listened that day.
        sessions:
          type: integer
          description: Listen sessions that day.

    TopList:
      type: object
      description: One ranked top list.
      required: [kind, range, entries]
      properties:
        kind:
          type: string
          description: Which top list this is.
          enum: [artists, albums, genres, shows]
        range:
          type: string
          description: The range that was aggregated.
          enum: [7d, 30d, 90d, 365d, all]
        entries:
          type: array
          description: Ranked entries, most listening time first.
          items:
            $ref: "#/components/schemas/TopEntry"

    TopEntry:
      type: object
      description: One top-list entry.
      required: [name, plays, ms]
      properties:
        name:
          type: string
          description: Display name (artist, album, genre, or show).
          example: Muddy Waters
        pid:
          type: string
          description: >
            The entry's pid when the entry is a catalog entity (absent
            for genres, and for names that no longer resolve).
          example: ar-01JZX5N8QW3F4V9T2B7KD3M9R6
        artUrl:
          type: string
          description: >
            Origin-relative artwork URL, when the entry has one.
          example: /api/v1/items/tr-01JZX5N8QW3F4V9T2B7KD3M9R6/art
        plays:
          type: integer
          description: Listen sessions attributed to the entry in the range.
        ms:
          type: integer
          format: int64
          description: Milliseconds listened in the range.

    ListenLogPage:
      type: object
      description: One page of the caller's listen session log, newest first.
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/ListenLogEntry"
        nextCursor:
          type: string
          description: Opaque cursor for the next page; absent on the last page.

    ListenLogEntry:
      type: object
      description: One recorded listen session.
      required: [pid, mediaType, startedAt, msPlayed, finished, client, source]
      properties:
        pid:
          type: string
          description: The item that was played.
          example: tr-01JZX5N8QW3F4V9T2B7KD3M9R6
        title:
          type: string
          description: >
            The item's display title at read time. Absent when the
            item has left the catalog entirely.
        artist:
          type: string
          description: The item's display artist, author, or show.
        mediaType:
          $ref: "#/components/schemas/MediaType"
        startedAt:
          type: string
          format: date-time
          description: When playback started.
        msPlayed:
          type: integer
          format: int64
          description: Milliseconds actually heard.
        skippedMs:
          type: integer
          format: int64
          description: >
            Milliseconds saved by silence trimming and speed-up, when
            the client reported them.
        finished:
          type: boolean
          description: Whether playback reached the end of the item.
        client:
          type: string
          description: The reporting client label.
          example: waxdeck-web
        source:
          type: string
          description: "`live` playback or a backdated `import`."
          enum: [live, import]

    YearInReview:
      type: object
