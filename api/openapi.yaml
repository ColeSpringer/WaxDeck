        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /library/items:
    get:
      operationId: listItems
      summary: Browse library items
      description: >
        Keyset-paginated list of library items, optionally filtered by media
        type and by one bucket of a browse dimension. Ordering is stable
        (title, then pid) so cursors never skip or duplicate.
      tags: [library]
      parameters:
        - name: mediaType
          in: query
          description: Restrict results to one media type.
          schema:
            $ref: "#/components/schemas/MediaType"
        - name: facet
          in: query
          description: >
            Restrict results to one bucket of a browse dimension, taking
            the same dimension names `/library/facets` enumerates.
            Composes with `mediaType`. The pair is keyed on `facet`
            alone: an absent or empty `facetKey` selects the dimension's
            unknown bucket, which is a real bucket the enumeration
            returns, so it is a drill rather than a missing argument.
          schema:
            $ref: "#/components/schemas/BrowseDimension"
        - name: facetKey
          in: query
          description: >
            The bucket to drill, as returned in the enumeration's `key`.
            Send it empty to select the dimension's unknown bucket (the
            items the dimension is absent from, such as `[Non-Album]`);
            `kind` and custom tag dimensions have no unknown bucket and
            reject an empty key. Ignored without `facet`.
          schema:
            type: string
        - name: cursor
          in: query
          description: >
            Opaque keyset cursor from a previous page's `nextCursor`. Omit for
            the first page. A cursor carries the scope it was issued
            under, so reusing one with a changed `mediaType` or `facet`
            is `invalid-request` rather than a quietly wrong window.
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum items per page.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: One page of items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /library/browse:
    get:
      operationId: browseList
      summary: Browse a discovery list
      description: >
        Keyset-paginated discovery lists over the whole library: newest,
        recently added, most played, recently played, random, starred,
        alphabetical, never played, and rediscover. Play-derived lists
        reflect the calling user's own listening state.

        Most lists span every media type. `newest` does not: it orders by
        release year, which a podcast episode has not got, so it covers
        music and audiobooks only. Pairing it with `mediaType=podcast`,
        or drilling its `kind` dimension to `episode`, is
        `invalid-request` rather than an empty page that would read as
        "your library holds none". Episodes ordered by publication date
        live on `/podcasts/episodes`.
      tags: [library]
      parameters:
        - name: list
          in: query
          required: true
          description: Which discovery list to page through.
          schema:
            $ref: "#/components/schemas/DiscoveryList"
        - name: mediaType
          in: query
          description: >
            Restrict the list to one media type, for a domain-scoped shelf
            ("recently added albums" on the music hub). Composes with every
            list, and narrows the list itself rather than the page, so a
            filtered page comes back full. A caller with restricted library
            visibility can still get a short page that carries a cursor,
            which is the contract's standing rule everywhere.
          schema:
            $ref: "#/components/schemas/MediaType"
        - name: facet
          in: query
          description: >
            Restrict the list to one bucket of a browse dimension, taking
            the same dimension names `/library/facets` enumerates and the
            same bucket keys `/library/items` drills. Composes with
            `mediaType` and with every list, so a shuffle can be scoped to
            one artist, genre, or year, and it is the same filter the
            bucket's own listing uses: a bucket's count, the list it opens,
            and a shuffle over it can never disagree.

            Keyed on `facet` alone, exactly as on `/library/items`: an
            absent or empty `facetKey` selects the dimension's unknown
            bucket.
          schema:
            $ref: "#/components/schemas/BrowseDimension"
        - name: facetKey
          in: query
          description: >
            The bucket to scope to, as returned in the enumeration's
            `key`. Send it empty to select the dimension's unknown bucket;
            `kind` and custom tag dimensions have no unknown bucket and
            reject an empty key. Ignored without `facet`.
          schema:
            type: string
        - name: seed
          in: query
          description: >
            Shuffle seed for the `random` list. The same seed pages through
            the same shuffled order, so paging stays stable. When omitted the
            server picks a fresh seed and returns it as the page's `seed`;
            pass that value back with the cursor for later pages.
          schema:
            type: integer
            format: int64
        - name: cursor
          in: query
          description: >
            Opaque keyset cursor from a previous page's `nextCursor`. Omit for
            the first page.

            A cursor carries the scope it was issued under - the list, the
            seed, and the `mediaType`/`facet`/`facetKey` filter - and
            reusing one under a different scope is `invalid-request`. It
            names a position in a seeded permutation, so under another
            seed it would name a position in a different permutation
            entirely; refusing it is the only honest answer.
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum items per page.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: One page of the list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /library/facets:
    get:
      operationId: listFacets
      summary: Enumerate a browse dimension
      description: >
        Keyset-paginated buckets of one browse dimension, each with the
        number of matching items: the "all genres" and "all artists"
        lists a browse index is built from. Buckets come biggest first
        by default, ties broken by label, so the list leads with what is
        worth opening and paging stays stable; `sort=label` orders them
        A to Z instead, for an index with an alphabet rail. Drill a
        bucket by passing its `key` back as `listItems`' `facetKey`
        together with the same `facet`.

        A cursor is only valid for the `sort` and the scope it was
        issued under: the two orders interleave differently, so resuming
        one from the other's boundary would skip or repeat buckets, and
        a scope change is a different bucket list entirely. Sending a
        mismatched pair is `invalid-request` rather than a silently
        wrong page.

        The `genre`, `artist`, `credit-artist`, `album-artist`, `album`,
        `release-group`, and `year` dimensions each carry a bucket for
        the items the dimension is absent from (`[No Genre]`,
        `[Unknown Artist]`, `[Non-Album]`, `[No Release Group]`,
        `[Unknown Year]`), with an empty `key` and `unknown` true.
        `[No Release Group]` is not `[Non-Album]`: a track on an album
        whose release group is unresolved is in the first and not the
        second.

        `genre` and `credit-artist` are the two many-per-item
        dimensions: an item contributes a count to every bucket it
        belongs to, so their bucket counts sum to more than the number
        of items. Every other dimension buckets an item exactly once.
        `kind` has none, because an item's kind is never absent, and a
        custom tag dimension has none, because only items carrying the
        key contribute at all; on those two, drilling an empty
        `facetKey` is `invalid-request` rather than an empty page.
        Podcast episodes are excluded from the music dimensions, which
        they have no artist, album, genre, or year for; the `kind`
        dimension counts them.

        Counts are scoped to the libraries the caller may see. The
        per-item rules the drill list also applies (podcast subscriptions,
        content rules) are per-item decisions no aggregation can express,
        so a bucket can read higher than the list it opens, the same way
        any restricted listing can return a short page.
      tags: [library]
      parameters:
        - name: dimension
          in: query
          required: true
          description: Which browse dimension to enumerate.
          schema:
            $ref: "#/components/schemas/BrowseDimension"
        - name: facet
          in: query
          description: >
            Restrict the enumeration to one bucket of a *second* browse
            dimension, taking the same dimension names this endpoint
            enumerates. The albums an artist is credited on are
            `dimension=album` scoped by `facet=credit-artist`: album
            buckets, counted over that artist's items only.


            The pair is keyed on `facet` alone: an absent or empty
            `facetKey` selects the scope dimension's unknown bucket,
            exactly as it does on `/library/items`. Scoping by the
            dimension being enumerated is `invalid-request` - it would
            answer the one bucket it was given.


            A scoped enumeration is computed per request rather than
            served from the enumeration cache, since the scopes are
            per-entity and unbounded; it is bounded instead by the
            scope, which is what makes it cheap.
          schema:
            $ref: "#/components/schemas/BrowseDimension"
        - name: facetKey
          in: query
          description: >
            The scope bucket, as returned in that dimension's `key`.
            Send it empty to scope to the dimension's unknown bucket;
            `kind` and custom tag dimensions have no unknown bucket and
            reject an empty key. Ignored without `facet`.
          schema:
            type: string
        - name: sort
          in: query
          description: >
            Bucket order. `count` (the default) is biggest first, ties
            broken by label then key. `label` is A to Z by the bucket's
            display label, folded for ordering (case and accents, so
            "Édith" files under E), ties broken by key; the unknown
            bucket sorts last under it, since a sentinel has no place in
            an alphabet.
          schema:
            $ref: "#/components/schemas/FacetSort"
        - name: cursor
          in: query
          description: >
            Opaque cursor from a previous page's `nextCursor`. Omit for
            the first page. Valid only with the `sort` it was issued
            under.
          schema:
            type: string
        - name: startsAt
          in: query
          description: >
            Start the page at the first bucket whose display label sorts
            at or after this prefix, folded the same way `sort=label`
            folds (case, accents and compatibility forms, and leading
            whitespace ignored). This is what an alphabet rail taps:
            `startsAt=m` on a library that jumps from L to N answers the
            first N bucket rather than nothing, since the comparison is
            at-or-after and not equality.

            Requires `sort=label`; with the default `count` order it is
            `invalid-request`, because a prefix names no position in a
            biggest-first list. Sending it together with `cursor` is
            `invalid-request` too: a cursor already names a position.
            A prefix past the last bucket is an empty page with no
            `nextCursor`, not an error. The unknown bucket is not
            seekable, since it sorts last whatever its sentinel spells;
            paging to the end still reaches it.
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum buckets per page.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: One page of buckets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacetPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /library/search:
    get:
      operationId: search
      summary: Search the library
      description: >
        Full-text search across artists, albums, tracks, books, and episodes.
        Results are grouped by kind and ranked within each group; each group
        is capped at `limit` hits.
      tags: [library]
      parameters:
        - name: q
          in: query
          required: true
          description: Search query. Must contain at least one non-whitespace character.
          schema:
            type: string
            minLength: 1
        - name: limit
          in: query
          description: Maximum hits per result group.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Grouped search results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /library/entities:
    post:
      operationId: resolveEntities
      summary: Resolve a list of entity PIDs to cards
      description: >
        Batch read of the display facts behind a list of entity PIDs:
        what a shelf needs to draw a card for something a client holds
        only a handle for. A POST because the PID list rides the body
        (as `/play-states`); nothing changes server-side.


        Albums (`al-`), artists (`ar-`), release groups (`rg-`),
        playlists (`pl-`), podcast shows (`pc-`), and books (`bk-`) may
        be asked for, in any mix. A book is an item and the rest are
        entities; the response flattens that difference, because a card
        does not have one.


        Answers are in request order, and that is the contract rather
        than an implementation detail: the caller's list is already
        ordered (a pinned shelf), so preserving it here is what keeps
        the shelf from reshuffling under a thumb.


        PIDs the caller cannot be answered for are silently omitted
        rather than erroring: unknown, deleted, merged away, or in a
        library outside the caller's grant all leave the list one card
        shorter, which is what `Prefs.pinned` describes for a departed
        entity. A response shorter than the request is normal, and an
        empty request is an empty response.


        Of the omissions, `departed` names the subset that is gone for
        everyone - deleted, merged away, or never real - as opposed to
        merely out of this caller's sight today (a grant, a lapsed
        subscription, the trash), which stays an unnamed omission. A
        client holding a pinned list may prune exactly the departed
        pids; pruning an unnamed omission would turn a state that can
        end into a loss that cannot.
      tags: [library]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntityCardQuery"
      responses:
        "200":
          description: Cards for the PIDs that resolved, in request order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityCardList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /albums/{pid}:
    get:
      operationId: getAlbum
      summary: Get one album's identity
      description: >
        The release facts that belong to the album entity rather than to
        any of its tracks: barcode, label, catalog number, media, and
        country, beside the title and counts a header already derives.


        These live on the entity because that is where the catalog keeps
        them - an item row carries what the file is, and an edition is
        what the release is - so a screen deriving an album from its
        tracks can reach the first set and not the second. This is the
        read half of the `editEntity` write surface.


        The `pid` must be an album (`al-`); anything else is `not-found`
        rather than a wrong-shaped answer. Absent fields are omitted:
        most releases carry none of the five, and an album with nothing
        to say answers the identity fields empty rather than blank.
      tags: [library]
      parameters:
        - $ref: "#/components/parameters/Pid"
      responses:
        "200":
          description: The album.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlbumDetail"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /items/{pid}:
    get:
      operationId: getItem
      summary: Get one item's detail
      description: Full detail for a single library item.
      tags: [library]
      parameters:
        - $ref: "#/components/parameters/Pid"
      responses:
        "200":
          description: The item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /items/{pid}/art:
    get:
      operationId: getItemArt
      summary: Get artwork
      description: >
        Artwork as image bytes: the original at full size, or a square-fit
        thumbnail when `size` is given. Besides item PIDs this endpoint also
        accepts album (`al-`), artist (`ar-`), podcast show (`pc-`), and
        playlist (`pl-`) PIDs, so search hits, subscription lists, and
        playlist grids can render artwork directly. A playlist answers its
        own cover, whether the owner uploaded one or the server built it
        from the members, and follows the same visibility rule as every
        other playlist read. Items without any artwork in their fallback
        chain return 404. Responses carry a content-addressed `ETag`; revalidate with
        `If-None-Match` instead of refetching.


        Responses are cacheable for a day and reusable while revalidating
        for a week (`Cache-Control`), so a warm grid paints from the cache
        instead of spending a conditional GET per cover. The bytes are
        per-caller (artwork follows the item's visibility), so the
        directive is `private` and the response varies by the credential
        presented (`Cookie` or `Authorization`): a browser shared by two
        accounts must not answer one from the other's cache.


        A URL names a PID and a size, not the bytes behind them, so a
        client that replaces an entity's artwork has to defeat its own
        caches: vary `v` to do it.


        The 200 carries the answering image's provenance in
        `X-Art-Source`, `X-Art-Provider`, `X-Art-Source-Url`, and
        `X-Art-Level` - the same four values `ArtSource` reports as JSON.
        They are here because a byte-serving endpoint that says nothing
        about where its bytes came from is the wrong shape for a
        third-party consumer. WaxDeck's own clients read the JSON
        instead: a browser gives a caller no access to the response
        headers behind an `<img>`, so the header form cannot reach the
        platform where the mark is most likely to be seen.
      tags: [library]
      parameters:
        - $ref: "#/components/parameters/Pid"
        - name: role
          in: query
          description: >
            Which artwork slot to read. Only `front` (the default) walks the
            album/artist fallback chain; `back`, `disc`, `booklet`, and
            `background` resolve at the requested entity's own level and 404
            when that entity holds no image in the slot.
          schema:
            $ref: "#/components/schemas/ArtRole"
        - name: size
          in: query
          description: >
            Longest-edge bound in pixels for a thumbnail. Omit for the
            original image.
          schema:
            type: integer
            minimum: 16
            maximum: 2048
        - name: v
          in: query
          description: >
            Opaque cache-buster, ignored by the server. Artwork lives at
            one URL whatever it holds, and this response is cacheable for
            a day, so a client that has just replaced an entity's cover
            would otherwise keep painting the old bytes out of its own
            cache. Varying this asks for the same image under a name no
            cache has seen.
          schema:
            type: string
        - name: If-None-Match
          in: header
          description: Previously returned `ETag`; a match answers 304 with no body.
          schema:
            type: string
      responses:
        "200":
          description: The artwork image.
          headers:
            ETag:
              description: Content-addressed validator for the returned bytes.
              schema:
                type: string
            X-Art-Source:
              description: >
                Where the answering image came from: `tag`, `sidecar`,
                `user`, `enrichment`, or `feed`. Omitted when the store
                holds no attribution for it.
              schema:
                type: string
            X-Art-Provider:
              description: >
                The provider that supplied an `enrichment` cover.
                Omitted for every other source.
              schema:
                type: string
            X-Art-Source-Url:
              description: >
                Where a fetched cover's bytes came from. Omitted for a
                cover that never crossed the network.
              schema:
                type: string
            X-Art-Level:
              description: >
                Which rung of the fallback chain answered (`track`,
                `album`, `artist`, `podcast`, ...), so a caller can tell
                an item's own cover from an inherited one.
              schema:
                type: string
            Cache-Control:
              description: >
                `private, max-age=86400, stale-while-revalidate=604800`.
                Not `immutable`: the URL names a pid and a size, not the
                bytes, so replacing an item's cover reuses it.
              schema:
                type: string
            Vary:
              description: >
                `Cookie, Authorization`: the credential is what decides
                whether these bytes exist for a caller, so a cached copy
                is never reused across sessions on a shared browser or
                across tokens on a shared cache.
              schema:
                type: string
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
        "304":
          description: >
            The cached copy is still current. It carries the same
            validator and freshness the body would have, so a
            revalidation refreshes the cached copy rather than leaving it
            stale enough to revalidate again on the next paint.


            It repeats the provenance headers too. The validator
            addresses the bytes, and a cover can be re-attributed
            without them changing - a sidecar cover that is now embedded
            in the tags, a feed that moved its image URL - so a 304 that
            omitted them would leave a caller citing the old origin for
            as long as it kept the picture.
          headers:
            ETag:
              description: Content-addressed validator for the cached bytes.
              schema:
                type: string
            Cache-Control:
              description: The same directive the 200 carries.
              schema:
                type: string
            Vary:
              description: The same credentials the 200 varies by.
              schema:
                type: string
            X-Art-Source:
              description: The same producer the 200 reports.
              schema:
                type: string
            X-Art-Provider:
              description: The same provider the 200 reports.
              schema:
                type: string
            X-Art-Source-Url:
              description: The same fetch URL the 200 reports.
              schema:
                type: string
            X-Art-Level:
              description: The same chain rung the 200 reports.
              schema:
                type: string
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /items/{pid}/art-roles:
    get:
      operationId: getItemArtRoles
      summary: List the artwork slots an entity holds
      description: >
        The artwork slots present at the entity's own level, not inherited
        from the album or artist chain, each with its stored format and pixel
        dimensions (0 when the image was not decodable). Besides item PIDs
        this accepts album (`al-`), artist (`ar-`), podcast show (`pc-`), and
        playlist (`pl-`) PIDs. It answers the own-versus-inherited question a front-cover read
        cannot: an item that lists a `front` slot here holds its own cover,
        while one that resolves art only through `/items/{pid}/art` inherits
        it from the chain.


        Each slot carries where its image came from and whether the front
        cover is pinned, and `artSource` alongside them describes the
        cover a front-cover read would actually answer with - which is
        the inherited one when the entity holds none of its own. That is
        what a surface drawing the cover marks; the per-slot rows are
        what an artwork manager edits.
      tags: [library]
      parameters:
        - $ref: "#/components/parameters/Pid"
      responses:
        "200":
          description: The slots the entity holds at its own level.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtRoles"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /library/items/delete:
    post:
      operationId: deleteLibraryItems
      summary: Delete library items
      description: >
        Deletes items' files, to the catalog trash by default
        (reversible from the trash surface) or permanently (`mode`
        `permanent`, administrators only). `dryRun` answers the plan
        (which files, how many bytes) without deleting, and the
        response reports the same entries when it applies. Deleting
        needs the `delete` permission or the admin role, and every
        pid must be visible to the caller (`not-found` otherwise).
        Items keep their catalog identity: an item that loses its
        last file is archived, not erased, and play history
        survives. A read-only library answers `read-only`.
        Podcast episodes are not deletable here, and one anywhere in
        `pids` refuses the whole call (`invalid-request`): the podcast
        download tree owns its own files, and removing an episode's
        download is its own endpoint, keeping the episode
        re-fetchable rather than journalling a restore.
      tags: [library]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteItemsRequest"
      responses:
        "200":
          description: The plan (dry run) or the applied result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteItemsResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            The delete was refused. `read-only`: the target library, or
            the whole server, is in read-only mode. `catalog-busy`:
            another job holds the catalog's shared file-mutation scope,
            which clears on its own, so an unattended retry is worth
            something.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /items/{pid}/lyrics:
    get:
      operationId: getItemLyrics
      summary: Get an item's lyrics
      description: >
        Lyrics for the item: synced lines when available, an unsynced text
        block otherwise. 404 when the item has no lyrics at all.
      tags: [library]
      parameters:
        - $ref: "#/components/parameters/Pid"
      responses:
        "200":
          description: The item's lyrics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lyrics"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"
    put:
      operationId: setItemLyrics
      summary: Set lyrics
      description: >
        Stores synced lines (LRC text) and/or a plain unsynchronized
        block for a track, locking the lyrics artifact by default.
        `writeBack` also writes the `.lrc` sidecar next to the file
        (crash-safe write) and embeds where the format allows; the
        response surfaces typed drop warnings from the tag library
        (MP4 and Matroska refuse embedded synced lyrics, so only the
        sidecar carries them there) instead of silently losing
        content. Malformed LRC lines are reported with their line
        numbers.
      tags: [metadata]
      parameters:
        - $ref: "#/components/parameters/Pid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LyricsEdit"
      responses:
        "200":
          description: The edit outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataEditResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/FieldLocked"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"
    delete:
      operationId: clearItemLyrics
      summary: Clear lyrics
      description: Removes the stored lyrics (files are untouched).
      tags: [metadata]
      parameters:
        - $ref: "#/components/parameters/Pid"
      responses:
        "204":
          description: Cleared.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /metadata/fields:
    get:
      operationId: getMetadataFields
      summary: Discover the editable field vocabulary
      description: >
        The editor's form vocabulary: every editable scalar field per
        item kind (with which ones write back to files and which stay
        database-only), the credit roles per kind, and the entity
        edit fields per entity type. Editors build their forms from
        this instead of hardcoding the vocabulary, the same pattern as
        the smart playlist rule fields.
      tags: [metadata]
      responses:
        "200":
          description: The field vocabulary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataFields"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /items/{pid}/metadata:
    parameters:
      - $ref: "#/components/parameters/Pid"
    get:
      operationId: getItemMetadata
      summary: Read an item's full metadata
      description: >
        Everything the editor shows for one item: the scalar fields,
        credits by role, lyrics presence, chapters (books), custom
        tags, locks and per-field provenance (who set a value: file
        tags, a user, enrichment, or organize), release status, file
        write-back health (out-of-sync and lost-value diagnostics),
        and whether the item is a virtual track carved from a shared
        file (whose edits are always database-only by upstream
        design). Readable by any user who can see the item; the
        item-scoped mutations below require `admin`, or ownership of
        the upload or acquisition that brought the item in, which is
        what `mayCurate` on the response answers - so a client can tell
        an editor it may save from one every save would be refused.
      tags: [metadata]
      responses:
        "200":
          description: The item's metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemMetadata"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"
    patch:
      operationId: editItemMetadata
      summary: Edit scalar fields
      description: >
        Applies one or more scalar field edits atomically to the
        catalog. `writeBack` additionally writes the new values into
        the backing file's tags (refused by upstream design for
        episodes, virtual tracks, and files shared by several items;
        the edit still lands in the catalog and the response carries
        the per-file failures). `lock` (default true) locks each
        edited field against scans and enrichment; editing a field
        someone locked earlier requires `force` or answers
        `field-locked`. Unknown fields for the item's kind answer
        `invalid-request`. Identifier fields (ISRC, ISBN, ASIN,
        barcode) are format-checked here because upstream stores
        them unvalidated.
      tags: [metadata]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetadataEdit"
      responses:
        "200":
          description: The edit outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataEditResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/FieldLocked"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /items/bulk-edit:
    post:
      operationId: bulkEditMetadata
      summary: Edit fields on many items
      description: >
        Applies the same scalar field values to many items in one
        atomic catalog batch (a different value per item needs
        per-item calls). `skipLocked` skips items with locked target
        fields and reports them instead of failing the batch;
        without it a locked item fails the whole batch with
        `field-locked`. Write-back failures are reported per item and
        never undo the catalog batch.
      tags: [metadata]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkEdit"
      responses:
        "200":
          description: Per-item outcomes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkEditResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/FieldLocked"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /items/{pid}/credits:
    parameters:
      - $ref: "#/components/parameters/Pid"
    put:
      operationId: setItemCredits
      summary: Replace one credit role
      description: >
        Replaces the named people for one contributor role (composer,
        lyricist, producer, narrator, and the rest of the per-kind
        role vocabulary from the fields endpoint). Names resolve to
        artist entities and deduplicate. An empty list clears the
        role. `writeBack` writes the role's tag keys where a
        round-trippable key exists (book translator and editor roles
        are database-only by upstream design; the response says so
        rather than failing).
      tags: [metadata]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditsEdit"
      responses:
        "200":
          description: The edit outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataEditResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/FieldLocked"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /books/{pid}/chapters:
    parameters:
      - $ref: "#/components/parameters/Pid"
    put:
      operationId: setBookChapters
      summary: Replace a book's chapters
      description: >
        Replaces an audiobook's chapter list (user chapters win over
        embedded ones on read). Chapters are addressed on the book
        timeline, ordered and non-overlapping; for a multi-file book
        the server splits the flat list across its parts. An empty
        list restores the embedded chapters.
      tags: [metadata]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChaptersEdit"
      responses:
        "200":
          description: The edit outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataEditResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/FieldLocked"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /items/{pid}/artwork:
    parameters:
      - $ref: "#/components/parameters/Pid"
    put:
      operationId: setItemArtwork
      summary: Set item artwork
      description: >
        Stores the raw image bytes in one of the item's artwork slots
        (`role`, default `front`), locking the artifact by default. The
        body is the image itself, up to 16 MiB; the server sniffs the
        format. `writeBack=true` embeds a front cover into every backing
        file (write-back applies to the front slot only). Existing art in
        the slot is replaced; the request never downgrades silently because
        the caller chose the image.
      tags: [metadata]
      parameters:
        - name: role
          in: query
          description: Which artwork slot to set. Defaults to `front`.
          schema:
            $ref: "#/components/schemas/ArtRole"
        - name: writeBack
          in: query
          description: Also embed a front cover into the backing files.
          schema:
            type: boolean
            default: false
        - name: lock
          in: query
          description: Lock the artwork against scans and enrichment.
          schema:
            type: boolean
            default: true
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: The edit outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataEditResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/FieldLocked"
        "415":
          $ref: "#/components/responses/UnsupportedFormat"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"
    delete:
      operationId: clearItemArtwork
      summary: Clear item artwork
      description: >
        Removes the stored item art in one slot (`role`, default `front`).
        A cleared front cover falls back to the entity chain (album, release
        group, artist); the other slots have no fallback and simply become
        absent.
      tags: [metadata]
      parameters:
        - name: role
          in: query
          description: Which artwork slot to clear. Defaults to `front`.
          schema:
            $ref: "#/components/schemas/ArtRole"
      responses:
        "204":
          description: Cleared.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /entities/{entityType}/{entityPid}/artwork:
    parameters:
      - $ref: "#/components/parameters/EntityType"
      - $ref: "#/components/parameters/EntityPid"
    put:
      operationId: setEntityArtwork
      summary: Set entity artwork
      description: >
        Stores the raw image bytes in one artwork slot (`role`, default
        `front`) of an album, artist, release group, genre, or playlist
        entity. Album front covers may additionally embed into member files
        with `writeBack=true`; other slots and entity types are
        catalog-only. An artist portrait lands under `background`, which has
        no separate portrait role. Catalog entities are administrators-only;
        a playlist cover is set by its owner, and replaces the cover the
        server generates from the members until it is cleared.
      tags: [metadata]
      parameters:
        - name: role
          in: query
          description: Which artwork slot to set. Defaults to `front`.
          schema:
            $ref: "#/components/schemas/ArtRole"
        - name: writeBack
          in: query
          description: >
            Embed a front cover into member files (albums only; ignored
            elsewhere).
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: The edit outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataEditResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/UnsupportedFormat"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"
    delete:
      operationId: clearEntityArtwork
      summary: Clear entity artwork
      description: >
        Removes one artwork slot (`role`, default `front`) from an album,
        artist, release group, genre, or playlist entity. Files already
        carrying an embedded cover are untouched; this clears the catalog's
        copy. Clearing a playlist's uploaded cover hands the slot back to
        the mosaic the server builds from the members, so the playlist keeps
        a cover rather than going bare. Catalog entities are
        administrators-only; a playlist cover is cleared by its owner.
      tags: [metadata]
      parameters:
        - name: role
          in: query
          description: Which artwork slot to clear. Defaults to `front`.
          schema:
            $ref: "#/components/schemas/ArtRole"
      responses:
        "204":
          description: Cleared.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /entities/{entityType}/{entityPid}/artwork/lock:
    parameters:
      - $ref: "#/components/parameters/EntityType"
      - $ref: "#/components/parameters/EntityPid"
    get:
      operationId: getEntityArtworkLock
      summary: Read an entity's artwork lock
      description: >
        Whether an album, artist, release group, or genre's front cover
        is pinned against enrichment and scan re-derives. This is what
        explains an entity that shows no cover and refuses every attempt
        to give it one: the cover was cleared and the pin left standing,
        which says "do not refill this" rather than "this has no cover
        yet". Administrators only, like every other catalog-entity
        curation read.
      tags: [metadata]
      responses:
        "200":
          description: The entity's artwork lock state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtworkLock"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"
    put:
      operationId: setEntityArtworkLock
      summary: Pin or unpin an entity's artwork
      description: >
        Sets or clears the front-cover pin without touching the cover
        itself, which setting artwork cannot express: that always writes
        the image slot too, so unpinning through it would mean supplying
        the picture again. Unpinning here is the way out of a cover that
        was cleared and left pinned. Administrators only.


        `playlist` is refused with `invalid-request`. A playlist's cover
        authority is its own custom/generated origin marker rather than
        this pin, and a pin left standing on one would make the mosaic
        the server builds from the members unwritable - which the read
        path retries on every read, forever.
      tags: [metadata]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtworkLock"
      responses:
        "200":
          description: The entity's artwork lock state after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtworkLock"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /items/{pid}/tags/{key}:
    parameters:
      - $ref: "#/components/parameters/Pid"
      - name: key
        in: path
        required: true
        description: >
          The custom tag key. Keys canonicalize to uppercase ASCII;
          keys the catalog owns through another surface (TITLE,
          ARTIST, the credit roles, and the rest of the reserved set)
          are rejected with `invalid-request`.
        schema:
          type: string
          minLength: 1
          maxLength: 64
    put:
      operationId: setItemTag
      summary: Set a custom tag
      description: >
        Replaces the ordered values of one custom tag on a track or
        book, locking `tag.KEY` by default. Custom tags are full
        browse dimensions: they filter, facet, and feed smart list
        rules. An empty value list clears the tag.
      tags: [metadata]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagEdit"
      responses:
        "200":
          description: The edit outcome, with the canonical key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagEditResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/FieldLocked"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"
    delete:
      operationId: clearItemTag
      summary: Clear a custom tag
      description: >
        Removes the tag and its lock. A reserved key (one the catalog
        owns through another surface) answers `invalid-request`, like
        setting one does.
      tags: [metadata]
      responses:
        "204":
          description: Cleared.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /items/{pid}/locks:
    parameters:
      - $ref: "#/components/parameters/Pid"
    put:
      operationId: setItemLocks
      summary: Lock or unlock fields
      description: >
        Locks or unlocks the named fields against scans, enrichment,
        and organize. Field names are the scalar vocabulary plus the
        namespaced artifacts: `lyrics`, `chapters`, `art`,
        `credit.ROLE`, and `tag.KEY`.
      tags: [metadata]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocksEdit"
      responses:
        "200":
          description: The item's locked fields after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocksResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /entities/{entityType}/{entityPid}:
    parameters:
      - $ref: "#/components/parameters/EntityType"
      - $ref: "#/components/parameters/EntityPid"
    patch:
      operationId: editEntity
      summary: Edit entity fields
      description: >
        Edits an entity's own fields: `sort` and `mbid` for artists;
        `sort`, `mbid`, and `type` for release groups; `sort`, `mbid`,
        `barcode`, `label`, `catalog_number`, `media`, and `country`
        for albums. Entity edits carry their own provenance, readable
        below. `writeBack` pushes the values that have tag forms into
        member files.


        `barcode` and `country` are normalized on the way in, where a
        scan stores the tag verbatim, so an edit refuses values
        `GET /albums/{pid}` will happily show ("US &amp; Europe" is a
        country a scan can store and an edit cannot). `media` has no
        normalizer and is stored as typed.
      tags: [metadata]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntityEdit"
      responses:
        "200":
          description: The edit outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataEditResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/FieldLocked"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /entities/{entityType}/{entityPid}/curation:
    parameters:
      - $ref: "#/components/parameters/EntityType"
      - $ref: "#/components/parameters/EntityPid"
    get:
      operationId: getEntityCuration
      summary: Read entity edit provenance
      description: The entity's curated fields with source and time.
      tags: [metadata]
      responses:
        "200":
          description: Curated entity fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityCuration"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /items/{pid}/release-status:
    parameters:
      - $ref: "#/components/parameters/Pid"
    put:
      operationId: setReleaseStatus
      summary: Mark content unofficial
      description: >
        Marks an item as having no canonical release (YouTube rips,
        remixes, live sets, personal recordings) or clears the mark.
        Marking sets a locked `RELEASESTATUS` custom tag of
        `unofficial`, which excludes the item from match retries and
        health penalties; the state is first-class, browsable, and
        fully hand-editable, never an error condition.
      tags: [metadata]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReleaseStatusEdit"
      responses:
        "200":
          description: The edit outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataEditResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /items/{pid}/rematch:
    parameters:
      - $ref: "#/components/parameters/Pid"
    post:
      operationId: rematchItem
      summary: Requeue an item for matching
      description: >
        Rebuilds the album unit containing the item (its album
        siblings ride along; a unit is always matched whole) and runs
        the identify pipeline on it, opening a fresh pending review
        entry. Items marked unofficial are eligible here (an explicit
        rematch is the way back from that state). The entry id
        returns immediately; candidates fill in asynchronously and
        the entry updates over the event channel.
      tags: [metadata]
      responses:
        "202":
          description: The queued review entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RematchResult"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /items/{pid}/enrich:
    parameters:
      - $ref: "#/components/parameters/Pid"
    post:
      operationId: enrichItem
      summary: Enrich one item now
      description: >
        Runs the registered enrichment providers for the wanted
        artifacts (cover art, lyrics, genres, book metadata) against
        this one item synchronously and applies what they return,
        respecting locks and never overwriting a non-empty curated
        value. This is the editor's "fetch for me" button; the
        whole-library pass lives under `/library/enrichment`.
      tags: [metadata]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrichItemRequest"
      responses:
        "200":
          description: What was fetched and applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrichItemResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /notifications/events:
    get:
      operationId: listNotificationEvents
      summary: List the notification event catalog
      description: >
        Every notification event this server can emit, with its scope:
        `server` events describe server operations and deliver to
        server-scope targets (plus admin-owned personal targets that
        opted in), `user` events concern one user and deliver to that
        user's personal targets. Clients build the per-target event
        checklist from this catalog; a target's `enabledEvents` must
        name events from it. The reserved `test` event never appears
        here: per-target tests are requested through the target's test
        endpoint and bypass event selection.
      tags: [notifications]
      responses:
        "200":
          description: The event catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationEventList"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /users/me/notification-targets:
    get:
      operationId: listMyNotificationTargets
      summary: List the caller's notification targets
      description: >
        The calling user's personal notification targets, including
        UnifiedPush registrations (kind `unifiedpush`; the
        push-registration endpoints are a compatibility view over the
        same rows). `config` is returned verbatim to the owner,
        service tokens included, so the configuration can be
        round-tripped for editing; it is sealed at rest. Unpaginated:
        the per-kind cap keeps the list small.
      tags: [notifications]
      responses:
        "200":
          description: The caller's targets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationTargetList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      operationId: createMyNotificationTarget
      summary: Create a personal notification target
      description: >
        Creates one personal delivery destination. `config` carries
        the kind's fields (see the NotificationTarget schema);
        validation is per kind and unknown config fields are refused.
        `enabledEvents` names catalog events this target receives:
        user-scope events for everyone, server-scope events only when
        the caller is an administrator. Each user may hold at most 20
        targets per kind; conflict (code `conflict`) means the cap is
        reached, or that a `unifiedpush` target for the same endpoint
        already exists. On servers that refuse private notification
        hosts, a URL-carrying config resolving to a private address is
        refused at write time (and again at delivery time);
        `unifiedpush` endpoints are deliberately exempt, since
        self-hosted LAN distributors are legitimate.
      tags: [notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationTargetCreate"
      responses:
        "201":
          description: Target created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationTarget"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/Conflict"

  /users/me/notification-targets/{targetId}:
    put:
      operationId: updateMyNotificationTarget
      summary: Update a personal notification target
      description: >
        Replaces the target's label, config, and enabled events; an
        omitted label clears it. The kind is fixed at creation. The
        stored config is replaced whole, so clients edit the
        round-tripped document, and creation rules re-apply: per-kind
        config validation, the event scope rules, and the
        private-address refusal for user-pointed URLs. Changing a
        `unifiedpush` target's endpoint to one another target already
        holds answers conflict (code `conflict`).
      tags: [notifications]
      parameters:
        - $ref: "#/components/parameters/TargetId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationTargetUpdate"
      responses:
        "200":
          description: The updated target.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationTarget"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteMyNotificationTarget
      summary: Delete a personal notification target
      description: >
        Removes the target; its queued deliveries are dropped.
      tags: [notifications]
      parameters:
        - $ref: "#/components/parameters/TargetId"
      responses:
        "204":
          description: Target removed.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/me/notification-targets/{targetId}/test:
    post:
      operationId: testMyNotificationTarget
      summary: Test a personal notification target
      description: >
        Queues one test delivery to this target, bypassing event
        selection. Answers as soon as the test is queued; the outcome
        lands on the target's health fields (`lastSuccessAt`,
        `lastError`, `lastErrorAt`), which the settings surface polls.
      tags: [notifications]
      parameters:
        - $ref: "#/components/parameters/TargetId"
      responses:
        "202":
          description: Test queued.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/me/push-registrations:
    get:
      operationId: listPushRegistrations
      summary: List the caller's push registrations
      description: >
        The calling user's UnifiedPush registrations: a compatibility
        view over the caller's `unifiedpush` notification targets.
        Unpaginated; the per-user cap is small.
      tags: [notifications]
      responses:
        "200":
          description: The caller's push registrations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushRegistrationList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      operationId: createPushRegistration
      summary: Register a UnifiedPush endpoint
      description: >
        Registers a UnifiedPush endpoint URL (obtained by the client
        from its distributor) for push-transported event
        notifications, stored as a `unifiedpush` notification target.
        A genuinely new endpoint starts enabled for every user-scope
        event; re-registering a known endpoint URL (UnifiedPush
        clients re-post at every app start) refreshes the label and
        returns the existing registration without touching the event
        selection made in the notification-targets surface. Each user
        may hold at most 20 registrations; conflict (code `conflict`)
        means the cap is reached, so remove a stale registration
        first. The endpoint URL must be https and is used exactly as
        supplied: posting to caller-chosen URLs is inherent to
        UnifiedPush (self-hosted LAN distributors are legitimate), so
        the mitigations are shape, not reachability: delivery bodies
        carry only notification text, and delivery responses are
        never surfaced to any user.
      tags: [notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushRegistrationCreate"
      responses:
        "201":
          description: Newly registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushRegistration"
        "200":
          description: The endpoint was already registered; label updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushRegistration"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteAllPushRegistrations
      summary: Remove all of the caller's push registrations
      description: >
        Drops every UnifiedPush registration the caller holds, for a
        clean sign-out across distributors.
      tags: [notifications]
      responses:
        "204":
          description: All registrations removed.
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /users/me/push-registrations/{registrationId}:
    delete:
      operationId: deletePushRegistration
      summary: Remove a push registration
      description: Drops one UnifiedPush registration.
      tags: [notifications]
      parameters:
        - name: registrationId
          in: path
          required: true
          description: The registration's notification-target pid.
          schema:
            type: string
          example: nt-01JZX5N8QW3F4V9T2B7KD3M9R6
      responses:
        "204":
          description: Registration removed.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/notification-targets:
    get:
      operationId: listServerNotificationTargets
      summary: List the server-scope notification targets
      description: >
        The server-scope notification targets: administrator-managed
        destinations that receive server-operations events
        (signup requests, backup outcomes). Administrators only.
        `config` is returned verbatim, service tokens included, the
        same documented round-trip decision the admin configuration
        surface has always made; it is sealed at rest. Unpaginated:
        the per-kind cap keeps the list small.
      tags: [notifications]
      responses:
        "200":
          description: The server-scope targets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationTargetList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createServerNotificationTarget
      summary: Create a server-scope notification target
      description: >
        Creates one server-scope delivery destination. Administrators
        only. `config` carries the kind's fields (see the
        NotificationTarget schema); validation is per kind and unknown
        config fields are refused. `enabledEvents` names server-scope
        catalog events. Server-scope destinations are administrator
        configured, so their URLs are not subject to the
        private-address refusal that guards user-pointed ones. The
        server may hold at most 20 targets per kind; conflict (code
        `conflict`) means the cap is reached, or that a `unifiedpush`
        target for the same endpoint already exists.
      tags: [notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationTargetCreate"
      responses:
        "201":
          description: Target created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationTarget"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /admin/notification-targets/{targetId}:
    put:
      operationId: updateServerNotificationTarget
      summary: Update a server-scope notification target
      description: >
        Replaces the target's label, config, and enabled events; an
        omitted label clears it. Administrators only. The kind is
        fixed at creation; the stored config is replaced whole, so
        clients edit the round-tripped document, and creation rules
        re-apply (per-kind config validation and the event scope
        rules). Changing a `unifiedpush` target's endpoint to one
        another target already holds answers conflict (code
        `conflict`).
      tags: [notifications]
      parameters:
        - $ref: "#/components/parameters/TargetId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationTargetUpdate"
      responses:
        "200":
          description: The updated target.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationTarget"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteServerNotificationTarget
      summary: Delete a server-scope notification target
      description: >
        Removes the target; its queued deliveries are dropped.
        Administrators only.
      tags: [notifications]
      parameters:
        - $ref: "#/components/parameters/TargetId"
      responses:
