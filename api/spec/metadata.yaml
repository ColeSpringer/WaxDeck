# WaxDeck API contract fragment; assembled into api/openapi.yaml by `make generate`.
paths:
  /items/{pid}/lyrics:
    get:
      operationId: getItemLyrics
      summary: Get an item's lyrics
      description: >
        Lyrics for the item: synced lines when available, an unsynced text
        block otherwise. 404 when the item has no lyrics at all.
      tags: [library]
      parameters:
        - $ref: "#/components/parameters/Pid"
      responses:
        "200":
          description: The item's lyrics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lyrics"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"
    put:
      operationId: setItemLyrics
      summary: Set lyrics
      description: >
        Stores synced lines (LRC text) and/or a plain unsynchronized
        block for a track, locking the lyrics artifact by default.
        `writeBack` also writes the `.lrc` sidecar next to the file
        (crash-safe write) and embeds where the format allows; the
        response surfaces typed drop warnings from the tag library
        (MP4 and Matroska refuse embedded synced lyrics, so only the
        sidecar carries them there) instead of silently losing
        content. Malformed LRC lines are reported with their line
        numbers.
      tags: [metadata]
      parameters:
        - $ref: "#/components/parameters/Pid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LyricsEdit"
      responses:
        "200":
          description: The edit outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataEditResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/FieldLocked"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"
    delete:
      operationId: clearItemLyrics
      summary: Clear lyrics
      description: Removes the stored lyrics (files are untouched).
      tags: [metadata]
      parameters:
        - $ref: "#/components/parameters/Pid"
      responses:
        "204":
          description: Cleared.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /items/{pid}/permissions:
    get:
      operationId: getItemPermissions
      summary: Read the caller's permissions on an item
      description: >
        Whether the caller may run the item-scoped metadata mutations
        on this item: administrators always, everyone else exactly for
        the items their own uploads brought in. This is the whole
        `mayCurate` answer from the metadata read without the cost of
        the full editor document, for surfaces that only need to
        decide whether to show an edit door. The read does not confirm
        the item exists: an unknown pid answers `mayCurate: false` for
        a non-administrator, and `true` for an administrator, whose
        edits on it would answer `not-found` anyway.
      tags: [metadata]
      parameters:
        - $ref: "#/components/parameters/Pid"
      responses:
        "200":
          description: The caller's permissions on the item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemPermissions"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /metadata/fields:
    get:
      operationId: getMetadataFields
      summary: Discover the editable field vocabulary
      description: >
        The editor's form vocabulary: every editable scalar field per
        item kind (with which ones write back to files and which stay
        database-only), the credit roles per kind, and the entity
        edit fields per entity type. Editors build their forms from
        this instead of hardcoding the vocabulary, the same pattern as
        the smart playlist rule fields.
      tags: [metadata]
      responses:
        "200":
          description: The field vocabulary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataFields"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /items/{pid}/metadata:
    parameters:
      - $ref: "#/components/parameters/Pid"
    get:
      operationId: getItemMetadata
      summary: Read an item's full metadata
      description: >
        Everything the editor shows for one item: the scalar fields,
        credits by role, lyrics presence, chapters (books), custom
        tags, locks and per-field provenance (who set a value: file
        tags, a user, enrichment, or organize), release status, file
        write-back health (out-of-sync and lost-value diagnostics),
        and whether the item is a virtual track carved from a shared
        file (whose edits are always database-only by upstream
        design). Readable by any user who can see the item; the
        item-scoped mutations below require `admin`, or ownership of
        the upload or acquisition that brought the item in, which is
        what `mayCurate` on the response answers - so a client can tell
        an editor it may save from one every save would be refused.
      tags: [metadata]
      responses:
        "200":
          description: The item's metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemMetadata"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"
    patch:
      operationId: editItemMetadata
      summary: Edit scalar fields
      description: >
        Applies one or more scalar field edits atomically to the
        catalog. `writeBack` additionally writes the new values into
        the backing file's tags (refused by upstream design for
        episodes, virtual tracks, and files shared by several items;
        the edit still lands in the catalog and the response carries
        the per-file failures). `lock` (default true) locks each
        edited field against scans and enrichment; editing a field
        someone locked earlier requires `force` or answers
        `field-locked`. Unknown fields for the item's kind answer
        `invalid-request`. Identifier fields (ISRC, ISBN, ASIN,
        barcode) are format-checked here because upstream stores
        them unvalidated.
      tags: [metadata]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetadataEdit"
      responses:
        "200":
          description: The edit outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataEditResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/FieldLocked"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /items/{pid}/metadata/commit:
    parameters:
      - $ref: "#/components/parameters/Pid"
    post:
      operationId: commitItemMetadata
      summary: Commit a staged metadata draft in one request
      description: >
        Runs every staged part of one item's editor draft server-side,
        in the order the editor's own sequential save uses: scalar
        fields, then each credit role, then lyrics (or their removal),
        then chapters, then each tag set, then each tag removal, then
        the release status. It exists for latency: the sequential save
        is one round trip per part, which on a phone reaching a home
        server through a reverse proxy is felt as lag on a single
        Save, and every gap between the calls is a partial-failure
        window on a flaky link.


        At least one part is required. `writeBack`, `lock` and `force`
        are hoisted here rather than repeated per part, and each part
        takes the ones its own endpoint takes: chapters and tag sets
        take `lock` and `force`, a tag removal, a lyrics clear and the
        release status take none.


        **Deliberately not a transaction.** Write-back is best-effort
        by design, so end-to-end atomicity is unattainable, and
        catalog-only atomicity would need a combined-edit facade
        upstream. Parts run until one is refused; that part reports
        `refused` with its `Error`, every later part reports `skipped`,
        and the parts before it stay committed. That is exactly what
        the sequential save produces, which is the point: the two
        paths are interchangeable, and a client keeps the sequential
        one as its fallback for an older server.


        So a refusal is a `200` carrying a refused part, not a `4xx`:
        the write-back failures the committed parts accumulated are
        what the editor's banner is made of, and a status code would
        discard them. A lock conflict that `PATCH /items/{pid}/metadata`
        answers `409` arrives here as a part refused with
        `field-locked`, worded exactly as that endpoint words it.


        One exception, and it is what the status codes below are for: a
        failure that says the server is temporarily unwell rather than
        that the edit was wrong - `catalog-maintenance`, `internal`,
        `catalog-busy` - answers with its own status code when it
        happens before anything has committed. Nothing is lost by doing
        so, and a client answers those with a banner and a retry rather
        than by showing them to the person who typed the value. Once a
        part has committed, the same failure rides as a part refusal,
        because discarding that part's report is the worse trade.


        Gated per item like the sequential parts: administrators, or
        the user whose upload brought the item in. It is not the bulk
        edit and does not carry that operation's admin-only gate.
      tags: [metadata]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetadataCommit"
      responses:
        "200":
          description: >
            What each part did. The catalog write for every part
            reported `committed` has landed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataCommitResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /items/bulk-edit:
    post:
      operationId: bulkEditMetadata
      summary: Edit fields on many items
      description: >
        Applies the same scalar field values to many items in one
        atomic catalog batch (a different value per item needs
        per-item calls). `skipLocked` skips items with locked target
        fields and reports them instead of failing the batch;
        without it a locked item fails the whole batch with
        `field-locked`. Write-back failures are reported per item and
        never undo the catalog batch. Every edited field is locked on
        every edited item, so a repeat edit of the same field needs
        `force` or `skipLocked`. Editing a release-keying field
        (`album`, `album_artist`, `year`) regroups the edited tracks
        onto a fresh album entity rather than renaming the release in
        place; `resultingAlbumPid` reports where they landed.
      tags: [metadata]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkEdit"
      responses:
        "200":
          description: Per-item outcomes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkEditResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/FieldLocked"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /items/{pid}/credits:
    parameters:
      - $ref: "#/components/parameters/Pid"
    put:
      operationId: setItemCredits
      summary: Replace one credit role
      description: >
        Replaces the named people for one contributor role (composer,
        lyricist, producer, narrator, and the rest of the per-kind
        role vocabulary from the fields endpoint). Names resolve to
        artist entities and deduplicate. An empty list clears the
        role. `writeBack` writes the role's tag keys where a
        round-trippable key exists (book translator and editor roles
        are database-only by upstream design; the response says so
        rather than failing).
      tags: [metadata]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditsEdit"
      responses:
        "200":
          description: The edit outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataEditResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/FieldLocked"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /books/{pid}/chapters:
    parameters:
      - $ref: "#/components/parameters/Pid"
    put:
      operationId: setBookChapters
      summary: Replace a book's chapters
      description: >
        Replaces an audiobook's chapter list (user chapters win over
        embedded ones on read). Chapters are addressed on the book
        timeline, ordered and non-overlapping; for a multi-file book
        the server splits the flat list across its parts. An empty
        list restores the embedded chapters.
      tags: [metadata]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChaptersEdit"
      responses:
        "200":
          description: The edit outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataEditResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/FieldLocked"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /items/{pid}/artwork:
    parameters:
      - $ref: "#/components/parameters/Pid"
    put:
      operationId: setItemArtwork
      summary: Set item artwork
      description: >
        Stores the raw image bytes in one of the item's artwork slots
        (`role`, default `front`), locking the artifact by default. The
        body is the image itself, up to 16 MiB, in any format the catalog
        recognizes: JPEG, PNG, GIF, WebP, BMP and TIFF by decoding them,
        and AVIF and HEIC by their container magic.
        `writeBack=true` embeds a front cover into every backing
        file (write-back applies to the front slot only). Existing art in
        the slot is replaced; the request never downgrades silently because
        the caller chose the image.
      tags: [metadata]
      parameters:
        - name: role
          in: query
          description: Which artwork slot to set. Defaults to `front`.
          schema:
            $ref: "#/components/schemas/ArtRole"
        - name: writeBack
          in: query
          description: Also embed a front cover into the backing files.
          schema:
            type: boolean
            default: false
        - name: lock
          in: query
          description: Lock the artwork against scans and enrichment.
          schema:
            type: boolean
            default: true
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: The edit outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataEditResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/FieldLocked"
        "415":
          $ref: "#/components/responses/UnsupportedFormat"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"
    delete:
      operationId: clearItemArtwork
      summary: Clear item artwork
      description: >
        Removes the stored item art in one slot (`role`, default `front`).
        A cleared front cover falls back to the entity chain (album, release
        group, artist); the other slots have no fallback and simply become
        absent.
      tags: [metadata]
      parameters:
        - name: role
          in: query
          description: Which artwork slot to clear. Defaults to `front`.
          schema:
            $ref: "#/components/schemas/ArtRole"
      responses:
        "204":
          description: Cleared.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /entities/{entityType}/{entityPid}/artwork:
    parameters:
      - $ref: "#/components/parameters/EntityType"
      - $ref: "#/components/parameters/EntityPid"
    put:
      operationId: setEntityArtwork
      summary: Set entity artwork
      description: >
        Stores the raw image bytes in one artwork slot (`role`, default
        `front`) of an album, artist, release group, genre, playlist, or
        podcast entity. Album front covers may additionally embed into
        member files with `writeBack=true`; other slots and entity types
        are catalog-only. An artist portrait lands under `front` - the
        slot the artist screen and index tiles resolve, and the one the
        server's own portrait sweep fills; `background` is the scenic
        slot, which no surface draws yet. Catalog entities are
        administrators-only, with two exceptions: a playlist cover is set
        by its owner, and replaces the cover the server generates from the
        members until it is cleared, and a podcast show cover is set by
        `managePodcasts` holders as well, replacing the feed's image until
        it is cleared.
      tags: [metadata]
      parameters:
        - name: role
          in: query
          description: Which artwork slot to set. Defaults to `front`.
          schema:
            $ref: "#/components/schemas/ArtRole"
        - name: writeBack
          in: query
          description: >
            Embed a front cover into member files (albums only; ignored
            elsewhere).
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: The edit outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataEditResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/UnsupportedFormat"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"
    delete:
      operationId: clearEntityArtwork
      summary: Clear entity artwork
      description: >
        Removes one artwork slot (`role`, default `front`) from an album,
        artist, release group, genre, playlist, or podcast entity. Files
        already carrying an embedded cover are untouched; this clears the
        catalog's copy. Clearing a playlist's uploaded cover hands the slot
        back to the mosaic the server builds from the members, so the
        playlist keeps a cover rather than going bare. Clearing a podcast
        show's cover hands the slot back to the feed, whose image refills
        on the next sync - provided no pin stands: setting a cover by hand
        pinned it, so resetting a hand-set show cover to the feed's image
        is two steps, unpin through the lock endpoint and then clear.
        Catalog entities are administrators-only; a playlist cover is
        cleared by its owner, and a podcast show cover by `managePodcasts`
        holders as well.
      tags: [metadata]
      parameters:
        - name: role
          in: query
          description: Which artwork slot to clear. Defaults to `front`.
          schema:
            $ref: "#/components/schemas/ArtRole"
      responses:
        "204":
          description: Cleared.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /entities/{entityType}/{entityPid}/artwork/lock:
    parameters:
      - $ref: "#/components/parameters/EntityType"
      - $ref: "#/components/parameters/EntityPid"
    get:
      operationId: getEntityArtworkLock
      summary: Read an entity's artwork lock
      description: >
        Whether an album, artist, release group, genre, or podcast's
        front cover is pinned against enrichment and scan re-derives.
        This is what explains an entity that shows no cover and refuses
        every attempt to give it one: the cover was cleared and the pin
        left standing, which says "do not refill this" rather than "this
        has no cover yet". Administrators only, like every other
        catalog-entity curation read, except the podcast pin, which
        `managePodcasts` holders read too.
      tags: [metadata]
      responses:
        "200":
          description: The entity's artwork lock state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtworkLock"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"
    put:
      operationId: setEntityArtworkLock
      summary: Pin or unpin an entity's artwork
      description: >
        Sets or clears the front-cover pin without touching the cover
        itself, which setting artwork cannot express: that always writes
        the image slot too, so unpinning through it would mean supplying
        the picture again. Unpinning here is the way out of a cover that
        was cleared and left pinned. Administrators only, except the
        podcast pin, which `managePodcasts` holders set too - the pin is
        what keeps a hand-set show cover from being refetched on the
        next feed sync, so it belongs to whoever may set the cover.


        `playlist` is refused with `invalid-request`. A playlist's cover
        authority is its own custom/generated origin marker rather than
        this pin, and a pin left standing on one would make the mosaic
        the server builds from the members unwritable - which the read
        path retries on every read, forever.
      tags: [metadata]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtworkLock"
      responses:
        "200":
          description: The entity's artwork lock state after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtworkLock"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /items/{pid}/tags/{key}:
    parameters:
      - $ref: "#/components/parameters/Pid"
      - name: key
        in: path
        required: true
        description: >
          The custom tag key. Keys canonicalize to uppercase ASCII;
          keys the catalog owns through another surface (TITLE,
          ARTIST, the credit roles, and the rest of the reserved set)
          are rejected with `invalid-request`.
        schema:
          type: string
          minLength: 1
          maxLength: 64
    put:
      operationId: setItemTag
      summary: Set a custom tag
      description: >
        Replaces the ordered values of one custom tag on a track or
        book, locking `tag.KEY` by default. Custom tags are full
        browse dimensions: they filter, facet, and feed smart list
        rules. An empty value list clears the tag.
      tags: [metadata]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagEdit"
      responses:
        "200":
          description: The edit outcome, with the canonical key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagEditResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/FieldLocked"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"
    delete:
      operationId: clearItemTag
      summary: Clear a custom tag
      description: >
        Removes the tag and its lock. A reserved key (one the catalog
        owns through another surface) answers `invalid-request`, like
        setting one does.
      tags: [metadata]
      responses:
        "204":
          description: Cleared.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /items/{pid}/locks:
    parameters:
      - $ref: "#/components/parameters/Pid"
    put:
      operationId: setItemLocks
      summary: Lock or unlock fields
      description: >
        Locks or unlocks the named fields against scans, enrichment,
        and organize. Field names are the scalar vocabulary plus the
        namespaced artifacts: `lyrics`, `chapters`, `art`,
        `credit.ROLE`, and `tag.KEY`.
      tags: [metadata]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocksEdit"
      responses:
        "200":
          description: The item's locked fields after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocksResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /entities/{entityType}/{entityPid}:
    parameters:
      - $ref: "#/components/parameters/EntityType"
      - $ref: "#/components/parameters/EntityPid"
    patch:
      operationId: editEntity
      summary: Edit entity fields
      description: >
        Edits an entity's own fields: `sort` and `mbid` for artists;
        `sort`, `mbid`, and `type` for release groups; `sort`, `mbid`,
        `barcode`, `label`, `catalog_number`, `media`, and `country`
        for albums. Entity edits carry their own provenance, readable
        below. `writeBack` pushes the values that have tag forms into
        member files.


        `barcode` and `country` are normalized on the way in, where a
        scan stores the tag verbatim, so an edit refuses values
        `GET /albums/{pid}` will happily show ("US &amp; Europe" is a
        country a scan can store and an edit cannot). `media` has no
        normalizer and is stored as typed.
      tags: [metadata]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntityEdit"
      responses:
        "200":
          description: The edit outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataEditResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/FieldLocked"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /entities/{entityType}/{entityPid}/curation:
    parameters:
      - $ref: "#/components/parameters/EntityType"
      - $ref: "#/components/parameters/EntityPid"
    get:
      operationId: getEntityCuration
      summary: Read entity edit provenance
      description: The entity's curated fields with source and time.
      tags: [metadata]
      responses:
        "200":
          description: Curated entity fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityCuration"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /items/{pid}/release-status:
    parameters:
      - $ref: "#/components/parameters/Pid"
    put:
      operationId: setReleaseStatus
      summary: Mark content unofficial
      description: >
        Marks an item as having no canonical release (YouTube rips,
        remixes, live sets, personal recordings) or clears the mark.
        Marking sets a locked `RELEASESTATUS` custom tag of
        `unofficial`, which excludes the item from match retries and
        health penalties; the state is first-class, browsable, and
        fully hand-editable, never an error condition.
      tags: [metadata]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReleaseStatusEdit"
      responses:
        "200":
          description: The edit outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataEditResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /items/{pid}/rematch:
    parameters:
      - $ref: "#/components/parameters/Pid"
    post:
      operationId: rematchItem
      summary: Requeue an item for matching
      description: >
        Rebuilds the album unit containing the item (its album
        siblings ride along; a unit is always matched whole) and runs
        the identify pipeline on it, opening a fresh pending review
        entry. Items marked unofficial are eligible here (an explicit
        rematch is the way back from that state). The entry id
        returns immediately; candidates fill in asynchronously and
        the entry updates over the event channel.
      tags: [metadata]
      responses:
        "202":
          description: The queued review entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RematchResult"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /items/{pid}/enrich:
    parameters:
      - $ref: "#/components/parameters/Pid"
    post:
      operationId: enrichItem
      summary: Enrich one item now
      description: >
        Runs the registered enrichment providers for the wanted
        artifacts (cover art, lyrics, genres, book metadata) against
        this one item synchronously and applies what they return,
        respecting locks and never overwriting a non-empty curated
        value. This is the editor's "fetch for me" button; the
        whole-library pass lives under `/library/enrichment`.


        With a `proposal` in the body, nothing is fetched: the call
        commits exactly the proposal a preview returned, so what was
        approved is what lands - a fresh fetch could answer with a
        different value than the one the user saw. The proposal is
        validated whole before anything writes: its parts must answer
        the requested wants, its providers must be registered on this
        server, and a cover must be a storable image (decodable, at
        most 16 MiB) - a proposal that fails any of it is refused with
        nothing committed. The local guards still run at commit (a
        field locked or filled since the preview is skipped with the
        reason, never overwritten). The catalog's own key-free
        built-ins run fill-when-empty after the commit either way, as
        they do on a blind fetch: they live inside the catalog's
        engine and cannot propose without writing, so they are the
        un-previewable remainder.
      tags: [metadata]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrichItemRequest"
      responses:
        "200":
          description: What was fetched and applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrichItemResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /items/{pid}/enrich/preview:
    parameters:
      - $ref: "#/components/parameters/Pid"
    post:
      operationId: previewEnrichItem
      summary: Preview a one-item enrichment
      description: >
        Runs the registered enrichment providers for the wanted
        artifacts against this one item and reports what they would
        change without writing anything. The answer is a proposal:
        pass it back on `enrichItem` to commit exactly these values.
        Skipped wants carry the same reasons the blind fetch reports
        (locked, already present, no provider, no provider hit). The
        catalog's key-free built-ins are absent here - they cannot be
        previewed - so a want this preview reports empty may still be
        filled by them when the apply runs.
      tags: [metadata]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrichItemRequest"
      responses:
        "200":
          description: What the providers would change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrichPreview"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

components:
  parameters:
    EntityType:
      name: entityType
      in: path
      required: true
      description: >
        The entity kind an entity operation targets. `playlist` is a
        WaxDeck-side entity rather than a catalog one: it carries artwork
        and nothing else, and its operations are owner-gated instead of
        administrators-only. `podcast` is a show's channel cover, whose
        operations accept the accounts that already curate shows:
        `managePodcasts` holders as well as administrators.
      schema:
        type: string
        enum: [album, artist, release-group, genre, playlist, podcast]

    EntityPid:
      name: entityPid
      in: path
      required: true
      description: Entity PID (e.g. `al-01JZX5N8QW3F4V9T2B7KD3M9R6`).
      schema:
        type: string
        pattern: "^[a-z]{2}-[0-9A-HJKMNP-TV-Z]{26}$"
  responses:
    FieldLocked:
      description: >
        The edit targets a metadata field someone locked earlier and
        the request did not set `force` (code `field-locked`). The
        message names the field.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Lyrics:
      type: object
      description: >
        Lyrics for one item. At least one of `synced` and `unsynced` is
        non-empty.
      required: [pid, source]
      properties:
        pid:
          type: string
          description: The item these lyrics belong to.
        source:
          type: string
          description: >
            Where the lyrics came from: `tag` (an embedded USLT/SYLT
            frame), `sidecar` (an `.lrc` beside the audio), `user`, or
            `enrichment`. The same vocabulary artwork reports; it
            replaces the older `lrc`/`embedded` pair, which named
            formats rather than producers.
          example: sidecar
        provider:
          type: string
          description: >
            The lyrics provider that supplied an `enrichment` copy.
            Empty for every other source.
        synced:
          type: array
          description: Time-synced lines, ordered by `timeMs`.
          items:
            $ref: "#/components/schemas/SyncedLine"
        unsynced:
          type: string
          description: Plain text block when no synced lines exist.

    SyncedLine:
      type: object
      description: One time-synced lyric line.
      required: [timeMs, text]
      properties:
        timeMs:
          type: integer
          format: int64
          description: Line start in milliseconds.
        text:
          type: string
          description: Line text.

    MetadataFields:
      type: object
      description: The editor's field vocabulary.
      required: [kinds, entityTypes]
      properties:
        kinds:
          type: array
          description: Editable fields per item kind.
          items:
            $ref: "#/components/schemas/KindFields"
        entityTypes:
          type: array
          description: Editable fields per entity type.
          items:
            $ref: "#/components/schemas/EntityTypeFields"

    KindFields:
      type: object
      description: One item kind's editable vocabulary.
      required: [kind, fields, creditRoles]
      properties:
        kind:
          $ref: "#/components/schemas/MediaType"
        fields:
          type: array
          description: Editable scalar fields.
          items:
            $ref: "#/components/schemas/EditableField"
        creditRoles:
          type: array
          description: >
            Credit roles for the kind; roles marked database-only
            have no round-trippable tag form.
          items:
            $ref: "#/components/schemas/EditableField"

    EditableField:
      type: object
      description: One editable field or role.
      required: [name, writeBack]
      properties:
        name:
          type: string
          description: The field or role name the edit APIs accept.
          example: title
        writeBack:
          type: boolean
          description: >
            Whether the value can write into file tags; false means
            database-only by upstream design.

    EntityTypeFields:
      type: object
      description: One entity type's editable vocabulary.
      required: [entityType, fields]
      properties:
        entityType:
          type: string
          description: "`album`, `artist`, or `release-group`."
        fields:
          type: array
          description: Editable entity fields.
          items:
            $ref: "#/components/schemas/EditableField"

    ItemMetadata:
      type: object
      description: Everything the editor shows for one item.
      required: [pid, mediaType, fields, lockedFields, provenance, credits, customTags, unofficial, virtualTrack, hasArtwork, hasOwnArtwork, writeBackIssues]
      properties:
        pid:
          type: string
          description: The item.
        mediaType:
          $ref: "#/components/schemas/MediaType"
        fields:
          type: object
          additionalProperties:
            type: string
          description: >
            The item's scalar fields by name (the kind's vocabulary
            from the fields endpoint); empty values are omitted.
        lockedFields:
          type: array
          description: >
            Currently locked fields, including namespaced artifacts
            (`lyrics`, `art`, `credit.ROLE`, `tag.KEY`).
          items:
            type: string
        provenance:
          type: array
          description: Per-field provenance for curated fields.
          items:
            $ref: "#/components/schemas/FieldProvenance"
        credits:
          type: array
          description: Credits by role.
          items:
            $ref: "#/components/schemas/Credit"
        lyrics:
          $ref: "#/components/schemas/LyricsState"
        chapters:
          type: array
          description: Chapter marks (books).
          items:
            $ref: "#/components/schemas/ChapterMark"
        customTags:
          type: array
          description: Custom tags.
          items:
            $ref: "#/components/schemas/CustomTag"
        unofficial:
          type: boolean
          description: Whether the item is marked as having no canonical release.
        virtualTrack:
          type: boolean
          description: >
            True for tracks carved from a shared file (CUE rips):
            their edits are always database-only and they export no
            fingerprint, by upstream design.
        hasArtwork:
          type: boolean
          description: >
            Whether the item resolves any front cover, including one
            inherited from its album, release group, or artist.
        hasOwnArtwork:
          type: boolean
          description: >
            Whether the item holds its own front cover, as opposed to
            inheriting one from the entity chain. Lets the editor tell an
            item-level cover from an inherited one.
        albumPid:
          type: string
          description: The item's album entity, when any.
        artistPid:
          type: string
          description: The item's artist entity, when any.
        releaseGroupPid:
          type: string
          description: The item's release group entity, when any.
        writeBackIssues:
          type: array
          description: >
            Files whose on-disk tags are out of step with the catalog
            (failed write-backs, values the format cannot store).
          items:
            $ref: "#/components/schemas/WriteBackIssue"
        mayCurate:
          type: boolean
          description: >
            Whether the caller may run the item-scoped edits this
            document describes: administrators always, everyone else
            exactly for the items their own uploads brought in. The
            read answers anyone who can see the item, so without this
            a client has no way to tell an editor it can save from one
            every save will be refused. Optional for compatibility;
            absent reads as unknown, and a client that treats it as
            false only withholds a door the server would have refused
            anyway.
        acquisition:
          $ref: "#/components/schemas/ItemAcquisition"

    ItemAcquisition:
      type: object
      description: >
        How and where the item entered the library: recorded evidence,
        not a field. It is derived from what the import saw - an
        acquisition the server performed, or the file's own
        `SOURCE_URL`/`SOURCE_ID` tags - and no endpoint edits it, so a
        client draws it as a read-only caption rather than a form line.


        Present whenever the catalog holds an origin row, which
        includes a scanned file carrying acquisition tags; absent means
        no evidence of origin was ever seen. Absence is the ordinary
        state of a locally ripped file and is not an error.
      required: [sourceType]
      properties:
        sourceType:
          type: string
          description: >
            How the item arrived: `manual` (acquired by means the
            catalog did not record - which is what a tag-derived row
            reads, and what an import that named no provider stamps),
            `rss`, `youtube`, or whatever an acquisition provider
            stamped. Open set; treat an unknown value as opaque and
            show it as it stands. `manual` is much the commonest value
            and says only that origin evidence exists, so read
            `sourceUrl` for the substance.


            `local` is defined upstream for an item with no remote
            origin, and this server never writes it: such an item has
            no acquisition row at all, and so no block here. A client
            should still handle it, because the value can arrive from a
            catalog another host wrote.
          example: rss
        sourceUrl:
          type: string
          description: >
            Where it came from, redacted for sharing: emitted only for
            `http`/`https` origins, and reduced to scheme, host and
            path - userinfo, query and fragment are dropped. The read
            answers every user who can see the item while the stored
            value is verbatim (a credentialed feed URL, a signed
            download link, a local path), so what is not safe for all
            of them is not emitted at all. Absent means the stored
            origin was not an http URL, or was empty; it never means
            the origin is unknown.


            The path is kept, because without it the field says only
            which host and answers nothing. A secret carried in a path
            segment rather than the query therefore survives the
            redaction - the trade is deliberate, and the exposure is
            to accounts that can already see and stream the item.
          example: https://feeds.example.com/show/episode-12.mp3
        provider:
          type: string
          description: The acquisition provider that answered, when one did.
          example: rss
        acquiredAt:
          type: string
          format: date-time
          description: >
            When the item was acquired, as the catalog recorded it.
            Optional rather than required because a row whose time the
            catalog does not hold is better described by its absence
            than by a timestamp at the start of the era, which a client
            would render as a confident wrong date.

    ItemPermissions:
      type: object
      description: The caller's permissions on one item.
      required: [mayCurate]
      properties:
        mayCurate:
          type: boolean
          description: >
            Whether the caller may run the item-scoped metadata
            mutations: administrators always, everyone else exactly
            for the items their own uploads brought in.

    FieldProvenance:
      type: object
      description: >
        Who set one field's current value.


        The list carries two kinds of row. A scalar row names a metadata
        field (`title`, `genre`, ...) and reports the value a curator
        set. An artifact row names `art` or `lyrics`, with an empty
        `value` because the value is bytes rather than text. A non-empty
        provenance list therefore does not mean the item was curated: an
        untouched track with a cover in its tags reports one `art` row
        sourced `tag`. Count the scalar rows, not the list, when
        summarizing what a person changed.


        An artifact row does not imply the artifact. Locking `art` or
        `lyrics` to stop a scan filling it leaves a row with nothing
        behind it, and the `source` on such a row is invented by
        whichever writer took the lock rather than describing anything.
        Read `hasOwnArtwork` and `lyrics` on the enclosing
        `ItemMetadata` before presenting an artifact row's source as
        where something came from; on a lock-only row, `locked` is the
        only field worth reading.
      required: [field, source, locked]
      properties:
        field:
          type: string
          description: >
            The field, possibly namespaced, or `art` / `lyrics` for an
            artifact row.
        source:
          type: string
          description: >
            The producer: `tag` (the file's own tags), `sidecar` (a
            companion file beside the audio - a `cover.jpg`, an `.lrc`),
            `user` (set through the curation surface), `enrichment`
            (supplied by a metadata provider, named in `provider`),
            `organize` (written by an organize tag write-back), or `feed`
            (a podcast feed). A string, not a closed enum. `sidecar` and
            `feed` reach only artifact rows; a scalar field is never
            produced from a cover image or a feed.
        provider:
          type: string
          description: The enrichment provider, for enriched fields.
        sourceUrl:
          type: string
          description: >
            Where a fetched value's bytes came from, on the rows that
            have one (an enrichment or feed cover). Empty otherwise.


            Redacted exactly as `ItemAcquisition.sourceUrl` is, and for
            the same reason: `http`/`https` only, reduced to scheme,
            host and path, because a feed cover's row holds the show's
            own enclosure URL and this read answers every account that
            can see the item.
        locked:
          type: boolean
          description: Whether the field is locked.
        updatedAt:
          type: string
          format: date-time
          description: When the value last changed.

    ArtworkLock:
      type: object
      description: >
        Whether an entity's front cover is pinned against enrichment and
        scan re-derives.
      required: [locked]
      properties:
        locked:
          type: boolean
          description: True when the cover is pinned.

    Credit:
      type: object
      description: One credit role with its people.
      required: [role, names]
      properties:
        role:
          type: string
          description: The role name.
          example: producer
        names:
          type: array
          description: The credited people, in stored order.
          items:
            type: string

    LyricsState:
      type: object
      description: The stored lyrics, when any.
      required: [synced, source]
      properties:
        synced:
          type: boolean
          description: Whether timed lines are stored.
        source:
          type: string
          description: >
            Where the stored copy came from: `tag` (an embedded
            USLT/SYLT frame), `sidecar` (an `.lrc` beside the audio),
            `user`, or `enrichment`. A string, not a closed enum.


            This is the same vocabulary artwork reports, so one mark
            serves both. It replaces the older `lrc`/`embedded` pair,
            which named the two file formats rather than the producer
            and had nowhere to put a fetched copy; `lrc` is now
            `sidecar` and `embedded` is now `tag`.
        provider:
          type: string
          description: >
            The lyrics provider that supplied an `enrichment` copy.
            Empty for every other source.
        lrc:
          type: string
          description: >
            The lyrics serialized as LRC text (timed lines when
            synced, bare lines otherwise), the editor's working
            format.

    CustomTag:
      type: object
      description: One custom tag.
      required: [key, values]
      properties:
        key:
          type: string
          description: Canonical uppercase key.
          example: MOOD
        values:
          type: array
          description: Ordered values.
          items:
            type: string

    WriteBackIssue:
      type: object
      description: One file out of step with the catalog.
      required: [filePid, code]
      properties:
        filePid:
          type: string
          description: The backing file.
        code:
          type: string
          description: >
            The diagnostic: `tag-write-unsynced` (a write-back was
            refused or failed; the file's tags lag the catalog) or
            `tag-write-lost` (the write ran but the format could not
            store the value). A string, not a closed enum.
        tagKey:
          type: string
          description: The affected tag key, when known.
        detail:
          type: string
          description: >
            Human-readable detail, administrators only. It is the tag
            writer's own error, which names the file's absolute path, so
            it is withheld from everyone else exactly as the diagnostics
            listing is; `code`, `tagKey`, and `filePid` say what went
            wrong without saying where the library lives. Absent rather
            than redacted for a non-administrator.

    MetadataEdit:
      type: object
      description: Scalar field edits for one item.
      required: [fields]
      properties:
        fields:
          type: object
          minProperties: 1
          additionalProperties:
            type: string
          description: >
            Field name to new value; an empty string clears the
            field. Names come from the kind's vocabulary.
        writeBack:
          type: boolean
          default: false
          description: Also write the new values into the file's tags.
        lock:
          type: boolean
          default: true
          description: Lock the edited fields.
        force:
          type: boolean
          default: false
          description: Override existing locks on the edited fields.

    WriteBackFailure:
      type: object
      description: One file a write-back could not update.
      required: [filePid, reason]
      properties:
        filePid:
          type: string
          description: The file.
        path:
          type: string
          description: Its display path.
        reason:
          type: string
          description: Why the write failed or was refused.

    MetadataEditResult:
      type: object
      description: >
        The outcome of a metadata mutation. The catalog write
        succeeded whenever this shape returns; write-back trouble
        and drop warnings ride along instead of failing the edit.
      required: [applied]
      properties:
        applied:
          type: boolean
          description: Always true; the catalog committed.
        writeBackFailures:
          type: array
          description: Files whose tags could not be updated.
          items:
            $ref: "#/components/schemas/WriteBackFailure"
        warnings:
          type: array
          description: >
            Non-fatal notes: typed drop warnings from the tag
            library (a format refusing embedded synced lyrics, a
            chapter cap), roles without a tag form, malformed LRC
            lines skipped.
          items:
            type: string

    MetadataCommit:
      type: object
      description: >
        The staged parts of one item's editor draft. Every part is
        optional and at least one is required; an empty body answers
        `invalid-request` rather than committing nothing successfully.


        The three write switches are hoisted out of the per-part
        bodies the sequential endpoints take, because a draft is saved
        with one set of them.
      properties:
        fields:
          type: object
          minProperties: 1
          additionalProperties:
            type: string
          description: >
            Field name to new value; an empty string clears the field.
            Names come from the kind's vocabulary, as for
            `editItemMetadata`.
        credits:
          type: array
          maxItems: 50
          description: >
            Replacement people per role, applied in the order given.
          items:
            $ref: "#/components/schemas/CommitCredits"
        lyrics:
          $ref: "#/components/schemas/CommitLyrics"
        clearLyrics:
          type: boolean
          description: >
            Remove the stored lyrics. Mutually exclusive with
            `lyrics`; sending both answers `invalid-request`.
        chapters:
          type: array
          maxItems: 2000
          description: >
            A replacement chapter list for a book: ordered,
            non-overlapping, on the book timeline. An empty array
            restores the embedded chapters, as for `setBookChapters`.
          items:
            $ref: "#/components/schemas/ChapterMark"
        tagSets:
          type: object
          maxProperties: 100
          description: >
            Custom tag key to its replacement values; empty values
            clear that tag. Applied in sorted key order, because a
            JSON object carries none of its own and the parts list
            has to be reproducible.
          additionalProperties:
            type: array
            maxItems: 100
            items:
              type: string
        tagRemoves:
          type: array
          maxItems: 100
          description: Custom tag keys to remove, applied in the order given.
          items:
            type: string
        unofficial:
          type: boolean
          description: >
            The release-status mark: true marks the item as having no
            canonical release, false clears the mark. Omitted leaves it
            alone.
        writeBack:
          type: boolean
          default: false
          description: >
            Also write the new values into the backing file's tags,
            for the parts that have a tag form (fields, credits,
            lyrics).
        lock:
          type: boolean
          default: true
          description: >
            Lock what each part wrote, against scans and enrichment.
        force:
          type: boolean
          default: false
          description: Override existing locks.

    CommitCredits:
      type: object
      description: >
        Replacement people for one credit role inside a compound
        commit. The write switches live on the commit rather than here.
      required: [role, names]
      properties:
        role:
          type: string
          description: The role, from the kind's role vocabulary.
          example: producer
        names:
          type: array
          maxItems: 100
          description: The people; empty clears the role.
          items:
            type: string

    CommitLyrics:
      type: object
      description: >
        Replacement lyrics inside a compound commit. At least one of
        `lrc` and `plain` must carry content. The write switches live
        on the commit rather than here.
      properties:
        lrc:
          type: string
          maxLength: 200000
          description: >
            Timed lines as LRC text. Malformed lines are skipped and
            reported as warnings with their line numbers.
        plain:
          type: string
          maxLength: 200000
          description: A plain unsynchronized block.

    MetadataCommitResult:
      type: object
      description: >
        What a compound commit did, part by part in execution order.


        Read `parts` rather than the status code: a refusal is a 200
        here, and the accumulated `writeBackFailures` and `warnings`
        belong to the parts that committed before it.


        There is no `resultingAlbumPid`. Editing a release-keying field
        on one item can still regroup its release, exactly as
        `editItemMetadata` can, and neither operation reports where it
        landed; only the bulk edit does, because only its caller (the
        release workbench) is following a whole release across the
        move.
      required: [parts]
      properties:
        parts:
          type: array
          description: >
            One entry per part the request carried, in the order they
            were run. A part after a refused one is present and
            `skipped`, so the list always accounts for the whole
            request.
          items:
            $ref: "#/components/schemas/MetadataCommitPart"
        writeBackFailures:
          type: array
          description: >
            Files whose tags could not be updated, merged across every
            part and deduplicated: several parts can report the same
            file for the same reason, and each line is for a person to
            read once.
          items:
            $ref: "#/components/schemas/WriteBackFailure"
        warnings:
          type: array
          description: >
            The parts' non-fatal notes, merged: typed drop warnings
            from the tag library, roles without a tag form, malformed
            LRC lines skipped.
          items:
            type: string

    MetadataCommitPart:
      type: object
      description: One part of a compound commit and what became of it.
      required: [part, status]
      properties:
        part:
          type: string
          enum: [fields, credit, lyrics, chapters, tagSet, tagRemove, releaseStatus]
          description: >
            Which staged part this entry is about. `lyrics` covers both
            replacing them and clearing them.
        detail:
          type: string
          description: >
            Which one, where the part repeats: the role for `credit`,
            the tag key for `tagSet` and `tagRemove`. Absent otherwise.
          example: producer
        status:
          type: string
          enum: [committed, refused, skipped]
          description: >
            `committed` means the catalog write landed (write-back
            trouble rides `writeBackFailures`, never this).
            `refused` is the one part that stopped the commit, with
            its `refusal`. `skipped` is a part after that one, which
            was never attempted.
        refusal:
          $ref: "#/components/schemas/Error"

    BulkEdit:
      type: object
      description: The same scalar edits applied to many items.
      required: [itemPids, fields]
      properties:
        itemPids:
          type: array
          minItems: 1
          maxItems: 1000
          description: The items to edit.
          items:
            type: string
        fields:
          type: object
          minProperties: 1
          additionalProperties:
            type: string
          description: Field name to new value, applied to every item.
        writeBack:
          type: boolean
          default: false
          description: Also write into the files' tags.
        skipLocked:
          type: boolean
          default: false
          description: >
            Skip items whose target fields are locked instead of
            failing the batch.
        force:
          type: boolean
          default: false
          description: Override locks (mutually exclusive with `skipLocked`).

    BulkEditResult:
      type: object
      description: Per-item outcomes of a bulk edit.
      required: [edited, skipped]
      properties:
        edited:
          type: array
          description: Items whose catalog rows updated.
          items:
            type: string
        skipped:
          type: array
          description: Items skipped for locks.
          items:
            type: string
        writeBackFailures:
          type: array
          description: Files whose tags could not be updated.
          items:
            $ref: "#/components/schemas/WriteBackFailure"
        resultingAlbumPid:
          type: string
          description: >
            The album entity the edited items now sit on, reported
            when the edit rewrote a release-keying field (`album`,
            `album_artist`, `year`) and every edited item landed on
            one album. Rewriting those fields regroups the members
            onto a fresh album pid instead of renaming the release
            in place, so a caller showing the old album follows this
            to the new one. Absent when no keying field was edited,
            nothing was edited, or the edited items split across
            releases.

    CreditsEdit:
      type: object
      description: Replacement people for one credit role.
      required: [role, names]
      properties:
        role:
          type: string
          description: The role, from the kind's role vocabulary.
          example: producer
        names:
          type: array
          maxItems: 100
          description: The people; empty clears the role.
          items:
            type: string
        writeBack:
          type: boolean
          default: false
          description: Write the role's tag keys where a form exists.
        lock:
          type: boolean
          default: true
          description: Lock `credit.ROLE`.
        force:
          type: boolean
          default: false
          description: Override an existing lock.

    LyricsEdit:
      type: object
      description: >
        Replacement lyrics. At least one of `lrc` and `plain` must
        carry content.
      properties:
        lrc:
          type: string
          maxLength: 200000
          description: >
            Timed lines as LRC text. Malformed lines are skipped and
            reported as warnings with their line numbers.
        plain:
          type: string
          maxLength: 200000
          description: A plain unsynchronized block.
        writeBack:
          type: boolean
          default: false
          description: >
            Write the `.lrc` sidecar next to the file and embed
            where the format allows.
        lock:
          type: boolean
          default: true
          description: Lock the lyrics artifact.
        force:
          type: boolean
          default: false
          description: Override an existing lock.

    ChaptersEdit:
      type: object
      description: A replacement chapter list.
      required: [chapters]
      properties:
        chapters:
          type: array
          maxItems: 2000
          description: >
            Ordered, non-overlapping chapters on the book timeline;
            empty restores the embedded chapters.
          items:
            $ref: "#/components/schemas/ChapterMark"
        lock:
          type: boolean
          default: true
          description: Lock the chapters artifact.
        force:
          type: boolean
          default: false
          description: Override an existing lock.

    TagEdit:
      type: object
      description: Replacement values for one custom tag.
      required: [values]
      properties:
        values:
          type: array
          maxItems: 100
          description: Ordered values; empty clears the tag.
          items:
            type: string
        lock:
          type: boolean
          default: true
          description: Lock `tag.KEY`.
        force:
          type: boolean
          default: false
          description: Override an existing lock.

    TagEditResult:
      type: object
      description: The outcome of a tag edit.
      required: [key, stored]
      properties:
        key:
          type: string
          description: The canonical uppercase key actually used.
        stored:
          type: integer
          description: Values stored after deduplication.

    LocksEdit:
      type: object
      description: A lock or unlock for named fields.
      required: [fields, locked]
      properties:
        fields:
          type: array
          minItems: 1
          maxItems: 100
          description: The fields, possibly namespaced.
          items:
            type: string
        locked:
          type: boolean
          description: True locks, false unlocks.

    LocksResult:
      type: object
      description: The item's locks after the change.
      required: [lockedFields]
      properties:
        lockedFields:
          type: array
          description: Every currently locked field.
          items:
            type: string

    EntityEdit:
      type: object
      description: Entity field edits.
      required: [edits]
      properties:
        edits:
          type: object
          minProperties: 1
          additionalProperties:
            type: string
          description: >
            Field name to new value, from the entity type's
            vocabulary; empty clears.
        writeBack:
          type: boolean
          default: false
          description: Push tag-formed values into member files.
        lock:
          type: boolean
          default: true
          description: Lock the edited entity fields.
        force:
          type: boolean
          default: false
          description: Override existing locks.

    EntityCuration:
      type: object
      description: An entity's curated fields.
      required: [curated]
      properties:
        curated:
          type: array
          description: Curated fields with provenance.
          items:
            $ref: "#/components/schemas/EntityCuratedField"

    EntityCuratedField:
      type: object
      description: One curated entity field.
      required: [field, source, locked]
      properties:
        field:
          type: string
          description: The field.
        value:
          type: string
          description: The curated value.
        source:
          type: string
          description: The producer, as in item provenance.
        locked:
          type: boolean
          description: Whether the field is locked.
        updatedAt:
          type: string
          format: date-time
          description: When the value last changed.

    ReleaseStatusEdit:
      type: object
      description: The unofficial mark.
      required: [unofficial]
      properties:
        unofficial:
          type: boolean
          description: >
            True marks the item as having no canonical release;
            false clears the mark.

    RematchResult:
      type: object
      description: The review entry a rematch opened.
      required: [reviewEntryId]
      properties:
        reviewEntryId:
          type: string
          description: The pending entry; candidates fill in asynchronously.

    EnrichItemRequest:
      type: object
      description: What to fetch for one item.
      required: [want]
      properties:
        want:
          type: array
          minItems: 1
          description: The artifacts to fetch.
          items:
            type: string
            enum: [cover, lyrics, genres, book]
        proposal:
          $ref: "#/components/schemas/EnrichProposal"

    EnrichProposal:
      type: object
      description: >
        A previewed enrichment to commit as approved. Both halves are
        the preview's own, passed back verbatim; the server writes
        these values rather than fetching fresh ones. `proposal` on
        `previewEnrichItem` has no effect.
      properties:
        fields:
          type: array
          description: The approved field proposals.
          items:
            $ref: "#/components/schemas/EnrichFieldProposal"
        cover:
          $ref: "#/components/schemas/EnrichCoverProposal"

    EnrichFieldProposal:
      type: object
      description: >
        One field an enrichment provider would fill. `lyrics` carries
        the full text (LRC when the provider answered timed lines);
        `genre` the joined, normalized genre scalar; a book want
        proposes each scalar it can fill as its own row.
      required: [name, proposed, provider]
      properties:
        name:
          type: string
          description: The metadata field the proposal targets.
        current:
          type: string
          description: >
            The stored value the proposal would replace. Empty today by
            construction - enrichment only fills empty fields - but
            reported so a diff never has to trust that rule.
        proposed:
          type: string
          description: The value the provider answered with.
        provider:
          type: string
          description: The provider that supplied the value.

    EnrichCoverProposal:
      type: object
      description: One cover image an enrichment provider would store.
      required: [provider, data]
      properties:
        provider:
          type: string
          description: The provider that supplied the image.
        data:
          type: string
          format: byte
          description: The image bytes, base64.
        format:
          type: string
          description: >
            The image format as the provider read it off the transport;
            a fallback the bytes beat, kept so the commit stores what
            the preview held.
        sourceUrl:
          type: string
          description: Where the provider fetched the image from.

    EnrichPreview:
      type: object
      description: >
        What a one-item enrichment would change, without having changed
        it. `fields` and `cover` together are the proposal to pass back
        on `enrichItem`.
      required: [fields, skipped]
      properties:
        fields:
          type: array
          description: The field values providers would fill.
          items:
            $ref: "#/components/schemas/EnrichFieldProposal"
        cover:
          $ref: "#/components/schemas/EnrichCoverProposal"
        skipped:
          type: array
          description: >
            Wants nothing is proposed for, each naming why - the same
            reasons the blind fetch reports.
          items:
            type: string

    EnrichItemResult:
      type: object
      description: What a one-item enrichment fetched.
      required: [applied, skipped]
      properties:
        applied:
          type: array
          description: >
            Artifacts fetched and stored, each naming its provider
            (for example `cover: fanarttv`).
          items:
            type: string
        skipped:
          type: array
          description: >
            Artifacts not stored, each naming why (locked, already
            present, no provider hit, provider unconfigured).
          items:
            type: string
