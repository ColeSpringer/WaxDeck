# WaxDeck API contract fragment; assembled into api/openapi.yaml by `make generate`.
paths:
  /library/health:
    get:
      operationId: getLibraryHealth
      summary: Metadata health summary
      description: >
        The library completeness score with its per-rule breakdown.
        Health is computed by a background sweep; `warmingUp` is true
        until the first sweep covers the library (a fresh install
        shows honest progress instead of a wall of red), and
        `sweptAt` dates the numbers. Items marked unofficial are
        exempt from rules that assume a canonical release. Rule names
        are server-defined strings; the current set is `missing-art`,
        `small-art`, `missing-mbid`, `missing-year`, `missing-genre`,
        `genre-whitelist`, `missing-lyrics`, `missing-narrator`,
        `missing-asin`, `path-mismatch`, `write-unsynced`,
        `legacy-tags`, `corrupt-audio`, and `duration-mismatch`.
        `duration-mismatch` flags an analyzed file whose header states a
        length its decoded audio does not have, off by more than two
        seconds and two percent; it has no bulk fix. A multi-file book
        fails a file's rule (`corrupt-audio`, `write-unsynced`,
        `legacy-tags`, `duration-mismatch`) when any of its parts does.
        `write-unsynced` lists files whose tags lag the catalog: a
        refused or failed write-back, a value the format could not
        store, and a value an edit changed in the catalog without
        writing it (a value a clean-up pass normalized in the catalog
        alone does not count). Its fix writes those values and counts
        an item filled only when none remains.
        `genre-whitelist` flags an
        item carrying a genre the server's genre tree does not know; it
        is deliberately not bulk-fixable, because the background
        normalizer already rewrites everything the tree does know, so
        what remains is answered by editing the tree
        (`/admin/genre-tree`), not the item.
      tags: [health]
      responses:
        "200":
          description: The health summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthSummary"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /library/health/issues:
    get:
      operationId: listHealthIssues
      summary: List items failing health rules
      description: >
        Keyset-paginated items with outstanding issues, optionally
        restricted to one rule, worst first (most failed rules, then
        title). Each row carries every rule the item currently fails
        so the list doubles as a per-item worklist.
      tags: [health]
      parameters:
        - name: rule
          in: query
          description: Restrict to one rule name.
          schema:
            type: string
        - name: cursor
          in: query
          description: >
            Opaque keyset cursor from a previous page's `nextCursor`.
            Omit for the first page.
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum items per page.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: One page of items with issues.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthIssuePage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /library/health/sweep:
    post:
      operationId: sweepLibraryHealth
      summary: Re-sweep health now
      description: >
        Queues a full health sweep instead of waiting for the
        scheduled one. Administrators only. The summary's `sweeping`
        is true from the request until the sweep finishes, and the
        `health` sync marker tells every account when to read the
        summary again: once when the sweep is queued and once when it
        finishes. A sweep that fails answers the request too, and the
        summary's `sweepFailed` says so until a sweep lands; of a run
        of failures, only the first is marked.
      tags: [health]
      responses:
        "202":
          description: Sweep queued.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /library/health/fix:
    post:
      operationId: fixHealthIssues
      summary: Bulk-fix a health rule
      description: >
        Fixes one `fixable` rule across `itemPids` or every failing item. An
        unscoped metadata fix is an enrichment job (`jobPid`) over its rule's
        phases; the rest is a `health-fix` task (`taskId`). `path-mismatch`
        needs `itemPids`: moving every mismatched file is an organize pass,
        previewed and applied through `/organize/preview` and
        `/organize/apply`. A path fix moves its items as organize jobs,
        each undoable through `/organize/undo`, and its summary counts
        `moved` (the items it moved) and `held` (by hold code, as
        `/organize/preview` names them) beside `skipped` and `failed`, and
        lists the jobs as `jobPids`. Administrators only.
      tags: [health]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HealthFixRequest"
      responses:
        "202":
          description: The fix started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthFixResult"
        "400":
          description: >
            `invalid-request`: the rule has no fix on this server, an item
            pid is malformed, a fix names more than 1000 `itemPids`, or a
            `path-mismatch` fix names none.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: >
            The fix was refused. `conflict`: an enrichment pass is
            running and the fix needs one, or the rule is being fixed
            already. `read-only`: the fix writes files and the server is
            read-only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /library/diagnostics:
    get:
      operationId: listFileDiagnostics
      summary: Query per-file diagnostics
      description: >
        Persisted per-file diagnostics (what scan, organize, replaygain,
        enrichment, tag write-back, and the analyze pass recorded about
        individual files) across the library
        in a stable path order, optionally narrowed by origin, code,
        severity, or library. This is the query surface a diagnostics
        dashboard reads instead of auditing item by item. Administrators
        only.
      tags: [health]
      parameters:
        - $ref: "#/components/parameters/DiagnosticOriginFilter"
        - $ref: "#/components/parameters/DiagnosticCodeFilter"
        - $ref: "#/components/parameters/DiagnosticSeverityFilter"
        - $ref: "#/components/parameters/DiagnosticLibraryFilter"
        - name: cursor
          in: query
          description: >
            Opaque cursor from a previous page's `nextCursor`. Omit for the
            first page.
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum diagnostics per page.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: One page of file diagnostics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileDiagnosticPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /library/diagnostics/summary:
    get:
      operationId: getDiagnosticSummary
      summary: Summarize per-file diagnostics
      description: >
        Diagnostic counts grouped by writer, code, and severity, most severe
        first, over the whole match. The same origin, code, severity, and
        library filters as the listing apply; paging does not. A dashboard
        reads this for its at-a-glance counts without walking the files.
        Administrators only.
      tags: [health]
      parameters:
        - $ref: "#/components/parameters/DiagnosticOriginFilter"
        - $ref: "#/components/parameters/DiagnosticCodeFilter"
        - $ref: "#/components/parameters/DiagnosticSeverityFilter"
        - $ref: "#/components/parameters/DiagnosticLibraryFilter"
      responses:
        "200":
          description: Grouped diagnostic counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticSummary"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /library/duplicates:
    get:
      operationId: listDuplicates
      summary: List duplicate entities
      description: >
        Duplicate artist, album, release group, and genre groups from
        the catalog audit, each with a suggested survivor (the audit
        orders each finding survivor first). Merging re-parents every
        child (tracks, albums, credits, play history rides along) and
        the survivor keeps its pid, so a later rescan does not
        resurrect the loser. The list is bounded to the first two
        hundred groups; merge and re-list for more.
      tags: [health]
      responses:
        "200":
          description: Duplicate groups.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuplicateGroups"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /library/duplicates/merge:
    post:
      operationId: mergeDuplicates
      summary: Merge duplicate entities
      description: >
        Merges the losers into the survivor atomically. The losers'
        children, credits, and play history re-parent onto the
        survivor; identifiers union. Administrators only.
      tags: [health]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergeRequest"
      responses:
        "200":
          description: The merge outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergeResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /library/upgrades:
    get:
      operationId: listUpgrades
      summary: List quality upgrade groups
      description: >
        Groups of the same recording in different encodings, best
        quality first within each group, each encoding named by its
        file. An item holding another encoding of its recording as one
        of its files (tied by their recording id) is a group of its
        own, listed first; then items the fingerprint index finds are
        the same recording, which needs the library analyzed. A copy
        of the same audio is not an encoding and never appears (the
        item's files list it). The resolve endpoint keeps one and
        trashes the rest.
      tags: [health]
      responses:
        "200":
          description: Upgrade groups.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeGroups"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /library/upgrades/resolve:
    post:
      operationId: resolveUpgrade
      summary: Keep the best encoding
      description: >
        Keeps one encoding of an upgrade group and moves the named
        inferior ones to the trash (recoverable within the retention
        window). Across items, `removeItemPids` names the items to
        trash, each with all of its files. Within one item - a group
        whose members share its pid - `keepFilePid` and
        `removeFilePids` name the files: the removed ones go together
        with any copy of their audio, and the item stays on the kept
        one. Exactly one of the two removal lists is given. A cue rip's
        file plays every track carved from it, so a removal that would
        take it from under tracks the call does not name is
        `invalid-request` with `params.reason` `cue-rip`. A named
        encoding in a read-only library, or any while the server is
        read-only, refuses the whole call with `read-only`, as does a
        copy in a read-only library unless the kept encoding's library
        is writable, when the copy stays; a move the trash could not
        make refuses it with `conflict` after the others went.
        Administrators only.
      tags: [health]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpgradeResolveRequest"
      responses:
        "200":
          description: The resolution outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeResolveResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            The resolution was refused. `read-only`: a named encoding's
            library, or the whole server, is read-only. `catalog-busy`:
            another catalog job holds the file-mutation scope the move
            to the trash needs; retry when it ends. `storage-unwritable`:
            the library's folder refused every move to the trash (its
            permissions, or a read-only mount), so nothing moved.
            `conflict`: some moves to the trash failed after others went,
            and the message says how many.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

components:
  parameters:
    DiagnosticOriginFilter:
      name: origin
      in: query
      description: Restrict to one writer.
      schema:
        type: string
        enum: [scan, organize, replaygain, edit, enrichment, analyze]
    DiagnosticCodeFilter:
      name: code
      in: query
      description: Restrict to one diagnostic code.
      schema:
        type: string
        enum:
          - unsupported_format
          - legacy_only_tags
          - lyrics_partial
          - sidecar_skipped
          - cue_track_dropped
          - tag_write_lost
          - tag_write_unsynced
          - tag_write_owed
          - corrupt_audio
          - sort_name_fallback
          - fingerprint_fallback
          - duplicate_copy
          - alternate_encoding
    DiagnosticSeverityFilter:
      name: severity
      in: query
      description: Restrict to one severity.
      schema:
        type: string
        enum: [info, warn, error]
    DiagnosticLibraryFilter:
      name: library
      in: query
      description: Restrict to files under one library root.
      schema:
        type: string
        pattern: "^lb-[0-9A-HJKMNP-TV-Z]{26}$"
  schemas:
    HealthSummary:
      type: object
      description: The library's metadata health at the last sweep.
      required: [score, totalItems, evaluatedItems, warmingUp, sweepFailed, rules]
      properties:
        score:
          type: number
          format: double
          description: >
            Library completeness score, 0 to 100: the weighted share
            of evaluated items passing every rule that applies to
            them.
        totalItems:
          type: integer
          description: Items in scope for health.
        evaluatedItems:
          type: integer
          description: Items the sweep has covered so far.
        warmingUp:
          type: boolean
          description: >
            True until the sweep first covers the library; the score
            is provisional while true.
        sweptAt:
          type: string
          format: date-time
          description: When the last sweep finished.
        sweeping:
          type: boolean
          description: >
            True while a sweep runs, or one an administrator asked for
            waits to run.
        sweepFailed:
          type: boolean
          description: >
            True when the last sweep failed, so the numbers are the last
            landed sweep's (`sweptAt`); false again once a sweep lands.
        rules:
          type: array
          description: Per-rule failure counts, heaviest first.
          items:
            $ref: "#/components/schemas/HealthRuleCount"

    HealthRuleCount:
      type: object
      description: One rule's current standing.
      required: [rule, failing, fixable, fixing]
      properties:
        rule:
          type: string
          description: The rule name.
          example: missing-art
        label:
          type: string
          description: Human-readable rule label.
        failing:
          type: integer
          description: Items currently failing the rule.
        fixable:
          type: boolean
          description: >
            Whether the fix endpoint can fix this rule on this install;
            a `path-mismatch` fix takes `itemPids`.
        fixing:
          type: boolean
          description: >
            True while a fix for the rule is under way: a pass-backed
            fix from its start until its re-check lands, a task-backed
            one while its task is queued or running. Another fix for
            the rule answers `conflict` meanwhile.
        fixBlocked:
          type: string
          description: >
            Why a rule that has a fix cannot be fixed on this install;
            absent when `fixable`, and for rules with no fix at all.
            `needs-contact`: the server has no enrichment contact, which
            is what lets it ask MusicBrainz and the other free public
            sources. `needs-lyrics-source`, `needs-art-source`,
            `needs-genre-source`, `needs-book-source`: no enrichment
            source the fix could use, for lyrics, artwork, genres, or
            book metadata, is switched on. `no-managed-library`: no
            library is managed, so there is no layout for paths to match.
            `read-only`: the server is read-only, and the fix writes
            files.
          enum:
            [
              needs-contact,
              needs-lyrics-source,
              needs-art-source,
              needs-genre-source,
              needs-book-source,
              no-managed-library,
              read-only,
            ]

    HealthIssuePage:
      type: object
      description: One page of items with outstanding issues.
      required: [items]
      properties:
        items:
          type: array
          description: Items, worst first.
          items:
            $ref: "#/components/schemas/HealthIssue"
        nextCursor:
          type: string
          description: Cursor for the next page; omitted on the last.

    HealthIssue:
      type: object
      description: One item and the rules it fails.
      required: [pid, title, mediaType, rules]
      properties:
        pid:
          type: string
          description: The item.
        title:
          type: string
          description: Its title.
        artist:
          type: string
          description: Its artist or author.
        mediaType:
          $ref: "#/components/schemas/MediaType"
        rules:
          type: array
          description: The rules the item currently fails.
          items:
            type: string
        detail:
          $ref: "#/components/schemas/HealthIssueDetail"

    HealthIssueDetail:
      type: object
      description: >
        What a failing rule measured, present when one did:
        `duration-mismatch` carries both lengths of the file that fails
        it, which for a book may be one part and for a cue-carved track
        is the whole file it is cut from.
      properties:
        headerMs:
          type: integer
          format: int64
          description: The length the file's header states.
        decodedMs:
          type: integer
          format: int64
          description: The length its audio decodes to.
        partIndex:
          type: integer
          minimum: 0
          description: The multi-file book part the lengths are of, zero-based.
        wholeFile:
          type: boolean
          description: The lengths are of the whole file a cue-carved track is cut from.

    HealthFixRequest:
      type: object
      description: A bulk fix for one rule.
      required: [rule]
      properties:
        rule:
          type: string
          description: The rule to fix.
          example: missing-art
        itemPids:
          type: array
          maxItems: 1000
          description: >
            Restrict to these items; absent fixes everything currently
            failing the rule, which `path-mismatch` refuses.
          items:
            type: string

    HealthFixResult:
      type: object
      description: >
        The fix that started: exactly one of `jobPid` and `taskId` names
        where it can be followed.
      required: [queued]
      properties:
        queued:
          type: integer
          description: Items the fix set out to reach.
        jobPid:
          type: string
          description: >
            The catalog enrichment job running the fix, for an unscoped
            fix of an enrichment-backed rule.
          example: jb-01JZX5N8QW3F4V9T2B7KD3M9R6
        taskId:
          type: string
          description: The `health-fix` tool task running the fix, otherwise.
          example: tk-01JZX5N8QW3F4V9T2B7KD3M9R6

    DuplicateGroups:
      type: object
      description: Duplicate entity groups from the audit.
      required: [groups]
      properties:
        groups:
          type: array
          description: Groups, bounded to the first two hundred.
          items:
            $ref: "#/components/schemas/DuplicateGroup"

    DuplicateGroup:
      type: object
      description: One duplicate finding.
      required: [entityType, survivor, losers]
      properties:
        entityType:
          type: string
          description: "`artist`, `album`, `release-group`, or `genre`."
        survivor:
          $ref: "#/components/schemas/DuplicateEntity"
        losers:
          type: array
          minItems: 1
          description: The suggested merge losers.
          items:
            $ref: "#/components/schemas/DuplicateEntity"
        detail:
          type: string
          description: >
            Why the members were paired, in the catalog's words (for
            example `same collation key`, or `same title and album
            artist` for albums a folder keeps apart). Absent when the
            catalog gave none.

    DuplicateEntity:
      type: object
      description: One entity in a duplicate group.
      required: [pid, name]
      properties:
        pid:
          type: string
          description: The entity.
        name:
          type: string
          description: Its display name.
        itemCount:
          type: integer
          description: Items under the entity, when cheaply known.

    MergeRequest:
      type: object
      description: A duplicate entity merge.
      required: [entityType, survivorPid, loserPids]
      properties:
        entityType:
          type: string
          enum: [album, artist, release-group, genre, series]
          description: >
            What is being merged. `series` is the one kind the
            duplicates listing never reports: a series is a tag rather
            than a curated entity, so a split spelling is found by
            eye on a book screen and merged from there.
        survivorPid:
          type: string
          description: The entity that keeps its pid.
        loserPids:
          type: array
          minItems: 1
          maxItems: 100
          description: The entities merged into the survivor.
          items:
            type: string

    MergeResult:
      type: object
      description: The merge outcome.
      required: [merged, childrenMoved]
      properties:
        merged:
          type: integer
          description: Losers merged.
        childrenMoved:
          type: integer
          description: Children re-parented onto the survivor.

    UpgradeGroups:
      type: object
      description: Same-recording different-encoding groups.
      required: [groups]
      properties:
        groups:
          type: array
          description: Groups, best quality first within each.
          items:
            $ref: "#/components/schemas/UpgradeGroup"

    UpgradeGroup:
      type: object
      description: One recording's encodings.
      required: [members]
      properties:
        members:
          type: array
          minItems: 2
          description: The encodings, best first.
          items:
            $ref: "#/components/schemas/UpgradeMember"

    UpgradeMember:
      type: object
      description: One encoding of a recording.
      required: [itemPid, filePid, title, codec, best, lossless]
      properties:
        itemPid:
          type: string
          description: The item.
        filePid:
          type: string
          description: >
            The file this encoding is, as getItemFiles names it. Within
            one item it is what tells the members apart.
          example: fl-01JZX5N8QW3F4V9T2B7KD3M9R6
        path:
          type: string
          description: >
            The file's path on the server, given where another member
            of the group has the same codec and bitrate: there its
            file's name is what tells the two apart.
        title:
          type: string
          description: Its title.
        artist:
          type: string
          description: Its artist.
        codec:
          type: string
          description: Audio codec.
        bitrate:
          type: integer
          description: Bitrate in kilobits per second; absent when unknown.
        sampleRate:
          type: integer
          description: Sample rate in Hz; absent when unknown.
        bitDepth:
          type: integer
          description: Bit depth; absent when unknown or lossy.
        lossless:
          type: boolean
          description: Whether the encoding is lossless.
        best:
          type: boolean
          description: The group's suggested keeper.

    UpgradeResolveRequest:
      type: object
      description: >
        Keep one encoding, trash the rest: by item across items, or by
        file within one.
      required: [keepItemPid]
      properties:
        keepItemPid:
          type: string
          description: The item to keep, or the item whose files these are.
        removeItemPids:
          type: array
          minItems: 1
          maxItems: 100
          description: The inferior encodings to trash, as whole items.
          items:
            type: string
        keepFilePid:
          type: string
          description: >
            The file to keep, within `keepItemPid`; required with
            `removeFilePids`.
          example: fl-01JZX5N8QW3F4V9T2B7KD3M9R6
        removeFilePids:
          type: array
          minItems: 1
          maxItems: 100
          description: The inferior encodings to trash, as files of `keepItemPid`.
          items:
            type: string
            example: fl-01JZX5N8QW3F4V9T2B7KD3M9R6

    UpgradeResolveResult:
      type: object
      description: The resolution outcome.
      required: [trashed]
      properties:
        trashed:
          type: integer
          description: Files moved to the trash.

    FileDiagnostic:
      type: object
      description: >
        One persisted observation about a library file, keyed for display by
        its path (files are not a first-class API resource, so no file id is
        surfaced).
      required: [path, origin, code, severity, seenAt]
      properties:
        path:
          type: string
          description: The file's display path.
        origin:
          type: string
          description: >
            The writer that recorded it (`scan`, `organize`, `replaygain`,
            `edit`, `enrichment`, or `analyze`); new writers may appear.
            `analyze` records the decode damage the analyze pass found or
            worked around, replaced each time the pass reads the file.
        code:
          type: string
          description: >
            What was observed (`unsupported_format`, `legacy_only_tags`,
            `lyrics_partial`, `sidecar_skipped`, `cue_track_dropped`,
            `tag_write_lost`, `tag_write_unsynced`, `tag_write_owed`,
            `corrupt_audio`, `sort_name_fallback`, `fingerprint_fallback`,
            `duplicate_copy`, or `alternate_encoding`); new codes may
            appear, so treat an unknown value as a generic finding.
            `duplicate_copy` marks a file holding the same audio as its
            item's primary file and `alternate_encoding` another encoding
            of its recording that ranked below the primary, both attached
            to the item as copies with the primary's path as `detail`;
            `tag_write_owed` a value the catalog holds but has not yet
            written to the file; `sort_name_fallback` display fields
            filled from sort tags or a number taken from the file name;
            and `fingerprint_fallback` a file fpcalc could not
            fingerprint, with fpcalc's reason as `detail`.
        severity:
          type: string
          description: "`info`, `warn`, or `error`."
        tagKey:
          type: string
          description: The tag key a key-specific diagnostic concerns, when any.
        detail:
          type: string
          description: The writer's own note, when it carries one.
        seenAt:
          type: string
          format: date-time
          description: When the diagnostic was last recorded.

    FileDiagnosticPage:
      type: object
      description: One page of per-file diagnostics.
      required: [diagnostics]
      properties:
        diagnostics:
          type: array
          items:
            $ref: "#/components/schemas/FileDiagnostic"
        nextCursor:
          type: string
          description: Cursor for the next page; omitted on the last.

    DiagnosticCount:
      type: object
      description: One grouped bucket of the diagnostic summary.
      required: [origin, code, severity, count]
      properties:
        origin:
          type: string
          description: The writer that recorded the diagnostics in this bucket.
        code:
          type: string
          description: The diagnostic code this bucket counts.
        severity:
          type: string
          description: "`info`, `warn`, or `error`."
        count:
          type: integer
          description: How many diagnostics fell in this bucket.

    DiagnosticSummary:
      type: object
      description: Diagnostic counts grouped by writer, code, and severity.
      required: [counts]
      properties:
        counts:
          type: array
          description: Buckets, most severe first.
          items:
            $ref: "#/components/schemas/DiagnosticCount"
