# WaxDeck API contract fragment; assembled into api/openapi.yaml by `make generate`.
# WebSocket frame DTOs for the event channel (api/events.md). No REST path
# references them; oapi-codegen skip-prune and a spectral override keep them.
components:
  schemas:
    WsSubscribeFrame:
      type: object
      description: >
        The WebSocket subscribe frame, sent by the client as the first
        message on the event channel (transport in `api/events.md`);
        `cmd`, `watch`, `tune`, `register-endpoint` and `ping` follow it.
        Clients pass the cursors they hold: as `serverSince` the one their
        mirror is at, and as `catalogSince` the one that field describes.
        A client with neither omits them, receives only live invalidations, and snapshots through the
        sync endpoints (before or after subscribing; both orders are sound
        because invalidations carry no entity data).
      properties:
        catalogSince:
          type: string
          description: >
            The client's opaque catalog change cursor: the `since` of the
            last `catalog` invalidation it acted on, or, before it has acted
            on any, a `nextSince` it read all its listings after. Not where
            a later pull left a mirror: a pull moves past changes it does
            not show, so an answer to that position does not tell of them.
            On a connection that takes the
            `catalog` topic the server answers it at once with one
            `catalog` invalidation that tells what changed after the
            cursor as a live one tells it: `pids` names the entities whose
            rows changed after it, by the rules `pids` follows on every
            frame, except that a show also names its episodes when the
            server cannot tell whether its cover was what changed (a
            change from before the server last started, or one behind
            many cover changes).
            `unnamed` is sent in place of names when more changed than
            `pids` holds, when the server could not read what changed in
            time, when it cannot decide for the account whether it may see
            a name (as on a live frame), and when the
            server cannot serve the cursor (another server's, an earlier
            catalog generation's, one older than the history it keeps or
            from before what the account may see last changed, or not a
            cursor), which a pull of `/sync/catalog` from it refuses. The
            frame carries neither when nothing that has a pid changed after
            the cursor, and then asks for a pull and a refresh of listings
            as any other `catalog` invalidation does, unless it carries
            `unchanged`: nothing in the catalog changed after the cursor.
            Its `since` is where it covers up to.
        serverSince:
          type: string
          description: >
            The client's opaque server change cursor; on a connection that
            takes the `user` topic the server answers it at once with a
            `user` invalidation.
        topics:
          type: array
          description: >
            Topics to receive (`catalog`, `user`, `player`, `radio`).
            Omit for all topics. Unknown topic names are ignored. The
            `player` and `radio` topics have no cursor (they invalidate
            ephemeral state, not a mirrored stream), so subscribing
            never prompts an initial invalidate for either; clients that
            render endpoint or session lists pull them on connect.
          items:
            type: string
            example: catalog

    WsEventFrame:
      type: object
      description: >
        One server-to-client frame on the WebSocket event channel
        (transport in `api/events.md`). An `invalidate` frame tells the
        client the named topic moved, except a `catalog` one carrying
        `unchanged`, which asks for nothing: for `catalog` pull
        `/sync/catalog` and for `user` pull `/sync/server` from the client's own
        cursor; for `player` pull `/player/endpoints` and
        `/player/sessions`, and for `radio` - the station's song or cover
        moved - re-read `/radio/stations/{pid}/play-info` for the station
        being listened to, all of which always return current truth (no
        cursor); a client tuned to nothing ignores `radio`.
        Invalidations are coalesced server-side, so one frame
        can cover many changes, and carry no entity data, so a redundant
        pull is harmless; a `catalog` invalidation may name the entities
        that changed in `pids`, which tells a client what it holds of
        them is stale and never replaces the pull, say in `unnamed`
        that entities changed which it does not name, or say in
        `unchanged` that nothing in the catalog changed after the cursor
        a subscribe presented. A `resync` frame means continuity was lost for the
        named stream, or for every stream when `topic` is absent
        (client queue overflow, pruned history, a replaced catalog): drop the affected
        mirror halves, re-mirror through the sync endpoints, then close
        the socket, reconnect, and resubscribe with the fresh cursors.
        `resync` never names `player` or `radio` (there is nothing to
        replay).
        `type` and `topic` are strings, not closed enums; clients must
        ignore frames whose `type` they do not recognize.
      required: [type]
      properties:
        type:
          type: string
          description: "Frame discriminator: `invalidate` or `resync`."
          example: invalidate
        topic:
          type: string
          description: >
            Which topic the frame is about (`catalog`, `user`, `player`,
            or `radio`). Always present on `invalidate`; on `resync` its
            absence means every stream.
          example: catalog
        pids:
          type: array
          maxItems: 64
          items:
            type: string
          description: >
            On a `catalog` invalidation, the pids of the entities that
            changed, in API form (`tr-...`, `al-...`): items, albums,
            artists, release groups, series and podcast shows. A changed
            track names its album beside it, whose cover can be the track's,
            and none of the album's other tracks. A changed album names its
            tracks beside it, and a podcast show whose cover was set or
            cleared through the API its episodes: they draw its cover when
            they have none of their own, and those in the trash are left
            out. An album or show that is gone names none, and so does a
            show that changed any other way, a cover that came with its feed
            included. A changed artist or release group names nothing beside
            it. An item is named with its kind's prefix as it is now, and
            one that is gone with the track prefix whatever its kind was, so
            a client matches an item by what follows the prefix; any named
            entity may already be gone. The list names the entities whose
            cached copies, covers above all, a client should drop. It is not
            everything the frame covers: a change to something that has no
            pid, a genre for one, is named nowhere, and the client pulls
            `/sync/catalog` and refreshes its listings either way, as on
            every `catalog` invalidation but one carrying `unchanged`.
            A `catalog` invalidation without `pids` or `unchanged` means
            anything in the catalog may have changed, and `unnamed` says
            whether entities are known to have. A connection whose account is
            not an administrator and has `granted` library access, a tag
            rule, or `explicitContent` off is sent only the names it may
            see, decided as each frame is sent: an item it may see; an
            album, release group or artist that an item it may see, named
            in the same frame, belongs to; and a podcast show when it may
            see the podcast library and, with `explicitContent` off, an
            episode named in the same frame says the show is not marked
            explicit. An item that is gone, an album or release group
            whose items named in the frame it may see none of, and a show
            it may not see are left out. Where the frame does not decide
            whether the account may see a name (an album or release group
            with no item of it named, an artist that no item it may see
            named in the frame belongs to, a series, or, with
            `explicitContent` off, a show with no episode of it named),
            that account's frame carries `unnamed` in place of `pids`. A
            frame that names nothing such an account may see carries
            neither. No other frame carries `pids`.
        unnamed:
          type: boolean
          description: >
            On a `catalog` invalidation, true when entities of the kinds
            `pids` names changed and the frame does not name them, so
            everything a client cached of any entity, covers above all,
            may be stale. The server sends it when the entities to
            name, those named beside a changed one included, are more
            than fit in `pids`; when it could not read which entities
            changed; when a `resync` or a catalog repair was coalesced
            with the changes, in either order; in answer to a subscribe
            whose `catalogSince` it cannot serve; and, in place of
            `pids`, to a connection whose account could not be read as
            the frame was sent or for which it cannot decide whether a
            name may be seen (see `pids`). Never false: it
            is absent on a frame that carries `pids`, on one sent only
            for a change the server has nothing to name for (a genre, a
            catalog repair) or for changes an earlier frame already
            named, on one whose names the account may see none of, on
            one answering a subscribe whose `catalogSince`
            nothing that has a pid changed after, and on every frame of
            another topic or type. Any other invalidation that names
            nothing and is coalesced with changes leaves their `pids` in
            the frame. A `catalog` invalidation with neither `pids` nor
            `unnamed` tells a client nothing about which entities
            changed, and asks for the pull and a refresh of listings
            like any other unless it carries `unchanged`.
        unchanged:
          type: boolean
          description: >
            On a `catalog` invalidation, true when the frame answers only
            a subscribe's `catalogSince` and nothing in the catalog
            changed after that cursor: no entity the frame would name or
            leave unnamed, and nothing that has no pid, a genre for one.
            What changes only users' own state (plays, stars, ratings,
            bookmarks, queues, playlists), files, libraries, jobs or
            accounts does not count: no live `catalog` invalidation is
            sent for those either. It is the one `catalog` invalidation
            that asks a client for no pull and no refresh: what it holds
            from that cursor is current. It covers only what changed after
            the cursor presented, which is why that cursor is the `since`
            of the last `catalog` invalidation the client acted on (or,
            before it has acted on any, a `nextSince` it read all its
            listings after) and not where a later pull left a mirror: a
            pull moves past changes it does not show. Never false: it is
            absent on a frame that carries `pids` or `unnamed`; on the
            answer when anything in the catalog changed after the cursor
            or the server cannot serve it; when a live change, any other
            `catalog` invalidation, or a `resync` was coalesced with the
            answer, in either order; and on every frame of another topic
            or type.
        since:
          type: string
          description: >
            On a `catalog` invalidation, the catalog position the frame
            covers up to: an opaque catalog cursor of the form
            `/sync/catalog` hands out as `nextSince`, minted for the
            connection's account. A frame that covers several changes
            carries the newest position among them. A client that acted on
            the frame presents it as `catalogSince` on a later subscribe to
            be told what changed after it. A mirror keeps the `nextSince` its own
            pulls hand it: a frame announces changes and delivers none,
            so a mirror that pulled from `since` would skip them. Absent
            when the server could not read the account as the frame was
            sent, and on every frame of another topic or type.

    WsCommandFrame:
      type: object
      description: >
        Client-to-server command on the WebSocket command bus
        (transport in `api/events.md`). Targets a session by id;
        `verb` is one of `play`, `pause`, `stop`, `seek`, `next`,
        `previous`, `set-volume`, `set-rate`, `set-queue`,
        `set-repeat`, `set-shuffle` (open string; unknown verbs answer
        an error frame). Arguments are absolute state, never deltas.
        Answered exactly once, with an ack or an error echoing `id`.
      required: [type, id, sessionId, verb]
      properties:
        type:
          type: string
          description: Always `cmd`.
          example: cmd
        id:
          type: string
          maxLength: 64
          description: Client-chosen correlation id, echoed on the answer.
          example: c7
        sessionId:
          type: string
          description: The target session.
          example: ps-01JZX5N8QW3F4V9T2B7KD3M9R6
        verb:
          type: string
          description: The command verb.
          example: seek
        positionMs:
          type: integer
          format: int64
          description: For `seek` and optionally `set-queue`.
        volume:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: For `set-volume`, 0 to 1.
        rate:
          type: number
          format: double
          minimum: 0.25
          maximum: 5
          description: For `set-rate`.
        itemPids:
          type: array
          description: >
            For `set-queue`, the new queue in play order. A PID the
            sending account may not see answers an `error` frame with
            `not-found` and leaves the queue as it was.
          maxItems: 500
          items:
            type: string
        index:
          type: integer
          description: For `set-queue`, the entry to play.
        repeat:
          type: string
          description: "For `set-repeat`: `off`, `all`, or `one`."
        shuffle:
          type: boolean
          description: For `set-shuffle`.

    WsAckFrame:
      type: object
      description: >
        Server answer to a successful `cmd` or `register-endpoint`
        frame, echoing its `id`. Command acks carry the updated
        session snapshot when the server has one; for commands routed
        to a playing client (mirror sessions) the snapshot may lag or
        be absent, because the client's own report is what updates the
        mirror; controllers render those from the following `session`
        frame. Registration acks carry the endpoint id.
      required: [type, id]
      properties:
        type:
          type: string
          description: Always `ack`.
          example: ack
        id:
          type: string
          description: The answered frame's correlation id.
        endpointId:
          type: string
          description: On registration acks, the endpoint's id.
          example: pe-01JZX5N8QW3F4V9T2B7KD3M9R6
        session:
          $ref: "#/components/schemas/PlaybackSession"

    WsErrorFrame:
      type: object
      description: >
        Server answer to a failed client frame, echoing its `id` when
        one was readable. `code` draws from the API error vocabulary.
        A `cmd` refused by the endpoint driving the session carries
        that endpoint's own code out to whoever sent the command;
        codes outside the documented vocabulary arrive as
        `invalid-request` with the refusal's own message.
      required: [type, code, message]
      properties:
        type:
          type: string
          description: Always `error`.
          example: error
        id:
          type: string
          description: The failed frame's correlation id, when known.
        code:
          type: string
          description: Machine-readable error code.
          example: endpoint-offline
        message:
          type: string
          description: Human-readable detail.
        params:
          type: object
          additionalProperties:
            type: string
          description: >
            Machine-readable detail keyed per code, the same shape and
            rules as the REST `Error` schema's `params`: a refusal a
            client can hit over either transport says the same thing on
            both.
          example:
            feature: windowed-track
            pid: tr-01JZX5N8QW3F4V9T2B7KD3M9R6

    WsRegisterEndpointFrame:
      type: object
      description: >
        Client-to-server: declare this connection a controllable
        player endpoint. Answered with an ack carrying `endpointId`.
        The endpoint lives while the connection does.
      required: [type, id]
      properties:
        type:
          type: string
          description: Always `register-endpoint`.
          example: register-endpoint
        id:
          type: string
          maxLength: 64
          description: Correlation id for the ack.
        name:
          type: string
          maxLength: 128
          description: >
            Display name. Defaults to the device session's label.
        volumeControl:
          type: boolean
          description: Whether this client can apply `set-volume`.
        rateControl:
          type: boolean
          description: Whether this client can apply `set-rate`.

    WsEndpointCommandFrame:
      type: object
      description: >
        Server-to-client command routed to a registered client
        endpoint. Verbs are the command verbs plus `load` (adopt this
        queue at this index and position; the client resolves
        play-info itself). The client executes against its local
        engine and answers exactly once with a `cmd-result`, then
        reports state.

        `sessionId` says which session the command is for, and a
        client honours a transport verb only for the session it is
        currently mirroring: `play`, `pause`, `stop`, `next`,
        `previous`, `seek`, `set-volume`, `set-rate`, `set-repeat`,
        and `set-shuffle` naming any other session are answered with a
        `cmd-result` carrying code `no-session`. `load` and `set-queue`
        install the session they name, so they are the two that arrive
        for a session the client is not yet mirroring. A matching
        `stop` ends the mirror: the client stops local playback,
        forgets the session, and stops reporting under it.

        A routed change is the listener's own tap, and persists the
        way the local control does: `set-rate` is written to the
        show's or book's stored speed, so the next episode reads it
        back, while music has no stored speed and a rate set on a
        track lapses at the next track exactly as a local one does.
      required: [type, id, sessionId, verb]
      properties:
        type:
          type: string
          description: Always `endpoint-cmd`.
          example: endpoint-cmd
        id:
          type: string
          description: Server-chosen correlation id for the result.
        sessionId:
          type: string
          description: The session this command belongs to.
        verb:
          type: string
          description: The command verb.
          example: load
        itemPids:
          type: array
          description: For `load` and `set-queue`.
          items:
            type: string
        index:
          type: integer
          description: For `load` and `set-queue`.
        positionMs:
          type: integer
          format: int64
          description: For `load`, `seek`, and optionally `set-queue`.
        play:
          type: boolean
          description: For `load`, whether to start playing.
        volume:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: For `set-volume`.
        rate:
          type: number
          format: double
          minimum: 0.25
          maximum: 5
          description: For `set-rate`.
        repeat:
          type: string
          description: For `set-repeat`.
        shuffle:
          type: boolean
          description: For `set-shuffle`.

    WsCommandResultFrame:
      type: object
      description: >
        Client-to-server answer to an `endpoint-cmd`, echoing its
        `id`. Sent exactly once per routed command.
      required: [type, id, ok]
      properties:
        type:
          type: string
          description: Always `cmd-result`.
          example: cmd-result
        id:
          type: string
          description: The routed command's correlation id.
        ok:
          type: boolean
          description: Whether the command was applied.
        code:
          type: string
          description: Machine-readable failure code when `ok` is false.
        message:
          type: string
          description: Human-readable failure detail when `ok` is false.

    WsSessionReportFrame:
      type: object
      description: >
        Client-to-server state report from a playing client: sent on
        every state change (play, pause, seek, track change, queue
        change) and at least every five seconds while playing. The
        steady fields (`playing`, `positionMs`, `index`, `rate`,
        `volume`, `repeat`, `shuffle`) carry current truth on every
        report; a track advance is just a report with the new `index`.
        `itemPids` rides only the reports where the queue itself
        changed, together with a bumped `queueVersion`, plus the
        first report of a connection that is already playing (the one
        that creates or re-creates the mirror session; a creating
        report without `itemPids` is ignored, since a session without
        a queue is unrenderable). The server answers a creating report
        with a `session` frame carrying the assigned id; other reports
        are unacknowledged.
      required: [type, playing, positionMs, index]
      properties:
        type:
          type: string
          description: Always `session-report`.
          example: session-report
        playing:
          type: boolean
          description: Whether local playback is running.
        positionMs:
          type: integer
          format: int64
          description: Position within the current entry.
        index:
          type: integer
          description: Zero-based index of the current entry.
        rate:
          type: number
          format: double
          minimum: 0.25
          maximum: 5
          description: Playback rate.
        volume:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Local volume, 0 to 1, when the client controls one.
        itemPids:
          type: array
          description: >
            The queue in play order, only on reports where it changed
            (and on the creating report).
          maxItems: 500
          items:
            type: string
        queueVersion:
          type: integer
          format: int64
          description: >
            The client's queue generation, bumped when its queue
            changes. An edge signal only: the version the server
            publishes on the session is its own monotone counter.
        repeat:
          type: string
          description: "`off`, `all`, or `one`."
        shuffle:
          type: boolean
          description: Whether shuffle is on.

    WsSessionFrame:
      type: object
      description: >
        Server-to-client session state: pushed to the watcher of a
        session on every change and about once per second while
        playing, and to a reporting client when its session identity
        changes or ends. A frame whose session carries `ended` true is
        terminal for that id.
      required: [type, session]
      properties:
        type:
          type: string
          description: Always `session`.
          example: session
        session:
          $ref: "#/components/schemas/PlaybackSession"

    WsWatchFrame:
      type: object
      description: >
        Client-to-server: follow one session's live state. Watching
        follows session visibility (your own sessions, others' on
        shared endpoints). A new watch replaces the previous one;
        omitting `sessionId` stops watching. A successful watch is not
        acked (the current state arrives immediately as a `session`
        frame); a watch of an unknown or invisible session answers an
        `error` frame with `not-found`, echoing `id` when sent.
      required: [type]
      properties:
        type:
          type: string
          description: Always `watch`.
          example: watch
        id:
          type: string
          maxLength: 64
          description: Optional correlation id, echoed on a failure.
        sessionId:
          type: string
          description: The session to follow.
          example: ps-01JZX5N8QW3F4V9T2B7KD3M9R6

    WsTuneFrame:
      type: object
      description: >
        Client-to-server: name the station this client is listening to,
        so a `radio` invalidation reaches the clients it is about rather
        than every connection. A new tune replaces the previous one;
        omitting `station` says this client is no longer listening.
        Never acked, and never refused: an unknown pid simply matches no
        wake. A client that has never sent one keeps the topic's
        older contract and hears every station's `radio` invalidations;
        one that tunes to nothing (no `station`) hears none.
      required: [type]
      properties:
        type:
          type: string
          description: Always `tune`.
          example: tune
        station:
          type: string
          description: The station being listened to.
          example: rs-01JZX5N8QW3F4V9T2B7KD3M9R6

    WsPingFrame:
      type: object
      description: >
        Client-to-server clock probe for NTP-style offset estimation
        (unrelated to WebSocket protocol pings).
      required: [type, t]
      properties:
        type:
          type: string
          description: Always `ping`.
          example: ping
        t:
          type: integer
          format: int64
          description: Opaque client timestamp, echoed back verbatim.

    WsPongFrame:
      type: object
      description: Server answer to a `ping` frame.
      required: [type, t, at]
      properties:
        type:
          type: string
          description: Always `pong`.
          example: pong
        t:
          type: integer
          format: int64
          description: The ping's `t`, echoed verbatim.
        at:
          type: integer
          format: int64
          description: Server clock in Unix milliseconds at handling time.
