# WaxDeck API contract fragment; assembled into api/openapi.yaml by `make generate`.
paths:
  /radio/stations:
    get:
      operationId: listRadioStations
      summary: List radio stations
      description: >
        The server's internet radio station library, shared by all
        users, ordered by name. Unpaginated; the library is capped at
        500 stations.
      tags: [radio]
      responses:
        "200":
          description: All stations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadioStationList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      operationId: createRadioStation
      summary: Add a radio station
      description: >
        Adds a station to the shared library. Any user may add
        stations; edits and deletion are open to any user too (the
        library is a shared household surface, like the catalog).
        Stream URLs must be http or https, and because the server
        proxies station streams, URLs that resolve to loopback,
        link-local, or private address ranges are rejected with
        `invalid-request` (and re-checked at fetch time, after
        redirects, with a bounded redirect depth), so a station entry
        can never read internal services. A server option permits
        private-range stream URLs for households running their own
        LAN icecast. Conflict (code `conflict`) means a station with
        this stream URL already exists, or the 500-station cap is
        reached.
      tags: [radio]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RadioStationEdit"
      responses:
        "201":
          description: The created station.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadioStation"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/Conflict"

  /radio/stations/{pid}:
    get:
      operationId: getRadioStation
      summary: Get one radio station
      description: One station by pid.
      tags: [radio]
      parameters:
        - $ref: "#/components/parameters/Pid"
      responses:
        "200":
          description: The station.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadioStation"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateRadioStation
      summary: Update a radio station
      description: >
        Replaces a station's fields, under the same stream URL rules
        as creation (scheme, private-range rejection, and duplicate
        conflict).
      tags: [radio]
      parameters:
        - $ref: "#/components/parameters/Pid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RadioStationEdit"
      responses:
        "200":
          description: The updated station.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadioStation"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteRadioStation
      summary: Delete a radio station
      description: Removes a station from the shared library.
      tags: [radio]
      parameters:
        - $ref: "#/components/parameters/Pid"
      responses:
        "204":
          description: Station deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /radio/stations/{pid}/play-info:
    get:
      operationId: getRadioPlayInfo
      summary: Resolve a playable station stream
      description: >
        Mints a short-lived tokenized URL for the station's stream,
        proxied through this server's origin (so web clients are never
        blocked by the station's missing CORS headers and mixed
        content never arises). The proxy passes ICY station metadata
        headers through (never icy-metaint: the in-stream metadata it
        announces is consumed by the proxy, so clients receive clean
        audio and read the current title from nowPlaying here
        instead) and serves the stream as a live, unseekable body.
        Re-request when playback is restarted; the token has a
        bounded lifetime but an already-open stream is never cut by
        token expiry.
      tags: [radio]
      parameters:
        - $ref: "#/components/parameters/Pid"
      responses:
        "200":
          description: The stream URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadioPlayInfo"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /radio/stations/{pid}/logo:
    get:
      operationId: getRadioStationLogo
      summary: Get a station logo
      description: >
        The station's logo, fetched by this server and served from this
        origin. **This reverses the direct-fetch behavior `logoUrl`
        documented**: clients render logos from here, not from the
        station host. Two reasons, both of which made direct fetches
        wrong rather than merely suboptimal. On the web build a logo on
        another origin has no CORS headers to offer and an http logo is
        mixed content on an https UI, so a large share of logos simply
        could not be drawn; and a direct fetch tells every station host
        the listener's IP address, which nothing about rendering a
        picture requires.


        The fetch goes through the same guarded client the stream proxy
        uses, so a logo URL pointing at a loopback, link-local, or
        private address is refused at dial time (after DNS resolution)
        unless the server permits LAN stations, and redirects are
        bounded. Bytes are capped and non-image answers are refused: a
        station host serving an HTML error page where a favicon used to
        be is a station with no logo, which is a 404 here. Results are
        cached in the server for a day (misses for an hour), so a
        household browsing the dial does not re-fetch the same logos per
        device.


        **Raster only, and SVG is refused.** A logo URL is
        attacker-supplied - any account may add a station, pointing
        anywhere - and these bytes are served from this origin, where an
        SVG opened as a document would run its script under the caller's
        session. So the served type is decided by inspecting the bytes
        rather than by trusting the host's `Content-Type`, only
        JPEG/PNG/WebP/GIF pass, and a station whose mark is an SVG draws
        the monogram a station with no mark draws. The response also
        carries `nosniff` and a locked-down `Content-Security-Policy`, so
        a mistake in that check stays a broken image.


        404 covers every way there is no picture to draw - no logo
        configured, the host unreachable, a refused or non-image answer - because a
        client can act on none of the differences: it draws a
        monogram disc. Answers carry a content-addressed `ETag`;
        revalidate with `If-None-Match`.
      tags: [radio]
      parameters:
        - $ref: "#/components/parameters/Pid"
        - name: size
          in: query
          description: >
            Accepted and ignored, so the sized-artwork request a client
            already builds for covers reaches this endpoint unchanged.
            Station logos are small square images from a directory and
            the server does not re-encode them: rescaling would have to
            pick a format, and the transparency most logos carry does not
            survive that choice.
          schema:
            type: integer
            minimum: 16
            maximum: 2048
        - name: If-None-Match
          in: header
          description: Previously returned `ETag`; a match answers 304 with no body.
          schema:
            type: string
      responses:
        "200":
          description: >
            The logo image, always one of the raster types below. The
            served type is decided by inspecting the bytes, not by what
            the station host called them, so a body is never labelled as
            something it is not.
          headers:
            ETag:
              description: Content-addressed validator for the returned bytes.
              schema:
                type: string
            Cache-Control:
              description: >
                `private, max-age=86400, stale-while-revalidate=604800`.
                No `Vary`, unlike item artwork: the station library is
                shared by every user, so these bytes do not depend on who
                asked. `private` all the same, because the request needs a
                session and a shared cache must not answer one without.
              schema:
                type: string
            X-Content-Type-Options:
              description: >
                `nosniff`. These bytes came from a host any account can
                name and they are served from this origin, so a browser
                must not be free to decide the body is really markup.
              schema:
                type: string
            Content-Security-Policy:
              description: >
                `default-src 'none'; sandbox; style-src 'unsafe-inline'`,
                which neutralizes script and navigation for a document
                opened straight from this URL. Defence in depth: the
                endpoint serves only raster types and refuses anything
                whose bytes are not one, and this is what keeps a future
                mistake in that check a broken image rather than a
                same-origin script.
              schema:
                type: string
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
        "304":
          description: >
            The cached copy is still current, with the same validator and
            freshness the body would have carried.
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: >
            There is no logo to draw for this station (code `not-found`).
            Render a monogram disc.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /radio/stations/{pid}/now-playing-art:
    get:
      operationId: getRadioNowPlayingArt
      summary: Get cover art for a station's announced track
      description: >
        The cover this server holds for whatever the station last
        announced, for the case the announced track is not in this
        library. Draw it on the full-screen player face; the deck bar
        keeps the station logo on purpose, because a bar whose picture
        changed every few minutes would read as the station changing.


        Two rungs sit behind radio artwork and this is the second. The
        first is `nowPlayingItemPid` above: a match against this library,
        which costs no network and is the common answer for a listener
        playing a station whose music they own. Only on its miss does the
        server look the announced artist and title up against MusicBrainz
        and resolve a Cover Art Archive image. That rung is **off by
        default** (`radioExternalArt` in the server settings): it sends a
        string a station chose from a self-hosted server to a third
        party, which is the operator's call to make. With it off this
        endpoint answers 404 forever and the client draws the station
        mark, which is a designed state rather than a gap.


        Never blocking, and a client should expect that. The lookup is
        started by the play-info poll and runs against a service paced at
        roughly one request per second, so the first poll after a title
        changes answers 404 here and a later one answers the image - on
        the same fifteen-second cadence the play-info contract already
        asks for. A miss is remembered for a day rather than forever,
        because a track released this week can have no archive entry
        today and one tomorrow, and a service that could not be reached
        is remembered for minutes only.


        The bytes go through the same raster-only check the station logo
        does, decided by inspecting them rather than by trusting the
        upstream `Content-Type`, and carry the same hardening headers.
      tags: [radio]
      parameters:
        - $ref: "#/components/parameters/Pid"
        - name: v
          in: query
          required: true
          description: >
            The `nowPlayingArtKey` from this station's play-info. The
            endpoint answers the cover held under that token and nothing
            else, so a title that rolls over between the poll and this
            request cannot turn a held cover into a 404.
          schema:
            type: string
        - name: size
          in: query
          description: Accepted and ignored, like the logo endpoint's.
          schema:
            type: integer
            minimum: 16
            maximum: 2048
        - name: If-None-Match
          in: header
          description: Previously returned `ETag`; a match answers 304 with no body.
          schema:
            type: string
      responses:
        "200":
          description: The cover image, always one of the raster types below.
          headers:
            ETag:
              description: Content-addressed validator for the returned bytes.
              schema:
                type: string
            Cache-Control:
              description: >
                `private, max-age=86400, stale-while-revalidate=604800`,
                as for the logo, and true here rather than approximately
                true: the URL carries the token naming these exact bytes,
                so a new announced title is a new URL rather than the same
                one with different content behind it.
              schema:
                type: string
            X-Content-Type-Options:
              description: "`nosniff`, as for the logo."
              schema:
                type: string
            Content-Security-Policy:
              description: The logo endpoint's policy, for the same reason.
              schema:
                type: string
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
        "304":
          description: The cached copy is still current.
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: >
            There is nothing to draw (code `not-found`): the station
            token is missing, unknown, or has aged out of the server's
            cache, the external rung is off, or there was never a cover
            under it. A client can act on none of those differences - it
            falls back to the local match, then to the station logo, then
            to the station mark.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /radio/directory:
    get:
      operationId: searchRadioDirectory
      summary: Search the station directory
      description: >
        Searches a public radio station directory (radio-browser.info)
        by name so stations can be added without pasting stream URLs.
        Requires internet; when the directory cannot be reached the
        endpoint answers `directory-unavailable` and manual entry
        still works.
      tags: [radio]
      parameters:
        - name: query
          in: query
          required: true
          description: Station name search terms.
          schema:
            type: string
            minLength: 2
        - name: limit
          in: query
          description: Maximum directory entries to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Directory matches, best first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadioDirectoryResults"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "502":
          description: >
            The station directory could not be reached (code
            `directory-unavailable`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    RadioStation:
      type: object
      description: One internet radio station in the shared library.
      required: [pid, name, streamUrl, createdAt]
      properties:
        pid:
          type: string
          description: Type-prefixed ULID.
          example: rs-01JZX5N8QW3F4V9T2B7KD3M9R6
        name:
          type: string
          description: Display name.
          example: FIP
        streamUrl:
          type: string
          description: The station's stream URL.
          example: https://icecast.radiofrance.fr/fip-midfi.mp3
        homepageUrl:
          type: string
          description: The station's website, when known.
        logoUrl:
          type: string
          description: >
            The station's own logo URL, when known: what an edit form
            shows and what the server fetches from. Do not render it
            directly - `GET /radio/stations/{pid}/logo` is where the
            picture comes from, and that endpoint's description records
            why this reverses the direct-fetch behavior documented here
            before. Its presence is still the signal there is a logo to
            ask for at all.
        createdAt:
          type: string
          format: date-time
          description: When the station was added.

    RadioStationList:
      type: object
      description: The whole station library.
      required: [stations]
      properties:
        stations:
          type: array
          description: Stations ordered by name.
          items:
            $ref: "#/components/schemas/RadioStation"

    RadioStationEdit:
      type: object
      description: Station fields for create and update.
      required: [name, streamUrl]
      properties:
        name:
          type: string
          description: Display name.
          minLength: 1
          maxLength: 200
        streamUrl:
          type: string
          description: The station's stream URL; http or https.
        homepageUrl:
          type: string
          description: The station's website.
        logoUrl:
          type: string
          description: Station logo URL.

    RadioPlayInfo:
      type: object
      description: A resolved, tokenized station stream.
      required: [url]
      properties:
        url:
          type: string
          description: >
            Origin-relative proxied stream URL carrying a short-lived
            media token.
          example: /media/radio/rs-01JZX5N8QW3F4V9T2B7KD3M9R6?mt=abc
        nowPlaying:
          type: string
          description: >
            The most recent in-stream ICY title the proxy observed for
            this station. Present only while a proxied listener has
            the stream open and the station publishes StreamTitle
            metadata; it reflects what the station last announced, not
            a guarantee of what is audible right now. The listener may
            be any user (stations are a shared library, so the field's
            presence reveals that someone on this server is streaming
            the station). The value is best-effort UTF-8 from an
            untrusted station and should be treated as plain display
            text; an empty announced title is reported as absent.
            Clients that show it should re-poll this endpoint on the
            order of every 15 seconds during playback. Every response
            carries a freshly tokenized url; while already playing,
            ignore the new url and keep the open stream (polling opens
            no new connection to the station). On a first request,
            before anyone has the stream open, the field is
            necessarily absent.
          example: Charlie Parker - Ornithology
        nowPlayingItemPid:
          type: string
          description: >
            A library track this server matched `nowPlaying` to, when it
            recognised one. Present so a full-screen player can draw the
            song's own cover art instead of the station logo; absent is
            the common case and is not a failure, so a client that
            cannot match must fall back to the station's artwork rather
            than showing a gap. The match is a best-effort text lookup
            against the catalog and is never authoritative: it does not
            mean this server is playing that file, and it is
            deliberately not used for scrobbling, which reports what the
            station announced.
          example: tr-01JZX5N8QW3F4V9T2B7KD3M9R6
        nowPlayingArtKey:
          type: string
          description: >
            An opaque token naming the cover this server holds for the
            announced title, present only when it holds one. The second
            artwork rung, and the token does two jobs: it says there is an
            image to ask for, and it is what makes the image URL change
            when the station changes what it is playing.


            Pass it as `v` on
            `GET /radio/stations/{pid}/now-playing-art`. A client that
            omits it gets a 404 - the endpoint is addressed by token, not
            by whatever is announced at the moment the image request
            lands, so the bytes behind one URL never change and the long
            `Cache-Control` they carry is true.


            The lookup behind it is asynchronous, so the field appears on
            a later poll rather than on the one that started it. Absent
            means draw the local match if there is one, then the station
            logo, then the station mark. Always absent while the external
            rung is switched off.
          example: 6f1a3c9d2e4b5a70

    RadioDirectoryEntry:
      type: object
      description: One station directory match.
      required: [name, streamUrl]
      properties:
        name:
          type: string
          description: Station name as listed in the directory.
        streamUrl:
          type: string
          description: Resolved stream URL.
        homepageUrl:
          type: string
          description: Station website.
        logoUrl:
          type: string
          description: >
            Station logo URL as the directory lists it, carried so adding
            the station keeps it. There is no proxy for a directory match:
            the proxy addresses a station by pid and a match has none
            until it is added, so a search result draws a monogram disc
            and the logo appears once the station is in the library.
        tags:
          type: string
          description: Comma-separated directory tags.
          example: jazz,eclectic
        country:
          type: string
          description: Directory country name.
        codec:
          type: string
          description: Directory-reported stream codec.
          example: MP3
        bitrateKbps:
          type: integer
          description: Directory-reported bitrate in kbit/s, 0 when unknown.

    RadioDirectoryResults:
      type: object
      description: Station directory matches.
      required: [entries]
      properties:
        entries:
          type: array
          description: Matches, best first.
          items:
            $ref: "#/components/schemas/RadioDirectoryEntry"
