# WaxDeck API contract fragment; assembled into api/openapi.yaml by `make generate`.
paths:
  /library/enrichment:
    get:
      operationId: getEnrichmentStatus
      summary: Enrichment status and coverage
      description: >
        The registered enrichment providers (built-ins and the ones
        this server adds, with what each can supply and whether it
        is configured) and the catalog's enrichment coverage, plus
        whether a whole-library pass is currently running and which
        phases one would execute.
      tags: [enrichment]
      responses:
        "200":
          description: The status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrichmentStatus"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /library/enrichment/run:
    post:
      operationId: runEnrichment
      summary: Run a whole-library enrichment pass
      description: >
        Starts the catalog's enrichment pass as a background job
        (identity resolution first, then providers in priority
        order, provider-paced). `force` re-enriches entities that
        already enriched once. Locked and unofficial-marked content
        is respected. Returns the catalog job to follow.
        Administrators only.


        Refuses with `source-unavailable` when no phase could run:
        neither a MusicBrainz contact nor a provider gating a phase of
        its own. That is what `enrichmentStatus.configured` reports,
        and `enrichmentStatus.phases` says which phases a run would
        execute - read them first rather than offering a button that
        errors, or one that promises identity resolution a
        contact-less server will not do.
      tags: [enrichment]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrichmentRunRequest"
      responses:
        "202":
          description: The started job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrichmentRunResult"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "501":
          $ref: "#/components/responses/SourceUnavailable"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

components:
  schemas:
    EnrichmentStatus:
      type: object
      description: Enrichment providers and coverage.
      required: [providers, coverage, running, configured, musicbrainzConfigured, phases]
      properties:
        providers:
          type: array
          description: >
            Registered providers in priority order (this server's
            own first, then the catalog's key-free built-ins).
          items:
            $ref: "#/components/schemas/EnrichmentProvider"
        coverage:
          $ref: "#/components/schemas/EnrichmentCoverage"
        running:
          type: boolean
          description: Whether a whole-library pass is running now.
        configured:
          type: boolean
          description: >
            Whether a whole-library pass would do anything: some phase
            can run. That is true on any server carrying a provider
            that gates a phase of its own, and true on every server
            with a MusicBrainz contact. Read `phases` for which half.


            False means every run refuses with `source-unavailable`, so
            a console should say so rather than offer a button that
            errors. Distinct from a provider's own `configured`, which
            is about that provider's key.
        musicbrainzConfigured:
          type: boolean
          description: >
            Whether the MusicBrainz identity phases can run. They need
            an identifying contact, which is boot configuration
            (`-enrichment-contact` / `WAXDECK_ENRICHMENT_CONTACT`) and
            not a runtime setting, because MusicBrainz requires an
            identifying agent before anything is sent.


            It gates the lyrics phase too, whose built-in provider
            needs no key but is not dialled without an identifying
            agent. The phases that answer to registered providers
            (artwork, fields, book metadata, and lyrics where a provider
            supplies them) run without it, so a server with no contact
            still enriches - just not identity. A console that says
            "enrichment is off" on this being false would be wrong about
            the half that does run.
        phases:
          type: array
          description: >
            The phases a run started now would execute, in no
            particular order. Empty exactly when `configured` is false.
            `identity` and `releases` need the MusicBrainz contact, and
            so does `lyrics` unless a registered provider supplies them;
            the rest need a registered provider advertising the matching
            capability.
          items:
            type: string
            enum:
              [
                identity,
                releases,
                aux-art,
                artist-art,
                lyrics,
                track-fields,
                book-fields,
                album-fields,
              ]
        lastRun:
          $ref: "#/components/schemas/EnrichmentLastRun"

    EnrichmentProvider:
      type: object
      description: One enrichment provider.
      required: [name, capabilities, configured, builtin]
      properties:
        name:
          type: string
          description: Stable provider id.
          example: fanarttv
        capabilities:
          type: array
          description: >
            What it supplies: `identity`, `genres`, `cover`,
            `lyrics`, `book`, `aux-art`, `artist-art`, `fields`.
            Strings, not a closed enum. `cover` is the front cover of a
            release group; `aux-art` its other slots (back, disc,
            booklet, background); `artist-art` an artist's own images.
            The three are separate because they gate separate passes -
            a provider that only knows front covers must not pull the
            whole artist catalogue into a walk it cannot answer.


            `fields` is scalar metadata with no artwork in it - a
            track's tempo, ISRC or composer, an album's label or year -
            and gates the two fields walks, one per rung. `book` covers
            the same ground for audiobooks (publisher, narrator, the
            identifiers) and gates the book walk.
          items:
            type: string
        configured:
          type: boolean
          description: >
            Whether the provider can run: a keyed one once its key is
            set, a built-in once the MusicBrainz contact is. Key-free is
            not the same as configured - the built-ins are public
            services that want an identifying agent, and the catalog
            does not register them without one.
        builtin:
          type: boolean
          description: True for the catalog's built-ins.

    EnrichmentLastRun:
      type: object
      description: >
        What the most recent finished whole-library pass did. Absent
        until one has finished.


        Coverage answers how much of the library is enriched; this
        answers whether the last pass accomplished anything, which
        coverage cannot. A pass that searched two thousand albums and
        matched none leaves coverage exactly where it was, and so does
        one whose every tag write failed; both read as "nothing
        happened" without these counts.
      required:
        [
          albumsSearched,
          albumsMatched,
          artistArtEnriched,
          artistArtMatched,
          trackFieldsEnriched,
          trackFieldsMatched,
          bookFieldsEnriched,
          bookFieldsMatched,
          albumFieldsEnriched,
          albumFieldsMatched,
          tagsWritten,
          tagsFailed,
          tagsUnrepresented,
          tagsSkipped,
        ]
      properties:
        albumsSearched:
          type: integer
          description: >
            Albums the release match looked up: which pressing of a
            record the library holds, resolved from a barcode or a
            catalog number.
        albumsMatched:
          type: integer
          description: >
            Albums it pinned to a release. Searched without matched is
            a library whose albums carry no identifiers, not a broken
            pass.
        artistArtEnriched:
          type: integer
          description: >
            Artists the artwork walk looked at. It reaches every artist
            by name, so this counts the ones still missing a portrait
            rather than the ones MusicBrainz matched.
        artistArtMatched:
          type: integer
          description: Artists some provider answered a picture for.
        trackFieldsEnriched:
          type: integer
          description: >
            Tracks the fields walk looked up, filling tempo, ISRC and
            composer where they were empty and unlocked.
        trackFieldsMatched:
          type: integer
          description: Tracks some provider answered for.
        bookFieldsEnriched:
          type: integer
          description: >
            Audiobooks the fields walk looked up, filling publisher,
            year, description, narrator, subtitle, edition and the
            identifiers where they were empty and unlocked.
        bookFieldsMatched:
          type: integer
          description: Audiobooks some provider answered for.
        albumFieldsEnriched:
          type: integer
          description: >
            Albums the fields walk looked up, filling label and year. A
            year fans out to every track on the album, and is refused
            where the tracks already disagree.
        albumFieldsMatched:
          type: integer
          description: Albums some provider answered for.
        tagsWritten:
          type: integer
          description: >
            Files the pass wrote enriched values back into. Zero unless
            tag write-back is on, which is what makes enrichment
            survive a rescan.
        tagsFailed:
          type: integer
          description: Files whose write failed. The catalog kept the values either way.
        tagsUnrepresented:
          type: integer
          description: >
            Files whose format cannot store a key that was filled. Not
            a failure: the bytes are unchanged and correct.
        tagsSkipped:
          type: integer
          description: >
            Book parts left unwritten because their book's primary part
            failed.
        finishedAt:
          type: string
          format: date-time
          description: When the pass finished.

    EnrichmentCoverage:
      type: object
      description: How much of the catalog has enriched.
      required: [artists, releaseGroups, books, lyrics]
      properties:
        artists:
          $ref: "#/components/schemas/CoverageCount"
        releaseGroups:
          $ref: "#/components/schemas/CoverageCount"
        books:
          $ref: "#/components/schemas/CoverageCount"
        lyrics:
          $ref: "#/components/schemas/CoverageCount"

    CoverageCount:
      type: object
      description: Enriched versus total for one entity class.
      required: [enriched, total]
      properties:
        enriched:
          type: integer
          description: Entities that completed enrichment.
        total:
          type: integer
          description: Entities in scope.

    EnrichmentRunRequest:
      type: object
      description: Options for a whole-library pass.
      properties:
        force:
          type: boolean
          default: false
          description: Re-enrich entities that already enriched once.

    EnrichmentRunResult:
      type: object
      description: The started pass.
      required: [jobPid]
      properties:
        jobPid:
          type: string
          description: The catalog job to follow.
