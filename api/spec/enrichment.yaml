# WaxDeck API contract fragment; assembled into api/openapi.yaml by `make generate`.
paths:
  /library/enrichment:
    get:
      operationId: getEnrichmentStatus
      summary: Enrichment status and coverage
      description: >
        The registered enrichment providers (built-ins and the ones
        this server adds, with what each can supply and whether it
        is configured) and the catalog's enrichment coverage, plus
        whether a whole-library pass is currently running and which
        phases one would execute.
      tags: [enrichment]
      responses:
        "200":
          description: The status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrichmentStatus"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /library/enrichment/sources:
    put:
      operationId: putEnrichmentSources
      summary: Order and switch the enrichment sources
      description: >
        Saves the order this server's own providers are asked in and which are
        asked at all, naming each once; one not wired now keeps its switch. A
        running pass keeps its order until it ends. Administrators only.
      tags: [enrichment]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrichmentSourcesUpdate"
      responses:
        "200":
          description: The status under the new order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrichmentStatus"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /library/enrichment/run:
    post:
      operationId: runEnrichment
      summary: Run a whole-library enrichment pass
      description: >
        Starts the whole-library enrichment pass as a job: `force` re-asks
        everything, `forcePhases` the named phases alone. Refuses with
        `source-unavailable` when no phase could run. Administrators only.
      tags: [enrichment]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrichmentRunRequest"
      responses:
        "202":
          description: The started job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrichmentRunResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "501":
          $ref: "#/components/responses/SourceUnavailable"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

components:
  schemas:
    EnrichmentStatus:
      type: object
      description: Enrichment providers and coverage.
      required: [providers, coverage, running, configured, musicbrainzConfigured, phases]
      properties:
        providers:
          type: array
          description: >
            Registered providers in the order they are asked: this
            server's own in the operator's order, then the catalog's
            key-free built-ins.
          items:
            $ref: "#/components/schemas/EnrichmentProvider"
        coverage:
          $ref: "#/components/schemas/EnrichmentCoverage"
        running:
          type: boolean
          description: Whether a whole-library pass is running now.
        runningJob:
          type: string
          description: >
            The running pass's job pid, when one runs; `GET /jobs/{pid}` follows
            it more cheaply than this read.
          example: jb-01JZX5N8QW3F4V9T2B7KD3M9R6
        configured:
          type: boolean
          description: >
            Whether a whole-library pass would do anything: some phase can
            run, which a switched-on provider gating one or a MusicBrainz
            contact makes true. Read `phases` for which.


            False means every run refuses with `source-unavailable`, so
            a console should say so rather than offer a button that
            errors. Distinct from a provider's own `configured`, which
            is about that provider's key.
        musicbrainzConfigured:
          type: boolean
          description: >
            Whether the MusicBrainz identity phases can run, which needs the
            `WAXDECK_ENRICHMENT_CONTACT` boot setting. The Cover Art Archive and
            LRCLIB wait on it too; the provider-gated phases do not.
        phases:
          type: array
          description: >
            The phases a run started now would execute; empty exactly when
            `configured` is false. `identity` and `releases` need the contact,
            `album-art` and `lyrics` it or a provider switched on, the rest one.
          items:
            $ref: "#/components/schemas/EnrichmentPhase"
        lastRun:
          $ref: "#/components/schemas/EnrichmentLastRun"

    EnrichmentProvider:
      type: object
      description: One enrichment provider.
      required: [name, capabilities, configured, builtin]
      properties:
        name:
          type: string
          description: Stable provider id.
          example: fanarttv
        capabilities:
          type: array
          description: >
            What it supplies, as open strings: `identity`, `genres`, `cover` (a
            front), `aux-art` (the other slots), `artist-art`, `lyrics`, `book` and
            `fields`, each gating its own pass.
          items:
            type: string
        configured:
          type: boolean
          description: >
            Whether the provider can run: a keyed one once its key is set, a
            built-in once the MusicBrainz contact is, since the catalog registers
            none of the key-free public services without one.
        builtin:
          type: boolean
          description: True for the catalog's built-ins.
        enabled:
          type: boolean
          default: true
          description: >
            Whether it is asked at all. Switched back on, it is not asked about
            what a pass finished while it was off unless a run forces its phases.

    EnrichmentSourcesUpdate:
      type: object
      description: The operator's order over the orderable providers.
      required: [sources]
      properties:
        sources:
          type: array
          description: >
            Every provider the status lists that is not `builtin`, in the order
            they are to be asked.
          items:
            $ref: "#/components/schemas/EnrichmentSource"

    EnrichmentSource:
      type: object
      description: One provider's place in the order, and its switch.
      required: [name, enabled]
      properties:
        name:
          type: string
          description: The provider's `name` from the status.
          example: fanarttv
        enabled:
          type: boolean
          description: Whether it is asked.

    EnrichmentLastRun:
      type: object
      description: >
        What the most recent finished pass did, every tally it keeps; absent
        until one has finished. Each walk counts what it looked up and what
        something answered for.
      required:
        [
          artistsEnriched,
          artistsMatched,
          releaseGroupsEnriched,
          releaseGroupsMatched,
          albumsSearched,
          albumsMatched,
          booksEnriched,
          booksMatched,
          lyricsEnriched,
          lyricsMatched,
          groupArtEnriched,
          groupArtMatched,
          artistArtEnriched,
          artistArtMatched,
          albumArtEnriched,
          albumArtMatched,
          trackFieldsEnriched,
          trackFieldsMatched,
          bookFieldsEnriched,
          bookFieldsMatched,
          albumFieldsEnriched,
          albumFieldsMatched,
          retried,
          deferred,
          artFetched,
          auxArtFetched,
          artReused,
          tagsWritten,
          tagsFailed,
          tagsUnrepresented,
          tagsSkipped,
        ]
      properties:
        artistsEnriched:
          type: integer
          description: Artists the MusicBrainz identity walk looked up.
        artistsMatched:
          type: integer
          description: Artists it resolved.
        releaseGroupsEnriched:
          type: integer
          description: Release groups the identity walk looked up.
        releaseGroupsMatched:
          type: integer
          description: Release groups it resolved.
        albumsSearched:
          type: integer
          description: >
            Albums the release match looked up: which pressing of a
            record the library holds, resolved from a barcode or a
            catalog number.
        albumsMatched:
          type: integer
          description: >
            Albums it pinned to a release. Searched without matched is
            a library whose albums carry no identifiers, not a broken
            pass.
        booksEnriched:
          type: integer
          description: Audiobooks the identity walk looked up.
        booksMatched:
          type: integer
          description: Audiobooks it resolved.
        lyricsEnriched:
          type: integer
          description: Tracks the lyrics walk looked up.
        lyricsMatched:
          type: integer
          description: Tracks some provider answered lyrics for.
        groupArtEnriched:
          type: integer
          description: >
            Release groups the release-group art backfill looked at: a
            front, back, disc, booklet or background slot empty.
        groupArtMatched:
          type: integer
          description: Release groups some provider answered for.
        artistArtEnriched:
          type: integer
          description: >
            Artists the artwork walk looked at. It reaches every artist
            by name, so this counts the ones still missing a portrait
            rather than the ones MusicBrainz matched.
        artistArtMatched:
          type: integer
          description: Artists some provider answered a picture for.
        albumArtEnriched:
          type: integer
          description: >
            Albums the album-art backfill looked at: ones that resolve
            no front cover at all, asked about by their own identifiers.
        albumArtMatched:
          type: integer
          description: Albums some provider answered for.
        trackFieldsEnriched:
          type: integer
          description: >
            Tracks the fields walk looked up, filling tempo, ISRC and
            composer where they were empty and unlocked.
        trackFieldsMatched:
          type: integer
          description: Tracks some provider answered for.
        bookFieldsEnriched:
          type: integer
          description: >
            Audiobooks the fields walk looked up, filling publisher,
            year, description, narrator, subtitle, edition and the
            identifiers where they were empty and unlocked.
        bookFieldsMatched:
          type: integer
          description: Audiobooks some provider answered for.
        albumFieldsEnriched:
          type: integer
          description: >
            Albums the fields walk looked up, filling label and year. A
            year fans out to every track on the album, and is refused
            where the tracks already disagree.
        albumFieldsMatched:
          type: integer
          description: Albums some provider answered for.
        retried:
          type: integer
          description: >
            Targets re-asked because their earlier miss had outlived the
            retry window. The walks above count them too.
        deferred:
          type: integer
          description: >
            Targets whose lookup was left owed: a source failed, or could
            not be asked, with a slot it serves still open. What the others
            answered was applied, and a later pass asks again. The walks
            above count them too.
        artFetched:
          type: integer
          description: >
            Front covers downloaded and handed to the catalog, across
            every walk. The catalog still fills only empty, unlocked
            slots.
        auxArtFetched:
          type: integer
          description: Back, disc, booklet and background images, counted the same way.
        artReused:
          type: integer
          description: >
            Album fronts taken from the release group's picture, on a
            provider's word that it is that pressing's own; nothing was
            downloaded for them.
        tagsWritten:
          type: integer
          description: >
            Files the pass wrote enriched values back into. Zero unless
            tag write-back is on, which is what makes enrichment
            survive a rescan.
        tagsFailed:
          type: integer
          description: Files whose write failed. The catalog kept the values either way.
        tagsUnrepresented:
          type: integer
          description: >
            Files whose format cannot store a key that was filled. Not
            a failure: the bytes are unchanged and correct.
        tagsSkipped:
          type: integer
          description: >
            Book parts left unwritten because their book's primary part
            failed.
        finishedAt:
          type: string
          format: date-time
          description: When the pass finished.

    EnrichmentCoverage:
      type: object
      description: >-
        How much of the catalog has enriched. Lyrics carries its total alone,
        the music tracks: the catalog does not count lyrics per track, so its
        enriched reads zero.
      required: [artists, releaseGroups, books, lyrics]
      properties:
        artists:
          $ref: "#/components/schemas/CoverageCount"
        releaseGroups:
          $ref: "#/components/schemas/CoverageCount"
        books:
          $ref: "#/components/schemas/CoverageCount"
        lyrics:
          $ref: "#/components/schemas/CoverageCount"

    CoverageCount:
      type: object
      description: Enriched versus total for one entity class.
      required: [enriched, total]
      properties:
        enriched:
          type: integer
          description: Entities that completed enrichment.
        total:
          type: integer
          description: Entities in scope.

    EnrichmentRunRequest:
      type: object
      description: Options for a whole-library pass.
      properties:
        force:
          type: boolean
          default: false
          description: Re-enrich entities that already enriched once.
        forcePhases:
          type: array
          description: >
            Re-ask these phases alone, marked or not, while the rest walk as
            usual. Refused beside `force` (400), and with `source-unavailable` for
            a phase this server does not run.
          items:
            $ref: "#/components/schemas/EnrichmentPhase"

    EnrichmentPhase:
      type: string
      description: >
        One phase of the whole-library pass: `identity` is the MusicBrainz
        walks (artists, release groups, audiobooks), `releases` the release
        match, and the rest the backfills and fields walks they name.
      enum:
        [
          identity,
          releases,
          aux-art,
          artist-art,
          album-art,
          lyrics,
          track-fields,
          book-fields,
          album-fields,
        ]

    EnrichmentRunResult:
      type: object
      description: The started pass.
      required: [jobPid]
      properties:
        jobPid:
          type: string
          description: The catalog job to follow.
