# WaxDeck API contract fragment; assembled into api/openapi.yaml by `make generate`.
paths:
  /organize/profiles:
    get:
      operationId: listOrganizeProfiles
      summary: List organize profiles
      description: >
        The built-in `waxbin-native` layout and the saved profiles, each
        with sample paths, and how many libraries are managed (with none,
        organizing answers `invalid-request`). Administrators only.
      tags: [organize]
      responses:
        "200":
          description: The profiles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizeProfiles"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /organize/profiles/{name}:
    parameters:
      - name: name
        in: path
        required: true
        description: The profile name, without `/`, `\`, `?` or `#`.
        schema:
          type: string
          minLength: 1
          maxLength: 64
    put:
      operationId: putOrganizeProfile
      summary: Save an organize profile
      description: >
        Saves the profile, replacing one of the same name; a built-in's
        name overrides it. The catalog takes it at once. A template that
        does not parse is `invalid-request`. Administrators only.
      tags: [organize]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizeProfileInput"
      responses:
        "200":
          description: The saved profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizeProfile"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"
    delete:
      operationId: deleteOrganizeProfile
      summary: Delete an organize profile
      description: >
        Deletes a saved profile or a built-in's override. A built-in is
        `invalid-request`, and a profile a managed library uses is
        `conflict`. Administrators only.
      tags: [organize]
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /organize/profiles/preview:
    post:
      operationId: previewOrganizeProfile
      summary: Render an unsaved profile's samples
      description: >
        Where the profile would lay out the sample track, book and episode,
        without saving it. A template that does not parse is
        `invalid-request`. Administrators only.
      tags: [organize]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizeProfilePreview"
      responses:
        "200":
          description: The sample paths.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizeSample"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /organize/preview:
    post:
      operationId: previewOrganize
      summary: Dry-run an organize pass
      description: >
        Plans a profile's moves for `itemPids`, or every managed library,
        touching nothing; read-only files are counted rather than planned.
        Lists the first 500 actions and the total, and the first 500 moves
        held back with why. Administrators only.
      tags: [organize]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizeRequest"
      responses:
        "200":
          description: The planned actions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizePlan"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /organize/apply:
    post:
      operationId: applyOrganize
      summary: Apply an organize pass
      description: >
        Recomputes the plan and runs it as an `organize` catalog job,
        answering once the job ends: crash-safe per file and respecting
        locked fields, and read-only libraries stay put. The job journals
        its moves, so `/organize/undo` can move them back. A plan with
        nothing to move runs no job. Administrators only.
      tags: [organize]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizeRequest"
      responses:
        "200":
          description: The applied outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizeReport"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: >
            The pass was refused. `read-only`: the server is read-only.
            `catalog-busy`: another catalog job holds the file-mutation
            scope; retry when it ends.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /organize/history:
    get:
      operationId: listOrganizeHistory
      summary: List organize runs
      description: >
        The organize runs, and the undos of them, whose moves the
        catalog's journal still holds, newest first by when each started,
        a page at a time: `nextCursor` reaches the older ones. The
        scheduled prune drops a run's journal once it is older than the
        task retention window, and the run can no longer be undone.
        Administrators only.
      tags: [organize]
      parameters:
        - name: cursor
          in: query
          description: Opaque cursor from a previous page's `nextCursor`.
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum runs returned.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: The runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizeHistory"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /organize/undo:
    post:
      operationId: undoOrganize
      summary: Undo an organize run
      description: >
        Moves back what an organize run (or an undo, which redoes it)
        moved, as an `organize-undo` catalog job, answering once the job
        ends. Each file goes from where it stands to where the run found
        it, with its sidecars and the folder companions the run carried;
        tags the run wrote stay. A file moved again since, one the catalog
        no longer holds, one whose old place another file now holds, one
        gone from disk and one in a read-only library are held back.
        Administrators only.
      tags: [organize]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizeUndoRequest"
      responses:
        "200":
          description: >
            What the undo did, in the words of an applied pass: `moved`
            counts the files moved back.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizeReport"
        "400":
          description: >
            `invalid-request`: the job is not an organize run or an undo of
            one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: >
            `not-found`: no such job, or its journal holds no committed
            move to undo (never one, or pruned).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >
            The undo was refused. `read-only`: the server is read-only.
            `catalog-busy`: the run is still going, or another catalog job
            holds the file-mutation scope; retry when it ends.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

components:
  schemas:
    OrganizeProfiles:
      type: object
      description: The server's organize profiles.
      required: [profiles, managedLibraries]
      properties:
        profiles:
          type: array
          description: The profiles, by name.
          items:
            $ref: "#/components/schemas/OrganizeProfile"
        managedLibraries:
          type: integer
          description: >
            How many libraries are managed, the only ones organize moves
            files within.

    OrganizeProfile:
      type: object
      description: One organize profile, its templates after inheritance.
      required: [name, musicTemplate, audiobookTemplate, podcastTemplate, tagWrite, builtIn, sample]
      properties:
        name:
          type: string
          description: The profile name organize requests reference.
        musicTemplate:
          type: string
          description: Path template for music.
        audiobookTemplate:
          type: string
          description: Path template for audiobooks.
        podcastTemplate:
          type: string
          description: Path template for podcast files.
        tagWrite:
          type: boolean
          description: Whether organizing also writes tags.
        builtIn:
          type: boolean
          description: A built-in no saved profile overrides; it cannot be deleted.
        sample:
          $ref: "#/components/schemas/OrganizeSample"
        saved:
          $ref: "#/components/schemas/OrganizeTemplates"

    OrganizeTemplates:
      type: object
      description: >
        The templates a saved profile sets itself; an empty one inherits.
        Absent for a built-in nothing overrides.
      required: [musicTemplate, audiobookTemplate, podcastTemplate]
      properties:
        musicTemplate:
          type: string
        audiobookTemplate:
          type: string
        podcastTemplate:
          type: string

    OrganizeSample:
      type: object
      description: >
        Where a profile lays out a fixed sample track, book and episode; an
        empty path is a template that renders none for that sample.
      required: [music, audiobook, podcast]
      properties:
        music:
          type: string
          example: Test Ensemble/Signal Garden (2024)/1-03 - Amber Waves.flac
        audiobook:
          type: string
        podcast:
          type: string

    OrganizeProfileInput:
      type: object
      description: >
        A profile to save. An empty or absent template inherits the
        built-in of the same name, or the native layout.
      properties:
        musicTemplate:
          type: string
          maxLength: 1024
        audiobookTemplate:
          type: string
          maxLength: 1024
        podcastTemplate:
          type: string
          maxLength: 1024
        tagWrite:
          type: boolean
          default: false

    OrganizeProfilePreview:
      type: object
      description: >
        A profile to render samples for; `name` picks what an empty
        template inherits.
      properties:
        name:
          type: string
          maxLength: 64
        musicTemplate:
          type: string
          maxLength: 1024
        audiobookTemplate:
          type: string
          maxLength: 1024
        podcastTemplate:
          type: string
          maxLength: 1024
        tagWrite:
          type: boolean
          default: false

    OrganizeRequest:
      type: object
      description: The scope of an organize pass.
      properties:
        profile:
          type: string
          description: The profile to apply; absent lays out each library by its own.
        itemPids:
          type: array
          maxItems: 1000
          description: Restrict to these items; absent means every managed library.
          items:
            type: string

    OrganizePlan:
      type: object
      description: A dry-run organize plan.
      required: [profile, totalActions, held, readOnlyLibraries, actions]
      properties:
        profile:
          type: string
          description: The profile planned with.
        totalActions:
          type: integer
          description: Moves the pass would make in total.
        held:
          type: integer
          description: >
            Moves held back, by any cause: a read-only server, an occupied
            destination, a missing file, a cue rip, an untagged item
            (`heldByCode` says which). Not in `actions` or `totalActions`;
            a read-only library's files are left out instead, counted in
            `readOnlyLibraries`.
        heldByCode:
          type: object
          description: >
            `held` by hold code: `collision` (another move of the pass
            claims the destination), `occupied` (a file the pass does not
            move holds it), `occupied-case` (one named apart from it only
            by case or Unicode form stands beside it), `untagged`,
            `missing`, `virtual` (a cue rip's shared file), `book-held`
            (another part of the book is held) and `read-only` (the server
            is read-only). A code with nothing held is absent.
          additionalProperties:
            type: integer
        holds:
          type: array
          description: The first five hundred moves held back.
          items:
            $ref: "#/components/schemas/OrganizeHold"
        readOnlyLibraries:
          type: integer
          description: Managed libraries left out because they are read-only.
        actions:
          type: array
          description: The first five hundred actions.
          items:
            $ref: "#/components/schemas/OrganizeAction"
        tagWrite:
          type: boolean
          description: Whether applying would also write tags.

    OrganizeAction:
      type: object
      description: One planned move.
      required: [itemPid, from, to]
      properties:
        itemPid:
          type: string
          description: The item whose file moves.
        from:
          type: string
          description: Current library-relative path.
        to:
          type: string
          description: Planned library-relative path.

    OrganizeHold:
      type: object
      description: One move held back, and why.
      required: [from, code, reason]
      properties:
        itemPid:
          type: string
          description: >
            The item whose file is held. Absent from an undo's holds, which
            name files by path.
        from:
          type: string
          description: >
            Where the file is: relative to its library when the pass
            planned one library, otherwise the server's absolute path.
        to:
          type: string
          description: >
            Where the move would put it, in the same form; absent when the
            pass has no place for it.
        code:
          type: string
          description: >
            Why it is held: the plan's codes (see `heldByCode`), and for an
            undo `moved-since` (the file moved again after the run) and
            `uncataloged` (the catalog no longer holds it).
          enum:
            - collision
            - occupied
            - occupied-case
            - untagged
            - missing
            - virtual
            - book-held
            - read-only
            - moved-since
            - uncataloged
        reason:
          type: string
          description: >
            Why, in words: the catalog's own, or `read-only server` for a
            move the server's read-only mode holds.

    OrganizeReport:
      type: object
      description: The outcome of an applied organize pass.
      required: [jobPid, moved, skipped, held, readOnlyLibraries, failed]
      properties:
        jobPid:
          type: string
          description: >
            The catalog job the pass ran as, which `/organize/undo` takes;
            empty when nothing was left to move and no job ran.
          example: jb-01JZX5N8QW3F4V9T2B7KD3M9R6
        moved:
          type: integer
          description: Files moved.
        skipped:
          type: integer
          description: Files already in place.
        held:
          type: integer
          description: >
            Files held back where they are, for any of the causes a
            plan's `held` counts, `read-only` here being a library made
            read-only after the plan.
        holds:
          type: array
          description: The first five hundred moves held back.
          items:
            $ref: "#/components/schemas/OrganizeHold"
        readOnlyLibraries:
          type: integer
          description: Managed libraries left alone because they are read-only.
        failed:
          type: integer
          description: Files that could not move.
        failures:
          type: array
          description: The failures, path and reason each.
          items:
            $ref: "#/components/schemas/OrganizeFailure"
        dirsPruned:
          type: integer
          description: Folders the moves emptied and removed.

    OrganizeUndoRequest:
      type: object
      description: The run to undo.
      required: [jobPid]
      properties:
        jobPid:
          type: string
          description: The organize run's job, as the history lists it.
          example: jb-01JZX5N8QW3F4V9T2B7KD3M9R6

    OrganizeHistory:
      type: object
      description: A page of the organize runs the journal still holds.
      required: [batches]
      properties:
        batches:
          type: array
          description: The runs, newest first.
          items:
            $ref: "#/components/schemas/OrganizeBatch"
        nextCursor:
          type: string
          description: Cursor for the next, older page; absent on the last.

    OrganizeBatch:
      type: object
      description: One organize run, or an undo of one, and what its moves came to.
      required: [jobPid, kind, state, startedAt, committed, rolledBack, planned, undoable]
      properties:
        jobPid:
          type: string
          description: The run's catalog job.
          example: jb-01JZX5N8QW3F4V9T2B7KD3M9R6
        kind:
          type: string
          description: An `organize` run, or an `organize-undo` of one.
          enum:
            - organize
            - organize-undo
        state:
          type: string
          description: >
            The job's state, as `/jobs` reports it; clients treat an
            unknown value as not finished.
          example: done
        startedAt:
          type: string
          format: date-time
          description: When the run started.
        profile:
          type: string
          description: >
            The profile the run laid out by: the one named, or the library's
            own when the run planned one managed library. Absent for an undo
            and for a run that laid several libraries out by their own.
        committed:
          type: integer
          description: Files the run moved.
        rolledBack:
          type: integer
          description: Moves that failed on disk, leaving the file where it was.
        planned:
          type: integer
          description: >
            Moves a crash left between the disk and the catalog, which the
            next start settles.
        undoable:
          type: boolean
          description: Whether `/organize/undo` takes the run now.

    OrganizeFailure:
      type: object
      description: One file organize could not move.
      required: [path, reason]
      properties:
        path:
          type: string
          description: The file.
        reason:
          type: string
          description: Why it did not move.
