# WaxDeck API contract fragment; assembled into api/openapi.yaml by `make generate`.
paths:
  /notifications/events:
    get:
      operationId: listNotificationEvents
      summary: List the notification event catalog
      description: >
        Every notification event this server can emit, with its scope:
        `server` events describe server operations and deliver to
        server-scope targets (plus admin-owned personal targets that
        opted in), `user` events concern one user and deliver to that
        user's personal targets. Clients build the per-target event
        checklist from this catalog; a target's `enabledEvents` must
        name events from it. The reserved `test` event never appears
        here: per-target tests are requested through the target's test
        endpoint and bypass event selection.


        The current catalog is `signup-requested`, `backup-completed`,
        `backup-failed`, `episode-downloaded`, `feed-disabled`,
        `review-ready`, `import-completed`, and `playlist-synced`.
      tags: [notifications]
      responses:
        "200":
          description: The event catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationEventList"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /users/me/notification-targets:
    get:
      operationId: listMyNotificationTargets
      summary: List the caller's notification targets
      description: >
        The calling user's personal notification targets, including
        UnifiedPush registrations (kind `unifiedpush`; the
        push-registration endpoints are a compatibility view over the
        same rows). `config` is returned verbatim to the owner,
        service tokens included, so the configuration can be
        round-tripped for editing; it is sealed at rest. Unpaginated:
        the per-kind cap keeps the list small.
      tags: [notifications]
      responses:
        "200":
          description: The caller's targets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationTargetList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      operationId: createMyNotificationTarget
      summary: Create a personal notification target
      description: >
        Creates one personal delivery destination. `config` carries
        the kind's fields (see the NotificationTarget schema);
        validation is per kind and unknown config fields are refused.
        `enabledEvents` names catalog events this target receives:
        user-scope events for everyone, server-scope events only when
        the caller is an administrator. Each user may hold at most 20
        targets per kind; conflict (code `conflict`) means the cap is
        reached, or that a `unifiedpush` target for the same endpoint
        already exists. On servers that refuse private notification
        hosts, a URL-carrying config resolving to a private address is
        refused at write time (and again at delivery time);
        `unifiedpush` endpoints are deliberately exempt, since
        self-hosted LAN distributors are legitimate.
      tags: [notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationTargetCreate"
      responses:
        "201":
          description: Target created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationTarget"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/Conflict"

  /users/me/notification-targets/{targetId}:
    put:
      operationId: updateMyNotificationTarget
      summary: Update a personal notification target
      description: >
        Replaces the target's label, config, and enabled events; an
        omitted label clears it. The kind is fixed at creation. The
        stored config is replaced whole, so clients edit the
        round-tripped document, and creation rules re-apply: per-kind
        config validation, the event scope rules, and the
        private-address refusal for user-pointed URLs. Changing a
        `unifiedpush` target's endpoint to one another target already
        holds answers conflict (code `conflict`).
      tags: [notifications]
      parameters:
        - $ref: "#/components/parameters/TargetId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationTargetUpdate"
      responses:
        "200":
          description: The updated target.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationTarget"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteMyNotificationTarget
      summary: Delete a personal notification target
      description: >
        Removes the target; its queued deliveries are dropped.
      tags: [notifications]
      parameters:
        - $ref: "#/components/parameters/TargetId"
      responses:
        "204":
          description: Target removed.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/me/notification-targets/{targetId}/test:
    post:
      operationId: testMyNotificationTarget
      summary: Test a personal notification target
      description: >
        Queues one test delivery to this target, bypassing event
        selection. Answers as soon as the test is queued; the outcome
        lands on the target's health fields (`lastSuccessAt`,
        `lastError`, `lastErrorAt`), which the settings surface polls.
      tags: [notifications]
      parameters:
        - $ref: "#/components/parameters/TargetId"
      responses:
        "202":
          description: Test queued.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/me/push-registrations:
    get:
      operationId: listPushRegistrations
      summary: List the caller's push registrations
      description: >
        The calling user's UnifiedPush registrations: a compatibility
        view over the caller's `unifiedpush` notification targets.
        Unpaginated; the per-user cap is small.
      tags: [notifications]
      responses:
        "200":
          description: The caller's push registrations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushRegistrationList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      operationId: createPushRegistration
      summary: Register a UnifiedPush endpoint
      description: >
        Registers a UnifiedPush endpoint URL (obtained by the client
        from its distributor) for push-transported event
        notifications, stored as a `unifiedpush` notification target.
        A genuinely new endpoint starts enabled for every user-scope
        event; re-registering a known endpoint URL (UnifiedPush
        clients re-post at every app start) refreshes the label and
        returns the existing registration without touching the event
        selection made in the notification-targets surface. Each user
        may hold at most 20 registrations; conflict (code `conflict`)
        means the cap is reached, so remove a stale registration
        first. The endpoint URL must be https and is used exactly as
        supplied: posting to caller-chosen URLs is inherent to
        UnifiedPush (self-hosted LAN distributors are legitimate), so
        the mitigations are shape, not reachability: delivery bodies
        carry only notification text, and delivery responses are
        never surfaced to any user.
      tags: [notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushRegistrationCreate"
      responses:
        "201":
          description: Newly registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushRegistration"
        "200":
          description: The endpoint was already registered; label updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushRegistration"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteAllPushRegistrations
      summary: Remove all of the caller's push registrations
      description: >
        Drops every UnifiedPush registration the caller holds, for a
        clean sign-out across distributors.
      tags: [notifications]
      responses:
        "204":
          description: All registrations removed.
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /users/me/push-registrations/{registrationId}:
    delete:
      operationId: deletePushRegistration
      summary: Remove a push registration
      description: Drops one UnifiedPush registration.
      tags: [notifications]
      parameters:
        - name: registrationId
          in: path
          required: true
          description: The registration's notification-target pid.
          schema:
            type: string
          example: nt-01JZX5N8QW3F4V9T2B7KD3M9R6
      responses:
        "204":
          description: Registration removed.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/notification-targets:
    get:
      operationId: listServerNotificationTargets
      summary: List the server-scope notification targets
      description: >
        The server-scope notification targets: administrator-managed
        destinations that receive server-operations events
        (signup requests, backup outcomes). Administrators only.
        `config` is returned verbatim, service tokens included, the
        same documented round-trip decision the admin configuration
        surface has always made; it is sealed at rest. Unpaginated:
        the per-kind cap keeps the list small.
      tags: [notifications]
      responses:
        "200":
          description: The server-scope targets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationTargetList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createServerNotificationTarget
      summary: Create a server-scope notification target
      description: >
        Creates one server-scope delivery destination. Administrators
        only. `config` carries the kind's fields (see the
        NotificationTarget schema); validation is per kind and unknown
        config fields are refused. `enabledEvents` names server-scope
        catalog events. Server-scope destinations are administrator
        configured, so their URLs are not subject to the
        private-address refusal that guards user-pointed ones. The
        server may hold at most 20 targets per kind; conflict (code
        `conflict`) means the cap is reached, or that a `unifiedpush`
        target for the same endpoint already exists.
      tags: [notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationTargetCreate"
      responses:
        "201":
          description: Target created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationTarget"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /admin/notification-targets/{targetId}:
    put:
      operationId: updateServerNotificationTarget
      summary: Update a server-scope notification target
      description: >
        Replaces the target's label, config, and enabled events; an
        omitted label clears it. Administrators only. The kind is
        fixed at creation; the stored config is replaced whole, so
        clients edit the round-tripped document, and creation rules
        re-apply (per-kind config validation and the event scope
        rules). Changing a `unifiedpush` target's endpoint to one
        another target already holds answers conflict (code
        `conflict`).
      tags: [notifications]
      parameters:
        - $ref: "#/components/parameters/TargetId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationTargetUpdate"
      responses:
        "200":
          description: The updated target.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationTarget"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteServerNotificationTarget
      summary: Delete a server-scope notification target
      description: >
        Removes the target; its queued deliveries are dropped.
        Administrators only.
      tags: [notifications]
      parameters:
        - $ref: "#/components/parameters/TargetId"
      responses:
        "204":
          description: Target removed.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/notification-targets/{targetId}/test:
    post:
      operationId: testServerNotificationTarget
      summary: Test a server-scope notification target
      description: >
        Queues one test delivery to this target, bypassing event
        selection. Administrators only. Answers as soon as the test is
        queued; the outcome lands on the target's health fields
        (`lastSuccessAt`, `lastError`), which the settings surface
        polls.
      tags: [notifications]
      parameters:
        - $ref: "#/components/parameters/TargetId"
      responses:
        "202":
          description: Test queued.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/me/notifications:
    get:
      operationId: listMyNotifications
      summary: List the caller's notification inbox
      description: >
        What happened to this account, newest first, whether or not any
        delivery target was configured for it. The inbox is written on
        every emit, so it is the record a client that was closed at the
        time can still read; targets are how news leaves the server, not
        where it is kept.


        Rows are pruned by age and by a per-account cap, so the inbox is
        recent history rather than an audit log.
      tags: [notifications]
      parameters:
        - name: cursor
          in: query
          description: >
            Opaque keyset cursor from a previous page's `nextCursor`.
            Omit for the first page.
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum rows per page.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: One page of the inbox.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    delete:
      operationId: clearMyNotifications
      summary: Empty the caller's notification inbox
      description: Removes every row. Clearing an empty inbox answers 204.
      tags: [notifications]
      responses:
        "204":
          description: Inbox emptied.
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /users/me/notifications/read:
    post:
      operationId: markMyNotificationsRead
      summary: Mark inbox rows read
      description: >
        Stamps `readAt` on the named rows, or on every unread row when
        `ids` is absent or empty. Already-read rows keep the stamp they
        have, and an id that names nothing is ignored: the caller asked
        for those rows to be read and they are.
      tags: [notifications]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationReadRequest"
      responses:
        "204":
          description: Rows marked read.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /users/me/notifications/{notificationId}:
    delete:
      operationId: deleteMyNotification
      summary: Delete one inbox row
      description: >
        Removes the row. Another account's row answers 404 rather than
        403: the inbox is per-account and nobody else's row is a thing
        this caller can be told exists.
      tags: [notifications]
      parameters:
        - $ref: "#/components/parameters/NotificationId"
      responses:
        "204":
          description: Row removed.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    NotificationId:
      name: notificationId
      in: path
      required: true
      description: Inbox row PID (e.g. `nf-01JZX5N8QW3F4V9T2B7KD3M9R6`).
      schema:
        type: string
        pattern: "^nf-[0-9A-HJKMNP-TV-Z]{26}$"
    TargetId:
      name: targetId
      in: path
      required: true
      description: Notification target PID (e.g. `nt-01JZX5N8QW3F4V9T2B7KD3M9R6`).
      schema:
        type: string
        pattern: "^nt-[0-9A-HJKMNP-TV-Z]{26}$"
  schemas:
    NotificationScope:
      type: string
      enum: [server, user]
      description: >
        Where a notification event or target belongs: `server` is the
        administrator-managed operations scope, `user` a single user's
        personal scope. A shared named schema on purpose: identical
        inline enums make the Dart generator emit one enum class into
        two files, which does not compile.

    NotificationTargetKind:
      type: string
      enum: [pushover, ntfy, gotify, discord, webhook, apprise, unifiedpush]
      description: >
        A notification delivery provider. A shared named schema on
        purpose, like NotificationScope.

    NotificationEvent:
      type: object
      description: One notification event the server can emit.
      required: [name, scope, description]
      properties:
        name:
          type: string
          description: Stable event name.
          example: episode-downloaded
        scope:
          $ref: "#/components/schemas/NotificationScope"
        description:
          type: string
          description: Human-readable event description for the checklist.

    NotificationEventList:
      type: object
      description: The server's notification event catalog.
      required: [events]
      properties:
        events:
          type: array
          description: Every event this server can emit, server scope first.
          items:
            $ref: "#/components/schemas/NotificationEvent"

    Notification:
      type: object
      description: >
        One thing that happened to this account. `event` is a catalog
        event name, so a client words the row itself and stays
        localized; `title` and `body` are the server's own English
        wording, for a client that does not know the event.
      required: [id, event, title, body, createdAt]
      properties:
        id:
          type: string
          description: Type-prefixed ULID.
          example: nf-01JZX5N8QW3F4V9T2B7KD3M9R6
        event:
          type: string
          description: The catalog event this row reports.
          example: episode-downloaded
        title:
          type: string
          description: The server's own one-line wording.
        body:
          type: string
          description: The server's own detail line.
        targetPid:
          type: string
          description: >
            What the row is about, when the event names something: the
            show for `feed-disabled`, the episode for
            `episode-downloaded`, the playlist for `playlist-synced`,
            the review entry (`rv-`) for `import-completed`. Absent for
            events that are about the server rather than an item.
          example: pc-01JZX5N8QW3F4V9T2B7KD3M9R6
        createdAt:
          type: string
          format: date-time
          description: When the event happened.
        readAt:
          type: string
          format: date-time
          description: When the row was marked read. Absent while unread.

    NotificationPage:
      type: object
      description: One keyset-paginated page of the inbox.
      required: [notifications, unreadCount]
      properties:
        notifications:
          type: array
          description: Rows newest first.
          items:
            $ref: "#/components/schemas/Notification"
        nextCursor:
          type: string
          description: Opaque cursor for the next page. Absent on the last page.
        unreadCount:
          type: integer
          description: >
            Unread rows in the whole inbox, not just this page: it is
            what the bell's badge counts.

    NotificationReadRequest:
      type: object
      description: Which inbox rows to mark read.
      properties:
        ids:
          type: array
          description: >
            The rows to stamp. Absent or empty marks every unread row
            read, which is what the "mark all read" affordance sends.
          maxItems: 200
          items:
            type: string
            example: nf-01JZX5N8QW3F4V9T2B7KD3M9R6

    NotificationTarget:
      type: object
      description: >
        One notification delivery destination. `config` is a free-form
        object whose fields depend on `kind` (a discriminated union is
        deliberately avoided; validation is server-side and per kind,
        and unknown fields are refused):
        `pushover` takes `token` (application API token), `userKey`,
        and optional integer `priority` (-2 quietest to 2 emergency;
        emergency deliveries use the service's minimum retry cadence);
        `ntfy` takes `topic`, optional `serverUrl` (default
        `https://ntfy.sh`), and optional `accessToken` (sent as a
        Bearer token); its deliveries carry a `click` URL and a view
        action when the server knows its public base;
        `gotify` takes `serverUrl` and `token` (sent as a header, so
        it stays out of URLs and logs) and optional integer `priority`
        (0 to 10);
        `discord` takes `webhookUrl`, which must be a discord.com or
        discordapp.com webhook URL; its embeds carry a timestamp, a
        colour per event family, a WaxDeck footer, and a link when the
        server knows its public base;
        `webhook` takes `url` and posts
        `{event, title, body, timestamp}` as JSON with timestamp in
        RFC 3339 UTC, plus `link` when the server knows its own public
        base (`WAXDECK_PUBLIC_BASE`) and the event names something to
        open; it also takes optional `headers` (an object of at most 8
        extra request headers, names ASCII tokens up to 64 characters
        and values up to 1024; hop-by-hop names, `Host`,
        `Content-Length` and `Content-Type` are refused) and optional
        `secret` (up to 256 characters), which signs every post:
        `X-WaxDeck-Timestamp` carries unix seconds and
        `X-WaxDeck-Signature` carries
        `sha256=<hex HMAC-SHA256(secret, timestamp + "." + body)>`;
        `apprise` takes `serverUrl` (the Apprise API server base; its
        notify endpoint is derived unless the URL already names a
        path) and optional `targets` (comma or space separated Apprise
        target URLs; empty relies on the Apprise server's own
        configuration);
        `unifiedpush` takes `endpoint` (the distributor-issued https
        URL, unique per owner).
      required: [pid, kind, scope, config, enabledEvents, createdAt]
      properties:
        pid:
          type: string
          description: Type-prefixed ULID.
          example: nt-01JZX5N8QW3F4V9T2B7KD3M9R6
        kind:
          $ref: "#/components/schemas/NotificationTargetKind"
        scope:
          $ref: "#/components/schemas/NotificationScope"
        label:
          type: string
          description: Display label, usually the service or device name.
        config:
          type: object
          additionalProperties: true
          description: >
            The kind's delivery configuration, returned verbatim to
            the owner (see the schema description for per-kind
            fields). Sealed at rest.
        enabledEvents:
          type: array
          description: >
            Catalog event names this target receives. Empty delivers
            nothing but per-target tests.
          items:
            type: string
        lastSuccessAt:
          type: string
          format: date-time
          description: When a delivery last succeeded; absent before the first.
        lastError:
          type: string
          description: The most recent delivery error; absent when the last delivery succeeded.
        lastErrorAt:
          type: string
          format: date-time
          description: >
            When the most recent delivery error happened; cleared,
            like `lastError`, by a subsequent success.
        muted:
          type: boolean
          description: >
            While true the target delivers nothing but its own
            per-target tests. A pause that keeps the configuration and
            the event selection, for the destination somebody wants
            back later; already-queued deliveries are dropped rather
            than held for the unmute.
        minIntervalSeconds:
          type: integer
          description: >
            The shortest gap between two deliveries to this target, in
            seconds; 0 (the default) paces nothing. A delivery inside
            the gap waits rather than spending a retry attempt, and the
            reserved `test` event is exempt from the gap and never
            starts it.
        createdAt:
          type: string
          format: date-time
          description: When the target was created.

    NotificationTargetCreate:
      type: object
      description: A notification target to create.
      required: [kind, config, enabledEvents]
      properties:
        kind:
          $ref: "#/components/schemas/NotificationTargetKind"
        label:
          type: string
          description: Display label.
          maxLength: 100
        config:
          type: object
          additionalProperties: true
          description: >
            The kind's delivery configuration (see the
            NotificationTarget schema for per-kind fields).
        enabledEvents:
          type: array
          description: >
            Catalog event names to deliver. Scope rules apply:
            server-scope targets take server-scope events; user-scope
            targets take user-scope events, plus server-scope events
            when the owner is an administrator.
          items:
            type: string
        muted:
          type: boolean
          default: false
          description: >
            Create the target paused: it delivers nothing but its own
            per-target tests until unmuted.
        minIntervalSeconds:
          type: integer
          minimum: 0
          maximum: 3600
          default: 0
          description: >
            The shortest gap between two deliveries to this target, in
            seconds. A delivery inside the gap waits rather than
            spending a retry attempt; the reserved `test` event is
            exempt, and never starts the gap either. Capped at an hour:
            that bounds the wait, not the queue, and a target fed faster
            than its interval has the deliveries it cannot reach inside
            the outbox's day shed rather than delivered late.

    NotificationTargetUpdate:
      type: object
      description: >
        Replaces a target's label, config, and enabled events; the
        kind is fixed at creation. `muted` and `minIntervalSeconds` are
        the exception to the whole-replace: omitting one keeps what the
        target holds, so a client that predates them cannot wake a
        destination somebody silenced on purpose just by renaming it.
      required: [config, enabledEvents]
      properties:
        label:
          type: string
          description: Display label.
          maxLength: 100
        config:
          type: object
          additionalProperties: true
          description: The kind's delivery configuration, replaced whole.
        enabledEvents:
          type: array
          description: >
            Catalog event names to deliver, under the same scope rules
            as creation.
          items:
            type: string
        muted:
          type: boolean
          description: >
            Pauses the target: it delivers nothing but its own
            per-target tests until unmuted. Omitted leaves it as it is.
        minIntervalSeconds:
          type: integer
          minimum: 0
          maximum: 3600
          description: >
            The shortest gap between two deliveries to this target, in
            seconds. A delivery inside the gap waits rather than
            spending a retry attempt; the reserved `test` event is
            exempt, and never starts the gap either. Capped at an hour:
            that bounds the wait, not the queue, and a target fed faster
            than its interval has the deliveries it cannot reach inside
            the outbox's day shed rather than delivered late. Omitted
            leaves it as it is.

    NotificationTargetList:
      type: object
      description: A scope's notification targets.
      required: [targets]
      properties:
        targets:
          type: array
          description: Targets, newest first.
          items:
            $ref: "#/components/schemas/NotificationTarget"

    PushRegistration:
      type: object
      description: >
        One UnifiedPush endpoint registration: a compatibility view
        over a `unifiedpush` notification target.
      required: [pid, endpoint, createdAt]
      properties:
        pid:
          type: string
          description: Type-prefixed ULID (a notification-target pid).
          example: nt-01JZX5N8QW3F4V9T2B7KD3M9R6
        endpoint:
          type: string
          description: The distributor-issued push endpoint URL.
        label:
          type: string
          description: Client-chosen label, usually the device name.
        createdAt:
          type: string
          format: date-time
          description: When the endpoint was registered.

    PushRegistrationCreate:
      type: object
      description: A UnifiedPush endpoint to register.
      required: [endpoint]
      properties:
        endpoint:
          type: string
          description: The distributor-issued https endpoint URL.
        label:
          type: string
          description: Display label, usually the device name.
          maxLength: 100

    PushRegistrationList:
      type: object
      description: The caller's push registrations.
      required: [registrations]
      properties:
        registrations:
          type: array
          description: Registrations, newest first.
          items:
            $ref: "#/components/schemas/PushRegistration"
