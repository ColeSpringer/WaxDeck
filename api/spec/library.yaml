# WaxDeck API contract fragment; assembled into api/openapi.yaml by `make generate`.
paths:
  /library/items:
    get:
      operationId: listItems
      summary: Browse library items
      description: >
        Keyset-paginated list of library items, optionally filtered by media
        type and by one bucket of a browse dimension. Ordering is stable
        (title, then pid) so cursors never skip or duplicate.
      tags: [library]
      parameters:
        - name: mediaType
          in: query
          description: Restrict results to one media type.
          schema:
            $ref: "#/components/schemas/MediaType"
        - name: facet
          in: query
          description: >
            Restrict results to one bucket of a browse dimension. Requires
            `facetKey`, and takes the same dimension names
            `/library/facets` enumerates. Composes with `mediaType`.
          schema:
            $ref: "#/components/schemas/BrowseDimension"
        - name: facetKey
          in: query
          description: >
            The bucket to drill, as returned in the enumeration's `key`.
            Send it empty to select the dimension's unknown bucket (the
            items the dimension is absent from, such as `[Non-Album]`);
            `kind` and custom tag dimensions have no unknown bucket and
            reject an empty key. Ignored without `facet`.
          schema:
            type: string
        - name: cursor
          in: query
          description: >
            Opaque keyset cursor from a previous page's `nextCursor`. Omit for
            the first page.
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum items per page.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: One page of items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /library/browse:
    get:
      operationId: browseList
      summary: Browse a discovery list
      description: >
        Keyset-paginated discovery lists over the whole library: newest,
        recently added, most played, recently played, random, starred, and
        alphabetical. Play-derived lists reflect the calling user's own
        listening state.
      tags: [library]
      parameters:
        - name: list
          in: query
          required: true
          description: Which discovery list to page through.
          schema:
            $ref: "#/components/schemas/DiscoveryList"
        - name: seed
          in: query
          description: >
            Shuffle seed for the `random` list. The same seed pages through
            the same shuffled order, so paging stays stable. When omitted the
            server picks a fresh seed and returns it as the page's `seed`;
            pass that value back with the cursor for later pages. A cursor is
            only valid together with the same `list` and `seed` it was issued
            for.
          schema:
            type: integer
            format: int64
        - name: cursor
          in: query
          description: >
            Opaque keyset cursor from a previous page's `nextCursor`. Omit for
            the first page.
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum items per page.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: One page of the list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /library/facets:
    get:
      operationId: listFacets
      summary: Enumerate a browse dimension
      description: >
        Keyset-paginated buckets of one browse dimension, each with the
        number of matching items: the "all genres" and "all artists"
        lists a browse index is built from. Buckets come biggest first
        by default, ties broken by label, so the list leads with what is
        worth opening and paging stays stable; `sort=label` orders them
        A to Z instead, for an index with an alphabet rail. Drill a
        bucket by passing its `key` back as `listItems`' `facetKey`
        together with the same `facet`.

        A cursor is only valid for the `sort` it was issued under: the
        two orders interleave differently, so resuming one from the
        other's boundary would skip or repeat buckets. Sending a
        mismatched pair is `invalid-request` rather than a silently
        wrong page.

        The `genre`, `artist`, `album-artist`, `album`, and `year`
        dimensions each carry a bucket for the items the dimension is
        absent from (`[No Genre]`, `[Unknown Artist]`, `[Non-Album]`,
        `[Unknown Year]`), with an empty `key` and `unknown` true.
        `kind` has none, because an item's kind is never absent, and a
        custom tag dimension has none, because only items carrying the
        key contribute at all; on those two, drilling an empty
        `facetKey` is `invalid-request` rather than an empty page.
        Podcast episodes are excluded from the music dimensions, which
        they have no artist, album, genre, or year for; the `kind`
        dimension counts them.

        Counts are scoped to the libraries the caller may see. The
        per-item rules the drill list also applies (podcast subscriptions,
        content rules) are per-item decisions no aggregation can express,
        so a bucket can read higher than the list it opens, the same way
        any restricted listing can return a short page.
      tags: [library]
      parameters:
        - name: dimension
          in: query
          required: true
          description: Which browse dimension to enumerate.
          schema:
            $ref: "#/components/schemas/BrowseDimension"
        - name: sort
          in: query
          description: >
            Bucket order. `count` (the default) is biggest first, ties
            broken by label then key. `label` is A to Z by the bucket's
            display label, ties broken by key; the unknown bucket sorts
            last under it, since a sentinel has no place in an alphabet.
          schema:
            $ref: "#/components/schemas/FacetSort"
        - name: cursor
          in: query
          description: >
            Opaque cursor from a previous page's `nextCursor`. Omit for
            the first page. Valid only with the `sort` it was issued
            under.
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum buckets per page.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: One page of buckets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacetPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /library/search:
    get:
      operationId: search
      summary: Search the library
      description: >
        Full-text search across artists, albums, tracks, books, and episodes.
        Results are grouped by kind and ranked within each group; each group
        is capped at `limit` hits.
      tags: [library]
      parameters:
        - name: q
          in: query
          required: true
          description: Search query. Must contain at least one non-whitespace character.
          schema:
            type: string
            minLength: 1
        - name: limit
          in: query
          description: Maximum hits per result group.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Grouped search results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /items/{pid}:
    get:
      operationId: getItem
      summary: Get one item's detail
      description: Full detail for a single library item.
      tags: [library]
      parameters:
        - $ref: "#/components/parameters/Pid"
      responses:
        "200":
          description: The item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /items/{pid}/art:
    get:
      operationId: getItemArt
      summary: Get artwork
      description: >
        Artwork as image bytes: the original at full size, or a square-fit
        thumbnail when `size` is given. Besides item PIDs this endpoint also
        accepts album (`al-`), artist (`ar-`), podcast show (`pc-`), and
        playlist (`pl-`) PIDs, so search hits, subscription lists, and
        playlist grids can render artwork directly. A playlist answers its
        own cover, whether the owner uploaded one or the server built it
        from the members, and follows the same visibility rule as every
        other playlist read. Items without any artwork in their fallback
        chain return 404. Responses carry a content-addressed `ETag`; revalidate with
        `If-None-Match` instead of refetching.


        Responses are cacheable for a day and reusable while revalidating
        for a week (`Cache-Control`), so a warm grid paints from the cache
        instead of spending a conditional GET per cover. The bytes are
        per-caller (artwork follows the item's visibility), so the
        directive is `private` and the response varies by the credential
        presented (`Cookie` or `Authorization`): a browser shared by two
        accounts must not answer one from the other's cache.


        A URL names a PID and a size, not the bytes behind them, so a
        client that replaces an entity's artwork has to defeat its own
        caches: vary `v` to do it.
      tags: [library]
      parameters:
        - $ref: "#/components/parameters/Pid"
        - name: role
          in: query
          description: >
            Which artwork slot to read. Only `front` (the default) walks the
            album/artist fallback chain; `back`, `disc`, `booklet`, and
            `background` resolve at the requested entity's own level and 404
            when that entity holds no image in the slot.
          schema:
            $ref: "#/components/schemas/ArtRole"
        - name: size
          in: query
          description: >
            Longest-edge bound in pixels for a thumbnail. Omit for the
            original image.
          schema:
            type: integer
            minimum: 16
            maximum: 2048
        - name: v
          in: query
          description: >
            Opaque cache-buster, ignored by the server. Artwork lives at
            one URL whatever it holds, and this response is cacheable for
            a day, so a client that has just replaced an entity's cover
            would otherwise keep painting the old bytes out of its own
            cache. Varying this asks for the same image under a name no
            cache has seen.
          schema:
            type: string
        - name: If-None-Match
          in: header
          description: Previously returned `ETag`; a match answers 304 with no body.
          schema:
            type: string
      responses:
        "200":
          description: The artwork image.
          headers:
            ETag:
              description: Content-addressed validator for the returned bytes.
              schema:
                type: string
            Cache-Control:
              description: >
                `private, max-age=86400, stale-while-revalidate=604800`.
                Not `immutable`: the URL names a pid and a size, not the
                bytes, so replacing an item's cover reuses it.
              schema:
                type: string
            Vary:
              description: >
                `Cookie, Authorization`: the credential is what decides
                whether these bytes exist for a caller, so a cached copy
                is never reused across sessions on a shared browser or
                across tokens on a shared cache.
              schema:
                type: string
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
        "304":
          description: >
            The cached copy is still current. It carries the same
            validator and freshness the body would have, so a
            revalidation refreshes the cached copy rather than leaving it
            stale enough to revalidate again on the next paint.
          headers:
            ETag:
              description: Content-addressed validator for the cached bytes.
              schema:
                type: string
            Cache-Control:
              description: The same directive the 200 carries.
              schema:
                type: string
            Vary:
              description: The same credentials the 200 varies by.
              schema:
                type: string
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /items/{pid}/art-roles:
    get:
      operationId: getItemArtRoles
      summary: List the artwork slots an entity holds
      description: >
        The artwork slots present at the entity's own level, not inherited
        from the album or artist chain, each with its stored format and pixel
        dimensions (0 when the image was not decodable). Besides item PIDs
        this accepts album (`al-`), artist (`ar-`), podcast show (`pc-`), and
        playlist (`pl-`) PIDs. It answers the own-versus-inherited question a front-cover read
        cannot: an item that lists a `front` slot here holds its own cover,
        while one that resolves art only through `/items/{pid}/art` inherits
        it from the chain.
      tags: [library]
      parameters:
        - $ref: "#/components/parameters/Pid"
      responses:
        "200":
          description: The slots the entity holds at its own level.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtRoles"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /library/items/delete:
    post:
      operationId: deleteLibraryItems
      summary: Delete library items
      description: >
        Deletes items' files, to the catalog trash by default
        (reversible from the trash surface) or permanently (`mode`
        `permanent`, administrators only). `dryRun` answers the plan
        (which files, how many bytes) without deleting, and the
        response reports the same entries when it applies. Deleting
        needs the `delete` permission or the admin role, and every
        pid must be visible to the caller (`not-found` otherwise).
        Items keep their catalog identity: an item that loses its
        last file is archived, not erased, and play history
        survives. A read-only library answers `read-only`.
      tags: [library]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteItemsRequest"
      responses:
        "200":
          description: The plan (dry run) or the applied result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteItemsResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ReadOnly"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

components:
  schemas:
    DiscoveryList:
      type: string
      description: >
        Discovery lists for browsing. `most-played`, `recently-played`, and
        `starred` reflect the calling user's own listening state.
      enum:
        - newest
        - recently-added
        - most-played
        - recently-played
        - random
        - starred
        - alphabetical

    BrowseDimension:
      type: string
      description: >
        A browse dimension: one of `genre`, `artist`, `album-artist`,
        `album`, `year`, `kind`, or a custom tag dimension spelled
        `tag.<KEY>` (for example `tag.MOOD`). The fixed set is stable;
        which tag dimensions exist depends on the library's tags. Tag
        keys are case-insensitive and canonicalize to upper case, so
        `tag.mood` and `tag.MOOD` are one dimension; responses echo the
        canonical spelling.
      example: genre

    FacetSort:
      type: string
      description: >
        How a browse dimension's buckets are ordered. `count` leads with
        the biggest buckets, which is what a hub wants; `label` is the
        A-to-Z order an index with an alphabet rail scrolls through.
      enum:
        - count
        - label
      default: count
      example: label

    FacetBucket:
      type: object
      description: One bucket of a browse dimension.
      required: [key, label, count]
      properties:
        key:
          type: string
          description: >
            The bucket's stable handle: pass it back as `listItems`'
            `facetKey` to drill it. Empty for the unknown bucket.
          example: 01JZX5N8QW3F4V9T2B7KD3M9R6
        label:
          type: string
          description: >
            Display label. Genre labels are the canonical spelling from
            the server's genre tree, not whichever variant was scanned
            first.
          example: Hip Hop
        count:
          type: integer
          description: Items in this bucket, within the caller's libraries.
        entityPid:
          type: string
          description: >
            The catalog entity behind the bucket, for the dimensions that
            have one (`artist`, `album-artist`, `album`). Absent for the
            unknown bucket and for dimensions that are not entities.

            It is this bucket's `key` carried with the entity's API type
            prefix, so a client holding one has the other: a screen
            addressed by `al-<ulid>` drills with `facetKey=<ulid>`, and
            the entity endpoints (`/albums/{pid}/play-state` and
            friends) take the prefixed form.
          example: al-01JZX5N8QW3F4V9T2B7KD3M9R6
        unknown:
          type: boolean
          description: >
            True for the bucket holding items the dimension is absent
            from. Its `label` is the canonical sentinel and its `key` is
            empty.

    FacetPage:
      type: object
      description: One keyset-paginated page of a browse dimension's buckets.
      required: [dimension, buckets]
      properties:
        dimension:
          $ref: "#/components/schemas/BrowseDimension"
        buckets:
          type: array
          items:
            $ref: "#/components/schemas/FacetBucket"
        nextCursor:
          type: string
          description: Opaque cursor for the next page. Absent on the last page.

    SearchHit:
      type: object
      description: One ranked search hit.
      required: [pid, kind, title]
      properties:
        pid:
          type: string
          description: Type-prefixed ULID of the hit.
          example: tr-01JZX5N8QW3F4V9T2B7KD3M9R6
        kind:
          type: string
          description: What the hit is (`artist`, `album`, `track`, `book`, `episode`).
          example: track
        title:
          type: string
          description: Display title.
        subtitle:
          type: string
          description: Context line (artist for a track, author for a book).

    SearchResults:
      type: object
      description: Search results grouped by kind, ranked within each group.
      required: [query, artists, albums, tracks, books, episodes]
      properties:
        query:
          type: string
          description: The query these results answer.
        artists:
          type: array
          items:
            $ref: "#/components/schemas/SearchHit"
        albums:
          type: array
          items:
            $ref: "#/components/schemas/SearchHit"
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/SearchHit"
        books:
          type: array
          items:
            $ref: "#/components/schemas/SearchHit"
        episodes:
          type: array
          items:
            $ref: "#/components/schemas/SearchHit"
        truncated:
          type: boolean
          description: True when any group was capped at the limit.

    Item:
      allOf:
        - $ref: "#/components/schemas/ItemSummary"
        - type: object
          description: Extended detail fields beyond the summary row.
          properties:
            genres:
              type: array
              description: Display genres.
              items:
                type: string
                example: blues
            year:
              type: integer
              description: Release / publication year.
              example: 2024
            trackNumber:
              type: integer
              description: Track position within its disc (music).
            discNumber:
              type: integer
              description: Disc number within a multi-disc release (music).
            codec:
              type: string
              description: Source audio codec.
              example: flac
            container:
              type: string
              description: Source file container.
              example: flac
            sampleRate:
              type: integer
              description: Source sample rate in Hz.
              example: 44100
            bitrate:
              type: integer
              description: Source bitrate in bits per second, when known.
            addedAt:
              type: string
              format: date-time
              description: When the item entered the library.
      description: Full detail for a single library item.

    ItemPage:
      type: object
      description: One keyset-paginated page of items.
      required: [items]
      properties:
        items:
          type: array
          description: Items in stable order.
          items:
            $ref: "#/components/schemas/ItemSummary"
        nextCursor:
          type: string
          description: >
            Opaque cursor for the next page. Absent on the last page.
        seed:
          type: integer
          format: int64
          description: >
            The effective shuffle seed. Present only on `random` browse
            pages; pass it back together with `nextCursor` so later pages
            keep the same order.

    DeleteItemsRequest:
      type: object
      description: A deletion (or a dry-run plan) over library items.
      required: [pids]
      properties:
        pids:
          type: array
          minItems: 1
          maxItems: 500
          description: The items whose files to delete.
          items:
            type: string
        mode:
          type: string
          enum: [trash, permanent]
          default: trash
          description: >
            `trash` is reversible from the trash surface;
            `permanent` bypasses it (administrators only).
        dryRun:
          type: boolean
          default: false
          description: Answer the plan without deleting.

    DeleteItemsResult:
      type: object
      description: What a deletion did, or would do.
      required: [applied, mode, entries]
      properties:
        applied:
          type: boolean
          description: False for a dry run.
        mode:
          type: string
          description: The mode that was (or would be) used.
        entries:
          type: array
          description: Per-item breakdown.
          items:
            $ref: "#/components/schemas/DeletePlanEntry"

    DeletePlanEntry:
      type: object
      description: One item's part of a deletion.
      required: [pid, files, bytes]
      properties:
        pid:
          type: string
          description: The item.
        name:
          type: string
          description: Display name.
        files:
          type: integer
          description: Files deleted (or to delete).
        bytes:
          type: integer
          format: int64
          description: Bytes reclaimed (or to reclaim).

    ArtRoleInfo:
      type: object
      description: One artwork slot an entity holds at its own level.
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/ArtRole"
        format:
          type: string
          description: The stored image format (`jpeg`, `png`, `webp`, `gif`).
        width:
          type: integer
          description: Pixel width, 0 when the image was not decodable.
        height:
          type: integer
          description: Pixel height, 0 when the image was not decodable.

    ArtRoles:
      type: object
      description: The artwork slots an entity holds at its own level.
      required: [roles]
      properties:
        roles:
          type: array
          items:
            $ref: "#/components/schemas/ArtRoleInfo"
