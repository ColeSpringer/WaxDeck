# WaxDeck API contract fragment; assembled into api/openapi.yaml by `make generate`.
paths:
  /review/queue:
    get:
      operationId: listReviewQueue
      summary: List review queue entries
      description: >
        Keyset-paginated review queue, newest first. Administrators see
        every entry; other callers see only entries produced by their
        own uploads, acquisitions and rematches. Each entry is one
        album-sized unit: it applies or declines as a whole, never
        track by track. `status` filters to one lifecycle state
        (`pending` is the working queue; decided entries remain
        listable for calibration and undo).
      tags: [review]
      parameters:
        - name: status
          in: query
          description: >
            Restrict to one status. Statuses are server-defined
            strings; the current set is `pending`, `applied`,
            `auto-applied`, `as-is`, `unofficial`, `skipped`,
            `discarded`, and `reverted`. `decided` is not a status but
            selects every status except `pending`. Unknown values
            yield an empty page rather than an error.
          schema:
            type: string
        - name: cursor
          in: query
          description: >
            Opaque keyset cursor from a previous page's `nextCursor`.
            Omit for the first page.
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum entries per page.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: One page of review entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewEntryPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /review/queue/{entryId}:
    parameters:
      - $ref: "#/components/parameters/ReviewEntryId"
    get:
      operationId: getReviewEntry
      summary: Inspect one review entry
      description: >
        The full entry: the unit's files with their current metadata,
        and every scored candidate with its per-field distance
        breakdown, track pairings (the side-by-side diff renders from
        these), missing tracks, and extra files. Candidates are ranked
        best first. Visibility follows the queue listing.
      tags: [review]
      responses:
        "200":
          description: The entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewEntryDetail"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /review/queue/{entryId}/decide:
    parameters:
      - $ref: "#/components/parameters/ReviewEntryId"
    post:
      operationId: decideReviewEntry
      summary: Decide a review entry
      description: >
        Applies one decision to a pending entry. `approve` applies the
        chosen candidate's metadata to the whole unit (the ranked best
        when `candidateMbid` is absent), locking the applied fields so a
        rescan cannot undo the acceptance, and writes them into each
        file's tags, all but a track's recording id, which the catalog
        keeps alone (a file's own recording id is left as it is); for
        entries staging new files (uploads and imports)
        the files enter the library first. The approval records the
        release and its release group on the album, over what an
        earlier approval recorded; a release another album already
        holds is not recorded and is named in `warnings`. It fetches a
        cover: the release's front cover, else its release group's,
        else a cover provider's answer for the release. That cover
        replaces a cover that came with a download (`ArtSource.source`
        `acquisition`) and fills a missing one; the release's own front
        also replaces a provider's cover found by name or by release
        group, a looser match. It is written into the files and locked.
        A cover an earlier approval wrote gives way to a later
        approval's; a cover a person set or locked, and a file's own
        art (embedded in an uploaded or scanned file, or an image beside
        it), are kept. An item left with no cover or a download's
        thumbnail, because no source has a cover or it could not be
        fetched (in time), is named in `warnings` and keeps what it had,
        which a later enrichment may still replace. The time spent
        fetching covers is bounded per decision (one bound for a whole
        bulk decision).


        `as-is` accepts the unit's current metadata (staged files enter
        the library as they are). `unofficial` is `as-is` plus a locked
        `RELEASESTATUS` custom tag of `unofficial`, written into the
        files too, which excludes the items from future match retries
        and from health penalties (content with no canonical release is
        a terminal state, not an error). With `useSuggested`, once the
        files are in the library, both first write the artist and title
        the entry offers as `suggested` onto its tracks, in the catalog
        and the files, as the deciding person's own edit, the way a
        metadata edit is; an artist a track already credits stays as it
        is. After either, an acquired music track that has
        a title and no album once it lands is given the album
        `<Title> - Single` (its title, then ` - Single`), with that
        track's artist as the album artist, unlocked and attributed to
        normalization (provenance `normalize`), so a later match or edit
        replaces it. An acquisition whose identification was declined
        gets the same; an uploaded file is not given one. Both writes
        happen only on an import as music: a decide importing the unit
        as `audiobook` makes neither. As after an approval, a file
        keeps the place its delivered tags gave it until it is
        organized (the `path-mismatch` health rule offers the move).


        A file in a read-only library
        keeps its tags: `warnings` names it and the health rule for
        tags out of sync lists what it is owed, while the unit's other
        files are written; a unit none of whose files may be written is
        applied to the catalog alone. A matching library applying a
        confident match on its own, or an entry taking its best match
        because its submission asked to (`acceptBestMatch`), writes
        the files and the cover the same way.
        `skip` dismisses the entry
        without touching anything (staged files stay staged).
        `discard` deletes staged files and exists only for entries
        that carry them. Deciding an already-decided entry answers
        `conflict`, as does any decision, revert or new search of an
        entry while another runs. A decision runs to its end once it
        starts, whether or not the client waits for the answer.
        Administrators may decide anything; other callers
        only entries from their own uploads, acquisitions and rematches.
        A metadata write that
        partially fails after the catalog committed reports per-file
        detail in `warnings` and the entry still counts as decided.
        Files that join an item the library already holds - the same
        audio, or a further part of a book it has - enter as that
        item's copies or parts: the item keeps its metadata and its
        cover, `approve`, `unofficial`, `useSuggested` and the album
        default leave it alone, and the uploader gains no right to
        edit it. `warnings` names such files, and the
        entry's tracks mark them `joined`. A file whose audio the
        library holds at the very place its tags would put it adds
        nothing; its staged copy is removed and `warnings` says so.


        Staged files enter the library together or not at all where the
        library can say in advance: every file is planned before any
        moves, so a place already taken or an unreadable file answers
        `conflict` with the reason, and a read-only destination
        `read-only`, leaving the unit staged. Two files of one unit that would take the same
        place pass that plan; the first lands and the decide answers
        `conflict` for the second, and a retry resumes there. `discard`
        then drops what is still staged and keeps what landed, which
        `warnings` counts.
      tags: [review]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewDecision"
      responses:
        "200":
          description: The decided entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewDecideResult"
        "400":
          description: >
            The request is malformed (code `invalid-request`). Besides a
            body that does not parse, this answers a `mediaType` the
            decision cannot take (see `ReviewDecision.mediaType`), and
            `useSuggested` with `as-is` or `unofficial`, on an import as
            music, on an entry that offers no `suggested` artist and
            title. An already decided entry answers `conflict` before
            any of these.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            The decision was refused. `conflict`: the entry is already
            decided, part of its unit cannot enter the library (the
            message says why), or the decision names a `mediaType` other
            than the entry's own once part of the unit is in the library
            (`mediumFixed`).
            `read-only`: the server is in read-only mode, or the library
            an upload or acquisition was staged for is read-only.
            `catalog-busy`: another job holds the catalog's shared
            file-mutation scope, which clears on its own, so the same
            decision is worth sending again. `storage-unwritable`: the
            library folder a file was going into refused the write (its
            permissions, or a read-only mount); the decision stays unmade,
            the staged files stay staged, and the same decision lands once
            the folder is fixed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /review/queue/{entryId}/identify:
    parameters:
      - $ref: "#/components/parameters/ReviewEntryId"
    post:
      operationId: reidentifyReviewEntry
      summary: Search again for a review entry
      description: >
        Requeues a pending entry for identification, optionally
        searching for values the reviewer typed rather than the ones
        the files claim. The body **replaces** whatever override the
        entry already carried, so an empty body (or one with every
        field blank) clears it and runs the plain derivation again.


        The typed values stand in for the unit's own for the search
        only: `artist` for both the artist and the album artist,
        `album` for the album title, `title` for the track title.
        Nothing is written to the files or to the catalog, and the
        entry's stored evidence keeps the tags the files actually
        carry - what changes is only what is looked up. The override
        persists on the entry, so a retry after a provider failure
        searches for the same thing.


        Typed values are kept as typed and reported back as
        `identifyOverride`. The search cleans a typed `title` as it
        cleans one read off the files, asking for the song alone:
        upload notes ("(Official Video)"), cut marks ("(Clean)"),
        remaster notes, and what names a particular recording (a
        " - Live at ..." or " - Radio Edit" tail, a "(Live)", "(Demo)"
        or "(... Remix)" group) are left out of what is looked up,
        since recordings are titled by the song, and are used to pick
        among the recordings found. The rest of what rescues a
        machine-written title does not run over typed values: a title
        is never split on " - " into an artist and a track, and a
        typed artist is searched as it stands, never replaced by one a
        descriptive title happens to name. A field left blank is not
        an instruction, so it falls back to what the files imply.


        Pending entries only; a decided one answers `conflict`. The
        permission is the deciding permission: administrators may
        re-identify anything, other callers only entries from their
        own uploads, acquisitions and rematches.
      tags: [review]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewIdentifyRequest"
      responses:
        "200":
          description: The entry, identifying again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewEntry"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /review/queue/{entryId}/revert:
    parameters:
      - $ref: "#/components/parameters/ReviewEntryId"
    post:
      operationId: revertReviewEntry
      summary: Revert an applied match
      description: >
        Restores the metadata snapshot taken before an `applied` or
        `auto-applied` entry was applied, in the catalog and the files'
        tags (catalog alone for a file in a read-only library, and for
        the recording id, which the apply kept there), unlocks
        the fields the apply locked (all but a restored recording id
        the file does not carry, which a rescan would otherwise
        clear), puts back the front cover the item
        had where the apply replaced it and removes one the apply added
        to an item that had none, puts back the album's and release
        group's ids where the album or group holds no other items, and
        marks the entry `reverted`. A music acquisition's track left
        with a title and no album is then given the `<Title> - Single`
        album a download kept as it is gets: a reverted download is
        unmatched again.
        Reverts of entries the matcher applied at its own threshold feed
        the calibration statistics. Only administrators and the deciding
        user may revert. Reverting anything but an applied entry answers
        `conflict`.
      tags: [review]
      responses:
        "200":
          description: The reverted entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewEntry"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /review/decide:
    post:
      operationId: decideReviewBulk
      summary: Decide many review entries
      description: >
        Applies one decision to many pending entries in a single call,
        for keyboard-driven bulk triage. `approve` uses each entry's
        own ranked best candidate (a per-entry candidate choice needs
        the single-entry endpoint), and each entry imports as its own
        `mediaType` (choosing another needs the single-entry endpoint
        too; so does `useSuggested`). The time bound on an approval's
        cover fetches is shared across the whole call, so an entry the
        bound did not reach keeps its cover and, left with none or a
        download's thumbnail, carries the cover warning. Entries are decided independently:
        one failure does not stop the rest, and the response reports
        each outcome.
      tags: [review]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewBulkDecision"
      responses:
        "200":
          description: Per-entry outcomes, in request order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewBulkResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /review/stats:
    get:
      operationId: getReviewStats
      summary: Review and calibration statistics
      description: >
        Queue depth and auto-apply calibration: how many entries auto
        applied and how many of those were later reverted. The revert
        rate is the trust signal the review surface shows next to the
        auto-apply behavior; it is deliberately not the accuracy metric
        that tunes thresholds (reverts are sparse and lagging). The
        calibration counts take only what the matcher applied at its own
        threshold: an entry applied because its submission asked to take
        its best match (`UploadCreate.acceptBestMatch`) reads
        `auto-applied` but counts in neither `autoApplied` nor
        `revertedAutoApplied`. The counts cover the entries the caller
        can see, the scope of `GET /review/queue`: administrators count
        every entry, other callers only the entries their own uploads,
        acquisitions and rematches produced.
      tags: [review]
      responses:
        "200":
          description: Current statistics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewStats"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /libraries/{pid}/matching:
    parameters:
      - $ref: "#/components/parameters/Pid"
    get:
      operationId: getLibraryMatching
      summary: Read a library's matching behavior
      description: >
        The library's automatic matching behavior: the mode and the
        singles auto-apply switch.
      tags: [review]
      responses:
        "200":
          description: The stored behavior.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryMatching"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"
    put:
      operationId: setLibraryMatching
      summary: Set a library's matching behavior
      description: >
        `auto` lets confident matches apply themselves and queues the
        rest for review (the default), `review` queues everything (no
        auto-apply), and `off` never matches the library's content
        (as-is libraries: already-curated collections the engine must
        not touch). Under `auto`, one-file units still queue unless
        `singlesAutoApply` is on. A submission that asked to take its
        best match (`UploadCreate.acceptBestMatch`) may apply under
        `review` and as a one-file unit too, never under `off`. The body
        replaces the whole object. A podcast library takes no matching
        behavior, its episodes coming from their feeds, and is refused
        with `invalid-request`. Administrators only.
      tags: [review]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryMatching"
      responses:
        "200":
          description: The stored behavior.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryMatching"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

components:
  parameters:
    ReviewEntryId:
      name: entryId
      in: path
      required: true
      description: Review entry PID (e.g. `rv-01JZX5N8QW3F4V9T2B7KD3M9R6`).
      schema:
        type: string
        pattern: "^rv-[0-9A-HJKMNP-TV-Z]{26}$"
  schemas:
    ReviewEntry:
      type: object
      description: >
        One review queue entry: an album-sized unit of files awaiting
        or past a matching decision. The unit decides as a whole.
        `best` is absent when lookup produced no candidate.
      required: [id, kind, status, mediaType, origin, trackCount, createdAt, identifying]
      properties:
        id:
          type: string
          description: Entry pid.
          example: rv-01JZX5N8QW3F4V9T2B7KD3M9R6
        kind:
          type: string
          description: >
            What deciding does: `match` retags items already in the
            library; `import` additionally moves staged files (an
            upload or inbox batch) into the library. A string, not a
            closed enum.
          example: match
        status:
          type: string
          description: >
            Lifecycle state: `pending`, `applied`, `auto-applied`,
            `as-is`, `unofficial`, `skipped`, `discarded`, or
            `reverted`. A string, not a closed enum.
          example: pending
        mediaType:
          $ref: "#/components/schemas/MediaType"
        origin:
          type: string
          description: >
            Where the unit came from: `scan`, `upload`, `acquisition`,
            or `rematch`. A string, not a closed enum.
          example: scan
        title:
          type: string
          description: Display title for the unit (the album guess).
        artist:
          type: string
          description: Display artist for the unit.
        trackCount:
          type: integer
          description: Files in the unit.
        duplicateCount:
          type: integer
          default: 0
          description: >
            Files in the unit arriving with a duplicate warning (their
            tracks carry it). Absent when none.
        libraryPid:
          type: string
          description: The library the unit belongs (or will import) to.
        uploadedBy:
          type: string
          description: >
            The uploader's user pid, present on upload-origin entries.
        identifying:
          type: boolean
          description: >
            True while the identify pipeline still runs for this
            entry; candidates and the best summary fill in when it
            finishes (the entry invalidates over the event channel).
        best:
          $ref: "#/components/schemas/CandidateSummary"
        appliedMbid:
          type: string
          description: >
            The MusicBrainz release id an `applied` or `auto-applied`
            entry applied.
        createdAt:
          type: string
          format: date-time
          description: When the entry was created.
        decidedAt:
          type: string
          format: date-time
          description: When the entry was decided.
        decidedBy:
          type: string
          description: >
            The deciding user's pid; absent on `auto-applied` entries.

    CandidateSummary:
      type: object
      description: The ranked-best candidate in one line.
      required: [mbid, title, artist, similarityPct]
      properties:
        mbid:
          type: string
          description: MusicBrainz release id.
        title:
          type: string
          description: Release title.
        artist:
          type: string
          description: Release artist.
        year:
          type: integer
          description: Release year, 0 when unknown.
        similarityPct:
          type: number
          format: double
          description: Match quality in percent (0 to 100).

    ReviewEntryPage:
      type: object
      description: One page of review entries.
      required: [entries]
      properties:
        entries:
          type: array
          description: Entries, newest first.
          items:
            $ref: "#/components/schemas/ReviewEntry"
        nextCursor:
          type: string
          description: Cursor for the next page; omitted on the last.

    ReviewTrack:
      type: object
      description: One file in a review unit with its current metadata.
      required: [path, title, durationMs]
      properties:
        pid:
          type: string
          description: >
            The catalog item pid, type-prefixed like every pid on this
            API; absent for staged files that have not entered the
            library yet, and for a joined file whose item sits where the
            caller cannot see it.
        path:
          type: string
          description: >
            The file's name. Administrators get the full path of a file
            a scan or rematch entry names; an uploaded or downloaded
            file is named alone for everyone, before it lands and after.
        title:
          type: string
          description: Current title (tag, or cleaned filename).
        artist:
          type: string
          description: Current artist.
        trackNo:
          type: integer
          description: Current track number, 0 when untagged.
        discNo:
          type: integer
          description: Current disc number, 0 when untagged.
        durationMs:
          type: integer
          format: int64
          description: Audio length in milliseconds.
        duplicate:
          $ref: "#/components/schemas/DuplicateWarning"
        joined:
          type: boolean
          default: false
          description: >
            The file entered the library as a copy of, or a further
            part of, an item that already existed; that item's
            metadata and who may edit it were not touched.

    CandidateComponent:
      type: object
      description: >
        One named contribution to a candidate's distance, so the queue
        explains a score instead of asserting it.
      required: [name, distance, weight]
      properties:
        name:
          type: string
          description: >
            The field or penalty: `artist`, `album`, `year`,
            `tracks`, `missing`, `extra`. A string, not a closed
            enum.
        distance:
          type: number
          format: double
          description: Component distance in 0 to 1 (0 is identical).
        weight:
          type: number
          format: double
          description: The component's share of the total.

    CandidatePairing:
      type: object
      description: >
        One proposed file-to-release-track pairing; the side-by-side
        diff renders current values (via `trackIndex` into the entry's
        tracks) against these proposed values.
      required: [trackIndex, position, title, distance]
      properties:
        trackIndex:
          type: integer
          description: Index into the entry's `tracks`.
        position:
          type: integer
          description: Proposed track number on the release.
        disc:
          type: integer
          description: Proposed disc number.
        title:
          type: string
          description: Proposed title.
        artist:
          type: string
          description: >
            Proposed per-track artist, present when it differs from
            the release artist (compilations).
        durationMs:
          type: integer
          format: int64
          description: The release track's length, 0 when unknown.
        recordingMbid:
          type: string
          description: The MusicBrainz recording id this pairing maps to.
        distance:
          type: number
          format: double
          description: The pairing's own distance in 0 to 1 (0 is identical).

    ReviewCandidate:
      type: object
      description: One scored candidate release, ranked in the entry.
      required: [mbid, title, artist, similarityPct, pairings]
      properties:
        mbid:
          type: string
          description: MusicBrainz release id.
        releaseGroupMbid:
          type: string
          description: MusicBrainz release group id.
        title:
          type: string
          description: Release title.
        artist:
          type: string
          description: Release artist.
        year:
          type: integer
          description: Release year, 0 when unknown.
        mediaCount:
          type: integer
          description: Disc count, 0 when unknown.
        trackCount:
          type: integer
          description: Track count on the release.
        country:
          type: string
          description: Release country.
        label:
          type: string
          description: Label name.
        catalogNumber:
          type: string
          description: Label catalog number.
        compilation:
          type: boolean
          description: True for various-artists releases.
        similarityPct:
          type: number
          format: double
          description: Match quality in percent (0 to 100).
        components:
          type: array
          default: []
          description: The distance breakdown.
          items:
            $ref: "#/components/schemas/CandidateComponent"
        pairings:
          type: array
          description: Proposed track pairings.
          items:
            $ref: "#/components/schemas/CandidatePairing"
        missingTitles:
          type: array
          default: []
          description: >
            Titles of release tracks no file matched (the rip is
            missing them).
          items:
            type: string
        extraTrackIndexes:
          type: array
          default: []
          description: >
            Indexes (into the entry's `tracks`) of files no release
            track matched (bonus or junk files).
          items:
            type: integer

    ReviewEntryDetail:
      allOf:
        - $ref: "#/components/schemas/ReviewEntry"
        - type: object
          description: The full entry with tracks and candidates.
          required: [tracks, candidates]
          properties:
            tracks:
              type: array
              description: >
                The unit's files in order: the disc number they carry,
                then, for files uploaded in a batch, the folder each was
                sent from (see `UploadGrouping`), then track number. An
                audiobook acquired from a list holds its parts in the
                list's order.
              items:
                $ref: "#/components/schemas/ReviewTrack"
            candidates:
              type: array
              description: >
                Scored candidates, ranked best first. For a one-file
                unit, near-tied candidates are ordered by preference
                (header agreement, then a plain release over a
                compilation), so the list is not strictly sorted by
                `similarityPct` inside a tie band.
              items:
                $ref: "#/components/schemas/ReviewCandidate"
            identifyDeclined:
              type: boolean
              default: false
              description: >
                The submission asked not to be identified, so the
                entry never entered the match queue. Absent means it
                did. What it tells a reader is why `candidates` is
                empty: nothing was searched, rather than searched and
                found nothing.


                Such an entry is normally already `as-is` - declining
                imports the files without stopping. Finding one still
                `pending` means the automatic import could not proceed
                and it is waiting for a person.
            acceptBestWithheld:
              type: string
              enum: [below-floor, ambiguous, no-candidates]
              description: >
                Why an entry whose submission asked to accept its best
                match (`acceptBestMatch`) is waiting for review instead:
                `below-floor`, the top candidate is too far from the
                files, or its recording is titled as another cut of the
                song than they name (a live take, a demo, a clean edit,
                a bonus track, album version, explicit or original mix
                note only one of them carries, or a title one of them
                only continues, such as "Part II" or "(Take 2)");
                `ambiguous`, another recording the search found
                (a candidate, or a recording it listed without fetching
                its releases) is within the margin of it, or the
                candidates cannot rule one out (the files or the top
                name no artist to compare, another track of the top's
                release carries the same title at about the same
                length, the top names no recording beside other
                candidates, a recording search
                listed more releases than it fetched, all of one
                recording, or it counted more recordings than it listed
                and either the last it listed matched as well as the
                top's recording or the top's recording was not among
                those listed);
                `no-candidates`, nothing was found. Present only on a
                pending entry whose last identification did not apply a
                match for one of those reasons. Absent
                otherwise: for a submission that did not ask, while
                identifying, for an entry held back by a typed search, a
                possible duplicate or the library's matching mode, and
                once the entry is decided.
            mediumFixed:
              type: boolean
              default: false
              description: >
                True once any of the unit's files has entered the
                library, or was already in it: a decide naming a
                `mediaType` other than the entry's own is then refused
                with `conflict`. Absent while every file is staged.
            identifyOverride:
              allOf:
                - $ref: "#/components/schemas/ReviewIdentifyRequest"
              description: >
                What the last re-identify searched for in place of the
                files' own tags. Absent when nothing was typed. The
                `tracks` below always report the tags the files carry,
                never this.
            suggested:
              allOf:
                - $ref: "#/components/schemas/ReviewIdentifyRequest"
              description: >
                What the matching parse read out of the file's own
                title and artist, offered as a starting point for a
                search rather than as a claim about the files, and what
                `useSuggested` files the tracks under: upload and
                remaster notes dropped, a mark of another cut (a clean
                edit, 8D audio, a live take) kept. Present only on
                music acquisitions of a single file, whose title is
                usually a video title and whose artist a channel (as
                `createAcquisition` says the fetch writes them); an
                album-shaped unit carries real tags and needs no guess.
                An artist and a title, never an album: a download that
                has one (an Art Track's, from its description) already
                carries it in its tags. A stored `identifyOverride`
                supersedes it as a search's starting point.
      description: One review entry with its full evidence.

    ReviewIdentifyRequest:
      type: object
      description: >
        Values to search for in place of what an entry's files claim.
        Every field is optional and blank fields are dropped; a body
        with nothing in it clears a stored override.
      properties:
        artist:
          type: string
          maxLength: 300
          description: >
            Stands in for both the artist and the album artist while
            searching.
        album:
          type: string
          maxLength: 300
          description: The album title to search for.
        title:
          type: string
          maxLength: 300
          description: >
            The track title to search for. The search asks for the
            song alone, as for a title read off the files: upload
            notes, cut marks and what names a particular recording
            ("(Official Video)", "(Clean)", "(Live)", " - Radio
            Edit") are left out of what is looked up and used to pick
            among the recordings found; the stored override keeps it
            as typed. Ignored on a unit of several files: a track
            title belongs to one track, and naming them all the same
            thing would wreck the pairing that scores a release.
            Correct a multi-file unit with `artist` and `album`,
            which are properties of the unit.

    ReviewDecision:
      type: object
      description: A decision for one review entry.
      required: [action]
      properties:
        action:
          type: string
          enum: [approve, as-is, unofficial, skip, discard]
          description: The decision to apply.
        candidateMbid:
          type: string
          description: >
            The candidate to approve; the ranked best when absent.
            Only meaningful with `approve`.
        mediaType:
          allOf:
            - $ref: "#/components/schemas/UploadMediaType"
          description: >
            The medium the unit is imported as; the entry's own
            `mediaType` when absent. The choice becomes the entry's own
            medium, so a later decide or retry without the field imports
            as it. Refused with `invalid-request` when `approve` would
            import as `audiobook`, named here or the entry's own (a
            MusicBrainz release is music), when the entry's target
            library does not accept the medium, and when the entry
            stages no files (a `scan` or `rematch` entry, whose items
            are already in the library: changing their kind is the
            kind-change call's job) and the value differs from the
            entry's own. Once any of the entry's files has entered the
            library or was already in it (`mediumFixed` on the entry), a
            decide naming a different medium is refused with `conflict`;
            naming the entry's own is not. Where two
            refusals apply, an already decided entry answers `conflict`
            as every decide does, and otherwise these `invalid-request`
            refusals come before the `conflict` over imported files.
            `skip` and `discard` import nothing and ignore it.
        useSuggested:
          type: boolean
          description: >
            With `as-is` or `unofficial`, on an import as music: once
            the files are in the library, write the artist and title the
            entry offers as `suggested` onto its tracks, in the catalog
            and the files, exactly the values `suggested` shows and only
            those it holds (an empty suggested artist leaves each
            track's artist as it is), as the deciding person's own edit,
            the way a metadata edit is: a locked field keeps its value
            and `warnings` names the file. Only what differs is written:
            a track's artist stays as it is when it already credits the
            suggested one (as its whole artist, one of the names it
            joins with commas, or one of its artist credits, compared
            ignoring case, accents and punctuation), so a suggestion
            never drops a co-artist, and a title already reading the
            suggested one is left alone. A file keeps the place its
            delivered tags gave it until it is organized.
            Refused with `invalid-request` on an entry that offers no
            suggestion; an already decided entry answers `conflict`
            first, as every decide does, and the `invalid-request`
            refusals come after it. A track whose file joined an item
            the library already holds keeps that item's metadata. Every
            other action, and a decide importing the unit as
            `audiobook`, ignores it (and so does not refuse it); absent
            or false files the tracks under the tags they carry.

    ReviewDecideResult:
      type: object
      description: The outcome of a single-entry decision.
      required: [entry]
      properties:
        entry:
          $ref: "#/components/schemas/ReviewEntry"
        warnings:
          type: array
          default: []
          description: >
            Non-fatal problems (per-file write-back failures, roles
            without a tag form). The decision itself stood.
          items:
            type: string

    ReviewBulkDecision:
      type: object
      description: One decision applied to many entries.
      required: [entryIds, action]
      properties:
        entryIds:
          type: array
          minItems: 1
          maxItems: 200
          description: The entries to decide.
          items:
            type: string
        action:
          type: string
          enum: [approve, as-is, unofficial, skip, discard]
          description: >
            The decision. `approve` uses each entry's ranked best
            candidate, and fetches covers as the single-entry
            `approve` does, within one time bound on cover fetches
            shared by every entry in the call: an entry it did not reach
            keeps its cover and, left with none or a download's
            thumbnail, carries the warning.

    ReviewBulkResult:
      type: object
      description: Per-entry outcomes of a bulk decision.
      required: [results]
      properties:
        results:
          type: array
          description: One outcome per requested entry, in order.
          items:
            $ref: "#/components/schemas/ReviewBulkOutcome"

    ReviewBulkOutcome:
      type: object
      description: One entry's outcome in a bulk decision.
      required: [entryId, ok]
      properties:
        entryId:
          type: string
          description: The entry.
        ok:
          type: boolean
          description: Whether the decision applied.
        code:
          type: string
          description: >
            The error code the single-entry decide would have answered
            (`not-found`, `conflict`, `catalog-busy`, `read-only`, ...),
            when `ok` is false. `catalog-busy` clears on its own, so
            those entries can be sent again.
        error:
          type: string
          description: Why it did not, when `ok` is false.
        warnings:
          type: array
          default: []
          description: >
            What the single-entry decide reports under `warnings`, when
            `ok` is true: the decision stood, with these problems.
          items:
            type: string

    ReviewStats:
      type: object
      description: Queue depth and auto-apply calibration.
      required: [pending, decided, applied, autoApplied, reverted, revertedAutoApplied]
      properties:
        pending:
          type: integer
          description: Entries awaiting a decision.
        decided:
          type: integer
          description: >
            Entries in every status but `pending`, discarded and
            reverted ones included: the size of the `status=decided`
            listing.
        identifying:
          type: integer
          default: 0
          description: Entries whose identify pipeline still runs.
        applied:
          type: integer
          description: Entries a person approved.
        autoApplied:
          type: integer
          description: >
            Entries the engine applied on its own at its own threshold.
            An entry applied because its submission asked to take its
            best match reads `auto-applied` but is not counted here.
        asIs:
          type: integer
          default: 0
          description: Entries accepted as they were.
        unofficial:
          type: integer
          default: 0
          description: Entries marked as having no canonical release.
        skipped:
          type: integer
          default: 0
          description: Entries dismissed without action.
        reverted:
          type: integer
          description: Applied entries later reverted, total.
        revertedAutoApplied:
          type: integer
          description: >
            Auto-applied entries later reverted; with `autoApplied` this
            is the observed auto-apply revert rate, the trust signal the
            queue surfaces. An entry applied because its submission
            asked to take its best match counts in neither.

    LibraryMatching:
      type: object
      description: >
        A library's automatic matching behavior. The PUT replaces the
        whole object, so writes carry every field.
      required: [mode, singlesAutoApply]
      properties:
        mode:
          type: string
          # "off" is quoted deliberately: YAML 1.1 parsers read a bare off
          # as boolean false, which silently became a "false" wire value
          # once already.
          enum: [auto, review, "off"]
          description: The matching mode.
        singlesAutoApply:
          type: boolean
          description: >
            Whether a confident match for a one-file unit may apply
            itself under mode `auto`. Off by default: a lone track
            picking among near-tied releases is a wrong-release risk,
            so singles queue for review, unless their submission asked
            to take its best match (`UploadCreate.acceptBestMatch`).
            When on, singles auto-apply only at a stricter confidence
            than albums.
