# WaxDeck API contract fragment; assembled into api/openapi.yaml by `make generate`.
paths:
  /books/{pid}:
    get:
      operationId: getBook
      summary: Get one audiobook's detail
      description: >
        Full audiobook detail: contributors, series membership, chapters
        on the book timeline, backing parts in reading order, and the
        calling user's per-book playback settings. Positions everywhere
        on this surface are book-timeline milliseconds spanning all
        parts.
      tags: [books]
      parameters:
        - $ref: "#/components/parameters/Pid"
      responses:
        "200":
          description: The book.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookDetail"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /books/series:
    get:
      operationId: listBookSeries
      summary: List audiobook series
      description: >
        The series the visible audiobooks belong to, in collation order.
        A series is a name a book's tags carry rather than an entity
        anyone curates, so what it names is a spelling: this listing
        both offers the target of a series merge, when a spelling split
        one in two, and backs the series index a client browses.


        Filtered by library visibility, so a series held only in
        libraries this account cannot see is absent.
      tags: [books]
      parameters:
        - name: cursor
          in: query
          description: >
            Opaque keyset cursor from a previous page's `nextCursor`.
            Omit for the first page.
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum series per page.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: One page of series.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookSeriesPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /books/{pid}/resume:
    get:
      operationId: getBookResume
      summary: Where the caller left off in a book
      description: >
        The calling user's resume point on the book timeline, with the
        chapter that position falls in (when the book has chapters).
        This is the cross-device resume answer: the position reflects
        the newest checkpoint from any device after the server's
        per-medium reconciliation.
      tags: [books]
      parameters:
        - $ref: "#/components/parameters/Pid"
      responses:
        "200":
          description: The caller's resume point.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookResume"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /books/{pid}/settings:
    put:
      operationId: putBookSettings
      summary: Replace the caller's playback settings for a book
      description: >
        Full replace of the calling user's per-book playback settings
        (speed memory, voice boost, silence trimming). Absent fields
        reset to their defaults, so clients send the complete object.
      tags: [books]
      parameters:
        - $ref: "#/components/parameters/Pid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookSettings"
      responses:
        "200":
          description: The stored settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookSettings"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /books/{pid}/bookmarks:
    get:
      operationId: listBookmarks
      summary: List the caller's bookmarks in a book
      description: >
        The calling user's bookmarks for one book, ordered by position on
        the book timeline. Bookmarks are places a listener marked on
        purpose, which is a different thing from the resume point: a book
        has one resume position and any number of bookmarks, and nothing
        here moves as playback does. The whole set comes back in one
        answer - a book holds a handful of these, not a catalog - so
        there is no cursor.
      tags: [books]
      parameters:
        - $ref: "#/components/parameters/Pid"
      responses:
        "200":
          description: The caller's bookmarks in this book.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookmarkList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"
    post:
      operationId: createBookmark
      summary: Mark a place in a book
      description: >
        Records a bookmark at a book-timeline position, with an optional
        note. Positions past the book's own duration are rejected. A
        book holds at most 200 bookmarks per user; the request is
        refused rather than silently evicting the oldest, because what
        would be dropped is something the listener wrote.
      tags: [books]
      parameters:
        - $ref: "#/components/parameters/Pid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookmarkCreate"
      responses:
        "201":
          description: The stored bookmark.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bookmark"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /books/{pid}/bookmarks/{bookmarkId}:
    delete:
      operationId: deleteBookmark
      summary: Remove one bookmark
      description: >
        Deletes one of the caller's bookmarks. Deleting a bookmark that
        is already gone answers 204: the outcome the caller asked for
        holds either way, and an offline client replaying its queue must
        not stall on one it already removed.
      tags: [books]
      parameters:
        - $ref: "#/components/parameters/Pid"
        - name: bookmarkId
          in: path
          required: true
          description: The bookmark's PID.
          schema:
            type: string
            example: bm-01JZX5N8QW3F4V9T2B7KD3M9R6
      responses:
        "204":
          description: Bookmark removed.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

  /series/{pid}:
    get:
      operationId: getBookSeries
      summary: Get one audiobook series
      description: >
        One series and the books in it, in sequence order. The sequence
        is what a book's tags say rather than a number anyone assigned,
        so it is a string and can be absent: a book tagged with the
        series name and no number sorts among the ones that carry one,
        where the catalog puts it.


        Counts are answered only to an account that can see every
        library, exactly as the listing answers them: a series with one
        visible book and nine hidden ones must not advertise ten.


        404 when no series carries the pid, and when every book in it
        lives in a library this account was not granted.


        A top-level path rather than one under `/books/series`, which
        lists them: a series is a shared entity with a pid of its own,
        read the way `/albums/{pid}` is read.
      tags: [books]
      parameters:
        - $ref: "#/components/parameters/Pid"
      responses:
        "200":
          description: The series and its books.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookSeriesDetail"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/CatalogMaintenance"

components:
  schemas:
    BookSeriesPage:
      type: object
      description: One keyset page of audiobook series.
      required: [series]
      properties:
        series:
          type: array
          description: Series in collation order.
          items:
            $ref: "#/components/schemas/BookSeries"
        nextCursor:
          type: string
          description: Cursor for the next page; absent on the last one.

    BookSeries:
      type: object
      description: One audiobook series.
      required: [pid, name]
      properties:
        pid:
          type: string
          description: Series PID.
          example: sr-01JZX5N8QW3F4V9T2B7KD3M9R6
        name:
          type: string
          description: The series name, as the books' tags spell it.
        bookCount:
          type: integer
          description: Books in the series that this account can see.
        totalDurationMs:
          type: integer
          format: int64
          description: Their combined running time.

    BookSeriesDetail:
      type: object
      description: One audiobook series and the books in it.
      required: [pid, name, books]
      properties:
        pid:
          type: string
          description: Series PID.
          example: sr-01JZX5N8QW3F4V9T2B7KD3M9R6
        name:
          type: string
          description: The series name, as the books' tags spell it.
        bookCount:
          type: integer
          description: >
            Books in the series, answered only to an account that can
            see every library. A restricted account reads the length of
            `books` instead, which is what it can open.
        totalDurationMs:
          type: integer
          format: int64
          description: >
            Their combined running time, on `bookCount`'s terms.
        books:
          type: array
          description: >
            The books this account can open, in the catalog's sequence
            order.
          items:
            $ref: "#/components/schemas/BookSeriesEntry"

    BookSeriesEntry:
      type: object
      description: One book's place in a series.
      required: [book]
      properties:
        sequence:
          type: string
          description: >
            What the book's tags call its place in the series ("2",
            "1.5", "II"). A string because that is what a tag holds,
            and absent when the tags name the series without a number.
          example: "2"
        book:
          $ref: "#/components/schemas/ItemSummary"

    Bookmark:
      type: object
      description: One place a listener marked in a book.
      required: [id, positionMs, createdAt]
      properties:
        id:
          type: string
          description: Bookmark PID.
          example: bm-01JZX5N8QW3F4V9T2B7KD3M9R6
        positionMs:
          type: integer
          format: int64
          description: Book-timeline position in milliseconds.
        note:
          type: string
          description: The listener's note, when they wrote one.
        createdAt:
          type: string
          format: date-time
          description: When the bookmark was made.

    BookmarkList:
      type: object
      description: The caller's bookmarks in one book.
      required: [bookmarks]
      properties:
        bookmarks:
          type: array
          description: Bookmarks ordered by `positionMs`, earliest first.
          items:
            $ref: "#/components/schemas/Bookmark"

    BookmarkCreate:
      type: object
      description: A new bookmark on the book timeline.
      required: [positionMs]
      properties:
        positionMs:
          type: integer
          format: int64
          minimum: 0
          description: Book-timeline position in milliseconds.
        note:
          type: string
          maxLength: 500
          description: An optional note.

    BookPart:
      type: object
      description: >
        One backing file of an audiobook, in reading order. `index` is
        the join key across the whole surface: it matches play-info's
        `partIndex`, the skip-map `partIndex`, and the same position in
        download-info's `files` array.
      required: [index, startMs, durationMs]
      properties:
        index:
          type: integer
          description: Zero-based reading-order position.
        startMs:
          type: integer
          format: int64
          description: Book-timeline millisecond offset where this part begins.
        durationMs:
          type: integer
          format: int64
          description: Part duration in milliseconds.
        displayName:
          type: string
          description: Human-readable part name (the file's base name).

    BookSettings:
      type: object
      description: >
        The calling user's per-book playback settings. All fields are
        optional; an absent field means the server default. `PUT`
        replaces the whole object.
      properties:
        speed:
          type: number
          format: double
          minimum: 0.5
          maximum: 3.5
          description: Playback speed memory for this book.
        voiceBoost:
          type: boolean
          description: Apply spoken-word loudness normalization for this book.
        trimSilence:
          type: boolean
          description: Trim mapped silence spans when playing this book.

    BookDetail:
      type: object
      description: >
        Full audiobook detail. All positions are book-timeline
        milliseconds spanning every part.
      required: [pid, title, durationMs, authors, narrators, chapters, parts]
      properties:
        pid:
          type: string
          description: Book PID.
          example: bk-01JZX5N8QW3F4V9T2B7KD3M9R6
        title:
          type: string
          description: Book title.
        subtitle:
          type: string
          description: Subtitle, when known.
        artSource:
          allOf:
            - $ref: "#/components/schemas/ArtSource"
          description: >
            Where the cover this book answers came from, for the mark
            under it. Absent when the book has no artwork, or when the
            answering image carries no attribution.
        authors:
          type: array
          description: Author display names, in credit order.
          items:
            type: string
        narrators:
          type: array
          description: Narrator display names, in credit order.
          items:
            type: string
        series:
          type: string
          description: Series name, when the book belongs to one.
        seriesPid:
          type: string
          description: >
            The series entity behind `series`, so a caller can name it
            to a merge. Absent when the book belongs to none.
          example: sr-01JZX5N8QW3F4V9T2B7KD3M9R6
        seriesSequence:
          type: string
          description: >
            Position within the series, as the source states it
            (decimals like `1.5` are preserved).
        publisher:
          type: string
          description: Publisher, when known.
        asin:
          type: string
          description: Audible ASIN, when known.
        isbn:
          type: string
          description: ISBN, when known.
        edition:
          type: string
          description: Edition label, when known.
        abridged:
          type: boolean
          description: Whether this edition is abridged, when known.
        descriptionHtml:
          type: string
          description: >
            Book description as sanitized HTML (server-side allowlist;
            safe to render directly).
        durationMs:
          type: integer
          format: int64
          description: Total duration across all parts, in milliseconds.
        artUrl:
          type: string
          description: Origin-relative URL of the book's artwork endpoint.
        chapters:
          type: array
          description: Chapters on the book timeline, ordered by `startMs`.
          items:
            $ref: "#/components/schemas/ChapterMark"
        parts:
          type: array
          minItems: 1
          description: Backing files in reading order.
          items:
            $ref: "#/components/schemas/BookPart"
        settings:
          $ref: "#/components/schemas/BookSettings"

    BookResume:
      type: object
      description: The calling user's resume point in one book.
      required: [positionMs]
      properties:
        positionMs:
          type: integer
          format: int64
          description: Book-timeline resume position in milliseconds.
        chapter:
          $ref: "#/components/schemas/ChapterMark"
        updatedAt:
          type: string
          format: date-time
          description: When this position was last written.
